<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="cpp-03-factorial-stack-title cpp-03-factorial-stack-desc">
  <title id="cpp-03-factorial-stack-title">factorial(4) — 내려가며 부르고, 올라오며 곱한다</title>
  <desc id="cpp-03-factorial-stack-desc">factorial(4)가 factorial(3), factorial(2), factorial(1)을 차례로 호출하며 내려가고, 기저 조건 factorial(1)이 1을 돌려준 뒤 2, 6, 24를 차례로 돌려주며 올라오는 호출 그림</desc>
  <defs>
    <marker id="cpp-03-factorial-stack-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-03-factorial-stack-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-03-factorial-stack-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="500" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">03 · 재귀</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">factorial(4) — 내려가며 부르고, 올라오며 곱한다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <path d="M200 160 L200 196" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-03-factorial-stack-m)"/><path d="M200 236 L200 272" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-03-factorial-stack-m)"/><path d="M200 312 L200 348" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-03-factorial-stack-m)"/><path d="M456 196 L456 160" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-03-factorial-stack-a)"/><path d="M456 272 L456 236" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-03-factorial-stack-a)"/><path d="M456 348 L456 312" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-03-factorial-stack-a)"/><rect x="96" y="120" width="208" height="40" rx="6" fill="#f7f6f2"/><rect x="96" y="120" width="208" height="40" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="200" y="145" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">factorial(4)</text><rect x="352" y="120" width="208" height="40" rx="6" fill="#f7f6f2"/><rect x="352" y="120" width="208" height="40" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="456" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">4 * factorial(3)</text><text x="600" y="146" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#a8431f">→ 24</text><rect x="96" y="196" width="208" height="40" rx="6" fill="#f7f6f2"/><rect x="96" y="196" width="208" height="40" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="200" y="221" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">factorial(3)</text><rect x="352" y="196" width="208" height="40" rx="6" fill="#f7f6f2"/><rect x="352" y="196" width="208" height="40" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="456" y="220" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">3 * factorial(2)</text><text x="600" y="222" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#a8431f">→ 6</text><rect x="96" y="272" width="208" height="40" rx="6" fill="#f7f6f2"/><rect x="96" y="272" width="208" height="40" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="200" y="297" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">factorial(2)</text><rect x="352" y="272" width="208" height="40" rx="6" fill="#f7f6f2"/><rect x="352" y="272" width="208" height="40" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="456" y="296" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">2 * factorial(1)</text><text x="600" y="298" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#a8431f">→ 2</text><rect x="96" y="348" width="208" height="40" rx="6" fill="#f7f6f2"/><rect x="96" y="348" width="208" height="40" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><text x="200" y="373" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#f7f6f2" text-anchor="middle">factorial(1)</text><rect x="352" y="348" width="208" height="40" rx="6" fill="#f7f6f2"/><rect x="352" y="348" width="208" height="40" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><text x="456" y="372" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#f7f6f2" text-anchor="middle">x &lt;= 1 → return 1</text><text x="600" y="374" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#a8431f">→ 1</text><text x="32" y="428" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">기저 조건이 없으면 끝없이 내려가다 스택이 넘친다(stack overflow).</text>
  <line x1="32" y1="452" x2="688" y2="452" stroke="#b9b6ac"/><path d="M32 474 H60" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-03-factorial-stack-m)"/><text x="68" y="479" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">호출</text><path d="M120 474 H148" stroke="#a8431f" stroke-width="1.8" marker-end="url(#cpp-03-factorial-stack-a)"/><text x="156" y="479" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">반환 값</text><rect x="227.84" y="466" width="20" height="16" rx="3" fill="#1d1d1a"/><text x="259.84000000000003" y="479" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">기저 조건</text>
</svg>
