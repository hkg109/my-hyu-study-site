<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 716" role="img" aria-labelledby="lm2-l05a-fs-structure-title lm2-l05a-fs-structure-desc">
  <title id="lm2-l05a-fs-structure-title">ext 파일 시스템의 물리 구조</title>
  <desc id="lm2-l05a-fs-structure-desc">맨 위 띠는 파티션 전체로 부트 블록 뒤에 블록 그룹 0, 1, …, n이 이어진다. 블록 그룹 0을 확대하면 슈퍼 블록, 그룹 디스크립터, 블록 비트맵, 아이노드 비트맵, 아이노드 테이블, 데이터 블록 순서다. 슈퍼 블록은 파일 시스템 전체 정보와 백업 사본, 비트맵은 사용 여부, 아이노드는 파일 하나의 정보(이름 제외)를 담는다. 아래 흐름은 디렉터리 엔트리의 이름 a.txt가 아이노드 번호로, 아이노드가 데이터 블록으로 이어지는 순서를 보여 준다.</desc>
  <defs><marker id="lm2-l05a-fs-structure-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l05a-fs-structure-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l05a-fs-structure-a)}.flow.both{marker-start:url(#lm2-l05a-fs-structure-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l05a-fs-structure-m)}.dash.both{marker-start:url(#lm2-l05a-fs-structure-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="716"/>
  <text class="tag" x="24" y="40">리눅스마스터 2급 · 2과목 1장</text><text class="title" x="24" y="74">ext 파일 시스템의 물리 구조</text><text class="subtitle" x="24" y="104">디스크 전체 → 블록 그룹 하나 → 파일 하나 찾아가기</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="lab" x="24" y="156">① 파티션 전체</text><rect class="deep" x="24" y="168" width="92" height="44" rx="2"/><text class="lab" x="70" y="196" text-anchor="middle">부트 블록</text><rect class="zone" x="116" y="168" width="140" height="44" rx="2"/><text class="lab" x="186" y="196" text-anchor="middle">블록 그룹 0</text><rect class="node" x="256" y="168" width="140" height="44" rx="2"/><text class="lab" x="326" y="196" text-anchor="middle">블록 그룹 1</text><rect class="node" x="396" y="168" width="56" height="44" rx="2"/><text class="lab" x="424" y="196" text-anchor="middle">…</text><rect class="node" x="452" y="168" width="84" height="44" rx="2"/><text class="lab" x="494" y="196" text-anchor="middle">그룹 n</text><path class="org" d="M116 212 L24 272"/><path class="org" d="M256 212 L536 272"/><text class="lab" x="60" y="262">② 블록 그룹 0을 펼치면</text><rect class="focal" x="24" y="272" width="56" height="56" rx="2"/><text class="lab inv" x="52" y="296" text-anchor="middle">슈퍼</text><text class="small inv" x="52" y="316" text-anchor="middle">블록</text><rect class="deep" x="80" y="272" width="92" height="56" rx="2"/><text class="lab" x="126" y="296" text-anchor="middle">그룹</text><text class="small" x="126" y="316" text-anchor="middle">디스크립터</text><rect class="node" x="172" y="272" width="60" height="56" rx="2"/><text class="lab" x="202" y="296" text-anchor="middle">블록</text><text class="small" x="202" y="316" text-anchor="middle">비트맵</text><rect class="node" x="232" y="272" width="72" height="56" rx="2"/><text class="lab" x="268" y="296" text-anchor="middle">아이노드</text><text class="small" x="268" y="316" text-anchor="middle">비트맵</text><rect class="zone" x="304" y="272" width="84" height="56" rx="2"/><text class="lab" x="346" y="296" text-anchor="middle">아이노드</text><text class="small" x="346" y="316" text-anchor="middle">테이블</text><rect class="node" x="388" y="272" width="148" height="56" rx="2"/><text class="lab" x="462" y="306" text-anchor="middle">데이터 블록</text><text class="lab" x="24" y="356">슈퍼 블록</text><text class="task" x="112" y="356">파일 시스템 전체 정보 — 블록 크기, 전체·빈 블록·아이노드 수,</text><text class="task" x="112" y="376">마운트 횟수 (여러 그룹에 백업 사본)</text><text class="lab" x="24" y="406">비트맵</text><text class="task" x="112" y="406">블록·아이노드가 쓰이는지 1비트씩 표시</text><text class="lab" x="24" y="436">아이노드</text><text class="task" x="112" y="436">파일 하나의 정보 — 종류·권한, 소유자, 크기, 시간, 링크 수,</text><text class="task" x="112" y="456">블록 주소 (이름 없음)</text><line class="rule" x1="24" y1="492" x2="536" y2="492"/><text class="lab" x="24" y="522">③ /home/kim/a.txt 를 읽을 때</text><rect class="node" x="24" y="538" width="150" height="60" rx="6"/><text class="lab" x="99" y="563" text-anchor="middle">디렉터리 엔트리</text><text class="task" x="99" y="585" text-anchor="middle">a.txt → 1729015</text><path class="flow" d="M174 568 H205"/><rect class="focal" x="205" y="538" width="150" height="60" rx="6"/><text class="lab inv" x="280" y="563" text-anchor="middle">아이노드 1729015</text><text class="small inv" x="280" y="585" text-anchor="middle">권한·소유자 확인</text><path class="flow" d="M355 568 H386"/><rect class="zone" x="386" y="538" width="150" height="60" rx="6"/><text class="lab" x="461" y="563" text-anchor="middle">데이터 블록</text><text class="task" x="461" y="585" text-anchor="middle">실제 내용</text><text class="small" x="24" y="628">이름은 디렉터리에만 있다 → 하드 링크 = 같은 번호의 이름 하나 더</text><rect class="focal" x="24" y="654" width="22" height="16" rx="3"/><text class="small" x="54" y="667">핵심 메타데이터</text><rect class="zone" x="170.82" y="654" width="22" height="16" rx="3"/><text class="small" x="200.82" y="667">아이노드 테이블 · 데이터</text><rect class="deep" x="24" y="680" width="22" height="16" rx="3"/><text class="small" x="54" y="693">부트 블록 · 디스크립터</text>
</svg>
