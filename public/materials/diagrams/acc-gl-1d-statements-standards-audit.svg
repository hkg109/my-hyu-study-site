<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1119" role="img" aria-labelledby="acc-gl-1d-statements-standards-audit-title acc-gl-1d-statements-standards-audit-desc">
  <title id="acc-gl-1d-statements-standards-audit-title">재무제표 · 회계기준 · 회계감사</title>
  <desc id="acc-gl-1d-statements-standards-audit-desc">회계기준은 대상에 따라 한국채택국제회계기준, 일반기업회계기준, 중소기업회계기준으로 나뉘며 재무제표 작성지침이 된다. 재무제표 네 가지는 외부감사인인 공인회계사의 감사를 받고, 감사의견이 외부 이용자에게 전달된다. 아래 표는 왜곡표시와 감사증거 불충분의 영향이 전반적인지에 따라 한정의견, 부적정의견, 의견거절로 나뉘는 자료 1-6이다.</desc>
  <defs><marker id="acc-gl-1d-statements-standards-audit-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-1d-statements-standards-audit-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-1d-statements-standards-audit-a)}.flow.both{marker-start:url(#acc-gl-1d-statements-standards-audit-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-1d-statements-standards-audit-m)}.dash.both{marker-start:url(#acc-gl-1d-statements-standards-audit-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1119"/>
  <text class="tag" x="24" y="40">1장 · 1-4 재무제표, 회계기준과 회계감사</text><text class="title" x="24" y="74">재무제표 · 회계기준 · 회계감사</text><text class="subtitle" x="24" y="104">자료 1-5 · 1-6 · 기준에 따라 작성하고, 감사인이</text><text class="subtitle" x="24" y="124">기준 준수 여부를 확인해 의견을 표명한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="24" y="174" width="512" height="196" rx="6"/><text class="small" x="36" y="194">회계기준 = 재무제표 작성지침 (대상별로 다름)</text><rect class="node" x="40" y="204" width="204" height="40" rx="6"/><text class="body" x="142.0" y="228.5" text-anchor="middle">상장기업 · 금융회사</text><rect class="deep" x="316" y="204" width="204" height="40" rx="6"/><text class="body" x="418.0" y="228.5" text-anchor="middle">한국채택국제회계기준</text><path class="flow" d="M244 224 L316 224"/><rect class="mask" x="257.5" y="213" width="41.0" height="22" rx="4"/><text class="lab" x="278" y="229" text-anchor="middle">적용</text><rect class="node" x="40" y="252" width="204" height="40" rx="6"/><text class="body" x="142.0" y="276.5" text-anchor="middle">외부감사 대상 비상장기업</text><rect class="deep" x="316" y="252" width="204" height="40" rx="6"/><text class="body" x="418.0" y="276.5" text-anchor="middle">일반기업회계기준</text><path class="flow" d="M244 272 L316 272"/><rect class="mask" x="257.5" y="261" width="41.0" height="22" rx="4"/><text class="lab" x="278" y="277" text-anchor="middle">적용</text><rect class="node" x="40" y="300" width="204" height="40" rx="6"/><text class="body" x="142.0" y="324.5" text-anchor="middle">중소기업</text><rect class="deep" x="316" y="300" width="204" height="40" rx="6"/><text class="body" x="418.0" y="324.5" text-anchor="middle">중소기업회계기준</text><path class="flow" d="M244 320 L316 320"/><rect class="mask" x="257.5" y="309" width="41.0" height="22" rx="4"/><text class="lab" x="278" y="325" text-anchor="middle">적용</text><text class="small" x="280" y="360" text-anchor="middle">비상장·중소기업도 K-IFRS 선택 가능</text><rect class="focal" x="64" y="426" width="432" height="130" rx="6"/><text class="small inv" x="280.0" y="464.0" text-anchor="middle">Financial statements · 한 회계기간의 성적표</text><text class="name inv" x="280.0" y="483.0" text-anchor="middle">재무제표 4가지</text><text class="body inv" x="280.0" y="506.0" text-anchor="middle">재무상태표 · 포괄손익계산서</text><text class="body inv" x="280.0" y="527.0" text-anchor="middle">현금흐름표 · 자본변동표</text><path class="flow" d="M280 370 L280 426"/><rect class="mask" x="221.7" y="387" width="116.6" height="22" rx="4"/><text class="lab" x="280" y="403" text-anchor="middle">기준에 따라 작성</text><rect class="outside" x="64" y="616" width="432" height="84" rx="6"/><text class="small" x="280.0" y="641.5" text-anchor="middle">외부감사인 · 공인회계사(CPA)</text><text class="name" x="280.0" y="660.5" text-anchor="middle">회계감사 (audit)</text><text class="body" x="280.0" y="683.5" text-anchor="middle">중요한 왜곡표시 없음 → 합리적 확신</text><path class="dash" d="M280 556 L280 616"/><rect class="mask" x="191.5" y="575" width="177.1" height="22" rx="4"/><text class="lab" x="280" y="591" text-anchor="middle">일정 규모 이상 → 감사 대상</text><path class="flow" d="M280 700 L280 754"/><rect class="mask" x="230.5" y="716" width="99.0" height="22" rx="4"/><text class="lab" x="280" y="732" text-anchor="middle">감사의견 표명</text><rect class="node" x="24" y="754" width="512" height="58" rx="6"/><text class="name" x="280.0" y="776.0" text-anchor="middle">적정의견</text><text class="body" x="280.0" y="799.0" text-anchor="middle">기준대로 작성 · 중요한 왜곡표시 없음</text><text class="small" x="24" y="840" text-anchor="start">변형된 의견 (자료 1-6) · 영향의 전반성에 대한 감사인 판단</text><rect class="zone" x="24" y="854" width="176" height="64" rx="6"/><text class="small" x="112.0" y="891.5" text-anchor="middle">사항의 성격 ↓</text><rect class="zone" x="208" y="854" width="160" height="64" rx="6"/><text class="small" x="288.0" y="882.0" text-anchor="middle">중요하지만</text><text class="small" x="288.0" y="901.0" text-anchor="middle">전반적이지 않음</text><rect class="zone" x="376" y="854" width="160" height="64" rx="6"/><text class="small" x="456.0" y="882.0" text-anchor="middle">중요하며 동시에</text><text class="small" x="456.0" y="901.0" text-anchor="middle">전반적</text><rect class="node" x="24" y="926" width="176" height="64" rx="6"/><text class="body" x="112.0" y="952.0" text-anchor="middle">재무제표가 중요하게</text><text class="body" x="112.0" y="973.0" text-anchor="middle">왜곡표시됨</text><rect class="deep" x="208" y="926" width="160" height="64" rx="6"/><text class="name" x="288.0" y="961.5" text-anchor="middle">한정의견</text><rect class="focal" x="376" y="926" width="160" height="64" rx="6"/><text class="name inv" x="456.0" y="961.5" text-anchor="middle">부적정의견</text><rect class="node" x="24" y="998" width="176" height="64" rx="6"/><text class="body" x="112.0" y="1024.0" text-anchor="middle">충분·적합한 감사증거</text><text class="body" x="112.0" y="1045.0" text-anchor="middle">입수 불가</text><rect class="deep" x="208" y="998" width="160" height="64" rx="6"/><text class="name" x="288.0" y="1033.5" text-anchor="middle">한정의견</text><rect class="focal" x="376" y="998" width="160" height="64" rx="6"/><text class="name inv" x="456.0" y="1033.5" text-anchor="middle">의견거절</text><path class="flow" d="M24 1094 H54"/><text class="small" x="62" y="1099">작성·표명</text><path class="dash" d="M151.5 1094 H181.5"/><text class="small" x="189.5" y="1099">요건·조건</text><rect class="focal" x="279.0" y="1086" width="22" height="16" rx="3"/><text class="small" x="309.0" y="1099">중심·가장 심각</text><rect class="outside" x="429.55" y="1086" width="22" height="16" rx="3"/><text class="small" x="459.55" y="1099">외부 주체</text>
</svg>
