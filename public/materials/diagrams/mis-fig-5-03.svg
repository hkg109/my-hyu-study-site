<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-labelledby="mis-fig-5-03-title mis-fig-5-03-desc">
  <title id="mis-fig-5-03-title">Figure 5.3 A Multitiered (N-Tier) Client/Server Network</title>
  <desc id="mis-fig-5-03-desc">클라이언트의 요청이 인터넷을 거쳐 웹 서버, 애플리케이션 서버, 판매·생산·회계·인사 업무 기능과 데이터로 이어지며 여러 단계의 서버가 나누어 처리하는 다계층 클라이언트/서버 구조</desc>
  <defs><marker id="mis-fig-5-03-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.both{stroke:#1d1d1a;stroke-width:2;fill:none;marker-start:url(#mis-fig-5-03-arrow);marker-end:url(#mis-fig-5-03-arrow)}.dashboth{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:6 5;marker-start:url(#mis-fig-5-03-arrow);marker-end:url(#mis-fig-5-03-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.label{font:500 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 12px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.inverse{fill:#f7f6f2}</style>
  <rect class="bg" width="1280" height="660"/>
  <text class="tag" x="64" y="52">5장 · Figure 5.3</text><text class="small" x="1216" y="52" text-anchor="end">교재 그림 재구성</text>
  <text class="title" x="64" y="92">A Multitiered (N-Tier) Client/Server Network</text>
  <text class="subtitle" x="64" y="122">클라이언트의 서비스 요청을 서로 다른 단계(level)의 서버가 나누어 처리한다</text>
  <line class="rule" x1="64" y1="148" x2="1216" y2="148"/>

  <rect class="zone" x="400" y="196" width="512" height="236" rx="10"/>
  <text class="small" x="420" y="220">SERVER TIERS · 서버 계층</text>

  <!-- Client -->
  <rect class="node" x="64" y="262" width="120" height="112" rx="8"/>
  <rect class="deep" x="89" y="282" width="70" height="46" rx="4"/><rect class="deep" x="81" y="336" width="86" height="12" rx="3"/>
  <text class="name" x="124" y="404" text-anchor="middle">Client</text>
  <text class="sub" x="124" y="426" text-anchor="middle">요청을 보냄</text>
  <text class="sub" x="124" y="446" text-anchor="middle">(PC · 브라우저)</text>

  <!-- Internet -->
  <circle class="node" cx="294" cy="318" r="44"/>
  <path class="rule" d="M260 302 L328 334 M260 334 L328 302 M294 274 V362 M250 318 H338"/>
  <circle class="deep" cx="294" cy="318" r="16"/>
  <text class="name" x="294" y="394" text-anchor="middle">Internet</text>

  <!-- Web server -->
  <rect class="node" x="430" y="244" width="190" height="164" rx="8"/>
  <rect class="focal" x="500" y="262" width="50" height="76" rx="4"/>
  <text class="name" x="525" y="370" text-anchor="middle">Web Server</text>
  <text class="sub" x="525" y="392" text-anchor="middle">웹 페이지를 찾아 전달</text>

  <!-- App server -->
  <rect class="node" x="692" y="244" width="200" height="164" rx="8"/>
  <rect class="focal" x="767" y="262" width="50" height="76" rx="4"/>
  <text class="name" x="792" y="370" text-anchor="middle">Application Server</text>
  <text class="sub" x="792" y="392" text-anchor="middle">업무 로직(프로그램) 처리</text>

  <!-- Business functions -->
  <rect class="focal" x="992" y="226" width="224" height="184" rx="8"/>
  <text class="small inverse" x="1104" y="256" text-anchor="middle">BUSINESS FUNCTIONS</text>
  <text class="name inverse" x="1104" y="292" text-anchor="middle">Sales · 판매</text>
  <text class="name inverse" x="1104" y="320" text-anchor="middle">Production · 생산</text>
  <text class="name inverse" x="1104" y="348" text-anchor="middle">Accounting · 회계</text>
  <text class="name inverse" x="1104" y="376" text-anchor="middle">HR · 인사</text>

  <!-- Data -->
  <path class="node" d="M1050 512 v62 a54 14 0 0 0 108 0 v-62"/>
  <ellipse class="deep" cx="1104" cy="512" rx="54" ry="14"/>
  <text class="name" x="1104" y="556" text-anchor="middle">Data</text>
  <text class="sub" x="1104" y="612" text-anchor="middle">데이터 저장</text>

  <path class="dashboth" d="M188 318 H246"/>
  <path class="both" d="M342 318 H426"/>
  <path class="both" d="M624 318 H688"/>
  <path class="both" d="M896 318 H988"/>
  <path class="both" d="M1104 414 V494"/>

  <rect class="node" x="64" y="476" width="900" height="152" rx="8"/>
  <text class="small" x="88" y="506">2-TIER vs N-TIER</text>
  <text class="label" x="88" y="536">2-tier: 클라이언트 + 서버 한 단계. N-tier: 웹·애플리케이션·데이터처럼 서버 단계를 여러 개로 나눈다.</text>
  <text class="label" x="88" y="564">작고 값싼 서버에 처리 능력을 분산 → 큰 덩어리로 한꺼번에 살 필요 없이 수요에 맞춰 조금씩 늘린다.</text>
  <text class="sub" x="88" y="596">점선 = 인터넷을 거치는 연결. 실선 양방향 화살표 = 요청과 응답이 오간다.</text>
</svg>
