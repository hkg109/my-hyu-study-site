<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" width="720" height="468" role="img" aria-labelledby="cpp-02-switch-title cpp-02-switch-desc">
  <title id="cpp-02-switch-title">switch는 맞는 case로 뛰어든 뒤 break까지 내려간다</title>
  <desc id="cpp-02-switch-desc">switch 식의 값과 같은 case로 들어가 그 아래 문장을 실행하고 break를 만나면 switch를 빠져나가며, break가 없으면 다음 case 문장까지 이어서 실행되고, 어느 case에도 맞지 않으면 default로 가는 흐름</desc>
  <defs>
    <marker id="cpp-02-switch-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-02-switch-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-02-switch-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="468" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">02 · 선택 구조</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">switch는 맞는 case로 뛰어든 뒤 break까지 내려간다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <rect x="32" y="128" width="168" height="52" rx="6" fill="#f7f6f2"/><rect x="32" y="128" width="168" height="52" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><text x="116" y="159" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#f7f6f2" text-anchor="middle">switch (식)</text><rect x="256" y="128" width="136" height="52" rx="6" fill="#f7f6f2"/><rect x="256" y="128" width="136" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="324" y="158.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">case 'A':</text><rect x="440" y="128" width="128" height="52" rx="6" fill="#f7f6f2"/><rect x="440" y="128" width="128" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="504" y="158.5" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">A 문장</text><path d="M392 154 L440 154" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-switch-m)"/><rect x="608" y="136" width="80" height="36" rx="6" fill="#f7f6f2"/><rect x="608" y="136" width="80" height="36" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="648" y="158.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">break</text><path d="M568 154 L608 154" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-switch-m)"/><rect x="256" y="220" width="136" height="52" rx="6" fill="#f7f6f2"/><rect x="256" y="220" width="136" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="324" y="250.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">case 'B':</text><rect x="440" y="220" width="128" height="52" rx="6" fill="#f7f6f2"/><rect x="440" y="220" width="128" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="504" y="250.5" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">B 문장</text><path d="M392 246 L440 246" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-switch-m)"/><rect x="256" y="312" width="136" height="52" rx="6" fill="#f7f6f2"/><rect x="256" y="312" width="136" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="324" y="342.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">default:</text><rect x="440" y="312" width="128" height="52" rx="6" fill="#f7f6f2"/><rect x="440" y="312" width="128" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="504" y="342.5" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">기본 문장</text><path d="M392 338 L440 338" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-switch-m)"/><rect x="608" y="320" width="80" height="36" rx="6" fill="#f7f6f2"/><rect x="608" y="320" width="80" height="36" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="648" y="342.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">break</text><path d="M568 338 L608 338" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-switch-m)"/><path d="M200 154 L256 154" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-switch-m)"/><path d="M200 166 L220 166 Q228 166 228 174 L228 238 Q228 246 236 246 L256 246" fill="none" stroke="#65645e" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#cpp-02-switch-m)"/><path d="M504 272 L504 312" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-02-switch-a)"/><rect x="514" y="282" width="76" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="552" y="296.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">break 없음</text><text x="32" y="400" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">정수·문자만 가능(double 불가). 같은 case 값이 겹치면 컴파일 오류.</text>
  <line x1="32" y1="420" x2="688" y2="420" stroke="#b9b6ac"/><path d="M32 442 H60" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-switch-m)"/><text x="68" y="447" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">실행</text><path d="M120 442 H148" stroke="#a8431f" stroke-width="1.8" marker-end="url(#cpp-02-switch-a)"/><text x="156" y="447" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">break 없음 → 아래로 계속</text><path d="M331.36 442 H359.36" stroke="#65645e" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#cpp-02-switch-m)"/><text x="367.36" y="447" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">다음 case 검사</text>
</svg>
