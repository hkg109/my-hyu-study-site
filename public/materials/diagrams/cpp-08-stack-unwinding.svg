<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" role="img" aria-labelledby="cpp-08-stack-unwinding-title cpp-08-stack-unwinding-desc">
  <title id="cpp-08-stack-unwinding-title">예외가 지나가는 함수의 지역 객체는 소멸자가 불린다</title>
  <desc id="cpp-08-stack-unwinding-desc">main의 try 블록 안 객체 g(main), outer의 g(out), inner의 g(in)이 쌓인 상태에서 inner가 throw 1을 하면 in, out, main 순서로 소멸자가 불린 뒤에 catch가 실행되는 스택 풀기 그림</desc>
  <defs>
    <marker id="cpp-08-stack-unwinding-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-08-stack-unwinding-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-08-stack-unwinding-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="452" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">08 · 스택 풀기</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">예외가 지나가는 함수의 지역 객체는 소멸자가 불린다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <path d="M472 176 L512 176 Q520 176 520 184 L520 336 Q520 344 512 344 L472 344" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-08-stack-unwinding-a)"/><rect x="96" y="144" width="376" height="64" rx="6" fill="#f7f6f2"/><rect x="96" y="144" width="376" height="64" rx="6" fill="#f3e3dc" stroke="#a8431f" stroke-width="1.5"/><rect x="104" y="150" width="72" height="16" rx="2" fill="#f0eee8" stroke="#b9b6ac"/><text x="140" y="162" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#a8431f" text-anchor="middle">① 먼저 소멸</text><text x="284" y="192.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">inner()  G g("in"); throw 1;</text><rect x="96" y="216" width="376" height="52" rx="6" fill="#f7f6f2"/><rect x="96" y="216" width="376" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><rect x="104" y="222" width="20" height="16" rx="2" fill="#f0eee8" stroke="#b9b6ac"/><text x="114" y="234" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#65645e" text-anchor="middle">②</text><text x="284" y="258.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">outer()  G g("out");</text><rect x="96" y="276" width="376" height="52" rx="6" fill="#f7f6f2"/><rect x="96" y="276" width="376" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><rect x="104" y="282" width="20" height="16" rx="2" fill="#f0eee8" stroke="#b9b6ac"/><text x="114" y="294" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#65645e" text-anchor="middle">③</text><text x="284" y="318.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">main try { G g("main"); }</text><rect x="96" y="336" width="376" height="44" rx="6" fill="#f7f6f2"/><rect x="96" y="336" width="376" height="44" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><text x="284" y="362.5" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#f7f6f2" text-anchor="middle">catch (int e) — 정리가 끝난 뒤</text><text x="560" y="200" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1d1d1a">출력</text><text x="560" y="228" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#1d1d1a">main+ out+ in+</text><text x="560" y="252" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#1d1d1a">in- out- main-</text><text x="560" y="276" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#1d1d1a">catch1 end</text><text x="96" y="132" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">호출 스택 (위가 가장 최근)</text>
  <line x1="32" y1="404" x2="688" y2="404" stroke="#b9b6ac"/><path d="M32 426 H60" stroke="#a8431f" stroke-width="1.8" marker-end="url(#cpp-08-stack-unwinding-a)"/><text x="68" y="431" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">풀리는 순서</text><rect x="163.84" y="418" width="20" height="16" rx="3" fill="#1d1d1a"/><text x="195.84" y="431" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">catch 실행</text>
