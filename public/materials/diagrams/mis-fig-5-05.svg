<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" role="img" aria-labelledby="mis-fig-5-05-title mis-fig-5-05-desc">
  <title id="mis-fig-5-05-title">Figure 5.5 Cloud Computing Platform</title>
  <desc id="mis-fig-5-05-desc">클라우드 안의 서버들이 플랫폼 서비스, 애플리케이션 서비스, 인프라 서비스를 가상화된 자원 풀로 제공하고, 노트북·스마트폰·데스크톱·태블릿이 네트워크로 어디서나 접근하는 구조</desc>
  <defs><marker id="mis-fig-5-05-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.both{stroke:#1d1d1a;stroke-width:2;fill:none;marker-start:url(#mis-fig-5-05-arrow);marker-end:url(#mis-fig-5-05-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.subtitle{font-size:14px}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.chip{font:600 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.label{font:500 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 12px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.inverse{fill:#f7f6f2}</style>
  <rect class="bg" width="1280" height="980"/>
  <text class="tag" x="64" y="52">5장 · Figure 5.5</text><text class="small" x="1216" y="52" text-anchor="end">교재 그림 재구성</text>
  <text class="title" x="64" y="92">Cloud Computing Platform</text>
  <text class="subtitle" x="64" y="122">하드웨어·소프트웨어 능력이 네트워크(주로 인터넷)로 제공되는 가상화 자원 풀 — 언제, 어디서, 어떤 기기로든 접근</text>
