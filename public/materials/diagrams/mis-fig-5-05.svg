  <text class="sub" x="64" y="928">세 층은 교재 그림의 묶음 이름이다. 시험 용어로는 IaaS(인프라) · PaaS(플랫폼) · SaaS(애플리케이션)의 세 서비스 모델과 연결해 읽는다.</text>
  <text class="small" x="64" y="952">아래 기기들 = Businesses and employees — anywhere, at any time, on any device</text>
