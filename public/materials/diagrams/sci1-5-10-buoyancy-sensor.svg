<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-labelledby="sci1-5-10-buoyancy-sensor-title sci1-5-10-buoyancy-sensor-desc">
  <title id="sci1-5-10-buoyancy-sensor-title">힘 센서로 부력 재기</title>
  <desc id="sci1-5-10-buoyancy-sensor-desc">같은 추를 힘 센서에 매단 세 장면. 공기 중에서는 5 N, 일부를 물에 잠그면 4 N, 더 많이 잠그면 3 N이 측정된다. 각 장면에서 위쪽 부력 화살표가 0, 1, 2 N으로 커진다. 아래 띠는 5 N에서 3 N을 빼 부력 2 N을 구하는 식과, 잠긴 부피가 클수록 부력이 커진다는 결론이다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="500"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">힘 센서로 부력 재기</text><text class="subtitle" x="24.0" y="104.0">부력 = 공기 중 측정값 − 물속 측정값</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="146.0" width="160.0" height="270.0" rx="6"/><text class="lab" x="102.0" y="172.0" text-anchor="middle">공기 중</text><rect class="node" x="72.0" y="186.0" width="60.0" height="40.0" rx="6"/><text class="name" x="102.0" y="212.0" text-anchor="middle">5 N</text><line class="line" x1="102.0" y1="226.0" x2="102.0" y2="290.0"/><rect class="solid" x="80.0" y="290.0" width="44.0" height="56.0" rx="3"/><text class="lab" x="102.0" y="323.0" text-anchor="middle">추</text><text class="small" x="62.0" y="402.0" text-anchor="middle">물 없음</text><rect class="zone" x="196.0" y="146.0" width="160.0" height="270.0" rx="6"/><text class="lab" x="274.0" y="172.0" text-anchor="middle">일부 잠김</text><rect class="node" x="244.0" y="186.0" width="60.0" height="40.0" rx="6"/><text class="name" x="274.0" y="212.0" text-anchor="middle">4 N</text><line class="line" x1="274.0" y1="226.0" x2="274.0" y2="290.0"/><rect class="water" x="210.0" y="300.0" width="132.0" height="90.0" rx="2"/><rect class="solid" x="252.0" y="290.0" width="44.0" height="56.0" rx="3"/><text class="lab" x="274.0" y="323.0" text-anchor="middle">추</text><line x1="318.0" y1="346.0" x2="318.0" y2="331.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M318.0,320.0 L322.9,331.0 L313.1,331.0 Z" fill="#1d1d1a"/><text class="small" x="318.0" y="364.0" text-anchor="middle">부력</text><text class="lab" x="318.0" y="380.0" text-anchor="middle">1 N</text><text class="small" x="234.0" y="402.0" text-anchor="middle">물</text><rect class="zone" x="368.0" y="146.0" width="160.0" height="270.0" rx="6"/><text class="lab" x="446.0" y="172.0" text-anchor="middle">더 많이 잠김</text><rect class="node" x="416.0" y="186.0" width="60.0" height="40.0" rx="6"/><text class="name" x="446.0" y="212.0" text-anchor="middle">3 N</text><line class="line" x1="446.0" y1="226.0" x2="446.0" y2="290.0"/><rect class="water" x="382.0" y="274.0" width="132.0" height="116.0" rx="2"/><rect class="solid" x="424.0" y="290.0" width="44.0" height="56.0" rx="3"/><text class="lab" x="446.0" y="323.0" text-anchor="middle">추</text><line x1="490.0" y1="346.0" x2="490.0" y2="305.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M490.0,294.0 L494.9,305.0 L485.1,305.0 Z" fill="#1d1d1a"/><text class="small" x="490.0" y="364.0" text-anchor="middle">부력</text><text class="lab" x="490.0" y="380.0" text-anchor="middle">2 N</text><text class="small" x="406.0" y="402.0" text-anchor="middle">물</text><rect class="focal" x="24.0" y="428.0" width="512.0" height="56.0" rx="6"/><text class="lab inv" x="280.0" y="452.0" text-anchor="middle">5 N − 3 N = 2 N  →  부력 2 N</text><text class="small inv" x="280.0" y="473.0" text-anchor="middle">잠긴 부피가 클수록 밀어낸 물이 많아 부력이 커진다</text>
</svg>
