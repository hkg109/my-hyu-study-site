<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 790" width="560" height="790" role="img" aria-labelledby="adsp-l10d-association-title adsp-l10d-association-desc">
  <title id="adsp-l10d-association-title">지지도 · 신뢰도 · 향상도</title>
  <desc id="adsp-l10d-association-desc">편의점 거래 100건을 사각형으로 두고 라면 원(50건)과 김밥 원(55건)이 겹치게 그린 벤 다이어그램. 라면만 20, 둘 다 30, 김밥만 25, 둘 다 없음 25. 지지도는 겹친 30을 전체 100으로, 신뢰도는 겹친 30을 조건 품목 원으로 나누며, 향상도 약 1.09는 1보다 커서 약한 양의 연관임을 수직선 위에 표시한 그림</desc>
  <defs><marker id="adsp-l10d-association-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l10d-association-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l10d-association-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.dasharrow{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l10d-association-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#65645e;stroke-width:1.2;fill:none}.grid{stroke:#e4e1d8;stroke-width:1;fill:none}.axis{stroke:#1d1d1a;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.head{font:700 16px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.bodym{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.tiny{font:600 12px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="790"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 3장 · 연관분석</text><text class="title" x="24" y="74">지지도 · 신뢰도 · 향상도</text><text class="subtitle" x="24" y="104">편의점 거래 100건 — 규칙 라면 → 김밥</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
<rect class="zone" x="24" y="154" width="512" height="230" rx="8"/><text class="lab" x="40" y="180">전체 거래 100건</text><text class="small" x="520" y="368" text-anchor="end">둘 다 없음 25</text><circle class="node" style="fill:none;stroke:#1d1d1a;stroke-width:2" cx="214" cy="276" r="86"/><path class="dash" style="stroke-width:2" d="M346 190 A86 86 0 1 1 346 362 A86 86 0 1 1 346 190"/><path class="focal" d="M280 220.9 A86 86 0 0 1 280 331.1 A86 86 0 0 1 280 220.9 Z"/><text class="small" x="174" y="272" text-anchor="middle">라면만</text><text class="name" x="174" y="294" text-anchor="middle">20</text><text class="small" x="386" y="272" text-anchor="middle">김밥만</text><text class="name" x="386" y="294" text-anchor="middle">25</text><text class="small inv" x="280" y="272" text-anchor="middle">둘 다</text><text class="name inv" x="280" y="294" text-anchor="middle">30</text><text class="lab" x="118" y="226" text-anchor="end">라면 50</text><text class="tiny" x="118" y="246" text-anchor="end">(실선 원)</text><text class="lab" x="442" y="226">김밥 55</text><text class="tiny" x="442" y="246">(점선 원)</text><rect class="node" x="24" y="404" width="512" height="60" rx="6"/><text class="lab" x="40" y="429">지지도</text><text class="tiny" x="520" y="429" text-anchor="end">얼마나 자주</text><text class="small" x="40" y="452">둘 다 ÷ 전체</text><text class="lab" x="520" y="452" text-anchor="end">30 ÷ 100 = 0.3</text><rect class="node" x="24" y="474" width="512" height="60" rx="6"/><text class="lab" x="40" y="499">신뢰도 (라면 → 김밥)</text><text class="tiny" x="520" y="499" text-anchor="end">라면 산 사람 중</text><text class="small" x="40" y="522">둘 다 ÷ 라면 원</text><text class="lab" x="520" y="522" text-anchor="end">30 ÷ 50 = 0.6</text><rect class="node" x="24" y="544" width="512" height="60" rx="6"/><text class="lab" x="40" y="569">신뢰도 (김밥 → 라면)</text><text class="tiny" x="520" y="569" text-anchor="end">방향 바뀌면 달라짐</text><text class="small" x="40" y="592">둘 다 ÷ 김밥 원</text><text class="lab" x="520" y="592" text-anchor="end">30 ÷ 55 ≈ 0.545</text><rect class="deep" x="24" y="614" width="512" height="60" rx="6"/><text class="lab" x="40" y="639">향상도</text><text class="tiny" x="520" y="639" text-anchor="end">독립(1) 대비 몇 배</text><text class="small" x="40" y="662">지지도 ÷ (P(라면) × P(김밥))</text><text class="lab" x="520" y="662" text-anchor="end">0.3 ÷ (0.5 × 0.55) ≈ 1.09</text><path class="axis" d="M64 730 H496"/><line class="axis" x1="64" y1="724" x2="64" y2="736"/><text class="tiny" x="64" y="754" text-anchor="middle">0.5</text><line class="axis" x1="280" y1="724" x2="280" y2="736"/><text class="tiny" x="280" y="754" text-anchor="middle">1 (독립)</text><line class="axis" x1="496" y1="724" x2="496" y2="736"/><text class="tiny" x="496" y="754" text-anchor="middle">1.5</text><text class="small" x="172" y="716" text-anchor="middle">&lt; 1 음의 연관</text><text class="small" x="408" y="716" text-anchor="middle">&gt; 1 양의 연관</text><circle class="focal" cx="318.9" cy="730" r="6"/><text class="lab" x="328.9" y="754">1.09</text>
</svg>
