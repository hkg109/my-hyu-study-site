<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" role="img" aria-labelledby="cpg-10-http-title cpg-10-http-desc">
  <title id="cpg-10-http-title">주소를 열면 생기는 일</title>
  <desc id="cpg-10-http-desc">브라우저가 GET 요청에 주소와 쿠키를 담아 보내면 Vercel의 Next.js 서버가 주소에 맞는 코드를 실행하고 필요하면 Supabase에서 데이터를 가져온 뒤, 상태 코드와 HTML을 담은 응답을 돌려주고 브라우저가 그것을 화면으로 그리는 순서.</desc>
  <defs><marker id="cpg-10-http-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-10-http-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-10-http-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-10-http-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="800"/>
  <text class="tag" x="24" y="40">01-1 · 웹은 어떻게 동작하나</text><text class="title" x="24" y="74">주소를 열면 생기는 일</text><text class="subtitle" x="24" y="104">웹은 요청 하나, 응답 하나의 반복이다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <path class="flow" d="M140 216 V248"/>
  <path class="flow" d="M140 360 V392"/>
  <path class="flow" d="M140 480 V512"/>
  <path class="flow" d="M140 624 V656"/>
  <rect class="outside" x="24" y="152" width="512" height="64" rx="6"/><text class="name" x="280" y="179.0" text-anchor="middle">브라우저 · 주소창에 /tasks 입력</text><text class="body" x="280" y="200.5" text-anchor="middle">또는 링크·버튼을 누름</text>
  <rect class="zone" x="24" y="248" width="512" height="112" rx="6"/><text class="name" x="40" y="278.0">① 요청 (Request)</text><text class="code" x="40" y="299.5">GET /tasks?status=TODO</text><text class="code" x="40" y="320.5">Host: council.example.com</text><text class="code" x="40" y="341.5">Cookie: 로그인 세션 토큰</text>
  <rect class="focal" x="24" y="392" width="512" height="88" rx="6"/><text class="name inv" x="280" y="420.5" text-anchor="middle">Vercel · Next.js 서버</text><text class="body inv" x="280" y="442.0" text-anchor="middle">주소를 보고 실행할 코드를 고른다</text><text class="body inv" x="280" y="463.0" text-anchor="middle">필요하면 Supabase에 데이터를 묻는다</text>
  <rect class="zone" x="24" y="512" width="512" height="112" rx="6"/><text class="name" x="40" y="542.0">② 응답 (Response)</text><text class="code" x="40" y="563.5">200 OK</text><text class="code" x="40" y="584.5">Content-Type: text/html</text><text class="code" x="40" y="605.5">&lt;html&gt; … 업무 목록 … &lt;/html&gt;</text>
  <rect class="node" x="24" y="656" width="512" height="56" rx="6"/><text class="name" x="280" y="689.5" text-anchor="middle">브라우저가 HTML을 그려 화면 표시</text>
  <text class="small" x="280" y="744" text-anchor="middle">200 성공 · 302 다른 주소로 · 401 로그인 필요</text>
  <text class="small" x="280" y="766" text-anchor="middle">403 권한 없음 · 404 없음 · 500 서버 오류</text>
</svg>
