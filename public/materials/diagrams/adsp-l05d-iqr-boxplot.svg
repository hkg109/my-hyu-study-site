<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 646" role="img" aria-labelledby="adsp-l05d-iqr-boxplot-title adsp-l05d-iqr-boxplot-desc">
  <title id="adsp-l05d-iqr-boxplot-title">상자그림과 IQR 이상값 경계</title>
  <desc id="adsp-l05d-iqr-boxplot-desc">-20부터 80까지 눈금이 있는 가로 상자그림. 상자는 Q1 20부터 Q3 40까지이고 중앙값 28에 굵은 선이 있다. IQR은 20이므로 하한 경계는 20 - 30 = -10, 상한 경계는 40 + 30 = 70이며 두 경계를 점선으로 표시했다. 수염은 경계 안의 최솟값 5와 최댓값 65까지 뻗고, 75는 상한 경계 밖이라 이상값 점으로 찍힌다. 상자그림에는 평균이 표시되지 않는다.</desc>
  <defs><marker id="adsp-l05d-iqr-boxplot-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l05d-iqr-boxplot-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l05d-iqr-boxplot-a)}.flow.both{marker-start:url(#adsp-l05d-iqr-boxplot-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l05d-iqr-boxplot-m)}.dash.both{marker-start:url(#adsp-l05d-iqr-boxplot-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="646"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 1장 · 이상값</text><text class="title" x="24" y="74">상자그림과 IQR 이상값 경계</text><text class="subtitle" x="24" y="104">Q1 = 20, Q3 = 40인 예시 — 경계 밖의 점만 이상값이다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><path class="dash plain" d="M102 174 V324"/><text class="lab" x="102" y="166" text-anchor="middle">하한 경계 -10</text><path class="dash plain" d="M469.99999999999994 174 V324"/><text class="lab" x="469.99999999999994" y="166" text-anchor="middle">상한 경계 70</text><path class="line" d="M171 262 H240 M332 262 H446.99999999999994 M171 246 V278 M446.99999999999994 246 V278"/><rect class="deep" x="240" y="230" width="92" height="64" style="stroke:#1d1d1a;stroke-width:2"/><path class="line" d="M276.79999999999995 230 V294" style="stroke-width:3"/><circle cx="492.99999999999994" cy="262" r="6" fill="#1d1d1a"/><text class="lab" x="240" y="222" text-anchor="middle">Q1</text><text class="lab" x="332" y="222" text-anchor="middle">Q3</text><text class="small" x="276.79999999999995" y="222" text-anchor="middle">중앙값</text><text class="small" x="171" y="238" text-anchor="middle">수염 끝 5</text><text class="small" x="442.99999999999994" y="238" text-anchor="end">수염 끝 65</text><text class="lab" x="492.99999999999994" y="292" text-anchor="middle">75</text><path class="line" d="M56 344 H516" style="stroke-width:1.5"/><path class="line" d="M56 344 V350" style="stroke-width:1.5"/><text class="small" x="56" y="368" text-anchor="middle">-20</text><path class="line" d="M102 344 V350" style="stroke-width:1.5"/><text class="small" x="102" y="368" text-anchor="middle">-10</text><path class="line" d="M148 344 V350" style="stroke-width:1.5"/><text class="small" x="148" y="368" text-anchor="middle">0</text><path class="line" d="M194 344 V350" style="stroke-width:1.5"/><text class="small" x="194" y="368" text-anchor="middle">10</text><path class="line" d="M240 344 V350" style="stroke-width:1.5"/><text class="small" x="240" y="368" text-anchor="middle">20</text><path class="line" d="M286 344 V350" style="stroke-width:1.5"/><text class="small" x="286" y="368" text-anchor="middle">30</text><path class="line" d="M332 344 V350" style="stroke-width:1.5"/><text class="small" x="332" y="368" text-anchor="middle">40</text><path class="line" d="M378 344 V350" style="stroke-width:1.5"/><text class="small" x="378" y="368" text-anchor="middle">50</text><path class="line" d="M424 344 V350" style="stroke-width:1.5"/><text class="small" x="424" y="368" text-anchor="middle">60</text><path class="line" d="M469.99999999999994 344 V350" style="stroke-width:1.5"/><text class="small" x="469.99999999999994" y="368" text-anchor="middle">70</text><path class="line" d="M516 344 V350" style="stroke-width:1.5"/><text class="small" x="516" y="368" text-anchor="middle">80</text><path class="line" d="M240 384 V392 H332 V384" style="stroke-width:1.5"/><text class="lab" x="286" y="414" text-anchor="middle">IQR = 20</text><path class="line" d="M332 384 V392 H469.99999999999994 V384" style="stroke-width:1.5"/><text class="lab" x="401" y="414" text-anchor="middle">1.5 × IQR = 30</text><path class="line" d="M102 384 V392 H240 V384" style="stroke-width:1.5"/><text class="lab" x="171" y="414" text-anchor="middle">1.5 × IQR = 30</text><rect class="node" x="24" y="442" width="512" height="118" rx="6"/><text class="task" x="40" y="470">하한 경계 = Q1 − 1.5 × IQR = 20 − 30 = <tspan class="b">−10</tspan></text><text class="task" x="40" y="494">상한 경계 = Q3 + 1.5 × IQR = 40 + 30 = <tspan class="b">70</tspan></text><text class="task" x="40" y="518">65는 경계 안 → 수염 끝, 75는 경계 밖 → 이상값(점)</text><text class="small" x="40" y="542">상자그림에는 평균이 그려지지 않는다 (가운데 선은 중앙값)</text><rect class="deep" x="24" y="584" width="22" height="16" rx="3"/><text class="small" x="54" y="597">상자 = 가운데 50% (Q1~Q3)</text><path class="dash plain" d="M242.64000000000001 592 H272.64"/><text class="small" x="280.64" y="597">IQR 경계 (그림에는 안 그림)</text><circle cx="30" cy="618" r="6" fill="#1d1d1a"/><text class="small" x="54" y="623">이상값</text>
</svg>
