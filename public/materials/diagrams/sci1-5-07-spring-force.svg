<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500" role="img" aria-labelledby="sci1-5-07-spring-force-title sci1-5-07-spring-force-desc">
  <title id="sci1-5-07-spring-force-title">탄성력은 원래 모양으로 돌아가는 쪽</title>
  <desc id="sci1-5-07-spring-force-desc">벽에 붙은 용수철 세 개를 위아래로 그렸다. 맨 위는 원래 길이로 아무 힘이 없다. 가운데는 손이 오른쪽으로 당겨 늘어났고, 탄성력 화살표는 왼쪽을 향한다. 아래는 손이 왼쪽으로 눌러 줄어들었고 탄성력은 오른쪽을 향한다. 점선은 원래 길이의 끝을 표시한다. 오른쪽 아래 작은 그래프는 늘어난 길이 1, 2, 3 cm에 탄성력 2, 4, 6 N이 원점을 지나는 직선 위에 놓인 정비례 관계이다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="500"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">탄성력은 원래 모양으로 돌아가는 쪽</text><text class="subtitle" x="24.0" y="104.0">손이 민 방향과 탄성력의 방향은 반대이다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><line class="dashl" x1="214.0" y1="150.0" x2="214.0" y2="420.0"/><text class="small" x="214.0" y="146.0" text-anchor="middle">원래 끝</text><rect class="deep" x="24.0" y="160.0" width="20.0" height="52.0" rx="2"/><path class="line" d="M44,186 L53.4,186 L62.9,174 L72.3,198 L81.8,174 L91.2,198 L100.7,174 L110.1,198 L119.6,174 L129.0,198 L138.4,174 L147.9,198 L157.3,174 L166.8,198 L176.2,174 L185.7,198 L195.1,174 L204.6,198 L214.0,186"/><rect class="solid" x="214.0" y="172.0" width="14.0" height="28.0" rx="2"/><text class="lab" x="24.0" y="152.0">원래 길이</text><rect class="deep" x="24.0" y="260.0" width="20.0" height="52.0" rx="2"/><path class="line" d="M44,286 L56.8,286 L69.6,274 L82.3,298 L95.1,274 L107.9,298 L120.7,274 L133.4,298 L146.2,274 L159.0,298 L171.8,274 L184.6,298 L197.3,274 L210.1,298 L222.9,274 L235.7,298 L248.4,274 L261.2,298 L274.0,286"/><rect class="solid" x="274.0" y="272.0" width="14.0" height="28.0" rx="2"/><text class="lab" x="24.0" y="252.0">늘였을 때</text><line x1="288.0" y1="286.0" x2="327.0" y2="286.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M338.0,286.0 L327.0,290.9 L327.0,281.1 Z" fill="#1d1d1a"/><text class="small" x="314.0" y="268.0" text-anchor="middle">손: 당김 →</text><line x1="281.0" y1="310.0" x2="238.0" y2="310.0" stroke="#65645e" stroke-width="3.5"/><path d="M227.0,310.0 L238.0,305.1 L238.0,314.9 Z" fill="#65645e"/><text class="lab" x="254.0" y="334.0" text-anchor="middle">← 탄성력</text><rect class="deep" x="24.0" y="360.0" width="20.0" height="52.0" rx="2"/><path class="line" d="M44,386 L50.7,386 L57.3,374 L64.0,398 L70.7,374 L77.3,398 L84.0,374 L90.7,398 L97.3,374 L104.0,398 L110.7,374 L117.3,398 L124.0,374 L130.7,398 L137.3,374 L144.0,398 L150.7,374 L157.3,398 L164.0,386"/><rect class="solid" x="164.0" y="372.0" width="14.0" height="28.0" rx="2"/><text class="lab" x="24.0" y="352.0">눌렀을 때</text><line x1="238.0" y1="386.0" x2="193.0" y2="386.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M182.0,386.0 L193.0,381.1 L193.0,390.9 Z" fill="#1d1d1a"/><text class="small" x="246.0" y="391.0">← 손: 누름</text><line x1="171.0" y1="410.0" x2="214.0" y2="410.0" stroke="#65645e" stroke-width="3.5"/><path d="M225.0,410.0 L214.0,414.9 L214.0,405.1 Z" fill="#65645e"/><text class="lab" x="198.0" y="434.0" text-anchor="middle">탄성력 →</text><rect class="node" x="376.0" y="264.0" width="164.0" height="186.0" rx="6"/><line class="line" x1="400.0" y1="410.0" x2="520.0" y2="410.0"/><line class="line" x1="400.0" y1="300.0" x2="400.0" y2="410.0"/><circle class="focal" cx="436.0" cy="378.0" r="4.0"/><text class="small" x="436.0" y="426.0" text-anchor="middle">1</text><text class="small" x="394.0" y="383.0" text-anchor="end">2</text><circle class="focal" cx="472.0" cy="346.0" r="4.0"/><text class="small" x="472.0" y="426.0" text-anchor="middle">2</text><text class="small" x="394.0" y="351.0" text-anchor="end">4</text><circle class="focal" cx="508.0" cy="314.0" r="4.0"/><text class="small" x="508.0" y="426.0" text-anchor="middle">3</text><text class="small" x="394.0" y="319.0" text-anchor="end">6</text><line class="dashl" x1="400.0" y1="410.0" x2="518.8" y2="304.4"/><text class="lab" x="460.0" y="284.0" text-anchor="middle">정비례</text><text class="small" x="460.0" y="444.0" text-anchor="middle">늘어난 길이 (cm)</text><text class="small" x="394.0" y="298.0" text-anchor="end">N</text>
</svg>
