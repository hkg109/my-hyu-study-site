<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" role="img" aria-labelledby="cpp-03-call-by-value-title cpp-03-call-by-value-desc">
  <title id="cpp-03-call-by-value-title">값에 의한 호출 — 인수는 복사된다</title>
  <desc id="cpp-03-call-by-value-desc">main의 변수 a=5와 b=2의 값이 max 함수의 매개변수 i와 j로 복사되고, max의 지역 변수 m에 계산한 5가 return으로 main의 x에 돌아오며, 함수가 끝나면 i, j, m은 사라진다는 그림</desc>
  <defs>
    <marker id="cpp-03-call-by-value-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-03-call-by-value-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-03-call-by-value-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="452" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">03 · 함수</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">값에 의한 호출 — 인수는 복사된다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <rect x="32" y="112" width="260" height="236" rx="8" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.2"/><text x="44" y="132" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">main</text><rect x="428" y="112" width="260" height="236" rx="8" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.2"/><text x="440" y="132" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">max(int i, int j)</text><path d="M192 160 L516 160" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-03-call-by-value-m)"/><rect x="330" y="136" width="48" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="354" y="150.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">5 복사</text><path d="M192 220 L516 220" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-03-call-by-value-m)"/><rect x="330" y="196" width="48" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="354" y="210.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">2 복사</text><path d="M516 296 L192 296" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-03-call-by-value-a)"/><rect x="308" y="272" width="92" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="354" y="286.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">return m (5)</text><rect x="128" y="140" width="64" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="160" y="165" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">5</text><text x="112" y="166" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#65645e" text-anchor="end">a</text><rect x="128" y="200" width="64" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="160" y="225" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">2</text><text x="112" y="226" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#65645e" text-anchor="end">b</text><rect x="128" y="276" width="64" height="40" fill="#f3e3dc" stroke="#b9b6ac" stroke-width="1.4"/><text x="160" y="301" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">5</text><text x="112" y="302" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#65645e" text-anchor="end">x</text><rect x="516" y="140" width="64" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="548" y="165" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">5</text><text x="596" y="166" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#65645e">i</text><rect x="516" y="200" width="64" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="548" y="225" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">2</text><text x="596" y="226" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#65645e">j</text><rect x="516" y="276" width="64" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="548" y="301" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">5</text><text x="596" y="302" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#65645e">m</text><text x="32" y="380" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">i, j를 바꿔도 a, b는 그대로다. max가 끝나면 i, j, m은 사라진다.</text>
  <line x1="32" y1="404" x2="688" y2="404" stroke="#b9b6ac"/><path d="M32 426 H60" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-03-call-by-value-m)"/><text x="68" y="431" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">값 복사</text><path d="M135.84 426 H163.84" stroke="#a8431f" stroke-width="1.8" marker-end="url(#cpp-03-call-by-value-a)"/><text x="171.84" y="431" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">반환 값</text><rect x="243.68" y="418" width="20" height="16" rx="3" fill="#f0eee8" stroke="#b9b6ac"/><text x="275.68" y="431" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">함수의 메모리 영역</text>
