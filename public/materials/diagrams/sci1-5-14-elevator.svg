<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" width="560" height="490" role="img" aria-labelledby="sci1-5-14-elevator-title sci1-5-14-elevator-desc">
  <title id="sci1-5-14-elevator-title">움직이는 방향 ≠ 알짜힘 방향</title>
  <desc id="sci1-5-14-elevator-desc">세 칸에 승강기를 그렸다. 모두 위로 움직이는 중이다(점선 화살표). 첫째 칸은 위로 빨라지는 중이라 알짜힘이 위쪽, 둘째 칸은 일정한 속력이라 알짜힘이 0으로 중력과 떠받치는 힘이 같다, 셋째 칸은 위로 가면서 느려지는 중이라 알짜힘이 아래쪽이다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="490"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">움직이는 방향 ≠ 알짜힘 방향</text><text class="subtitle" x="24.0" y="104.0">속력이 어떻게 변하는지를 보고 알짜힘을 판단한다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="146.0" width="160.0" height="300.0" rx="6"/><text class="lab" x="104.0" y="172.0" text-anchor="middle">위로 빨라짐</text><rect class="node" x="50.0" y="186.0" width="80.0" height="204.0" rx="3"/><circle class="solid" cx="90.0" cy="278.0" r="10.0"/><rect class="solid" x="80.0" y="290.0" width="20.0" height="40.0" rx="6"/><line x1="90.0" y1="266.0" x2="90.0" y2="216.0" stroke="#1d1d1a" stroke-width="3.2"/><path d="M90.0,206.0 L94.5,216.0 L85.5,216.0 Z" fill="#1d1d1a"/><line x1="90.0" y1="332.0" x2="90.0" y2="358.0" stroke="#1d1d1a" stroke-width="3.2"/><path d="M90.0,368.0 L85.5,358.0 L94.5,358.0 Z" fill="#1d1d1a"/><line x1="162.0" y1="340.0" x2="162.0" y2="230.0" stroke="#65645e" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M162.0,220.0 L166.5,230.0 L157.5,230.0 Z" fill="#65645e"/><rect class="focal" x="44.0" y="402.0" width="120.0" height="30.0" rx="6"/><text class="lab inv" x="104.0" y="423.0" text-anchor="middle">알짜힘 ↑</text><rect class="zone" x="196.0" y="146.0" width="160.0" height="300.0" rx="6"/><text class="lab" x="276.0" y="172.0" text-anchor="middle">일정한 속력</text><rect class="node" x="222.0" y="186.0" width="80.0" height="204.0" rx="3"/><circle class="solid" cx="262.0" cy="278.0" r="10.0"/><rect class="solid" x="252.0" y="290.0" width="20.0" height="40.0" rx="6"/><line x1="262.0" y1="266.0" x2="262.0" y2="230.0" stroke="#1d1d1a" stroke-width="3.2"/><path d="M262.0,220.0 L266.5,230.0 L257.5,230.0 Z" fill="#1d1d1a"/><line x1="262.0" y1="332.0" x2="262.0" y2="368.0" stroke="#1d1d1a" stroke-width="3.2"/><path d="M262.0,378.0 L257.5,368.0 L266.5,368.0 Z" fill="#1d1d1a"/><line x1="334.0" y1="340.0" x2="334.0" y2="230.0" stroke="#65645