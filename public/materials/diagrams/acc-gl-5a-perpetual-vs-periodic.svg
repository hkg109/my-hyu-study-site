<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1001" role="img" aria-labelledby="acc-gl-5a-perpetual-vs-periodic-title acc-gl-5a-perpetual-vs-periodic-desc">
  <title id="acc-gl-5a-perpetual-vs-periodic-title">계속기록법 vs 실지재고조사법</title>
  <desc id="acc-gl-5a-perpetual-vs-periodic-desc">왼쪽 계속기록법과 오른쪽 실지재고조사법을 매입할 때, 판매할 때, 기말, 장점과 한계 순서로 나란히 비교하고, 두 열이 아래의 상호보완 상자로 모이는 그림. 계속기록법은 매입 때 상품 계정, 판매 때 매출원가와 상품 감소를 기록하고, 실지재고조사법은 매입 계정을 쓰며 판매 때 상품 감소를 기록하지 않는다</desc>
  <defs><marker id="acc-gl-5a-perpetual-vs-periodic-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-5a-perpetual-vs-periodic-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-5a-perpetual-vs-periodic-a)}.flow.both{marker-start:url(#acc-gl-5a-perpetual-vs-periodic-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-5a-perpetual-vs-periodic-m)}.dash.both{marker-start:url(#acc-gl-5a-perpetual-vs-periodic-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1001"/>
  <text class="tag" x="24" y="40">5장 · 5-1 상품 거래의 기록 방법</text><text class="title" x="24" y="74">계속기록법 vs 실지재고조사법</text><text class="subtitle" x="24" y="104">같은 거래(기초 8,000 · 외상매입 30,000 · 원가 20,000을 35,000에</text><text class="subtitle" x="24" y="124">현금 판매)를 두 방법이 어떻게 기록하는가</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="172" width="248" height="58" rx="6"/><text class="small inv" x="148" y="194" text-anchor="middle">Perpetual inventory</text><text class="name inv" x="148" y="214" text-anchor="middle">계속기록법</text><rect class="focal" x="288" y="172" width="248" height="58" rx="6"/><text class="small inv" x="412" y="194" text-anchor="middle">Periodic inventory</text><text class="name inv" x="412" y="214" text-anchor="middle">실지재고조사법</text><path class="flow" d="M148.0 230 L148.0 270"/><rect class="mask" x="127.5" y="240" width="41" height="22" rx="4"/><text class="lab" x="148" y="256" text-anchor="middle">기중</text><path class="flow" d="M412.0 230 L412.0 270"/><rect class="mask" x="391.5" y="240" width="41" height="22" rx="4"/><text class="lab" x="412" y="256" text-anchor="middle">기중</text><rect class="node" x="24" y="270" width="248" height="84" rx="6"/><text class="small" x="148" y="296" text-anchor="middle">매입할 때</text><text class="body" x="148" y="316" text-anchor="middle">차) 상품 30,000</text><text class="body" x="148" y="337" text-anchor="middle">대) 매입채무 30,000</text><rect class="node" x="288" y="270" width="248" height="84" rx="6"/><text class="small" x="412" y="296" text-anchor="middle">매입할 때</text><text class="body" x="412" y="316" text-anchor="middle">차) 매입 30,000</text><text class="body" x="412" y="337" text-anchor="middle">대) 매입채무 30,000</text><path class="flow" d="M148.0 354 L148.0 394"/><rect class="mask" x="127.5" y="364" width="41" height="22" rx="4"/><text class="lab" x="148" y="380" text-anchor="middle">기중</text><path class="flow" d="M412.0 354 L412.0 394"/><rect class="mask" x="391.5" y="364" width="41" height="22" rx="4"/><text class="lab" x="412" y="380" text-anchor="middle">기중</text><rect class="node" x="24" y="394" width="248" height="126" rx="6"/><text class="small" x="148" y="420" text-anchor="middle">판매할 때</text><text class="body" x="148" y="440" text-anchor="middle">차) 현금 35,000</text><text class="body" x="148" y="461" text-anchor="middle">대) 매출 35,000</text><text class="body" x="148" y="482" text-anchor="middle">차) 매출원가 20,000</text><text class="body" x="148" y="503" text-anchor="middle">대) 상품 20,000</text><rect class="node" x="288" y="394" width="248" height="126" rx="6"/><text class="small" x="412" y="421" text-anchor="middle">판매할 때</text><text class="body" x="412" y="441" text-anchor="middle">차) 현금 35,000</text><text class="body" x="412" y="462" text-anchor="middle">대) 매출 35,000</text><text class="small" x="412" y="483" text-anchor="middle">매출원가·상품 감소는</text><text class="small" x="412" y="503" text-anchor="middle">기록하지 않는다</text><path class="flow" d="M148.0 520 L148.0 560"/><rect class="mask" x="127.5" y="530" width="41" height="22" rx="4"/><text class="lab" x="148" y="546" text-anchor="middle">결산</text><path class="flow" d="M412.0 520 L412.0 560"/><rect class="mask" x="391.5" y="530" width="41" height="22" rx="4"/><text class="lab" x="412" y="546" text-anchor="middle">결산</text><rect class="zone" x="24" y="560" width="248" height="84" rx="6"/><text class="small" x="148" y="586" text-anchor="middle">기말</text><text class="body" x="148" y="606" text-anchor="middle">실사 결과와 장부 재고 비교</text><text class="body" x="148" y="627" text-anchor="middle">→ 재고자산감모손실 파악</text><rect class="zone" x="288" y="560" width="248" height="84" rx="6"/><text class="small" x="412" y="586" text-anchor="middle">기말</text><text class="body" x="412" y="606" text-anchor="middle">실지재고조사로 기말상품 확인</text><text class="body" x="412" y="627" text-anchor="middle">→ 결산정리로 매출원가 계산</text><path class="flow" d="M148.0 644 L148.0 684"/><rect class="mask" x="127.5" y="654" width="41" height="22" rx="4"/><text class="lab" x="148" y="670" text-anchor="middle">평가</text><path class="flow" d="M412.0 644 L412.0 684"/><rect class="mask" x="391.5" y="654" width="41" height="22" rx="4"/><text class="lab" x="412" y="670" text-anchor="middle">평가</text><rect class="node" x="24" y="684" width="248" height="105" rx="6"/><text class="small" x="148" y="710" text-anchor="middle">장점 · 한계</text><text class="body" x="148" y="730" text-anchor="middle">재고·매출원가·매출이익을</text><text class="body" x="148" y="751" text-anchor="middle">장부로 수시 확인 가능</text><text class="body" x="148" y="772" text-anchor="middle">정교한 시스템 비용·노력 큼</text><rect class="node" x="288" y="684" width="248" height="105" rx="6"/><text class="small" x="412" y="710" text-anchor="middle">장점 · 한계</text><text class="body" x="412" y="730" text-anchor="middle">기중 장부로 매출원가·이익·</text><text class="body" x="412" y="751" text-anchor="middle">기말상품을 알 수 없음</text><text class="body" x="412" y="772" text-anchor="middle">회계처리가 단순 (선호 이유)</text><path class="dash" d="M148.0 789 L148.0 845"/><rect class="mask" x="96.45" y="807" width="103.1" height="22" rx="4"/><text class="lab" x="148" y="823" text-anchor="middle">보유 수량 정보</text><path class="dash" d="M412.0 789 L412.0 845"/><rect class="mask" x="360.45" y="807" width="103.1" height="22" rx="4"/><text class="lab" x="412" y="823" text-anchor="middle">장부 수량 검증</text><rect class="deep" x="24" y="845" width="512" height="92" rx="6"/><text class="name" x="280" y="873" text-anchor="middle">두 방법은 상호보완적으로 사용</text><text class="body" x="280" y="897" text-anchor="middle">계속기록법은 재고 수량을 알려 주고, 실지재고조사는</text><text class="body" x="280" y="918" text-anchor="middle">장부상 수량이 적정한지를 알려 준다</text><path class="flow" d="M24 971 H54"/><text class="small" x="62" y="976">흐름·기록 순서</text><path class="dash" d="M176.61 971 H206.61"/><text class="small" x="214.61" y="976">확인·대응 관계</text><rect class="focal" x="329.22" y="963" width="22" height="16" rx="3"/><text class="small" x="359.22" y="976">중심 개념</text><rect class="zone" x="439.27000000000004" y="963" width="22" height="16" rx="3"/><text class="small" x="469.27" y="976">범위·묶음</text>
</svg>
