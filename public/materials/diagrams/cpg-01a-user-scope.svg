<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" role="img" aria-labelledby="cpg-01a-user-scope-title cpg-01a-user-scope-desc">
  <title id="cpg-01a-user-scope-title">로그인 ≠ 학생회 권한</title>
  <desc id="cpg-01a-user-scope-desc">학교 외 계정은 Auth Hook에서 거부되고, 학교 계정으로 로그인한 사용자는 일반 학생이며, 그 안에서 현재 Term 활성 Membership이 있는 사람만 MEMBER, DIRECTOR, EXECUTIVE Role로 내부 자료를 쓴다는 포함 관계 그림.</desc>
  <defs><marker id="cpg-01a-user-scope-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-01a-user-scope-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-01a-user-scope-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-01a-user-scope-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="800"/>
  <text class="tag" x="24" y="40">1편 · 누구를 위한 서비스인가</text><text class="title" x="24" y="74">로그인 ≠ 학생회 권한</text><text class="subtitle" x="24" y="104">사용자는 바깥에서 안으로 갈수록 더 많은 자료를 본다.</text><text class="subtitle" x="24" y="124">안쪽으로 들어가는 조건은 로그인이 아니라 승인 명단이다.</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
  <rect class="outside" x="24" y="166" width="512" height="64" rx="6"/><text class="name" x="280" y="193.0" text-anchor="middle">학교 외 Google 계정</text><text class="body" x="280" y="214.5" text-anchor="middle">Auth Hook에서 생성 자체를 거부</text>
  <rect class="zone" x="24" y="254" width="512" height="474" rx="6"/>
  <text class="name" x="40" y="282">학교 Google 계정으로 로그인한 사용자</text>
  <text class="body" x="40" y="306">일반 학생 · 건의 작성, 본인 건의의 상태와 공개 답변 확인</text>
  <rect class="deep" x="40" y="326" width="480" height="386" rx="6"/>
  <text class="name" x="56" y="354">승인 명단 + 현재 Term 활성 Membership</text>
  <text class="body" x="56" y="378">학생회 구성원 · 권한은 Role로 계산한다</text>
  <rect class="node" x="56" y="396" width="448" height="84" rx="6"/><text class="name" x="280" y="422.5" text-anchor="middle">MEMBER · 국원</text><text class="body" x="280" y="444.0" text-anchor="middle">담당 업무 처리, 허용된 행사 자료,</text><text class="body" x="280" y="465.0" text-anchor="middle">지정된 회의록 편집</text>
  <rect class="node" x="56" y="496" width="448" height="84" rx="6"/><text class="name" x="280" y="522.5" text-anchor="middle">DIRECTOR · 국장</text><text class="body" x="280" y="544.0" text-anchor="middle">자기 국 구성원·업무·행사 관리,</text><text class="body" x="280" y="565.0" text-anchor="middle">회의록 생성 (다른 국·승격은 불가)</text>
  <rect class="focal" x="56" y="596" width="448" height="100" rx="6"/><text class="name inv" x="280" y="621.0" text-anchor="middle">EXECUTIVE · 회장단</text><text class="body inv" x="280" y="642.5" text-anchor="middle">조직 설정, 전체 운영 권한,</text><text class="body inv" x="280" y="663.5" text-anchor="middle">건의 작성자 신원 확인</text><text class="small inv" x="280" y="683.1" text-anchor="middle">(목적과 기록을 남겨서)</text>
  <text class="small" x="280" y="760" text-anchor="middle">회장·홍보국장 같은 Position은 화면 표시용 — 권한 계산에 쓰지 않는다</text>
</svg>
