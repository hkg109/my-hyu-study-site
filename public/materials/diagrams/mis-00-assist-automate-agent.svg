<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="mis-00-assist-automate-agent-title mis-00-assist-automate-agent-desc">
  <title id="mis-00-assist-automate-agent-title">Assist Automate Agent 비교</title>
  <desc id="mis-00-assist-automate-agent-desc">사람이 작업을 주도하는 보조에서 반복 작업 자동화와 여러 단계를 수행하는 에이전트로 이어지는 역할 변화</desc>
  <defs><marker id="mis-00-assist-automate-agent-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1}.flow{stroke:#65645e;stroke-width:2;fill:none;marker-end:url(#mis-00-assist-automate-agent-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 20px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.inverse{fill:#f7f6f2}.step{font:600 11px 'JetBrains Mono',monospace;fill:#65645e;letter-spacing:.08em}</style>
  <rect class="bg" width="1280" height="620"/><text class="tag" x="64" y="52">LECTURE 00 · AI ROLES</text><text class="title" x="64" y="92">AI가 맡는 범위가 넓어질수록 통제 기준도 중요해진다</text><text class="subtitle" x="64" y="122">세 용어의 차이는 단순한 성능이 아니라 작업 단위와 사람의 개입 지점이다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
  <path class="flow" d="M408 356 H460"/><path class="flow" d="M820 356 H872"/>
  <g><rect class="node" x="64" y="252" width="344" height="208" rx="6"/><text class="step" x="92" y="284">01 · SUPPORT</text><text class="name" x="92" y="328">Assist</text><text class="sub" x="92" y="360">사람이 일하고 AI가 보조</text><line class="rule" x1="92" y1="388" x2="380" y2="388"/><text class="sub" x="92" y="420">작업 단위 · 한 단계</text><text class="sub" x="92" y="444">사람 · 판단과 실행을 주도</text></g>
  <g><rect class="node" x="460" y="252" width="360" height="208" rx="6"/><text class="step" x="488" y="284">02 · REPEAT</text><text class="name" x="488" y="328">Automate</text><text class="sub" x="488" y="360">정해진 반복 Task 자동 수행</text><line class="rule" x1="488" y1="388" x2="792" y2="388"/><text class="sub" x="488" y="420">작업 단위 · 규칙 기반 Task</text><text class="sub" x="488" y="444">사람 · 규칙과 예외를 관리</text></g>
  <g><rect class="focal" x="872" y="252" width="344" height="208" rx="6"/><text class="step inverse" x="900" y="284">03 · ORCHESTRATE</text><text class="name inverse" x="900" y="328">Agent</text><text class="sub inverse" x="900" y="360">여러 Task를 연결해 Workflow 수행</text><line x1="900" y1="388" x2="1188" y2="388" stroke="#f7f6f2" stroke-opacity=".35"/><text class="sub inverse" x="900" y="420">작업 단위 · 다단계 Workflow</text><text class="sub inverse" x="900" y="444">사람 · 목표·권한·검토 기준 설정</text></g>
  <text class="step" x="64" y="524">HUMAN CONTROL</text><line class="rule" x1="184" y1="520" x2="1096" y2="520"/><text class="step" x="1112" y="524">AI SCOPE</text>
</svg>
