<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 726" role="img" aria-labelledby="mis-gl-3c-organization-features-title mis-gl-3c-organization-features-desc">
  <title id="mis-gl-3c-organization-features-title">루틴 ⊂ 프로세스 ⊂ 기업, 그리고 네 가지 특징</title>
  <desc id="mis-gl-3c-organization-features-desc">기업 범위 안에 비즈니스 프로세스 범위가 있고 그 안에 개별 루틴(SOP)들이 있는 포함 관계, 그리고 정치·문화·환경·구조 네 특징이 기업에 영향을 주는 그림. 환경은 정보시스템이라는 렌즈를 통해 기업에 들어온다</desc>
  <defs><marker id="mis-gl-3c-organization-features-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-3c-organization-features-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-3c-organization-features-a)}.flow.both{marker-start:url(#mis-gl-3c-organization-features-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-3c-organization-features-m)}.dash.both{marker-start:url(#mis-gl-3c-organization-features-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="726"/>
  <text class="tag" x="24" y="40">3장 · 3-2 조직의 특징과 구조</text><text class="title" x="24" y="74">루틴 ⊂ 프로세스 ⊂ 기업, 그리고 네 가지 특징</text><text class="subtitle" x="24" y="104">Figure 3.4 · 3.5 · 안쪽 루틴이 바뀌어야 바깥 프로세스가 바뀐다.</text><text class="subtitle" x="24" y="124">정치·문화·환경·구조가 같은 IT의 효과를 조직마다 다르게 만든다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="172" width="528" height="196" rx="8"/><text class="small" x="28" y="192">Business firm · 기업 = 프로세스의 묶음</text><rect class="deep" x="32" y="206" width="496" height="150" rx="8"/><text class="small" x="44" y="226">Business process = 루틴의 묶음</text><rect class="node" x="44" y="244" width="150.66666666666666" height="98" rx="6"/><text class="small" x="119.33333333333333" y="274.25" text-anchor="middle">SOP</text><text class="name" x="119.33333333333333" y="295.25" text-anchor="middle">루틴 A</text><text class="body" x="119.33333333333333" y="322.25" text-anchor="middle">정해진 절차</text><rect class="node" x="204.66666666666666" y="244" width="150.66666666666666" height="98" rx="6"/><text class="small" x="280" y="274.25" text-anchor="middle">SOP</text><text class="name" x="280" y="295.25" text-anchor="middle">루틴 B</text><text class="body" x="280" y="322.25" text-anchor="middle">정해진 절차</text><rect class="node" x="365.3333333333333" y="244" width="150.66666666666666" height="98" rx="6"/><text class="small" x="440.66666666666663" y="274.25" text-anchor="middle">SOP</text><text class="name" x="440.66666666666663" y="295.25" text-anchor="middle">루틴 C</text><text class="body" x="440.66666666666663" y="322.25" text-anchor="middle">정해진 절차</text><rect class="node" x="24" y="426" width="249" height="110" rx="6"/><text class="small" x="148.5" y="452" text-anchor="middle">Politics</text><text class="name" x="148.5" y="473" text-anchor="middle">정치</text><text class="body" x="148.5" y="500" text-anchor="middle">정보 = 권력</text><text class="body" x="148.5" y="520.5" text-anchor="middle">정치적 저항</text><rect class="node" x="287" y="426" width="249" height="110" rx="6"/><text class="small" x="411.5" y="452" text-anchor="middle">Culture</text><text class="name" x="411.5" y="473" text-anchor="middle">문화</text><text class="body" x="411.5" y="500" text-anchor="middle">공유된 기본 가정</text><text class="body" x="411.5" y="520.5" text-anchor="middle">통합력이자 제약</text><rect class="outside" x="24" y="548" width="249" height="110" rx="6"/><text class="small" x="148.5" y="574" text-anchor="middle">Environment</text><text class="name" x="148.5" y="595" text-anchor="middle">환경</text><text class="body" x="148.5" y="622" text-anchor="middle">IS = 환경을 보는 렌즈</text><text class="body" x="148.5" y="642.5" text-anchor="middle">환경 탐색</text><rect class="node" x="287" y="548" width="249" height="110" rx="6"/><text class="small" x="411.5" y="574" text-anchor="middle">Structure</text><text class="name" x="411.5" y="595" text-anchor="middle">구조</text><text class="body" x="411.5" y="622" text-anchor="middle">Mintzberg 다섯 유형</text><text class="body" x="411.5" y="642.5" text-anchor="middle">목표·리더십·업무</text><path class="dash" d="M280 426 L280 368"/><rect class="mask" x="258.6" y="386" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="402" text-anchor="middle">영향</text><path class="dash" d="M24 682 H54"/><text class="small" x="62" y="687">영향·제약</text><rect class="outside" x="144.28025000000002" y="674" width="22" height="16" rx="3"/><text class="small" x="174.28025000000002" y="687">조직 밖 주체</text><rect class="zone" x="273.17225" y="674" width="22" height="16" rx="3"/><text class="small" x="303.17225" y="687">범위·묶음</text>
</svg>
