<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" width="720" height="432" role="img" aria-labelledby="cpp-07-static-member-title cpp-07-static-member-desc">
  <title id="cpp-07-static-member-title">static 속성은 모든 객체가 함께 쓰는 하나</title>
  <desc id="cpp-07-static-member-desc">foo 클래스의 static int cnt는 클래스에 하나만 있고 세 객체 f1, f2, f3이 같은 cnt를 공유하며, 일반 속성 i는 객체마다 따로 있고, static 속성은 클래스 밖 cpp 파일에서 정의해야 한다는 그림</desc>
  <defs>
    <marker id="cpp-07-static-member-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-07-static-member-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-07-static-member-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="432" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">07 · static 멤버</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">static 속성은 모든 객체가 함께 쓰는 하나</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <path d="M120 264 L120 244 Q120 236 128 236 L320 236 Q328 236 328 228 L328 196" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-07-static-member-m)"/><path d="M352 264 L352 244 Q352 236 360 236 L352 236 Q360 236 360 228 L360 196" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-07-static-member-m)"/><path d="M584 264 L584 244 Q584 236 576 236 L400 236 Q392 236 392 228 L392 196" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-07-static-member-m)"/><rect x="248" y="120" width="224" height="76" rx="6" fill="#f7f6f2"/><rect x="248" y="120" width="224" height="76" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><rect x="256" y="126" width="52" height="16" rx="2" fill="#3a3a36" stroke="#55554f"/><text x="282" y="138" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#d9d6cc" text-anchor="middle">static</text><text x="360" y="166.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#f7f6f2" text-anchor="middle">foo::cnt = 3</text><text x="360" y="186.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#d9d6cc" text-anchor="middle">int foo::cnt = 0;  // .cpp</text><rect x="40" y="264" width="160" height="64" rx="6" fill="#f7f6f2"/><rect x="40" y="264" width="160" height="64" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="120" y="292" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">f1</text><text x="120" y="312" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">i = 4  (각자)</text><rect x="272" y="264" width="160" height="64" rx="6" fill="#f7f6f2"/><rect x="272" y="264" width="160" height="64" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="352" y="292" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">f2</text><text x="352" y="312" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">i = 9  (각자)</text><rect x="504" y="264" width="160" height="64" rx="6" fill="#f7f6f2"/><rect x="504" y="264" width="160" height="64" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="584" y="292" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">f3</text><text x="584" y="312" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">i = 1  (각자)</text><text x="32" y="364" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">static 메서드는 객체 없이 foo::count() 로 부르고, 일반 속성(i)은 쓸 수 없다(this가 없다).</text>
  <line x1="32" y1="384" x2="688" y2="384" stroke="#b9b6ac"/><path d="M32 406 H60" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-07-static-member-m)"/><text x="68" y="411" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">공유</text><rect x="124" y="398" width="20" height="16" rx="3" fill="#1d1d1a"/><text x="156" y="411" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">클래스에 하나</text>
</svg>
