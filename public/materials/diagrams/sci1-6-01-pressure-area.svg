<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 456" width="560" height="456" role="img" aria-labelledby="sci1-6-01-pressure-area-title sci1-6-01-pressure-area-desc">
  <title id="sci1-6-01-pressure-area-title">압력은 힘과 면적으로 정해진다</title>
  <desc id="sci1-6-01-pressure-area-desc">왼쪽 칸은 같은 크기의 벽돌을 1장과 2장 올린 스펀지를 비교한다. 면적이 같을 때 힘이 2배이면 스펀지가 더 깊이 눌린다. 오른쪽 칸은 같은 벽돌을 눕혀 놓은 것과 세워 놓은 것을 비교한다. 힘이 같을 때 바닥에 닿는 면적이 작은 쪽이 더 깊이 눌린다. 아래 띠에는 압력은 힘의 크기를 힘을 받는 면적으로 나눈 값이고 단위는 N/m² 또는 Pa라고 적었다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.ptc{fill:#1d1d1a}.ptcl{fill:#65645e}</style>
  <rect class="bg" width="560" height="456"/><text class="tag" x="24.0" y="40.0">중1 과학 · VI. 기체의 성질</text><text class="title" x="24.0" y="74.0">압력은 힘과 면적으로 정해진다</text><text class="subtitle" x="24.0" y="104.0">스펀지가 눌린 깊이로 압력의 크기를 비교한다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="150.0" width="248.0" height="230.0" rx="6"/><rect class="zone" x="288.0" y="150.0" width="248.0" height="230.0" rx="6"/><text class="name" x="148.0" y="178.0" text-anchor="middle">힘이 클수록</text><text class="name" x="412.0" y="178.0" text-anchor="middle">면적이 작을수록</text><path class="deep" d="M40,300 L60,300 L60,306 L120,306 L120,300 L140,300 L140,340 L40,340 Z"/><rect class="solid" x="60.0" y="276.0" width="60.0" height="30.0" rx="2"/><path class="deep" d="M156,300 L176,300 L176,316 L236,316 L236,300 L256,300 L256,340 L156,340 Z"/><rect class="solid" x="176.0" y="255.0" width="60.0" height="30.0" rx="2"/><rect class="solid" x="176.0" y="286.0" width="60.0" height="30.0" rx="2"/><text class="small" x="90.0" y="360.0" text-anchor="middle">벽돌 1장</text><text class="small" x="206.0" y="360.0" text-anchor="middle">벽돌 2장</text><text class="lab" x="148.0" y="210.0" text-anchor="middle">같은 면적, 힘 2배</text><text class="small" x="90.0" y="260.0" text-anchor="middle">얕게</text><text class="small" x="206.0" y="228.0" text-anchor="middle">깊게</text><path class="deep" d="M304,300 L314,300 L314,306 L394,306 L394,300 L404,300 L404,340 L304,340 Z"/><rect class="solid" x="314.0" y="276.0" width="80.0" height="30.0" rx="2"/><path class="deep" d="M420,300 L455,300 L455,318 L485,318 L485,300 L520,300 L520,340 L420,340 Z"/><rect class="solid" x="455.0" y="246.0" width="30.0" height="72.0" rx="2"/><text class="small" x="354.0" y="360.0" text-anchor="middle">눕혀 놓음</text><text class="small" x="470.0" y="360.0" text-anchor="middle">세워 놓음</text><text class="lab" x="412.0" y="210.0" text-anchor="middle">같은 힘, 면적 작게</text><text class="small" x="354.0" y="266.0" text-anchor="middle">얕게</text><text class="small" x="470.0" y="236.0" text-anchor="middle">깊게</text><rect class="focal" x="24.0" y="396.0" width="512.0" height="40.0" rx="6"/><text class="lab inv" x="280.0" y="421.0" text-anchor="middle">압력 = 힘의 크기 ÷ 힘을 받는 면적   (단위 N/m² = Pa)</text>
</svg>
