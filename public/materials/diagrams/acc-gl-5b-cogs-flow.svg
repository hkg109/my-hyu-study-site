<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 902" role="img" aria-labelledby="acc-gl-5b-cogs-flow-title acc-gl-5b-cogs-flow-desc">
  <title id="acc-gl-5b-cogs-flow-title">판매가능액은 매출원가와 기말상품으로 나뉜다</title>
  <desc id="acc-gl-5b-cogs-flow-desc">위에 기초상품재고액 8,000원과 당기상품매입액 30,000원이 더해져 당기판매가능액 38,000원이 되고, 판매가능액이 매출원가 20,000원과 기말상품재고액 18,000원으로 나뉘는 그림. 아래 왼쪽 계속기록법은 매출원가를 판매 때마다 직접 기록해 기말상품을 계산하고, 오른쪽 실지재고조사법은 기말상품을 실사로 확인해 매출원가를 역산한다</desc>
  <defs><marker id="acc-gl-5b-cogs-flow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-5b-cogs-flow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-5b-cogs-flow-a)}.flow.both{marker-start:url(#acc-gl-5b-cogs-flow-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-5b-cogs-flow-m)}.dash.both{marker-start:url(#acc-gl-5b-cogs-flow-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="902"/>
  <text class="tag" x="24" y="40">5장 · 5-1 상품과 매출원가의 관계</text><text class="title" x="24" y="74">판매가능액은 매출원가와 기말상품으로 나뉜다</text><text class="subtitle" x="24" y="104">기초 8,000 + 매입 30,000 = 판매가능액 38,000. 계속기록법은 매출원가를,</text><text class="subtitle" x="24" y="124">실지재고조사법은 기말상품을 먼저 알아내고 나머지를 계산한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="240" height="78" rx="6"/><text class="small" x="144" y="204" text-anchor="middle">기초상품재고액</text><text class="name" x="144" y="224" text-anchor="middle">8,000</text><rect class="node" x="296" y="172" width="240" height="78" rx="6"/><text class="small" x="416" y="204" text-anchor="middle">당기상품매입액</text><text class="name" x="416" y="224" text-anchor="middle">30,000</text><path class="flow" d="M144 250 L144 280 L250 280 L250 312"/><rect class="mask" x="162.75" y="270" width="54.5" height="22" rx="4"/><text class="lab" x="190" y="286" text-anchor="middle">더한다</text><path class="flow" d="M416 250 L416 280 L310 280 L310 312"/><rect class="mask" x="342.75" y="270" width="54.5" height="22" rx="4"/><text class="lab" x="370" y="286" text-anchor="middle">더한다</text><rect class="focal" x="104" y="312" width="352" height="80" rx="6"/><text class="small inv" x="280" y="345" text-anchor="middle">Goods available for sale</text><text class="name inv" x="280" y="365" text-anchor="middle">당기판매가능액 38,000</text><path class="flow" d="M200 392 L200 420 L144 420 L144 456"/><rect class="mask" x="123.975" y="412" width="72.05" height="22" rx="4"/><text class="lab" x="160" y="428" text-anchor="middle">팔린 부분</text><path class="flow" d="M360 392 L360 420 L416 420 L416 456"/><rect class="mask" x="363.975" y="412" width="72.05" height="22" rx="4"/><text class="lab" x="400" y="428" text-anchor="middle">남은 부분</text><rect class="deep" x="24" y="456" width="240" height="92" rx="6"/><text class="small" x="144" y="484.5" text-anchor="middle">비용 (포괄손익계산서)</text><text class="name" x="144" y="504.5" text-anchor="middle">매출원가 20,000</text><text class="body" x="144" y="528.5" text-anchor="middle">판매된 상품의 원가</text><rect class="deep" x="296" y="456" width="240" height="92" rx="6"/><text class="small" x="416" y="484.5" text-anchor="middle">자산 (재무상태표)</text><text class="name" x="416" y="504.5" text-anchor="middle">기말상품재고액 18,000</text><text class="body" x="416" y="528.5" text-anchor="middle">다음 기의 기초상품</text><rect class="node" x="24" y="612" width="240" height="136" rx="6"/><text class="name" x="144" y="642" text-anchor="middle">계속기록법</text><text class="body" x="144" y="666" text-anchor="middle">판매할 때마다</text><text class="body" x="144" y="687" text-anchor="middle">매출원가를 기록</text><text class="small" x="144" y="708" text-anchor="middle">기말상품 = 판매가능액</text><text class="small" x="144" y="728" text-anchor="middle">− 매출원가</text><rect class="node" x="296" y="612" width="240" height="136" rx="6"/><text class="name" x="416" y="642" text-anchor="middle">실지재고조사법</text><text class="body" x="416" y="666" text-anchor="middle">기말에 실사로</text><text class="body" x="416" y="687" text-anchor="middle">기말상품을 확인</text><text class="small" x="416" y="708" text-anchor="middle">매출원가 = 판매가능액</text><text class="small" x="416" y="728" text-anchor="middle">− 기말상품</text><path class="dash" d="M144 612 L144 548"/><rect class="mask" x="107.975" y="570" width="72.05" height="22" rx="4"/><text class="lab" x="144" y="586" text-anchor="middle">직접 기록</text><path class="dash" d="M416 612 L416 548"/><rect class="mask" x="373.225" y="570" width="85.55" height="22" rx="4"/><text class="lab" x="416" y="586" text-anchor="middle">실사로 확인</text><rect class="zone" x="24" y="772" width="512" height="70" rx="6"/><text class="body" x="280" y="801" text-anchor="middle">기초상품 + 당기매입 − 매출원가 = 기말상품</text><text class="body" x="280" y="822" text-anchor="middle">기초상품 + 당기매입 − 기말상품 = 매출원가</text><path class="flow" d="M24 872 H54"/><text class="small" x="62" y="877">흐름·기록 순서</text><path class="dash" d="M176.61 872 H206.61"/><text class="small" x="214.61" y="877">확인·대응 관계</text><rect class="focal" x="329.22" y="864" width="22" height="16" rx="3"/><text class="small" x="359.22" y="877">중심 개념</text><rect class="zone" x="439.27000000000004" y="864" width="22" height="16" rx="3"/><text class="small" x="469.27" y="877">범위·묶음</text>
</svg>
