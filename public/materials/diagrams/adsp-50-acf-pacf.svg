<title id="adsp-50-acf-pacf-title">AR(3)를 구분하는 두 가지 패턴</title><desc id="adsp-50-acf-pacf-desc">AR(3) 모형의 이론적 자기상관과 부분자기상관. ACF는 점차 감소하고 PACF는 시차 3 이후 0이 된다. 표본 추정값이 아닌 이론적 예시다.</desc>
