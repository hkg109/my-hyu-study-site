<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 874" width="560" height="874" role="img" aria-labelledby="lm2-l02a-boot-title lm2-l02a-boot-desc">
  <title id="lm2-l02a-boot-title">리눅스 부팅 과정</title>
  <desc id="lm2-l02a-boot-desc">전원을 켜면 BIOS 또는 UEFI가 POST로 하드웨어를 점검하고 부팅 장치를 고른다. BIOS는 MBR의 446바이트 부트 코드를, UEFI는 ESP의 efi 파일을 실행해 부트로더 GRUB2를 띄운다. GRUB2는 /boot/grub2/grub.cfg 메뉴에서 고른 커널 vmlinuz와 initramfs를 메모리에 올린다. 커널은 하드웨어를 초기화하고 루트 파일 시스템을 마운트한 뒤 PID 1인 systemd를 실행한다. systemd는 기본 타깃(multi-user 또는 graphical)에 맞는 서비스를 띄우고 마지막으로 로그인 화면이 나온다.</desc>
  <defs><marker id="lm2-l02a-boot-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l02a-boot-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l02a-boot-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l02a-boot-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="874"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 1과목 2장</text><text class="title" x="24" y="74">부팅 — 전원에서 로그인까지</text><text class="subtitle" x="24" y="104">펌웨어는 부트로더만, 부트로더는 커널만 올린다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="node" x="24" y="156" width="264" height="72" rx="6"/><text class="name" x="38" y="186">① BIOS / UEFI</text><text class="small" x="38" y="210">POST · 부팅 장치 선택</text><rect class="outside" x="304" y="170" width="232" height="44" rx="6"/><text class="small" x="420" y="197" text-anchor="middle">CMOS 설정 · 부팅 순서</text><line class="thin" x1="288" y1="192.0" x2="304" y2="192.0" stroke-dasharray="3 3"/><path class="flow" d="M156 228 V254"/><rect class="node" x="24" y="254" width="264" height="72" rx="6"/><text class="name" x="38" y="284">② 부트 코드</text><text class="small" x="38" y="308">MBR 446바이트 / ESP의 .efi</text><rect class="outside" x="304" y="268" width="232" height="44" rx="6"/><text class="small" x="420" y="295" text-anchor="middle">/boot/efi/EFI/…/grubx64.efi</text><line class="thin" x1="288" y1="290.0" x2="304" y2="290.0" stroke-dasharray="3 3"/><path class="flow" d="M156 326 V352"/><rect class="zone" x="24" y="352" width="264" height="72" rx="6"/><text class="name" x="38" y="382">③ 부트로더 GRUB2</text><text class="small" x="38" y="406">메뉴 · 커널과 initramfs 적재</text><rect class="outside" x="304" y="366" width="232" height="44" rx="6"/><text class="small" x="420" y="393" text-anchor="middle">/boot/grub2/grub.cfg</text><line class="thin" x1="288" y1="388.0" x2="304" y2="388.0" stroke-dasharray="3 3"/><path class="flow" d="M156 424 V450"/><rect class="focal" x="24" y="450" width="264" height="72" rx="6"/><text class="name inv" x="38" y="480">④ 커널</text><text class="small inv" x="38" y="504">초기화 · 드라이버 · 루트 마운트</text><rect class="outside" x="304" y="464" width="232" height="44" rx="6"/><text class="small" x="420" y="491" text-anchor="middle">vmlinuz-… · initramfs-…</text><line class="thin" x1="288" y1="486.0" x2="304" y2="486.0" stroke-dasharray="3 3"/><path class="flow" d="M156 522 V548"/><rect class="deep" x="24" y="548" width="264" height="72" rx="6"/><text class="name" x="38" y="578">⑤ systemd (PID 1)</text><text class="small" x="38" y="602">기본 타깃의 서비스 시작</text><rect class="outside" x="304" y="562" width="232" height="44" rx="6"/><text class="small" x="420" y="589" text-anchor="middle">default.target · 옛 /sbin/init</text><line class="thin" x1="288" y1="584.0" x2="304" y2="584.0" stroke-dasharray="3 3"/><path class="flow" d="M156 620 V646"/><rect class="node" x="24" y="646" width="264" height="72" rx="6"/><text class="name" x="38" y="676">⑥ 로그인</text><text class="small" x="38" y="700">getty(텍스트) · 디스플레이 매니저</text><rect class="outside" x="304" y="660" width="232" height="44" rx="6"/><text class="small" x="420" y="687" text-anchor="middle">multi-user / graphical.target</text><line class="thin" x1="288" y1="682.0" x2="304" y2="682.0" stroke-dasharray="3 3"/><rect class="deep" x="24" y="748" width="512" height="74" rx="6"/><text class="lab" x="40" y="778">바부커시 · BIOS/UEFI → 부트로더 → 커널 → systemd</text><text class="lab" x="40" y="804">확인 · dmesg(커널 메시지) · journalctl -b(이번 부팅 로그)</text><path class="flow" d="M24 852 H54"/><text class="small" x="62" y="857">다음 단계</text><rect class="focal" x="142.05" y="844" width="22" height="16" rx="3"/><text class="small" x="172.05" y="857">커널</text><rect class="outside" x="221.05" y="844" width="22" height="16" rx="3"/><text class="small" x="251.05" y="857">그 단계가 읽는 파일</text>
</svg>
