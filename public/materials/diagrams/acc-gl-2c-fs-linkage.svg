<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1140" role="img" aria-labelledby="acc-gl-2c-fs-linkage-title acc-gl-2c-fs-linkage-desc">
  <title id="acc-gl-2c-fs-linkage-title">재무제표 사이의 연계 · 자료 2-4</title>
  <desc id="acc-gl-2c-fs-linkage-desc">자료 2-4의 숫자로 본 재무제표의 연계. 기초 재무상태표(자산 1,770원, 현금 150원, 부채 500원, 자본 1,270원)에서 출발해 포괄손익계산서(수익 420 − 비용 360 = 당기순이익 60, 기타포괄이익 50, 총포괄이익 110), 자본변동표(유상증자 500 + 당기순이익 60 + 기타포괄이익 50 − 현금배당 30 = 자본 증가 580), 현금흐름표(현금유입 800 − 현금유출 450 = 순현금유입 350)가 기중 변동을 설명하고, 기말 재무상태표(자산 2,350원, 현금 500원, 부채 500원, 자본 1,850원)로 이어진다.</desc>
  <defs><marker id="acc-gl-2c-fs-linkage-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-2c-fs-linkage-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-2c-fs-linkage-a)}.flow.both{marker-start:url(#acc-gl-2c-fs-linkage-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-2c-fs-linkage-m)}.dash.both{marker-start:url(#acc-gl-2c-fs-linkage-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#b9b6ac;stroke-width:1.2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1140"/>
  <text class="tag" x="24" y="40">2장 · 2-4 재무제표 사이의 연계</text><text class="title" x="24" y="74">재무제표의 연계 · 자료 2-4 (단위: 원)</text><text class="subtitle" x="24" y="104">기초와 기말 재무상태표 사이의 손익·자본·현금 변동을 나머지 세 재무제표가</text><text class="subtitle" x="24" y="124">각각 설명한다.</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="166" width="512" height="150" rx="6"/><line class="thin" x1="280" y1="166" x2="280" y2="316"/><text class="small" x="36" y="188">기초 재무상태표</text><text class="name" x="40" y="216">자산 1,770</text><text class="body" x="40" y="240">현금 150</text><text class="body" x="40" y="264">그 외 자산 1,620</text><text class="name" x="296" y="216">부채 500</text><line class="thin" x1="280" y1="224" x2="536" y2="224"/><text class="name" x="296" y="244">자본 1,270</text><text class="body" x="296" y="268">자본금 1,000</text><text class="body" x="296" y="292">이익잉여금 270</text><path class="flow" d="M280 316 L280 366"/><rect class="mask" x="217.6" y="330" width="124.8" height="22" rx="4"/><text class="lab" x="280" y="346" text-anchor="middle">기중 변동을 설명</text><rect class="zone" x="16" y="366" width="528" height="364" rx="8"/><text class="small" x="28" y="388">기간 재무제표 세 가지</text><rect class="focal" x="24" y="400" width="512" height="116" rx="6"/><text class="name inv" x="38" y="428">포괄손익계산서</text><text class="body inv" x="38" y="456">수익 420 − 비용 360 = 당기순이익 60</text><text class="body inv" x="38" y="480">당기순이익 60 + 기타포괄이익 50 = 총포괄이익 110</text><text class="small inv" x="38" y="502">→ 이익잉여금 · 기타포괄손익누계액으로 대체</text><rect class="node" x="24" y="524" width="512" height="116" rx="6"/><text class="name" x="38" y="552">자본변동표</text><text class="body" x="38" y="580">유상증자 500 + 당기순이익 60 + 기타포괄이익 50</text><text class="body" x="38" y="604">− 현금배당 30 = 자본의 변동 580</text><text class="small" x="38" y="626">→ 자본금 · 이익잉여금 · 기타포괄손익누계액</text><rect class="node" x="24" y="648" width="512" height="68" rx="6"/><text class="name" x="38" y="676">현금흐름표</text><text class="body" x="38" y="702">현금유입 800 − 현금유출 450 = 순현금유입 350</text><path class="flow" d="M280 730 L280 780"/><rect class="mask" x="210.8" y="744" width="138.4" height="22" rx="4"/><text class="lab" x="280" y="760" text-anchor="middle">기말 잔액으로 연결</text><rect class="node" x="24" y="780" width="512" height="174" rx="6"/><line class="thin" x1="280" y1="780" x2="280" y2="954"/><text class="small" x="36" y="802">기말 재무상태표</text><text class="name" x="40" y="830">자산 2,350</text><text class="body" x="40" y="854">현금 500</text><text class="body" x="40" y="878">그 외 자산 1,850</text><text class="name" x="296" y="830">부채 500</text><line class="thin" x1="280" y1="838" x2="536" y2="838"/><text class="name" x="296" y="858">자본 1,850</text><text class="body" x="296" y="882">자본금 1,500</text><text class="body" x="296" y="906">이익잉여금 300</text><text class="body" x="296" y="930">기타포괄손익누계액 50</text><rect class="deep" x="24" y="976" width="512" height="114" rx="6"/><text class="small" x="38" y="1000">검산 · 세 갈래가 모두 맞아야 한다</text><text class="body" x="38" y="1026">자본: 1,270 + 580 = 1,850 = 2,350 − 500</text><text class="body" x="38" y="1050">이익잉여금: 270 + 60 − 30 = 300</text><text class="body" x="38" y="1074">현금: 150 + 350 = 500</text><path class="flow" d="M24 1116 H54"/><text class="small" x="62" y="1121">연결</text><rect class="focal" x="111.2" y="1108" width="22" height="16" rx="3"/><text class="small" x="141.2" y="1121">성과 보고서</text><rect class="zone" x="239.0" y="1108" width="22" height="16" rx="3"/><text class="small" x="269.0" y="1121">기간 재무제표</text><rect class="deep" x="380.4" y="1108" width="22" height="16" rx="3"/><text class="small" x="410.4" y="1121">검산</text>
</svg>
