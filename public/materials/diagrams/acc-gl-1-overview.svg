<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 568" role="img" aria-labelledby="acc-gl-1-overview-title acc-gl-1-overview-desc">
  <title id="acc-gl-1-overview-title">회계는 정보를 만들어 전달하는 시스템</title>
  <desc id="acc-gl-1-overview-desc">1장의 네 개념 묶음을 회계의 의의와 기능, 경제실체와 경제활동, 정보이용자와 재무회계·관리회계, 재무제표·회계기준·회계감사 순서로 지그재그로 잇고 주체·누구에게·규칙이라는 관계 이름표를 단 개요도</desc>
  <defs><marker id="acc-gl-1-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-1-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-1-overview-a)}.flow.both{marker-start:url(#acc-gl-1-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-1-overview-m)}.dash.both{marker-start:url(#acc-gl-1-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="568"/>
  <text class="tag" x="24" y="40">1장 개요 · 개념 묶음 4개</text><text class="title" x="24" y="74">회계는 정보를 만들어 전달하는 시스템</text><text class="subtitle" x="24" y="104">핵심 질문: 회계는 무엇을, 누구를 위해, 어떤 규칙으로 만들고, 그 결과물을 왜</text><text class="subtitle" x="24" y="124">믿을 수 있는가?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="172" width="224" height="130.5" rx="6"/><text class="small inv" x="136" y="208.25" text-anchor="middle">1-1</text><text class="name inv" x="136" y="229.25" text-anchor="middle">회계의 의의와 기능</text><text class="body inv" x="136" y="256.25" text-anchor="middle">의사결정 지원 · 수탁책임</text><text class="body inv" x="136" y="276.75" text-anchor="middle">인식 → 측정 → 전달</text><rect class="node" x="312" y="172" width="224" height="130.5" rx="6"/><text class="small" x="424" y="198" text-anchor="middle">1-2</text><text class="name" x="424" y="219" text-anchor="middle">경제실체와 경제활동</text><text class="body" x="424" y="246" text-anchor="middle">주식회사</text><text class="body" x="424" y="266.5" text-anchor="middle">영업·투자·재무활동</text><text class="body" x="424" y="287" text-anchor="middle">서비스·상·제조기업</text><rect class="node" x="312" y="360.5" width="224" height="133" rx="6"/><text class="small" x="424" y="386.5" text-anchor="middle">1-3</text><text class="name" x="424" y="407.5" text-anchor="middle">정보이용자와 회계의</text><text class="name" x="424" y="430.5" text-anchor="middle">두 갈래</text><text class="body" x="424" y="457.5" text-anchor="middle">내부·외부 이해관계자</text><text class="body" x="424" y="478" text-anchor="middle">관리회계 vs 재무회계</text><rect class="node" x="24" y="360.5" width="224" height="133" rx="6"/><text class="small" x="136" y="386.5" text-anchor="middle">1-4</text><text class="name" x="136" y="407.5" text-anchor="middle">재무제표·회계기준·</text><text class="name" x="136" y="430.5" text-anchor="middle">회계감사</text><text class="body" x="136" y="457.5" text-anchor="middle">K-IFRS · 내부회계관리제도</text><text class="body" x="136" y="478" text-anchor="middle">적정·한정·부적정·의견거절</text><path class="flow" d="M248 237.25 L312 237.25"/><rect class="mask" x="258.6" y="226.25" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="242.25" text-anchor="middle">주체</text><path class="flow" d="M424 302.5 L424 360.5"/><rect class="mask" x="388.1" y="320.5" width="71.8" height="22" rx="4"/><text class="lab" x="424" y="336.5" text-anchor="middle">누구에게</text><path class="flow" d="M312 427 L248 427"/><rect class="mask" x="258.6" y="416" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="432" text-anchor="middle">규칙</text><path class="flow" d="M24 523.5 H54"/><text class="small" x="62" y="528.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="515.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="528.5">중심 개념</text>
</svg>
