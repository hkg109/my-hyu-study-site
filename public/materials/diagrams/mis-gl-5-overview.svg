<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 821" role="img" aria-labelledby="mis-gl-5-overview-title mis-gl-5-overview-desc">
  <title id="mis-gl-5-overview-title">기반을 정의하고, 나누고, 바꾸고, 관리한다</title>
  <desc id="mis-gl-5-overview-desc">5-1 IT 인프라의 정의와 진화가 5-2 일곱 구성요소로 분해되고, 구성요소 안의 변화가 하드웨어 쪽 5-3 모바일·양자·그린·가상화·클라우드와 소프트웨어 쪽 5-4 소프트웨어 플랫폼과 조달로 나뉜 뒤, 두 쪽의 선택이 5-5 인프라 관리 과제의 확장성·거버넌스·TCO·투자 요인 판단으로 모이는 개요도</desc>
  <defs><marker id="mis-gl-5-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-5-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-5-overview-a)}.flow.both{marker-start:url(#mis-gl-5-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-5-overview-m)}.dash.both{marker-start:url(#mis-gl-5-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="821"/>
  <text class="tag" x="24" y="40">5장 개요 · 개념 묶음 5개</text><text class="title" x="24" y="74">기반을 정의하고, 나누고, 바꾸고, 관리한다</text><text class="subtitle" x="24" y="104">핵심 질문: 기업의 모든 시스템을 떠받치는 기반을 무엇으로 짓고, 직접</text><text class="subtitle" x="24" y="124">소유할까 빌려 쓸까?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="433" width="528" height="156.5" rx="8"/><text class="small" x="280" y="453" text-anchor="middle">구성요소 안의 변화</text><rect class="node" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small" x="280" y="198" text-anchor="middle">5-1</text><text class="name" x="280" y="219" text-anchor="middle">IT 인프라의 정의와 진화</text><text class="body" x="280" y="246" text-anchor="middle">장비 + 전사 서비스 플랫폼, 다섯 시대</text><rect class="focal" x="24" y="319.5" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="345.5" text-anchor="middle">5-2</text><text class="name inv" x="280" y="366.5" text-anchor="middle">일곱 구성요소</text><text class="body inv" x="280" y="393.5" text-anchor="middle">하·오·엔·데·네·인·컨, legacy와 통합</text><rect class="node" x="24" y="467" width="249" height="112.5" rx="6"/><text class="small" x="148.5" y="493" text-anchor="middle">5-3</text><text class="name" x="148.5" y="514" text-anchor="middle">모바일·양자·그린·가상화·</text><text class="name" x="148.5" y="537" text-anchor="middle">클라우드</text><text class="body" x="148.5" y="564" text-anchor="middle">BYOD, IaaS·PaaS·SaaS, 엣지</text><rect class="node" x="287" y="467" width="249" height="112.5" rx="6"/><text class="small" x="411.5" y="494.25" text-anchor="middle">5-4</text><text class="name" x="411.5" y="515.25" text-anchor="middle">소프트웨어 플랫폼과 조달</text><text class="body" x="411.5" y="542.25" text-anchor="middle">오픈소스, 웹 서비스·XML,</text><text class="body" x="411.5" y="562.75" text-anchor="middle">SaaS·SLA, AI</text><rect class="node" x="24" y="663.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="689.5" text-anchor="middle">5-5</text><text class="name" x="280" y="710.5" text-anchor="middle">인프라 관리 과제</text><text class="body" x="280" y="737.5" text-anchor="middle">확장성·MDM·거버넌스, rent vs buy, TCO, 여섯 투자 요인</text><path class="flow" d="M280 261.5 L280 319.5"/><rect class="mask" x="220.3" y="279.5" width="119.4" height="22" rx="4"/><text class="lab" x="280" y="295.5" text-anchor="middle">구성요소로 분해</text><path class="flow" d="M148.5 409 L148.5 467"/><rect class="mask" x="103.2" y="427" width="90.6" height="22" rx="4"/><text class="lab" x="148.5" y="443" text-anchor="middle">하드웨어 쪽</text><path class="flow" d="M411.5 409 L411.5 467"/><rect class="mask" x="359.0" y="427" width="105.0" height="22" rx="4"/><text class="lab" x="411.5" y="443" text-anchor="middle">소프트웨어 쪽</text><path class="line" d="M148.5 579.5 V617.5"/><path class="line" d="M411.5 579.5 V617.5"/><path class="line" d="M148.5 617.5 H411.5"/><path class="flow" d="M280 617.5 L280 663.5"/><rect class="mask" x="224.2" y="606.5" width="111.5" height="22" rx="4"/><text class="lab" x="280" y="622.5" text-anchor="middle">관리·투자 판단</text><path class="flow" d="M24 777 H54"/><text class="small" x="62" y="782">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="769" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="782">중심 개념</text><rect class="zone" x="302.06225" y="769" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="782">범위·묶음</text>
</svg>
