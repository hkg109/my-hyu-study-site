<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 852" role="img" aria-labelledby="cpg-05a-crdt-save-title cpg-05a-crdt-save-desc">
  <title id="cpg-05a-crdt-save-title">회의록 변경이 저장되는 순서</title>
  <desc id="cpg-05a-crdt-save-desc">편집자 A의 브라우저가 Yjs Update를 묶어 save_meeting_update RPC를 호출하면, DB 함수가 편집 권한과 회의록 상태를 검사해 순번을 발급하고 저장한 뒤 같은 트랜잭션에서 Realtime으로 발행하고 A에게 Ack를 돌려주며, Realtime이 편집자 B에게 Broadcast해 B가 Update를 적용하는 순서도.</desc>
  <defs><marker id="cpg-05a-crdt-save-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-05a-crdt-save-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-05a-crdt-save-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-05a-crdt-save-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="852"/>
  <text class="tag" x="24" y="40">5편 · 실시간 공동편집</text><text class="title" x="24" y="74">회의록 변경이 저장되는 순서</text><text class="subtitle" x="24" y="104">저장이 먼저, 전파는 그다음이다.</text><text class="subtitle" x="24" y="124">키 입력마다 Vercel 함수를 거치지 않는다.</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
  <path class="soft" d="M88 212 V748"/>
  <path class="soft" d="M216 212 V748"/>
  <path class="soft" d="M344 212 V748"/>
  <path class="soft" d="M472 212 V748"/>
  <rect class="node" x="30" y="156" width="116" height="56" rx="6"/><text class="lab" x="88" y="179.3" text-anchor="middle">편집자 A</text><text class="small" x="88" y="198.6" text-anchor="middle">브라우저</text>
  <rect class="deep" x="158" y="156" width="116" height="56" rx="6"/><text class="lab" x="216" y="179.3" text-anchor="middle">save_meeting</text><text class="small" x="216" y="198.6" text-anchor="middle">DB 함수</text>
  <rect class="node" x="286" y="156" width="116" height="56" rx="6"/><text class="lab" x="344" y="179.3" text-anchor="middle">Realtime</text><text class="small" x="344" y="198.6" text-anchor="middle">Private 채널</text>
  <rect class="node" x="414" y="156" width="116" height="56" rx="6"/><text class="lab" x="472" y="179.3" text-anchor="middle">편집자 B</text><text class="small" x="472" y="198.6" text-anchor="middle">브라우저</text>
  <rect class="node" x="30" y="236" width="116" height="64" rx="6"/><text class="small" x="88" y="263.1" text-anchor="middle">입력 → Yjs</text><text class="small" x="88" y="282.1" text-anchor="middle">Update 묶기</text>
  <path class="flow" d="M88 340 H216"/><rect class="mask" x="112.3" y="316" width="79.4" height="21" rx="4"/><text class="lab" x="152" y="331" text-anchor="middle">RPC + JWT</text>
  <rect class="focal" x="150" y="364" width="132" height="108" rx="6"/><text class="small inv" x="216" y="394.1" text-anchor="middle">편집 권한·</text><text class="small inv" x="216" y="413.1" text-anchor="middle">회의록 상태</text><text class="small inv" x="216" y="432.1" text-anchor="middle">검사 → 순번</text><text class="small inv" x="216" y="451.1" text-anchor="middle">발급·저장</text>
  <path class="flow" d="M282 500 H344"/><rect class="mask" x="293.8" y="476" width="38.5" height="21" rx="4"/><text class="lab" x="313" y="491" text-anchor="middle">발행</text>
  <path class="dash" d="M216 552 H88"/>
  <rect class="mask" x="113.3" y="528" width="77.5" height="21" rx="4"/><text class="lab" x="152" y="543" text-anchor="middle">Ack · 순번</text>
  <path class="flow" d="M344 600 H472"/><rect class="mask" x="368.0" y="576" width="80.0" height="21" rx="4"/><text class="lab" x="408" y="591" text-anchor="middle">Broadcast</text>
  <rect class="node" x="414" y="624" width="116" height="64" rx="6"/><text class="small" x="472" y="651.1" text-anchor="middle">Y.apply</text><text class="small" x="472" y="670.1" text-anchor="middle">Update()</text>
  <text class="small" x="280" y="790" text-anchor="middle">Realtime으로 보였다 ≠ 저장됐다 · Ack 전엔 "저장 완료" 표시 X</text>
  <rect class="focal" x="24" y="816" width="22" height="16" rx="3"/><text class="small" x="54" y="829">저장 판정</text><path class="flow" d="M132.97 824 H158.97"/><text class="small" x="166.97" y="829">요청·전달</text><path class="dash" d="M249.315 824 H275.315"/><text class="small" x="283.315" y="829">응답(Ack)</text>
</svg>
