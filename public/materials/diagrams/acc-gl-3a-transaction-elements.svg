<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 896" role="img" aria-labelledby="acc-gl-3a-transaction-elements-title acc-gl-3a-transaction-elements-desc">
  <title id="acc-gl-3a-transaction-elements-title">거래요소의 결합관계</title>
  <desc id="acc-gl-3a-transaction-elements-desc">왼쪽 차변 칸에 자산의 증가, 부채의 감소, 자본의 감소, 비용의 발생을, 오른쪽 대변 칸에 자산의 감소, 부채의 증가, 자본의 증가, 수익의 발생을 놓고 같은 금액으로 짝짓는다는 화살표를 둔 그림. 아래 4×4 표는 ㈜바람돌이 1월 거래 ①부터 ⑩이 어느 결합에 해당하는지 보여 준다</desc>
  <defs><marker id="acc-gl-3a-transaction-elements-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-3a-transaction-elements-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-3a-transaction-elements-a)}.flow.both{marker-start:url(#acc-gl-3a-transaction-elements-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-3a-transaction-elements-m)}.dash.both{marker-start:url(#acc-gl-3a-transaction-elements-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="896"/>
  <text class="tag" x="24" y="40">3장 · 3-2 거래요소의 결합관계와 계정</text><text class="title" x="24" y="74">거래요소의 결합관계</text><text class="subtitle" x="24" y="104">모든 거래는 차변 요소 하나 이상과 대변 요소 하나 이상이</text><text class="subtitle" x="24" y="124">같은 금액으로 짝을 이룬다 (자료 3-1)</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="170" width="240" height="262" rx="8"/><rect class="zone" x="304" y="170" width="240" height="262" rx="8"/><text class="small" x="136" y="192" text-anchor="middle">차변 (debit · 왼쪽)</text><text class="small" x="424" y="192" text-anchor="middle">대변 (credit · 오른쪽)</text><rect class="node" x="28" y="206" width="216" height="46" rx="6"/><text class="name" x="136.0" y="235.8" text-anchor="middle">자산의 증가</text><rect class="node" x="316" y="206" width="216" height="46" rx="6"/><text class="name" x="424.0" y="235.8" text-anchor="middle">자산의 감소</text><rect class="node" x="28" y="262" width="216" height="46" rx="6"/><text class="name" x="136.0" y="291.8" text-anchor="middle">부채의 감소</text><rect class="node" x="316" y="262" width="216" height="46" rx="6"/><text class="name" x="424.0" y="291.8" text-anchor="middle">부채의 증가</text><rect class="node" x="28" y="318" width="216" height="46" rx="6"/><text class="name" x="136.0" y="347.8" text-anchor="middle">자본의 감소</text><rect class="node" x="316" y="318" width="216" height="46" rx="6"/><text class="name" x="424.0" y="347.8" text-anchor="middle">자본의 증가</text><rect class="node" x="28" y="374" width="216" height="46" rx="6"/><text class="name" x="136.0" y="403.8" text-anchor="middle">비용의 발생</text><rect class="node" x="316" y="374" width="216" height="46" rx="6"/><text class="name" x="424.0" y="403.8" text-anchor="middle">수익의 발생</text><path class="flow both" d="M136 432 L136 458 L424 458 L424 432"/><rect class="mask" x="204.2" y="448" width="151.5" height="22" rx="4"/><text class="lab" x="280" y="463" text-anchor="middle">같은 금액으로 짝짓기</text><text class="small" x="24" y="496">㈜바람돌이 1월 거래 ①–⑩의 위치 (행 = 차변, 열 = 대변)</text><rect class="zone" x="24" y="510" width="112" height="40" rx="0"/><text class="small" x="80.0" y="535" text-anchor="middle">차변 \ 대변</text><rect class="zone" x="136" y="510" width="100" height="40" rx="0"/><text class="lab" x="186.0" y="535" text-anchor="middle">자산 감소</text><rect class="zone" x="236" y="510" width="100" height="40" rx="0"/><text class="lab" x="286.0" y="535" text-anchor="middle">부채 증가</text><rect class="zone" x="336" y="510" width="100" height="40" rx="0"/><text class="lab" x="386.0" y="535" text-anchor="middle">자본 증가</text><rect class="zone" x="436" y="510" width="100" height="40" rx="0"/><text class="lab" x="486.0" y="535" text-anchor="middle">수익 발생</text><rect class="zone" x="24" y="550" width="112" height="40" rx="0"/><text class="lab" x="80.0" y="575" text-anchor="middle">자산 증가</text><rect class="deep" x="136" y="550" width="100" height="40" rx="0"/><text class="name" x="186.0" y="576" text-anchor="middle">⑧</text><rect class="deep" x="236" y="550" width="100" height="40" rx="0"/><text class="name" x="286.0" y="576" text-anchor="middle">② ④</text><rect class="deep" x="336" y="550" width="100" height="40" rx="0"/><text class="name" x="386.0" y="576" text-anchor="middle">①</text><rect class="deep" x="436" y="550" width="100" height="40" rx="0"/><text class="name" x="486.0" y="576" text-anchor="middle">⑤ ⑥ ⑦</text><rect class="zone" x="24" y="590" width="112" height="40" rx="0"/><text class="lab" x="80.0" y="615" text-anchor="middle">부채 감소</text><rect class="deep" x="136" y="590" width="100" height="40" rx="0"/><text class="name" x="186.0" y="616" text-anchor="middle">⑨</text><rect class="node" x="236" y="590" width="100" height="40" rx="0"/><text class="small" x="286.0" y="616" text-anchor="middle">·</text><rect class="node" x="336" y="590" width="100" height="40" rx="0"/><text class="small" x="386.0" y="616" text-anchor="middle">·</text><rect class="node" x="436" y="590" width="100" height="40" rx="0"/><text class="small" x="486.0" y="616" text-anchor="middle">·</text><rect class="zone" x="24" y="630" width="112" height="40" rx="0"/><text class="lab" x="80.0" y="655" text-anchor="middle">자본 감소</text><rect class="node" x="136" y="630" width="100" height="40" rx="0"/><text class="small" x="186.0" y="656" text-anchor="middle">·</text><rect class="node" x="236" y="630" width="100" height="40" rx="0"/><text class="small" x="286.0" y="656" text-anchor="middle">·</text><rect class="node" x="336" y="630" width="100" height="40" rx="0"/><text class="small" x="386.0" y="656" text-anchor="middle">·</text><rect class="node" x="436" y="630" width="100" height="40" rx="0"/><text class="small" x="486.0" y="656" text-anchor="middle">·</text><rect class="zone" x="24" y="670" width="112" height="40" rx="0"/><text class="lab" x="80.0" y="695" text-anchor="middle">비용 발생</text><rect class="deep" x="136" y="670" width="100" height="40" rx="0"/><text class="name" x="186.0" y="696" text-anchor="middle">③ ⑩</text><rect class="node" x="236" y="670" width="100" height="40" rx="0"/><text class="small" x="286.0" y="696" text-anchor="middle">·</text><rect class="node" x="336" y="670" width="100" height="40" rx="0"/><text class="small" x="386.0" y="696" text-anchor="middle">·</text><rect class="node" x="436" y="670" width="100" height="40" rx="0"/><text class="small" x="486.0" y="696" text-anchor="middle">·</text><rect class="focal" x="24" y="730" width="512" height="74" rx="6"/><text class="body inv" x="280.0" y="761.5" text-anchor="middle">자산·비용은 차변 쪽, 부채·자본·수익은 대변 쪽 요소</text><text class="body inv" x="280.0" y="783.5" text-anchor="middle">늘거나 발생하면 제자리, 줄어들면 반대편에 적는다</text><path class="flow" d="M24 834 H54"/><text class="small" x="62" y="839">흐름·결합</text><rect class="focal" x="154" y="826" width="22" height="16" rx="3"/><text class="small" x="184" y="839">중심 개념</text><rect class="deep" x="276" y="826" width="22" height="16" rx="3"/><text class="small" x="306" y="839">사례가 있는 결합</text><rect class="zone" x="24" y="852" width="22" height="16" rx="3"/><text class="small" x="54" y="865">범위·묶음</text>
</svg>
