<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" role="img" aria-labelledby="acc-gl-2b-fs-elements-title acc-gl-2b-fs-elements-desc">
  <title id="acc-gl-2b-fs-elements-title">재무제표 요소 다섯 가지와 자본</title>
  <desc id="acc-gl-2b-fs-elements-desc">재무상태표 요소인 자산은 차변(왼쪽), 부채와 자본은 대변(오른쪽)에 놓이며 자산에서 부채를 뺀 잔여지분이 자본이다. 손익계산서 요소인 수익은 자산 증가나 부채 감소로 자본을 늘리고, 비용은 자산 감소나 부채 증가로 자본을 줄인다. 주주의 출자와 주주에 대한 분배(배당)도 자본을 바꾸지만 수익과 비용에서는 제외된다.</desc>
  <defs><marker id="acc-gl-2b-fs-elements-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-2b-fs-elements-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-2b-fs-elements-a)}.flow.both{marker-start:url(#acc-gl-2b-fs-elements-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-2b-fs-elements-m)}.dash.both{marker-start:url(#acc-gl-2b-fs-elements-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#b9b6ac;stroke-width:1.2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="960"/>
  <text class="tag" x="24" y="40">2장 · 2-2 재무제표 요소</text><text class="title" x="24" y="74">재무제표 요소 다섯 가지와 자본</text><text class="subtitle" x="24" y="104">자산·부채·자본은 시점의 잔액, 수익·비용은 기간 동안 자본을 바꾼 원인이다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="zone" x="16" y="150" width="528" height="330" rx="8"/><text class="small" x="28" y="172">재무상태표 요소 · 일정 시점 · 자산 = 부채 + 자본</text><rect class="node" x="24" y="186" width="250" height="282" rx="6"/><text class="small" x="38" y="212">차변 (왼쪽) · Assets</text><text class="name" x="38" y="238">자산</text><text class="body" x="38" y="270">과거 사건의 결과로</text><text class="body" x="38" y="292">기업이 통제하는</text><text class="body" x="38" y="314">현재의 경제적 자원</text><text class="small" x="38" y="348">경제적 자원 = 효익 창출</text><text class="small" x="38" y="366">잠재력을 지닌 권리</text><text class="body" x="38" y="400">예: 현금 · 매출채권 ·</text><text class="body" x="38" y="422">재고자산 · 유형자산</text><text class="small" x="38" y="452">경영능력·인적자산은 제외</text><rect class="node" x="286" y="186" width="250" height="140" rx="6"/><text class="small" x="300" y="212">대변 (오른쪽) · Liabilities</text><text class="name" x="300" y="238">부채</text><text class="body" x="300" y="266">경제적 자원을 이전해야</text><text class="body" x="300" y="288">하는 현재의무</text><text class="small" x="300" y="314">예: 매입채무 · 차입금 · 미지급금</text><rect class="focal" x="286" y="336" width="250" height="132" rx="6"/><text class="small inv" x="300" y="360">대변 (오른쪽) · Equity</text><text class="name inv" x="300" y="384">자본</text><text class="body inv" x="300" y="412">자산 − 부채 = 잔여지분</text><text class="small inv" x="300" y="434">주주지분 · 자기자본 · 순자산</text><text class="body inv" x="300" y="456">예: 자본금 · 이익잉여금</text><rect class="zone" x="16" y="532" width="528" height="236" rx="8"/><text class="small" x="28" y="554">손익계산서 요소 · 기간</text><rect class="node" x="286" y="568" width="250" height="188" rx="6"/><text class="small" x="300" y="594">대변 (오른쪽) · Revenue</text><text class="name" x="300" y="620">수익</text><text class="body" x="300" y="650">자산 증가 또는</text><text class="body" x="300" y="672">부채 감소</text><text class="body" x="300" y="704">예: 매출 · 이자수익 ·</text><text class="body" x="300" y="726">토지처분이익</text><text class="small" x="300" y="748">주주의 출자는 제외</text><rect class="node" x="24" y="568" width="250" height="188" rx="6"/><text class="small" x="38" y="594">차변 (왼쪽) · Expense</text><text class="name" x="38" y="620">비용</text><text class="body" x="38" y="650">자산 감소 또는</text><text class="body" x="38" y="672">부채 증가</text><text class="body" x="38" y="704">예: 매출원가 · 이자비용 ·</text><text class="body" x="38" y="726">판매수수료</text><text class="small" x="38" y="748">주주에 대한 분배는 제외</text><path class="flow" d="M200 568 V506 H400 V470"/><rect class="mask" x="246.3" y="495" width="107.4" height="22" rx="4"/><text class="lab" x="300" y="511" text-anchor="middle">자본 감소 (−)</text><path class="flow" d="M470 568 V470"/><rect class="mask" x="416.3" y="505" width="107.4" height="22" rx="4"/><text class="lab" x="470" y="521" text-anchor="middle">자본 증가 (+)</text><rect class="outside" x="24" y="800" width="512" height="90" rx="6"/><text class="small" x="280.0" y="824" text-anchor="middle">주주와의 거래 · 수익·비용이 아님</text><text class="body" x="280.0" y="852" text-anchor="middle">유상증자(출자)는 자본 증가, 현금배당(분배)은 자본 감소</text><text class="body" x="280.0" y="876" text-anchor="middle">→ 자본은 바뀌지만 이익 계산에는 넣지 않는다</text><path class="dash" d="M524 800 V780 H548 V398 H538"/><rect class="mask" x="462.0" y="779" width="76.0" height="22" rx="4"/><text class="lab" x="500" y="795" text-anchor="middle">직접 증감</text><path class="flow" d="M24 924 H54"/><text class="small" x="62" y="929">자본을 바꿈</text><path class="dash" d="M159.8 924 H189.8"/><text class="small" x="197.8" y="929">주주와의 거래</text><rect class="focal" x="309.2" y="916" width="22" height="16" rx="3"/><text class="small" x="339.2" y="929">중심 개념</text><rect class="outside" x="423.4" y="916" width="22" height="16" rx="3"/><text class="small" x="453.4" y="929">제외 항목</text>
</svg>
