  <rect class="focal" x="24" y="152" width="512" height="72" rx="6"/><text class="name inv" x="280" y="183.0" text-anchor="middle">학생회 공용 Google 계정</text><text class="body inv" x="280" y="204.5" text-anchor="middle">세 서비스의 소유자 · 2단계 인증</text>
  <rect class="node" x="24" y="272" width="160" height="88" rx="6"/><text class="lab" x="104" y="301.8" text-anchor="middle">GitHub</text><text class="small" x="104" y="321.1" text-anchor="middle">Organization</text><text class="small" x="104" y="340.1" text-anchor="middle">공개 저장소</text>
  <rect class="node" x="200" y="272" width="160" height="88" rx="6"/><text class="lab" x="280" y="301.8" text-anchor="middle">Vercel</text><text class="small" x="280" y="321.1" text-anchor="middle">Hobby</text><text class="small" x="280" y="340.1" text-anchor="middle">배포 · 도메인</text>
  <rect class="node" x="376" y="272" width="160" height="88" rx="6"/><text class="lab" x="456" y="301.8" text-anchor="middle">Supabase</text><text class="small" x="456" y="321.1" text-anchor="middle">Free · 2개</text><text class="small" x="456" y="340.1" text-anchor="middle">운영 · 개발</text>
  <rect class="zone" x="24" y="392" width="160" height="88" rx="6"/><text class="lab" x="104" y="421.8" text-anchor="middle">소유자 2명+</text><text class="small" x="104" y="441.1" text-anchor="middle">개발자 = Member</text><text class="small" x="104" y="460.1" text-anchor="middle">졸업 → 제거</text>
  <rect class="zone" x="200" y="392" width="160" height="88" rx="6"/><text class="lab" x="280" y="421.8" text-anchor="middle">배포 토큰</text><text class="small" x="280" y="441.1" text-anchor="middle">→ GitHub</text><text class="small" x="280" y="460.1" text-anchor="middle">Secrets</text>
  <rect class="zone" x="376" y="392" width="160" height="88" rx="6"/><text class="lab" x="456" y="421.8" text-anchor="middle">DB 키</text><text class="small" x="456" y="441.1" text-anchor="middle">→ Vercel</text><text class="small" x="456" y="460.1" text-anchor="middle">환경변수</text>
  <text class="small" x="280" y="524" text-anchor="middle">비밀번호 · 복구 코드는 회장단 인수인계 항목</text>
  <text class="small" x="280" y="546" text-anchor="middle">기수 교대 때 비밀번호와 토큰을 바꾼다 (07-3)</text>
