<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 990" role="img" aria-labelledby="adsp-l03c-bigdata-method-title adsp-l03c-bigdata-method-desc">
  <title id="adsp-l03c-bigdata-method-title">빅데이터 분석 방법론 5단계</title>
  <desc id="adsp-l03c-bigdata-method-desc">분석 기획, 데이터 준비, 데이터 분석, 시스템 구현, 평가 및 전개의 다섯 단계를 위에서 아래로 놓고 각 단계의 태스크를 적은 그림. 분석 기획에서 SOW와 WBS, 위험 대응 계획이 나오고, 데이터 분석 중 데이터가 부족하면 데이터 준비로 되돌아간다. 시스템 구현은 단순 분석으로 끝나면 생략할 수 있다.</desc>
  <defs><marker id="adsp-l03c-bigdata-method-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l03c-bigdata-method-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l03c-bigdata-method-a)}.flow.both{marker-start:url(#adsp-l03c-bigdata-method-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l03c-bigdata-method-m)}.dash.both{marker-start:url(#adsp-l03c-bigdata-method-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="990"/>
  <text class="tag" x="24" y="40">ADsP · 2과목 1장 · 분석 방법론</text><text class="title" x="24" y="74">빅데이터 분석 방법론 5단계</text><text class="subtitle" x="24" y="104">단계(Phase) 안에 태스크(Task)가 있고, 산출물로 다음 단계를 연다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="focal" x="24" y="154" width="400" height="122" rx="6"/><text class="small inv" x="40" y="176">Planning</text><text class="name inv" x="40" y="200">① 분석 기획</text><text class="task inv" x="40" y="226">· 비즈니스 이해·범위 설정 → <tspan class="b">SOW</tspan></text><text class="task inv" x="40" y="248">· 프로젝트 정의·계획 수립 → <tspan class="b">WBS</tspan></text><text class="task inv" x="40" y="270">· 위험계획 수립 → 회피·전이·완화·수용</text><rect class="node" x="24" y="308" width="400" height="122" rx="6"/><text class="small" x="40" y="330">Preparing</text><text class="name" x="40" y="354">② 데이터 준비</text><text class="task" x="40" y="380">· 필요 데이터 정의</text><text class="task" x="40" y="402">· 데이터 스토어 설계 (정형·비정형)</text><text class="task" x="40" y="424">· 데이터 수집 및 정합성 점검</text><rect class="node" x="24" y="462" width="400" height="122" rx="6"/><text class="small" x="40" y="484">Analyzing</text><text class="name" x="40" y="508">③ 데이터 분석</text><text class="task" x="40" y="534">· 분석용 데이터 준비 · 텍스트 분석</text><text class="task" x="40" y="556">· 탐색적 분석 · 모델링</text><text class="task" x="40" y="578">· 모델 평가 및 검증</text><rect class="outside" x="24" y="616" width="400" height="100" rx="6"/><text class="small" x="40" y="638">Developing</text><text class="name" x="40" y="662">④ 시스템 구현</text><text class="task" x="40" y="688">· 설계 및 구현</text><text class="task" x="40" y="710">· 시스템 테스트 및 운영</text><text class="small" x="410" y="638" text-anchor="end">단순 분석이면 생략 가능</text><rect class="node" x="24" y="748" width="400" height="100" rx="6"/><text class="small" x="40" y="770">Deploying</text><text class="name" x="40" y="794">⑤ 평가 및 전개</text><text class="task" x="40" y="820">· 모델 발전 계획 수립</text><text class="task" x="40" y="842">· 프로젝트 평가 및 보고</text><path class="flow" d="M224 276 L224 308"/><path class="flow" d="M224 430 L224 462"/><path class="flow" d="M224 584 L224 616"/><path class="flow" d="M224 716 L224 748"/><path class="dash" d="M424 502 H478 V368 H424"/><rect class="mask" x="435.1" y="424" width="85.8" height="22" rx="4"/><text class="lab" x="478" y="440" text-anchor="middle">데이터 부족</text><text class="small" x="24" y="882">산출물 SOW(작업 명세서)·WBS(작업 분할 구조)는 데이터 준비가</text><text class="small" x="24" y="902">아니라 분석 기획 단계에서 나온다.</text><path class="flow" d="M24 934 H54"/><text class="small" x="62" y="939">진행 순서</text><path class="dash" d="M138.32 934 H168.32"/><text class="small" x="176.32" y="939">피드백(되돌아감)</text><rect class="focal" x="303.94" y="926" width="22" height="16" rx="3"/><text class="small" x="333.94" y="939">SOW·WBS 단계</text><rect class="outside" x="24" y="952" width="22" height="16" rx="3"/><text class="small" x="54" y="965">생략 가능 단계</text>
</svg>
