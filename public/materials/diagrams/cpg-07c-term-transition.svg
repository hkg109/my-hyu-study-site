<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" role="img" aria-labelledby="cpg-07c-term-transition-title cpg-07c-term-transition-desc">
  <title id="cpg-07c-term-transition-title">새 기수로 넘어가는 다섯 단계</title>
  <desc id="cpg-07c-term-transition-desc">새 Term을 DRAFT로 만들고 첫 EXECUTIVE를 등록한 뒤, 새 회장단이 부서와 승인 계정을 준비하고, 한 트랜잭션에서 이전 Term을 CLOSED, 새 Term을 ACTIVE로 바꾸며 이전 Membership을 종료하고, Realtime 재구독 신호를 보낸 다음, 필요한 과거 자료만 기간이 있는 Archive Grant로 열어 주는 순서.</desc>
  <defs><marker id="cpg-07c-term-transition-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-07c-term-transition-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-07c-term-transition-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-07c-term-transition-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="760"/>
  <text class="tag" x="24" y="40">7편 · Term 전환</text><text class="title" x="24" y="74">새 기수로 넘어가는 다섯 단계</text><text class="subtitle" x="24" y="104">새 Term은 빈 상태로 시작한다. 자동 복제는 없다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <path class="flow" d="M280 232 V256"/>
  <path class="flow" d="M280 336 V360"/>
  <path class="flow" d="M280 480 V504"/>
  <path class="flow" d="M280 568 V592"/>
  <rect class="node" x="24" y="152" width="512" height="80" rx="6"/><text class="name" x="280" y="187.0" text-anchor="middle">① 새 Term을 DRAFT로</text><text class="body" x="280" y="208.5" text-anchor="middle">검증된 절차로 첫 EXECUTIVE 등록</text>
  <rect class="node" x="24" y="256" width="512" height="80" rx="6"/><text class="name" x="280" y="291.0" text-anchor="middle">② 새 회장단이 준비</text><text class="body" x="280" y="312.5" text-anchor="middle">부서 · 직책 · 승인 계정 · Template</text>
  <rect class="focal" x="24" y="360" width="512" height="120" rx="6"/><text class="name inv" x="280" y="394.0" text-anchor="middle">③ 전환 트랜잭션 (전부 아니면 전무)</text><text class="body inv" x="280" y="415.5" text-anchor="middle">이전 Term → CLOSED · 새 Term → ACTIVE</text><text class="body inv" x="280" y="436.5" text-anchor="middle">이전 Membership 종료 (left_at)</text><text class="body inv" x="280" y="457.5" text-anchor="middle">미처리 건의: 정한 정책대로 이월 또는 마감</text>
  <rect class="node" x="24" y="504" width="512" height="64" rx="6"/><text class="name" x="280" y="541.5" text-anchor="middle">④ 열린 Realtime 연결에 재구독 신호</text>
  <rect class="deep" x="24" y="592" width="512" height="80" rx="6"/><text class="name" x="280" y="628.0" text-anchor="middle">⑤ 필요하면 Archive Grant</text><text class="small" x="280" y="648.1" text-anchor="middle">TERM · EVENT · DEPARTMENT · HANDOVER + 만료 · 회수</text>
  <rect class="focal" x="24" y="708" width="22" height="16" rx="3"/><text class="small" x="54" y="721">한 번에 처리</text><rect class="deep" x="150.25" y="708" width="22" height="16" rx="3"/><text class="small" x="180.25" y="721">과거 자료 읽기</text><rect class="node" x="289.73" y="708" width="22" height="16" rx="3"/><text class="small" x="319.73" y="721">준비·후속 단계</text>
</svg>
