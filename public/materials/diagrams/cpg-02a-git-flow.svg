<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" role="img" aria-labelledby="cpg-02a-git-flow-title cpg-02a-git-flow-desc">
  <title id="cpg-02a-git-flow-title">변경 하나가 main에 들어가는 길</title>
  <desc id="cpg-02a-git-flow-desc">Issue 작성, Branch 생성, Commit, Pull Request, 리뷰, Merge의 여섯 단계를 위에서 아래로 놓고, 리뷰에서 수정 요청이 나오면 Commit 단계로 되돌아가는 고리를 표시한 그림.</desc>
  <defs><marker id="cpg-02a-git-flow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-02a-git-flow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-02a-git-flow-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-02a-git-flow-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="760"/>
  <text class="tag" x="24" y="40">07-2 · Git 협업</text><text class="title" x="24" y="74">변경 하나가 main에 들어가는 길</text><text class="subtitle" x="24" y="104">누가, 무엇을, 왜 바꿨는지가 단계마다 기록으로 남는다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <path class="flow" d="M200 208 V240"/>
  <path class="flow" d="M200 296 V328"/>
  <path class="flow" d="M200 384 V416"/>
  <path class="flow" d="M200 488 V520"/>
  <path class="flow" d="M200 576 V608"/><rect class="mask" x="208.0" y="582" width="38.5" height="21" rx="4"/><text class="lab" x="214" y="597">승인</text>
  <path class="flow" d="M376 548 H448 Q456 548 456 540 V364 Q456 356 448 356 H376"/>
  <rect class="mask" x="464.0" y="443" width="69.0" height="21" rx="4"/><text class="lab" x="470" y="458">수정 요청</text>
  <rect class="node" x="24" y="152" width="352" height="56" rx="6"/><text class="name" x="200" y="175.0" text-anchor="middle">Issue</text><text class="body" x="200" y="196.5" text-anchor="middle">목적과 완료 기준을 먼저 적는다</text>
  <rect class="node" x="24" y="240" width="352" height="56" rx="6"/><text class="name" x="200" y="263.0" text-anchor="middle">Branch</text><text class="body" x="200" y="284.5" text-anchor="middle">main과 분리된 작업 줄기</text>
  <rect class="node" x="24" y="328" width="352" height="56" rx="6"/><text class="name" x="200" y="351.0" text-anchor="middle">Commit</text><text class="body" x="200" y="372.5" text-anchor="middle">의미 있는 변경 한 번 + 이유</text>
  <rect class="focal" x="24" y="416" width="352" height="72" rx="6"/><text class="name inv" x="200" y="436.5" text-anchor="middle">Pull Request</text><text class="body inv" x="200" y="458.0" text-anchor="middle">실행 방법 · 화면 결과</text><text class="body inv" x="200" y="479.0" text-anchor="middle">허용·거부 테스트 결과</text>
  <rect class="node" x="24" y="520" width="352" height="56" rx="6"/><text class="name" x="200" y="543.0" text-anchor="middle">리뷰</text><text class="body" x="200" y="564.5" text-anchor="middle">다른 팀원이 읽고 Preview에서 실행</text>
  <rect class="deep" x="24" y="608" width="352" height="56" rx="6"/><text class="name" x="200" y="631.0" text-anchor="middle">Merge</text><text class="body" x="200" y="652.5" text-anchor="middle">main은 항상 실행 가능한 상태</text>
  <text class="small" x="280" y="700" text-anchor="middle">DB 마이그레이션·RLS 정책은 작성자 외 한 명이 꼭 검토</text>
  <rect class="focal" x="24" y="724" width="22" height="16" rx="3"/><text class="small" x="54" y="737">검토의 중심</text><rect class="deep" x="146.2" y="724" width="22" height="16" rx="3"/><text class="small" x="176.2" y="737">공유되는 결과</text><path class="flow" d="M281.63 732 H307.63"/><text class="small" x="315.63" y="737">다음 단계</text>
</svg>
