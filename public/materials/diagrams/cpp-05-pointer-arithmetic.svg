<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" role="img" aria-labelledby="cpp-05-pointer-arithmetic-title cpp-05-pointer-arithmetic-desc">
  <title id="cpp-05-pointer-arithmetic-title">ptr + 1은 1바이트가 아니라 원소 한 칸</title>
  <desc id="cpp-05-pointer-arithmetic-desc">int 배열 a의 다섯 칸 위에 ptr이 a[0]을 가리키고, ptr+2는 두 칸 뒤 a[2], ptr+4는 a[4]를 가리키며 int는 4바이트라 주소는 8, 16바이트 뒤가 된다는 그림</desc>
  <defs>
    <marker id="cpp-05-pointer-arithmetic-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-05-pointer-arithmetic-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-05-pointer-arithmetic-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="384" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">05 · 포인터 연산</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">ptr + 1은 1바이트가 아니라 원소 한 칸</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <path d="M112 152 L112 188" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-05-pointer-arithmetic-m)"/><path d="M336 152 L336 188" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-05-pointer-arithmetic-m)"/><path d="M560 152 L560 188" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-05-pointer-arithmetic-m)"/><text x="112" y="140" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">ptr</text><text x="336" y="140" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">ptr + 2</text><text x="560" y="140" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">ptr + 4</text><rect x="56" y="188" width="112" height="44" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.4"/><text x="112" y="215" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">a[0]</text><text x="112" y="248" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+0 B</text><rect x="168" y="188" width="112" height="44" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="224" y="215" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">a[1]</text><text x="224" y="248" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+4 B</text><rect x="280" y="188" width="112" height="44" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.4"/><text x="336" y="215" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">a[2]</text><text x="336" y="248" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+8 B</text><rect x="392" y="188" width="112" height="44" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="448" y="215" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">a[3]</text><text x="448" y="248" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+12 B</text><rect x="504" y="188" width="112" height="44" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.4"/><text x="560" y="215" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">a[4]</text><text x="560" y="248" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+16 B</text><text x="32" y="284" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#1d1d1a">a[i] == *(a + i) == *(ptr + i) == ptr[i]</text><text x="32" y="312" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">배열 이름 a는 첫 원소 주소를 가진 고정 포인터라 a++는 안 되지만 ptr++는 된다.</text>
  <line x1="32" y1="336" x2="688" y2="336" stroke="#b9b6ac"/><path d="M32 358 H60" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-05-pointer-arithmetic-m)"/><text x="68" y="363" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">포인터가 가리키는 칸</text>
</svg>
