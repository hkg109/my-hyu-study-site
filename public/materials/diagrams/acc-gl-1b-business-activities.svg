<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1067" role="img" aria-labelledby="acc-gl-1b-business-activities-title acc-gl-1b-business-activities-desc">
  <title id="acc-gl-1b-business-activities-title">경제실체와 기업의 세 가지 경제활동</title>
  <desc id="acc-gl-1b-business-activities-desc">경제실체는 영리회계와 비영리회계로 나뉘고, 본 강의 대상은 주식회사다. 재무활동이 자금을 조달해 투자활동에 공급하고, 투자활동이 취득한 자산으로 영업활동이 수익을 창출하며, 영업활동에서 무엇을 파는가에 따라 서비스기업, 상기업, 제조기업으로 분류한다.</desc>
  <defs><marker id="acc-gl-1b-business-activities-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-1b-business-activities-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-1b-business-activities-a)}.flow.both{marker-start:url(#acc-gl-1b-business-activities-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-1b-business-activities-m)}.dash.both{marker-start:url(#acc-gl-1b-business-activities-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1067"/>
  <text class="tag" x="24" y="40">1장 · 1-2 경제실체와 경제활동</text><text class="title" x="24" y="74">경제실체와 기업의 세 가지 경제활동</text><text class="subtitle" x="24" y="104">자료 1-2 · 재무활동이 자금을 대고, 투자활동이 자산을 갖추고,</text><text class="subtitle" x="24" y="124">영업활동이 수익을 만든다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="24" y="174" width="512" height="210" rx="6"/><text class="small" x="36" y="194">경제실체 = 경제활동을 하는 모든 조직 (회계주체)</text><rect class="node" x="40" y="206" width="232" height="80" rx="6"/><text class="name" x="156.0" y="239.0" text-anchor="middle">영리회계</text><text class="body" x="156.0" y="262.0" text-anchor="middle">기업회계</text><rect class="node" x="288" y="206" width="232" height="80" rx="6"/><text class="name" x="404.0" y="239.0" text-anchor="middle">비영리회계</text><text class="body" x="404.0" y="262.0" text-anchor="middle">정부·학교·교회회계 등</text><rect class="focal" x="40" y="314" width="232" height="56" rx="6"/><text class="name inv" x="156.0" y="336.0" text-anchor="middle">주식회사</text><text class="small inv" x="156.0" y="359.0" text-anchor="middle">본 강의의 대상</text><path class="flow" d="M156 286 L156 314"/><rect class="mask" x="164.0" y="289" width="72.0" height="22" rx="4"/><text class="lab" x="200" y="305" text-anchor="middle">대표 형태</text><rect class="deep" x="288" y="314" width="232" height="56" rx="6"/><text class="body" x="404.0" y="336.0" text-anchor="middle">유한책임 · 주식 양도성</text><text class="body" x="404.0" y="357.0" text-anchor="middle">→ 계속기업(going concern)</text><path class="flow plain" d="M272 342 L288 342"/><rect class="node" x="64" y="432" width="432" height="96" rx="6"/><text class="small" x="280.0" y="463.5" text-anchor="middle">Financing</text><text class="name" x="280.0" y="482.5" text-anchor="middle">재무활동</text><text class="body" x="280.0" y="505.5" text-anchor="middle">필요 자금의 조달·상환 (납입자본·차입금)</text><rect class="node" x="64" y="582" width="432" height="96" rx="6"/><text class="small" x="280.0" y="613.5" text-anchor="middle">Investing</text><text class="name" x="280.0" y="632.5" text-anchor="middle">투자활동</text><text class="body" x="280.0" y="655.5" text-anchor="middle">자산 취득·유지·처분, 대여·회수</text><rect class="focal" x="64" y="732" width="432" height="96" rx="6"/><text class="small inv" x="280.0" y="763.5" text-anchor="middle">Operating · 주요 수익창출활동</text><text class="name inv" x="280.0" y="782.5" text-anchor="middle">영업활동</text><text class="body inv" x="280.0" y="805.5" text-anchor="middle">생산·판매, 구매·판매, 관리활동</text><path class="flow" d="M280 528 L280 582"/><rect class="mask" x="244.0" y="544" width="72.0" height="22" rx="4"/><text class="lab" x="280" y="560" text-anchor="middle">자금 공급</text><path class="flow" d="M280 678 L280 732"/><rect class="mask" x="213.9" y="694" width="132.3" height="22" rx="4"/><text class="lab" x="280" y="710" text-anchor="middle">자산(설비 등) 제공</text><path class="dash" d="M496 780 L522 780 L522 480 L496 480"/><rect class="mask" x="501.5" y="619" width="41.0" height="22" rx="4"/><text class="lab" x="522" y="635" text-anchor="middle">순환</text><text class="small" x="40" y="418" text-anchor="start">영업외활동 = 투자활동 + 재무활동</text><rect class="node" x="24" y="892" width="160" height="92" rx="6"/><text class="name" x="104.0" y="920.5" text-anchor="middle">서비스기업</text><text class="body" x="104.0" y="943.5" text-anchor="middle">서비스의</text><text class="body" x="104.0" y="964.5" text-anchor="middle">제공</text><rect class="node" x="200" y="892" width="160" height="92" rx="6"/><text class="name" x="280.0" y="920.5" text-anchor="middle">상기업</text><text class="body" x="280.0" y="943.5" text-anchor="middle">상품의</text><text class="body" x="280.0" y="964.5" text-anchor="middle">매입과 판매</text><rect class="node" x="376" y="892" width="160" height="92" rx="6"/><text class="name" x="456.0" y="920.5" text-anchor="middle">제조기업</text><text class="body" x="456.0" y="943.5" text-anchor="middle">제품의</text><text class="body" x="456.0" y="964.5" text-anchor="middle">제조와 판매</text><text class="small" x="280" y="1004" text-anchor="middle">상기업 = 상품매매기업</text><path class="flow" d="M280 828 L280 892"/><rect class="mask" x="208.2" y="849" width="143.6" height="22" rx="4"/><text class="lab" x="280" y="865" text-anchor="middle">무엇을 파는가로 분류</text><path class="flow" d="M24 1042 H54"/><text class="small" x="62" y="1047">자금·자산 흐름</text><path class="dash" d="M182.55 1042 H212.55"/><text class="small" x="220.55" y="1047">반복·순환</text><rect class="focal" x="310.05" y="1034" width="22" height="16" rx="3"/><text class="small" x="340.05" y="1047">중심 개념</text><rect class="zone" x="420.1" y="1034" width="22" height="16" rx="3"/><text class="small" x="450.1" y="1047">범위</text>
</svg>
