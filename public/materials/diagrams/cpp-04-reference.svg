<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img" aria-labelledby="cpp-04-reference-title cpp-04-reference-desc">
  <title id="cpp-04-reference-title">참조는 같은 메모리 칸의 또 다른 이름</title>
  <desc id="cpp-04-reference-desc">int count와 int &amp;blah = count가 같은 메모리 칸 하나를 가리키는 두 이름이라서 blah++ 하면 count도 바뀌고, 참조 매개변수 int &amp;x로 받은 함수가 호출한 쪽 변수를 직접 바꾼다는 그림</desc>
  <defs>
    <marker id="cpp-04-reference-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-04-reference-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-04-reference-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="412" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">04 · 참조</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">참조는 같은 메모리 칸의 또 다른 이름</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <path d="M176 156 L304 156 Q312 156 312 164 L312 172" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-04-reference-m)"/><path d="M176 236 L304 236 Q312 236 312 228 L312 220" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-04-reference-m)"/><rect x="32" y="132" width="144" height="48" rx="6" fill="#f7f6f2"/><rect x="32" y="132" width="144" height="48" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="104" y="161" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">count</text><rect x="32" y="212" width="144" height="48" rx="6" fill="#f7f6f2"/><rect x="32" y="212" width="144" height="48" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="104" y="241" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">blah (참조)</text><rect x="264" y="172" width="96" height="48" rx="6" fill="#f7f6f2"/><rect x="264" y="172" width="96" height="48" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><text x="312" y="203" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="18" font-weight="700" fill="#f7f6f2" text-anchor="middle">2</text><text x="376" y="192" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#1d1d1a">int count = 1;</text><text x="376" y="212" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#1d1d1a">int &amp;blah = count;</text><text x="376" y="232" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#1d1d1a">blah++;   // count도 2</text><text x="32" y="300" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">참조는 선언할 때 반드시 초기화하고, 다른 변수로 다시 연결할 수 없다.</text><text x="32" y="324" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">void add10(int &amp;x) 는 호출한 쪽 변수를 직접 바꾼다 (call by reference).</text>
  <line x1="32" y1="364" x2="688" y2="364" stroke="#b9b6ac"/><path d="M32 386 H60" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-04-reference-m)"/><text x="68" y="391" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">같은 칸을 가리킴</text><rect x="191.68" y="378" width="20" height="16" rx="3" fill="#1d1d1a"/><text x="223.68" y="391" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">실제 메모리 칸</text>
</svg>
