<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 838" role="img" aria-labelledby="mis-gl-5b-virtualization-cloud-title mis-gl-5b-virtualization-cloud-desc">
  <title id="mis-gl-5b-virtualization-cloud-title">가상화 → 자원 풀 → 클라우드, 그리고 엣지</title>
  <desc id="mis-gl-5b-virtualization-cloud-desc">하나의 물리 자원을 여러 논리 자원으로 쓰는 서버 가상화와 여러 물리 자원을 하나의 논리 자원으로 쓰는 소프트웨어 정의 스토리지가 가상화된 자원 풀을 만들고, 그 풀을 네트워크로 on-demand 제공하는 클라우드 컴퓨팅이 서비스 모델(IaaS·PaaS·SaaS)과 배치 모델(퍼블릭·프라이빗·하이브리드)의 두 축으로 나뉘며, 엣지 컴퓨팅이 일부 처리를 데이터 원천 가까이로 옮겨 클라우드를 최적화하는 그림</desc>
  <defs><marker id="mis-gl-5b-virtualization-cloud-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-5b-virtualization-cloud-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-5b-virtualization-cloud-a)}.flow.both{marker-start:url(#mis-gl-5b-virtualization-cloud-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-5b-virtualization-cloud-m)}.dash.both{marker-start:url(#mis-gl-5b-virtualization-cloud-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="838"/>
  <text class="tag" x="24" y="40">5장 · 5-3 모바일·양자·그린·가상화·클라우드 ②</text><text class="title" x="24" y="74">가상화 → 자원 풀 → 클라우드, 그리고 엣지</text><text class="subtitle" x="24" y="104">가상화가 만든 자원 풀을 네트워크로 빌려 주고 쓴 만큼 받는 것이 클라우드다.</text><text class="subtitle" x="24" y="124">서비스 모델과 배치 모델은 다른 축이다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="249" height="110" rx="6"/><text class="small" x="148.5" y="198" text-anchor="middle">1 → 여럿</text><text class="name" x="148.5" y="219" text-anchor="middle">서버 가상화</text><text class="body" x="148.5" y="246" text-anchor="middle">한 서버에서 여러 OS</text><text class="body" x="148.5" y="266.5" text-anchor="middle">가동률 15–20% → 70%</text><rect class="node" x="287" y="172" width="249" height="110" rx="6"/><text class="small" x="411.5" y="198" text-anchor="middle">여럿 → 1</text><text class="name" x="411.5" y="219" text-anchor="middle">SDS</text><text class="body" x="411.5" y="246" text-anchor="middle">여러 저장 장치를 하나처럼</text><text class="body" x="411.5" y="266.5" text-anchor="middle">범용 HW·클라우드로 대체</text><rect class="focal" x="24" y="362" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="388" text-anchor="middle">Cloud computing</text><text class="name inv" x="280" y="409" text-anchor="middle">클라우드 컴퓨팅</text><text class="body inv" x="280" y="436" text-anchor="middle">가상화된 자원 풀을 네트워크로 on-demand 제공, 쓴 만큼 지불</text><rect class="node" x="24" y="509.5" width="249" height="112.5" rx="6"/><text class="small" x="148.5" y="547" text-anchor="middle">서비스 모델 · 관리 범위</text><text class="name" x="148.5" y="568" text-anchor="middle">IaaS · PaaS · SaaS</text><text class="body" x="148.5" y="595" text-anchor="middle">운영 · 개발 · 사용</text><rect class="node" x="287" y="509.5" width="249" height="112.5" rx="6"/><text class="small" x="411.5" y="535.5" text-anchor="middle">배치 모델 · 소유와 위치</text><text class="name" x="411.5" y="556.5" text-anchor="middle">Public · Private ·</text><text class="name" x="411.5" y="579.5" text-anchor="middle">Hybrid</text><text class="body" x="411.5" y="606.5" text-anchor="middle">공유 · 전용 · 핵심은 자체</text><rect class="node" x="24" y="680" width="512" height="89.5" rx="6"/><text class="small" x="280" y="706" text-anchor="middle">Edge computing</text><text class="name" x="280" y="727" text-anchor="middle">데이터 원천 가까이에서 처리</text><text class="body" x="280" y="754" text-anchor="middle">지연·트래픽 ↓ — 클라우드를 대체하지 않고 최적화</text><path class="line" d="M280 451.5 V483.4"/><path class="line" d="M148.5 483.4 H411.5"/><path class="flow" d="M148.5 483.4 L148.5 509.5"/><path class="flow" d="M411.5 483.4 L411.5 509.5"/><rect class="mask" x="256.4" y="456.45" width="47.2" height="22" rx="4"/><text class="lab" x="280" y="472.45" text-anchor="middle">두 축</text><path class="flow" d="M280 622 L280 680"/><rect class="mask" x="196.4" y="640" width="167.1" height="22" rx="4"/><text class="lab" x="280" y="656" text-anchor="middle">일부 처리를 가장자리로</text><path class="line" d="M148.5 282 V310"/><path class="line" d="M411.5 282 V310"/><path class="line" d="M148.5 310 H411.5"/><path class="flow" d="M280 310 L280 362"/><rect class="mask" x="241.9" y="299" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="315" text-anchor="middle">자원 풀로</text><path class="flow" d="M24 793.5 H54"/><text class="small" x="62" y="798.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="785.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="798.5">중심 개념</text>
</svg>
