<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 950" role="img" aria-labelledby="acc-gl-3b-trial-balance-equation-title acc-gl-3b-trial-balance-equation-desc">
  <title id="acc-gl-3b-trial-balance-equation-title">회계등식에서 시산표식으로</title>
  <desc id="acc-gl-3b-trial-balance-equation-desc">자산 = 부채 + 자본 + (수익 − 비용)에서 비용을 왼쪽으로 옮겨 시산표식 자산 + 비용 = 부채 + 자본 + 수익을 얻고, 시산표의 차변에 자산과 비용, 대변에 부채·자본과 수익이 놓이는 모습을 보인다. 시산표의 윗부분은 재무상태표, 아랫부분은 포괄손익계산서가 되며, 이익은 이익잉여금으로 대체되어 재무상태표의 자본에 들어간다. 맨 아래에 ㈜바람돌이 수치 검산이 있다</desc>
  <defs><marker id="acc-gl-3b-trial-balance-equation-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-3b-trial-balance-equation-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-3b-trial-balance-equation-a)}.flow.both{marker-start:url(#acc-gl-3b-trial-balance-equation-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-3b-trial-balance-equation-m)}.dash.both{marker-start:url(#acc-gl-3b-trial-balance-equation-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="950"/>
  <text class="tag" x="24" y="40">3장 · 3-2 거래요소의 결합관계와 계정</text><text class="title" x="24" y="74">회계등식에서 시산표식으로</text><text class="subtitle" x="24" y="104">이익은 주주 자본에 대한 대가이므로 자본(이익잉여금)으로 대체된다.</text><text class="subtitle" x="24" y="124">대체 전에는 수익·비용이 따로 남아 시산표식이 된다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="170" width="512" height="72" rx="6"/><text class="small" x="280.0" y="198.8" text-anchor="middle">기중 · 이익을 자본에 대체하기 전</text><text class="name" x="280.0" y="222.8" text-anchor="middle">자산 = 부채 + 자본 + (수익 − 비용)</text><path class="flow" d="M280 242 L280 288"/><rect class="mask" x="197.5" y="255" width="165.0" height="22" rx="4"/><text class="lab" x="280" y="270" text-anchor="middle">비용을 왼쪽으로 옮긴다</text><rect class="focal" x="24" y="288" width="512" height="72" rx="6"/><text class="small inv" x="280.0" y="316.8" text-anchor="middle">시산표식</text><text class="name inv" x="280.0" y="340.8" text-anchor="middle">자산 + 비용 = 부채 + 자본 + 수익</text><path class="flow" d="M280 360 L280 406"/><rect class="mask" x="196.2" y="373" width="167.5" height="22" rx="4"/><text class="lab" x="280" y="388" text-anchor="middle">차변 | 대변으로 펼치면</text><rect class="node" x="24" y="406" width="512" height="156" rx="6"/><text class="small" x="280" y="428" text-anchor="middle">시산표</text><line class="rule" x1="24" y1="440" x2="536" y2="440"/><text class="lab" x="152" y="460" text-anchor="middle">차변</text><text class="lab" x="408" y="460" text-anchor="middle">대변</text><rect class="deep" x="25" y="506" width="510" height="55" rx="0"/><line class="rule" x1="280" y1="440" x2="280" y2="562"/><text class="name" x="152" y="492" text-anchor="middle">자산</text><text class="name" x="408" y="492" text-anchor="middle">부채 · 자본</text><text class="name" x="152" y="540" text-anchor="middle">비용</text><text class="name" x="408" y="540" text-anchor="middle">수익</text><path class="flow" d="M152 562 L152 620"/><rect class="mask" x="81.8" y="581" width="140.5" height="22" rx="4"/><text class="lab" x="152" y="596" text-anchor="middle">윗부분 (잔액 누적)</text><path class="flow" d="M408 562 L408 620"/><rect class="mask" x="331.0" y="581" width="154.0" height="22" rx="4"/><text class="lab" x="408" y="596" text-anchor="middle">아랫부분 (기간 손익)</text><rect class="node" x="24" y="620" width="240" height="74" rx="6"/><text class="name" x="144.0" y="652.8" text-anchor="middle">재무상태표</text><text class="body" x="144.0" y="674.5" text-anchor="middle">자산 | 부채 · 자본</text><rect class="node" x="296" y="620" width="240" height="74" rx="6"/><text class="name" x="416.0" y="652.8" text-anchor="middle">포괄손익계산서</text><text class="body" x="416.0" y="674.5" text-anchor="middle">비용 | 수익</text><path class="dash" d="M416 694 L416 720 L144 720 L144 694"/><rect class="mask" x="168.0" y="710" width="224.0" height="22" rx="4"/><text class="lab" x="280" y="725" text-anchor="middle">이익 → 이익잉여금(자본)에 대체</text><rect class="zone" x="24" y="756" width="512" height="104" rx="6"/><text class="small" x="280.0" y="790.8" text-anchor="middle">㈜바람돌이 20××년 1월 31일 수정전 시산표로 검산</text><text class="body" x="280.0" y="812.5" text-anchor="middle">자산 29,000 + 비용 2,600 = 31,600</text><text class="body" x="280.0" y="834.5" text-anchor="middle">부채 17,600 + 자본 10,000 + 수익 4,000 = 31,600</text><path class="flow" d="M24 888 H54"/><text class="small" x="62" y="893">흐름·결합</text><path class="dash" d="M154 888 H184"/><text class="small" x="192" y="893">대체(이익 이전)</text><rect class="focal" x="340" y="880" width="22" height="16" rx="3"/><text class="small" x="370" y="893">중심 개념</text><rect class="deep" x="24" y="906" width="22" height="16" rx="3"/><text class="small" x="54" y="919">손익 부분</text>
</svg>
