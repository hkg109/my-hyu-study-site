<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="mis-fig-5-02-title mis-fig-5-02-desc">
  <title id="mis-fig-5-02-title">Figure 5.2 Stages in IT Infrastructure Evolution</title>
  <desc id="mis-fig-5-02-desc">메인프레임·미니컴퓨터(1959), 개인용 컴퓨터(1981), 클라이언트/서버(1983), 엔터프라이즈 컴퓨팅(1992), 클라우드·모바일 컴퓨팅(2000)의 다섯 시대와 각 시대의 전형적 구성, 그리고 모든 시대가 현재까지 공존한다는 시간 막대</desc>
  <defs><marker id="mis-fig-5-02-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.line{stroke:#1d1d1a;stroke-width:1.6;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.dash{stroke:#929087;stroke-width:1.4;fill:none;stroke-dasharray:6 6}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-fig-5-02-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.ring{fill:none;stroke:#65645e;stroke-width:3}.bar{fill:#1d1d1a}.tag{font:600 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.label{font:500 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 12px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.inverse{fill:#f7f6f2}</style>
  <rect class="bg" width="1280" height="860"/>
  <text class="tag" x="64" y="52">5장 · Figure 5.2</text>
  <text class="title" x="64" y="92">Stages in IT Infrastructure Evolution</text>
  <text class="subtitle" x="64" y="122">IT 인프라의 다섯 시대 — 각 시대의 전형적인 컴퓨팅 구성과, 새 시대가 옛 시대를 없애지 않고 쌓인다는 점</text>
  <line class="rule" x1="64" y1="148" x2="1216" y2="148"/>

  <!-- Era 1 -->
  <rect class="node" x="64" y="176" width="224" height="380" rx="8"/>
  <text class="small" x="82" y="204">ERA 1 · 1959–현재</text>
  <text class="name" x="82" y="232">Mainframe /</text><text class="name" x="82" y="254">Minicomputer</text>
  <rect class="deep" x="82" y="272" width="188" height="108" rx="6"/>
  <rect class="focal" x="104" y="294" width="54" height="66" rx="4"/>
  <rect class="node" x="214" y="284" width="34" height="22" rx="3"/><rect class="node" x="214" y="315" width="34" height="22" rx="3"/><rect class="node" x="214" y="346" width="34" height="22" rx="3"/>
  <path class="line" d="M158 310 L214 295 M158 327 L214 326 M158 344 L214 357"/>
  <text class="label" x="82" y="410">중앙의 대형 컴퓨터가</text>
  <text class="label" x="82" y="432">모든 처리를 맡고,</text>
  <text class="label" x="82" y="454">단말기는 입출력만</text>
  <line class="rule" x1="82" y1="478" x2="270" y2="478"/>
  <text class="small" x="82" y="502">1958 IBM 메인프레임</text>
  <text class="small" x="82" y="522">1965 IBM 360 · DEC 미니</text>

  <!-- Era 2 -->
  <rect class="node" x="296" y="176" width="224" height="380" rx="8"/>
  <text class="small" x="314" y="204">ERA 2 · 1981–현재</text>
  <text class="name" x="314" y="232">Personal</text><text class="name" x="314" y="254">Computer</text>
  <rect class="deep" x="314" y="272" width="188" height="108" rx="6"/>
  <rect class="node" x="330" y="306" width="44" height="34" rx="3"/><rect class="node" x="386" y="306" width="44" height="34" rx="3"/><rect class="node" x="442" y="306" width="44" height="34" rx="3"/>
  <path class="soft" d="M352 340 V350 M408 340 V350 M464 340 V350"/>
  <text class="label" x="314" y="410">책상 위 독립형</text>
  <text class="label" x="314" y="432">(stand-alone) PC,</text>
  <text class="label" x="314" y="454">개인용 SW 급성장</text>
  <line class="rule" x1="314" y1="478" x2="502" y2="478"/>
  <text class="small" x="314" y="502">1981 IBM PC</text>
  <text class="small" x="314" y="522">Wintel PC가 표준</text>

  <!-- Era 3 -->
  <rect class="node" x="528" y="176" width="224" height="380" rx="8"/>
  <text class="small" x="546" y="204">ERA 3 · 1983–현재</text>
  <text class="name" x="546" y="232">Client/Server</text>
  <rect class="deep" x="546" y="272" width="188" height="108" rx="6"/>
  <ellipse class="ring" cx="640" cy="326" rx="70" ry="30"/>
  <rect class="node" x="560" y="300" width="36" height="28" rx="3"/><rect class="node" x="600" y="340" width="36" height="28" rx="3"/>
  <rect class="focal" x="680" y="292" width="34" height="56" rx="3"/>
  <text class="label" x="546" y="410">LAN으로 묶인 PC와</text>
  <text class="label" x="546" y="432">서버가 처리를 나눔</text>
  <text class="label" x="546" y="454">(2-tier · N-tier)</text>
  <line class="rule" x1="546" y1="478" x2="734" y2="478"/>
  <text class="small" x="546" y="502">원 그림의 고리 = LAN</text>
  <text class="small" x="546" y="522">네트워크·앱·웹 서버</text>

  <!-- Era 4 -->
  <rect class="node" x="760" y="176" width="224" height="380" rx="8"/>
  <text class="small" x="778" y="204">ERA 4 · 1992–현재</text>
  <text class="name" x="778" y="232">Enterprise</text><text class="name" x="778" y="254">Computing</text>
  <rect class="deep" x="778" y="272" width="188" height="108" rx="6"/>
  <ellipse class="ring" cx="822" cy="300" rx="30" ry="16"/><ellipse class="ring" cx="922" cy="300" rx="30" ry="16"/>
  <rect class="focal" x="796" y="332" width="40" height="36" rx="3"/>
  <circle class="node" cx="912" cy="350" r="18"/><text class="small" x="912" y="354" text-anchor="middle">Net</text>
  <path class="line" d="M836 350 L894 350 M822 316 L816 332 M922 316 L914 332 M852 300 L892 300"/>
  <text class="label" x="778" y="410">흩어진 네트워크·앱을</text>
  <text class="label" x="778" y="432">인터넷 표준(TCP/IP)</text>
  <text class="label" x="778" y="454">으로 전사 통합</text>
  <line class="rule" x1="778" y1="478" x2="966" y2="478"/>
  <text class="small" x="778" y="502">정보가 조직 안팎으로</text>
  <text class="small" x="778" y="522">자유롭게 흐름</text>

  <!-- Era 5 -->
  <rect class="node" x="992" y="176" width="224" height="380" rx="8"/>
  <text class="small" x="1010" y="204">ERA 5 · 2000–현재</text>
  <text class="name" x="1010" y="232">Cloud and</text><text class="name" x="1010" y="254">Mobile Computing</text>
  <rect class="deep" x="1010" y="272" width="188" height="108" rx="6"/>
  <ellipse class="zone" cx="1104" cy="316" rx="62" ry="26"/><ellipse class="zone" cx="1076" cy="306" rx="30" ry="20"/><ellipse class="zone" cx="1130" cy="304" rx="34" ry="22"/>
  <rect class="focal" x="1088" y="300" width="30" height="24" rx="3"/>
  <rect class="node" x="1026" y="350" width="30" height="20" rx="3"/><rect class="node" x="1092" y="350" width="14" height="22" rx="3"/><rect class="node" x="1150" y="350" width="28" height="20" rx="3"/>
  <path class="soft" d="M1041 350 L1070 334 M1099 350 L1101 340 M1164 350 L1140 334"/>
  <text class="label" x="1010" y="410">컴퓨팅 파워와 SW를</text>
  <text class="label" x="1010" y="432">인터넷으로 공급받음</text>
  <text class="label" x="1010" y="454">— 가장 빨리 성장</text>
  <line class="rule" x1="1010" y1="478" x2="1198" y2="478"/>
  <text class="small" x="1010" y="502">동인: 인터넷 대역폭 증가</text>
  <text class="small" x="1010" y="522">Google Apps · Salesforce</text>

  <!-- Coexistence bars -->
  <text class="name" x="64" y="606">모든 시대가 “to present” — 대체가 아니라 누적</text>
  <text class="sub" x="64" y="628">막대는 시작 연도부터 현재까지. 오늘날 기업에는 메인프레임과 클라우드가 함께 있다.</text>
  <text class="label" x="64" y="667">Mainframe · Mini</text><rect class="bar" x="379" y="653" width="790" height="18" rx="3"/>
  <text class="label" x="64" y="701">Personal Computer</text><rect class="bar" x="646" y="687" width="523" height="18" rx="3"/>
  <text class="label" x="64" y="735">Client/Server</text><rect class="bar" x="670" y="721" width="499" height="18" rx="3"/>
  <text class="label" x="64" y="769">Enterprise Computing</text><rect class="bar" x="779" y="755" width="390" height="18" rx="3"/>
  <text class="label" x="64" y="803">Cloud and Mobile</text><rect class="bar" x="876" y="789" width="293" height="18" rx="3"/>
  <text class="small inverse" x="389" y="666">1959</text><text class="small inverse" x="656" y="700">1981</text><text class="small inverse" x="680" y="734">1983</text><text class="small inverse" x="789" y="768">1992</text><text class="small inverse" x="886" y="802">2000</text>
  <path class="flow" d="M1172 731 H1206"/>
  <text class="small" x="1216" y="716" text-anchor="end">현재</text>
  <line class="rule" x1="330" y1="826" x2="1180" y2="826"/>
  <text class="small" x="391" y="846" text-anchor="middle">1960</text><text class="small" x="633" y="846" text-anchor="middle">1980</text><text class="small" x="876" y="846" text-anchor="middle">2000</text><text class="small" x="1119" y="846" text-anchor="middle">2020</text>
  <text class="small" x="1216" y="52" text-anchor="end">교재 그림 재구성</text>
</svg>
