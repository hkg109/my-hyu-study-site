<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 784" role="img" aria-labelledby="adsp-l07b-sst-decomposition-title adsp-l07b-sst-decomposition-desc">
  <title id="adsp-l07b-sst-decomposition-title">SST = SSR + SSE와 결정계수</title>
  <desc id="adsp-l07b-sst-decomposition-desc">점 8개의 산점도와 최소제곱 회귀선, 평균 수평선. 강조한 한 점에서 평균까지의 총 편차가 회귀선까지의 설명된 부분과 회귀선에서 점까지의 잔차로 나뉜다. 아래 막대는 SST 17.66가 SSR 14.70과 SSE 2.96로 나뉘는 모습이고 결정계수는 약 0.83다.</desc>
  <defs><marker id="adsp-l07b-sst-decomposition-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l07b-sst-decomposition-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l07b-sst-decomposition-a)}.flow.both{marker-start:url(#adsp-l07b-sst-decomposition-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l07b-sst-decomposition-m)}.dash.both{marker-start:url(#adsp-l07b-sst-decomposition-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="784"/>
  <style>.ax{stroke:#1d1d1a;stroke-width:1.5;fill:none}.grid{stroke:#b9b6ac;stroke-width:1;stroke-dasharray:3 4;fill:none}.cv{stroke:#1d1d1a;stroke-width:2.2;fill:none}.cvm{stroke:#65645e;stroke-width:2;fill:none;stroke-dasharray:7 5}.dot{fill:#1d1d1a}.dotm{fill:#65645e}.dotl{fill:#f7f6f2;stroke:#1d1d1a;stroke-width:1.5}.shd{fill:#1d1d1a}.shl{fill:#c9c5b9}.shs{fill:#e4e1d8}.ln{stroke:#1d1d1a;stroke-width:1.6;fill:none}.lnm{stroke:#65645e;stroke-width:1.4;fill:none}.lnd{stroke:#1d1d1a;stroke-width:1.6;stroke-dasharray:6 4;fill:none}.lnt{stroke:#1d1d1a;stroke-width:2;stroke-dasharray:2 3;fill:none}.thick{stroke:#1d1d1a;stroke-width:3;fill:none}.tick{font:400 12.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.bodyb{font:700 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 19px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style><text class="tag" x="24" y="40">ADsP · 3과목 2장 03 · 회귀분석</text><text class="title" x="24" y="74">SST = SSR + SSE와 결정계수</text><text class="subtitle" x="24" y="104">한 점의 편차를 회귀선이 설명한 부분과 남은 잔차로 나눈다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><path class="ax" d="M56 482 L336 482"/><path class="ax" d="M56 482 L56 166"/><text class="lab" x="336" y="502" text-anchor="end">x</text><text class="lab" x="46" y="176" text-anchor="end">y</text><path class="lnd" d="M56 347.3 L336 347.3"/><text class="small" x="64" y="339.3">평균 ȳ = 3.94</text><path class="cv" d="M65.6 463.8 L314.1 236.7"/><text class="lab" x="119.7" y="458.3">회귀선 ŷ</text><circle class="dotl" cx="81.5" cy="423" r="4.5"/><circle class="dotl" cx="113.3" cy="442.6" r="4.5"/><circle class="dotl" cx="145.2" cy="363.9" r="4.5"/><circle class="dotl" cx="177.1" cy="388.5" r="4.5"/><circle class="dotl" cx="208.9" cy="324.5" r="4.5"/><circle class="dotl" cx="240.8" cy="344.2" r="4.5"/><circle class="dotl" cx="272.7" cy="295" r="4.5"/><circle class="focal" cx="304.5" cy="196.6" r="6"/><text class="lab" x="294.5" y="201.6" text-anchor="end">y</text><text class="lab" x="292.5" y="241.4" text-anchor="end">ŷ</text><path class="lnm" d="M304.5 196.6 L304.5 347.3"/><circle class="dotl" cx="304.5" cy="245.4" r="3"/><path class="ln" d="M324.5 245.4 H330.5 V347.3 H324.5"/><path class="ln" d="M324.5 196.6 H330.5 V245.4 H324.5"/><path class="ln" d="M350.5 196.6 H356.5 V347.3 H350.5"/><path class="lnm" d="M312.5 196.6 H350.5" style="stroke-dasharray:2 3"/><path class="lnm" d="M312.5 245.4 H324.5" style="stroke-dasharray:2 3"/><path class="lnm" d="M312.5 347.3 H350.5" style="stroke-dasharray:2 3"/><path class="lnm" d="M332.5 221 L412 174.6"/><text class="lab" x="418" y="170.6">잔차</text><text class="small" x="418" y="188.6">y - ŷ → SSE</text><path class="lnm" d="M358.5 272 L412 270"/><text class="lab" x="418" y="266">총 편차</text><text class="small" x="418" y="284">y - ȳ → SST</text><path class="lnm" d="M332.5 296.3 L412 365.3"/><text class="lab" x="418" y="361.3">회귀가 설명</text><text class="small" x="418" y="379.3">ŷ - ȳ → SSR</text><text class="bodyb" x="24" y="522">이 그림의 자료 8개로 계산한 제곱합</text><rect class="deep" x="24" y="536" width="426.3" height="40" rx="0"/><rect class="node" x="450.3" y="536" width="85.7" height="40" rx="0"/><rect class="ln" x="24" y="536" width="512" height="40" rx="0"/><text class="lab" x="237.1" y="562" text-anchor="middle">SSR 14.70 · 회귀가 설명</text><text class="lab" x="493.1" y="562" text-anchor="middle">SSE 2.96</text><path class="ln" d="M24 582 V590 H536 V582"/><text class="lab" x="280" y="610" text-anchor="middle">SST 17.66 = SSR + SSE · 총 변동</text><rect class="focal" x="24" y="642" width="512" height="70" rx="6"/><text class="name inv" x="280" y="672" text-anchor="middle">R² = SSR ÷ SST = 1 - SSE ÷ SST</text><text class="body inv" x="280" y="696" text-anchor="middle">여기서는 14.70 ÷ 17.66 ≈ 0.83 → 변동의 83%를 설명</text><text class="small" x="24" y="740">최소제곱법(OLS)은 SSE가 가장 작아지는 직선을 고른다</text><text class="small" x="24" y="760">편차는 점마다 더해지고, 제곱합은 모든 점을 합쳐서 성립한다</text>
</svg>
