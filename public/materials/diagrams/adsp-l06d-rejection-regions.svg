  <title id="adsp-l06d-rejection-regions-title">양측검정과 단측검정의 기각역</title>
  <desc id="adsp-l06d-rejection-regions-desc">표준정규분포 두 개. 위는 양측검정으로 -1.96 아래와 +1.96 위의 양쪽 꼬리에 α/2 0.025씩 기각역이 있다. 아래는 우측 단측검정으로 1.645 위 오른쪽 꼬리에만 α 0.05의 기각역이 있다.</desc>
