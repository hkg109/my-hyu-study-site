  <text class="tag" x="24" y="40">2장 · 2-1 비즈니스 프로세스와 IT ①</text><text class="title" x="24" y="74">주문 이행은 세 부서를 가로지른다</text><text class="subtitle" x="24" y="104">Figure 2.1 · 한 주문이 영업 → 회계 → 생산 순서로 넘어가는</text><text class="subtitle" x="24" y="124">범기능(cross-functional) 프로세스</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="172" width="170.66666666666666" height="510" rx="8"/><text class="small" x="28" y="192">영업 Sales</text><rect class="zone" x="194.66666666666666" y="172" width="170.66666666666666" height="510" rx="8"/><text class="small" x="206.66666666666666" y="192">회계 Accounting</text><rect class="zone" x="373.3333333333333" y="172" width="170.66666666666666" height="510" rx="8"/><text class="small" x="385.3333333333333" y="192">생산 Production</text><rect class="node" x="24" y="206" width="154.66666666666666" height="46" rx="6"/><text class="name" x="101.33333333333333" y="234.5" text-anchor="middle">주문 생성</text><rect class="node" x="24" y="274" width="154.66666666666666" height="46" rx="6"/><text class="name" x="101.33333333333333" y="302.5" text-anchor="middle">주문 제출</text><rect class="node" x="202.66666666666666" y="342" width="154.66666666666666" height="46" rx="6"/><text class="name" x="280" y="370.5" text-anchor="middle">신용 확인</text><rect class="node" x="202.66666666666666" y="410" width="154.66666666666666" height="46" rx="6"/><text class="name" x="280" y="438.5" text-anchor="middle">신용 승인</text><rect class="node" x="202.66666666666666" y="478" width="154.66666666666666" height="46" rx="6"/><text class="name" x="280" y="506.5" text-anchor="middle">송장 생성</text><rect class="node" x="381.3333333333333" y="546" width="154.66666666666666" height="46" rx="6"/><text class="name" x="458.66666666666663" y="574.5" text-anchor="middle">제품 조립</text><rect class="node" x="381.3333333333333" y="614" width="154.66666666666666" height="46" rx="6"/><text class="name" x="458.66666666666663" y="642.5" text-anchor="middle">제품 배송</text><p