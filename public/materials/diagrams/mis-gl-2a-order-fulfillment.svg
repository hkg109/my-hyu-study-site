  <title id="mis-gl-2a-order-fulfillment-title">주문 이행은 세 부서를 가로지른다</title>
  <desc id="mis-gl-2a-order-fulfillment-desc">영업, 회계, 생산 세 기능 부서를 세로 열로 나누고, 주문 생성과 제출(영업), 신용 확인·승인과 송장 생성(회계), 제품 조립과 배송(생산)이 위에서 아래로 차례로 이어지는 수영 레인 그림</desc>
