<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" width="560" height="580" role="img" aria-labelledby="lm2-l14c-hadoop-title lm2-l14c-hadoop-desc">
  <title id="lm2-l14c-hadoop-title">HDFS와 YARN</title>
  <desc id="lm2-l14c-hadoop-desc">왼쪽 위 384MB 파일이 128MB 블록 A, B, C로 나뉜다. 오른쪽 위 검은 마스터 노드에는 메타데이터를 관리하는 네임노드와 YARN 자원 관리를 맡는 리소스매니저가 있다. 아래 데이터노드 세 대에는 블록 A, B, C가 각각 복제되어 저장되고, 각 노드에 노드매니저가 있으며 마스터로 하트비트와 블록 보고 점선을 보낸다.</desc>
  <defs><marker id="lm2-l14c-hadoop-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l14c-hadoop-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l14c-hadoop-a)}.flow.both{marker-start:url(#lm2-l14c-hadoop-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l14c-hadoop-m)}.dash.both{marker-start:url(#lm2-l14c-hadoop-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="580"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 3과목 3장</text><text class="title" x="24" y="74">하둡 — HDFS와 YARN</text><text class="subtitle" x="24" y="104">마스터는 위치만 기억하고, 블록은 데이터노드에 3벌씩 나뉘어 저장된다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="outside" x="24" y="170" width="150" height="96" rx="6"/><text class="lab" x="99" y="196" text-anchor="middle">큰 파일 (384MB)</text><rect class="deep" x="38" y="214" width="36" height="34" rx="4"/><text class="name" x="56" y="237" text-anchor="middle">A</text><rect class="deep" x="80" y="214" width="36" height="34" rx="4"/><text class="name" x="98" y="237" text-anchor="middle">B</text><rect class="deep" x="122" y="214" width="36" height="34" rx="4"/><text class="name" x="140" y="237" text-anchor="middle">C</text><rect class="focal" x="236" y="170" width="300" height="96" rx="6"/><text class="small inv" x="386" y="194" text-anchor="middle">마스터 노드</text><text class="name inv" x="310" y="224" text-anchor="middle">네임노드</text><text class="small inv" x="310" y="246" text-anchor="middle">메타데이터</text><text class="name inv" x="462" y="224" text-anchor="middle">리소스매니저</text><text class="small inv" x="462" y="246" text-anchor="middle">YARN 자원 관리</text><path class="flow" d="M174 218 L236 218"/><rect class="mask" x="169.0" y="184" width="72.0" height="22" rx="4"/><text class="lab" x="205" y="200" text-anchor="middle">위치 기록</text><rect class="node" x="24" y="360" width="160" height="150" rx="6"/><text class="name" x="104.0" y="386" text-anchor="middle">데이터노드 1</text><rect class="deep" x="40" y="404" width="40" height="38" rx="4"/><text class="name" x="60" y="429" text-anchor="middle">A</text><rect class="deep" x="84" y="404" width="40" height="38" rx="4"/><text class="name" x="104" y="429" text-anchor="middle">B</text><rect class="deep" x="128" y="404" width="40" height="38" rx="4"/><text class="name" x="148" y="429" text-anchor="middle">C</text><text class="small" x="104.0" y="468" text-anchor="middle">블록 저장</text><text class="small" x="104.0" y="490" text-anchor="middle">+ 노드매니저</text><path class="dash" d="M154 360 L154 288 L254 288 L254 266"/><rect class="node" x="200" y="360" width="160" height="150" rx="6"/><text class="name" x="280.0" y="386" text-anchor="middle">데이터노드 2</text><rect class="deep" x="216" y="404" width="40" height="38" rx="4"/><text class="name" x="236" y="429" text-anchor="middle">B</text><rect class="deep" x="260" y="404" width="40" height="38" rx="4"/><text class="name" x="280" y="429" text-anchor="middle">C</text><rect class="deep" x="304" y="404" width="40" height="38" rx="4"/><text class="name" x="324" y="429" text-anchor="middle">A</text><text class="small" x="280.0" y="468" text-anchor="middle">블록 저장</text><text class="small" x="280.0" y="490" text-anchor="middle">+ 노드매니저</text><path class="dash" d="M280.0 360 L280.0 266"/><rect class="node" x="376" y="360" width="160" height="150" rx="6"/><text class="name" x="456.0" y="386" text-anchor="middle">데이터노드 3</text><rect class="deep" x="392" y="404" width="40" height="38" rx="4"/><text class="name" x="412" y="429" text-anchor="middle">C</text><rect class="deep" x="436" y="404" width="40" height="38" rx="4"/><text class="name" x="456" y="429" text-anchor="middle">A</text><rect class="deep" x="480" y="404" width="40" height="38" rx="4"/><text class="name" x="500" y="429" text-anchor="middle">B</text><text class="small" x="456.0" y="468" text-anchor="middle">블록 저장</text><text class="small" x="456.0" y="490" text-anchor="middle">+ 노드매니저</text><path class="dash" d="M456.0 360 L456.0 266"/><rect class="mask" x="300.0" y="304" width="160.0" height="22" rx="4"/><text class="lab" x="380" y="320" text-anchor="middle">하트비트 · 블록 보고</text><path class="flow" d="M99 266 L99 360"/><rect class="mask" x="40.0" y="306" width="96.0" height="22" rx="4"/><text class="lab" x="88" y="322" text-anchor="middle">128MB 블록</text><text class="small" x="24" y="540">블록 A·B·C가 각각 3개씩 복제 — 노드 하나가 고장 나도 데이터가 남는다</text><text class="small" x="24" y="560">(실제 클러스터는 노드가 많아 블록마다 서로 다른 3대에 흩어진다)</text>
</svg>
