<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 617" role="img" aria-labelledby="acc-gl-5-overview-title acc-gl-5-overview-desc">
  <title id="acc-gl-5-overview-title">상기업의 매출원가 찾기</title>
  <desc id="acc-gl-5-overview-desc">5장의 상품 거래의 기록 방법, 실지재고조사법에 따른 결산정리, (주)보부상 상기업 회계순환 사례, 보충 주요 장부와 장부의 마감을 지그재그로 잇고 정리·사례로 종합·마감이라는 이름표를 단 개요도. 보충 칸은 슬라이드가 없어 점선 테두리로 표시</desc>
  <defs><marker id="acc-gl-5-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-5-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-5-overview-a)}.flow.both{marker-start:url(#acc-gl-5-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-5-overview-m)}.dash.both{marker-start:url(#acc-gl-5-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="617"/>
  <text class="tag" x="24" y="40">5장 개요 · 개념 묶음 3개 + 보충</text><text class="title" x="24" y="74">상기업의 매출원가 찾기</text><text class="subtitle" x="24" y="104">핵심 질문: 상품을 사고파는 기업은 판매한 상품의 원가(매출원가)를 언제,</text><text class="subtitle" x="24" y="124">어떻게 기록하는가?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="224" height="153.5" rx="6"/><text class="small" x="136" y="209.5" text-anchor="middle">5-1</text><text class="name" x="136" y="230.5" text-anchor="middle">상품 거래의 기록</text><text class="body" x="136" y="257.5" text-anchor="middle">계속기록법 vs</text><text class="body" x="136" y="278" text-anchor="middle">실지재고조사법</text><text class="body" x="136" y="298.5" text-anchor="middle">매입 계정 · 재고장</text><rect class="focal" x="312" y="172" width="224" height="153.5" rx="6"/><text class="small inv" x="424" y="198" text-anchor="middle">5-2</text><text class="name inv" x="424" y="219" text-anchor="middle">실지재고조사법</text><text class="name inv" x="424" y="242" text-anchor="middle">결산정리</text><text class="body inv" x="424" y="269" text-anchor="middle">매출원가 ＝</text><text class="body inv" x="424" y="289.5" text-anchor="middle">기초 + 매입 − 기말</text><text class="body inv" x="424" y="310" text-anchor="middle">ⓐ ⓑ ⓒ 3줄 분개</text><rect class="node" x="312" y="383.5" width="224" height="133" rx="6"/><text class="small" x="424" y="421" text-anchor="middle">5-3</text><text class="name" x="424" y="442" text-anchor="middle">상기업 회계순환 사례</text><text class="body" x="424" y="469" text-anchor="middle">(주)보부상 12월</text><text class="body" x="424" y="489.5" text-anchor="middle">4장 결산정리 + 매출원가 정리</text><rect class="outside" x="24" y="383.5" width="224" height="133" rx="6"/><text class="small" x="136" y="409.5" text-anchor="middle">보충</text><text class="name" x="136" y="430.5" text-anchor="middle">주요 장부와 장부의</text><text class="name" x="136" y="453.5" text-anchor="middle">마감</text><text class="body" x="136" y="480.5" text-anchor="middle">주요장부·보조장부</text><text class="body" x="136" y="501" text-anchor="middle">집합손익 → 이익잉여금</text><path class="flow" d="M248 248.75 L312 248.75"/><rect class="mask" x="258.6" y="237.75" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="253.75" text-anchor="middle">정리</text><path class="flow" d="M424 325.5 L424 383.5"/><rect class="mask" x="378.7" y="343.5" width="90.6" height="22" rx="4"/><text class="lab" x="424" y="359.5" text-anchor="middle">사례로 종합</text><path class="dash" d="M312 450 L248 450"/><rect class="mask" x="258.6" y="439" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="455" text-anchor="middle">마감</text><path class="flow" d="M24 546.5 H54"/><text class="small" x="62" y="551.5">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 546.5 H221.94875000000002"/><text class="small" x="229.94875000000002" y="551.5">영향·제약</text><rect class="focal" x="312.22900000000004" y="538.5" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="551.5">중심 개념</text><rect class="outside" x="422.34250000000003" y="538.5" width="22" height="16" rx="3"/><text class="small" x="452.34250000000003" y="551.5">슬라이드 밖 보충</text><text class="small" x="24" y="578.5">점선 칸: 목차에만 있고 슬라이드가 없는 보충 내용(확인 필요).</text>
</svg>
