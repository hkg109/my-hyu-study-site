<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 761" role="img" aria-labelledby="mis-gl-3-overview-title mis-gl-3-overview-desc">
  <title id="mis-gl-3-overview-title">조직을 이해해야 IT로 경쟁할 수 있다</title>
  <desc id="mis-gl-3-overview-desc">3장의 다섯 개념 묶음을 조직의 정의와 양방향 관계, 조직의 특징과 구조, IT의 조직 영향, 경쟁 요인과 전략, 가치사슬과 네트워크 전략 순서로 지그재그로 연결한 개요도</desc>
  <defs><marker id="mis-gl-3-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-3-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-3-overview-a)}.flow.both{marker-start:url(#mis-gl-3-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-3-overview-m)}.dash.both{marker-start:url(#mis-gl-3-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="761"/>
  <text class="tag" x="24" y="40">3장 개요 · 개념 묶음 5개</text><text class="title" x="24" y="74">조직을 이해해야 IT로 경쟁할 수 있다</text><text class="subtitle" x="24" y="104">핵심 질문: 조직과 IT는 서로를 어떻게 바꾸며, IT를 경쟁 전략에 어떻게</text><text class="subtitle" x="24" y="124">쓰는가?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="224" height="133" rx="6"/><text class="small" x="136" y="198" text-anchor="middle">3-1</text><text class="name" x="136" y="219" text-anchor="middle">조직의 정의와 양방향</text><text class="name" x="136" y="242" text-anchor="middle">관계</text><text class="body" x="136" y="269" text-anchor="middle">기술적·행동적 정의, 매개</text><text class="body" x="136" y="289.5" text-anchor="middle">요인</text><rect class="node" x="312" y="172" width="224" height="133" rx="6"/><text class="small" x="424" y="209.5" text-anchor="middle">3-2</text><text class="name" x="424" y="230.5" text-anchor="middle">조직의 특징과 구조</text><text class="body" x="424" y="257.5" text-anchor="middle">루틴·정치·문화·환경, 다섯</text><text class="body" x="424" y="278" text-anchor="middle">구조</text><rect class="node" x="312" y="363" width="224" height="133" rx="6"/><text class="small" x="424" y="389" text-anchor="middle">3-3</text><text class="name" x="424" y="410" text-anchor="middle">IT가 조직에 미치는</text><text class="name" x="424" y="433" text-anchor="middle">영향</text><text class="body" x="424" y="460" text-anchor="middle">거래·대리인 비용, 납작한</text><text class="body" x="424" y="480.5" text-anchor="middle">조직, 변화 저항</text><rect class="focal" x="24" y="363" width="224" height="133" rx="6"/><text class="small inv" x="136" y="410.75" text-anchor="middle">3-4</text><text class="name inv" x="136" y="431.75" text-anchor="middle">경쟁 요인과 경쟁 전략</text><text class="body inv" x="136" y="458.75" text-anchor="middle">다섯 힘 → 네 기본 전략</text><rect class="node" x="24" y="554" width="224" height="133" rx="6"/><text class="small" x="136" y="580" text-anchor="middle">3-5</text><text class="name" x="136" y="601" text-anchor="middle">가치사슬과 네트워크</text><text class="name" x="136" y="624" text-anchor="middle">전략</text><text class="body" x="136" y="651" text-anchor="middle">가치 웹·시너지·핵심</text><text class="body" x="136" y="671.5" text-anchor="middle">역량·생태계</text><path class="flow" d="M248 238.5 L312 238.5"/><rect class="mask" x="251.3" y="227.5" width="57.3" height="22" rx="4"/><text class="lab" x="280" y="243.5" text-anchor="middle">구체화</text><path class="flow" d="M424 305 L424 363"/><rect class="mask" x="402.6" y="323" width="42.9" height="22" rx="4"/><text class="lab" x="424" y="339" text-anchor="middle">매개</text><path class="flow" d="M312 429.5 L248 429.5"/><rect class="mask" x="251.3" y="418.5" width="57.3" height="22" rx="4"/><text class="lab" x="280" y="434.5" text-anchor="middle">전략화</text><path class="flow" d="M136 496 L136 554"/><rect class="mask" x="97.9" y="514" width="76.1" height="22" rx="4"/><text class="lab" x="136" y="530" text-anchor="middle">적용 지점</text><path class="flow" d="M24 717 H54"/><text class="small" x="62" y="722">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="709" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="722">중심 개념</text>
</svg>
