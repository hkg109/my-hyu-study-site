      #mis-05-ethical-ripple-root .node-focal { fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5 }
      #mis-05-ethical-ripple-root .zone { fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5 }
      #mis-05-ethical-ripple-root .tag { font:600 12px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;letter-spacing:.12em;fill:#65645e }
      #mis-05-ethical-ripple-root .title { font:700 28px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#1d1d1a }
      #mis-05-ethical-ripple-root .subtitle { font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#65645e }
      #mis-05-ethical-ripple-root .name { font:700 18px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#1d1d1a }
      #mis-05-ethical-ripple-root .name-inverse { font:700 18px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#f7f6f2 }
      #mis-05-ethical-ripple-root .sub { font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#65645e }
      #mis-05-ethical-ripple-root .sub-inverse { font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#f7f6f2 }
      #mis-05-ethical-ripple-root .small { font:600 12px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#65645e;letter-spacing:.04em }
