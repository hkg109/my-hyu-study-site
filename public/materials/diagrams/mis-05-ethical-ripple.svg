<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="mis-05-ethical-ripple-title mis-05-ethical-ripple-desc" id="mis-05-ethical-ripple-root">
  <title id="mis-05-ethical-ripple-title">정보기술이 만드는 윤리적 파장</title>
  <desc id="mis-05-ethical-ripple-desc">새로운 정보기술이 개인의 윤리 문제에서 사회와 정치의 쟁점으로 확장되는 구조</desc>
  <defs>
      <style>#mis-05-ethical-ripple-root .diagram-container { width:100%;overflow-x:auto }
      #mis-05-ethical-ripple-root .bg { fill:#f7f6f2 }
      #mis-05-ethical-ripple-root .rule { stroke:#b9b6ac;stroke-width:1;fill:none }
