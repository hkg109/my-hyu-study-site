<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 782" role="img" aria-labelledby="lm2-l04a-links-title lm2-l04a-links-desc">
  <title id="lm2-l04a-links-title">하드 링크와 심볼릭 링크 비교</title>
  <desc id="lm2-l04a-links-desc">왼쪽은 하드 링크: orig.txt와 hard.txt 두 이름이 같은 아이노드 1729015(링크 수 2)를 가리키고 그 아이노드가 데이터 hello를 가리킨다. 오른쪽은 심볼릭 링크: soft.txt는 자기 아이노드 1729016을 가지며 그 내용은 경로 문자열 orig.txt뿐이라 이름으로 원본을 다시 찾아간다. 원본을 지우면 하드 링크는 내용이 유지되고 링크 수만 줄며, 심볼릭 링크는 깨진다. 아래 표는 아이노드, 디렉터리 대상, 다른 파일 시스템, ls -l 첫 글자를 비교한다.</desc>
  <defs><marker id="lm2-l04a-links-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l04a-links-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l04a-links-a)}.flow.both{marker-start:url(#lm2-l04a-links-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l04a-links-m)}.dash.both{marker-start:url(#lm2-l04a-links-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="782"/>
  <text class="tag" x="24" y="40">리눅스마스터 2급 · 1과목 3장</text><text class="title" x="24" y="74">하드 링크 vs 심볼릭 링크</text><text class="subtitle" x="24" y="104">이름 → 아이노드 → 데이터 블록, 어디서 갈라지는가</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="deep" x="24" y="150" width="244" height="36" rx="6"/><text class="mono" x="146" y="174" text-anchor="middle">ln orig.txt hard.txt</text><rect class="deep" x="292" y="150" width="244" height="36" rx="6"/><text class="mono" x="414" y="174" text-anchor="middle">ln -s orig.txt soft.txt</text><rect class="node" x="32" y="210" width="108" height="40" rx="6"/><text class="mono" x="86" y="236" text-anchor="middle">orig.txt</text><rect class="node" x="152" y="210" width="108" height="40" rx="6"/><text class="mono" x="206" y="236" text-anchor="middle">hard.txt</text><path class="flow" d="M86 250 L134 300"/><path class="flow" d="M206 250 L158 300"/><rect class="focal" x="66" y="300" width="160" height="52" rx="6"/><text class="lab inv" x="146" y="322" text-anchor="middle">아이노드 1729015</text><text class="small inv" x="146" y="342" text-anchor="middle">링크 수 2</text><path class="flow" d="M146 352 V390"/><rect class="zone" x="66" y="390" width="160" height="44" rx="6"/><text class="lab" x="146" y="418" text-anchor="middle">데이터 "hello"</text><rect class="node" x="300" y="210" width="108" height="40" rx="6"/><text class="mono" x="354" y="236" text-anchor="middle">soft.txt</text><rect class="node" x="420" y="210" width="108" height="40" rx="6"/><text class="mono" x="474" y="236" text-anchor="middle">orig.txt</text><path class="flow" d="M354 250 V300"/><path class="flow" d="M474 250 V300"/><rect class="node" x="300" y="300" width="108" height="52" rx="6"/><text class="lab" x="354" y="322" text-anchor="middle">아이노드</text><text class="small" x="354" y="342" text-anchor="middle">1729016</text><rect class="focal" x="420" y="300" width="108" height="52" rx="6"/><text class="lab inv" x="474" y="322" text-anchor="middle">아이노드</text><text class="small inv" x="474" y="342" text-anchor="middle">1729015</text><path class="flow" d="M354 352 V390"/><path class="flow" d="M474 352 V390"/><rect class="outside" x="300" y="390" width="108" height="44" rx="6"/><text class="small" x="354" y="410" text-anchor="middle">경로 문자열</text><text class="monos" x="354" y="427" text-anchor="middle">"orig.txt"</text><rect class="zone" x="420" y="390" width="108" height="44" rx="6"/><text class="lab" x="474" y="418" text-anchor="middle">"hello"</text><path class="dash" d="M408 412 H414 V268 L426 254"/><text class="lab" x="24" y="460">원본 orig.txt를 지우거나 옮기면</text><rect class="node" x="24" y="474" width="244" height="64" rx="6"/><text class="mono" x="146" y="500" text-anchor="middle">cat hard.txt → hello</text><text class="task" x="146" y="524" text-anchor="middle">링크 수만 2 → 1, 내용 유지</text><rect class="outside" x="292" y="474" width="244" height="64" rx="6"/><text class="mono" x="414" y="500" text-anchor="middle">cat soft.txt → 오류</text><text class="task" x="414" y="524" text-anchor="middle">찾을 이름이 없어 깨진 링크</text><rect class="node" x="24" y="558" width="176" height="32" rx="6"/><text class="task" x="112" y="579" text-anchor="middle">같은 아이노드</text><rect class="deep" x="206" y="558" width="148" height="32" rx="6"/><text class="small" x="280" y="579" text-anchor="middle">아이노드</text><rect class="node" x="360" y="558" width="176" height="32" rx="6"/><text class="task" x="448" y="579" text-anchor="middle">새 아이노드</text><rect class="node" x="24" y="596" width="176" height="32" rx="6"/><text class="task" x="112" y="617" text-anchor="middle">불가</text><rect class="deep" x="206" y="596" width="148" height="32" rx="6"/><text class="small" x="280" y="617" text-anchor="middle">디렉터리 대상</text><rect class="node" x="360" y="596" width="176" height="32" rx="6"/><text class="task" x="448" y="617" text-anchor="middle">가능</text><rect class="node" x="24" y="634" width="176" height="32" rx="6"/><text class="task" x="112" y="655" text-anchor="middle">불가</text><rect class="deep" x="206" y="634" width="148" height="32" rx="6"/><text class="small" x="280" y="655" text-anchor="middle">다른 파일 시스템</text><rect class="node" x="360" y="634" width="176" height="32" rx="6"/><text class="task" x="448" y="655" text-anchor="middle">가능</text><rect class="node" x="24" y="672" width="176" height="32" rx="6"/><text class="task" x="112" y="693" text-anchor="middle">-  (일반 파일)</text><rect class="deep" x="206" y="672" width="148" height="32" rx="6"/><text class="small" x="280" y="693" text-anchor="middle">ls -l 첫 글자</text><rect class="node" x="360" y="672" width="176" height="32" rx="6"/><text class="task" x="448" y="693" text-anchor="middle">l  (-&gt; 원본)</text><rect class="focal" x="24" y="720" width="22" height="16" rx="3"/><text class="small" x="54" y="733">원본 아이노드</text><rect class="zone" x="157.32" y="720" width="22" height="16" rx="3"/><text class="small" x="187.32" y="733">실제 데이터</text><rect class="outside" x="277.14" y="720" width="22" height="16" rx="3"/><text class="small" x="307.14" y="733">경로만 저장 · 깨질 수 있음</text><path class="dash" d="M24 754 H54"/><text class="small" x="62" y="759">경로 글자로 원본 이름을 다시 찾음</text>
