<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 647" role="img" aria-labelledby="mis-gl-4f-consent-tracking-title mis-gl-4f-consent-tracking-desc">
  <title id="mis-gl-4f-consent-tracking-title">Opt-in vs Opt-out, 그리고 보이지 않는 추적</title>
  <desc id="mis-gl-4f-consent-tracking-desc">위에서 옵트인은 기본값이 사용 금지라 사용자가 동의해야 쓸 수 있고 옵트아웃은 기본값이 사용 허용이라 사용자가 거부해야 멈추는 비교, 아래에서 쿠키·슈퍼 쿠키·웹 비컨·스파이웨어가 행동 기록을 모아 행동 타기팅 프로필이 되는 흐름 그림</desc>
  <defs><marker id="mis-gl-4f-consent-tracking-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4f-consent-tracking-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4f-consent-tracking-a)}.flow.both{marker-start:url(#mis-gl-4f-consent-tracking-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4f-consent-tracking-m)}.dash.both{marker-start:url(#mis-gl-4f-consent-tracking-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="647"/>
  <text class="tag" x="24" y="40">4장 · 4-4 프라이버시와 정보 권리 ②</text><text class="title" x="24" y="74">Opt-in vs Opt-out, 그리고 보이지 않는 추적</text><text class="subtitle" x="24" y="104">차이는 “아무것도 하지 않았을 때 데이터 사용이 허용되는가”다. 쿠키 자체는</text><text class="subtitle" x="24" y="124">식별자이지만 기록과 결합되면 프로필이 된다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="172" width="249" height="89.5" rx="6"/><text class="small inv" x="148.5" y="198" text-anchor="middle">Opt-in · 더 강한 보호</text><text class="name inv" x="148.5" y="219" text-anchor="middle">기본값 = 사용 금지</text><text class="body inv" x="148.5" y="246" text-anchor="middle">명시적으로 동의해야 사용</text><rect class="node" x="287" y="172" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="198" text-anchor="middle">Opt-out</text><text class="name" x="411.5" y="219" text-anchor="middle">기본값 = 사용 허용</text><text class="body" x="411.5" y="246" text-anchor="middle">거부해야 사용 중단</text><rect class="node" x="24" y="295.5" width="249" height="63" rx="6"/><text class="small" x="148.5" y="321.5" text-anchor="middle">Cookies</text><text class="name" x="148.5" y="342.5" text-anchor="middle">브라우저 식별자</text><rect class="node" x="287" y="295.5" width="249" height="63" rx="6"/><text class="small" x="411.5" y="321.5" text-anchor="middle">Super cookies</text><text class="name" x="411.5" y="342.5" text-anchor="middle">지우기 어려움</text><rect class="node" x="24" y="368.5" width="249" height="63" rx="6"/><text class="small" x="148.5" y="394.5" text-anchor="middle">Web beacons</text><text class="name" x="148.5" y="415.5" text-anchor="middle">열람 여부 추적</text><rect class="node" x="287" y="368.5" width="249" height="63" rx="6"/><text class="small" x="411.5" y="394.5" text-anchor="middle">Spyware</text><text class="name" x="411.5" y="415.5" text-anchor="middle">몰래 설치·수집</text><rect class="node" x="24" y="489.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="515.5" text-anchor="middle">Behavioral targeting</text><text class="name" x="280" y="536.5" text-anchor="middle">프로필 → 맞춤 광고</text><text class="body" x="280" y="563.5" text-anchor="middle">Do Not Track 신호는 강제력이 약함</text><path class="line" d="M148.5 431.5 V457.6"/><path class="line" d="M411.5 431.5 V457.6"/><path class="line" d="M148.5 457.6 H411.5"/><path class="flow" d="M280 457.6 L280 489.5"/><rect class="mask" x="225.3" y="462.55" width="109.3" height="22" rx="4"/><text class="lab" x="280" y="478.55" text-anchor="middle">행동 기록 결합</text><path class="flow" d="M24 603 H54"/><text class="small" x="62" y="608">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="595" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="608">중심 개념</text>
</svg>
