<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-labelledby="sci1-5-11-net-force-motion-title sci1-5-11-net-force-motion-desc">
  <title id="sci1-5-11-net-force-motion-title">알짜힘 방향과 운동 방향의 관계</title>
  <desc id="sci1-5-11-net-force-motion-desc">네 칸 그림. 각 칸에 공이 있고 점선 화살표는 운동 방향, 굵은 화살표는 알짜힘이다. 같은 방향이면 속력이 증가, 반대 방향이면 속력이 감소, 서로 수직이면 운동 방향이 변하고, 비스듬하면 속력과 방향이 모두 변할 수 있다. 가운데 아래에는 알짜힘이 0이면 운동 상태가 변하지 않는다는 기준을 적었다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="520"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">알짜힘 방향과 운동 방향의 관계</text><text class="subtitle" x="24.0" y="104.0">두 방향이 어떻게 놓였는지가 변화를 정한다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="146.0" width="248.0" height="160.0" rx="6"/><text class="name" x="40.0" y="172.0">같은 방향</text><line x1="130.0" y1="232.0" x2="190.0" y2="232.0" stroke="#65645e" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M200.0,232.0 L190.0,236.5 L190.0,227.5 Z" fill="#65645e"/><line x1="114.0" y1="232.0" x2="151.0" y2="232.0" stroke="#1d1d1a" stroke-width="4"/><path d="M164.0,232.0 L151.0,237.8 L151.0,226.2 Z" fill="#1d1d1a"/><circle class="solid" cx="114.0" cy="232.0" r="13.0"/><text class="lab" x="256.0" y="172.0" text-anchor="end">속력 증가</text><rect class="zone" x="288.0" y="146.0" width="248.0" height="160.0" rx="6"/><text class="name" x="304.0" y="172.0">반대 방향</text><line x1="394.0" y1="232.0" x2="454.0" y2="232.0" stroke="#65645e" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M464.0,232.0 L454.0,236.5 L454.0,227.5 Z" fill="#65645e"/><line x1="378.0" y1="232.0" x2="341.0" y2="232.0" stroke="#1d1d1a" stroke-width="4"/><path d="M328.0,232.0 L341.0,226.2 L341.0,237.8 Z" fill="#1d1d1a"/><circle class="solid" cx="378.0" cy="232.0" r="13.0"/><text class="lab" x="520.0" y="172.0" text-anchor="end">속력 감소</text><rect class="zone" x="24.0" y="318.0" width="248.0" height="160.0" rx="6"/><text class="name" x="40.0" y="344.0">서로 수직</text><line x1="130.0" y1="404.0" x2="190.0" y2="404.0" stroke="#65645e" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M200.0,404.0 L190.0,408.5 L190.0,399.5 Z" fill="#65645e"/><line x1="114.0" y1="404.0" x2="114.0" y2="441.0" stroke="#1d1d1a" stroke-width="4"/><path d="M114.0,454.0 L108.2,441.0 L119.8,441.0 Z" fill="#1d1d1a"/><circle class="solid" cx="114.0" cy="404.0" r="13.0"/><text class="lab" x="256.0" y="344.0"