<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" width="560" height="700" role="img" aria-labelledby="adsp-l10c-dendrogram-title adsp-l10c-dendrogram-desc">
  <title id="adsp-l10c-dendrogram-title">덴드로그램 자르기</title>
  <desc id="adsp-l10c-dendrogram-desc">1차원 값 A 1, B 1.5, C 4, D 8, E 8.8, F 10을 최단 연결법으로 병합한 덴드로그램. A와 B가 높이 0.5, D와 E가 0.8, DE와 F가 1.2, AB와 C가 2.5, 두 큰 군집이 4.0에서 합쳐진다. 높이 3.2에서 가로로 자르면 세로선 2개와 만나 군집 2개, 높이 1.8에서 자르면 3개와 만나 군집 3개가 된다.</desc>
  <defs><marker id="adsp-l10c-dendrogram-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l10c-dendrogram-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l10c-dendrogram-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.dasharrow{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l10c-dendrogram-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#65645e;stroke-width:1.2;fill:none}.grid{stroke:#e4e1d8;stroke-width:1;fill:none}.axis{stroke:#1d1d1a;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.head{font:700 16px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.bodym{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.tiny{font:600 12px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="700"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 3장 · 계층적 군집</text><text class="title" x="24" y="74">덴드로그램 자르기</text><text class="subtitle" x="24" y="104">가로 기준선이 만나는 세로선의 수 = 그 높이에서의 군집 수</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
<path class="axis" d="M104 159.59999999999997 V494"/><line class="axis" x1="99" y1="494" x2="104" y2="494"/><text class="tiny" x="94" y="498" text-anchor="end">0</text><line class="axis" x1="99" y1="418" x2="104" y2="418"/><text class="tiny" x="94" y="422" text-anchor="end">1</text><line class="axis" x1="99" y1="342" x2="104" y2="342"/><text class="tiny" x="94" y="346" text-anchor="end">2</text><line class="axis" x1="99" y1="266" x2="104" y2="266"/><text class="tiny" x="94" y="270" text-anchor="end">3</text><line class="axis" x1="99" y1="190" x2="104" y2="190"/><text class="tiny" x="94" y="194" text-anchor="end">4</text><text class="lab" transform="translate(64 326.79999999999995) rotate(-90)" text-anchor="middle">병합 높이(거리)</text><path class="line" d="M344 494 V433.2 H416 V494"/><path class="line" d="M488 494 V402.8 H380 V433.2"/><path class="line" d="M128 494 V456 H200 V494"/><path class="line" d="M272 494 V304 H164 V456"/><path class="line" d="M434 402.8 V190 H218 V304"/><path class="line" d="M326 190 V159.6"/><text class="name" x="128" y="516" text-anchor="middle">A</text><text class="tiny" x="128" y="534" text-anchor="middle">1</text><text class="name" x="200" y="516" text-anchor="middle">B</text><text class="tiny" x="200" y="534" text-anchor="middle">1.5</text><text class="name" x="272" y="516" text-anchor="middle">C</text><text class="tiny" x="272" y="534" text-anchor="middle">4</text><text class="name" x="344" y="516" text-anchor="middle">D</text><text class="tiny" x="344" y="534" text-anchor="middle">8</text><text class="name" x="416" y="516" text-anchor="middle">E</text><text class="tiny" x="416" y="534" text-anchor="middle">8.8</text><text class="name" x="488" y="516" text-anchor="middle">F</text><text class="tiny" x="488" y="534" text-anchor="middle">10</text><text class="tiny" x="350" y="427.2">0.8</text><text class="tiny" x="386" y="396.8">1.2</text><text class="tiny" x="134" y="450">0.5</text><text class="tiny" x="170" y="298">2.5</text><text class="tiny" x="224" y="184">4.0</text><path class="dash" d="M104 250.8 H518"/><circle class="focal" cx="434" cy="250.8" r="5"/><circle class="focal" cx="218" cy="250.8" r="5"/><text class="lab" x="536" y="242.8" text-anchor="end">h = 3.2 → 2개</text><path class="dash" d="M104 357.2 H518"/><circle class="focal" cx="434" cy="357.2" r="5"/><circle class="focal" cx="272" cy="357.2" r="5"/><circle class="focal" cx="164" cy="357.2" r="5"/><text class="lab" x="536" y="349.2" text-anchor="end">h = 1.8 → 3개</text><rect class="zone" x="24" y="556" width="512" height="120" rx="8"/><text class="head" x="40" y="584">읽는 법</text><text class="bodym" x="40" y="608">· h = 3.2: {A, B, C} · {D, E, F} → 군집 2개</text><text class="bodym" x="40" y="630">· h = 1.8: {A, B} · {C} · {D, E, F} → 군집 3개</text><text class="bodym" x="40" y="652">· 높은 곳에서 자를수록 군집 수가 적다 (검은 점 = 교차)</text>
</svg>
