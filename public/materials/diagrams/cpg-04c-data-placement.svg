  <rect class="node" x="216" y="160" width="320" height="72" rx="6"/><text class="name" x="376" y="191.0" text-anchor="middle">DB · event_resources</text><text class="body" x="376" y="212.5" text-anchor="middle">제목 · 행사 ID · 저장 경로</text>
  <rect class="node" x="216" y="248" width="320" height="72" rx="6"/><text class="name" x="376" y="279.0" text-anchor="middle">Storage · 비공개 Bucket</text><text class="body" x="376" y="300.5" text-anchor="middle">파일 본체 · Signed URL로 잠깐 연다</text>
  <rect class="outside" x="24" y="376" width="140" height="160" rx="6"/><text class="name" x="94" y="450.0" text-anchor="middle">익명 건의</text><text class="name" x="94" y="473.0" text-anchor="middle">제출</text>
  <rect class="node" x="216" y="376" width="320" height="72" rx="6"/><text class="code" x="376" y="406.5" text-anchor="middle">suggestions</text><text class="body" x="376" y="427.5" text-anchor="middle">내용 · 상태 · 담당자 → 처리자도 본다</text>
  <rect class="focal" x="216" y="464" width="320" height="72" rx="6"/><text class="code inv" x="376" y="494.5" text-anchor="middle">suggestion_authors</text><text class="body inv" x="376" y="515.5" text-anchor="middle">작성자 연결 → 본인 · 회장단만</text>
  <rect class="deep" x="24" y="576" width="512" height="92" rx="6"/><text class="name" x="280" y="607.5" text-anchor="middle">두 경우 모두 · activity_logs (append-only)</text><text class="body" x="280" y="629.0" text-anchor="middle">누가 · 언제 · 무엇을 바꿨는지</text><text class="small" x="280" y="648.6" text-anchor="middle">본문 · 작성자 ID · Token · Signed URL은 넣지 않는다</text>
  <rect class="focal" x="24" y="708" width="22" height="16" rx="3"/><text class="small" x="54" y="721">가장 좁게 공개</text><rect class="deep" x="163.48000000000002" y="708" width="22" height="16" rx="3"/><text class="small" x="193.48000000000002" y="721">변경 기록</text><rect class="outside" x="272.45000000000005" y="708" width="22" height="16" rx="3"/><text class="small" x="302.45000000000005" y="721">사용자 행동</text>
