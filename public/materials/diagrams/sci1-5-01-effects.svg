<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-labelledby="sci1-5-01-effects-title sci1-5-01-effects-desc">
  <title id="sci1-5-01-effects-title">힘이 하는 두 가지 일</title>
  <desc id="sci1-5-01-effects-desc">왼쪽 칸은 운동 상태 변화: 정지한 공을 발로 차서 공이 오른쪽으로 출발한다. 오른쪽 칸은 모양 변화: 스펀지를 위에서 누르면 납작해진다. 아래 띠에는 야구공을 칠 때 두 효과가 함께 나타난다고 적었다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="420"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">힘이 하는 두 가지 일</text><text class="subtitle" x="24.0" y="104.0">운동 상태를 바꾸거나, 모양을 바꾼다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="150.0" width="248.0" height="200.0" rx="6"/><rect class="zone" x="288.0" y="150.0" width="248.0" height="200.0" rx="6"/><text class="name" x="148.0" y="178.0" text-anchor="middle">운동 상태 변화</text><text class="name" x="412.0" y="178.0" text-anchor="middle">모양 변화</text><line class="thin" x1="40.0" y1="300.0" x2="256.0" y2="300.0"/><circle class="node" cx="110.0" cy="278.0" r="22.0"/><circle cx="110" cy="278" r="22" fill="none" stroke="#65645e" stroke-width="1.5" stroke-dasharray="4 3"/><text class="small" x="110.0" y="324.0" text-anchor="middle">정지</text><circle class="solid" cx="200.0" cy="278.0" r="22.0"/><line x1="60.0" y1="278.0" x2="75.0" y2="278.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M86.0,278.0 L75.0,282.9 L75.0,273.1 Z" fill="#1d1d1a"/><text class="small" x="52.0" y="258.0">발로 참</text><line x1="226.0" y1="252.0" x2="248.0" y2="252.0" stroke="#65645e" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M258.0,252.0 L248.0,256.5 L248.0,247.5 Z" fill="#65645e"/><text class="small" x="200.0" y="324.0" text-anchor="middle">출발 · 빨라짐</text><text class="small" x="148.0" y="340.0" text-anchor="middle">멈춤 · 방향 바뀜도 포함</text><line class="thin" x1="304.0" y1="300.0" x2="520.0" y2="300.0"/><rect class="deep" x="318.0" y="250.0" width="80.0" height="50.0" rx="4"/><text class="small" x="358.0" y="324.0" text-anchor="middle">누르기 전</text><rect class="solid" x="428.0" y="272.0" width="92.0" height="28.0" rx="4"/><line x1="474.0" y1="222.0" x2="474.0" y2="257.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M474.0,268.0 L469.1,257.0 L478.9,257.0 Z" fill="#1d1d1a"/><text class="small" x="482.0" y="238.0">누름</text><text class="small" x="474.0" y="324.0" text-anchor="middle">납작해짐</text><text class="small" x="412.0" y="340.0" text-anchor="middle">늘어남 · 휨 · 찌그러짐도 포함</text><rect class="focal" x="24.0" y="366.0" width="512.0" height="36.0" rx="6"/><text class="lab inv" x="280.0" y="389.0" text-anchor="middle">둘이 함께: 야구공을 치면 방향·속력이 바뀌고, 그 순간 공도 살짝 찌그러진다</text>
</svg>
