<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 770" role="img" aria-labelledby="adsp-l08b-biplot-title adsp-l08b-biplot-desc">
  <title id="adsp-l08b-biplot-title">바이플롯 읽는 법</title>
  <desc id="adsp-l08b-biplot-desc">가로축 PC1, 세로축 PC2 평면에 관측치 점과 변수 화살표를 함께 그린 예시. 악력은 PC1과 평행하고 길며, 턱걸이는 악력과 같은 방향이라 양의 상관, 오래달리기 시간은 반대 방향이라 음의 상관, 유연성은 거의 직각이라 상관이 거의 없고 PC2와 평행하다. 앉은키 화살표는 짧아 기여가 작다. 학생 A는 악력 방향으로 멀리 있어 그 값이 크다.</desc>
  <defs><marker id="adsp-l08b-biplot-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l08b-biplot-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l08b-biplot-a)}.flow.both{marker-start:url(#adsp-l08b-biplot-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l08b-biplot-m)}.dash.both{marker-start:url(#adsp-l08b-biplot-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="770"/>
  <style>.ax{stroke:#1d1d1a;stroke-width:1.5;fill:none}.grid{stroke:#b9b6ac;stroke-width:1;stroke-dasharray:3 4;fill:none}.cv{stroke:#1d1d1a;stroke-width:2.2;fill:none}.cvm{stroke:#65645e;stroke-width:2;fill:none;stroke-dasharray:7 5}.dot{fill:#1d1d1a}.dotm{fill:#65645e}.dotl{fill:#f7f6f2;stroke:#1d1d1a;stroke-width:1.5}.shd{fill:#1d1d1a}.shl{fill:#c9c5b9}.shs{fill:#e4e1d8}.ln{stroke:#1d1d1a;stroke-width:1.6;fill:none}.lnm{stroke:#65645e;stroke-width:1.4;fill:none}.lnd{stroke:#1d1d1a;stroke-width:1.6;stroke-dasharray:6 4;fill:none}.lnt{stroke:#1d1d1a;stroke-width:2;stroke-dasharray:2 3;fill:none}.thick{stroke:#1d1d1a;stroke-width:3;fill:none}.tick{font:400 12.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.bodyb{font:700 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 19px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style><text class="tag" x="24" y="40">ADsP · 3과목 2장 04 · 주성분분석</text><text class="title" x="24" y="74">바이플롯 읽는 법</text><text class="subtitle" x="24" y="104">화살표 = 원래 변수, 점 = 관측치 (체력 측정 학습용 예시)</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><path class="ax" d="M60 362 L490 362"/><path class="ax" d="M270 492 L270 176"/><text class="lab" x="490" y="384" text-anchor="end">PC1 →</text><text class="lab" x="278" y="184">PC2 ↑</text><circle class="dotm" cx="190.4" cy="399" r="3"/><circle class="dotm" cx="231.3" cy="459.1" r="3"/><circle class="dotm" cx="203.5" cy="332.4" r="3"/><circle class="dotm" cx="225.7" cy="341.5" r="3"/><circle class="dotm" cx="248.8" cy="404.9" r="3"/><circle class="dotm" cx="320.7" cy="401.6" r="3"/><circle class="dotm" cx="321.6" cy="358.6" r="3"/><circle class="dotm" cx="194.1" cy="293.4" r="3"/><circle class="dotm" cx="323.7" cy="320.5" r="3"/><circle class="dotm" cx="239.1" cy="404.4" r="3"/><circle class="dotm" cx="295.2" cy="351.3" r="3"/><circle class="dotm" cx="365.5" cy="307.9" r="3"/><circle class="dotm" cx="188.4" cy="433.2" r="3"/><circle class="dotm" cx="316.7" cy="322.4" r="3"/><circle class="dotm" cx="211" cy="369" r="3"/><circle class="dotm" cx="217.9" cy="373.3" r="3"/><circle class="dotm" cx="275.5" cy="426.2" r="3"/><circle class="dotm" cx="325.8" cy="300.1" r="3"/><circle class="dotm" cx="222" cy="423" r="3"/><circle class="dotm" cx="360.2" cy="379" r="3"/><circle class="dotm" cx="351.5" cy="403.7" r="3"/><circle class="dotm" cx="163" cy="262.7" r="3"/><circle class="dotm" cx="179.2" cy="283.1" r="3"/><circle class="dotm" cx="218.4" cy="321.6" r="3"/><circle class="dotm" cx="215.7" cy="340.8" r="3"/><circle class="dotm" cx="213.6" cy="408.3" r="3"/><circle class="dotm" cx="182" cy="321.2" r="3"/><circle class="dotm" cx="308.2" cy="414.9" r="3"/><circle class="dotm" cx="260.8" cy="374.4" r="3"/><circle class="dotm" cx="240.6" cy="385.1" r="3"/><circle class="dotm" cx="206.7" cy="355.4" r="3"/><circle class="dotm" cx="247.4" cy="452.6" r="3"/><circle class="dotm" cx="310.8" cy="336.3" r="3"/><circle class="dotm" cx="323" cy="328.4" r="3"/><circle class="focal" cx="470" cy="312" r="6"/><text class="lab" x="470" y="298" text-anchor="middle">⑥ 학생 A</text><path class="flow" d="M270 362 L439.1 344.2"/><rect class="bg" x="444.1" y="322.2" width="53.7" height="19" rx="3"/><text class="lab" x="447.1" y="336.2">① 악력</text><path class="flow" d="M270 362 L399.8 309.6"/><rect class="bg" x="328.7" y="285.6" width="68.1" height="19" rx="3"/><text class="lab" x="393.8" y="299.6" text-anchor="end">② 턱걸이</text><path class="flow" d="M270 362 L121.5 382.9"/><rect class="bg" x="112.5" y="396.9" width="130.2" height="19" rx="3"/><text class="lab" x="115.5" y="410.9">③ 오래달리기 시간</text><path class="flow" d="M270 362 L260.2 222.3"/><rect class="bg" x="267.2" y="210.3" width="68.1" height="19" rx="3"/><text class="lab" x="270.2" y="224.3">④ 유연성</text><path class="flow" d="M270 362 L292 409.1"/><rect class="bg" x="297" y="409.1" width="68.1" height="19" rx="3"/><text class="lab" x="300" y="423.1">⑤ 앉은키</text><rect class="zone" x="24" y="508" width="512" height="194" rx="8"/><text class="bodyb" x="38" y="536">①</text><text class="body" x="62" y="536">PC1과 평행하고 길다 → PC1에 대한 영향력·기여가 크다</text><text class="bodyb" x="38" y="566">②</text><text class="body" x="62" y="566">악력과 같은 방향 → 두 변수는 양의 상관</text><text class="bodyb" x="38" y="596">③</text><text class="body" x="62" y="596">악력·턱걸이와 반대 방향 → 음의 상관</text><text class="bodyb" x="38" y="626">④</text><text class="body" x="62" y="626">악력과 거의 직각 → 상관이 거의 없다, PC2와 평행</text><text class="bodyb" x="38" y="656">⑤</text><text class="body" x="62" y="656">화살표가 짧다 → 두 주성분에서 기여가 작다</text><text class="bodyb" x="38" y="686">⑥</text><text class="body" x="62" y="686">악력·턱걸이 화살표 쪽으로 멀다 → 그 값이 크다</text><text class="small" x="24" y="730">가로축 PC1, 세로축 PC2 · 화살표 길이 = 그 변수의 기여(분산)</text>
</svg>
