<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="sci1-5-05-gravity-direction-title sci1-5-05-gravity-direction-desc">
  <title id="sci1-5-05-gravity-direction-title">중력은 언제나 지구 중심을 향한다</title>
  <desc id="sci1-5-05-gravity-direction-desc">가운데 지구를 원으로 그리고 표면 위 네 곳(위, 오른쪽, 아래, 왼쪽)에 사람을 세웠다. 각 사람에게서 지구 중심을 향하는 중력 화살표를 그렸다. 지구 밖 궤도에는 인공위성이 있고 그 위성에도 지구 중심을 향하는 화살표가 있다. 오른쪽 아래에는 우리 주변 좁은 범위에서는 이 방향을 연직 아래 방향이라 부른다고 적었다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="480"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">중력은 언제나 지구 중심을 향한다</text><text class="subtitle" x="24.0" y="104.0">어디에 서 있든 ‘아래’는 지구 중심 쪽이다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><circle cx="250" cy="300" r="162" fill="none" stroke="#b9b6ac" stroke-width="1" stroke-dasharray="4 4"/><circle class="deep" cx="250.0" cy="300.0" r="100.0"/><circle class="focal" cx="250.0" cy="300.0" r="4.0"/><text class="small" x="250.0" y="322.0" text-anchor="middle">지구 중심</text><line class="line" x1="250.0" y1="200.0" x2="250.0" y2="186.0"/><circle class="solid" cx="250.0" cy="170.0" r="8.0"/><line class="line" x1="250.0" y1="186.0" x2="250.0" y2="178.0"/><line x1="250.0" y1="206.0" x2="250.0" y2="242.0" stroke="#1d1d1a" stroke-width="3"/><path d="M250.0,252.0 L245.5,242.0 L254.5,242.0 Z" fill="#1d1d1a"/><line class="line" x1="350.0" y1="300.0" x2="364.0" y2="300.0"/><circle class="solid" cx="380.0" cy="300.0" r="8.0"/><line class="line" x1="364.0" y1="300.0" x2="372.0" y2="300.0"/><line x1="344.0" y1="300.0" x2="308.0" y2="300.0" stroke="#1d1d1a" stroke-width="3"/><path d="M298.0,300.0 L308.0,295.5 L308.0,304.5 Z" fill="#1d1d1a"/><line class="line" x1="250.0" y1="400.0" x2="250.0" y2="414.0"/><circle class="solid" cx="250.0" cy="430.0" r="8.0"/><line class="line" x1="250.0" y1="414.0" x2="250.0" y2="422.0"/><line x1="250.0" y1="394.0" x2="250.0" y2="358.0" stroke="#1d1d1a" stroke-width="3"/><path d="M250.0,348.0 L254.5,358.0 L245.5,358.0 Z" fill="#1d1d1a"/><line class="line" x1="150.0" y1="300.0" x2="136.0" y2="300.0"/><circle class="solid" cx="120.0" cy="300.0" r="8.0"/><line class="line" x1="136.0" y1="300.0" x2="128.0" y2="300.0"/><line x1="156.0" y1="300.0" x2="192.0" y2="300.0" stroke="#1d1d1a" stroke-width="3"/><path d="M202.0,300.0 L192.0,304.5 L192.0,295.5 Z" fill="#1d1d1a"/><rect class="solid" x="364.1" y="188.9" width="20.0" height="14.0" rx="2"/><line 