<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 900" role="img" aria-labelledby="mis-gl-3i-network-strategies-title mis-gl-3i-network-strategies-desc">
  <title id="mis-gl-3i-network-strategies-title">가치사슬 → 가치 웹 → 비즈니스 생태계</title>
  <desc id="mis-gl-3i-network-strategies-desc">한 기업의 가치사슬이 IT로 동기화되어 같은 산업 안 독립 기업들의 가치 웹이 되고, 플랫폼을 중심으로 여러 산업까지 넓어지면 키스톤 기업과 니치 기업이 있는 비즈니스 생태계가 되는 포함 관계 그림. 네트워크 경제와 가상 기업도 함께 표시한다</desc>
  <defs><marker id="mis-gl-3i-network-strategies-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-3i-network-strategies-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-3i-network-strategies-a)}.flow.both{marker-start:url(#mis-gl-3i-network-strategies-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-3i-network-strategies-m)}.dash.both{marker-start:url(#mis-gl-3i-network-strategies-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="900"/>
  <text class="tag" x="24" y="40">3장 · 3-5 가치사슬과 네트워크 전략 ②</text><text class="title" x="24" y="74">가치사슬 → 가치 웹 → 비즈니스 생태계</text><text class="subtitle" x="24" y="104">분석 단위가 한 기업에서 같은 산업의 기업 네트워크, 다시 여러 산업의 플랫폼</text><text class="subtitle" x="24" y="124">네트워크로 넓어진다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small" x="280" y="198" text-anchor="middle">Value chain</text><text class="name" x="280" y="219" text-anchor="middle">한 기업의 가치사슬</text><text class="body" x="280" y="246" text-anchor="middle">시너지 · 핵심 역량으로 강화</text><rect class="node" x="24" y="319.5" width="512" height="110" rx="6"/><text class="small" x="280" y="345.5" text-anchor="middle">Value web</text><text class="name" x="280" y="366.5" text-anchor="middle">같은 산업의 독립 기업 네트워크</text><text class="body" x="280" y="393.5" text-anchor="middle">덜 선형적 · 고객 주도 · 유연</text><text class="body" x="280" y="414" text-anchor="middle">가상 기업(Li &amp; Fung)</text><rect class="focal" x="24" y="487.5" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="513.5" text-anchor="middle">Business ecosystem</text><text class="name inv" x="280" y="534.5" text-anchor="middle">여러 산업의 느슨한 네트워크</text><text class="body inv" x="280" y="561.5" text-anchor="middle">경쟁 단위: 생태계 대 생태계</text><rect class="node" x="24" y="635" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="661" text-anchor="middle">Keystone firm</text><text class="name" x="148.5" y="682" text-anchor="middle">플랫폼 제공·지배</text><text class="body" x="148.5" y="709" text-anchor="middle">Microsoft, Facebook</text><rect class="node" x="287" y="635" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="661" text-anchor="middle">Niche firm</text><text class="name" x="411.5" y="682" text-anchor="middle">플랫폼 위 특정 가치</text><text class="body" x="411.5" y="709" text-anchor="middle">앱 개발사</text><rect class="node" x="24" y="742.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="768.5" text-anchor="middle">Network economics</text><text class="name" x="280" y="789.5" text-anchor="middle">참여자 추가 한계비용 ≈ 0</text><text class="body" x="280" y="816.5" text-anchor="middle">참여자가 늘수록 네트워크 가치 ↑</text><path class="flow" d="M280 261.5 L280 319.5"/><rect class="mask" x="214.1" y="279.5" width="131.7" height="22" rx="4"/><text class="lab" x="280" y="295.5" text-anchor="middle">IT로 연결·동기화</text><path class="flow" d="M280 429.5 L280 487.5"/><rect class="mask" x="220.3" y="447.5" width="119.4" height="22" rx="4"/><text class="lab" x="280" y="463.5" text-anchor="middle">플랫폼으로 확장</text><path class="line" d="M280 577 V608.9"/><path class="line" d="M148.5 608.9 H411.5"/><path class="flow" d="M148.5 608.9 L148.5 635"/><path class="flow" d="M411.5 608.9 L411.5 635"/><rect class="mask" x="258.6" y="581.95" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="597.95" text-anchor="middle">역할</text><path class="flow" d="M24 856 H54"/><text class="small" x="62" y="861">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="848" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="861">중심 개념</text>
</svg>
