<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="mis-00-value-realization-title mis-00-value-realization-desc">
  <title id="mis-00-value-realization-title">IT 투자에서 ROI까지의 가치 실현 구조</title>
  <desc id="mis-00-value-realization-desc">정보기술 투자와 보완 자산이 함께 비즈니스 프로세스를 바꾸고 성과와 투자수익률로 이어지는 과정</desc>
  <defs><marker id="mis-00-value-realization-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1}.flow{stroke:#65645e;stroke-width:2;fill:none;marker-end:url(#mis-00-value-realization-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.optional{fill:#f7f6f2;stroke:#929087;stroke-width:1.5;stroke-dasharray:6 5}.tag{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.inverse{fill:#f7f6f2}.step{font:600 10px 'JetBrains Mono',monospace;fill:#65645e;letter-spacing:.08em}</style>
  <rect class="bg" width="1280" height="700"/><text class="tag" x="64" y="52">LECTURE 00 · VALUE REALIZATION</text><text class="title" x="64" y="92">IT 구매가 아니라 업무 변화가 가치를 만든다</text><text class="subtitle" x="64" y="122">기술과 보완 자산이 함께 작동해야 프로세스가 바뀌고 측정 가능한 수익으로 이어진다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
