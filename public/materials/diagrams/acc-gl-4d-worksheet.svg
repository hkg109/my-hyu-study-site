<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1120" role="img" aria-labelledby="acc-gl-4d-worksheet-title acc-gl-4d-worksheet-desc">
  <title id="acc-gl-4d-worksheet-title">정산표 다섯 칸의 흐름 — (주)바람돌이</title>
  <desc id="acc-gl-4d-worksheet-desc">정산표에서 수정전 시산표 31,600원에 결산정리 1,150원을 더해 수정후 시산표 32,150원을 만들고, 수익·비용은 포괄손익계산서 칸(차변 2,550, 대변 4,000)으로, 자산·부채·자본은 재무상태표 칸(차변 29,600, 대변 28,150)으로 옮긴다. 두 칸의 차액 1,450원이 당기순이익이며 손익 칸 차변과 재무상태표 칸 대변에 기입해 각각 4,000원과 29,600원으로 일치시킨다</desc>
  <defs><marker id="acc-gl-4d-worksheet-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-4d-worksheet-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-4d-worksheet-a)}.flow.both{marker-start:url(#acc-gl-4d-worksheet-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-4d-worksheet-m)}.dash.both{marker-start:url(#acc-gl-4d-worksheet-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1120"/>
  <text class="tag" x="24" y="40">4장 · 4-4 정산표</text><text class="title" x="24" y="74">정산표(work sheet) 작성 5단계</text><text class="subtitle" x="24" y="104">결산 전 과정을 한 장의 표에서 — 칸은 왼쪽에서 오른쪽,</text><text class="subtitle" x="24" y="124">숫자는 (주)바람돌이 1월 사례</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="512" height="70" rx="6"/><text class="name" x="280.0" y="203.0" text-anchor="middle">① 수정전 시산표</text><text class="body" x="280.0" y="224.0" text-anchor="middle">차변 31,600 = 대변 31,600</text><rect class="node" x="24" y="298" width="512" height="92" rx="6"/><text class="name" x="280.0" y="330.5" text-anchor="middle">② 결산정리 ⓐ–ⓓ</text><text class="body" x="280.0" y="351.5" text-anchor="middle">차변 1,150 = 대변 1,150</text><text class="small" x="280.0" y="370.5" text-anchor="middle">새 계정(이자비용 등)은 하단에 추가</text><rect class="node" x="24" y="446" width="512" height="70" rx="6"/><text class="name" x="280.0" y="477.0" text-anchor="middle">③ 수정후 시산표</text><text class="body" x="280.0" y="498.0" text-anchor="middle">차변 32,150 = 대변 32,150</text><path class="flow" d="M280 242 L280 298"/><rect class="mask" x="228.3" y="259" width="103.5" height="22" rx="4"/><text class="lab" x="280" y="275" text-anchor="middle">결산정리 기입</text><path class="flow" d="M280 390 L280 446"/><rect class="mask" x="217.5" y="407" width="125.0" height="22" rx="4"/><text class="lab" x="280" y="423" text-anchor="middle">같은 행끼리 가감</text><rect class="node" x="24" y="576" width="240" height="104" rx="6"/><text class="name" x="144.0" y="613.5" text-anchor="middle">포괄손익계산서 칸</text><text class="body" x="144.0" y="634.5" text-anchor="middle">차변(비용) 2,550</text><text class="body" x="144.0" y="655.5" text-anchor="middle">대변(수익) 4,000</text><rect class="node" x="296" y="576" width="240" height="104" rx="6"/><text class="name" x="416.0" y="613.5" text-anchor="middle">재무상태표 칸</text><text class="body" x="416.0" y="634.5" text-anchor="middle">차변 29,600</text><text class="body" x="416.0" y="655.5" text-anchor="middle">대변 28,150</text><path class="flow" d="M144.0 516 L144.0 576"/><rect class="mask" x="92.3" y="535" width="103.5" height="22" rx="4"/><text class="lab" x="144.0" y="551" text-anchor="middle">④ 수익·비용</text><path class="flow" d="M416.0 516 L416.0 576"/><rect class="mask" x="343.9" y="535" width="144.3" height="22" rx="4"/><text class="lab" x="416.0" y="551" text-anchor="middle">④ 자산·부채·자본</text><rect class="focal" x="130" y="740" width="300" height="76" rx="6"/><text class="name inv" x="280.0" y="774.0" text-anchor="middle">⑤ 당기순이익 1,450</text><text class="body inv" x="280.0" y="795.0" text-anchor="middle">수익 4,000 − 비용 2,550</text><path class="flow" d="M200 680 L200 740"/><rect class="mask" x="155.7" y="699" width="88.5" height="22" rx="4"/><text class="lab" x="200" y="715" text-anchor="middle">차액 1,450</text><path class="flow" d="M360 680 L360 740"/><rect class="mask" x="315.7" y="699" width="88.5" height="22" rx="4"/><text class="lab" x="360" y="715" text-anchor="middle">차액 1,450</text><rect class="node" x="24" y="876" width="240" height="92" rx="6"/><text class="name" x="144.0" y="908.5" text-anchor="middle">손익 칸 합계</text><text class="body" x="144.0" y="929.5" text-anchor="middle">4,000 = 4,000</text><text class="small" x="144.0" y="948.5" text-anchor="middle">순이익은 차변에 기입</text><rect class="node" x="296" y="876" width="240" height="92" rx="6"/><text class="name" x="416.0" y="908.5" text-anchor="middle">재무상태표 칸 합계</text><text class="body" x="416.0" y="929.5" text-anchor="middle">29,600 = 29,600</text><text class="small" x="416.0" y="948.5" text-anchor="middle">순이익은 대변에 기입</text><path class="flow" d="M200 816 L200 876"/><rect class="mask" x="155.1" y="835" width="89.9" height="22" rx="4"/><text class="lab" x="200" y="851" text-anchor="middle">차변에 기입</text><path class="flow" d="M360 816 L360 876"/><rect class="mask" x="315.1" y="835" width="89.9" height="22" rx="4"/><text class="lab" x="360" y="851" text-anchor="middle">대변에 기입</text><rect class="zone" x="24" y="996" width="512" height="76" rx="8"/><text class="small" x="40" y="1022">주의: 정산표 재무상태표 칸 29,600 ≠ 자산총계 29,150</text><text class="small" x="40" y="1046">대손충당금 50 · 감가상각누계액 400이 정산표에선</text><text class="small" x="40" y="1066">대변에 남고, 재무상태표에선 자산에서 차감되기 때문</text><path class="flow" d="M24 1100 H54"/><text class="small" x="62" y="1105">흐름·순서</text><path class="dash" d="M150 1100 H180"/><text class="small" x="188" y="1105">확인·대체(되돌림)</text><rect class="focal" x="330" y="1092" width="22" height="16" rx="3"/><text class="small" x="360" y="1105">중심 개념</text><rect class="zone" x="440" y="1092" width="22" height="16" rx="3"/><text class="small" x="470" y="1105">범위·묶음</text>
</svg>
