<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 709" role="img" aria-labelledby="mis-gl-4d-ethical-principles-title mis-gl-4d-ethical-principles-desc">
  <title id="mis-gl-4d-ethical-principles-title">여섯 윤리 원칙이 묻는 질문</title>
  <desc id="mis-gl-4d-ethical-principles-desc">황금률은 입장을 바꾸면 괜찮은가, 칸트의 정언명령은 모두가 해도 되는가, 미끄러운 비탈 규칙은 계속 반복해도 되는가, 공리주의 원칙은 가장 큰 가치는 무엇인가, 위험 회피 원칙은 가장 적은 피해는 무엇인가, 공짜 점심은 없다 규칙은 허락 없이 써도 되는가를 묻는다는 대응 그림</desc>
  <defs><marker id="mis-gl-4d-ethical-principles-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4d-ethical-principles-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4d-ethical-principles-a)}.flow.both{marker-start:url(#mis-gl-4d-ethical-principles-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4d-ethical-principles-m)}.dash.both{marker-start:url(#mis-gl-4d-ethical-principles-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="709"/>
  <text class="tag" x="24" y="40">4장 · 4-3 책임 개념과 판단 원칙 ②</text><text class="title" x="24" y="74">여섯 윤리 원칙이 묻는 질문</text><text class="subtitle" x="24" y="104">원칙 이름보다 그 원칙이 던지는 질문으로 구분한다. 원칙마다 결론이 다를 수</text><text class="subtitle" x="24" y="124">있다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="224" height="68" rx="6"/><text class="small" x="136" y="200.5" text-anchor="middle">Golden Rule</text><text class="name" x="136" y="221.5" text-anchor="middle">황금률</text><rect class="node" x="312" y="172" width="224" height="68" rx="6"/><text class="name" x="424" y="200" text-anchor="middle">입장을 바꿔도</text><text class="name" x="424" y="223" text-anchor="middle">괜찮은가?</text><path class="flow" d="M248 206 L312 206"/><rect class="mask" x="258.6" y="195" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="211" text-anchor="middle">질문</text><rect class="node" x="24" y="250" width="224" height="81" rx="6"/><text class="small" x="136" y="276" text-anchor="middle">Kant's categorical</text><text class="small" x="136" y="294" text-anchor="middle">imperative</text><text class="name" x="136" y="315" text-anchor="middle">칸트의 정언명령</text><rect class="node" x="312" y="250" width="224" height="81" rx="6"/><text class="name" x="424" y="296" text-anchor="middle">모두가 해도 되는가?</text><path class="flow" d="M248 290.5 L312 290.5"/><rect class="mask" x="258.6" y="279.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="295.5" text-anchor="middle">질문</text><rect class="node" x="24" y="341" width="224" height="81" rx="6"/><text class="small" x="136" y="367" text-anchor="middle">Slippery slope (rule of</text><text class="small" x="136" y="385" text-anchor="middle">change)</text><text class="name" x="136" y="406" text-anchor="middle">미끄러운 비탈</text><rect class="node" x="312" y="341" width="224" height="81" rx="6"/><text class="name" x="424" y="387" text-anchor="middle">계속 반복해도 되는가?</text><path class="flow" d="M248 381.5 L312 381.5"/><rect class="mask" x="258.6" y="370.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="386.5" text-anchor="middle">질문</text><rect class="node" x="24" y="432" width="224" height="63" rx="6"/><text class="small" x="136" y="458" text-anchor="middle">Utilitarian principle</text><text class="name" x="136" y="479" text-anchor="middle">공리주의</text><rect class="node" x="312" y="432" width="224" height="63" rx="6"/><text class="name" x="424" y="469" text-anchor="middle">가장 큰 가치는?</text><path class="flow" d="M248 463.5 L312 463.5"/><rect class="mask" x="258.6" y="452.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="468.5" text-anchor="middle">질문</text><rect class="node" x="24" y="505" width="224" height="63" rx="6"/><text class="small" x="136" y="531" text-anchor="middle">Risk aversion principle</text><text class="name" x="136" y="552" text-anchor="middle">위험 회피</text><rect class="node" x="312" y="505" width="224" height="63" rx="6"/><text class="name" x="424" y="542" text-anchor="middle">가장 적은 피해는?</text><path class="flow" d="M248 536.5 L312 536.5"/><rect class="mask" x="258.6" y="525.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="541.5" text-anchor="middle">질문</text><rect class="node" x="24" y="578" width="224" height="63" rx="6"/><text class="small" x="136" y="604" text-anchor="middle">No free lunch rule</text><text class="name" x="136" y="625" text-anchor="middle">공짜 점심은 없다</text><rect class="node" x="312" y="578" width="224" height="63" rx="6"/><text class="name" x="424" y="615" text-anchor="middle">허락 없이 써도 되나?</text><path class="flow" d="M248 609.5 L312 609.5"/><rect class="mask" x="258.6" y="598.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="614.5" text-anchor="middle">질문</text><path class="flow" d="M24 665 H54"/><text class="small" x="62" y="670">흐름·데이터 제공</text>
</svg>
