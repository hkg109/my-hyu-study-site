<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 757" role="img" aria-labelledby="mis-gl-1a-digital-firm-title mis-gl-1a-digital-firm-desc">
  <title id="mis-gl-1a-digital-firm-title">디지털 기업의 세 특징</title>
  <desc id="mis-gl-1a-digital-firm-desc">세계화, IT 혁신, 새 사업모형이 디지털 기업을 만들도록 영향을 주고, 디지털 기업은 관계, 핵심 프로세스, 핵심 자산의 세 특징을 포함하며, 그 결과 time shifting과 space shifting이 가능해지는 계층 그림</desc>
  <defs><marker id="mis-gl-1a-digital-firm-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-1a-digital-firm-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-1a-digital-firm-a)}.flow.both{marker-start:url(#mis-gl-1a-digital-firm-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-1a-digital-firm-m)}.dash.both{marker-start:url(#mis-gl-1a-digital-firm-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="757"/>
  <text class="tag" x="24" y="40">1장 · 1-1 디지털 기업과 변화</text><text class="title" x="24" y="74">디지털 기업의 세 특징</text><text class="subtitle" x="24" y="104">환경 변화가 디지털 전환을 압박하고, 세 특징이 갖춰지면 시간·장소의 제약이</text><text class="subtitle" x="24" y="124">줄어든다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="outside" x="24" y="172" width="161" height="92" rx="6"/><text class="name" x="104.5" y="200" text-anchor="middle">세계화</text><text class="body" x="104.5" y="227" text-anchor="middle">연결 비용 ↓</text><text class="body" x="104.5" y="247.5" text-anchor="middle">기회·경쟁 ↑</text><rect class="outside" x="199" y="172" width="161" height="92" rx="6"/><text class="name" x="279.5" y="200" text-anchor="middle">IT 혁신</text><text class="body" x="279.5" y="227" text-anchor="middle">클라우드·모바일</text><text class="body" x="279.5" y="247.5" text-anchor="middle">AI·빅데이터</text><rect class="outside" x="374" y="172" width="161" height="92" rx="6"/><text class="name" x="454.5" y="200" text-anchor="middle">새 사업모형</text><text class="body" x="454.5" y="227" text-anchor="middle">스트리밍</text><text class="body" x="454.5" y="247.5" text-anchor="middle">온디맨드</text><rect class="focal" x="24" y="322" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="348" text-anchor="middle">Digital firm</text><text class="name inv" x="280" y="369" text-anchor="middle">디지털 기업</text><text class="body inv" x="280" y="396" text-anchor="middle">중요한 관계·핵심 프로세스·핵심 자산이 디지털로 연결·수행·관리된다</text><rect class="node" x="24" y="469.5" width="161" height="71.5" rx="6"/><text class="name" x="104.5" y="497.5" text-anchor="middle">관계</text><text class="body" x="104.5" y="524.5" text-anchor="middle">고객·공급업체·직원</text><rect class="node" x="199" y="469.5" width="161" height="71.5" rx="6"/><text class="name" x="279.5" y="497.5" text-anchor="middle">핵심 프로세스</text><text class="body" x="279.5" y="524.5" text-anchor="middle">주문→결제→배송</text><rect class="node" x="374" y="469.5" width="161" height="71.5" rx="6"/><text class="name" x="454.5" y="497.5" text-anchor="middle">핵심 자산</text><text class="body" x="454.5" y="524.5" text-anchor="middle">지식재산·재무·인적</text><rect class="node" x="24" y="599" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="625" text-anchor="middle">Time shifting</text><text class="name" x="148.5" y="646" text-anchor="middle">시간 제약 ↓</text><text class="body" x="148.5" y="673" text-anchor="middle">24시간 업무가 이어짐</text><rect class="node" x="287" y="599" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="625" text-anchor="middle">Space shifting</text><text class="name" x="411.5" y="646" text-anchor="middle">장소 제약 ↓</text><text class="body" x="411.5" y="673" text-anchor="middle">어디서나 수행·조정</text><path class="line" d="M104.5 264 V290.1"/><path class="line" d="M279.5 264 V290.1"/><path class="line" d="M454.5 264 V290.1"/><path class="line" d="M104.5 290.1 H454.5"/><path class="dash" d="M280 290.1 L280 322"/><rect class="mask" x="258.6" y="295.05" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="311.05" text-anchor="middle">영향</text><path class="line" d="M280 411.5 V443.4"/><path class="line" d="M104.5 443.4 H454.5"/><path class="flow" d="M104.5 443.4 L104.5 469.5"/><path class="flow" d="M279.5 443.4 L279.5 469.5"/><path class="flow" d="M454.5 443.4 L454.5 469.5"/><rect class="mask" x="258.6" y="416.45" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="432.45" text-anchor="middle">포함</text><path class="flow" d="M280 541 L280 599"/><rect class="mask" x="244.1" y="559" width="71.8" height="22" rx="4"/><text class="lab" x="280" y="575" text-anchor="middle">가능해짐</text><path class="flow" d="M24 712.5 H54"/><text class="small" x="62" y="717.5">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 712.5 H221.94875000000002"/><text class="small" x="229.94875000000002" y="717.5">영향·제약</text><rect class="focal" x="312.22900000000004" y="704.5" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="717.5">중심 개념</text><rect class="outside" x="422.34250000000003" y="704.5" width="22" height="16" rx="3"/><text class="small" x="452.34250000000003" y="717.5">조직 밖 주체</text>
</svg>
