  <title id="cpp-04-array-memory-title">double x[8] — 붙어 있는 8칸, 번호는 0부터</title>
  <desc id="cpp-04-array-memory-desc">double 배열 x의 원소 8개가 메모리에 8바이트씩 연속으로 놓이고 첨자는 0부터 7까지이며, x[8]은 배열 밖이라 잘못된 접근이라는 그림</desc>
