,'Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">8.0</text><text x="306" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">x[3]</text><text x="306" y="208" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+24</text><rect x="344" y="152" width="76" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="382" y="177" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">2.5</text><text x="382" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">x[4]</text><text x="382" y="208" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+32</text><rect x="420" y="152" width="76" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="458" y="177" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">12.0</text><text x="458" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">x[5]</text><text x="458" y="208" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+40</text><rect x="496" y="152" width="76" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="534" y="177" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">14.0</text><text x="534" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">x[6]</text><text x="534" y="208" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+48</text><rect x="572" y="152" width="76" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="610" y="177" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">-54.5</text><text x="610" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">x[7]</text><text x="610" y="208" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="400" fill="#929087" text-anchor="middle">+56</text><rect x="648" y="152" width="40" height="40" fill="#f3e3dc" stroke="#a8431f" stroke-dasharray="5,4"/><text x="668" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">x[8]</text><text x="32" y="244" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">첫 원소는 x[0], 마지막은 x[7] (원소 n개면 n-1).</text><text x="32" y="268" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">x[8]처럼 범위를 벗어나도 컴파일은 되지만, 실행 중 오류나 엉뚱한 값이 나온다.</text>
