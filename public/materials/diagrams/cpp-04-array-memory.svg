    <marker id="cpp-04-array-memory-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-04-array-memory-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-04-array-memory-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="364" fill="#f7f6f2"/>
