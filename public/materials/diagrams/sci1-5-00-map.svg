<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-labelledby="sci1-5-00-map-title sci1-5-00-map-desc">
  <title id="sci1-5-00-map-title">V. 힘의 작용 — 단원 한눈에 보기</title>
  <desc id="sci1-5-00-map-desc">단원의 흐름을 위에서 아래로 네 단계로 보여 준다. 1 힘의 표현(힘의 3요소, 화살표), 2 합력과 평형, 3 여러 가지 힘(중력, 탄성력, 마찰력, 부력), 4 알짜힘과 운동 상태 변화. 오른쪽에는 단원 질문인 스쿠버 다이버가 각 단계와 어떻게 이어지는지 적었다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="640"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">V. 힘의 작용 — 단원 한눈에 보기</text><text class="subtitle" x="24.0" y="104.0">힘을 표현하고 → 더하고 → 종류를 나누고 → 운동을 설명한다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="156.0" width="330.0" height="70.0" rx="6"/><circle class="node" cx="56.0" cy="191.0" r="17.0"/><text class="name" x="56.0" y="197.0" text-anchor="middle">1</text><text class="name" x="86.0" y="186.0">힘의 표현</text><text class="small" x="86.0" y="210.0">힘의 3요소 · 화살표 · 단위 N</text><rect class="zone" x="24.0" y="254.0" width="330.0" height="70.0" rx="6"/><circle class="node" cx="56.0" cy="289.0" r="17.0"/><text class="name" x="56.0" y="295.0" text-anchor="middle">2</text><text class="name" x="86.0" y="284.0">합력과 평형</text><text class="small" x="86.0" y="308.0">같은 방향은 더하고, 반대 방향은 뺀다</text><rect class="zone" x="24.0" y="352.0" width="330.0" height="114.0" rx="6"/><circle class="node" cx="56.0" cy="387.0" r="17.0"/><text class="name" x="56.0" y="393.0" text-anchor="middle">3</text><text class="name" x="86.0" y="382.0">여러 가지 힘</text><rect class="focal" x="24.0" y="494.0" width="330.0" height="70.0" rx="6"/><circle class="node" cx="56.0" cy="529.0" r="17.0"/><text class="name" x="56.0" y="535.0" text-anchor="middle">4</text><text class="name inv" x="86.0" y="524.0">알짜힘과 운동</text><text class="small inv" x="86.0" y="548.0">알짜힘 0 → 그대로 / 0 아님 → 변한다</text><line x1="189.0" y1="228.0" x2="189.0" y2="242.0" stroke="#1d1d1a" stroke-width="2"/><path d="M189.0,252.0 L184.5,242.0 L193.5,242.0 Z" fill="#1d1d1a"/><line x1="189.0" y1="326.0" x2="189.0" y2="340.0" stroke="#1d1d1a" stroke-width="2"/><path d="M189.0,350.0 L184.5,340.0 L193.5,340.0 Z" fill="#1d1d1a"/><line x1="189.0" y1="468.0" x2="189.0" y2="482.0" stroke="#1d1d1a" stroke-width="2"/><path d="M189.0,492.0 L184.5,482.0 L193.5,482.0 Z" fill="#1d1d1a"/><rect class="node" x="86.0" y="400.0" width="58.0" height="50.0" rx="6"/><text class="lab" x="115.0" y="430.0" text-anchor="middle">중력</text><rect class="node" x="150.0" y="400.0" width="58.0" height="50.0" rx="6"/><text class="lab" x="179.0" y="430.0" text-anchor="middle">탄성력</text><rect class="node" x="214.0" y="400.0" width="58.0" height="50.0" rx="6"/><text class="lab" x="243.0" y="430.0" text-anchor="middle">마찰력</text><rect class="node" x="278.0" y="400.0" width="58.0" height="50.0" rx="6"/><text class="lab" x="307.0" y="430.0" text-anchor="middle">부력</text><rect class="node" x="376.0" y="156.0" width="160.0" height="408.0" rx="6"/><text class="small" x="456.0" y="184.0" text-anchor="middle">단원 질문</text><text class="lab" x="456.0" y="208.0" text-anchor="middle">스쿠버 다이버는</text><text class="lab" x="456.0" y="228.0" text-anchor="middle">어떻게 오르내릴까?</text><rect class="deep" x="426.0" y="280.0" width="18.0" height="40.0" rx="6"/><rect class="solid" x="442.0" y="274.0" width="28.0" height="52.0" rx="10"/><circle class="solid" cx="456.0" cy="260.0" r="12.0"/><rect class="node" x="447.0" y="255.0" width="18.0" height="9.0" rx="3"/><path class="solid" d="M444,326 L436,348 L452,348 Z"/><path class="solid" d="M468,326 L476,348 L460,348 Z"/><line class="thin" x1="392.0" y1="378.0" x2="520.0" y2="378.0"/><text class="small" x="456.0" y="400.0" text-anchor="middle">중력 · 부력을</text><text class="small" x="456.0" y="418.0" text-anchor="middle">화살표로 그린다</text><line class="thin" x1="392.0" y1="426.0" x2="520.0" y2="426.0"/><text class="small" x="456.0" y="448.0" text-anchor="middle">두 힘을 더해</text><text class="small" x="456.0" y="466.0" text-anchor="middle">알짜힘을 구한다</text><line class="thin" x1="392.0" y1="474.0" x2="520.0" y2="474.0"/><text class="small" x="456.0" y="496.0" text-anchor="middle">알짜힘 방향으로</text><text class="small" x="456.0" y="514.0" text-anchor="middle">운동이 변한다</text><text class="small" x="24.0" y="604.0">각 단계는 앞 단계의 도구를 그대로 쓴다. 4단계에서 다이버 질문에 답한다.</text>
</svg>
