<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 882" role="img" aria-labelledby="adsp-l04a-priority-quadrant-title adsp-l04a-priority-quadrant-desc">
  <title id="adsp-l04a-priority-quadrant-title">시급성 · 난이도 우선순위 사분면</title>
  <desc id="adsp-l04a-priority-quadrant-desc">세로축은 난이도로 위가 어려움, 가로축은 시급성으로 왼쪽이 현재, 오른쪽이 미래다. 왼쪽 위 Ⅰ은 현재·어려움, 오른쪽 위 Ⅱ는 미래·어려움으로 가장 나중, 왼쪽 아래 Ⅲ은 현재·쉬움으로 가장 먼저, 오른쪽 아래 Ⅳ는 미래·쉬움이다. 실선 화살표는 시급성 기준 순서 Ⅲ, Ⅳ, Ⅱ를, 점선 화살표는 난이도 기준 순서 Ⅲ, Ⅰ, Ⅱ를 보여 준다. 아래에 난이도는 투자 비용 Volume·Variety·Velocity, 시급성은 비즈니스 효과 Value와 연결됨을 적었다.</desc>
  <defs><marker id="adsp-l04a-priority-quadrant-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l04a-priority-quadrant-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l04a-priority-quadrant-a)}.flow.both{marker-start:url(#adsp-l04a-priority-quadrant-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l04a-priority-quadrant-m)}.dash.both{marker-start:url(#adsp-l04a-priority-quadrant-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="882"/>
  <text class="tag" x="24" y="40">ADsP · 2과목 2장 · 마스터플랜</text><text class="title" x="24" y="74">시급성 · 난이도 우선순위 사분면</text><text class="subtitle" x="24" y="104">Ⅲ에서 시작해 Ⅱ로 끝난다 — 기준 축을 따라 한 칸씩 움직인다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="node" x="96" y="164" width="204" height="150" rx="6"/><text class="big" x="198" y="204" text-anchor="middle">Ⅰ</text><text class="lab" x="198" y="230" text-anchor="middle">현재 · 어려움</text><text class="task" x="198" y="260" text-anchor="middle">시급하지만 난이도 높음</text><text class="task" x="198" y="284" text-anchor="middle">경영진 판단으로 조정 가능</text><rect class="deep" x="332" y="164" width="204" height="150" rx="6"/><text class="big" x="434" y="204" text-anchor="middle">Ⅱ</text><text class="lab" x="434" y="230" text-anchor="middle">미래 · 어려움</text><text class="task" x="434" y="260" text-anchor="middle">중장기 추진</text><text class="task" x="434" y="284" text-anchor="middle">가장 나중 (마지막)</text><rect class="focal" x="96" y="358" width="204" height="150" rx="6"/><text class="big inv" x="198" y="398" text-anchor="middle">Ⅲ</text><text class="lab inv" x="198" y="424" text-anchor="middle">현재 · 쉬움</text><text class="task inv" x="198" y="454" text-anchor="middle">바로 적용</text><text class="task inv" x="198" y="478" text-anchor="middle">가장 먼저 (1순위)</text><rect class="node" x="332" y="358" width="204" height="150" rx="6"/><text class="big" x="434" y="398" text-anchor="middle">Ⅳ</text><text class="lab" x="434" y="424" text-anchor="middle">미래 · 쉬움</text><text class="task" x="434" y="454" text-anchor="middle">중장기 관점</text><text class="task" x="434" y="478" text-anchor="middle">바로 적용은 가능</text><path class="flow" d="M300 478 L332 478"/><path class="flow" d="M496 358 L496 314"/><path class="dash" d="M136 358 L136 314"/><path class="dash" d="M300 194 L332 194"/><text class="small" x="150" y="341">난이도 기준</text><text class="small" x="482" y="341" text-anchor="end">시급성 기준</text><path class="flow" d="M70 508 L70 164"/><text class="lab" x="40" y="184" text-anchor="middle">어려움</text><text class="lab" x="40" y="500" text-anchor="middle">쉬움</text><text class="name" x="40" y="330" text-anchor="middle">난이도</text><path class="flow" d="M96 532 L536 532"/><text class="lab" x="198" y="558" text-anchor="middle">현재 (시급)</text><text class="lab" x="434" y="558" text-anchor="middle">미래</text><text class="name" x="316" y="586" text-anchor="middle">시급성 →</text><rect class="node" x="24" y="618" width="512" height="92" rx="6"/><text class="task" x="40" y="646"><tspan class="b">시급성 기준</tspan>: Ⅲ → Ⅳ → Ⅱ (실선, 가로로 먼저 이동)</text><text class="task" x="40" y="672"><tspan class="b">난이도 기준</tspan>: Ⅲ → Ⅰ → Ⅱ (점선, 세로로 먼저 이동)</text><text class="small" x="40" y="698">번호는 왼쪽 위 Ⅰ, 오른쪽 위 Ⅱ, 왼쪽 아래 Ⅲ, 오른쪽 아래 Ⅳ</text><rect class="zone" x="24" y="728" width="512" height="66" rx="6"/><text class="task" x="40" y="754">난이도 = 투자 비용(Investment) · Volume, Variety, Velocity</text><text class="task" x="40" y="778">시급성 = 비즈니스 효과(Return) · Value</text><path class="flow" d="M24 826 H54"/><text class="small" x="62" y="831">시급성 기준 이동</text><path class="dash" d="M183.14 826 H213.14"/><text class="small" x="221.14" y="831">난이도 기준 이동</text><rect class="focal" x="342.28" y="818" width="22" height="16" rx="3"/><text class="small" x="372.28" y="831">1순위 (Ⅲ)</text><rect class="deep" x="24" y="844" width="22" height="16" rx="3"/><text class="small" x="54" y="857">마지막 (Ⅱ)</text>
</svg>
