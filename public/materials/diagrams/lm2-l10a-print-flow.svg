<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 956" width="560" height="956" role="img" aria-labelledby="lm2-l10a-print-flow-title lm2-l10a-print-flow-desc">
  <title id="lm2-l10a-print-flow-title">인쇄 요청이 프린터에 닿기까지</title>
  <desc id="lm2-l10a-print-flow-desc">위쪽에 System V 계열 lp와 BSD 계열 lpr 두 명령 상자가 있고, 둘 다 CUPS 데몬 cupsd로 화살표가 모인다. cupsd는 IPP와 TCP 631을 쓴다. 이어서 스풀 대기열 /var/spool/cups, PPD와 Ghostscript로 형식을 바꾸는 필터, usb·ipp·lpd·socket 백엔드를 거쳐 프린터로 내려간다. 오른쪽 상자는 대기열을 다루는 명령 짝 lpstat과 lpq, cancel과 lprm, lpadmin과 lpc를 적었다.</desc>
  <defs><marker id="lm2-l10a-print-flow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l10a-print-flow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l10a-print-flow-a)}.flow.both{marker-start:url(#lm2-l10a-print-flow-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l10a-print-flow-m)}.dash.both{marker-start:url(#lm2-l10a-print-flow-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="956"/>
  <text class="tag" x="24" y="40">리눅스마스터 2급 · 2과목 6장</text><text class="title" x="24" y="74">인쇄 요청이 프린터에 닿기까지</text><text class="subtitle" x="24" y="104">어느 계열 명령으로 요청하든 CUPS가 같은 대기열로 받는다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="node" x="24" y="156" width="248" height="90" rx="6"/><text class="small" x="148.0" y="185.0" text-anchor="middle">System V 계열</text><text class="name" x="148.0" y="207.0" text-anchor="middle">lp -d 프린터 -n 매수</text><text class="small" x="148.0" y="227.0" text-anchor="middle">lpstat · cancel</text><rect class="node" x="288" y="156" width="248" height="90" rx="6"/><text class="small" x="412.0" y="185.0" text-anchor="middle">BSD 계열</text><text class="name" x="412.0" y="207.0" text-anchor="middle">lpr -P 프린터 -# 매수</text><text class="small" x="412.0" y="227.0" text-anchor="middle">lpq · lprm · lpc</text><path class="flow" d="M148 246 V290"/><path class="flow" d="M412 246 V268 H300 V290"/><rect class="focal" x="24" y="290" width="352" height="80" rx="6"/><text class="small inv" x="200.0" y="314.0" text-anchor="middle">CUPS 데몬</text><text class="name inv" x="200.0" y="336.0" text-anchor="middle">cupsd</text><text class="small inv" x="200.0" y="356.0" text-anchor="middle">IPP · TCP 631 · localhost:631 웹 관리</text><path class="flow" d="M200 370 V428"/><rect class="mask" x="164.5" y="382" width="71.0" height="22" rx="4"/><text class="lab" x="200" y="398" text-anchor="middle">작업 등록</text><rect class="deep" x="24" y="428" width="352" height="80" rx="6"/><text class="small" x="200.0" y="452.0" text-anchor="middle">Spool</text><text class="name" x="200.0" y="474.0" text-anchor="middle">스풀 대기열 (queue)</text><text class="small" x="200.0" y="494.0" text-anchor="middle">/var/spool/cups · 작업(job) 단위</text><path class="flow" d="M200 508 V566"/><rect class="mask" x="153.5" y="520" width="93.0" height="22" rx="4"/><text class="lab" x="200" y="536" text-anchor="middle">순서대로 꺼냄</text><rect class="node" x="24" y="566" width="352" height="80" rx="6"/><text class="small" x="200.0" y="590.0" text-anchor="middle">Filter</text><text class="name" x="200.0" y="612.0" text-anchor="middle">필터 — 형식 변환</text><text class="small" x="200.0" y="632.0" text-anchor="middle">PPD · Ghostscript (PS → 프린터 언어)</text><path class="flow" d="M200 646 V704"/><rect class="mask" x="153.5" y="658" width="93.0" height="22" rx="4"/><text class="lab" x="200" y="674" text-anchor="middle">변환된 데이터</text><rect class="node" x="24" y="704" width="352" height="80" rx="6"/><text class="small" x="200.0" y="728.0" text-anchor="middle">Backend</text><text class="name" x="200.0" y="750.0" text-anchor="middle">백엔드 — 연결 방식</text><text class="small" x="200.0" y="770.0" text-anchor="middle">usb · ipp · lpd(515) · socket(9100)</text><path class="flow" d="M200 784 V842"/><rect class="mask" x="75.0" y="796" width="250.0" height="22" rx="4"/><text class="lab" x="200" y="812" text-anchor="middle">/dev/lp0 · /dev/usb/lp0 · 네트워크</text><rect class="outside" x="24" y="842" width="352" height="50" rx="6"/><text class="name" x="200.0" y="873.0" text-anchor="middle">프린터</text><rect class="zone" x="400" y="428" width="136" height="202" rx="6"/><text class="lab" x="468" y="452" text-anchor="middle">대기열 다루기</text><text class="small" x="468" y="472" text-anchor="middle">System V ↔ BSD</text><text class="small" x="468" y="500" text-anchor="middle">상태 확인</text><text class="body" x="468" y="520" text-anchor="middle">lpstat ↔ lpq</text><text class="small" x="468" y="544" text-anchor="middle">작업 취소</text><text class="body" x="468" y="564" text-anchor="middle">cancel ↔ lprm</text><text class="small" x="468" y="588" text-anchor="middle">관리·제어</text><text class="body" x="468" y="608" text-anchor="middle">lpadmin ↔ lpc</text><path class="dash" d="M400 468 H376"/><path class="flow" d="M24 932 H54"/><text class="small" x="62" y="937">흐름</text><path class="dash" d="M108 932 H138"/><text class="small" x="146" y="937">조회·제어</text><rect class="focal" x="228" y="924" width="22" height="16" rx="3"/><text class="small" x="258" y="937">중심 데몬</text><rect class="outside" x="340" y="924" width="22" height="16" rx="3"/><text class="small" x="370" y="937">출력 장치</text>
</svg>
