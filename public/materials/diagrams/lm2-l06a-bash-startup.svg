<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 930" role="img" aria-labelledby="lm2-l06a-bash-startup-title lm2-l06a-bash-startup-desc">
<title id="lm2-l06a-bash-startup-title">bash 설정 파일이 읽히는 순서</title>
<desc id="lm2-l06a-bash-startup-desc">로그인 셸은 /etc/profile, /etc/profile.d의 스크립트, 개인 ~/.bash_profile, 개인 ~/.bashrc, 전역 /etc/bashrc 순으로 읽고, 새 터미널 창 같은 비로그인 셸은 ~/.bashrc에서 합류하며, 로그아웃할 때는 ~/.bash_logout이 실행되는 흐름도</desc>
<defs><marker id="lm2-l06a-bash-startup-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l06a-bash-startup-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
<style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l06a-bash-startup-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l06a-bash-startup-m)}.plain{marker-end:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:700 16px 'D2Coding','JetBrains Mono','Menlo','Consolas',monospace;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
<rect class="bg" width="560" height="930"/>
<text class="tag" x="24" y="40">리눅스마스터 2급 · 2과목 2장</text><text class="title" x="24" y="74">bash 설정 파일이 읽히는 순서</text><text class="subtitle" x="24" y="104">로그인할 때는 /etc → 홈 순서로 profile을, 셸을 열 때마다 bashrc를</text><text class="subtitle" x="24" y="124">읽는다. 로그아웃 파일은 따로 하나다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
<rect class="zone" x="16" y="170" width="340" height="590" rx="8"/><text class="small" x="28" y="192">로그인 셸 (콘솔·ssh 로그인)</text><rect class="zone" x="372" y="170" width="172" height="590" rx="8"/><text class="small" x="384" y="192">비로그인 셸</text>
<rect class="outside" x="96" y="206" width="180" height="44" rx="6"/><text class="name" x="186.0" y="234.0" text-anchor="middle">로그인</text>
<rect class="node" x="28" y="282" width="316" height="64" rx="6"/><text class="code" x="186.0" y="309.0" text-anchor="middle">/etc/profile</text><text class="small" x="186.0" y="331.0" text-anchor="middle">전체 사용자 · 환경 변수 PATH 등</text>
<rect class="deep" x="28" y="376" width="316" height="56" rx="6"/><text class="code" x="186.0" y="399.0" text-anchor="middle">/etc/profile.d/*.sh</text><text class="small" x="186.0" y="421.0" text-anchor="middle">/etc/profile이 불러옴</text>
<rect class="node" x="28" y="462" width="316" height="64" rx="6"/><text class="code" x="186.0" y="489.0" text-anchor="middle">~/.bash_profile</text><text class="small" x="186.0" y="511.0" text-anchor="middle">개인 · 로그인할 때 한 번</text>
<rect class="focal" x="28" y="566" width="316" height="64" rx="6"/><text class="code inv" x="186.0" y="593.0" text-anchor="middle">~/.bashrc</text><text class="small inv" x="186.0" y="615.0" text-anchor="middle">개인 · alias·함수 · 셸 열 때마다</text>
<rect class="node" x="28" y="670" width="316" height="64" rx="6"/><text class="code" x="186.0" y="697.0" text-anchor="middle">/etc/bashrc</text><text class="small" x="186.0" y="719.0" text-anchor="middle">전체 사용자 · 전역 alias·PS1</text>
<rect class="outside" x="384" y="446" width="148" height="80" rx="6"/><text class="name" x="458.0" y="481.0" text-anchor="middle">새 터미널 창</text><text class="small" x="458.0" y="503.0" text-anchor="middle">bash 실행</text>
<path class="flow" d="M186 250 V282"/><path class="flow" d="M186 346 V376"/><path class="flow" d="M186 432 V462"/><path class="flow" d="M186 526 V566"/><path class="flow" d="M186 630 V670"/>
<rect class="mask" x="196.0" y="535" width="150.0" height="22" rx="4"/><text class="lab" x="271.0" y="551" text-anchor="middle">. ~/.bashrc 로 호출</text>
<rect class="mask" x="196.0" y="639" width="120.0" height="22" rx="4"/><text class="lab" x="256.0" y="655" text-anchor="middle">안에서 다시 호출</text>
<path class="flow" d="M458 526 V598 H344"/>
<rect class="mask" x="410.0" y="564" width="96.0" height="22" rx="4"/><text class="lab" x="458.0" y="580" text-anchor="middle">여기서 합류</text>
<text class="small" x="384" y="660">bashrc 계열만</text><text class="small" x="384" y="680">읽는다</text>
<rect class="outside" x="28" y="786" width="140" height="52" rx="6"/><text class="name" x="98.0" y="818.0" text-anchor="middle">로그아웃</text>
<rect class="node" x="216" y="786" width="320" height="52" rx="6"/><text class="code" x="376.0" y="818.0" text-anchor="middle">~/.bash_logout</text>
<path class="flow" d="M168 812 H216"/>
<path class="flow" d="M24 882 H54"/><text class="small" x="62" y="887">순서·호출</text><rect class="focal" x="149.5" y="874" width="22" height="16" rx="3"/><text class="small" x="179.5" y="887">합류 지점</text><rect class="outside" x="261.5" y="874" width="22" height="16" rx="3"/><text class="small" x="291.5" y="887">시작 사건</text><rect class="zone" x="373.5" y="874" width="22" height="16" rx="3"/><text class="small" x="403.5" y="887">셸 종류</text>
</svg>
