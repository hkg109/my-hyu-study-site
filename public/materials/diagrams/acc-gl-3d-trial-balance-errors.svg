<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1034" role="img" aria-labelledby="acc-gl-3d-trial-balance-errors-title acc-gl-3d-trial-balance-errors-desc">
  <title id="acc-gl-3d-trial-balance-errors-title">시산표가 잡는 오류와 못 잡는 오류</title>
  <desc id="acc-gl-3d-trial-balance-errors-desc">맨 위 시산표 검사에서 차변 합계와 대변 합계가 불일치하면 오류가 반드시 있으므로 찾아서 정정하고, 일치해도 오류가 없다는 보장은 아니라는 두 갈래 그림. 아래에는 시산표로 확인되지 않는 네 가지 오류(거래 전체 누락, 이중 기록, 엉뚱한 계정, 같은 틀린 금액)를 ㈜바람돌이 수치 예와 함께 나열하고, 엉뚱한 계정 오류의 정정 분개로 예제 3을 보여 준다</desc>
  <defs><marker id="acc-gl-3d-trial-balance-errors-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-3d-trial-balance-errors-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-3d-trial-balance-errors-a)}.flow.both{marker-start:url(#acc-gl-3d-trial-balance-errors-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-3d-trial-balance-errors-m)}.dash.both{marker-start:url(#acc-gl-3d-trial-balance-errors-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1034"/>
  <text class="tag" x="24" y="40">3장 · 3-4 수정전 시산표와 오류</text><text class="title" x="24" y="74">시산표가 잡는 오류와 못 잡는 오류</text><text class="subtitle" x="24" y="104">시산표는 대차 합계만 비교한다. 그래서 한쪽만 틀린 오류는 잡지만,</text><text class="subtitle" x="24" y="124">양쪽이 똑같이 틀린 오류는 지나친다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="170" width="512" height="66" rx="6"/><text class="small inv" x="280.0" y="195.8" text-anchor="middle">복식부기의 자기검증기능</text><text class="name inv" x="280.0" y="219.8" text-anchor="middle">차변 합계 = 대변 합계 ?</text><path class="flow" d="M148 236 L148 286"/><rect class="mask" x="120.8" y="251" width="54.5" height="22" rx="4"/><text class="lab" x="148" y="266" text-anchor="middle">불일치</text><path class="flow" d="M412 236 L412 286"/><rect class="mask" x="391.5" y="251" width="41.0" height="22" rx="4"/><text class="lab" x="412" y="266" text-anchor="middle">일치</text><rect class="deep" x="24" y="286" width="248" height="150" rx="6"/><text class="name" x="148.0" y="326.8" text-anchor="middle">오류가 반드시 있다</text><text class="body" x="148.0" y="348.5" text-anchor="middle">→ 찾아서 정정한다</text><text class="small" x="148.0" y="368.8" text-anchor="middle">예) 한쪽에만 기록·전기</text><text class="small" x="148.0" y="388.8" text-anchor="middle">예) 양쪽 금액을 다르게 기록</text><text class="small" x="148.0" y="408.8" text-anchor="middle">예) 합계·잔액 계산 실수</text><rect class="node" x="288" y="286" width="248" height="150" rx="6"/><text class="name" x="412.0" y="322.8" text-anchor="middle">오류가 없다는</text><text class="name" x="412.0" y="346.8" text-anchor="middle">보장은 아니다</text><text class="body" x="412.0" y="368.5" text-anchor="middle">차변·대변에 같은 금액의</text><text class="body" x="412.0" y="390.5" text-anchor="middle">오류는 합계에 드러나지</text><text class="body" x="412.0" y="412.5" text-anchor="middle">않는다</text><path class="flow" d="M412 436 L412 486"/><rect class="mask" x="374.0" y="451" width="76.0" height="22" rx="4"/><text class="lab" x="412" y="466" text-anchor="middle">이런 경우</text><rect class="zone" x="16" y="486" width="528" height="312" rx="8"/><text class="small" x="28" y="510">시산표로 확인되지 않는 오류 4가지</text><rect class="node" x="28" y="522" width="504" height="58" rx="6"/><text class="body" x="42" y="546.5">① 거래 전체의 분개 누락 · 전기 누락</text><text class="small" x="42" y="566.8">예: ⑩ 급여 1,700을 통째로 빠뜨림 → 양쪽 모두 1,700 작음</text><rect class="node" x="28" y="588" width="504" height="58" rx="6"/><text class="body" x="42" y="612.5">② 한 거래를 두 번 분개 · 두 번 전기</text><text class="small" x="42" y="632.8">예: ⑤ 1,800을 두 번 기록 → 양쪽 모두 1,800 큼</text><rect class="node" x="28" y="654" width="504" height="58" rx="6"/><text class="body" x="42" y="678.5">③ 분개 · 전기가 엉뚱한 계정에</text><text class="small" x="42" y="698.8">예: 매출채권 회수를 매출액으로 기록 (예제 3)</text><rect class="node" x="28" y="720" width="504" height="58" rx="6"/><text class="body" x="42" y="744.5">④ 틀린 금액을 차변 · 대변에 똑같이</text><text class="small" x="42" y="764.8">예: ③ 임차비용 900을 양쪽 9,000으로 기록</text><path class="flow" d="M280 798 L280 848"/><rect class="mask" x="231.2" y="813" width="97.5" height="22" rx="4"/><text class="lab" x="280" y="828" text-anchor="middle">③을 발견하면</text><rect class="node" x="24" y="848" width="512" height="120" rx="6"/><text class="small" x="280.0" y="880.8" text-anchor="middle">예제 3 · 정정 분개</text><text class="body" x="280.0" y="902.5" text-anchor="middle">틀린 분개: (차) 현금 50,000 (대) 매출액 50,000</text><text class="body" x="280.0" y="924.5" text-anchor="middle">정정 분개: (차) 매출액 50,000 (대) 매출채권 50,000</text><text class="small" x="280.0" y="944.8" text-anchor="middle">→ 매출액은 취소되고 매출채권만 줄어 올바른 결과</text><path class="flow" d="M24 998 H54"/><text class="small" x="62" y="1003">흐름·결합</text><rect class="focal" x="154" y="990" width="22" height="16" rx="3"/><text class="small" x="184" y="1003">중심 개념</text><rect class="deep" x="276" y="990" width="22" height="16" rx="3"/><text class="small" x="306" y="1003">반드시 오류</text><rect class="zone" x="412" y="990" width="22" height="16" rx="3"/><text class="small" x="442" y="1003">시산표의 한계</text>
</svg>
