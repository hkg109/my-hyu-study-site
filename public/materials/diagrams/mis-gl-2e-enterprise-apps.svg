<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" role="img" aria-labelledby="mis-gl-2e-enterprise-apps-title mis-gl-2e-enterprise-apps-desc">
  <title id="mis-gl-2e-enterprise-apps-title">ERP를 중심으로 안팎을 잇는 네 시스템</title>
  <desc id="mis-gl-2e-enterprise-apps-desc">공급업체·물류와 SCM, 고객·유통과 CRM이 각각 연결되고, SCM과 CRM이 ERP의 단일 중앙 저장소와 데이터를 주고받으며, KMS가 이 과정의 노하우를 수집·적용하는 구조. SCM은 조직 경계를 넘는 조직 간 시스템이다</desc>
  <defs><marker id="mis-gl-2e-enterprise-apps-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2e-enterprise-apps-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2e-enterprise-apps-a)}.flow.both{marker-start:url(#mis-gl-2e-enterprise-apps-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2e-enterprise-apps-m)}.dash.both{marker-start:url(#mis-gl-2e-enterprise-apps-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="800"/>
  <text class="tag" x="24" y="40">2장 · 2-3 전사 애플리케이션</text><text class="title" x="24" y="74">ERP를 중심으로 안팎을 잇는 네 시스템</text><text class="subtitle" x="24" y="104">TPS~ESS가 관리 계층(세로) 분류라면, 전사 애플리케이션은 부서와 회사</text><text class="subtitle" x="24" y="124">경계(가로)를 잇는 분류다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="267" width="528" height="449" rx="8"/><text class="small" x="280" y="287" text-anchor="middle">전사 애플리케이션</text><rect class="outside" x="24" y="198" width="249" height="63" rx="6"/><text class="small" x="148.5" y="224" text-anchor="middle">공급 측 · 조직 밖</text><text class="name" x="148.5" y="245" text-anchor="middle">공급업체 · 물류</text><rect class="outside" x="287" y="198" width="249" height="63" rx="6"/><text class="small" x="411.5" y="224" text-anchor="middle">고객 측 · 조직 밖</text><text class="name" x="411.5" y="245" text-anchor="middle">고객 · 유통</text><rect class="node" x="24" y="301" width="249" height="110" rx="6"/><text class="small" x="148.5" y="327" text-anchor="middle">Supply chain management</text><text class="name" x="148.5" y="348" text-anchor="middle">SCM</text><text class="body" x="148.5" y="375" text-anchor="middle">주문·생산·재고 공유</text><text class="body" x="148.5" y="395.5" text-anchor="middle">조직 간 시스템</text><rect class="node" x="287" y="301" width="249" height="110" rx="6"/><text class="small" x="411.5" y="327" text-anchor="middle">Customer relationship mgmt.</text><text class="name" x="411.5" y="348" text-anchor="middle">CRM</text><text class="body" x="411.5" y="375" text-anchor="middle">영업·마케팅·서비스 통합</text><text class="body" x="411.5" y="395.5" text-anchor="middle">고객 유지</text><rect class="focal" x="24" y="469" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="495" text-anchor="middle">Enterprise system = ERP</text><text class="name inv" x="280" y="516" text-anchor="middle">ERP · 단일 중앙 저장소</text><text class="body inv" x="280" y="543" text-anchor="middle">영업·생산·회계·인사 데이터를 통합</text><rect class="node" x="24" y="616.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="642.5" text-anchor="middle">Knowledge management</text><text class="name" x="280" y="663.5" text-anchor="middle">KMS</text><text class="body" x="280" y="690.5" text-anchor="middle">조직 지식을 수집·공유·적용</text><path class="flow both" d="M148.5 261 L148.5 301"/><path class="flow both" d="M411.5 261 L411.5 301"/><path class="flow both" d="M148.5 411 L148.5 469"/><rect class="mask" x="103.2" y="429" width="90.6" height="22" rx="4"/><text class="lab" x="148.5" y="445" text-anchor="middle">데이터 공유</text><path class="flow both" d="M411.5 411 L411.5 469"/><rect class="mask" x="366.2" y="429" width="90.6" height="22" rx="4"/><text class="lab" x="411.5" y="445" text-anchor="middle">데이터 공유</text><path class="flow both" d="M280 558.5 L280 616.5"/><rect class="mask" x="217.0" y="576.5" width="125.9" height="22" rx="4"/><text class="lab" x="280" y="592.5" text-anchor="middle">노하우 수집·적용</text><path class="flow" d="M24 730 H54"/><text class="small" x="62" y="735">흐름·데이터 제공</text><path class="flow both" d="M193.94875000000002 730 H221.94875000000002"/><text class="small" x="229.94875000000002" y="735">상호 영향</text><rect class="focal" x="310.06225" y="722" width="22" height="16" rx="3"/><text class="small" x="340.06225" y="735">중심 개념</text><rect class="outside" x="420.17575" y="722" width="22" height="16" rx="3"/><text class="small" x="450.17575" y="735">조직 밖 주체</text><rect class="zone" x="24" y="748" width="22" height="16" rx="3"/><text class="small" x="54" y="761">범위·묶음</text>
</svg>
