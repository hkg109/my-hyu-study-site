<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 906" role="img" aria-labelledby="mis-gl-5a-consumerization-byod-title mis-gl-5a-consumerization-byod-desc">
  <title id="mis-gl-5a-consumerization-byod-title">IT 소비자화 ⊃ BYOD → 통제 상실 → MDM</title>
  <desc id="mis-gl-5a-consumerization-byod-desc">소비자 시장에서 먼저 등장한 스마트폰과 Gmail·Dropbox 같은 서비스가 기업으로 퍼지는 IT 소비자화가 개인 기기의 업무 사용인 BYOD와 소비자 서비스의 업무 사용을 포함하고, 그 결과 IT 부서가 하드웨어 통제를 잃어 취약점이 커지며, 대응으로 모바일 기기 관리(MDM)와 새 정책·절차가 필요해지는 흐름 그림</desc>
  <defs><marker id="mis-gl-5a-consumerization-byod-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-5a-consumerization-byod-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-5a-consumerization-byod-a)}.flow.both{marker-start:url(#mis-gl-5a-consumerization-byod-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-5a-consumerization-byod-m)}.dash.both{marker-start:url(#mis-gl-5a-consumerization-byod-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="906"/>
  <text class="tag" x="24" y="40">5장 · 5-3 모바일·양자·그린·가상화·클라우드 ①</text><text class="title" x="24" y="74">IT 소비자화 ⊃ BYOD → 통제 상실 → MDM</text><text class="subtitle" x="24" y="104">새 기술은 소비자 시장에서 먼저 나와 기업으로 들어온다. BYOD는 그 한</text><text class="subtitle" x="24" y="124">측면이고, 대가는 IT 부서의 통제 상실이다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="outside" x="24" y="172" width="512" height="71.5" rx="6"/><text class="name" x="280" y="200" text-anchor="middle">소비자 시장</text><text class="body" x="280" y="227" text-anchor="middle">스마트폰·태블릿, Gmail·Dropbox·Google Maps</text><rect class="focal" x="24" y="301.5" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="327.5" text-anchor="middle">Consumerization of IT</text><text class="name inv" x="280" y="348.5" text-anchor="middle">IT 소비자화</text><text class="body inv" x="280" y="375.5" text-anchor="middle">IT 장비·서비스의 획득·관리 방식을 다시 생각하게 함</text><rect class="node" x="24" y="449" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="475" text-anchor="middle">BYOD</text><text class="name" x="148.5" y="496" text-anchor="middle">개인 기기의 업무 사용</text><text class="body" x="148.5" y="523" text-anchor="middle">소비자화의 한 측면</text><rect class="node" x="287" y="449" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="475" text-anchor="middle">Consumer services</text><text class="name" x="411.5" y="496" text-anchor="middle">소비자 서비스의 업무 사용</text><text class="body" x="411.5" y="523" text-anchor="middle">Gmail·Dropbox·TikTok</text><rect class="node" x="24" y="618.5" width="512" height="71.5" rx="6"/><text class="name" x="280" y="646.5" text-anchor="middle">IT 부서가 기기 통제를 잃음</text><text class="body" x="280" y="673.5" text-anchor="middle">취약점(vulnerabilities) ↑</text><rect class="node" x="24" y="748" width="512" height="89.5" rx="6"/><text class="small" x="280" y="774" text-anchor="middle">MDM + 새 정책·절차</text><text class="name" x="280" y="795" text-anchor="middle">모바일 기기 관리</text><text class="body" x="280" y="822" text-anchor="middle">여러 모바일 OS의 기기를 감시·관리·보호</text><path class="flow" d="M280 243.5 L280 301.5"/><rect class="mask" x="187.1" y="261.5" width="185.9" height="22" rx="4"/><text class="lab" x="280" y="277.5" text-anchor="middle">먼저 등장해 기업으로 확산</text><path class="line" d="M280 391 V422.9"/><path class="line" d="M148.5 422.9 H411.5"/><path class="flow" d="M148.5 422.9 L148.5 449"/><path class="flow" d="M411.5 422.9 L411.5 449"/><rect class="mask" x="258.6" y="395.95" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="411.95" text-anchor="middle">포함</text><path class="flow" d="M280 690 L280 748"/><rect class="mask" x="239.3" y="708" width="81.3" height="22" rx="4"/><text class="lab" x="280" y="724" text-anchor="middle">대응 (5-5)</text><path class="dash plain" d="M148.5 538.5 V566.5"/><path class="dash plain" d="M411.5 538.5 V566.5"/><path class="dash plain" d="M148.5 566.5 H411.5"/><path class="dash" d="M280 566.5 L280 618.5"/><rect class="mask" x="258.6" y="555.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="571.5" text-anchor="middle">영향</text><path class="flow" d="M24 861.5 H54"/><text class="small" x="62" y="866.5">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 861.5 H221.94875000000002"/><text class="small" x="229.94875000000002" y="866.5">영향·제약</text><rect class="focal" x="312.22900000000004" y="853.5" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="866.5">중심 개념</text><rect class="outside" x="422.34250000000003" y="853.5" width="22" height="16" rx="3"/><text class="small" x="452.34250000000003" y="866.5">조직 밖 주체</text>
</svg>
