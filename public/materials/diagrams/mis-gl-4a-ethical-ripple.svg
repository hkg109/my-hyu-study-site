<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 657" role="img" aria-labelledby="mis-gl-4a-ethical-ripple-title mis-gl-4a-ethical-ripple-desc">
  <title id="mis-gl-4a-ethical-ripple-title">기술 충격은 개인 → 사회 → 정치로 번진다</title>
  <desc id="mis-gl-4a-ethical-ripple-desc">가운데 새 정보기술을 개인의 윤리 문제, 사회의 사회 문제, 정치의 정치 문제가 차례로 감싸는 동심 범위로 그리고, 아래에 정보 권리·재산권·책임과 통제·시스템 품질·삶의 질의 다섯 도덕적 차원을 나열한 그림. 기술은 빠르고 법은 느리다</desc>
  <defs><marker id="mis-gl-4a-ethical-ripple-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4a-ethical-ripple-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4a-ethical-ripple-a)}.flow.both{marker-start:url(#mis-gl-4a-ethical-ripple-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4a-ethical-ripple-m)}.dash.both{marker-start:url(#mis-gl-4a-ethical-ripple-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="657"/>
  <text class="tag" x="24" y="40">4장 · 4-1 윤리 쟁점의 구조</text><text class="title" x="24" y="74">기술 충격은 개인 → 사회 → 정치로 번진다</text><text class="subtitle" x="24" y="104">Figure 4.1 · 연못에 던진 돌(새 IT)이 만든 물결을 다섯 도덕적 차원으로</text><text class="subtitle" x="24" y="124">점검한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="172" width="528" height="237.5" rx="8"/><text class="small" x="28" y="192">Polity · 정치 문제: 법·책임 배분</text><rect class="deep" x="38" y="206" width="484" height="187.5" rx="8"/><text class="small" x="50" y="226">Society · 사회 문제: 규범·기대</text><rect class="zone" x="60" y="240" width="440" height="137.5" rx="8"/><text class="small" x="72" y="260">Individual · 윤리 문제: 개인의 선택</text><rect class="focal" x="84" y="272" width="392" height="89.5" rx="6"/><text class="small inv" x="280" y="298" text-anchor="middle">Rock in the pond</text><text class="name inv" x="280" y="319" text-anchor="middle">새로운 정보기술</text><text class="body inv" x="280" y="346" text-anchor="middle">기존 규칙으로 설명 안 되는 상황</text><rect class="zone" x="16" y="459.5" width="528" height="139" rx="8"/><text class="small" x="28" y="479.5">Five moral dimensions · 다섯 도덕적 차원</text><path class="flow" d="M280 409.5 L280 459.5"/><rect class="mask" x="249.2" y="423.5" width="61.7" height="22" rx="4"/><text class="lab" x="280" y="439.5" text-anchor="middle">분석 틀</text><rect class="node" x="24" y="493.5" width="249" height="42.5" rx="6"/><text class="body" x="148.5" y="519.5" text-anchor="middle">① 정보 권리·의무</text><rect class="node" x="287" y="493.5" width="249" height="42.5" rx="6"/><text class="body" x="411.5" y="519.5" text-anchor="middle">② 재산권·의무</text><rect class="node" x="24" y="546" width="161" height="42.5" rx="6"/><text class="body" x="104.5" y="572" text-anchor="middle">③ 책임과 통제</text><rect class="node" x="199" y="546" width="161" height="42.5" rx="6"/><text class="body" x="279.5" y="572" text-anchor="middle">④ 시스템 품질</text><rect class="node" x="374" y="546" width="161" height="42.5" rx="6"/><text class="body" x="454.5" y="572" text-anchor="middle">⑤ 삶의 질</text><path class="flow" d="M24 612.5 H54"/><text class="small" x="62" y="617.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="604.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="617.5">중심 개념</text><rect class="zone" x="302.06225" y="604.5" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="617.5">범위·묶음</text>
</svg>
