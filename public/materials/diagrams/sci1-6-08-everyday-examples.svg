<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 548" width="560" height="548" role="img" aria-labelledby="sci1-6-08-everyday-examples-title sci1-6-08-everyday-examples-desc">
  <title id="sci1-6-08-everyday-examples-title">생활 속 기체의 부피 변화</title>
  <desc id="sci1-6-08-everyday-examples-desc">두 열로 생활 속 예를 정리했다. 왼쪽 열은 온도가 일정하고 압력이 변하는 압력과 부피 관계로, 높은 산에서 과자 봉지가 부풂, 잠수부가 내뿜은 공기 방울이 위로 갈수록 커짐, 입구를 막은 주사기를 누르면 부피가 줄어듦, 축구공에 공기를 넣을수록 단단해짐이 있다. 오른쪽 열은 압력이 일정하고 온도가 변하는 온도와 부피 관계로, 찌그러진 탁구공이 뜨거운 물에서 펴짐, 열기구, 냉장고 속 페트병이 찌그러짐, 냉장 달걀을 삶으면 껍데기에 금이 감이 있다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.ptc{fill:#1d1d1a}.ptcl{fill:#65645e}</style>
  <rect class="bg" width="560" height="548"/><text class="tag" x="24.0" y="40.0">중1 과학 · VI. 기체의 성질</text><text class="title" x="24.0" y="74.0">생활 속 기체의 부피 변화</text><text class="subtitle" x="24.0" y="104.0">무엇이 변했는지 보고 두 관계 중 하나로 분류한다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="deep" x="24.0" y="150.0" width="248.0" height="54.0" rx="6"/><text class="name" x="148.0" y="174.0" text-anchor="middle">압력과 부피 관계</text><text class="small" x="148.0" y="194.0" text-anchor="middle">온도 일정 · 압력이 변함</text><rect class="zone" x="24.0" y="216.0" width="248.0" height="60.0" rx="6"/><circle class="node" cx="46.0" cy="246.0" r="11.0"/><text class="lab" x="46.0" y="251.0" text-anchor="middle">1</text><text class="lab" x="66.0" y="241.0">높은 산의 과자 봉지</text><text class="small" x="66.0" y="262.0">바깥 압력↓ → 봉지 부풂</text><rect class="zone" x="24.0" y="286.0" width="248.0" height="60.0" rx="6"/><circle class="node" cx="46.0" cy="316.0" r="11.0"/><text class="lab" x="46.0" y="321.0" text-anchor="middle">2</text><text class="lab" x="66.0" y="311.0">잠수부의 공기 방울</text><text class="small" x="66.0" y="332.0">위로 갈수록 압력↓ → 커짐</text><rect class="zone" x="24.0" y="356.0" width="248.0" height="60.0" rx="6"/><circle class="node" cx="46.0" cy="386.0" r="11.0"/><text class="lab" x="46.0" y="391.0" text-anchor="middle">3</text><text class="lab" x="66.0" y="381.0">입구 막은 주사기</text><text class="small" x="66.0" y="402.0">피스톤 누름 → 부피↓</text><rect class="zone" x="24.0" y="426.0" width="248.0" height="60.0" rx="6"/><circle class="node" cx="46.0" cy="456.0" r="11.0"/><text class="lab" x="46.0" y="461.0" text-anchor="middle">4</text><text class="lab" x="66.0" y="451.0">축구공·자전거 바퀴</text><text class="small" x="66.0" y="472.0">공기를 넣을수록 단단해짐</text><rect class="focal" x="288.0" y="150.0" width="248.0" height="54.0" rx="6"/><text class="name inv" x="412.0" y="174.0" text-anchor="middle">온도와 부피 관계</text><text class="small inv" x="412.0" y="194.0" text-anchor="middle">압력 일정 · 온도가 변함</text><rect class="zone" x="288.0" y="216.0" width="248.0" height="60.0" rx="6"/><circle class="node" cx="310.0" cy="246.0" r="11.0"/><text class="lab" x="310.0" y="251.0" text-anchor="middle">1</text><text class="lab" x="330.0" y="241.0">찌그러진 탁구공</text><text class="small" x="330.0" y="262.0">뜨거운 물 → 펴짐</text><rect class="zone" x="288.0" y="286.0" width="248.0" height="60.0" rx="6"/><circle class="node" cx="310.0" cy="316.0" r="11.0"/><text class="lab" x="310.0" y="321.0" text-anchor="middle">2</text><text class="lab" x="330.0" y="311.0">열기구</text><text class="small" x="330.0" y="332.0">공기를 데움 → 부피↑</text><rect class="zone" x="288.0" y="356.0" width="248.0" height="60.0" rx="6"/><circle class="node" cx="310.0" cy="386.0" r="11.0"/><text class="lab" x="310.0" y="391.0" text-anchor="middle">3</text><text class="lab" x="330.0" y="381.0">냉장고 속 페트병</text><text class="small" x="330.0" y="402.0">차가워짐 → 찌그러짐</text><rect class="zone" x="288.0" y="426.0" width="248.0" height="60.0" rx="6"/><circle class="node" cx="310.0" cy="456.0" r="11.0"/><text class="lab" x="310.0" y="461.0" text-anchor="middle">4</text><text class="lab" x="330.0" y="451.0">냉장 달걀 삶기</text><text class="small" x="330.0" y="472.0">공기 주머니↑ → 껍데기 금</text><text class="small" x="24.0" y="524.0">판단 순서: 무엇이 일정한지 찾고 → 압력이 변했는지, 온도가 변했는지 고른다.</text>
</svg>
