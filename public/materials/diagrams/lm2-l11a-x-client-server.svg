<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 900" width="560" height="900" role="img" aria-labelledby="lm2-l11a-x-client-server-title lm2-l11a-x-client-server-desc">
  <title id="lm2-l11a-x-client-server-title">X 서버와 X 클라이언트의 원격 구조</title>
  <desc id="lm2-l11a-x-client-server-desc">위쪽 원격 서버 192.168.0.20에서 xclock, firefox, gimp 같은 X 클라이언트가 실행되고 DISPLAY=192.168.0.10:0으로 설정되어 있다. 이 클라이언트들이 X 프로토콜로 TCP 6000 포트를 통해 아래쪽 내 PC 192.168.0.10의 X 서버 Xorg에 그리기를 요청한다. 가운데 접근 제어 띠에는 호스트 단위 허용 xhost와 .Xauthority 쿠키를 확인하는 xauth 두 관문이 있다. X 서버는 모니터, 키보드, 마우스를 관리한다. 맨 아래에는 더 안전한 방법으로 ssh -X 암호화 터널을 적었다.</desc>
  <defs><marker id="lm2-l11a-x-client-server-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l11a-x-client-server-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l11a-x-client-server-a)}.flow.both{marker-start:url(#lm2-l11a-x-client-server-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l11a-x-client-server-m)}.dash.both{marker-start:url(#lm2-l11a-x-client-server-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="900"/>
  <text class="tag" x="24" y="40">리눅스마스터 2급 · 3과목 1장</text><text class="title" x="24" y="74">X 서버는 화면이 있는 쪽이다</text><text class="subtitle" x="24" y="104">원격에서 실행된 클라이언트가 내 PC의 X 서버에 그려 달라고</text><text class="subtitle" x="24" y="124">요청한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="172" width="528" height="150" rx="6"/><text class="small" x="28" y="194">원격 서버 · 192.168.0.20 — 프로그램이 실행되는 곳</text><rect class="node" x="32" y="210" width="160" height="58" rx="6"/><text class="small" x="112.0" y="233.0" text-anchor="middle">X 클라이언트</text><text class="name" x="112.0" y="255.0" text-anchor="middle">xclock</text><rect class="node" x="200" y="210" width="160" height="58" rx="6"/><text class="small" x="280.0" y="233.0" text-anchor="middle">X 클라이언트</text><text class="name" x="280.0" y="255.0" text-anchor="middle">firefox</text><rect class="node" x="368" y="210" width="160" height="58" rx="6"/><text class="small" x="448.0" y="233.0" text-anchor="middle">X 클라이언트</text><text class="name" x="448.0" y="255.0" text-anchor="middle">gimp</text><text class="lab" x="280" y="302" text-anchor="middle">export DISPLAY=192.168.0.10:0</text><path class="flow" d="M280 322 V372"/><rect class="mask" x="115.0" y="328" width="330.0" height="22" rx="4"/><text class="lab" x="280" y="344" text-anchor="middle">X 프로토콜 · TCP 6000 (6000 + 디스플레이 번호)</text><rect class="deep" x="16" y="372" width="528" height="132" rx="6"/><text class="small" x="28" y="394">접근 제어 — 내 PC(X 서버 쪽)에서 설정</text><rect class="node" x="32" y="406" width="240" height="86" rx="6"/><text class="small" x="152.0" y="433.0" text-anchor="middle">관문 1 · 호스트 단위</text><text class="name" x="152.0" y="455.0" text-anchor="middle">xhost</text><text class="small" x="152.0" y="475.0" text-anchor="middle">xhost +192.168.0.20</text><rect class="node" x="288" y="406" width="240" height="86" rx="6"/><text class="small" x="408.0" y="433.0" text-anchor="middle">관문 2 · 사용자 쿠키</text><text class="name" x="408.0" y="455.0" text-anchor="middle">xauth</text><text class="small" x="408.0" y="475.0" text-anchor="middle">~/.Xauthority · MAGIC-COOKIE</text><path class="flow" d="M280 504 V552"/><rect class="mask" x="228.0" y="510" width="104.0" height="22" rx="4"/><text class="lab" x="280" y="526" text-anchor="middle">통과하면 그리기</text><rect class="zone" x="16" y="552" width="528" height="214" rx="6"/><text class="small" x="28" y="574">내 PC · 192.168.0.10 — 사용자 앞</text><rect class="focal" x="104" y="588" width="352" height="84" rx="6"/><text class="small inv" x="280.0" y="614.0" text-anchor="middle">X 서버 · DISPLAY :0</text><text class="name inv" x="280.0" y="636.0" text-anchor="middle">Xorg</text><text class="small inv" x="280.0" y="656.0" text-anchor="middle">화면에 그리기 · 입력 이벤트를 클라이언트로</text><line class="line" x1="112" y1="672" x2="112" y2="704"/><rect class="node" x="32" y="704" width="160" height="46" rx="6"/><text class="name" x="112.0" y="733.0" text-anchor="middle">모니터</text><line class="line" x1="280" y1="672" x2="280" y2="704"/><rect class="node" x="200" y="704" width="160" height="46" rx="6"/><text class="name" x="280.0" y="733.0" text-anchor="middle">키보드</text><line class="line" x1="448" y1="672" x2="448" y2="704"/><rect class="node" x="368" y="704" width="160" height="46" rx="6"/><text class="name" x="448.0" y="733.0" text-anchor="middle">마우스</text><rect class="outside" x="24" y="786" width="512" height="70" rx="6"/><text class="lab" x="40" y="812">더 안전한 방법 · ssh -X 사용자@원격</text><text class="small" x="40" y="838">암호화 터널 + DISPLAY=localhost:10.0 · 쿠키 자동 설정</text><path class="flow" d="M24 884 H54"/><text class="small" x="62" y="889">그리기 요청</text><rect class="focal" x="156" y="876" width="22" height="16" rx="3"/><text class="small" x="186" y="889">X 서버</text><rect class="deep" x="256" y="876" width="22" height="16" rx="3"/><text class="small" x="286" y="889">접근 제어</text><rect class="outside" x="368" y="876" width="22" height="16" rx="3"/><text class="small" x="398" y="889">대안</text>
</svg>
