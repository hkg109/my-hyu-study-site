<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 657" role="img" aria-labelledby="mis-gl-3f-five-forces-title mis-gl-3f-five-forces-desc">
  <title id="mis-gl-3f-five-forces-title">Porter의 다섯 가지 경쟁 요인</title>
  <desc id="mis-gl-3f-five-forces-desc">가운데 기업과 기존 경쟁자를 두고 위의 신규 진입자, 아래의 대체 제품·서비스, 왼쪽의 공급자, 오른쪽의 고객이 각각 압력 화살표로 기업을 향하는 그림. 기존 경쟁자는 같은 산업 안의 힘이라 가운데에 함께 놓인다</desc>
  <defs><marker id="mis-gl-3f-five-forces-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-3f-five-forces-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-3f-five-forces-a)}.flow.both{marker-start:url(#mis-gl-3f-five-forces-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-3f-five-forces-m)}.dash.both{marker-start:url(#mis-gl-3f-five-forces-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="657"/>
  <text class="tag" x="24" y="40">3장 · 3-4 경쟁 요인과 경쟁 전략 ①</text><text class="title" x="24" y="74">Porter의 다섯 가지 경쟁 요인</text><text class="subtitle" x="24" y="104">Figure 3.8 · 기존 경쟁자 외에 네 방향의 힘이 기업의 전략적 위치와 수익성을</text><text class="subtitle" x="24" y="124">압박한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="outside" x="150" y="172" width="260" height="89.5" rx="6"/><text class="small" x="280" y="198" text-anchor="middle">New market entrants</text><text class="name" x="280" y="219" text-anchor="middle">신규 진입자</text><text class="body" x="280" y="246" text-anchor="middle">진입 장벽은 높은가?</text><rect class="outside" x="150" y="493.5" width="260" height="89.5" rx="6"/><text class="small" x="280" y="519.5" text-anchor="middle">Substitutes</text><text class="name" x="280" y="540.5" text-anchor="middle">대체 제품·서비스</text><text class="body" x="280" y="567.5" text-anchor="middle">가격이 오르면 옮겨 가나?</text><rect class="outside" x="24" y="313.5" width="140" height="128" rx="6"/><text class="small" x="94" y="358.75" text-anchor="middle">Suppliers</text><text class="name" x="94" y="379.75" text-anchor="middle">공급자</text><text class="body" x="94" y="406.75" text-anchor="middle">원가 인상 전가?</text><rect class="outside" x="396" y="313.5" width="140" height="128" rx="6"/><text class="small" x="466" y="358.75" text-anchor="middle">Customers</text><text class="name" x="466" y="379.75" text-anchor="middle">고객</text><text class="body" x="466" y="406.75" text-anchor="middle">쉽게 바꾸나?</text><rect class="focal" x="185" y="313.5" width="190" height="128" rx="6"/><text class="small inv" x="280" y="339.5" text-anchor="middle">기업 + Traditional</text><text class="small inv" x="280" y="357.5" text-anchor="middle">competitors</text><text class="name inv" x="280" y="378.5" text-anchor="middle">기존 경쟁자와 경쟁</text><text class="body inv" x="280" y="405.5" text-anchor="middle">가격·제품·효율·전환</text><text class="body inv" x="280" y="426" text-anchor="middle">비용</text><path class="flow" d="M280 261.5 L280 313.5"/><rect class="mask" x="258.6" y="276.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="292.5" text-anchor="middle">압력</text><path class="flow" d="M280 493.5 L280 441.5"/><rect class="mask" x="258.6" y="456.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="472.5" text-anchor="middle">압력</text><path class="flow" d="M164 377.5 L185 377.5"/><path class="flow" d="M396 377.5 L375 377.5"/><path class="flow" d="M24 613 H54"/><text class="small" x="62" y="618">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="605" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="618">중심 개념</text><rect class="outside" x="302.06225" y="605" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="618">조직 밖 주체</text>
</svg>
