<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 506" width="560" height="506" role="img" aria-labelledby="sci1-6-07-tv-graph-title sci1-6-07-tv-graph-desc">
  <title id="sci1-6-07-tv-graph-title">온도와 부피는 일정하게 함께 늘어난다</title>
  <desc id="sci1-6-07-tv-graph-desc">가로축은 온도 0부터 50 °C, 세로축은 부피 270부터 320 mL이며 세로축 아래쪽은 물결 표시로 생략했다. 0 °C 273 mL, 10 °C 283 mL, 20 °C 293 mL, 30 °C 303 mL, 40 °C 313 mL인 점들이 오른쪽 위로 향하는 한 직선 위에 놓인다. 점선 계단으로 온도가 10 °C 오를 때마다 부피가 10 mL씩 늘어남을 표시했다. 오른쪽 카드는 같은 간격으로 온도가 오르면 부피도 같은 양씩 늘어 직선이 되고, 섭씨온도 그래프는 원점을 지나지 않는다고 정리한다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.ptc{fill:#1d1d1a}.ptcl{fill:#65645e}</style>
  <rect class="bg" width="560" height="506"/><text class="tag" x="24.0" y="40.0">중1 과학 · VI. 기체의 성질</text><text class="title" x="24.0" y="74.0">온도와 부피는 일정하게 함께 늘어난다</text><text class="subtitle" x="24.0" y="104.0">압력이 일정하면 온도가 오를수록 부피가 일정하게 증가한다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><line class="thin" x1="140.0" y1="430.0" x2="140.0" y2="178.0"/><line class="thin" x1="196.0" y1="430.0" x2="196.0" y2="178.0"/><line class="thin" x1="252.0" y1="430.0" x2="252.0" y2="178.0"/><line class="thin" x1="308.0" y1="430.0" x2="308.0" y2="178.0"/><line class="thin" x1="364.0" y1="430.0" x2="364.0" y2="178.0"/><line class="thin" x1="84.0" y1="388.0" x2="364.0" y2="388.0"/><line class="thin" x1="84.0" y1="346.0" x2="364.0" y2="346.0"/><line class="thin" x1="84.0" y1="304.0" x2="364.0" y2="304.0"/><line class="thin" x1="84.0" y1="262.0" x2="364.0" y2="262.0"/><line class="thin" x1="84.0" y1="220.0" x2="364.0" y2="220.0"/><line class="thin" x1="84.0" y1="178.0" x2="364.0" y2="178.0"/><line x1="84.0" y1="430.0" x2="371.8" y2="430.0" stroke="#1d1d1a" stroke-width="1.6"/><path d="M380.8,430.0 L371.8,434.1 L371.8,426.0 Z" fill="#1d1d1a"/><line x1="84.0" y1="430.0" x2="84.0" y2="170.2" stroke="#1d1d1a" stroke-width="1.6"/><path d="M84.0,161.2 L88.1,170.2 L80.0,170.2 Z" fill="#1d1d1a"/><path d="M77.0,421.4 L91.0,415.4 M77.0,413.0 L91.0,407.0" stroke="#1d1d1a" stroke-width="1.5"/><text class="small" x="84.0" y="450.0" text-anchor="middle">0</text><text class="small" x="140.0" y="450.0" text-anchor="middle">10</text><text class="small" x="196.0" y="450.0" text-anchor="middle">20</text><text class="small" x="252.0" y="450.0" text-anchor="middle">30</text><text class="small" x="308.0" y="450.0" text-anchor="middle">40</text><text class="small" x="364.0" y="450.0" text-anchor="middle">50</text><text class="small" x="74.0" y="393.0" text-anchor="end">270</text><text class="small" x="74.0" y="351.0" text-anchor="end">280</text><text class="small" x="74.0" y="309.0" text-anchor="end">290</text><text class="small" x="74.0" y="267.0" text-anchor="end">300</text><text class="small" x="74.0" y="225.0" text-anchor="end">310</text><text class="small" x="74.0" y="183.0" text-anchor="end">320</text><text class="lab" x="224.0" y="472.0" text-anchor="middle">온도 (°C)</text><text class="lab" x="24.0" y="155.2">부피 (mL)</text><line x1="84.0" y1="375.4" x2="347.2" y2="178.0" stroke="#1d1d1a" stroke-width="2.5"/><circle class="focal" cx="84.0" cy="375.4" r="5.0"/><circle class="focal" cx="140.0" cy="333.4" r="5.0"/><circle class="focal" cx="196.0" cy="291.4" r="5.0"/><circle class="focal" cx="252.0" cy="249.4" r="5.0"/><circle class="focal" cx="308.0" cy="207.4" r="5.0"/><path d="M140.0,333.4 L196.0,333.4 L196.0,291.4" fill="none" stroke="#65645e" stroke-width="1.5" stroke-dasharray="4 3"/><text class="small" x="168.0" y="349.4" text-anchor="middle">+10 °C</text><text class="small" x="202.0" y="316.4">+10 mL</text><path d="M252.0,249.4 L308.0,249.4 L308.0,207.4" fill="none" stroke="#65645e" stroke-width="1.5" stroke-dasharray="4 3"/><text class="small" x="280.0" y="265.4" text-anchor="middle">+10 °C</text><text class="small" x="314.0" y="232.4">+10 mL</text><text class="lab" x="98.0" y="399.4">0 °C에서도 273 mL</text><rect class="node" x="400.0" y="176.0" width="136.0" height="168.0" rx="6"/><text class="lab" x="468.0" y="202.0" text-anchor="middle">읽는 법</text><text class="small" x="468.0" y="228.0" text-anchor="middle">온도가 같은 간격으로</text><text class="small" x="468.0" y="246.0" text-anchor="middle">오르면 부피도</text><text class="small" x="468.0" y="264.0" text-anchor="middle">같은 양씩 늘어난다</text><line class="thin" x1="412.0" y1="278.0" x2="524.0" y2="278.0"/><text class="small" x="468.0" y="300.0" text-anchor="middle">→ 오른쪽 위로 향하는</text><text class="lab" x="468.0" y="320.0" text-anchor="middle">직선</text><rect class="focal" x="400.0" y="356.0" width="136.0" height="52.0" rx="6"/><text class="lab inv" x="468.0" y="378.0" text-anchor="middle">°C 그래프는</text>