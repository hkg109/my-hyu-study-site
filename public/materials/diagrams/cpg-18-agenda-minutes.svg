<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 724" role="img" aria-labelledby="cpg-18-agenda-minutes-title cpg-18-agenda-minutes-desc">
  <title id="cpg-18-agenda-minutes-title">안건이 먼저, 회의록은 그 위에</title>
  <desc id="cpg-18-agenda-minutes-desc">국장 이상이 회의 날짜와 안건 항목을 작성해 공개하면 참석자가 미리 읽고, 회의록을 만들 때 서버가 Template과 안건 항목을 합쳐 안건마다 제목 블록과 논의·결정·할 일 칸이 있는 초기 Snapshot을 만든 뒤 공동 편집이 시작되며, 안건은 이 시점에 복사되므로 이후 안건을 고쳐도 회의록은 바뀌지 않는다는 흐름.</desc>
  <defs><marker id="cpg-18-agenda-minutes-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-18-agenda-minutes-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-18-agenda-minutes-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-18-agenda-minutes-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="724"/>
  <text class="tag" x="24" y="40">06-3 · 안건과 회의록</text><text class="title" x="24" y="74">안건이 먼저, 회의록은 그 위에</text><text class="subtitle" x="24" y="104">회의록의 뼈대는 안건이 정한다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <path class="flow" d="M172 224 V264"/><rect class="mask" x="180.0" y="234" width="38.5" height="21" rx="4"/><text class="lab" x="186" y="249">공개</text>
  <path class="flow" d="M172 336 V376"/><rect class="mask" x="180.0" y="346" width="95.4" height="21" rx="4"/><text class="lab" x="186" y="361">회의록 만들기</text>
  <path class="flow" d="M172 464 V504"/>
  <path class="flow" d="M320 420 H340"/>
  <rect class="outside" x="24" y="152" width="512" height="72" rx="6"/><text class="name" x="280" y="183.0" text-anchor="middle">국장 이상 · 안건 작성</text><text class="body" x="280" y="204.5" text-anchor="middle">회의 날짜 · 안건 항목 · 발표 국 · 열람 범위</text>
  <rect class="node" x="24" y="264" width="512" height="72" rx="6"/><text class="name" x="280" y="295.0" text-anchor="middle">안건 공개 (PUBLISHED)</text><text class="body" x="280" y="316.5" text-anchor="middle">참석자가 미리 읽고 자료를 준비</text>
  <rect class="focal" x="24" y="376" width="296" height="88" rx="6"/><text class="lab inv" x="172" y="405.8" text-anchor="middle">서버가 초기 Snapshot 생성</text><text class="small inv" x="172" y="425.1" text-anchor="middle">Template + 안건 항목</text><text class="small inv" x="172" y="444.1" text-anchor="middle">→ 안건마다 제목 블록</text>
  <rect class="zone" x="340" y="376" width="196" height="88" rx="6"/><text class="lab" x="438" y="405.8" text-anchor="middle">안건을 복사해 둔다</text><text class="small" x="438" y="425.1" text-anchor="middle">나중에 안건을 고쳐도</text><text class="small" x="438" y="444.1" text-anchor="middle">회의록은 그대로</text>
  <rect class="deep" x="24" y="504" width="512" height="112" rx="6"/><text class="code" x="40" y="535.5">## 안건 1. 축제 예산</text><text class="small" x="40" y="555.1">논의 · 결정 · 할 일</text><text class="code" x="40" y="575.5">## 안건 2. 간식 행사</text><text class="small" x="40" y="595.1">논의 · 결정 · 할 일</text>
  <text class="small" x="280" y="652" text-anchor="middle">회의록 DRAFT · 이 뼈대 위에서 편집자들이 동시에 적는다</text>
  <rect class="focal" x="24" y="684" width="22" height="16" rx="3"/><text class="small" x="54" y="697">안건 → 회의록 변환</text><rect class="deep" x="188.185" y="684" width="22" height="16" rx="3"/><text class="small" x="218.185" y="697">만들어진 회의록</text><rect class="outside" x="336.845" y="684" width="22" height="16" rx="3"/><text class="small" x="366.845" y="697">작성자</text>
</svg>
