<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" role="img" aria-labelledby="lm2-l08a-vi-modes-title lm2-l08a-vi-modes-desc">
<title id="lm2-l08a-vi-modes-title">vi의 세 모드와 전환 키</title>
<desc id="lm2-l08a-vi-modes-desc">vi 파일로 시작하면 가운데 명령 모드에 들어오고, i·a·o 등으로 입력 모드에 갔다가 ESC로 돌아오며, 콜론이나 슬래시로 ex 모드에 갔다가 Enter나 ESC로 돌아오고, 입력 모드와 ex 모드 사이에는 직접 전환이 없는 그림</desc>
<defs><marker id="lm2-l08a-vi-modes-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l08a-vi-modes-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
<style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l08a-vi-modes-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l08a-vi-modes-m)}.plain{marker-end:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:700 16px 'D2Coding','JetBrains Mono','Menlo','Consolas',monospace;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
<rect class="bg" width="560" height="720"/>
<text class="tag" x="24" y="40">리눅스마스터 2급 · 2과목 4장</text><text class="title" x="24" y="74">vi의 세 모드와 전환 키</text><text class="subtitle" x="24" y="104">모든 전환은 가운데 명령 모드를 거친다.</text><text class="subtitle" x="24" y="124">입력 중에 저장하려면 먼저 ESC로 명령 모드에 나온다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
<rect class="outside" x="190" y="170" width="180" height="44" rx="6"/><text class="code" x="280.0" y="198.0" text-anchor="middle">$ vi 파일</text>
<path class="flow" d="M280 214 V256"/>
<rect class="focal" x="100" y="256" width="360" height="96" rx="6"/><text class="small inv" x="280.0" y="286.0" text-anchor="middle">Command · Normal</text><text class="name inv" x="280.0" y="310.0" text-anchor="middle">명령 모드</text><text class="body inv" x="280.0" y="332.0" text-anchor="middle">이동 · 삭제 · 복사 · 붙여넣기</text>
<rect class="node" x="24" y="460" width="240" height="112" rx="6"/><text class="small" x="144.0" y="487.0" text-anchor="middle">Insert</text><text class="name" x="144.0" y="511.0" text-anchor="middle">입력 모드</text><text class="body" x="144.0" y="533.0" text-anchor="middle">글자를 실제로 입력</text><text class="small" x="144.0" y="555.0" text-anchor="middle">화면 아래 -- INSERT --</text>
<rect class="node" x="296" y="460" width="240" height="112" rx="6"/><text class="small" x="416.0" y="486.0" text-anchor="middle">Ex · Last line</text><text class="name" x="416.0" y="510.0" text-anchor="middle">ex 모드</text><text class="code" x="416.0" y="534.0" text-anchor="middle">:w  :q!  :%s/a/b/g</text><text class="small" x="416.0" y="556.0" text-anchor="middle">화면 맨 아래 줄에서 입력</text>
<path class="flow" d="M130 352 V460"/><path class="flow" d="M200 460 V352"/>
<rect class="mask" x="28.0" y="396" width="96.0" height="22" rx="4"/><text class="lab" x="76.0" y="412" text-anchor="middle">i a o I A O</text>
<rect class="mask" x="206.0" y="396" width="44.0" height="22" rx="4"/><text class="lab" x="228.0" y="412" text-anchor="middle">ESC</text>
<path class="flow" d="M360 352 V460"/><path class="flow" d="M430 460 V352"/>
<rect class="mask" x="302.0" y="396" width="52.0" height="22" rx="4"/><text class="lab" x="328.0" y="412" text-anchor="middle">: / ?</text>
<rect class="mask" x="436.0" y="396" width="96.0" height="22" rx="4"/><text class="lab" x="484.0" y="412" text-anchor="middle">Enter · ESC</text>
<path class="dash plain" d="M144 572 V612 H416 V572"/>
<rect class="mask" x="182.0" y="602" width="196.0" height="22" rx="4"/><text class="lab" x="280.0" y="618" text-anchor="middle">직접 전환 불가 · ESC 먼저</text>
<path class="flow" d="M24 676 H54"/><text class="small" x="62" y="681">전환 키</text><path class="dash" d="M130.5 676 H160.5"/><text class="small" x="168.5" y="681">불가능한 길</text><rect class="focal" x="264.0" y="668" width="22" height="16" rx="3"/><text class="small" x="294.0" y="681">시작 모드</text><rect class="outside" x="376.0" y="668" width="22" height="16" rx="3"/><text class="small" x="406.0" y="681">실행</text>
</svg>
