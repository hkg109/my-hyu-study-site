<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1144" role="img" aria-labelledby="acc-gl-5d-merchandiser-cycle-title acc-gl-5d-merchandiser-cycle-desc">
  <title id="acc-gl-5d-merchandiser-cycle-title">(주)보부상의 12월 회계순환</title>
  <desc id="acc-gl-5d-merchandiser-cycle-desc">위에서 아래로 거래 ①부터 ⑨, 분개장, 총계정원장, 수정전 시산표 127,000원, 결산정리 세 가지, 수정후 시산표 129,000원이 화살표로 이어지고, 맨 아래에서 포괄손익계산서 당기순이익 3,500원과 재무상태표 자산 합계 105,500원으로 갈라지는 그림. 당기순이익은 점선으로 재무상태표 이익잉여금에 연결되고, 오른쪽 점선 영역은 정산표가 수정전 시산표부터 재무제표까지를 한 장에 담는다는 것을 표시한다</desc>
  <defs><marker id="acc-gl-5d-merchandiser-cycle-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-5d-merchandiser-cycle-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-5d-merchandiser-cycle-a)}.flow.both{marker-start:url(#acc-gl-5d-merchandiser-cycle-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-5d-merchandiser-cycle-m)}.dash.both{marker-start:url(#acc-gl-5d-merchandiser-cycle-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1144"/>
  <text class="tag" x="24" y="40">5장 · 5-3 상기업의 회계순환 사례</text><text class="title" x="24" y="74">(주)보부상의 12월 회계순환</text><text class="subtitle" x="24" y="104">기중 거래를 분개·전기하고, 기말에 수정전 시산표 → 결산정리 → 수정후</text><text class="subtitle" x="24" y="124">시산표 → 재무제표 순서로 결산한다. 정산표는 이 과정을 한 장에 담는다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="380" height="89" rx="6"/><text class="small" x="214" y="199" text-anchor="middle">3.1 기중 · 12월</text><text class="name" x="214" y="219" text-anchor="middle">거래 ①–⑨</text><text class="body" x="214" y="243" text-anchor="middle">출자·임차·비품·상품 매매·급여</text><path class="flow" d="M214.0 261 L214.0 301"/><rect class="mask" x="193.5" y="271" width="41" height="22" rx="4"/><text class="lab" x="214" y="287" text-anchor="middle">분개</text><rect class="node" x="24" y="301" width="380" height="69" rx="6"/><text class="name" x="214" y="328" text-anchor="middle">분개장</text><text class="body" x="214" y="352" text-anchor="middle">매입 시 ‘매입’ 계정 (실지재고조사법)</text><path class="flow" d="M214.0 370 L214.0 410"/><rect class="mask" x="193.5" y="380" width="41" height="22" rx="4"/><text class="lab" x="214" y="396" text-anchor="middle">전기</text><rect class="node" x="24" y="410" width="380" height="69" rx="6"/><text class="name" x="214" y="437" text-anchor="middle">총계정원장</text><text class="body" x="214" y="461" text-anchor="middle">계정별 잔액 집계</text><path class="flow" d="M214.0 479 L214.0 519"/><rect class="mask" x="177.975" y="489" width="72.05" height="22" rx="4"/><text class="lab" x="214" y="505" text-anchor="middle">잔액 옮김</text><rect class="deep" x="24" y="519" width="380" height="89" rx="6"/><text class="small" x="214" y="546" text-anchor="middle">3.2 기말 결산</text><text class="name" x="214" y="566" text-anchor="middle">수정전 시산표</text><text class="body" x="214" y="590" text-anchor="middle">차변 = 대변 = 127,000</text><path class="flow" d="M214.0 608 L214.0 648"/><rect class="mask" x="180" y="618" width="68" height="22" rx="4"/><text class="lab" x="214" y="634" text-anchor="middle">결산정리</text><rect class="focal" x="24" y="648" width="380" height="111" rx="6"/><text class="name inv" x="214" y="675" text-anchor="middle">결산정리 분개</text><text class="body inv" x="214" y="699" text-anchor="middle">ⓐ 감가상각비 2,000</text><text class="body inv" x="214" y="720" text-anchor="middle">ⓑ 선급비용 6,000 (임차비용 ↓)</text><text class="body inv" x="214" y="741" text-anchor="middle">ⓒ 매출원가 0 + 15,000 − 2,500</text><path class="flow" d="M214.0 759 L214.0 799"/><rect class="mask" x="193.5" y="769" width="41" height="22" rx="4"/><text class="lab" x="214" y="785" text-anchor="middle">전기</text><rect class="deep" x="24" y="799" width="380" height="69" rx="6"/><text class="name" x="214" y="826" text-anchor="middle">수정후 시산표</text><text class="body" x="214" y="850" text-anchor="middle">차변 = 대변 = 129,000</text><path class="flow" d="M154.0 868 L154.0 892 L114 892 L114 928"/><rect class="mask" x="112.22" y="882" width="75.56" height="22" rx="4"/><text class="lab" x="150" y="898" text-anchor="middle">수익·비용</text><path class="flow" d="M274.0 868 L274.0 892 L416 892 L416 928"/><rect class="mask" x="324.94" y="882" width="110.12" height="22" rx="4"/><text class="lab" x="380" y="898" text-anchor="middle">자산·부채·자본</text><rect class="node" x="24" y="928" width="240" height="118" rx="6"/><text class="small" x="144" y="959" text-anchor="middle">12/1 – 12/31</text><text class="name" x="144" y="979" text-anchor="middle">포괄손익계산서</text><text class="body" x="144" y="1003" text-anchor="middle">매출 25,000 − 비용 21,500</text><text class="body" x="144" y="1024" text-anchor="middle">당기순이익 3,500</text><rect class="node" x="296" y="928" width="240" height="118" rx="6"/><text class="small" x="416" y="959" text-anchor="middle">12/31 현재</text><text class="name" x="416" y="979" text-anchor="middle">재무상태표</text><text class="body" x="416" y="1003" text-anchor="middle">자산 105,500 = 부채 2,000</text><text class="body" x="416" y="1024" text-anchor="middle">+ 자본 103,500</text><path class="dash" d="M144 1046 L144 1074 L416 1074 L416 1046"/><rect class="mask" x="173.775" y="1064" width="212.45" height="22" rx="4"/><text class="lab" x="280" y="1080" text-anchor="middle">당기순이익 3,500 → 이익잉여금</text><rect class="outside" x="420" y="519" width="116" height="345" rx="6"/><text class="small" x="478" y="623.5" text-anchor="middle">3.3</text><text class="name" x="478" y="643.5" text-anchor="middle">정산표</text><text class="small" x="478" y="663.5" text-anchor="middle">수정전 시산표</text><text class="small" x="478" y="683.5" text-anchor="middle">+ 결산정리</text><text class="small" x="478" y="703.5" text-anchor="middle">+ 수정후 시산표</text><text class="small" x="478" y="723.5" text-anchor="middle">+ 손익 · 재무</text><text class="small" x="478" y="743.5" text-anchor="middle">상태표 열을</text><text class="small" x="478" y="763.5" text-anchor="middle">한 장에 정리</text><path class="flow" d="M24 1114 H54"/><text class="small" x="62" y="1119">흐름·기록 순서</text><path class="dash" d="M176.61 1114 H206.61"/><text class="small" x="214.61" y="1119">확인·대응 관계</text><rect class="focal" x="329.22" y="1106" width="22" height="16" rx="3"/><text class="small" x="359.22" y="1119">중심 개념</text><rect class="outside" x="439.27000000000004" y="1106" width="22" height="16" rx="3"/><text class="small" x="469.27" y="1119">보조 정보</text>
</svg>
