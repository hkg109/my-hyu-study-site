<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 790" width="560" height="790" role="img" aria-labelledby="adsp-l09c-confusion-title adsp-l09c-confusion-desc">
  <title id="adsp-l09c-confusion-title">오분류표에서 지표 읽기</title>
  <desc id="adsp-l09c-confusion-desc">실제를 행, 예측을 열로 둔 오분류표에 TP 40, FN 10, FP 20, TN 130을 넣고, 정확도는 대각선 두 칸, 정밀도는 예측 양성 열, 재현율은 실제 양성 행, 특이도는 실제 음성 행을 분모로 쓴다는 것을 작은 표 네 개로 보여 주는 그림. 검은 칸은 분자, 회색 칸은 분모에만 들어가는 칸이다.</desc>
  <defs><marker id="adsp-l09c-confusion-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l09c-confusion-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l09c-confusion-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.dasharrow{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l09c-confusion-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#65645e;stroke-width:1.2;fill:none}.grid{stroke:#e4e1d8;stroke-width:1;fill:none}.axis{stroke:#1d1d1a;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.head{font:700 16px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.bodym{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.tiny{font:600 12px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="790"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 3장 · 분류 모델 평가</text><text class="title" x="24" y="74">오분류표에서 지표 읽기</text><text class="subtitle" x="24" y="104">지표마다 분모가 행(실제)인지 열(예측)인지만 기억하면 된다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
<rect class="deep" x="170" y="154" width="366" height="40" rx="0"/><text class="lab" x="261.5" y="180" text-anchor="middle">예측 Positive</text><text class="lab" x="444.5" y="180" text-anchor="middle">예측 Negative</text><rect class="deep" x="24" y="194" width="146" height="64" rx="0"/><text class="lab" x="97" y="224" text-anchor="middle">실제 Positive</text><text class="tiny" x="97" y="244" text-anchor="middle">50명</text><rect class="focal" x="170" y="194" width="183" height="64" rx="0"/><text class="name inv" x="261.5" y="224" text-anchor="middle">TP 40</text><text class="tiny inv" x="261.5" y="244" text-anchor="middle">참 양성</text><rect class="node" x="353" y="194" width="183" height="64" rx="0"/><text class="name" x="444.5" y="224" text-anchor="middle">FN 10</text><text class="tiny" x="444.5" y="244" text-anchor="middle">거짓 음성</text><rect class="deep" x="24" y="258" width="146" height="64" rx="0"/><text class="lab" x="97" y="288" text-anchor="middle">실제 Negative</text><text class="tiny" x="97" y="308" text-anchor="middle">150명</text><rect class="node" x="170" y="258" width="183" height="64" rx="0"/><text class="name" x="261.5" y="288" text-anchor="middle">FP 20</text><text class="tiny" x="261.5" y="308" text-anchor="middle">거짓 양성</text><rect class="focal" x="353" y="258" width="183" height="64" rx="0"/><text class="name inv" x="444.5" y="288" text-anchor="middle">TN 130</text><text class="tiny inv" x="444.5" y="308" text-anchor="middle">참 음성</text><text class="tiny" x="261.5" y="342" text-anchor="middle">60명</text><text class="tiny" x="444.5" y="342" text-anchor="middle">140명</text><text class="bodym" x="24" y="368">검은 칸 = 맞힌 칸(T). 뒤 글자 P·N은 예측, 앞 글자 T·F는 정답 여부</text><line class="rule" x1="24" y1="394" x2="536" y2="394"/><text class="small" x="24" y="416">작은 표도 같은 배치: 위 행 = 실제 P, 왼쪽 열 = 예측 P</text><rect class="zone" x="24" y="432" width="250" height="108" rx="6"/><rect class="focal" x="36" y="452" width="46" height="32" rx="0"/><text class="tiny inv" x="59" y="473" text-anchor="middle">TP</text><rect class="deep" x="82" y="452" width="46" height="32" rx="0"/><text class="tiny" x="105" y="473" text-anchor="middle">FN</text><rect class="deep" x="36" y="484" width="46" height="32" rx="0"/><text class="tiny" x="59" y="505" text-anchor="middle">FP</text><rect class="focal" x="82" y="484" width="46" height="32" rx="0"/><text class="tiny inv" x="105" y="505" text-anchor="middle">TN</text><text class="lab" x="136" y="464">정확도</text><text class="small" x="136" y="490">(TP + TN) ÷ 전체</text><text class="lab" x="136" y="516">170 ÷ 200 = 0.85</text><rect class="zone" x="286" y="432" width="250" height="108" rx="6"/><rect class="focal" x="298" y="452" width="46" height="32" rx="0"/><text class="tiny inv" x="321" y="473" text-anchor="middle">TP</text><rect class="node" x="344" y="452" width="46" height="32" rx="0"/><text class="tiny" x="367" y="473" text-anchor="middle">FN</text><rect class="deep" x="298" y="484" width="46" height="32" rx="0"/><text class="tiny" x="321" y="505" text-anchor="middle">FP</text><rect class="node" x="344" y="484" width="46" height="32" rx="0"/><text class="tiny" x="367" y="505" text-anchor="middle">TN</text><text class="lab" x="398" y="464">정밀도</text><text class="small" x="398" y="490">TP ÷ (TP + FP)</text><text class="lab" x="398" y="516">40 ÷ 60 ≈ 0.667</text><rect class="zone" x="24" y="554" width="250" height="108" rx="6"/><rect class="focal" x="36" y="574" width="46" height="32" rx="0"/><text class="tiny inv" x="59" y="595" text-anchor="middle">TP</text><rect class="deep" x="82" y="574" width="46" height="32" rx="0"/><text class="tiny" x="105" y="595" text-anchor="middle">FN</text><rect class="node" x="36" y="606" width="46" height="32" rx="0"/><text class="tiny" x="59" y="627" text-anchor="middle">FP</text><rect class="node" x="82" y="606" width="46" height="32" rx="0"/><text class="tiny" x="105" y="627" text-anchor="middle">TN</text><text class="lab" x="136" y="586">재현율 (민감도)</text><text class="small" x="136" y="612">TP ÷ (TP + FN)</text><text class="lab" x="136" y="638">40 ÷ 50 = 0.8</text><rect class="zone" x="286" y="554" width="250" height="108" rx="6"/><rect class="node" x="298" y="574" width="46" height="32" rx="0"/><text class="tiny" x="321" y="595" text-anchor="middle">TP</text><rect class="node" x="344" y="574" width="46" height="32" rx="0"/><text class="tiny" x="367" y="595" text-anchor="middle">FN</text><rect class="deep" x="298" y="606" width="46" height="32" rx="0"/><text class="tiny" x="321" y="627" text-anchor="middle">FP</text><rect class="focal" x="344" y="606" width="46" height="32" rx="0"/><text class="tiny inv" x="367" y="627" text-anchor="middle">TN</text><text class="lab" x="398" y="586">특이도</text><text class="small" x="398" y="612">TN ÷ (TN + FP)</text><text class="lab" x="398" y="638">130 ÷ 150 ≈ 0.867</text><rect class="focal" x="24" y="680" width="22" height="16" rx="3"/><text class="small" x="54" y="693">분자</text><rect class="deep" x="110" y="680" width="22" height="16" rx="3"/><text class="small" x="140" y="693">분모에만 포함 (분모 = 검은 칸 + 회색 칸)</text><text class="lab" x="24" y="726">F1 = 2 × 0.667 × 0.8 ÷ (0.667 + 0.8) ≈ 0.727</text><text class="small" x="24" y="748">정밀도·재현율의 조화평균 — 둘 중 작은 쪽에 끌려간다</text>
</svg>
