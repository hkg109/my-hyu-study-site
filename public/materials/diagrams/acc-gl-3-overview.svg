<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 591" role="img" aria-labelledby="acc-gl-3-overview-title acc-gl-3-overview-desc">
  <title id="acc-gl-3-overview-title">거래가 장부에 들어가는 길</title>
  <desc id="acc-gl-3-overview-desc">3장의 네 개념 묶음을 거래의 의의, 거래요소의 결합관계와 계정, 분개와 전기, 수정전 시산표와 오류 순서로 지그재그로 잇고 분해·기록 규칙·검증이라는 이름표를 단 개요도</desc>
  <defs><marker id="acc-gl-3-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-3-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-3-overview-a)}.flow.both{marker-start:url(#acc-gl-3-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-3-overview-m)}.dash.both{marker-start:url(#acc-gl-3-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="591"/>
  <text class="tag" x="24" y="40">3장 개요 · 개념 묶음 4개</text><text class="title" x="24" y="74">거래가 장부에 들어가는 길</text><text class="subtitle" x="24" y="104">핵심 질문: 어떤 사건이 회계상 거래이고, 그것을 어떤 규칙으로</text><text class="subtitle" x="24" y="124">분개·전기하며, 기록이 맞는지 어떻게 확인하는가?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="224" height="130.5" rx="6"/><text class="small" x="136" y="208.25" text-anchor="middle">3-1</text><text class="name" x="136" y="229.25" text-anchor="middle">거래의 의의</text><text class="body" x="136" y="256.25" text-anchor="middle">회계상 거래 · 거래의 이중성</text><text class="body" x="136" y="276.75" text-anchor="middle">복식부기</text><rect class="node" x="312" y="172" width="224" height="130.5" rx="6"/><text class="small" x="424" y="198" text-anchor="middle">3-2</text><text class="name" x="424" y="219" text-anchor="middle">결합관계와 계정</text><text class="body" x="424" y="246" text-anchor="middle">시산표식</text><text class="body" x="424" y="266.5" text-anchor="middle">차변 4요소 · 대변 4요소</text><text class="body" x="424" y="287" text-anchor="middle">계정 · T계정</text><rect class="focal" x="312" y="360.5" width="224" height="130.5" rx="6"/><text class="small inv" x="424" y="386.5" text-anchor="middle">3-3</text><text class="name inv" x="424" y="407.5" text-anchor="middle">분개와 전기</text><text class="body inv" x="424" y="434.5" text-anchor="middle">분개장(일자순)</text><text class="body inv" x="424" y="455" text-anchor="middle">→ 원장(계정별)</text><text class="body inv" x="424" y="475.5" text-anchor="middle">대차평균의 원리</text><rect class="node" x="24" y="360.5" width="224" height="130.5" rx="6"/><text class="small" x="136" y="386.5" text-anchor="middle">3-4</text><text class="name" x="136" y="407.5" text-anchor="middle">수정전 시산표와 오류</text><text class="body" x="136" y="434.5" text-anchor="middle">합계·잔액 시산표</text><text class="body" x="136" y="455" text-anchor="middle">못 찾는 오류 4가지</text><text class="body" x="136" y="475.5" text-anchor="middle">정정 분개</text><path class="flow" d="M248 237.25 L312 237.25"/><rect class="mask" x="258.6" y="226.25" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="242.25" text-anchor="middle">분해</text><path class="flow" d="M424 302.5 L424 360.5"/><rect class="mask" x="385.9" y="320.5" width="76.1" height="22" rx="4"/><text class="lab" x="424" y="336.5" text-anchor="middle">기록 규칙</text><path class="flow" d="M312 425.75 L248 425.75"/><rect class="mask" x="258.6" y="414.75" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="430.75" text-anchor="middle">검증</text><path class="flow" d="M24 521 H54"/><text class="small" x="62" y="526">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="513" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="526">중심 개념</text><text class="small" x="24" y="553">부록 전표(입금·출금·대체)는 3-3 분개장의 기능을 거래 한 건씩 수행한다.</text>
</svg>
