<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" role="img" aria-labelledby="cpp-09-template-instantiation-title cpp-09-template-instantiation-desc">
  <title id="cpp-09-template-instantiation-title">템플릿은 틀 — 컴파일러가 자료형마다 함수를 찍어 낸다</title>
  <desc id="cpp-09-template-instantiation-desc">template &lt;typename T&gt; void change(T&amp; a, T&amp; b) 하나에서 int, double, string으로 호출하면 컴파일러가 change&lt;int&gt;, change&lt;double&gt;, change&lt;string&gt; 세 함수를 따로 만들고, 서로 다른 자료형을 섞으면 T를 정할 수 없어 컴파일 오류가 난다는 그림</desc>
  <defs>
    <marker id="cpp-09-template-instantiation-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-09-template-instantiation-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-09-template-instantiation-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="452" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">09 · 템플릿</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">템플릿은 틀 — 컴파일러가 자료형마다 함수를 찍어 낸다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <path d="M328 200 L328 220 Q328 228 320 228 L128 228 Q120 228 120 236 L120 268" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-09-template-instantiation-m)"/><path d="M360 200 L360 220 Q360 228 360 228 L360 228 Q360 228 360 236 L360 268" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-09-template-instantiation-m)"/><path d="M392 200 L392 220 Q392 228 400 228 L592 228 Q600 228 600 236 L600 268" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-09-template-instantiation-m)"/><rect x="200" y="120" width="320" height="80" rx="6" fill="#f7f6f2"/><rect x="200" y="120" width="320" height="80" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><rect x="208" y="126" width="148" height="16" rx="2" fill="#3a3a36" stroke="#55554f"/><text x="282" y="138" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#d9d6cc" text-anchor="middle">template &lt;typename T&gt;</text><text x="360" y="177" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#f7f6f2" text-anchor="middle">void change(T&amp; a, T&amp; b)</text><rect x="32" y="268" width="176" height="64" rx="6" fill="#f7f6f2"/><rect x="32" y="268" width="176" height="64" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="120" y="295.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">change&lt;int&gt;</text><text x="120" y="315.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">change(i1, i2)</text><rect x="272" y="268" width="176" height="64" rx="6" fill="#f7f6f2"/><rect x="272" y="268" width="176" height="64" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="360" y="295.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">change&lt;double&gt;</text><text x="360" y="315.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">change(x, y)</text><rect x="512" y="268" width="176" height="64" rx="6" fill="#f7f6f2"/><rect x="512" y="268" width="176" height="64" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="600" y="295.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">change&lt;string&gt;</text><text x="600" y="315.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">change(s, t)</text><rect x="32" y="352" width="656" height="36" rx="6" fill="#f7f6f2"/><rect x="32" y="352" width="656" height="36" rx="6" fill="#f3e3dc" stroke="#a8431f" stroke-width="1.5"/><text x="360" y="374" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">change(i, d)   // int와 double을 섞음 → T를 정할 수 없어 컴파일 오류</text>
  <line x1="32" y1="404" x2="688" y2="404" stroke="#b9b6ac"/><path d="M32 426 H60" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-09-template-instantiation-m)"/><text x="68" y="431" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">인스턴스화</text><rect x="160" y="418" width="20" height="16" rx="3" fill="#1d1d1a"/><text x="192" y="431" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">템플릿 (설계도)</text><rect x="314.24" y="418" width="20" height="16" rx="3" fill="#f3e3dc" stroke="#a8431f"/><text x="346.24" y="431" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">T를 정할 수 없음</text>
</svg>
