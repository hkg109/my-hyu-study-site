<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 747" role="img" aria-labelledby="mis-gl-4g-intellectual-property-title mis-gl-4g-intellectual-property-desc">
  <title id="mis-gl-4g-intellectual-property-title">지식재산의 네 가지 보호</title>
  <desc id="mis-gl-4g-intellectual-property-desc">지식재산이 저작권, 특허, 상표, 영업비밀의 네 보호 방식을 포함하고 각각 표현(저자 생존 기간+70년, 기업 저작물 95년), 발명 아이디어(20년), 브랜드 표지(소비자 혼동 방지), 공개되지 않은 영업 정보(공개되면 보호 상실)를 보호하며, 디지털 매체에서는 복제·전송·변경이 쉬워 DMCA가 보호 기술 우회를 금지한다는 계층 그림</desc>
  <defs><marker id="mis-gl-4g-intellectual-property-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4g-intellectual-property-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4g-intellectual-property-a)}.flow.both{marker-start:url(#mis-gl-4g-intellectual-property-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4g-intellectual-property-m)}.dash.both{marker-start:url(#mis-gl-4g-intellectual-property-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="747"/>
  <text class="tag" x="24" y="40">4장 · 4-5 지식재산</text><text class="title" x="24" y="74">지식재산의 네 가지 보호</text><text class="subtitle" x="24" y="104">강도가 다른 단계가 아니라 보호 대상이 다른 병렬 분류다. 무엇을</text><text class="subtitle" x="24" y="124">지키려는지부터 확인한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="198" text-anchor="middle">Intellectual property</text><text class="name inv" x="280" y="219" text-anchor="middle">지식재산</text><text class="body inv" x="280" y="246" text-anchor="middle">개인·기업이 만든 유형·무형의 지적 창작물</text><rect class="node" x="24" y="319.5" width="249" height="110" rx="6"/><text class="small" x="148.5" y="345.5" text-anchor="middle">Copyright</text><text class="name" x="148.5" y="366.5" text-anchor="middle">저작권</text><text class="body" x="148.5" y="393.5" text-anchor="middle">표현을 보호</text><text class="body" x="148.5" y="414" text-anchor="middle">생존 + 70년 (기업 95년)</text><rect class="node" x="287" y="319.5" width="249" height="110" rx="6"/><text class="small" x="411.5" y="345.5" text-anchor="middle">Patent</text><text class="name" x="411.5" y="366.5" text-anchor="middle">특허</text><text class="body" x="411.5" y="393.5" text-anchor="middle">발명 아이디어 독점</text><text class="body" x="411.5" y="414" text-anchor="middle">20년 · 심사</text><rect class="node" x="24" y="439.5" width="249" height="110" rx="6"/><text class="small" x="148.5" y="465.5" text-anchor="middle">Trademark</text><text class="name" x="148.5" y="486.5" text-anchor="middle">상표</text><text class="body" x="148.5" y="513.5" text-anchor="middle">브랜드 표지</text><text class="body" x="148.5" y="534" text-anchor="middle">소비자 혼동 방지</text><rect class="node" x="287" y="439.5" width="249" height="110" rx="6"/><text class="small" x="411.5" y="465.5" text-anchor="middle">Trade secret</text><text class="name" x="411.5" y="486.5" text-anchor="middle">영업비밀</text><text class="body" x="411.5" y="513.5" text-anchor="middle">비공개 영업 정보</text><text class="body" x="411.5" y="534" text-anchor="middle">공개되면 보호 상실</text><rect class="node" x="24" y="607.5" width="512" height="71.5" rx="6"/><text class="name" x="280" y="635.5" text-anchor="middle">복제·전송·변경이 쉬움</text><text class="body" x="280" y="662.5" text-anchor="middle">DMCA(1998): 보호 기술 우회 자체를 불법화</text><path class="line" d="M280 261.5 V293.4"/><path class="line" d="M148.5 293.4 H411.5"/><path class="flow" d="M148.5 293.4 L148.5 319.5"/><path class="flow" d="M411.5 293.4 L411.5 319.5"/><rect class="mask" x="258.6" y="266.45" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="282.45" text-anchor="middle">포함</text><path class="flow" d="M280 549.5 L280 607.5"/><rect class="mask" x="210.9" y="567.5" width="138.2" height="22" rx="4"/><text class="lab" x="280" y="583.5" text-anchor="middle">디지털 매체의 도전</text><path class="flow" d="M24 703 H54"/><text class="small" x="62" y="708">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="695" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="708">중심 개념</text>
</svg>
