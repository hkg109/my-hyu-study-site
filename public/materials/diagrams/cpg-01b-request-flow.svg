<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 820" role="img" aria-labelledby="cpg-01b-request-flow-title cpg-01b-request-flow-desc">
  <title id="cpg-01b-request-flow-title">업무 하나가 저장되는 길</title>
  <desc id="cpg-01b-request-flow-desc">국장이 업무를 입력하면 브라우저가 형식을 확인하고, 서버와 DB가 로그인·Term·권한을 확인한 뒤 tasks 테이블에 저장하고, 화면이 결과를 다시 읽어 보여 주며, 형식 오류와 권한 거부는 각각 다른 안내로 끝나는 흐름.</desc>
  <defs><marker id="cpg-01b-request-flow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-01b-request-flow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-01b-request-flow-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-01b-request-flow-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="820"/>
  <text class="tag" x="24" y="40">1편 · 웹 서비스의 세 부분</text><text class="title" x="24" y="74">업무 하나가 저장되는 길</text><text class="subtitle" x="24" y="104">실패는 어디서 막혔는지에 따라 안내가 달라진다.</text><text class="subtitle" x="24" y="124">문제를 찾을 때도 이 순서대로 확인한다.</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
  <path class="flow" d="M172 232 V288"/><rect class="mask" x="180.0" y="250" width="69.0" height="21" rx="4"/><text class="lab" x="186" y="265">저장 요청</text>
  <path class="flow" d="M172 352 V400"/><rect class="mask" x="180.0" y="366" width="38.5" height="21" rx="4"/><text class="lab" x="186" y="381">검사</text>
  <path class="flow" d="M172 488 V536"/><rect class="mask" x="180.0" y="502" width="38.5" height="21" rx="4"/><text class="lab" x="186" y="517">통과</text>
  <path class="flow" d="M172 600 V648"/><rect class="mask" x="180.0" y="614" width="69.0" height="21" rx="4"/><text class="lab" x="186" y="629">다시 읽기</text>
  <path class="flow" d="M320 320 H380"/><rect class="mask" x="330.8" y="296" width="38.5" height="21" rx="4"/><text class="lab" x="350" y="311" text-anchor="middle">실패</text>
  <path class="flow" d="M320 444 H380"/><rect class="mask" x="330.8" y="420" width="38.5" height="21" rx="4"/><text class="lab" x="350" y="435" text-anchor="middle">거부</text>
  <rect class="outside" x="24" y="168" width="296" height="64" rx="6"/><text class="name" x="172" y="195.0" text-anchor="middle">국장 · 업무 등록 화면</text><text class="body" x="172" y="216.5" text-anchor="middle">제목·담당자·마감일 입력</text>
  <rect class="node" x="24" y="288" width="296" height="64" rx="6"/><text class="name" x="172" y="315.0" text-anchor="middle">브라우저 (프론트엔드)</text><text class="body" x="172" y="336.5" text-anchor="middle">형식 확인 · 저장 중 표시</text>
  <rect class="focal" x="24" y="400" width="296" height="88" rx="6"/><text class="name inv" x="172" y="428.5" text-anchor="middle">서버 · DB 확인</text><text class="body inv" x="172" y="450.0" text-anchor="middle">로그인 · 현재 Term · 생성 권한</text><text class="body inv" x="172" y="471.0" text-anchor="middle">담당자를 지정할 수 있나?</text>
  <rect class="deep" x="24" y="536" width="296" height="64" rx="6"/><text class="name" x="172" y="563.0" text-anchor="middle">tasks 테이블에 새 행</text><text class="body" x="172" y="584.5" text-anchor="middle">DB 저장 성공</text>
  <rect class="node" x="24" y="648" width="296" height="64" rx="6"/><text class="name" x="172" y="675.0" text-anchor="middle">화면 결과</text><text class="body" x="172" y="696.5" text-anchor="middle">상세 화면에서 새 기록 확인</text>
  <rect class="outside" x="380" y="288" width="156" height="64" rx="6"/><text class="lab" x="458" y="315.3" text-anchor="middle">입력창 아래 안내</text><text class="small" x="458" y="334.6" text-anchor="middle">제목 누락·날짜 오류</text>
  <rect class="outside" x="380" y="412" width="156" height="64" rx="6"/><text class="lab" x="458" y="439.3" text-anchor="middle">거부 이유 안내</text><text class="small" x="458" y="458.6" text-anchor="middle">권한 없음·다른 Term</text>
  <text class="name" x="280" y="750" text-anchor="middle">화면에 보임 ≠ DB에 저장됨</text>
  <rect class="focal" x="24" y="776" width="22" height="16" rx="3"/><text class="small" x="54" y="789">실제 보안 검사</text><rect class="deep" x="163.48000000000002" y="776" width="22" height="16" rx="3"/><text class="small" x="193.48000000000002" y="789">저장소</text><rect class="outside" x="255.17000000000002" y="776" width="22" height="16" rx="3"/><text class="small" x="285.17" y="789">사용자·실패 안내</text>
</svg>
