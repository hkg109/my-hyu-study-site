<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1051" role="img" aria-labelledby="acc-gl-1c-users-fin-vs-mgmt-title acc-gl-1c-users-fin-vs-mgmt-desc">
  <title id="acc-gl-1c-users-fin-vs-mgmt-title">정보이용자와 재무회계 · 관리회계</title>
  <desc id="acc-gl-1c-users-fin-vs-mgmt-desc">기업이 생산한 회계정보는 내부이해관계자와 외부이해관계자에게 간다. 내부이해관계자에게는 관리회계가, 외부이해관계자에게는 재무회계가 정보를 제공하며, 두 회계의 정보생산 기준, 주요 정보, 제공 시기, 외부감사, 정보 특성이 다르다.</desc>
  <defs><marker id="acc-gl-1c-users-fin-vs-mgmt-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-1c-users-fin-vs-mgmt-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-1c-users-fin-vs-mgmt-a)}.flow.both{marker-start:url(#acc-gl-1c-users-fin-vs-mgmt-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-1c-users-fin-vs-mgmt-m)}.dash.both{marker-start:url(#acc-gl-1c-users-fin-vs-mgmt-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1051"/>
  <text class="tag" x="24" y="40">1장 · 1-3 정보이용자와 회계의 두 갈래</text><text class="title" x="24" y="74">정보이용자와 재무회계 · 관리회계</text><text class="subtitle" x="24" y="104">자료 1-3 · 1-4 · 누구에게 주는 정보인가에 따라</text><text class="subtitle" x="24" y="124">관리회계와 재무회계로 나뉜다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="140" y="174" width="280" height="70" rx="6"/><text class="name inv" x="280.0" y="202.0" text-anchor="middle">경제실체 (기업)</text><text class="body inv" x="280.0" y="225.0" text-anchor="middle">회계정보를 생산</text><rect class="node" x="24" y="300" width="248" height="150" rx="6"/><text class="small" x="148.0" y="337.5" text-anchor="middle">Internal users</text><text class="name" x="148.0" y="356.5" text-anchor="middle">내부이해관계자</text><text class="body" x="148.0" y="379.5" text-anchor="middle">경영자 · 관리자</text><text class="body" x="148.0" y="400.5" text-anchor="middle">계획·조직·통제,</text><text class="body" x="148.0" y="421.5" text-anchor="middle">투자·자본조달 결정</text><rect class="outside" x="288" y="300" width="248" height="150" rx="6"/><text class="small" x="412.0" y="337.5" text-anchor="middle">External users</text><text class="name" x="412.0" y="356.5" text-anchor="middle">외부이해관계자</text><text class="body" x="412.0" y="379.5" text-anchor="middle">주주 · 채권자 · 정부 ·</text><text class="body" x="412.0" y="400.5" text-anchor="middle">소비자 · 시민단체 ·</text><text class="body" x="412.0" y="421.5" text-anchor="middle">거래처 · 종업원 등</text><path class="flow" d="M210 244 L148 300"/><rect class="mask" x="134.0" y="259" width="72.0" height="22" rx="4"/><text class="lab" x="170" y="275" text-anchor="middle">내부 보고</text><path class="flow" d="M350 244 L412 300"/><rect class="mask" x="371.5" y="259" width="41.0" height="22" rx="4"/><text class="lab" x="392" y="275" text-anchor="middle">공시</text><rect class="deep" x="24" y="506" width="248" height="70" rx="6"/><text class="small" x="148.0" y="535.0" text-anchor="middle">Managerial accounting</text><text class="name" x="148.0" y="554.0" text-anchor="middle">관리회계</text><rect class="deep" x="288" y="506" width="248" height="70" rx="6"/><text class="small" x="412.0" y="535.0" text-anchor="middle">Financial accounting</text><text class="name" x="412.0" y="554.0" text-anchor="middle">재무회계</text><path class="flow" d="M148 450 L148 506"/><rect class="mask" x="127.5" y="467" width="41.0" height="22" rx="4"/><text class="lab" x="148" y="483" text-anchor="middle">지원</text><path class="flow" d="M412 450 L412 506"/><rect class="mask" x="391.5" y="467" width="41.0" height="22" rx="4"/><text class="lab" x="412" y="483" text-anchor="middle">지원</text><text class="small" x="280" y="612" text-anchor="middle">정보생산 기준</text><rect class="node" x="24" y="620" width="248" height="40" rx="6"/><text class="body" x="148.0" y="644.5" text-anchor="middle">기업 내부 규정</text><rect class="node" x="288" y="620" width="248" height="40" rx="6"/><text class="body" x="412.0" y="644.5" text-anchor="middle">회계기준</text><text class="small" x="280" y="688" text-anchor="middle">주요 정보</text><rect class="node" x="24" y="696" width="248" height="40" rx="6"/><text class="body" x="148.0" y="720.5" text-anchor="middle">내부 보고서</text><rect class="node" x="288" y="696" width="248" height="40" rx="6"/><text class="body" x="412.0" y="720.5" text-anchor="middle">재무제표</text><text class="small" x="280" y="764" text-anchor="middle">제공 시기</text><rect class="node" x="24" y="772" width="248" height="40" rx="6"/><text class="body" x="148.0" y="796.5" text-anchor="middle">필요에 따라 수시</text><rect class="node" x="288" y="772" width="248" height="40" rx="6"/><text class="body" x="412.0" y="796.5" text-anchor="middle">연차 · 반기 · 분기</text><text class="small" x="280" y="840" text-anchor="middle">외부감사</text><rect class="node" x="24" y="848" width="248" height="40" rx="6"/><text class="body" x="148.0" y="872.5" text-anchor="middle">해당 없음</text><rect class="node" x="288" y="848" width="248" height="40" rx="6"/><text class="body" x="412.0" y="872.5" text-anchor="middle">일정 기준 충족 회사</text><text class="small" x="280" y="916" text-anchor="middle">정보 특성</text><rect class="node" x="24" y="924" width="248" height="40" rx="6"/><text class="body" x="148.0" y="948.5" text-anchor="middle">미래·예측·비재무 포함</text><rect class="node" x="288" y="924" width="248" height="40" rx="6"/><text class="body" x="412.0" y="948.5" text-anchor="middle">과거·객관적·재무 중심</text><text class="small" x="280" y="990" text-anchor="middle">재무회계: 불특정 다수의 공통 정보욕구 → 강화된 규제</text><path class="flow" d="M24 1026 H54"/><text class="small" x="62" y="1031">정보 제공</text><rect class="focal" x="142.05" y="1018" width="22" height="16" rx="3"/><text class="small" x="172.05" y="1031">정보 생산 주체</text><rect class="outside" x="283.15" y="1018" width="22" height="16" rx="3"/><text class="small" x="313.15" y="1031">기업 밖 이용자</text><rect class="deep" x="424.25" y="1018" width="22" height="16" rx="3"/><text class="small" x="454.25" y="1031">회계 분야</text>
