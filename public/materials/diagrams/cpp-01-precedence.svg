<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 648" width="720" height="648" role="img" aria-labelledby="cpp-01-precedence-title cpp-01-precedence-desc">
  <title id="cpp-01-precedence-title">우선순위 사다리 — 위가 먼저 계산된다</title>
  <desc id="cpp-01-precedence-desc">괄호, 증감, 곱셈·나눗셈·나머지, 덧셈·뺄셈, 크기 비교, 같음 비교, 논리곱, 논리합, 대입 순으로 우선순위가 낮아지며, 대입만 오른쪽에서 왼쪽으로 결합한다는 사다리 그림</desc>
  <defs>
    <marker id="cpp-01-precedence-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-01-precedence-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-01-precedence-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="648" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">01·02 · 연산자</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">우선순위 사다리 — 위가 먼저 계산된다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <rect x="80" y="112" width="560" height="40" rx="6" fill="#f7f6f2"/><rect x="80" y="112" width="560" height="40" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="360" y="137" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">( )   괄호 — 가장 먼저</text><rect x="92" y="160" width="536" height="40" rx="6" fill="#f7f6f2"/><rect x="92" y="160" width="536" height="40" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="360" y="185" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">++  --   증감</text><rect x="104" y="208" width="512" height="40" rx="6" fill="#f7f6f2"/><rect x="104" y="208" width="512" height="40" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="360" y="233" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">*  /  %   곱셈·나눗셈·나머지</text><rect x="116" y="256" width="488" height="40" rx="6" fill="#f7f6f2"/><rect x="116" y="256" width="488" height="40" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="360" y="281" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">+  -   덧셈·뺄셈</text><rect x="128" y="304" width="464" height="40" rx="6" fill="#f7f6f2"/><rect x="128" y="304" width="464" height="40" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="360" y="329" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">&lt;  &lt;=  &gt;  &gt;=   크기 비교</text><rect x="140" y="352" width="440" height="40" rx="6" fill="#f7f6f2"/><rect x="140" y="352" width="440" height="40" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="360" y="377" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">==  !=   같음 비교</text><rect x="152" y="400" width="416" height="40" rx="6" fill="#f7f6f2"/><rect x="152" y="400" width="416" height="40" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="360" y="425" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">&amp;&amp;   논리곱 AND</text><rect x="164" y="448" width="392" height="40" rx="6" fill="#f7f6f2"/><rect x="164" y="448" width="392" height="40" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="360" y="473" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">||   논리합 OR</text><rect x="176" y="496" width="368" height="40" rx="6" fill="#f7f6f2"/><rect x="176" y="496" width="368" height="40" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><text x="360" y="521" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#f7f6f2" text-anchor="middle">=  +=  -=   대입 — 가장 나중</text><text x="32" y="576" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">같은 단계끼리는 왼쪽부터(3 / 4 / 5). 대입만 오른쪽부터: x = y = z + 15</text>
  <line x1="32" y1="600" x2="688" y2="600" stroke="#b9b6ac"/><rect x="36" y="614" width="20" height="16" rx="3" fill="#1d1d1a"/><text x="68" y="627" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">결합 방향이 다른 연산자</text>
</svg>
