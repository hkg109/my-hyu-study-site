<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 777" role="img" aria-labelledby="mis-gl-9b-operational-analytical-crm-title mis-gl-9b-operational-analytical-crm-desc">
  <title id="mis-gl-9b-operational-analytical-crm-title">운영적 CRM이 재료를, 분석적 CRM이 결론을</title>
  <desc id="mis-gl-9b-operational-analytical-crm-desc">고객 접점(콜센터·웹·매장·영업·소셜 미디어)에서 영업 자동화·고객 서비스·마케팅 자동화로 이루어진 운영적 CRM이 고객 데이터를 만들고, 그 데이터가 고객 데이터 웨어하우스로 모여 OLAP과 데이터 마이닝을 쓰는 분석적 CRM이 수익성 높은 고객·시장 세분화, 고객 생애 가치, 이탈률을 산출하며, 그 결과가 다시 고가치 고객 우대와 타깃 마케팅으로 접점에 돌아가는 흐름 그림</desc>
  <defs><marker id="mis-gl-9b-operational-analytical-crm-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-9b-operational-analytical-crm-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-9b-operational-analytical-crm-a)}.flow.both{marker-start:url(#mis-gl-9b-operational-analytical-crm-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-9b-operational-analytical-crm-m)}.dash.both{marker-start:url(#mis-gl-9b-operational-analytical-crm-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="777"/>
  <text class="tag" x="24" y="40">9장 · 9-3 CRM</text><text class="title" x="24" y="74">운영적 CRM이 재료를, 분석적 CRM이 결론을</text><text class="subtitle" x="24" y="104">고객을 직접 상대하며 쌓인 데이터가 웨어하우스로 모이고, 분석 결과가 다시</text><text class="subtitle" x="24" y="124">접점의 행동을 바꾼다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="outside" x="24" y="172" width="512" height="71.5" rx="6"/><text class="name" x="280" y="200" text-anchor="middle">고객 접점 (touch points)</text><text class="body" x="280" y="227" text-anchor="middle">콜센터·웹·매장·영업·소셜 미디어</text><rect class="node" x="24" y="301.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="327.5" text-anchor="middle">Operational CRM</text><text class="name" x="280" y="348.5" text-anchor="middle">운영적 CRM</text><text class="body" x="280" y="375.5" text-anchor="middle">SFA · 고객 서비스 · 마케팅 자동화</text><rect class="focal" x="24" y="449" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="475" text-anchor="middle">Analytical CRM</text><text class="name inv" x="280" y="496" text-anchor="middle">분석적 CRM</text><text class="body inv" x="280" y="523" text-anchor="middle">고객 데이터 웨어하우스 + OLAP·데이터 마이닝</text><rect class="node" x="24" y="596.5" width="161" height="112.5" rx="6"/><text class="small" x="104.5" y="622.5" text-anchor="middle">Segments</text><text class="name" x="104.5" y="643.5" text-anchor="middle">수익성</text><text class="name" x="104.5" y="666.5" text-anchor="middle">고객·세분화</text><text class="body" x="104.5" y="693.5" text-anchor="middle">고객 프로필</text><rect class="node" x="199" y="596.5" width="161" height="112.5" rx="6"/><text class="small" x="279.5" y="634" text-anchor="middle">CLTV</text><text class="name" x="279.5" y="655" text-anchor="middle">고객 생애 가치</text><text class="body" x="279.5" y="682" text-anchor="middle">수익·비용·기간</text><rect class="node" x="374" y="596.5" width="161" height="112.5" rx="6"/><text class="small" x="454.5" y="634" text-anchor="middle">Churn rate</text><text class="name" x="454.5" y="655" text-anchor="middle">이탈률</text><text class="body" x="454.5" y="682" text-anchor="middle">떠난 고객 수</text><path class="flow" d="M280 243.5 L280 301.5"/><rect class="mask" x="218.1" y="261.5" width="123.8" height="22" rx="4"/><text class="lab" x="280" y="277.5" text-anchor="middle">고객을 직접 상대</text><path class="flow" d="M280 391 L280 449"/><rect class="mask" x="234.7" y="409" width="90.6" height="22" rx="4"/><text class="lab" x="280" y="425" text-anchor="middle">데이터 제공</text><path class="line" d="M280 538.5 V570.4"/><path class="line" d="M104.5 570.4 H454.5"/><path class="flow" d="M104.5 570.4 L104.5 596.5"/><path class="flow" d="M279.5 570.4 L279.5 596.5"/><path class="flow" d="M454.5 570.4 L454.5 596.5"/><rect class="mask" x="258.6" y="543.45" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="559.45" text-anchor="middle">산출</text><path class="dash" d="M535 652.75 L540 652.75 L540 207.75 L536 207.75"/><path class="flow" d="M24 733 H54"/><text class="small" x="62" y="738">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 733 H221.94875000000002"/><text class="small" x="229.94875000000002" y="738">영향·제약</text><rect class="focal" x="312.22900000000004" y="725" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="738">중심 개념</text><rect class="outside" x="422.34250000000003" y="725" width="22" height="16" rx="3"/><text class="small" x="452.34250000000003" y="738">조직 밖 주체</text>
</svg>
