<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 729" role="img" aria-labelledby="mis-gl-4h-liability-quality-title mis-gl-4h-liability-quality-desc">
  <title id="mis-gl-4h-liability-quality-title">누가 책임지고, 어디까지 품질을 요구할까</title>
  <desc id="mis-gl-4h-liability-quality-desc">위에서 소프트웨어 오류의 책임이 기계의 일부로 보면 제조사·운영자 책임, 책으로 보면 저자 책임을 묻기 어려움, 서비스로 보면 전달 내용 책임이 제한되는 세 관점으로 나뉘고, 아래에서 시스템 성능 저하의 세 원인인 소프트웨어 버그, 하드웨어·시설 고장, 낮은 입력 데이터 품질 중 입력 데이터가 가장 흔한 원인임을 보여 주는 그림</desc>
  <defs><marker id="mis-gl-4h-liability-quality-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4h-liability-quality-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4h-liability-quality-a)}.flow.both{marker-start:url(#mis-gl-4h-liability-quality-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4h-liability-quality-m)}.dash.both{marker-start:url(#mis-gl-4h-liability-quality-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="729"/>
  <text class="tag" x="24" y="40">4장 · 4-6 책임·시스템 품질</text><text class="title" x="24" y="74">누가 책임지고, 어디까지 품질을 요구할까</text><text class="subtitle" x="24" y="104">소프트웨어를 무엇으로 보느냐에 따라 책임이 달라지고, 실패의 가장 흔한</text><text class="subtitle" x="24" y="124">원인은 입력 데이터다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="512" height="63" rx="6"/><text class="small" x="280" y="198" text-anchor="middle">Computer-related liability</text><text class="name" x="280" y="219" text-anchor="middle">소프트웨어 오류로 피해 — 누구 책임?</text><rect class="node" x="24" y="293" width="161" height="92" rx="6"/><text class="name" x="104.5" y="321" text-anchor="middle">기계의 일부</text><text class="body" x="104.5" y="348" text-anchor="middle">제조사·운영자 책임</text><text class="body" x="104.5" y="368.5" text-anchor="middle">가능</text><rect class="node" x="199" y="293" width="161" height="92" rx="6"/><text class="name" x="279.5" y="321" text-anchor="middle">책과 유사</text><text class="body" x="279.5" y="348" text-anchor="middle">저자 책임 묻기</text><text class="body" x="279.5" y="368.5" text-anchor="middle">어려움</text><rect class="node" x="374" y="293" width="161" height="92" rx="6"/><text class="name" x="454.5" y="331.25" text-anchor="middle">서비스와 유사</text><text class="body" x="454.5" y="358.25" text-anchor="middle">전달 내용 책임 제한</text><rect class="node" x="24" y="419" width="512" height="89.5" rx="6"/><text class="small" x="280" y="445" text-anchor="middle">System quality</text><text class="name" x="280" y="466" text-anchor="middle">경제적으로 가능한 수준의 품질</text><text class="body" x="280" y="493" text-anchor="middle">완벽한 소프트웨어는 비경제적</text><rect class="node" x="24" y="566.5" width="161" height="94.5" rx="6"/><text class="name" x="104.5" y="619.25" text-anchor="middle">버그·오류</text><rect class="node" x="199" y="566.5" width="161" height="94.5" rx="6"/><text class="name" x="279.5" y="607.75" text-anchor="middle">하드웨어·시설</text><text class="name" x="279.5" y="630.75" text-anchor="middle">고장</text><rect class="focal" x="374" y="566.5" width="161" height="94.5" rx="6"/><text class="name inv" x="454.5" y="594.5" text-anchor="middle">낮은 입력</text><text class="name inv" x="454.5" y="617.5" text-anchor="middle">데이터 품질</text><text class="body inv" x="454.5" y="644.5" text-anchor="middle">가장 흔함</text><path class="line" d="M280 235 V266.9"/><path class="line" d="M104.5 266.9 H454.5"/><path class="flow" d="M104.5 266.9 L104.5 293"/><path class="flow" d="M279.5 266.9 L279.5 293"/><path class="flow" d="M454.5 266.9 L454.5 293"/><rect class="mask" x="241.9" y="239.95" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="255.95" text-anchor="middle">보는 관점</text><path class="line" d="M280 508.5 V540.4"/><path class="line" d="M104.5 540.4 H454.5"/><path class="flow" d="M104.5 540.4 L104.5 566.5"/><path class="flow" d="M279.5 540.4 L279.5 566.5"/><path class="flow" d="M454.5 540.4 L454.5 566.5"/><rect class="mask" x="225.3" y="513.45" width="109.3" height="22" rx="4"/><text class="lab" x="280" y="529.45" text-anchor="middle">성능 저하 원인</text><path class="flow" d="M24 685 H54"/><text class="small" x="62" y="690">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="677" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="690">중심 개념</text>
</svg>
