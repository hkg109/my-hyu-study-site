<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 668" width="560" height="668" role="img" aria-labelledby="lm2-l12a-osi-tcpip-title lm2-l12a-osi-tcpip-desc">
  <title id="lm2-l12a-osi-tcpip-title">OSI 7계층과 TCP/IP 4계층</title>
  <desc id="lm2-l12a-osi-tcpip-desc">왼쪽에 OSI 7계층을 위에서부터 응용, 표현, 세션, 전송, 네트워크, 데이터링크, 물리 순으로 놓고 각 계층의 PDU(데이터, 세그먼트, 패킷, 프레임, 비트)를 적었다. 오른쪽 TCP/IP 4계층은 응용이 OSI 5에서 7, 전송이 4, 인터넷이 3, 네트워크 인터페이스가 1과 2에 대응한다. 맨 오른쪽에 계층별 장비로 게이트웨이, L4 스위치, 라우터와 L3 스위치, 브리지와 스위치, 리피터와 허브를 적었다.</desc>
  <defs><marker id="lm2-l12a-osi-tcpip-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l12a-osi-tcpip-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l12a-osi-tcpip-a)}.flow.both{marker-start:url(#lm2-l12a-osi-tcpip-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l12a-osi-tcpip-m)}.dash.both{marker-start:url(#lm2-l12a-osi-tcpip-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="668"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 3과목 2장</text><text class="title" x="24" y="74">OSI 7계층과 TCP/IP 4계층</text><text class="subtitle" x="24" y="104">일곱 칸의 OSI를 TCP/IP는 네 칸으로 묶는다. 계층마다 PDU와</text><text class="subtitle" x="24" y="124">장비가 정해져 있다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><text class="small" x="100" y="184" text-anchor="middle">OSI 7계층</text><text class="small" x="224" y="184" text-anchor="middle">PDU</text><text class="small" x="342" y="184" text-anchor="middle">TCP/IP 4계층</text><text class="small" x="478" y="184" text-anchor="middle">장비</text><rect class="node" x="24" y="199" width="152" height="48" rx="6"/><text class="name" x="38" y="229">7</text><text class="name" x="62" y="221">응용</text><text class="small" x="62" y="239">Application</text><text class="body" x="224" y="229" text-anchor="middle">데이터</text><rect class="node" x="24" y="253" width="152" height="48" rx="6"/><text class="name" x="38" y="283">6</text><text class="name" x="62" y="275">표현</text><text class="small" x="62" y="293">Presentation</text><text class="body" x="224" y="283" text-anchor="middle">데이터</text><rect class="node" x="24" y="307" width="152" height="48" rx="6"/><text class="name" x="38" y="337">5</text><text class="name" x="62" y="329">세션</text><text class="small" x="62" y="347">Session</text><text class="body" x="224" y="337" text-anchor="middle">데이터</text><rect class="node" x="24" y="361" width="152" height="48" rx="6"/><text class="name" x="38" y="391">4</text><text class="name" x="62" y="383">전송</text><text class="small" x="62" y="401">Transport</text><text class="body" x="224" y="391" text-anchor="middle">세그먼트</text><rect class="focal" x="24" y="415" width="152" height="48" rx="6"/><text class="name inv" x="38" y="445">3</text><text class="name inv" x="62" y="437">네트워크</text><text class="small inv" x="62" y="455">Network</text><text class="body" x="224" y="445" text-anchor="middle">패킷</text><rect class="node" x="24" y="469" width="152" height="48" rx="6"/><text class="name" x="38" y="499">2</text><text class="name" x="62" y="491">데이터링크</text><text class="small" x="62" y="509">Data Link</text><text class="body" x="224" y="499" text-anchor="middle">프레임</text><rect class="node" x="24" y="523" width="152" height="48" rx="6"/><text class="name" x="38" y="553">1</text><text class="name" x="62" y="545">물리</text><text class="small" x="62" y="563">Physical</text><text class="body" x="224" y="553" text-anchor="middle">비트</text><rect class="zone" x="272" y="199" width="140" height="156" rx="6"/><text class="name" x="342" y="262.0" text-anchor="middle">응용</text><text class="small" x="342" y="282.0" text-anchor="middle">HTTP · FTP · SMTP</text><text class="small" x="342" y="302.0" text-anchor="middle">DNS · SSH · Telnet</text><rect class="zone" x="272" y="361" width="140" height="48" rx="6"/><text class="name" x="342" y="380.0" text-anchor="middle">전송</text><text class="small" x="342" y="400.0" text-anchor="middle">TCP · UDP</text><rect class="focal" x="272" y="415" width="140" height="48" rx="6"/><text class="name inv" x="342" y="434.0" text-anchor="middle">인터넷</text><text class="small inv" x="342" y="454.0" text-anchor="middle">IP · ICMP · ARP</text><rect class="zone" x="272" y="469" width="140" height="102" rx="6"/><text class="name" x="342" y="495.0" text-anchor="middle">네트워크</text><text class="name" x="342" y="515.0" text-anchor="middle">인터페이스</text><text class="small" x="342" y="535.0" text-anchor="middle">Ethernet · PPP</text><text class="small" x="342" y="555.0" text-anchor="middle">802.11 무선랜</text><rect class="node" x="420" y="199" width="116" height="156" rx="6"/><text class="lab" x="478" y="273.0" text-anchor="middle">게이트웨이</text><text class="small" x="478" y="291.0" text-anchor="middle">(프로토콜 변환)</text><rect class="node" x="420" y="361" width="116" height="48" rx="6"/><text class="lab" x="478" y="390.0" text-anchor="middle">L4 스위치</text><rect class="node" x="420" y="415" width="116" height="48" rx="6"/><text class="lab" x="478" y="435.0" text-anchor="middle">라우터</text><text class="small" x="478" y="453.0" text-anchor="middle">L3 스위치</text><rect class="node" x="420" y="469" width="116" height="48" rx="6"/><text class="lab" x="478" y="489.0" text-anchor="middle">브리지</text><text class="small" x="478" y="507.0" text-anchor="middle">스위치</text><rect class="node" x="420" y="523" width="116" height="48" rx="6"/><text class="lab" x="478" y="543.0" text-anchor="middle">리피터</text><text class="small" x="478" y="561.0" text-anchor="middle">허브</text><text class="small" x="24" y="597">보낼 때 7→1로 내려가며 헤더를 붙이고(캡슐화), 받을 때 1→7로 뗀다</text><rect class="focal" x="24" y="610" width="22" height="16" rx="3"/><text class="small" x="54" y="623">IP 주소·라우팅 자리 (OSI 3 = TCP/IP 인터넷)</text><rect class="zone" x="24" y="634" width="22" height="16" rx="3"/><text class="small" x="54" y="647">TCP/IP 계층이 묶는 OSI 범위</text>
</svg>
