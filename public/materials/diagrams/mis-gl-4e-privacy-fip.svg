<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 898" role="img" aria-labelledby="mis-gl-4e-privacy-fip-title mis-gl-4e-privacy-fip-desc">
  <title id="mis-gl-4e-privacy-fip-title">Privacy → FIP → 다섯 원칙 → 법</title>
  <desc id="mis-gl-4e-privacy-fip-desc">혼자 있을 권리와 자기 정보를 통제할 권리인 프라이버시가 기록 보유자와 개인의 상호 이익에 기반한 공정 정보 관행으로 구체화되고, FIP가 고지·선택·접근·보안·집행의 다섯 원칙을 포함하며 그중 고지와 선택이 핵심이고, 미국의 COPPA·Gramm-Leach-Bliley·HIPAA와 EU의 GDPR로 이어지는 계층 그림</desc>
  <defs><marker id="mis-gl-4e-privacy-fip-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4e-privacy-fip-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4e-privacy-fip-a)}.flow.both{marker-start:url(#mis-gl-4e-privacy-fip-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4e-privacy-fip-m)}.dash.both{marker-start:url(#mis-gl-4e-privacy-fip-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="898"/>
  <text class="tag" x="24" y="40">4장 · 4-4 프라이버시와 정보 권리 ①</text><text class="title" x="24" y="74">Privacy → FIP → 다섯 원칙 → 법</text><text class="subtitle" x="24" y="104">FIP는 프라이버시라는 권리를 실제 데이터 처리 규칙으로 바꾸는 중간 틀이다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="zone" x="16" y="439" width="528" height="215" rx="8"/><text class="small" x="280" y="459" text-anchor="middle">FIP 다섯 원칙</text><rect class="node" x="24" y="152" width="512" height="89.5" rx="6"/><text class="small" x="280" y="178" text-anchor="middle">Privacy</text><text class="name" x="280" y="199" text-anchor="middle">프라이버시</text><text class="body" x="280" y="226" text-anchor="middle">혼자 있을 권리 + 내 정보를 통제할 권리</text><rect class="focal" x="24" y="299.5" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="325.5" text-anchor="middle">Fair Information Practices</text><text class="name inv" x="280" y="346.5" text-anchor="middle">FIP · 공정 정보 관행</text><text class="body inv" x="280" y="373.5" text-anchor="middle">기록 보유자와 개인의 상호 이익</text><rect class="focal" x="24" y="473" width="161" height="89.5" rx="6"/><text class="small inv" x="104.5" y="499" text-anchor="middle">핵심</text><text class="name inv" x="104.5" y="520" text-anchor="middle">고지</text><text class="body inv" x="104.5" y="547" text-anchor="middle">Notice</text><rect class="focal" x="199" y="473" width="161" height="89.5" rx="6"/><text class="small inv" x="279.5" y="499" text-anchor="middle">핵심</text><text class="name inv" x="279.5" y="520" text-anchor="middle">선택</text><text class="body inv" x="279.5" y="547" text-anchor="middle">Choice</text><rect class="node" x="374" y="473" width="161" height="89.5" rx="6"/><text class="name" x="454.5" y="510" text-anchor="middle">접근</text><text class="body" x="454.5" y="537" text-anchor="middle">Access</text><rect class="node" x="24" y="572.5" width="249" height="71.5" rx="6"/><text class="name" x="148.5" y="600.5" text-anchor="middle">보안</text><text class="body" x="148.5" y="627.5" text-anchor="middle">Security</text><rect class="node" x="287" y="572.5" width="249" height="71.5" rx="6"/><text class="name" x="411.5" y="600.5" text-anchor="middle">집행</text><text class="body" x="411.5" y="627.5" text-anchor="middle">Enforcement</text><rect class="node" x="24" y="740" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="779.25" text-anchor="middle">미국 · 영역별 법</text><text class="name" x="148.5" y="800.25" text-anchor="middle">COPPA · GLBA · HIPAA</text><rect class="node" x="287" y="740" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="766" text-anchor="middle">EU · 포괄적 법</text><text class="name" x="411.5" y="787" text-anchor="middle">GDPR</text><text class="body" x="411.5" y="814" text-anchor="middle">명시적 동의·잊힐 권리</text><path class="flow" d="M280 241.5 L280 299.5"/><rect class="mask" x="251.3" y="259.5" width="57.3" height="22" rx="4"/><text class="lab" x="280" y="275.5" text-anchor="middle">구체화</text><path class="flow" d="M280 389 L280 439"/><rect class="mask" x="258.6" y="403" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="419" text-anchor="middle">포함</text><path class="line" d="M280 654 V706 M148.5 706 H411.5"/><path class="flow" d="M148.5 706 L148.5 740"/><path class="flow" d="M411.5 706 L411.5 740"/><rect class="mask" x="241.9" y="667" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="683" text-anchor="middle">법의 기반</text><path class="flow" d="M24 853.5 H54"/><text class="small" x="62" y="858.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="845.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="858.5">중심 개념</text><rect class="zone" x="302.06225" y="845.5" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="858.5">범위·묶음</text>
</svg>
