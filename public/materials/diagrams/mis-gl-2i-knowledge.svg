<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 970" role="img" aria-labelledby="mis-gl-2i-knowledge-title mis-gl-2i-knowledge-desc">
  <title id="mis-gl-2i-knowledge-title">Data → Information → Knowledge → Wisdom</title>
  <desc id="mis-gl-2i-knowledge-desc">데이터에 맥락을 붙이면 정보가 되고, 패턴·규칙·맥락을 발견하면 지식이 되며, 지식은 문서화된 형식지와 경험 속 암묵지로 나뉘고, 언제 어디서 어떻게 적용할지 아는 경험이 지혜가 되는 위계 그림</desc>
  <defs><marker id="mis-gl-2i-knowledge-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2i-knowledge-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2i-knowledge-a)}.flow.both{marker-start:url(#mis-gl-2i-knowledge-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2i-knowledge-m)}.dash.both{marker-start:url(#mis-gl-2i-knowledge-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="970"/>
  <text class="tag" x="24" y="40">2장 · 2-6 지식의 성격</text><text class="title" x="24" y="74">Data → Information → Knowledge →</text><text class="title" x="24" y="104">Wisdom</text><text class="subtitle" x="24" y="134">위 단계는 아래 단계를 없애지 않고 해석과 판단을 더한다. 지식은 문서화</text><text class="subtitle" x="24" y="154">여부로 두 형태로 나뉜다</text><line class="rule" x1="24" y1="180" x2="536" y2="180"/><rect class="node" x="24" y="202" width="512" height="89.5" rx="6"/><text class="small" x="280" y="228" text-anchor="middle">Data</text><text class="name" x="280" y="249" text-anchor="middle">데이터</text><text class="body" x="280" y="276" text-anchor="middle">정리되지 않은 사실</text><rect class="node" x="24" y="349.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="375.5" text-anchor="middle">Information</text><text class="name" x="280" y="396.5" text-anchor="middle">정보</text><text class="body" x="280" y="423.5" text-anchor="middle">이해하고 행동할 수 있게 정리된 데이터</text><rect class="focal" x="24" y="497" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="523" text-anchor="middle">Knowledge</text><text class="name inv" x="280" y="544" text-anchor="middle">지식 · 기업의 무형 자산</text><text class="body inv" x="280" y="571" text-anchor="middle">sticky · situated · contextual</text><rect class="node" x="24" y="644.5" width="249" height="110" rx="6"/><text class="small" x="148.5" y="670.5" text-anchor="middle">Explicit</text><text class="name" x="148.5" y="691.5" text-anchor="middle">형식지</text><text class="body" x="148.5" y="718.5" text-anchor="middle">문서화됨: 매뉴얼·보고서</text><text class="body" x="148.5" y="739" text-anchor="middle">옮기기 쉬움</text><rect class="node" x="287" y="644.5" width="249" height="110" rx="6"/><text class="small" x="411.5" y="670.5" text-anchor="middle">Tacit</text><text class="name" x="411.5" y="691.5" text-anchor="middle">암묵지</text><text class="body" x="411.5" y="718.5" text-anchor="middle">사람 안의 노하우·감각</text><text class="body" x="411.5" y="739" text-anchor="middle">옮기기 어려움</text><rect class="node" x="24" y="812.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="838.5" text-anchor="middle">Wisdom</text><text class="name" x="280" y="859.5" text-anchor="middle">지혜</text><text class="body" x="280" y="886.5" text-anchor="middle">언제·어디서·어떻게 적용할지 아는 경험</text><path class="flow" d="M280 291.5 L280 349.5"/><rect class="mask" x="240.9" y="309.5" width="78.3" height="22" rx="4"/><text class="lab" x="280" y="325.5" text-anchor="middle">맥락·정리</text><path class="flow" d="M280 439 L280 497"/><rect class="mask" x="206.6" y="457" width="146.9" height="22" rx="4"/><text class="lab" x="280" y="473" text-anchor="middle">패턴·규칙·맥락 발견</text><path class="line" d="M280 586.5 V618.4"/><path class="line" d="M148.5 618.4 H411.5"/><path class="flow" d="M148.5 618.4 L148.5 644.5"/><path class="flow" d="M411.5 618.4 L411.5 644.5"/><rect class="mask" x="249.2" y="591.45" width="61.7" height="22" rx="4"/><text class="lab" x="280" y="607.45" text-anchor="middle">두 형태</text><path class="line" d="M148.5 754.5 V780.6"/><path class="line" d="M411.5 754.5 V780.6"/><path class="line" d="M148.5 780.6 H411.5"/><path class="flow" d="M280 780.6 L280 812.5"/><rect class="mask" x="227.5" y="785.55" width="105.0" height="22" rx="4"/><text class="lab" x="280" y="801.55" text-anchor="middle">경험으로 적용</text><path class="flow" d="M24 926 H54"/><text class="small" x="62" y="931">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="918" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="931">중심 개념</text>
</svg>
