ass="lab inv" x="82.5" y="968" text-anchor="middle">DSCoE</text><text class="small inv" x="82.5" y="992" text-anchor="middle">인력 보유</text><path class="org" d="M215.5 922 V942"/><rect class="node" x="159" y="942" width="113" height="82" rx="6"/><text class="lab" x="215.5" y="968" text-anchor="middle">부서 A</text><rect class="focal" x="173" y="982" width="85" height="30" rx="4"/><text class="small inv" x="215.5" y="1002" text-anchor="middle">분석가</text><path class="org" d="M348.5 922 V942"/><rect class="node" x="292" y="942" width="113" height="82" rx="6"/><text class="lab" x="348.5" y="968" text-anchor="middle">부서 B</text><rect class="focal" x="306" y="982" width="85" height="30" rx="4"/><text class="small inv" x="348.5" y="1002" text-anchor="middle">분석가</text><path class="org" d="M481.5 922 V942"/><rect class="node" x="425" y="942" width="113" height="82" rx="6"/><text class="lab" x="481.5" y="968" text-anchor="middle">부서 C</text><rect class="focal" x="439" y="982" width="85" height="30" rx="4"/><text class="small inv" x="481.5" y="1002" text-anchor="middle">분석가</text><path class="dash plain" d="M82.5 1024 V1050 H481.5"/><path class="dash" d="M215.5 1050 V1024"/><path class="dash" d="M348.5 1050 V1024"/><path class="dash" d="M481.5 1050 V1024"/><rect class="mask" x="112.8" y="1039" width="72.3" height="22" rx="4"/><text class="lab" x="149" y="1055" text-anchor="middle">인력 배치</text><text class="lab" x="32" y="1088">DSCoE 인력을 현업 부서에 배치</text><text class="task" x="32" y="1110">장점: 결과를 신속하게 실무에 적용</text><text class="task" x="32" y="1132">단점: 부서 간 역할 분담을 명확히</text><path class="org" d="M24 1178 H54"/><text class="small" x="62" y="1183">조직도 보고 선</text><path class="dash" d="M169.64 1178 H199.64"/><text class="small" x="207.64" y="1183">분석 지원·인력 배치</text><rect class="focal" x="346.6" y="1170" width="22" height="16" rx="3"/><text class="small" x="376.6" y="1183">분석 전문 인력</text><rect class="deep" x="24" y="1196" width="22" height="16" rx="3"/><text class="small" x="54" y="1209">부서 자체 분석</text>
