<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1234" role="img" aria-labelledby="adsp-l04c-org-structures-title adsp-l04c-org-structures-desc">
  <title id="adsp-l04c-org-structures-title">분석 조직 구조 3가지</title>
  <desc id="adsp-l04c-org-structures-desc">세 개의 조직도. 집중형은 경영진 아래에 독립 분석 조직 DSCoE가 부서들과 나란히 있고 분석 결과를 각 부서에 제공하며, 업무 이원화 가능성이 단점이다. 기능형은 DSCoE 없이 각 부서 안에서 자체 분석을 하며 전사 관점 분석이 어렵다. 분산형은 DSCoE가 분석 인력을 각 현업 부서에 배치해 결과를 신속히 적용하지만 역할 분담을 명확히 해야 한다.</desc>
  <defs><marker id="adsp-l04c-org-structures-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l04c-org-structures-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l04c-org-structures-a)}.flow.both{marker-start:url(#adsp-l04c-org-structures-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l04c-org-structures-m)}.dash.both{marker-start:url(#adsp-l04c-org-structures-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="1234"/>
  <text class="tag" x="24" y="40">ADsP · 2과목 2장 · 분석 조직</text><text class="title" x="24" y="74">분석 조직 구조 3가지</text><text class="subtitle" x="24" y="104">분석 전문 조직(DSCoE)이 어디에 있느냐로 가른다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="zone" x="16" y="152" width="528" height="304" rx="8"/><text class="name" x="32" y="182">집중형</text><rect class="node" x="220" y="198" width="120" height="36" rx="6"/><text class="lab" x="280" y="222" text-anchor="middle">경영진</text><path class="org" d="M280 234 V256"/><path class="org" d="M82.5 256 H481.5"/><path class="org" d="M82.5 256 V276"/><rect class="focal" x="26" y="276" width="113" height="52" rx="6"/><text class="lab inv" x="82.5" y="302" text-anchor="middle">DSCoE</text><path class="org" d="M215.5 256 V276"/><rect class="node" x="159" y="276" width="113" height="52" rx="6"/><text class="lab" x="215.5" y="302" text-anchor="middle">부서 A</text><path class="org" d="M348.5 256 V276"/><rect class="node" x="292" y="276" width="113" height="52" rx="6"/><text class="lab" x="348.5" y="302" text-anchor="middle">부서 B</text><path class="org" d="M481.5 256 V276"/><rect class="node" x="425" y="276" width="113" height="52" rx="6"/><text class="lab" x="481.5" y="302" text-anchor="middle">부서 C</text><path class="dash plain" d="M82.5 328 V354 H481.5"/><path class="dash" d="M215.5 354 V328"/><path class="dash" d="M348.5 354 V328"/><path class="dash" d="M481.5 354 V328"/><rect class="mask" x="97.2" y="343" width="103.6" height="22" rx="4"/><text class="lab" x="149" y="359" text-anchor="middle">분석 결과 제공</text><text class="lab" x="32" y="392">독립 DSCoE가 전사 분석을 일괄 담당</text><text class="task" x="32" y="414">장점: 전사 전략 기준으로 우선순위</text><text class="task" x="32" y="436">단점: 현업과 업무 이원화·중복 가능</text><rect class="zone" x="16" y="474" width="528" height="326" rx="8"/><text class="name" x="32" y="504">기능형</text><rect class="node" x="220" y="520" width="120" height="36" rx="6"/><text class="lab" x="280" y="544" text-anchor="middle">경영진</text