<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 763" role="img" aria-labelledby="mis-gl-4c-responsibility-chain-title mis-gl-4c-responsibility-chain-desc">
  <title id="mis-gl-4c-responsibility-chain-title">책임 → 추적 → 배상 → 적법 절차</title>
  <desc id="mis-gl-4c-responsibility-chain-desc">Responsibility(개인이 결정의 비용·의무를 받아들임), Accountability(누가 무엇을 했는지 추적 가능한 제도), Liability(피해자가 법적으로 배상받을 수 있는 정치 체제의 특징), Due process(법이 알려지고 이의 제기가 가능한 법치 사회의 특징)가 차례로 이어지는 사슬과 윤리적 분석 다섯 단계</desc>
  <defs><marker id="mis-gl-4c-responsibility-chain-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4c-responsibility-chain-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4c-responsibility-chain-a)}.flow.both{marker-start:url(#mis-gl-4c-responsibility-chain-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4c-responsibility-chain-m)}.dash.both{marker-start:url(#mis-gl-4c-responsibility-chain-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="763"/>
  <text class="tag" x="24" y="40">4장 · 4-3 책임 개념과 판단 원칙 ①</text><text class="title" x="24" y="74">책임 → 추적 → 배상 → 적법 절차</text><text class="subtitle" x="24" y="104">앞 고리가 없으면 뒤 고리가 작동하지 않는다. 누가 했는지 추적할 수 없으면</text><text class="subtitle" x="24" y="124">배상도 물을 수 없다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="512" height="63" rx="6"/><text class="small" x="280" y="198" text-anchor="middle">Responsibility · 개인</text><text class="name" x="280" y="219" text-anchor="middle">결정의 비용·의무를 받아들임</text><rect class="focal" x="24" y="293" width="512" height="63" rx="6"/><text class="small inv" x="280" y="319" text-anchor="middle">Accountability · 제도</text><text class="name inv" x="280" y="340" text-anchor="middle">누가 무엇을 했는지 추적 가능</text><rect class="node" x="24" y="414" width="512" height="63" rx="6"/><text class="small" x="280" y="440" text-anchor="middle">Liability · 정치 체제</text><text class="name" x="280" y="461" text-anchor="middle">피해를 법적으로 배상받음</text><rect class="node" x="24" y="535" width="512" height="63" rx="6"/><text class="small" x="280" y="561" text-anchor="middle">Due process · 법치 사회</text><text class="name" x="280" y="582" text-anchor="middle">법이 알려지고 이의 제기 가능</text><rect class="node" x="24" y="632" width="512" height="63" rx="6"/><text class="small" x="280" y="658" text-anchor="middle">Ethical analysis · 다섯 단계</text><text class="name" x="280" y="679" text-anchor="middle">사실 → 가치 → 이해관계자 → 선택지 → 결과</text><path class="flow" d="M280 235 L280 293"/><rect class="mask" x="258.6" y="253" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="269" text-anchor="middle">전제</text><path class="flow" d="M280 356 L280 414"/><rect class="mask" x="258.6" y="374" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="390" text-anchor="middle">전제</text><path class="flow" d="M280 477 L280 535"/><rect class="mask" x="258.6" y="495" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="511" text-anchor="middle">전제</text><path class="flow" d="M24 719 H54"/><text class="small" x="62" y="724">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="711" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="724">중심 개념</text>
</svg>
