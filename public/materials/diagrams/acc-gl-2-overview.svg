<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 715" role="img" aria-labelledby="acc-gl-2-overview-title acc-gl-2-overview-desc">
  <title id="acc-gl-2-overview-title">재무제표의 구성과 연결</title>
  <desc id="acc-gl-2-overview-desc">2장의 다섯 개념 묶음을 재무제표와 결산일·회계기간, 재무제표 요소, 회계등식과 차변·대변, 재무제표 사이의 연계, 인식과 측정 순서로 지그재그로 잇고 요소·관계식·연결·언제 얼마로라는 이름표를 단 개요도</desc>
  <defs><marker id="acc-gl-2-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-2-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-2-overview-a)}.flow.both{marker-start:url(#acc-gl-2-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-2-overview-m)}.dash.both{marker-start:url(#acc-gl-2-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="715"/>
  <text class="tag" x="24" y="40">2장 개요 · 개념 묶음 5개</text><text class="title" x="24" y="74">재무제표의 구성과 연결</text><text class="subtitle" x="24" y="104">핵심 질문: 재무제표는 어떤 요소로 이루어지고, 서로 어떤 식으로 맞물리며,</text><text class="subtitle" x="24" y="124">언제·얼마로 기록하는가?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="224" height="133" rx="6"/><text class="small" x="136" y="198" text-anchor="middle">2-1</text><text class="name" x="136" y="219" text-anchor="middle">재무제표와</text><text class="name" x="136" y="242" text-anchor="middle">결산일·회계기간</text><text class="body" x="136" y="269" text-anchor="middle">재무상태표(시점) + 기간</text><text class="body" x="136" y="289.5" text-anchor="middle">재무제표 3개 + 주석</text><rect class="node" x="312" y="172" width="224" height="133" rx="6"/><text class="small" x="424" y="209.5" text-anchor="middle">2-2</text><text class="name" x="424" y="230.5" text-anchor="middle">재무제표 요소</text><text class="body" x="424" y="257.5" text-anchor="middle">자산·부채·자본</text><text class="body" x="424" y="278" text-anchor="middle">수익·비용</text><rect class="focal" x="312" y="363" width="224" height="110" rx="6"/><text class="small inv" x="424" y="389" text-anchor="middle">2-3</text><text class="name inv" x="424" y="410" text-anchor="middle">회계등식과 차변·대변</text><text class="body inv" x="424" y="437" text-anchor="middle">자산 ＝ 부채 + 자본</text><text class="body inv" x="424" y="457.5" text-anchor="middle">수익 − 비용 ＝ 이익</text><rect class="node" x="24" y="363" width="224" height="110" rx="6"/><text class="small" x="136" y="389" text-anchor="middle">2-4</text><text class="name" x="136" y="410" text-anchor="middle">재무제표 사이의 연계</text><text class="body" x="136" y="437" text-anchor="middle">이익잉여금·총포괄손익</text><text class="body" x="136" y="457.5" text-anchor="middle">자본변동표·현금흐름표</text><rect class="node" x="24" y="531" width="224" height="110" rx="6"/><text class="small" x="136" y="557" text-anchor="middle">2-5</text><text class="name" x="136" y="578" text-anchor="middle">인식과 측정</text><text class="body" x="136" y="605" text-anchor="middle">발생기준 · 수익비용대응</text><text class="body" x="136" y="625.5" text-anchor="middle">역사적 원가 vs 공정가치</text><path class="flow" d="M248 238.5 L312 238.5"/><rect class="mask" x="258.6" y="227.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="243.5" text-anchor="middle">요소</text><path class="flow" d="M424 305 L424 363"/><rect class="mask" x="395.3" y="323" width="57.3" height="22" rx="4"/><text class="lab" x="424" y="339" text-anchor="middle">관계식</text><path class="flow" d="M312 418 L248 418"/><rect class="mask" x="258.6" y="407" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="423" text-anchor="middle">연결</text><path class="flow" d="M136 473 L136 531"/><rect class="mask" x="89.6" y="491" width="92.7" height="22" rx="4"/><text class="lab" x="136" y="507" text-anchor="middle">언제·얼마로</text><path class="flow" d="M24 671 H54"/><text class="small" x="62" y="676">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="663" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="676">중심 개념</text>
</svg>
