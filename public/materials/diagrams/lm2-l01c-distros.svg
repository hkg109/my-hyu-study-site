<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 746" width="560" height="746" role="img" aria-labelledby="lm2-l01c-distros-title lm2-l01c-distros-desc">
  <title id="lm2-l01c-distros-title">리눅스 배포판 3대 계열</title>
  <desc id="lm2-l01c-distros-desc">맨 위 리눅스 커널에서 Red Hat, Debian, Slackware 세 계열이 갈라진다. Red Hat 계열에는 RHEL, Fedora, CentOS Stream, Rocky Linux, AlmaLinux가 있고 rpm 패키지와 rpm, yum, dnf 도구를 쓴다. Debian 계열에는 Ubuntu, Linux Mint, Kali Linux, Raspberry Pi OS가 있고 deb 패키지와 dpkg, apt를 쓴다. Slackware 계열에서는 SUSE가 출발했지만 SUSE는 지금 rpm과 zypper를 쓴다. Slackware 자체는 tgz, txz 패키지와 pkgtool을 쓴다.</desc>
  <defs><marker id="lm2-l01c-distros-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l01c-distros-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l01c-distros-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l01c-distros-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="746"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 1과목 1장</text><text class="title" x="24" y="74">배포판 — 세 뿌리, 세 가지 패키지</text><text class="subtitle" x="24" y="104">이름 → 계열 → 패키지 형식 → 도구가 줄줄이 따라 나온다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="focal" x="180" y="156" width="200" height="46" rx="6"/><text class="lab inv" x="280" y="185" text-anchor="middle">리눅스 커널 + GNU</text><path class="flow" d="M280 202 V222 H104.0 V246"/><rect class="deep" x="24" y="246" width="160" height="44" rx="6"/><text class="lab" x="104" y="274" text-anchor="middle">Red Hat 계열</text><rect class="node" x="34" y="306" width="140" height="34" rx="6"/><text class="body" x="104" y="328" text-anchor="middle">RHEL</text><rect class="node" x="34" y="348" width="140" height="34" rx="6"/><text class="body" x="104" y="370" text-anchor="middle">Fedora</text><rect class="node" x="34" y="390" width="140" height="34" rx="6"/><text class="body" x="104" y="412" text-anchor="middle">CentOS Stream</text><rect class="node" x="34" y="432" width="140" height="34" rx="6"/><text class="body" x="104" y="454" text-anchor="middle">Rocky Linux</text><rect class="node" x="34" y="474" width="140" height="34" rx="6"/><text class="body" x="104" y="496" text-anchor="middle">AlmaLinux</text><line class="thin" x1="104.0" y1="290" x2="104.0" y2="306"/><rect class="zone" x="24" y="532" width="160" height="60" rx="6"/><text class="lab" x="104" y="556" text-anchor="middle">.rpm</text><text class="small" x="104" y="578" text-anchor="middle">rpm · yum · dnf</text><path class="flow" d="M280 202 V222 H280.0 V246"/><rect class="deep" x="200" y="246" width="160" height="44" rx="6"/><text class="lab" x="280" y="274" text-anchor="middle">Debian 계열</text><rect class="node" x="210" y="306" width="140" height="34" rx="6"/><text class="body" x="280" y="328" text-anchor="middle">Debian</text><rect class="node" x="210" y="348" width="140" height="34" rx="6"/><text class="body" x="280" y="370" text-anchor="middle">Ubuntu</text><rect class="node" x="210" y="390" width="140" height="34" rx="6"/><text class="body" x="280" y="412" text-anchor="middle">Linux Mint</text><rect class="node" x="210" y="432" width="140" height="34" rx="6"/><text class="body" x="280" y="454" text-anchor="middle">Kali Linux</text><rect class="node" x="210" y="474" width="140" height="34" rx="6"/><text class="body" x="280" y="496" text-anchor="middle">Raspberry Pi OS</text><line class="thin" x1="280.0" y1="290" x2="280.0" y2="306"/><rect class="zone" x="200" y="532" width="160" height="60" rx="6"/><text class="lab" x="280" y="556" text-anchor="middle">.deb</text><text class="small" x="280" y="578" text-anchor="middle">dpkg · apt</text><path class="flow" d="M280 202 V222 H456.0 V246"/><rect class="deep" x="376" y="246" width="160" height="44" rx="6"/><text class="lab" x="456" y="274" text-anchor="middle">Slackware 계열</text><rect class="node" x="386" y="306" width="140" height="34" rx="6"/><text class="body" x="456" y="328" text-anchor="middle">Slackware</text><rect class="node" x="386" y="348" width="140" height="34" rx="6"/><text class="body" x="456" y="370" text-anchor="middle">SUSE(초기)</text><line class="thin" x1="456.0" y1="290" x2="456.0" y2="306"/><rect class="zone" x="376" y="532" width="160" height="60" rx="6"/><text class="lab" x="456" y="556" text-anchor="middle">.tgz · .txz</text><text class="small" x="456" y="578" text-anchor="middle">pkgtool</text><rect class="outside" x="376" y="400" width="160" height="84" rx="6"/><text class="small" x="456" y="424" text-anchor="middle">openSUSE·SLES</text><text class="small" x="456" y="446" text-anchor="middle">지금은 rpm 사용</text><text class="small" x="456" y="468" text-anchor="middle">zypper · YaST</text><path class="dash" d="M456.0 382 V400"/><rect class="deep" x="24" y="620" width="512" height="74" rx="6"/><text class="lab" x="40" y="650">함정 · Ubuntu·Mint·Kali → Debian 계열 (dpkg·apt)</text><text class="lab" x="40" y="676">Fedora·CentOS·Rocky → Red Hat 계열 (rpm·dnf)</text><path class="flow" d="M24 724 H54"/><text class="small" x="62" y="729">갈라져 나옴</text><path class="dash" d="M155.55 724 H185.55"/><text class="small" x="193.55" y="729">형식을 바꿈</text><rect class="zone" x="287.1" y="716" width="22" height="16" rx="3"/><text class="small" x="317.1" y="729">패키지 형식·도구</text>
