<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 692" role="img" aria-labelledby="mis-gl-2c-ai-roles-title mis-gl-2c-ai-roles-desc">
  <title id="mis-gl-2c-ai-roles-title">Assist → Automate → Agent</title>
  <desc id="mis-gl-2c-ai-roles-desc">Assist는 사람이 일하고 AI가 검색·요약·초안·추천으로 보조하며 사람이 판단을 주도하고, Automate는 시스템이 정해진 반복 단계를 수행하며 사람이 규칙과 예외를 관리하고, Agent는 AI가 도구를 호출해 정의된 워크플로를 수행하며 사람이 목표·권한·검토 기준을 정하는 세 단계 그림</desc>
  <defs><marker id="mis-gl-2c-ai-roles-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2c-ai-roles-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2c-ai-roles-a)}.flow.both{marker-start:url(#mis-gl-2c-ai-roles-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2c-ai-roles-m)}.dash.both{marker-start:url(#mis-gl-2c-ai-roles-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="692"/>
  <text class="tag" x="24" y="40">2장 · 2-1 비즈니스 프로세스와 IT ③</text><text class="title" x="24" y="74">Assist → Automate → Agent</text><text class="subtitle" x="24" y="104">AI가 프로세스에 들어가는 세 수준: 아래로 갈수록 AI의 자율성이 커지고</text><text class="subtitle" x="24" y="124">사람의 통제 방식이 바뀐다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="224" height="89.5" rx="6"/><text class="small" x="136" y="198" text-anchor="middle">Assist · AI가 보조</text><text class="name" x="136" y="219" text-anchor="middle">사람이 수행</text><text class="body" x="136" y="246" text-anchor="middle">AI: 검색·요약·초안·추천</text><rect class="node" x="312" y="172" width="224" height="89.5" rx="6"/><text class="small" x="424" y="198" text-anchor="middle">사람의 위치</text><text class="name" x="424" y="219" text-anchor="middle">판단을 주도</text><text class="body" x="424" y="246" text-anchor="middle">제안을 검토해 행동</text><path class="flow" d="M248 216.75 L312 216.75"/><rect class="mask" x="258.6" y="205.75" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="221.75" text-anchor="middle">통제</text><rect class="node" x="24" y="319.5" width="224" height="112.5" rx="6"/><text class="small" x="136" y="345.5" text-anchor="middle">Automate · 자동화</text><text class="name" x="136" y="366.5" text-anchor="middle">시스템이 반복 단계</text><text class="name" x="136" y="389.5" text-anchor="middle">수행</text><text class="body" x="136" y="416.5" text-anchor="middle">규칙·모델이 처리</text><rect class="node" x="312" y="319.5" width="224" height="112.5" rx="6"/><text class="small" x="424" y="357" text-anchor="middle">사람의 위치</text><text class="name" x="424" y="378" text-anchor="middle">규칙·예외 관리</text><text class="body" x="424" y="405" text-anchor="middle">예외만 처리</text><path class="flow" d="M248 375.75 L312 375.75"/><rect class="mask" x="258.6" y="364.75" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="380.75" text-anchor="middle">통제</text><rect class="focal" x="24" y="490" width="224" height="89.5" rx="6"/><text class="small inv" x="136" y="516" text-anchor="middle">Agent · 에이전트</text><text class="name inv" x="136" y="537" text-anchor="middle">AI가 워크플로 수행</text><text class="body inv" x="136" y="564" text-anchor="middle">도구·시스템 호출</text><rect class="node" x="312" y="490" width="224" height="89.5" rx="6"/><text class="small" x="424" y="516" text-anchor="middle">사람의 위치</text><text class="name" x="424" y="537" text-anchor="middle">목표·권한·검토 설정</text><text class="body" x="424" y="564" text-anchor="middle">모니터링·에스컬레이션</text><path class="flow" d="M248 534.75 L312 534.75"/><rect class="mask" x="258.6" y="523.75" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="539.75" text-anchor="middle">통제</text><path class="flow" d="M136 261.5 L136 319.5"/><path class="flow" d="M424 261.5 L424 319.5"/><rect class="mask" x="241.9" y="279.5" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="295.5" text-anchor="middle">자율성 ↑</text><path class="flow" d="M136 432 L136 490"/><path class="flow" d="M424 432 L424 490"/><rect class="mask" x="241.9" y="450" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="466" text-anchor="middle">자율성 ↑</text><path class="flow" d="M24 603.5 H54"/><text class="small" x="62" y="608.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="595.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="608.5">중심 개념</text><text class="small" x="24" y="635.5">Agent일수록 권한 범위, 모니터링, 사람에게 넘기는 예외(escalation)를</text><text class="small" x="24" y="653.5">먼저 정해야 한다.</text>
</svg>
