<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 478" width="560" height="478" role="img" aria-labelledby="sci1-6-02-gas-collision-title sci1-6-02-gas-collision-desc">
  <title id="sci1-6-02-gas-collision-title">기체의 압력은 입자의 충돌에서 생긴다</title>
  <desc id="sci1-6-02-gas-collision-desc">왼쪽 상자 안에 기체 입자 여러 개가 짧은 화살표 방향으로 제각각 움직인다. 위, 오른쪽, 아래, 왼쪽 벽에 하나씩 입자가 부딪히고, 부딪힌 자리에서 벽 바깥쪽을 향한 굵은 화살표가 그려져 벽이 모든 방향으로 힘을 받는다는 것을 보여 준다. 오른쪽 카드는 1 입자는 모든 방향으로 움직인다, 2 벽에 부딪힌다, 3 부딪힐 때마다 벽을 바깥으로 민다, 4 일정한 면적이 받는 힘이 기체의 압력이다 순서로 정리한다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.ptc{fill:#1d1d1a}.ptcl{fill:#65645e}</style>
  <rect class="bg" width="560" height="478"/><text class="tag" x="24.0" y="40.0">중1 과학 · VI. 기체의 성질</text><text class="title" x="24.0" y="74.0">기체의 압력은 입자의 충돌에서 생긴다</text><text class="subtitle" x="24.0" y="104.0">입자가 벽에 부딪혀 벽을 미는 힘이 모여 압력이 된다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="node" x="40.0" y="172.0" width="250.0" height="220.0" rx="10"/><rect x="40" y="172" width="250" height="220" rx="10" fill="none" stroke="#1d1d1a" stroke-width="2.5"/><line x1="112.2" y1="336.5" x2="103.1" y2="328.7" stroke="#65645e" stroke-width="1.5"/><path d="M98.5,324.8 L104.8,326.7 L101.3,330.8 Z" fill="#65645e"/><circle class="ptc" cx="119.0" cy="342.4" r="7.0"/><line x1="245.7" y1="209.1" x2="253.1" y2="199.7" stroke="#65645e" stroke-width="1.5"/><path d="M256.8,195.0 L255.2,201.3 L251.0,198.0 Z" fill="#65645e"/><circle class="ptc" cx="240.1" cy="216.2" r="7.0"/><line x1="148.7" y1="220.5" x2="159.6" y2="225.5" stroke="#65645e" stroke-width="1.5"/><path d="M165.1,228.1 L158.5,228.0 L160.7,223.1 Z" fill="#65645e"/><circle class="ptc" cx="140.5" cy="216.8" r="7.0"/><line x1="241.3" y1="349.3" x2="229.6" y2="346.9" stroke="#65645e" stroke-width="1.5"/><path d="M223.7,345.8 L230.1,344.3 L229.0,349.6 Z" fill="#65645e"/><circle class="ptc" cx="250.2" cy="351.0" r="7.0"/><line x1="149.4" y1="283.5" x2="139.9" y2="276.1" stroke="#65645e" stroke-width="1.5"/><path d="M135.2,272.4 L141.6,274.0 L138.3,278.2 Z" fill="#65645e"/><circle class="ptc" cx="156.5" cy="289.0" r="7.0"/><line x1="206.0" y1="327.3" x2="195.5" y2="333.2" stroke="#65645e" stroke-width="1.5"/><path d="M190.3,336.1 L194.2,330.8 L196.9,335.5 Z" fill="#65645e"/><circle class="ptc" cx="213.8" cy="322.9" r="7.0"/><line x1="154.6" y1="340.3" x2="146.8" y2="349.4" stroke="#65645e" stroke-width="1.5"/><path d="M142.9,353.9 L144.8,347.6 L148.9,351.1 Z" fill="#65645e"/><circle class="ptc" cx="160.4" cy="333.4" r="7.0"/><line x1="89.5" y1="219.4" x2="80.8" y2="211.1" stroke="#65645e" stroke-width="1.5"/><path d="M76.5,207.0 L82.7,209.2 L79.0,213.1 Z" fill="#65645e"/><circle class="ptc" cx="96.0" cy="225.6" r="7.0"/><line x1="118.4" y1="302.4" x2="111.1" y2="312.0" stroke="#65645e" stroke-width="1.5"/><path d="M107.5,316.8 L109.0,310.4 L113.3,313.6 Z" fill="#65645e"/><circle class="ptc" cx="123.8" cy="295.2" r="7.0"/><line x1="207.2" y1="261.8" x2="213.7" y2="271.8" stroke="#65645e" stroke-width="1.5"/><path d="M217.0,276.9 L211.4,273.3 L216.0,270.4 Z" fill="#65645e"/><circle class="ptc" cx="202.3" cy="254.2" r="7.0"/><line x1="145.1" y1="264.4" x2="137.9" y2="274.0" stroke="#65645e" stroke-width="1.5"/><path d="M134.3,278.8 L135.7,272.4 L140.0,275.6 Z" fill="#65645e"/><circle class="ptc" cx="150.5" cy="257.2" r="7.0"/><circle class="ptc" cx="120.0" cy="184.0" r="7.0"/><path d="M126.0,172.0 L114.0,172.0" stroke="#1d1d1a" stroke-width="2"/><line x1="120.0" y1="168.0" x2="120.0" y2="152.0" stroke="#1d1d1a" stroke-width="3"/><path d="M120.0,142.0 L124.5,152.0 L115.5,152.0 Z" fill="#1d1d1a"/><circle class="ptc" cx="278.0" cy="312.0" r="7.0"/><path d="M290.0,306.0 L290.0,318.0" stroke="#1d1d1a" stroke-width="2"/><line x1="294.0" y1="312.0" x2="310.0" y2="312.0" stroke="#1d1d1a" stroke-width="3"/><path d="M320.0,312.0 L310.0,316.5 L310.0,307.5 Z" fill="#1d1d1a"/><circle class="ptc" cx="200.0" cy="380.0" r="7.0"/><path d="M194.0,392.0 L206.0,392.0" stroke="#1d1d1a" stroke-width="2"/><line x1="200.0" y1="396.0" x2="200.0" y2="412.0" stroke="#1d1d1a" stroke-width="3"/><path d="M200.0,422.0 L195.5,412.0 L204.5,412.0 Z" fill="#1d1d1a"/><circle class="ptc" cx="52.0" cy="242.0" r="7.0"/><path d="M40.0,248.0 L40.0,236.0" stroke="#1d1d1a" stroke-width="2"/><line x1="36.0" y1="242.0" x2="20.0" y2="242.0" stroke="#1d1d1a" stroke-width="3"/><path d="M10.0,242.0 L20.0,237.5 L20.0,246.5 Z" fill="#1d1d1a"/><text class="small" x="165.0" y="444.0" text-anchor="middle">굵은 화살표 = 벽이 받는 힘 (모든 방향)</text><rect class="zone" x="340.0" y="156.0" width="196.0" height="54.0" rx="6"/><circle class="node" cx="362.0" cy="183.0" r="12.0"/><text class="lab" x="362.0" y="188.0" text-anchor="middle">1</text><text class="lab" x="382.0" y="179.0">입자는 쉬지 않고</text><text class="small" x="382.0" y="199.0">모든 방향으로 움직인다</text><rect class="zone" x="340.0" y="220.0" width="196.0" height="54.0" rx="6"/><circle class="node" cx="362.0" cy="247.0" r="12.0"/><text class="lab" x="362.0" y="252.0" text-anchor="middle">2</text><text class="lab" x="382.0" y="243.0">움직이던 입자가</text><text class="small" x="382.0" y="263.0">용기 벽에 부딪힌다</text><rect class="zone" x="340.0" y="284.0" width="196.0" height="54.0" rx="6"/><circle class="node" cx="362.0" cy="311.0" r="12.0"/><text class="lab" x="362.0" y="316.0" text-anchor="middle">3</text><text class="lab" x="382.0" y="307.0">부딪힐 때마다</text><text class="small" x="382.0" y="327.0">벽을 바깥쪽으로 민다</text><rect class="focal" x="340.0" y="348.0" width="196.0" height="54.0" rx="6"/><circle class="node" cx="362.0" cy="375.0" r="12.0"/><text class="lab" x="362.0" y="380.0" text-anchor="middle">4</text><text class="lab inv" x="382.0" y="371.0">일정한 면적이 받는 힘</text><text class="small inv" x="382.0" y="391.0">= 기체의 압력</text>
</svg>
