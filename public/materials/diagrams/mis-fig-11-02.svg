  <rect class="bg" width="1280" height="700"/><text class="tag" x="64" y="52">2장 · Figure 11.2</text><text class="title" x="64" y="92">Major Types of Knowledge Management Systems</text><text class="subtitle" x="64" y="122">지식관리시스템은 전사적 KMS·지식작업시스템·지능형 기법의 세 유형으로 나뉜다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
