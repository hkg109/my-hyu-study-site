<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 832" width="560" height="832" role="img" aria-labelledby="lm2-l01a-layers-title lm2-l01a-layers-desc">
  <title id="lm2-l01a-layers-title">리눅스 시스템의 층 구조</title>
  <desc id="lm2-l01a-layers-desc">맨 위 사용자가 명령을 입력하면 응용 프로그램과 셸이 이를 해석해 시스템 호출로 커널에 요청하고, 검은 상자인 커널이 하드웨어(CPU, 메모리, 디스크, 네트워크 카드)를 제어한다. 오른쪽에는 커널의 다섯 가지 관리 기능인 프로세스, 메모리, 파일 시스템, 디바이스, 네트워크 관리를 적었다. 아래에는 셸은 명령 해석기, 커널은 자원 관리자라는 구분을 적었다.</desc>
  <defs><marker id="lm2-l01a-layers-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l01a-layers-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l01a-layers-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l01a-layers-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="832"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 1과목 1장</text><text class="title" x="24" y="74">리눅스 시스템의 층 구조</text><text class="subtitle" x="24" y="104">명령은 셸과 커널을 거쳐 하드웨어에 닿는다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="outside" x="24" y="160" width="300" height="62" rx="6"/><text class="name" x="174" y="186" text-anchor="middle">사용자</text><text class="small" x="174" y="208" text-anchor="middle">명령 입력 · 마우스 클릭</text><path class="flow" d="M174.0 222 V252"/><rect class="node" x="24" y="252" width="300" height="62" rx="6"/><text class="name" x="174" y="278" text-anchor="middle">응용 프로그램·유틸리티</text><text class="small" x="174" y="300" text-anchor="middle">ls, vi, gcc, 브라우저</text><path class="flow" d="M174.0 314 V344"/><rect class="zone" x="24" y="344" width="300" height="62" rx="6"/><text class="name" x="174" y="370" text-anchor="middle">셸 (명령어 해석기)</text><text class="small" x="174" y="392" text-anchor="middle">bash · sh · csh · zsh</text><path class="flow" d="M174.0 406 V436"/><rect class="node" x="24" y="436" width="300" height="62" rx="6"/><text class="name" x="174" y="462" text-anchor="middle">시스템 호출</text><text class="small" x="174" y="484" text-anchor="middle">open · read · fork …</text><path class="flow" d="M174.0 498 V528"/><rect class="focal" x="24" y="528" width="300" height="62" rx="6"/><text class="name inv" x="174" y="554" text-anchor="middle">커널</text><text class="small inv" x="174" y="576" text-anchor="middle">자원 관리 · 하드웨어 제어</text><path class="flow" d="M174.0 590 V620"/><rect class="deep" x="24" y="620" width="300" height="62" rx="6"/><text class="name" x="174" y="646" text-anchor="middle">하드웨어</text><text class="small" x="174" y="668" text-anchor="middle">CPU · 메모리 · 디스크 · NIC</text><rect class="zone" x="348" y="344" width="188" height="252" rx="8"/><text class="lab" x="362" y="370">커널의 5대 기능</text><rect class="node" x="360" y="384" width="164" height="32" rx="6"/><text class="body" x="442" y="405" text-anchor="middle">프로세스 관리</text><rect class="node" x="360" y="424" width="164" height="32" rx="6"/><text class="body" x="442" y="445" text-anchor="middle">메모리 관리</text><rect class="node" x="360" y="464" width="164" height="32" rx="6"/><text class="body" x="442" y="485" text-anchor="middle">파일 시스템 관리</text><rect class="node" x="360" y="504" width="164" height="32" rx="6"/><text class="body" x="442" y="525" text-anchor="middle">디바이스 관리</text><rect class="node" x="360" y="544" width="164" height="32" rx="6"/><text class="body" x="442" y="565" text-anchor="middle">네트워크 관리</text><path class="dash" d="M348 559.0 H330"/><rect class="deep" x="24" y="706" width="512" height="74" rx="6"/><text class="lab" x="40" y="736">셸 = 통역사 · 명령을 해석해 커널에 전달</text><text class="lab" x="40" y="762">커널 = 관리자 · 하드웨어와 자원을 직접 제어</text><path class="flow" d="M24 810 H54"/><text class="small" x="62" y="815">요청이 내려가는 방향</text><rect class="focal" x="213.6" y="802" width="22" height="16" rx="3"/><text class="small" x="243.6" y="815">커널</text><rect class="zone" x="292.6" y="802" width="22" height="16" rx="3"/><text class="small" x="322.6" y="815">셸·커널 기능</text>
</svg>
