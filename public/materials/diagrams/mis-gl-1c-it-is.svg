<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 653" role="img" aria-labelledby="mis-gl-1c-it-is-title mis-gl-1c-it-is-desc">
  <title id="mis-gl-1c-it-is-title">IT는 IS의 한 부분이다</title>
  <desc id="mis-gl-1c-it-is-desc">정보시스템이 IT, 사람, 절차와 조직을 포함하는 범위 안에 있고, 정보시스템이 원시 데이터를 처리해 의사결정에 쓰이는 정보로 바꾸는 관계를 슈퍼마켓 계산대 사례로 보여 주는 그림</desc>
  <defs><marker id="mis-gl-1c-it-is-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-1c-it-is-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-1c-it-is-a)}.flow.both{marker-start:url(#mis-gl-1c-it-is-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-1c-it-is-m)}.dash.both{marker-start:url(#mis-gl-1c-it-is-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="653"/>
  <text class="tag" x="24" y="40">1장 · 1-3 정보시스템의 기본 단위 ①</text><text class="title" x="24" y="74">IT는 IS의 한 부분이다</text><text class="subtitle" x="24" y="104">IS는 기술에 사람과 절차가 결합된 체계이고, 데이터를 정보로 바꿔</text><text class="subtitle" x="24" y="124">결정·조정·통제를 돕는다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="164" width="528" height="154" rx="8"/><text class="small" x="28" y="184">IS · 정보시스템 = IT + 사람 + 절차 (포함 관계)</text><rect class="node" x="24" y="198" width="161" height="110" rx="6"/><text class="small" x="104.5" y="224" text-anchor="middle">IT</text><text class="name" x="104.5" y="245" text-anchor="middle">기술 도구</text><text class="body" x="104.5" y="272" text-anchor="middle">하드웨어</text><text class="body" x="104.5" y="292.5" text-anchor="middle">소프트웨어</text><rect class="node" x="199" y="198" width="161" height="110" rx="6"/><text class="small" x="279.5" y="224" text-anchor="middle">People</text><text class="name" x="279.5" y="245" text-anchor="middle">사람</text><text class="body" x="279.5" y="272" text-anchor="middle">사용자</text><text class="body" x="279.5" y="292.5" text-anchor="middle">관리자</text><rect class="node" x="374" y="198" width="161" height="110" rx="6"/><text class="small" x="454.5" y="224" text-anchor="middle">Procedures</text><text class="name" x="454.5" y="245" text-anchor="middle">절차·조직</text><text class="body" x="454.5" y="272" text-anchor="middle">규칙</text><text class="body" x="454.5" y="292.5" text-anchor="middle">업무 방식</text><rect class="node" x="24" y="366" width="224" height="89.5" rx="6"/><text class="small" x="136" y="392" text-anchor="middle">Data</text><text class="name" x="136" y="413" text-anchor="middle">원시 사실</text><text class="body" x="136" y="440" text-anchor="middle">품목번호·품명·가격</text><rect class="focal" x="312" y="366" width="224" height="89.5" rx="6"/><text class="small inv" x="424" y="392" text-anchor="middle">Information</text><text class="name inv" x="424" y="413" text-anchor="middle">의미 있는 정보</text><text class="body inv" x="424" y="440" text-anchor="middle">주방세제 지역별 매출·YTD</text><path class="flow" d="M248 410.75 L312 410.75"/><rect class="mask" x="258.6" y="399.75" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="415.75" text-anchor="middle">처리</text><rect class="node" x="24" y="513.5" width="512" height="71.5" rx="6"/><text class="name" x="280" y="541.5" text-anchor="middle">의사결정 · 조정 · 통제</text><text class="body" x="280" y="568.5" text-anchor="middle">예: 지역별 발주량 조정</text><path class="flow" d="M280 308 L280 366"/><rect class="mask" x="166.5" y="326" width="227.1" height="22" rx="4"/><text class="lab" x="280" y="342" text-anchor="middle">IS가 수행: 수집·처리·저장·배포</text><path class="flow" d="M280 455.5 L280 513.5"/><rect class="mask" x="258.6" y="473.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="489.5" text-anchor="middle">사용</text><path class="flow" d="M24 609 H54"/><text class="small" x="62" y="614">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="601" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="614">중심 개념</text><rect class="zone" x="302.06225" y="601" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="614">범위·묶음</text>
</svg>
