<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="sci1-5-02-three-elements-title sci1-5-02-three-elements-desc">
  <title id="sci1-5-02-three-elements-title">힘의 3요소를 화살표 하나로</title>
  <desc id="sci1-5-02-three-elements-desc">상자의 오른쪽 면 가운데 점에서 오른쪽으로 화살표가 뻗어 있다. 바탕의 눈금은 한 칸이 1 cm이고 1 cm당 1 N으로 정해, 4칸 길이의 화살표가 4 N을 나타낸다. 시작점에는 작용점, 화살촉에는 방향, 화살표 아래에는 크기라는 이름표를 붙였다. 아래에는 같은 상자를 2 N으로 미는 짧은 화살표를 비교로 그렸다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="440"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">힘의 3요소를 화살표 하나로</text><text class="subtitle" x="24.0" y="104.0">시작점 = 작용점, 가리키는 쪽 = 방향, 길이 = 크기</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><line class="thin" x1="180.0" y1="160.0" x2="180.0" y2="300.0"/><line class="thin" x1="220.0" y1="160.0" x2="220.0" y2="300.0"/><line class="thin" x1="260.0" y1="160.0" x2="260.0" y2="300.0"/><line class="thin" x1="300.0" y1="160.0" x2="300.0" y2="300.0"/><line class="thin" x1="340.0" y1="160.0" x2="340.0" y2="300.0"/><line class="thin" x1="380.0" y1="160.0" x2="380.0" y2="300.0"/><line class="thin" x1="420.0" y1="160.0" x2="420.0" y2="300.0"/><line class="thin" x1="180.0" y1="164.0" x2="420.0" y2="160.0"/><line class="thin" x1="180.0" y1="209.3" x2="420.0" y2="206.7"/><line class="thin" x1="180.0" y1="254.6" x2="420.0" y2="253.4"/><line class="thin" x1="180.0" y1="299.9" x2="420.0" y2="300.1"/><rect class="solid" x="60.0" y="180.0" width="120.0" height="100.0" rx="3"/><text class="lab" x="120.0" y="235.0" text-anchor="middle">상자</text><circle class="focal" cx="180.0" cy="230.0" r="6.0"/><line x1="180.0" y1="230.0" x2="325.0" y2="230.0" stroke="#1d1d1a" stroke-width="4"/><path d="M340.0,230.0 L325.0,236.8 L325.0,223.2 Z" fill="#1d1d1a"/><text class="lab" x="174.0" y="330.0" text-anchor="middle">작용점</text><line class="thin" x1="180.0" y1="238.0" x2="180.0" y2="314.0"/><text class="lab" x="348.0" y="216.0">방향 →</text><path class="line" d="M180,256 v8 H340 v-8"/><text class="lab" x="260.0" y="282.0" text-anchor="middle">크기 = 길이 4 cm → 4 N</text><text class="small" x="420.0" y="154.0" text-anchor="end">1칸 = 1 cm = 1 N</text><rect class="zone" x="24.0" y="350.0" width="512.0" height="70.0" rx="6"/><rect class="solid" x="44.0" y="364.0" width="70.0" height="42.0" rx="3"/><text class="lab" x="79.0" y="390.0" text-anchor="middle">상자</text><line x1="114.0" y1="385.0" x2="179.0" y2="385.0" stroke="#1d1d1a" stroke-width="4"/><path d="M194.0,385.0 L179.0,391.8 L179.0,378.2 Z" fill="#1d1d1a"/><text class="lab" x="210.0" y="380.0">2 N: 길이가 절반</text><text class="small" x="210.0" y="400.0">같은 기준이면 화살표 길이만 비교해도 크기를 안다</text>
</svg>
