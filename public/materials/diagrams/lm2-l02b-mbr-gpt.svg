<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 712" width="560" height="712" role="img" aria-labelledby="lm2-l02b-mbr-gpt-title lm2-l02b-mbr-gpt-desc">
  <title id="lm2-l02b-mbr-gpt-title">MBR과 GPT의 구조 비교</title>
  <desc id="lm2-l02b-mbr-gpt-desc">위쪽은 MBR 디스크 첫 섹터 512바이트를 확대한 띠로, 446바이트 부트 코드, 16바이트씩 네 칸인 64바이트 파티션 테이블, 2바이트 부트 시그니처 0x55AA로 나뉜다. 네 칸뿐이라 주 파티션은 최대 4개이고, 확장 파티션 하나 안에 논리 파티션을 5번부터 만든다. 최대 디스크는 2TiB다. 아래쪽 GPT 디스크는 LBA 0 보호 MBR, LBA 1 GPT 헤더, 파티션 항목 128개, 파티션 영역, 디스크 끝의 백업 항목과 백업 헤더로 이루어진다.</desc>
  <defs><marker id="lm2-l02b-mbr-gpt-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l02b-mbr-gpt-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l02b-mbr-gpt-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l02b-mbr-gpt-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="712"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 1과목 2장</text><text class="title" x="24" y="74">MBR vs GPT — 파티션 테이블</text><text class="subtitle" x="24" y="104">MBR은 칸이 4개, GPT는 128개에 백업까지</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="lab" x="24" y="160">MBR · 디스크 첫 섹터 512바이트</text><rect class="node" x="24" y="174" width="300" height="56" rx="3"/><text class="lab" x="174" y="199" text-anchor="middle">부트 코드</text><text class="small" x="174" y="219" text-anchor="middle">446바이트</text><rect class="zone" x="324" y="174" width="180" height="56" rx="3"/><text class="lab" x="414" y="199" text-anchor="middle">파티션 테이블</text><text class="small" x="414" y="219" text-anchor="middle">64바이트</text><rect class="focal" x="504" y="174" width="32" height="56" rx="3"/><text class="lab inv" x="520" y="209" text-anchor="middle">2</text><rect class="node" x="324" y="250" width="45" height="40" rx="3"/><text class="lab" x="346.5" y="275" text-anchor="middle">#1</text><rect class="node" x="369" y="250" width="45" height="40" rx="3"/><text class="lab" x="391.5" y="275" text-anchor="middle">#2</text><rect class="node" x="414" y="250" width="45" height="40" rx="3"/><text class="lab" x="436.5" y="275" text-anchor="middle">#3</text><rect class="node" x="459" y="250" width="45" height="40" rx="3"/><text class="lab" x="481.5" y="275" text-anchor="middle">#4</text><line class="thin" x1="324" y1="230" x2="324" y2="250"/><line class="thin" x1="504" y1="230" x2="504" y2="250"/><text class="small" x="414" y="310" text-anchor="middle">16바이트 × 4칸</text><text class="small" x="174" y="275" text-anchor="middle">맨 끝 2바이트 = 서명 0x55AA</text><rect class="zone" x="24" y="334" width="512" height="96" rx="6"/><text class="body" x="40" y="362">주 파티션 최대 4개 (또는 주 3 + 확장 1)</text><text class="body" x="40" y="388">논리 파티션은 확장 안에, 번호는 5번부터</text><text class="body" x="40" y="414">최대 디스크 2TiB · BIOS와 짝</text><text class="lab" x="24" y="470">GPT · 디스크 전체 (LBA = 섹터 번호)</text><rect class="outside" x="24" y="484" width="70" height="60" rx="3"/><text class="lab" x="59" y="511" text-anchor="middle">보호 MBR</text><text class="small" x="59" y="531" text-anchor="middle">LBA 0</text><rect class="deep" x="94" y="484" width="66" height="60" rx="3"/><text class="lab" x="127" y="511" text-anchor="middle">GPT 헤더</text><text class="small" x="127" y="531" text-anchor="middle">LBA 1</text><rect class="zone" x="160" y="484" width="86" height="60" rx="3"/><text class="lab" x="203" y="511" text-anchor="middle">항목 128개</text><text class="small" x="203" y="531" text-anchor="middle">LBA 2–33</text><rect class="node" x="246" y="484" width="154" height="60" rx="3"/><text class="lab" x="323" y="511" text-anchor="middle">파티션들</text><rect class="zone" x="400" y="484" width="70" height="60" rx="3"/><text class="lab" x="435" y="511" text-anchor="middle">백업 항목</text><rect class="deep" x="470" y="484" width="66" height="60" rx="3"/><text class="lab" x="503" y="511" text-anchor="middle">백업 헤더</text><text class="small" x="503" y="531" text-anchor="middle">끝</text><rect class="zone" x="24" y="564" width="512" height="96" rx="6"/><text class="body" x="40" y="592">파티션 기본 128개 · 주/확장/논리 구분 없음</text><text class="body" x="40" y="618">헤더·항목을 앞뒤 2벌 + CRC32로 손상에 강함</text><text class="body" x="40" y="644">64비트 LBA로 대용량 · UEFI 표준</text><rect class="focal" x="24" y="682" width="22" height="16" rx="3"/><text class="small" x="54" y="695">부트 시그니처</text><rect class="zone" x="161.05" y="682" width="22" height="16" rx="3"/><text class="small" x="191.05" y="695">파티션 테이블</text><rect class="outside" x="298.1" y="682" width="22" height="16" rx="3"/><text class="small" x="328.1" y="695">보호 MBR(타입 ee)</text>
</svg>
