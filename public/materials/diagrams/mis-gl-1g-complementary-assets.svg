<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 627" role="img" aria-labelledby="mis-gl-1g-complementary-assets-title mis-gl-1g-complementary-assets-desc">
  <title id="mis-gl-1g-complementary-assets-title">보완 자산의 세 유형</title>
  <desc id="mis-gl-1g-complementary-assets-desc">보완 자산이 조직적 자산, 경영적 자산, 사회적 자산의 세 유형을 포함하고, 세 유형이 IT 투자와 함께 높은 투자 수익을 지원한다는 계층 그림. 사회적 자산은 기업이 아니라 사회가 만든다</desc>
  <defs><marker id="mis-gl-1g-complementary-assets-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-1g-complementary-assets-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-1g-complementary-assets-a)}.flow.both{marker-start:url(#mis-gl-1g-complementary-assets-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-1g-complementary-assets-m)}.dash.both{marker-start:url(#mis-gl-1g-complementary-assets-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="627"/>
  <text class="tag" x="24" y="40">1장 · 1-5 IT 투자가 가치가 되는 길 ②</text><text class="title" x="24" y="74">보완 자산의 세 유형</text><text class="subtitle" x="24" y="104">같은 IT를 사도 성과가 갈리는 이유 — 기술을 쓸 수 있게 만드는 조건이 함께</text><text class="subtitle" x="24" y="124">있어야 한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="198" text-anchor="middle">Complementary assets</text><text class="name inv" x="280" y="219" text-anchor="middle">보완 자산</text><text class="body inv" x="280" y="246" text-anchor="middle">주된 투자(IT)가 가치를 내도록 함께 필요한 자산</text><rect class="node" x="24" y="319.5" width="161" height="110" rx="6"/><text class="small" x="104.5" y="345.5" text-anchor="middle">Organizational</text><text class="name" x="104.5" y="366.5" text-anchor="middle">조직적</text><text class="body" x="104.5" y="393.5" text-anchor="middle">적절한 사업모형</text><text class="body" x="104.5" y="414" text-anchor="middle">효율적 프로세스</text><rect class="node" x="199" y="319.5" width="161" height="110" rx="6"/><text class="small" x="279.5" y="345.5" text-anchor="middle">Managerial</text><text class="name" x="279.5" y="366.5" text-anchor="middle">경영적</text><text class="body" x="279.5" y="393.5" text-anchor="middle">경영진 지원</text><text class="body" x="279.5" y="414" text-anchor="middle">혁신 유인·팀워크</text><rect class="outside" x="374" y="319.5" width="161" height="110" rx="6"/><text class="small" x="454.5" y="345.5" text-anchor="middle">Social</text><text class="name" x="454.5" y="366.5" text-anchor="middle">사회적</text><text class="body" x="454.5" y="393.5" text-anchor="middle">인터넷·통신 인프라</text><text class="body" x="454.5" y="414" text-anchor="middle">기술 표준</text><rect class="node" x="24" y="487.5" width="512" height="71.5" rx="6"/><text class="name" x="280" y="515.5" text-anchor="middle">IT 투자 + 보완 자산 → 높은 수익</text><text class="body" x="280" y="542.5" text-anchor="middle">보완 투자가 없으면 수익이 낮거나 0 (Figure 1.8)</text><path class="line" d="M280 261.5 V293.4"/><path class="line" d="M104.5 293.4 H454.5"/><path class="flow" d="M104.5 293.4 L104.5 319.5"/><path class="flow" d="M279.5 293.4 L279.5 319.5"/><path class="flow" d="M454.5 293.4 L454.5 319.5"/><rect class="mask" x="258.6" y="266.45" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="282.45" text-anchor="middle">포함</text><path class="line" d="M104.5 429.5 V455.6"/><path class="line" d="M279.5 429.5 V455.6"/><path class="line" d="M454.5 429.5 V455.6"/><path class="line" d="M104.5 455.6 H454.5"/><path class="flow" d="M280 455.6 L280 487.5"/><rect class="mask" x="258.6" y="460.55" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="476.55" text-anchor="middle">지원</text><path class="flow" d="M24 583 H54"/><text class="small" x="62" y="588">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="575" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="588">중심 개념</text><rect class="outside" x="302.06225" y="575" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="588">조직 밖 주체</text>
</svg>
