  <g><rect class="node" x="72" y="384" width="192" height="144" rx="6"/><text class="name" x="168" y="424" text-anchor="middle">CISO</text><text class="sub" x="168" y="454" text-anchor="middle">Cybersecurity</text><text class="sub" x="168" y="482" text-anchor="middle">위협 · 통제</text></g>
