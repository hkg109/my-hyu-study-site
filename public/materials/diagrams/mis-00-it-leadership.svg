<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="mis-00-it-leadership-title mis-00-it-leadership-desc">
  <title id="mis-00-it-leadership-title">IT 경영 직책별 책임 영역</title>
  <desc id="mis-00-it-leadership-desc">기업 전체 정보기술 전략을 맡는 CIO와 보안, 지식, 개인정보, 데이터, 인공지능 책임자의 역할 관계</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1}.flow{stroke:#65645e;stroke-width:2;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.inverse{fill:#f7f6f2}</style>
  <rect class="bg" width="1280" height="700"/><text class="tag" x="64" y="52">LECTURE 00 · IT LEADERSHIP</text><text class="title" x="64" y="92">직책은 담당하는 정보 자산으로 구분한다</text><text class="subtitle" x="64" y="122">CIO가 기업 전체 IT 방향을 잡고, 전문 책임자가 각 위험과 자산을 관리한다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
