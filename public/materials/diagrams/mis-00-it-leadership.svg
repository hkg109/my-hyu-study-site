  <g><rect class="node" x="780" y="384" width="192" height="144" rx="6"/><text class="name" x="876" y="424" text-anchor="middle">CDO</text><text class="sub" x="876" y="454" text-anchor="middle">Data</text><text class="sub" x="876" y="482" text-anchor="middle">품질 · 활용</text></g>
