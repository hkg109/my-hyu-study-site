<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="sci1-5-04-diver-balance-title sci1-5-04-diver-balance-desc">
  <title id="sci1-5-04-diver-balance-title">다이버에게 작용하는 중력과 부력</title>
  <desc id="sci1-5-04-diver-balance-desc">물속 다이버 세 명을 나란히 그렸다. 왼쪽은 아래쪽 중력 화살표가 위쪽 부력 화살표보다 길어 알짜힘이 아래쪽이고 내려가기 쉽다. 가운데는 두 화살표 길이가 같아 알짜힘이 0이고 운동 상태가 그대로이다. 오른쪽은 부력이 더 길어 알짜힘이 위쪽이고 올라가기 쉽다. 각 칸 아래에 부력 조절 장치의 공기를 빼거나 맞추거나 넣는다고 적었다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="470"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">다이버에게 작용하는 중력과 부력</text><text class="subtitle" x="24.0" y="104.0">두 화살표의 길이를 비교하면 다이버의 움직임이 보인다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="water" x="24.0" y="146.0" width="512.0" height="230.0" rx="4"/><rect class="deep" x="82.0" y="260.0" width="18.0" height="40.0" rx="6"/><rect class="solid" x="98.0" y="254.0" width="28.0" height="52.0" rx="10"/><circle class="solid" cx="112.0" cy="240.0" r="12.0"/><rect class="node" x="103.0" y="235.0" width="18.0" height="9.0" rx="3"/><path class="solid" d="M100,306 L92,328 L108,328 Z"/><path class="solid" d="M124,306 L132,328 L116,328 Z"/><line x1="146.0" y1="266.0" x2="146.0" y2="227.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M146.0,216.0 L150.9,227.0 L141.1,227.0 Z" fill="#1d1d1a"/><text class="small" x="154.0" y="228.0">부력</text><line x1="146.0" y1="276.0" x2="146.0" y2="355.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M146.0,366.0 L141.1,355.0 L150.9,355.0 Z" fill="#1d1d1a"/><text class="small" x="154.0" y="364.0">중력</text><text class="lab" x="106.0" y="166.0" text-anchor="middle">중력 &gt; 부력</text><rect class="focal" x="40.0" y="390.0" width="144.0" height="34.0" rx="6"/><text class="lab inv" x="112.0" y="412.0" text-anchor="middle">알짜힘 ↓ 아래쪽</text><text class="small" x="112.0" y="446.0" text-anchor="middle">내려가기 · 공기를 뺀다</text><rect class="deep" x="250.0" y="260.0" width="18.0" height="40.0" rx="6"/><rect class="solid" x="266.0" y="254.0" width="28.0" height="52.0" rx="10"/><circle class="solid" cx="280.0" cy="240.0" r="12.0"/><rect class="node" x="271.0" y="235.0" width="18.0" height="9.0" rx="3"/><path class="solid" d="M268,306 L260,328 L276,328 Z"/><path class="solid" d="M292,306 L300,328 L284,328 Z"/><line x1="314.0" y1="266.0" x2="314.0" y2="207.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M314.0,196.0 L318.9,207.0 L309.1,207.