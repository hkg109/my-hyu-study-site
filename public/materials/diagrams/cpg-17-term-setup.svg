<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 714" role="img" aria-labelledby="cpg-17-term-setup-title cpg-17-term-setup-desc">
  <title id="cpg-17-term-setup-title">일곱 단계 세팅 마법사</title>
  <desc id="cpg-17-term-setup-desc">기수 정보, 회장단, 부서와 직책, 구성원 등록, 회의 양식, 확인과 전환, 전환 직후 이전 자료 열람의 일곱 단계를 순서대로 놓고, 회의 양식과 이전 자료 열람은 선택이며 1–4단계가 끝나야 전환할 수 있고 Archive Grant는 전환 뒤에 준다는 것을 표시한 그림.</desc>
  <defs><marker id="cpg-17-term-setup-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-17-term-setup-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-17-term-setup-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-17-term-setup-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="714"/>
  <text class="tag" x="24" y="40">06-6 · 새 기수 세팅 화면</text><text class="title" x="24" y="74">일곱 단계 세팅 마법사</text><text class="subtitle" x="24" y="104">DRAFT 기수 안에서 새 회장단이 준비한다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <path class="line" d="M52 176 V560"/>
  <circle class="node" cx="52" cy="178" r="14"/>
  <text class="lab" x="52" y="183" text-anchor="middle">1</text>
  <rect class="node" x="80" y="152" width="456" height="52" rx="6"/><text class="body" x="96" y="183.0">기수 정보 — 이름 · 시작 예정일</text>
  <text class="small" x="520" y="184" text-anchor="end">필수</text>
  <circle class="node" cx="52" cy="242" r="14"/>
  <text class="lab" x="52" y="247" text-anchor="middle">2</text>
  <rect class="node" x="80" y="216" width="456" height="52" rx="6"/><text class="body" x="96" y="247.0">회장단 — 지정·승인 완료 (06-5)</text>
  <text class="small" x="520" y="248" text-anchor="end">필수</text>
  <circle class="node" cx="52" cy="306" r="14"/>
  <text class="lab" x="52" y="311" text-anchor="middle">3</text>
  <rect class="node" x="80" y="280" width="456" height="52" rx="6"/><text class="body" x="96" y="311.0">부서·직책 — 이번 기수의 국과 표시 직책</text>
  <text class="small" x="520" y="312" text-anchor="end">필수</text>
  <circle class="node" cx="52" cy="370" r="14"/>
  <text class="lab" x="52" y="375" text-anchor="middle">4</text>
  <rect class="node" x="80" y="344" width="456" height="52" rx="6"/><text class="body" x="96" y="375.0">구성원 등록 — 이메일 일괄 입력 → 승인 명단</text>
  <text class="small" x="520" y="376" text-anchor="end">필수</text>
  <circle class="node" cx="52" cy="434" r="14"/>
  <text class="lab" x="52" y="439" text-anchor="middle">5</text>
  <rect class="node" x="80" y="408" width="456" height="52" rx="6"/><text class="body" x="96" y="439.0">회의 양식 — Template · 안건 양식</text>
  <text class="small" x="520" y="440" text-anchor="end">선택</text>
  <circle class="focal" cx="52" cy="498" r="14"/>
  <text class="lab inv" x="52" y="503" text-anchor="middle">6</text>
  <rect class="focal" x="80" y="472" width="456" height="52" rx="6"/><text class="body inv" x="96" y="503.0">확인 · 전환 — 한 트랜잭션으로 ACTIVE</text>
  <text class="small inv" x="520" y="504" text-anchor="end">필수</text>
  <circle class="node" cx="52" cy="562" r="14"/>
  <text class="lab" x="52" y="567" text-anchor="middle">7</text>
  <rect class="node" x="80" y="536" width="456" height="52" rx="6"/><text class="body" x="96" y="567.0">전환 직후 · 이전 자료 열람 — Archive Grant 범위·기한</text>
  <text class="small" x="520" y="568" text-anchor="end">선택</text>
  <text class="small" x="280" y="624" text-anchor="middle">1–4단계가 모두 끝나야 전환 버튼이 켜진다</text>
  <text class="small" x="280" y="646" text-anchor="middle">Archive Grant는 새 기수가 ACTIVE가 된 뒤에 준다</text>
  <rect class="node" x="24" y="674" width="22" height="16" rx="3"/><text class="small" x="54" y="687">준비 단계</text><rect class="focal" x="132.97" y="674" width="22" height="16" rx="3"/><text class="small" x="162.97" y="687">되돌릴 수 없는 전환</text>
</svg>
