<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" role="img" aria-labelledby="cpg-04a-permission-layers-title cpg-04a-permission-layers-desc">
  <title id="cpg-04a-permission-layers-title">권한은 네 단계로 판정한다</title>
  <desc id="cpg-04a-permission-layers-desc">현재 사용자의 활성 Membership, Role이 주는 기본 Permission, 대상 자료의 소유 국·담당자·공개 모드·ACL, 그리고 서버·DB·Storage·Realtime에서의 실제 강제까지 네 단계를 차례로 통과해야 허용된다는 그림.</desc>
  <defs><marker id="cpg-04a-permission-layers-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-04a-permission-layers-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-04a-permission-layers-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-04a-permission-layers-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="760"/>
  <text class="tag" x="24" y="40">04-4 · RLS와 권한 함수</text><text class="title" x="24" y="74">권한은 네 단계로 판정한다</text><text class="subtitle" x="24" y="104">한 단계라도 통과하지 못하면 거부된다.</text><text class="subtitle" x="24" y="124">어느 한 단계만으로는 전체 권한을 설명할 수 없다.</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
  <path class="flow" d="M280 248 V280"/>
  <path class="flow" d="M280 376 V408"/>
  <path class="flow" d="M280 504 V536"/>
  <rect class="node" x="24" y="152" width="512" height="96" rx="6"/><text class="name" x="280" y="185.5" text-anchor="middle">① 현재 사용자</text><text class="body" x="280" y="207.0" text-anchor="middle">어느 Term의 활성 Membership을 가진 누구인가?</text><text class="small" x="280" y="226.6" text-anchor="middle">종료된 Membership은 어떤 권한도 없다</text>
  <rect class="node" x="24" y="280" width="512" height="96" rx="6"/><text class="name" x="280" y="312.5" text-anchor="middle">② 기본 능력 · RBAC</text><text class="body" x="280" y="334.0" text-anchor="middle">Role이 어떤 Permission을 가지는가?</text><text class="code" x="280" y="355.0" text-anchor="middle">event.create · task.access.manage</text>
  <rect class="node" x="24" y="408" width="512" height="96" rx="6"/><text class="name" x="280" y="441.5" text-anchor="middle">③ 대상 자료 · ACL</text><text class="body" x="280" y="463.0" text-anchor="middle">소유 국 · 생성자 · 담당자 · 공개 모드 · ACL</text><text class="small" x="280" y="482.6" text-anchor="middle">"이 특정 업무를 누가 볼 수 있나?"</text>
  <rect class="focal" x="24" y="536" width="512" height="96" rx="6"/><text class="name inv" x="280" y="569.5" text-anchor="middle">④ 실제 강제</text><text class="body inv" x="280" y="591.0" text-anchor="middle">서버 RPC · RLS · Storage · Realtime</text><text class="small inv" x="280" y="610.6" text-anchor="middle">모두 같은 결과를 내야 한다</text>
  <text class="name" x="280" y="676" text-anchor="middle">버튼 숨김은 편의, ④가 보안이다</text>
  <rect class="focal" x="24" y="716" width="22" height="16" rx="3"/><text class="small" x="54" y="729">실제로 막는 곳</text><rect class="node" x="163.48000000000002" y="716" width="22" height="16" rx="3"/><text class="small" x="193.48000000000002" y="729">판정 입력</text><path class="flow" d="M272.45000000000005 724 H298.45000000000005"/><text class="small" x="306.45000000000005" y="729">통과하면 다음 단계</text>
</svg>
