<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="mis-00-ai-ready-content-title mis-00-ai-ready-content-desc">
  <title id="mis-00-ai-ready-content-title">AI가 사용할 수 있는 콘텐츠의 준비 과정</title>
  <desc id="mis-00-ai-ready-content-desc">원본 콘텐츠에 분류와 설명을 더하고 출처와 권한을 관리한 뒤 통합 저장소를 통해 검색과 AI에 제공하는 과정</desc>
  <defs><marker id="mis-00-ai-ready-content-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1}.flow{stroke:#65645e;stroke-width:2;fill:none;marker-end:url(#mis-00-ai-ready-content-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.inverse{fill:#f7f6f2}.step{font:600 10px 'JetBrains Mono',monospace;fill:#65645e;letter-spacing:.08em}</style>
  <rect class="bg" width="1280" height="680"/><text class="tag" x="64" y="52">LECTURE 00 · CONTENT PIPELINE</text><text class="title" x="64" y="92">저장된 문서가 곧바로 AI-ready knowledge는 아니다</text><text class="subtitle" x="64" y="122">분류·설명·출처·권한이 함께 있어야 검색과 생성에 신뢰할 수 있게 연결된다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
  <path class="flow" d="M264 352 H312"/><path class="flow" d="M544 352 H592"/><path class="flow" d="M824 352 H872"/><path class="flow" d="M1064 352 H1112"/>
  <g><rect class="node" x="64" y="280" width="200" height="144" rx="6"/><text class="step" x="88" y="308">01 · CONTENT</text><text class="name" x="88" y="344">원본 콘텐츠</text><text class="sub" x="88" y="372">문서 · 영상 · 대화</text><text class="sub" x="88" y="396">업무 기록</text></g>
  <g><rect class="zone" x="312" y="256" width="232" height="192" rx="6"/><text class="step" x="336" y="284">02 · DESCRIBE</text><text class="name" x="336" y="320">찾을 수 있게 설명</text><text class="sub" x="336" y="352">Taxonomy</text><text class="sub" x="336" y="380">Tagging</text><text class="sub" x="336" y="408">Metadata</text></g>
  <g><rect class="zone" x="592" y="256" width="232" height="192" rx="6"/><text class="step" x="616" y="284">03 · GOVERN</text><text class="name" x="616" y="320">믿을 수 있게 관리</text><text class="sub" x="616" y="352">Provenance</text><text class="sub" x="616" y="380">소유 · 접근 권한</text><text class="sub" x="616" y="408">보존 · 변경 이력</text></g>
  <g><rect class="node" x="872" y="280" width="192" height="144" rx="6"/><text class="step" x="896" y="308">04 · STORE</text><text class="name" x="896" y="344">Unified</text><text class="name" x="896" y="370">Repository</text><text class="sub" x="896" y="400">통합 저장소</text></g>
  <g><rect class="focal" x="1112" y="280" width="104" height="144" rx="6"/><text class="step inverse" x="1164" y="308" text-anchor="middle">05</text><text class="name inverse" x="1164" y="350" text-anchor="middle">AI</text><text class="sub inverse" x="1164" y="378" text-anchor="middle">Search</text><text class="sub inverse" x="1164" y="400" text-anchor="middle">RAG</text></g>
  <rect class="node" x="312" y="492" width="752" height="80" rx="6"/><text class="step" x="336" y="520">INFORMATION GOVERNANCE</text><text class="sub" x="336" y="548">모든 단계에서 품질·권한·보존 규칙을 일관되게 적용한다</text>
</svg>
