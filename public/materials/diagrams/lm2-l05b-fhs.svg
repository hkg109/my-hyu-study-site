<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 838" role="img" aria-labelledby="lm2-l05b-fhs-title lm2-l05b-fhs-desc">
  <title id="lm2-l05b-fhs-title">FHS 디렉터리 지도</title>
  <desc id="lm2-l05b-fhs-desc">루트 디렉터리 아래를 여섯 묶음으로 나눴다. 실행 파일·라이브러리(/bin 기본 명령, /sbin 관리 명령, /lib, /usr, /opt), 설정·부팅(/etc 설정 파일, /boot 커널과 GRUB), 장치·마운트(/dev, /media 이동식, /mnt 임시), 사용자(/home, /root), 변하는 데이터(/var 로그·스풀, /tmp 1777, /srv), 가상 파일 시스템(/proc 커널·프로세스, /sys 장치, /run 실행 중 정보). 아래에 로그 /var/log, 메일 스풀 /var/spool/mail, CPU 정보 /proc/cpuinfo, 계정 /etc/passwd 위치를 적었다.</desc>
  <defs><marker id="lm2-l05b-fhs-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l05b-fhs-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l05b-fhs-a)}.flow.both{marker-start:url(#lm2-l05b-fhs-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l05b-fhs-m)}.dash.both{marker-start:url(#lm2-l05b-fhs-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="838"/>
  <text class="tag" x="24" y="40">리눅스마스터 2급 · 2과목 1장</text><text class="title" x="24" y="74">FHS 디렉터리 지도</text><text class="subtitle" x="24" y="104">루트(/) 아래를 용도별 여섯 묶음으로</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="focal" x="230" y="150" width="100" height="40" rx="6"/><text class="big inv" x="280" y="177" text-anchor="middle">/</text><path class="org" d="M280 190 V208 M148 208 H412 M148 208 V224 M412 208 V224"/><rect class="zone" x="24" y="224" width="248" height="202" rx="6"/><text class="lab" x="38" y="247">실행 파일·라이브러리</text><rect class="node" x="34" y="258" width="228" height="26" rx="4"/><text class="mono" x="46" y="276">/bin</text><text class="task" x="250" y="276" text-anchor="end">기본 명령</text><rect class="node" x="34" y="290" width="228" height="26" rx="4"/><text class="mono" x="46" y="308">/sbin</text><text class="task" x="250" y="308" text-anchor="end">관리 명령</text><rect class="node" x="34" y="322" width="228" height="26" rx="4"/><text class="mono" x="46" y="340">/lib</text><text class="task" x="250" y="340" text-anchor="end">라이브러리·모듈</text><rect class="node" x="34" y="354" width="228" height="26" rx="4"/><text class="mono" x="46" y="372">/usr</text><text class="task" x="250" y="372" text-anchor="end">프로그램·문서</text><rect class="node" x="34" y="386" width="228" height="26" rx="4"/><text class="mono" x="46" y="404">/opt</text><text class="task" x="250" y="404" text-anchor="end">추가 응용</text><rect class="zone" x="288" y="224" width="248" height="106" rx="6"/><text class="lab" x="302" y="247">설정·부팅</text><rect class="node" x="298" y="258" width="228" height="26" rx="4"/><text class="mono" x="310" y="276">/etc</text><text class="task" x="514" y="276" text-anchor="end">설정 파일</text><rect class="node" x="298" y="290" width="228" height="26" rx="4"/><text class="mono" x="310" y="308">/boot</text><text class="task" x="514" y="308" text-anchor="end">커널·GRUB</text><rect class="zone" x="24" y="440" width="248" height="138" rx="6"/><text class="lab" x="38" y="463">장치·마운트</text><rect class="node" x="34" y="474" width="228" height="26" rx="4"/><text class="mono" x="46" y="492">/dev</text><text class="task" x="250" y="492" text-anchor="end">장치 파일</text><rect class="node" x="34" y="506" width="228" height="26" rx="4"/><text class="mono" x="46" y="524">/media</text><text class="task" x="250" y="524" text-anchor="end">이동식 자동</text><rect class="node" x="34" y="538" width="228" height="26" rx="4"/><text class="mono" x="46" y="556">/mnt</text><text class="task" x="250" y="556" text-anchor="end">임시 마운트</text><rect class="zone" x="24" y="592" width="248" height="106" rx="6"/><text class="lab" x="38" y="615">사용자</text><rect class="node" x="34" y="626" width="228" height="26" rx="4"/><text class="mono" x="46" y="644">/home</text><text class="task" x="250" y="644" text-anchor="end">일반 사용자</text><rect class="node" x="34" y="658" width="228" height="26" rx="4"/><text class="mono" x="46" y="676">/root</text><text class="task" x="250" y="676" text-anchor="end">root의 홈</text><rect class="zone" x="288" y="344" width="248" height="138" rx="6"/><text class="lab" x="302" y="367">변하는 데이터</text><rect class="node" x="298" y="378" width="228" height="26" rx="4"/><text class="mono" x="310" y="396">/var</text><text class="task" x="514" y="396" text-anchor="end">로그·스풀·캐시</text><rect class="node" x="298" y="410" width="228" height="26" rx="4"/><text class="mono" x="310" y="428">/tmp</text><text class="task" x="514" y="428" text-anchor="end">임시 · 1777</text><rect class="node" x="298" y="442" width="228" height="26" rx="4"/><text class="mono" x="310" y="460">/srv</text><text class="task" x="514" y="460" text-anchor="end">서비스 데이터</text><rect class="outside" x="288" y="496" width="248" height="138" rx="6"/><text class="lab" x="302" y="519">가상 파일 시스템</text><rect class="node" x="298" y="530" width="228" height="26" rx="4"/><text class="mono" x="310" y="548">/proc</text><text class="task" x="514" y="548" text-anchor="end">커널·프로세스</text><rect class="node" x="298" y="562" width="228" height="26" rx="4"/><text class="mono" x="310" y="580">/sys</text><text class="task" x="514" y="580" text-anchor="end">장치·드라이버</text><rect class="node" x="298" y="594" width="228" height="26" rx="4"/><text class="mono" x="310" y="612">/run</text><text class="task" x="514" y="612" text-anchor="end">실행 중 정보</text><rect class="deep" x="24" y="720" width="512" height="64" rx="6"/><text class="lab" x="40" y="746">자주 묻는 위치: 로그 /var/log · 메일 스풀 /var/spool/mail</text><text class="task" x="40" y="770">CPU 정보 /proc/cpuinfo · 사용자 계정 /etc/passwd</text><rect class="focal" x="24" y="802" width="22" height="16" rx="3"/><text class="small" x="54" y="815">루트</text><rect class="zone" x="99" y="802" width="22" height="16" rx="3"/><text class="small" x="129" y="815">디스크에 있는 묶음</text><rect class="outside" x="263.64" y="802" width="22" height="16" rx="3"/><text class="small" x="293.64" y="815">메모리 위 가상 파일 시스템</text>
</svg>
