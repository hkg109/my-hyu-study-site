  <title id="cpg-07b-suggestion-visibility-title">건의는 누가 무엇을 보나</title>
  <desc id="cpg-07b-suggestion-visibility-desc">건의 내용과 상태, 공개 답변, 내부 메모, 작성자 신원의 네 항목을 작성자, 처리 담당 국원과 국장, 회장단이 각각 볼 수 있는지 표시한 격자이며, 처리 담당자는 작성자 신원을 볼 수 없고 작성자는 내부 메모를 볼 수 없다.</desc>
