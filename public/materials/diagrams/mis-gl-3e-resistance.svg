<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 581" role="img" aria-labelledby="mis-gl-3e-resistance-title mis-gl-3e-resistance-desc">
  <title id="mis-gl-3e-resistance-title">변화 저항의 네 요소</title>
  <desc id="mis-gl-3e-resistance-desc">가운데 정보시스템 혁신에 대한 조직 저항을 두고 위에 정보기술, 아래에 사람, 왼쪽에 조직 구조, 오른쪽에 직무가 놓여 서로 묶여 있는 그림. 네 요소를 동시에 조정해야 저항이 줄어든다</desc>
  <defs><marker id="mis-gl-3e-resistance-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-3e-resistance-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-3e-resistance-a)}.flow.both{marker-start:url(#mis-gl-3e-resistance-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-3e-resistance-m)}.dash.both{marker-start:url(#mis-gl-3e-resistance-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="581"/>
  <text class="tag" x="24" y="40">3장 · 3-3 IT가 조직에 미치는 영향 ②</text><text class="title" x="24" y="74">변화 저항의 네 요소</text><text class="subtitle" x="24" y="104">Figure 3.7 · 기술만 바꾸면 나머지 셋이 원래 방식으로 끌어당긴다. 넷을</text><text class="subtitle" x="24" y="124">동시에 조정해야 한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="170" y="172" width="220" height="71.5" rx="6"/><text class="name" x="280" y="200" text-anchor="middle">정보기술</text><text class="body" x="280" y="227" text-anchor="middle">새 시스템·화면</text><rect class="node" x="170" y="435.5" width="220" height="71.5" rx="6"/><text class="name" x="280" y="463.5" text-anchor="middle">사람</text><text class="body" x="280" y="490.5" text-anchor="middle">역량·교육·태도</text><rect class="node" x="24" y="293.5" width="138" height="92" rx="6"/><text class="name" x="93" y="331.75" text-anchor="middle">조직 구조</text><text class="body" x="93" y="358.75" text-anchor="middle">권한·보고 체계</text><rect class="node" x="398" y="293.5" width="138" height="92" rx="6"/><text class="name" x="467" y="331.75" text-anchor="middle">직무</text><text class="body" x="467" y="358.75" text-anchor="middle">업무 순서·역할</text><rect class="focal" x="205" y="293.5" width="150" height="92" rx="6"/><text class="name inv" x="280" y="321.5" text-anchor="middle">변화 저항</text><text class="body inv" x="280" y="348.5" text-anchor="middle">Resistance to</text><text class="body inv" x="280" y="369" text-anchor="middle">IS innovation</text><path class="flow both" d="M280 243.5 L280 293.5"/><rect class="mask" x="241.9" y="257.5" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="273.5" text-anchor="middle">동시 조정</text><path class="flow both" d="M280 385.5 L280 435.5"/><path class="flow both" d="M162 339.5 L205 339.5"/><path class="flow both" d="M355 339.5 L398 339.5"/><path class="flow" d="M24 537 H54"/><text class="small" x="62" y="542">흐름·데이터 제공</text><path class="flow both" d="M193.94875000000002 537 H221.94875000000002"/><text class="small" x="229.94875000000002" y="542">상호 영향</text><rect class="focal" x="310.06225" y="529" width="22" height="16" rx="3"/><text class="small" x="340.06225" y="542">중심 개념</text>
