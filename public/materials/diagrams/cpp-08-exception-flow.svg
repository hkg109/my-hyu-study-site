<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="cpp-08-exception-flow-title cpp-08-exception-flow-desc">
  <title id="cpp-08-exception-flow-title">throw는 맞는 catch를 찾을 때까지 위로 올라간다</title>
  <desc id="cpp-08-exception-flow-desc">main이 foo를, foo가 foo_1을 호출한 상태에서 foo_1이 throw 1을 하면 foo_1에는 try가 없어 즉시 빠져나가고, foo의 try에 딸린 catch(int)가 받아 처리한 뒤 catch 다음 문장으로 이어지며, 맞는 catch가 끝까지 없으면 기본 처리기가 프로그램을 끝낸다는 흐름</desc>
  <defs>
    <marker id="cpp-08-exception-flow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-08-exception-flow-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-08-exception-flow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="500" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">08 · 예외 처리</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">throw는 맞는 catch를 찾을 때까지 위로 올라간다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <path d="M200 176 L200 212" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-08-exception-flow-m)"/><path d="M200 268 L200 304" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-08-exception-flow-m)"/><path d="M376 332 L424 332 Q432 332 432 324 L432 248 Q432 240 424 240 L376 240" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-08-exception-flow-a)"/><rect x="466" y="276" width="76" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="504" y="290.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">catch 없음</text><rect x="56" y="120" width="320" height="56" rx="6" fill="#f7f6f2"/><rect x="56" y="120" width="320" height="56" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="216" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">main()</text><text x="216" y="164" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">foo() 호출</text><rect x="56" y="212" width="320" height="56" rx="6" fill="#f7f6f2"/><rect x="56" y="212" width="320" height="56" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><text x="216" y="235.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#f7f6f2" text-anchor="middle">foo()  try { foo_1(); }</text><text x="216" y="255.5" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#d9d6cc" text-anchor="middle">catch (int i) 가 받음</text><rect x="56" y="304" width="320" height="56" rx="6" fill="#f7f6f2"/><rect x="56" y="304" width="320" height="56" rx="6" fill="#f3e3dc" stroke="#a8431f" stroke-width="1.5"/><text x="216" y="327.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">foo_1()  throw 1;</text><text x="216" y="347.5" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">try 없음 → 즉시 빠져나감</text><text x="56" y="400" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">처리 후에는 catch 블록 다음 문장으로 간다 (throw 지점으로 돌아가지 않음).</text><text x="56" y="424" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#65645e">catch는 자료형이 정확히 맞아야 받는다. 끝까지 없으면 기본 처리기가 종료시킨다.</text>
  <line x1="32" y1="452" x2="688" y2="452" stroke="#b9b6ac"/><path d="M32 474 H60" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-08-exception-flow-m)"/><text x="68" y="479" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">호출</text><path d="M120 474 H148" stroke="#a8431f" stroke-width="1.8" marker-end="url(#cpp-08-exception-flow-a)"/><text x="156" y="479" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">예외 전파</text><rect x="239.84" y="466" width="20" height="16" rx="3" fill="#1d1d1a"/><text x="271.84000000000003" y="479" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">처리하는 catch</text>
</svg>
