<title id="adsp-50-activations-title">활성화 함수의 출력 범위</title><desc id="adsp-50-activations-desc">시그모이드, tanh, ReLU의 실제 함수 곡선. 시그모이드는 0과 1 사이, tanh는 마이너스 1과 1 사이, ReLU는 0 이상의 값을 출력한다. 그래프마다 세로축 눈금이 다르다.</desc>
