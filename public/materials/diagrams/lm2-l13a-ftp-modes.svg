<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 716" width="560" height="716" role="img" aria-labelledby="lm2-l13a-ftp-modes-title lm2-l13a-ftp-modes-desc">
  <title id="lm2-l13a-ftp-modes-title">FTP 능동 모드와 수동 모드</title>
  <desc id="lm2-l13a-ftp-modes-desc">위쪽 능동 모드에서는 클라이언트가 포트 1025에서 서버 21번으로 제어 연결을 열고 PORT 1026을 알려 주면, 서버가 20번 포트에서 클라이언트 1026번으로 데이터 연결을 연다. 아래쪽 수동 모드에서는 제어 연결은 같고, 클라이언트가 PASV를 보내면 서버가 임의 포트 50000을 알려 주고 클라이언트가 그 포트로 데이터 연결을 연다.</desc>
  <defs><marker id="lm2-l13a-ftp-modes-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l13a-ftp-modes-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l13a-ftp-modes-a)}.flow.both{marker-start:url(#lm2-l13a-ftp-modes-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l13a-ftp-modes-m)}.dash.both{marker-start:url(#lm2-l13a-ftp-modes-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="716"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 3과목 2장</text><text class="title" x="24" y="74">FTP 능동 모드 vs 수동 모드</text><text class="subtitle" x="24" y="104">두 모드의 차이는 단 하나 — 데이터 연결을 누가 여는가</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="zone" x="16" y="150" width="528" height="250" rx="6"/><text class="name" x="28" y="174">능동 모드 (Active)</text><text class="small" x="28" y="196">데이터 연결: 서버 20번 → 클라이언트 · 클라이언트 방화벽에 막히기 쉽다</text><rect class="node" x="24" y="214" width="150" height="168" rx="6"/><text class="name" x="99" y="242" text-anchor="middle">클라이언트</text><text class="lab" x="99" y="282" text-anchor="middle">포트 1025</text><text class="lab" x="99" y="352" text-anchor="middle">포트 1026</text><rect class="focal" x="386" y="214" width="150" height="168" rx="6"/><text class="name inv" x="461" y="242" text-anchor="middle">FTP 서버</text><text class="lab inv" x="461" y="282" text-anchor="middle">포트 21 (제어)</text><text class="lab inv" x="461" y="352" text-anchor="middle">포트 20 (데이터)</text><path class="flow" d="M174 277 L386 277"/><rect class="mask" x="205.0" y="248" width="150.0" height="22" rx="4"/><text class="lab" x="280" y="264" text-anchor="middle">① 제어 연결 · 명령</text><rect class="mask" x="230.0" y="286" width="100.0" height="22" rx="4"/><text class="lab" x="280" y="302" text-anchor="middle">PORT 1026</text><path class="flow" d="M386 347 L174 347"/><rect class="mask" x="180.0" y="318" width="200.0" height="22" rx="4"/><text class="lab" x="280" y="334" text-anchor="middle">② 서버가 데이터 연결을 엶</text><rect class="zone" x="16" y="416" width="528" height="250" rx="6"/><text class="name" x="28" y="440">수동 모드 (Passive)</text><text class="small" x="28" y="462">데이터 연결: 클라이언트 → 서버의 임의 높은 포트 · 방화벽·NAT에 유리</text><rect class="node" x="24" y="480" width="150" height="168" rx="6"/><text class="name" x="99" y="508" text-anchor="middle">클라이언트</text><text class="lab" x="99" y="548" text-anchor="middle">포트 1025</text><text class="lab" x="99" y="618" text-anchor="middle">포트 1026</text><rect class="focal" x="386" y="480" width="150" height="168" rx="6"/><text class="name inv" x="461" y="508" text-anchor="middle">FTP 서버</text><text class="lab inv" x="461" y="548" text-anchor="middle">포트 21 (제어)</text><text class="lab inv" x="461" y="618" text-anchor="middle">포트 50000 (임의)</text><path class="flow" d="M174 543 L386 543"/><rect class="mask" x="205.0" y="514" width="150.0" height="22" rx="4"/><text class="lab" x="280" y="530" text-anchor="middle">① 제어 연결 · 명령</text><rect class="mask" x="195.0" y="552" width="170.0" height="22" rx="4"/><text class="lab" x="280" y="568" text-anchor="middle">PASV → 50000 알려 줌</text><path class="flow" d="M174 613 L386 613"/><rect class="mask" x="167.0" y="584" width="226.0" height="22" rx="4"/><text class="lab" x="280" y="600" text-anchor="middle">② 클라이언트가 데이터 연결을 엶</text><text class="small" x="24" y="694">제어 연결은 두 모드 모두 클라이언트 → 서버 21번이다</text>
</svg>
