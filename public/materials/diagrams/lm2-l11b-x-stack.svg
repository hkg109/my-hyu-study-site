<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" width="560" height="800" role="img" aria-labelledby="lm2-l11b-x-stack-title lm2-l11b-x-stack-desc">
  <title id="lm2-l11b-x-stack-title">X 윈도우 GUI의 층 구조</title>
  <desc id="lm2-l11b-x-stack-desc">아래부터 하드웨어, X 서버 Xorg, 툴킷 GTK+·Qt와 Xlib, 윈도우 매니저 Mutter·KWin·Xfwm, 데스크톱 환경 GNOME·KDE·Xfce, 응용 프로그램이 쌓여 있다. 오른쪽 디스플레이 매니저(xdm, gdm, sddm, lightdm)가 먼저 X 서버를 실행하고, 로그인 뒤 데스크톱 세션을 시작한다. 아래 상자는 GNOME은 GTK+·Mutter·GDM, KDE는 Qt·KWin·SDDM, Xfce는 GTK+·Xfwm·LightDM으로 같은 가족을 묶었다.</desc>
  <defs><marker id="lm2-l11b-x-stack-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l11b-x-stack-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l11b-x-stack-a)}.flow.both{marker-start:url(#lm2-l11b-x-stack-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l11b-x-stack-m)}.dash.both{marker-start:url(#lm2-l11b-x-stack-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="800"/>
  <text class="tag" x="24" y="40">리눅스마스터 2급 · 3과목 1장</text><text class="title" x="24" y="74">X 윈도우 GUI의 층</text><text class="subtitle" x="24" y="104">X 서버는 그리기, 윈도우 매니저는 창 관리, 데스크톱 환경은 묶음</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="node" x="24" y="154" width="340" height="62" rx="6"/><text class="name" x="194.0" y="181.0" text-anchor="middle">응용 프로그램</text><text class="small" x="194.0" y="201.0" text-anchor="middle">Firefox · GIMP · LibreOffice</text><rect class="zone" x="24" y="226" width="340" height="62" rx="6"/><text class="name" x="194.0" y="253.0" text-anchor="middle">데스크톱 환경</text><text class="small" x="194.0" y="273.0" text-anchor="middle">GNOME · KDE Plasma · Xfce</text><rect class="zone" x="24" y="298" width="340" height="62" rx="6"/><text class="name" x="194.0" y="325.0" text-anchor="middle">윈도우 매니저</text><text class="small" x="194.0" y="345.0" text-anchor="middle">Mutter · KWin · Xfwm · twm</text><rect class="deep" x="24" y="370" width="340" height="62" rx="6"/><text class="name" x="194.0" y="397.0" text-anchor="middle">툴킷 · 라이브러리</text><text class="small" x="194.0" y="417.0" text-anchor="middle">GTK+ · Qt  /  Xlib · XCB</text><rect class="focal" x="24" y="442" width="340" height="62" rx="6"/><text class="name inv" x="194.0" y="469.0" text-anchor="middle">X 서버</text><text class="small inv" x="194.0" y="489.0" text-anchor="middle">Xorg — 화면·입력 관리</text><rect class="outside" x="24" y="514" width="340" height="62" rx="6"/><text class="name" x="194.0" y="541.0" text-anchor="middle">하드웨어</text><text class="small" x="194.0" y="561.0" text-anchor="middle">그래픽 카드 · 모니터 · 키보드 · 마우스</text><rect class="deep" x="404" y="226" width="132" height="278" rx="6"/><text class="lab" x="470" y="304" text-anchor="middle">디스플레이</text><text class="lab" x="470" y="324" text-anchor="middle">매니저</text><text class="body" x="470" y="356" text-anchor="middle">xdm · gdm</text><text class="body" x="470" y="378" text-anchor="middle">kdm · sddm</text><text c