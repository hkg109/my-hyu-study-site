<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1286" role="img" aria-labelledby="adsp-l07a-test-chooser-title adsp-l07a-test-chooser-desc">
  <title id="adsp-l07a-test-chooser-title">상황으로 검정 고르기</title>
  <desc id="adsp-l07a-test-chooser-desc">출발 질문에서 세 갈래로 나뉜다. 평균 비교는 한 집단 대 기준값이면 일표본 t검정, 같은 대상 전후면 대응표본 t검정, 서로 다른 두 집단이면 독립표본 t검정, 세 집단 이상이면 분산분석. 범주별 빈도는 교차분석으로 변수 1개면 적합도, 2개면 독립성, 여러 모집단이면 동질성 검정. 두 연속 변수의 관계는 강도면 상관분석, 설명·예측이면 회귀분석.</desc>
  <defs><marker id="adsp-l07a-test-chooser-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l07a-test-chooser-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l07a-test-chooser-a)}.flow.both{marker-start:url(#adsp-l07a-test-chooser-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l07a-test-chooser-m)}.dash.both{marker-start:url(#adsp-l07a-test-chooser-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1286"/>
  <style>.ax{stroke:#1d1d1a;stroke-width:1.5;fill:none}.grid{stroke:#b9b6ac;stroke-width:1;stroke-dasharray:3 4;fill:none}.cv{stroke:#1d1d1a;stroke-width:2.2;fill:none}.cvm{stroke:#65645e;stroke-width:2;fill:none;stroke-dasharray:7 5}.dot{fill:#1d1d1a}.dotm{fill:#65645e}.dotl{fill:#f7f6f2;stroke:#1d1d1a;stroke-width:1.5}.shd{fill:#1d1d1a}.shl{fill:#c9c5b9}.shs{fill:#e4e1d8}.ln{stroke:#1d1d1a;stroke-width:1.6;fill:none}.lnm{stroke:#65645e;stroke-width:1.4;fill:none}.lnd{stroke:#1d1d1a;stroke-width:1.6;stroke-dasharray:6 4;fill:none}.lnt{stroke:#1d1d1a;stroke-width:2;stroke-dasharray:2 3;fill:none}.thick{stroke:#1d1d1a;stroke-width:3;fill:none}.tick{font:400 12.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.bodyb{font:700 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 19px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style><text class="tag" x="24" y="40">ADsP · 3과목 2장 02 · 기초통계</text><text class="title" x="24" y="74">상황으로 검정 고르기</text><text class="subtitle" x="24" y="104">무엇을 비교하는지 먼저 정하고, 집단·변수의 수로 좁힌다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="focal" x="24" y="152" width="512" height="63" rx="6"/><text class="small inv" x="280" y="178" text-anchor="middle">출발 질문</text><text class="name inv" x="280" y="199" text-anchor="middle">무엇을 비교·설명하나?</text><rect class="zone" x="56" y="241" width="480" height="402.5" rx="8"/><text class="small" x="68" y="261">A · 평균 비교 — y가 연속형</text><text class="small" x="68" y="283">상황</text><text class="small" x="276" y="283">쓰는 검정</text><rect class="node" x="68" y="293" width="168" height="71.5" rx="6"/><text class="name" x="152" y="322.75" text-anchor="middle">한 집단 vs</text><text class="name" x="152" y="345.75" text-anchor="middle">기준값</text><rect class="node" x="276" y="293" width="248" height="71.5" rx="6"/><text class="name" x="400" y="321" text-anchor="middle">일표본 t검정</text><text class="body" x="400" y="348" text-anchor="middle">df = n - 1</text><path class="flow" d="M236 328.75 L276 328.75"/><rect class="node" x="68" y="374.5" width="168" height="71.5" rx="6"/><text class="name" x="152" y="404.25" text-anchor="middle">같은 대상의</text><text class="name" x="152" y="427.25" text-anchor="middle">전·후</text><rect class="node" x="276" y="374.5" width="248" height="71.5" rx="6"/><text class="name" x="400" y="402.5" text-anchor="middle">대응표본 t검정</text><text class="body" x="400" y="429.5" text-anchor="middle">df = 쌍의 수 - 1</text><path class="flow" d="M236 410.25 L276 410.25"/><rect class="node" x="68" y="456" width="168" height="92" rx="6"/><text class="name" x="152" y="496" text-anchor="middle">서로 다른 두</text><text class="name" x="152" y="519" text-anchor="middle">집단</text><rect class="node" x="276" y="456" width="248" height="92" rx="6"/><text class="name" x="400" y="484" text-anchor="middle">독립표본 t검정</text><text class="body" x="400" y="511" text-anchor="middle">df = n1 + n2 - 2</text><text class="body" x="400" y="531.5" text-anchor="middle">먼저 F검정으로 등분산 확인</text><path class="flow" d="M236 502 L276 502"/><rect class="node" x="68" y="558" width="168" height="71.5" rx="6"/><text class="name" x="152" y="599.25" text-anchor="middle">세 집단 이상</text><rect class="node" x="276" y="558" width="248" height="71.5" rx="6"/><text class="name" x="400" y="586" text-anchor="middle">분산분석 ANOVA (F)</text><text class="body" x="400" y="613" text-anchor="middle">다르면 사후검정 (Tukey 등)</text><path class="flow" d="M236 593.75 L276 593.75"/><rect class="zone" x="56" y="661.5" width="480" height="300.5" rx="8"/><text class="small" x="68" y="681.5">B · 범주별 빈도 — 교차분석 (χ²)</text><text class="small" x="68" y="703.5">상황</text><text class="small" x="276" y="703.5">쓰는 검정</text><rect class="node" x="68" y="713.5" width="168" height="71.5" rx="6"/><text class="name" x="152" y="741.5" text-anchor="middle">범주형 변수 1개</text><text class="body" x="152" y="768.5" text-anchor="middle">기대 비율과 같은가</text><rect class="node" x="276" y="713.5" width="248" height="71.5" rx="6"/><text class="name" x="400" y="754.75" text-anchor="middle">적합도 검정</text><path class="flow" d="M236 749.25 L276 749.25"/><rect class="node" x="68" y="795" width="168" height="71.5" rx="6"/><text class="name" x="152" y="823" text-anchor="middle">범주형 변수 2개</text><text class="body" x="152" y="850" text-anchor="middle">서로 관련 있는가</text><rect class="node" x="276" y="795" width="248" height="71.5" rx="6"/><text class="name" x="400" y="836.25" text-anchor="middle">독립성 검정</text><path class="flow" d="M236 830.75 L276 830.75"/><rect class="node" x="68" y="876.5" width="168" height="71.5" rx="6"/><text class="name" x="152" y="904.5" text-anchor="middle">여러 모집단</text><text class="body" x="152" y="931.5" text-anchor="middle">범주 비율이 같은가</text><rect class="node" x="276" y="876.5" width="248" height="71.5" rx="6"/><text class="name" x="400" y="917.75" text-anchor="middle">동질성 검정</text><path class="flow" d="M236 912.25 L276 912.25"/><rect class="zone" x="56" y="980" width="480" height="239.5" rx="8"/><text class="small" x="68" y="1000">C · 두 연속 변수의 관계</text><text class="small" x="68" y="1022">상황</text><text class="small" x="276" y="1022">쓰는 검정</text><rect class="node" x="68" y="1032" width="168" height="92" rx="6"/><text class="name" x="152" y="1072" text-anchor="middle">관계의</text><text class="name" x="152" y="1095" text-anchor="middle">강도·방향</text><rect class="node" x="276" y="1032" width="248" height="92" rx="6"/><text class="name" x="400" y="1060" text-anchor="middle">상관분석</text><text class="body" x="400" y="1087" text-anchor="middle">피어슨: 선형 · 연속형</text><text class="body" x="400" y="1107.5" text-anchor="middle">스피어만: 순위 · 비모수</text><path class="flow" d="M236 1078 L276 1078"/><rect class="node" x="68" y="1134" width="168" height="71.5" rx="6"/><text class="name" x="152" y="1163.75" text-anchor="middle">y를 x로</text><text class="name" x="152" y="1186.75" text-anchor="middle">설명·예측</text><rect class="node" x="276" y="1134" width="248" height="71.5" rx="6"/><text class="name" x="400" y="1162" text-anchor="middle">회귀분석</text><text class="body" x="400" y="1189" text-anchor="middle">최소제곱법 (OLS)</text><path class="flow" d="M236 1169.75 L276 1169.75"/><path class="line" d="M36 215 V995"/><path class="flow" d="M36 256 L56 256"/><path class="flow" d="M36 676.5 L56 676.5"/><path class="flow" d="M36 995 L56 995"/><text class="small" x="24" y="1241.5">t검정·ANOVA는 정규성 가정 · 기대빈도 5 미만인 칸이 많으면 피셔 검정</text><text class="small" x="24" y="1261.5">세 집단 이상에 t검정을 반복하면 1종 오류가 누적된다</text>
</svg>
