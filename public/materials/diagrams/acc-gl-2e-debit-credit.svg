<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 880" role="img" aria-labelledby="acc-gl-2e-debit-credit-title acc-gl-2e-debit-credit-desc">
  <title id="acc-gl-2e-debit-credit-title">차변과 대변 · 어느 쪽에 적나</title>
  <desc id="acc-gl-2e-debit-credit-desc">차변은 왼쪽, 대변은 오른쪽이다. 재무상태표에서는 자산을 차변에, 부채와 자본을 대변에 적고, 포괄손익계산서에서는 비용을 차변에, 수익을 대변에 적는다. 슬라이드의 Debits and credits 표에 따르면 차변은 자산의 기록·증가, 부채의 감소, 비용의 기록·증가, 수익의 감소를 나타내고, 대변은 부채의 기록·증가, 자산의 감소, 수익의 기록·증가, 비용의 감소를 나타낸다. 차변과 대변이라는 말은 고대 로마의 수탁책임에서 유래했지만 오늘날에는 단순히 왼쪽과 오른쪽을 구분하는 말이다.</desc>
  <defs><marker id="acc-gl-2e-debit-credit-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-2e-debit-credit-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-2e-debit-credit-a)}.flow.both{marker-start:url(#acc-gl-2e-debit-credit-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-2e-debit-credit-m)}.dash.both{marker-start:url(#acc-gl-2e-debit-credit-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#b9b6ac;stroke-width:1.2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="880"/>
  <text class="tag" x="24" y="40">2장 · 2-3 회계등식과 차변·대변</text><text class="title" x="24" y="74">차변과 대변 · 어느 쪽에 적나</text><text class="subtitle" x="24" y="104">차변 = 왼쪽(Debit), 대변 = 오른쪽(Credit). 위치가 정해지면 증가·감소 방향도</text><text class="subtitle" x="24" y="124">정해진다 (슬라이드 13–15, 28–29).</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><text class="name" x="149" y="180" text-anchor="middle">차변 · 왼쪽 · Debit</text><text class="name" x="411" y="180" text-anchor="middle">대변 · 오른쪽 · Credit</text><rect class="zone" x="16" y="198" width="528" height="230" rx="8"/><text class="small" x="28" y="220">재무상태표 (Balance sheet) · 일정 시점</text><rect class="node" x="24" y="232" width="250" height="184" rx="6"/><text class="name" x="38" y="262">자산</text><text class="body" x="38" y="294">자산의 기록</text><text class="body" x="38" y="318">기존 자산의 증가</text><text class="body" x="38" y="342">부채의 감소</text><text class="small" x="38" y="378">예: 현금 · 매출채권 · 건물</text><text class="small" x="38" y="400">자료 2-2 자산총계 20,100</text><rect class="node" x="286" y="232" width="250" height="184" rx="6"/><text class="name" x="300" y="262">부채 + 자본</text><text class="body" x="300" y="294">부채의 기록</text><text class="body" x="300" y="318">기존 부채의 증가</text><text class="body" x="300" y="342">자산의 감소</text><text class="small" x="300" y="378">예: 차입금 · 자본금 · 이익잉여금</text><text class="small" x="300" y="400">부채와 자본총계 20,100</text><rect class="zone" x="16" y="452" width="528" height="230" rx="8"/><text class="small" x="28" y="474">포괄손익계산서 (Income statement) · 일정 기간</text><rect class="node" x="24" y="486" width="250" height="184" rx="6"/><text class="name" x="38" y="516">비용</text><text class="body" x="38" y="548">비용의 기록</text><text class="body" x="38" y="572">기존 비용의 증가</text><text class="body" x="38" y="596">수익의 감소</text><text class="small" x="38" y="632">예: 매출원가 1,000 · 이자비용 200</text><text class="small" x="38" y="654">+ 당기순이익 800 = 2,000</text><rect class="node" x="286" y="486" width="250" height="184" rx="6"/><text class="name" x="300" y="516">수익</text><text class="body" x="300" y="548">수익의 기록</text><text class="body" x="300" y="572">기존 수익의 증가</text><text class="body" x="300" y="596">비용의 감소</text><text class="small" x="300" y="632">예: 매출액 2,000</text><text class="small" x="300" y="654">자료 2-3 합계 2,000</text><rect class="mask" x="268.0" y="303" width="24.0" height="22" rx="4"/><text class="lab" x="280" y="319" text-anchor="middle">=</text><rect class="mask" x="268.0" y="557" width="24.0" height="22" rx="4"/><text class="lab" x="280" y="573" text-anchor="middle">=</text><rect class="outside" x="24" y="708" width="512" height="116" rx="6"/><text class="small" x="38" y="732">차변(借邊) · 대변(貸邊)의 유래</text><text class="body" x="38" y="760">고대 로마: 노예가 주인 재산을 맡아 관리(수탁책임)</text><text class="body" x="38" y="784">맡은 재산 = 주인에게 진 빚 → 왼쪽, 주인이 빌려준 것 → 오른쪽</text><text class="lab" x="38" y="810">오늘날에는 단순히 왼쪽과 오른쪽을 구분하는 말</text><rect class="mask" x="24" y="848" width="22" height="16" rx="3"/><text class="small" x="54" y="861">= 차변 합계와 대변 합계가 같다</text><rect class="zone" x="286.0" y="848" width="22" height="16" rx="3"/><text class="small" x="316.0" y="861">재무제표</text><rect class="outside" x="392.4" y="848" width="22" height="16" rx="3"/><text class="small" x="422.4" y="861">배경 지식</text>
</svg>
