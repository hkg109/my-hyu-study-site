<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1214" role="img" aria-labelledby="acc-gl-00-concept-map-title acc-gl-00-concept-map-desc">
  <title id="acc-gl-00-concept-map-title">회계원리 다섯 장은 하나의 기록 사슬이다</title>
  <desc id="acc-gl-00-concept-map-desc">1장 기업과 회계, 2장 재무제표의 기초, 3장 거래의 기록, 4장 서비스기업의 회계순환, 5장 상기업의 회계순환을 위에서 아래로 놓고 장마다 핵심 질문과 개념 묶음을 적은 뒤, 산출물 해부·기록 규칙·기말 결산·상품 거래로 확장이라는 관계 화살표로 잇고, 4장과 5장의 순환이 다시 2장의 재무제표를 만든다는 점선 화살표를 둔 개념 지도</desc>
  <defs><marker id="acc-gl-00-concept-map-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-00-concept-map-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-00-concept-map-a)}.flow.both{marker-start:url(#acc-gl-00-concept-map-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-00-concept-map-m)}.dash.both{marker-start:url(#acc-gl-00-concept-map-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1214"/>
  <text class="tag" x="24" y="40">Chapter 1–5 · 전체 개념 지도</text><text class="title" x="24" y="74">회계원리 다섯 장은 하나의 기록 사슬이다</text><text class="subtitle" x="24" y="104">회계가 무엇인지(1장) → 결과물인 재무제표(2장) → 거래를 기록하는</text><text class="subtitle" x="24" y="124">규칙(3장) → 기말 결산까지의 순환(4장) → 상품 매매 기업으로 확장(5장)</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="24" y="172" width="448" height="153.5" rx="8"/><text class="small" x="36" y="192">1장 · 기업과 회계</text><text class="name" x="36" y="216">회계는 누구를 위해 무엇을 만들고, 왜 믿을 수</text><text class="name" x="36" y="239">있나?</text><text class="body" x="36" y="268">1-1 회계의 의의·기능(인식·측정·전달) ·</text><text class="body" x="36" y="288.5">1-2 경제실체·영업/투자/재무활동 · 1-3 이해관계자,</text><text class="body" x="36" y="309">재무회계 vs 관리회계 · 1-4 재무제표·K-IFRS·회계감사</text><rect class="zone" x="24" y="377.5" width="448" height="153.5" rx="8"/><text class="small" x="36" y="397.5">2장 · 재무제표의 기초</text><text class="name" x="36" y="421.5">재무제표는 무엇으로 이루어지고 서로 어떻게</text><text class="name" x="36" y="444.5">이어지나?</text><text class="body" x="36" y="473.5">2-1 네 가지 재무제표 + 주석 ·</text><text class="body" x="36" y="494">2-2 자산·부채·자본·수익·비용 · 2-3 회계등식, 차변·대변 ·</text><text class="body" x="36" y="514.5">2-4 재무제표의 연계 · 2-5 인식(발생기준)·측정</text><rect class="zone" x="24" y="583" width="448" height="130.5" rx="8"/><text class="small" x="36" y="603">3장 · 거래의 기록</text><text class="name" x="36" y="627">거래를 어떤 규칙으로 장부에 옮기나?</text><text class="body" x="36" y="656">3-1 회계상 거래·이중성·복식부기 ·</text><text class="body" x="36" y="676.5">3-2 결합관계(8요소)·계정 · 3-3 분개(분개장) → 전기(원장)</text><text class="body" x="36" y="697">· 3-4 시산표·오류·정정 분개</text><rect class="zone" x="24" y="765.5" width="448" height="130.5" rx="8"/><text class="small" x="36" y="785.5">4장 · 서비스기업의 회계순환</text><text class="name" x="36" y="809.5">기말에 장부를 어떻게 고쳐 재무제표를 만드나?</text><text class="body" x="36" y="838.5">4-1 회계순환과정·결산 ·</text><text class="body" x="36" y="859">4-2 결산정리(미수·미지급·선급·선수, 감가상각, 대손) ·</text><text class="body" x="36" y="879.5">4-3 수정후 시산표 → 재무제표 · 4-4 정산표</text><rect class="zone" x="24" y="948" width="448" height="153.5" rx="8"/><text class="small" x="36" y="968">5장 · 상기업의 회계순환</text><text class="name" x="36" y="992">상품을 사고파는 기업은 매출원가를 어떻게</text><text class="name" x="36" y="1015">구하나?</text><text class="body" x="36" y="1044">5-1 계속기록법 vs 실지재고조사법, 매입 계정 ·</text><text class="body" x="36" y="1064.5">5-2 매출원가 결산정리 3줄, 매출총이익 · 5-3 (주)보부상</text><text class="body" x="36" y="1085">회계순환·정산표</text><path class="flow" d="M248 325.5 L248 377.5"/><rect class="mask" x="168.8" y="340.5" width="158.5" height="22" rx="4"/><text class="lab" x="248" y="356.5" text-anchor="middle">결과물 해부: 재무제표</text><path class="flow" d="M248 531 L248 583"/><rect class="mask" x="166.2" y="546" width="163.5" height="22" rx="4"/><text class="lab" x="248" y="562" text-anchor="middle">요소·등식 → 기록 규칙</text><path class="flow" d="M248 713.5 L248 765.5"/><rect class="mask" x="167.3" y="728.5" width="161.3" height="22" rx="4"/><text class="lab" x="248" y="744.5" text-anchor="middle">기중 기록 → 기말 결산</text><path class="flow" d="M248 896 L248 948"/><rect class="mask" x="186.1" y="911" width="123.8" height="22" rx="4"/><text class="lab" x="248" y="927" text-anchor="middle">상품 거래로 확장</text><path class="dash plain" d="M472 830.75 H504"/><path class="dash" d="M472 1024.75 L504 1024.75 L504 454.25 L472 454.25"/><rect class="mask" x="482.6" y="631.5" width="42.9" height="22" rx="4"/><text class="lab" x="504" y="647.5" text-anchor="middle">산출</text><path class="flow" d="M24 1125.5 H54"/><text class="small" x="62" y="1130.5">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 1125.5 H221.94875000000002"/><text class="small" x="229.94875000000002" y="1130.5">영향·제약</text><rect class="zone" x="312.22900000000004" y="1117.5" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="1130.5">범위·묶음</text><text class="small" x="24" y="1157.5">점선 화살표: 4·5장의 회계순환이 끝나면 그 결과물이 2장에서 배운</text><text class="small" x="24" y="1175.5">재무제표다. 2장의 요소·등식이 3장 분개 규칙의 근거가 된다.</text>
</svg>
