  <rect class="bg" width="1280" height="760"/><text class="tag" x="64" y="52">2장 · Figure 2.8</text><text class="title" x="64" y="92">The Time/Space Collaboration and Social Tool Matrix</text><text class="subtitle" x="64" y="122">같은 시간인지(동기·비동기), 같은 장소인지(대면·원격)에 따라 협업 도구가 나뉜다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
