  <text class="name" x="910" y="190" text-anchor="middle">Different time · asynchronous</text>
  <text class="name" x="150" y="360" text-anchor="middle">Same place</text>
  <text class="sub" x="150" y="384" text-anchor="middle">colocated</text>
  <text class="name" x="150" y="600" text-anchor="middle">Different place</text>
  <text class="sub" x="150" y="624" text-anchor="middle">remote</text>
