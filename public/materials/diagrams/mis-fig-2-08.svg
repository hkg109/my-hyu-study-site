  <text class="name" x="470" y="280" text-anchor="middle">Face-to-face interactions</text><text class="sub" x="470" y="310" text-anchor="middle">decision rooms, single display groupware,</text><text class="sub" x="470" y="332" text-anchor="middle">shared table, wall displays, roomware</text>
  <text class="name" x="910" y="280" text-anchor="middle">Continuous task</text><text class="sub" x="910" y="310" text-anchor="middle">team rooms, large public display,</text><text class="sub" x="910" y="332" text-anchor="middle">shift work groupware, project management</text>
  <text class="name" x="470" y="560" text-anchor="middle">Remote interactions</text><text class="sub" x="470" y="590" text-anchor="middle">video conferencing, instant messaging,</text><text class="sub" x="470" y="612" text-anchor="middle">virtual worlds, shared screens, multi-user editors</text>
  <text class="name" x="910" y="560" text-anchor="middle">Communication + coordination</text><text class="sub" x="910" y="590" text-anchor="middle">e-mail, bulletin boards, blogs, group calendars,</text><text class="sub" x="910" y="612" text-anchor="middle">workflow, version control, wikis</text>
