<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 958" role="img" aria-labelledby="acc-gl-3c-recording-flow-title acc-gl-3c-recording-flow-desc">
  <title id="acc-gl-3c-recording-flow-title">거래의 기록 흐름</title>
  <desc id="acc-gl-3c-recording-flow-desc">사건이 발생하면 회계상 거래인지 판단하고, 거래이면 분개장에 분개하고, 원장에 전기한 뒤 수정전 시산표로 대차 합계를 검증하는 흐름도. 오른쪽에는 거래가 아니면 기록하지 않음, 전표가 분개장 기능을 대신함, 분개장 원면과 원장 분면의 상호 대조, 시산표 불일치 시 오류 정정이 붙어 있고, 맨 아래 점선으로 결산정리 후 수정후 시산표와 재무제표로 이어진다</desc>
  <defs><marker id="acc-gl-3c-recording-flow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-3c-recording-flow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-3c-recording-flow-a)}.flow.both{marker-start:url(#acc-gl-3c-recording-flow-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-3c-recording-flow-m)}.dash.both{marker-start:url(#acc-gl-3c-recording-flow-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="958"/>
  <text class="tag" x="24" y="40">3장 · 3-3 분개 · 전기 · 시산표</text><text class="title" x="24" y="74">거래의 기록 흐름</text><text class="subtitle" x="24" y="104">거래 판단 → 분개 → 전기 → 수정전 시산표. 일자별 기록은 분개장,</text><text class="subtitle" x="24" y="124">계정별 기록은 원장, 검증은 시산표가 맡는다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="outside" x="24" y="170" width="292" height="72" rx="6"/><text class="small" x="170.0" y="199.8" text-anchor="middle">사건 발생</text><text class="body" x="170.0" y="221.5" text-anchor="middle">주문 · 채용 약속 · 차입 · 화재 …</text><rect class="node" x="24" y="294" width="292" height="72" rx="6"/><text class="name" x="170.0" y="325.8" text-anchor="middle">회계상 거래인가?</text><text class="body" x="170.0" y="347.5" text-anchor="middle">재무제표 요소·항목이 변하나</text><rect class="node" x="24" y="418" width="292" height="72" rx="6"/><text class="name" x="170.0" y="449.8" text-anchor="middle">분개 · 분개장</text><text class="body" x="170.0" y="471.5" text-anchor="middle">일자순 · 차변/대변 · 계정 · 금액</text><rect class="node" x="24" y="542" width="292" height="72" rx="6"/><text class="name" x="170.0" y="573.8" text-anchor="middle">원장 · 총계정원장</text><text class="body" x="170.0" y="595.5" text-anchor="middle">계정별 · 자산→부채→자본→수익→비용</text><rect class="focal" x="24" y="666" width="292" height="72" rx="6"/><text class="name inv" x="170.0" y="697.8" text-anchor="middle">수정전 시산표</text><text class="body inv" x="170.0" y="719.5" text-anchor="middle">차변 합계 = 대변 합계 ?</text><rect class="outside" x="24" y="790" width="292" height="72" rx="6"/><text class="small" x="170.0" y="819.8" text-anchor="middle">4장 · 6장</text><text class="body" x="170.0" y="841.5" text-anchor="middle">수정후 시산표 → 재무제표</text><path class="flow" d="M170.0 242 L170.0 294"/><rect class="mask" x="149.5" y="258.0" width="41.0" height="22" rx="4"/><text class="lab" x="170.0" y="273.0" text-anchor="middle">판단</text><path class="flow" d="M170.0 366 L170.0 418"/><rect class="mask" x="130.8" y="382.0" width="78.5" height="22" rx="4"/><text class="lab" x="170.0" y="397.0" text-anchor="middle">예 → 분개</text><path class="flow" d="M170.0 490 L170.0 542"/><rect class="mask" x="149.5" y="506.0" width="41.0" height="22" rx="4"/><text class="lab" x="170.0" y="521.0" text-anchor="middle">전기</text><path class="flow" d="M170.0 614 L170.0 666"/><rect class="mask" x="114.5" y="630.0" width="111.0" height="22" rx="4"/><text class="lab" x="170.0" y="645.0" text-anchor="middle">잔액·합계 집계</text><path class="dash" d="M170.0 738 L170.0 790"/><rect class="mask" x="121.2" y="754.0" width="97.5" height="22" rx="4"/><text class="lab" x="170.0" y="769.0" text-anchor="middle">결산 수정 후</text><rect class="outside" x="374" y="294" width="162" height="72" rx="6"/><text class="lab" x="455.0" y="312.8" text-anchor="middle">기록하지 않음</text><text class="body" x="455.0" y="334.5" text-anchor="middle">예: 판매주문,</text><text class="body" x="455.0" y="356.5" text-anchor="middle">채용 약속</text><path class="flow" d="M316 330.0 L374 330.0"/><rect class="mask" x="319.0" y="302.0" width="52.0" height="22" rx="4"/><text class="lab" x="345.0" y="317.0" text-anchor="middle">아니오</text><rect class="outside" x="374" y="418" width="162" height="72" rx="6"/><text class="lab" x="455.0" y="436.8" text-anchor="middle">[부록] 전표</text><text class="body" x="455.0" y="458.5" text-anchor="middle">입금 · 출금 ·</text><text class="body" x="455.0" y="480.5" text-anchor="middle">대체 전표</text><path class="dash" d="M374 454.0 L316 454.0"/><rect class="mask" x="323.0" y="426.0" width="44.0" height="22" rx="4"/><text class="lab" x="345.0" y="441.0" text-anchor="middle">대신</text><rect class="zone" x="374" y="542" width="162" height="72" rx="6"/><text class="lab" x="455.0" y="560.8" text-anchor="middle">상호 대조</text><text class="body" x="455.0" y="582.5" text-anchor="middle">원면 = 원장 쪽</text><text class="body" x="455.0" y="604.5" text-anchor="middle">분면 = 분개장 쪽</text><path class="dash both" d="M316 578.0 L374 578.0"/><rect class="mask" x="323.0" y="550.0" width="44.0" height="22" rx="4"/><text class="lab" x="345.0" y="565.0" text-anchor="middle">번호</text><rect class="deep" x="374" y="666" width="162" height="72" rx="6"/><text class="lab" x="455.0" y="684.8" text-anchor="middle">불일치하면</text><text class="body" x="455.0" y="706.5" text-anchor="middle">오류를 찾아</text><text class="body" x="455.0" y="728.5" text-anchor="middle">정정 분개</text><path class="flow" d="M316 702.0 L374 702.0"/><rect class="mask" x="330.0" y="674.0" width="30.0" height="22" rx="4"/><text class="lab" x="345.0" y="689.0" text-anchor="middle">≠</text><path class="flow" d="M24 896 H54"/><text class="small" x="62" y="901">흐름·결합</text><path class="dash" d="M154 896 H184"/><text class="small" x="192" y="901">대체·참조·다음 장</text><rect class="focal" x="354" y="888" width="22" height="16" rx="3"/><text class="small" x="384" y="901">중심 개념</text><rect class="outside" x="24" y="914" width="22" height="16" rx="3"/><text class="small" x="54" y="927">기록 밖·보충</text><rect class="deep" x="174" y="914" width="22" height="16" rx="3"/><text class="small" x="204" y="927">오류 처리</text><rect class="zone" x="296" y="914" width="22" height="16" rx="3"/><text class="small" x="326" y="927">보조 정보</text>
</svg>
