<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 627" role="img" aria-labelledby="mis-gl-1h-approaches-title mis-gl-1h-approaches-desc">
  <title id="mis-gl-1h-approaches-title">기술적 · 행동적 · 사회기술적 관점</title>
  <desc id="mis-gl-1h-approaches-desc">컴퓨터과학·경영과학·운영연구의 기술적 접근과 심리학·사회학·경제학의 행동적 접근이 결합되어 사회기술적 관점이 되고, 사회기술적 관점은 기술 대안과 조직 대안을 서로 맞추는 공동 최적화를 뜻하는 그림</desc>
