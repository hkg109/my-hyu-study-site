  <text class="tag" x="24" y="40">1장 · 1-6 IS를 보는 세 접근법</text><text class="title" x="24" y="74">기술적 · 행동적 · 사회기술적 관점</text><text class="subtitle" x="24" y="104">두 접근의 강조점을 결합해 기술과 조직을 함께 조정하는 것이 사회기술적</text><text class="subtitle" x="24" y="124">관점이다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="249" height="110" rx="6"/><text class="small" x="148.5" y="198" text-anchor="middle">Technical approach</text><text class="name" x="148.5" y="219" text-anchor="middle">기술적 접근</text><text class="body" x="148.5" y="246" text-anchor="middle">컴퓨터과학·경영과학·운영연구</text><text class="body" x="148.5" y="266.5" text-anchor="middle">수학적 모형·효율</text><rect class="node" x="287" y="172" width="249" height="110" rx="6"/><text class="small" x="411.5" y="198" text-anchor="middle">Behavioral approach</text><text class="name" x="411.5" y="219" text-anchor="middle">행동적 접근</text><text class="body" x="411.5" y="246" text-anchor="middle">심리학·사회학·경제학</text><text class="body" x="411.5" y="266.5" text-anchor="middle">수용·변화·유인</text><rect class="focal" x="24" y="340" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="366" text-anchor="middle">Sociotechnical view</text><text class="name inv" x="280" y="387" text-anchor="middle">사회기술적 관점</text><text class="body inv" x="280" y="414" text-anchor="middle">Joint optimization: 만족스러운 적합까지 서로 맞춘다</text><rect class="node" x="24" y="487.5" width="224" height="71.5" rx="6"/><text class="name" x="136" y="515.5" text-anchor="middle">기술 쪽 대안</text><text class="body" x="136" y="542.5" text-anchor="middle">기능·화면·규칙</text><rect class="node" x="312" y="487.5" width="224" height="71.5" rx="6"/><text class="name" x="424" y="515.5" text-anchor="middle">조직 쪽 대안</text><text class="body" x="424" y="542.5" text-anchor="middle">역할·권한·프로세스</text><path class="flow both" d="M248 523.25 L312 523.25"/><rect class="mask" x="258.6" y="512.25" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="528.25" text-