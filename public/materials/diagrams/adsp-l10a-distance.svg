<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" width="560" height="620" role="img" aria-labelledby="adsp-l10a-distance-title adsp-l10a-distance-desc">
  <title id="adsp-l10a-distance-title">세 가지 거리 한눈에</title>
  <desc id="adsp-l10a-distance-desc">좌표평면의 두 점 A(1, 2)와 B(4, 6) 사이에 유클리드 거리는 직선 5, 맨해튼 거리는 가로 3과 세로 4를 따라가는 계단 경로 7, 체비셰프 거리는 가로·세로 차이 중 큰 값인 4임을 표시하고, 민코프스키 차수 m이 1이면 맨해튼, 2면 유클리드, 무한대로 가면 체비셰프가 된다고 정리한 그림</desc>
  <defs><marker id="adsp-l10a-distance-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l10a-distance-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l10a-distance-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.dasharrow{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l10a-distance-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#65645e;stroke-width:1.2;fill:none}.grid{stroke:#e4e1d8;stroke-width:1;fill:none}.axis{stroke:#1d1d1a;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.head{font:700 16px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.bodym{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.tiny{font:600 12px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="620"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 3장 · 군집분석 · 거리</text><text class="title" x="24" y="74">세 가지 거리 한눈에</text><text class="subtitle" x="24" y="104">A(1, 2)와 B(4, 6) — 가로 차이 3, 세로 차이 4</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
<line class="grid" x1="64" y1="476" x2="64" y2="154"/><text class="tiny" x="64" y="496" text-anchor="middle">0</text><line class="grid" x1="110" y1="476" x2="110" y2="154"/><text class="tiny" x="110" y="496" text-anchor="middle">1</text><line class="grid" x1="156" y1="476" x2="156" y2="154"/><text class="tiny" x="156" y="496" text-anchor="middle">2</text><line class="grid" x1="202" y1="476" x2="202" y2="154"/><text class="tiny" x="202" y="496" text-anchor="middle">3</text><line class="grid" x1="248" y1="476" x2="248" y2="154"/><text class="tiny" x="248" y="496" text-anchor="middle">4</text><line class="grid" x1="294" y1="476" x2="294" y2="154"/><text class="tiny" x="294" y="496" text-anchor="middle">5</text><line class="grid" x1="64" y1="476" x2="294" y2="476"/><text class="tiny" x="54" y="480" text-anchor="end">0</text><line class="grid" x1="64" y1="430" x2="294" y2="430"/><text class="tiny" x="54" y="434" text-anchor="end">1</text><line class="grid" x1="64" y1="384" x2="294" y2="384"/><text class="tiny" x="54" y="388" text-anchor="end">2</text><line class="grid" x1="64" y1="338" x2="294" y2="338"/><text class="tiny" x="54" y="342" text-anchor="end">3</text><line class="grid" x1="64" y1="292" x2="294" y2="292"/><text class="tiny" x="54" y="296" text-anchor="end">4</text><line class="grid" x1="64" y1="246" x2="294" y2="246"/><text class="tiny" x="54" y="250" text-anchor="end">5</text><line class="grid" x1="64" y1="200" x2="294" y2="200"/><text class="tiny" x="54" y="204" text-anchor="end">6</text><line class="grid" x1="64" y1="154" x2="294" y2="154"/><text class="tiny" x="54" y="158" text-anchor="end">7</text><path class="axis" d="M64 154 V476 H294"/><path class="dash" style="stroke-width:2.4" d="M110 384 H248 V200"/><path class="line" style="stroke-width:2.6" d="M110 384 L248 200"/><path class="line" d="M258 384 H264 V200 H258"/><text class="name" x="272" y="288">4</text><text class="tiny" x="272" y="308">(최댓값)</text><rect class="mask" x="153.4" y="391" width="51.3" height="21" rx="4"/><text class="lab" x="179" y="406" text-anchor="middle">가로 3</text><circle class="focal" cx="110" cy="384" r="6"/><circle class="focal" cx="248" cy="200" r="6"/><text class="name" x="100" y="374" text-anchor="end">A</text><text class="name" x="238" y="192" text-anchor="end">B</text><rect class="mask" x="131.4" y="271" width="51.3" height="21" rx="4"/><text class="lab" x="157" y="286" text-anchor="middle">직선 5</text><rect class="focal" x="336" y="158" width="200" height="92" rx="6"/><text class="name inv" x="350" y="186">유클리드</text><text class="small inv" x="350" y="210">직선 (굵은 실선)</text><text class="lab inv" x="350" y="236">√(3² + 4²) = 5</text><rect class="zone" x="336" y="262" width="200" height="92" rx="6"/><text class="name" x="350" y="290">맨해튼</text><text class="small" x="350" y="314">계단 경로 (점선)</text><text class="lab" x="350" y="340">|3| + |4| = 7</text><rect class="zone" x="336" y="366" width="200" height="92" rx="6"/><text class="name" x="350" y="394">체비셰프</text><text class="small" x="350" y="418">큰 차이 하나 (괄호)</text><text class="lab" x="350" y="444">max(3, 4) = 4</text><rect class="zone" x="24" y="526" width="512" height="96" rx="8"/><text class="head" x="40" y="554">민코프스키 거리 = 차수 m으로 일반화</text><text class="bodym" x="40" y="578">m = 1 → 맨해튼 · m = 2 → 유클리드 · m → ∞ → 체비셰프</text><text class="bodym" x="40" y="600">항상 체비셰프 ≤ 유클리드 ≤ 맨해튼 (4 ≤ 5 ≤ 7)</text>
</svg>
