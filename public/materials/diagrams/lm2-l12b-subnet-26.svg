<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 724" width="560" height="724" role="img" aria-labelledby="lm2-l12b-subnet-26-title lm2-l12b-subnet-26-desc">
  <title id="lm2-l12b-subnet-26-title">192.168.10.0/24를 /26 네 개로 나누기</title>
  <desc id="lm2-l12b-subnet-26-desc">위쪽에 주소 256개짜리 192.168.10.0/24 한 덩어리가 있고, 호스트 비트 2개를 빌려 아래 네 개의 /26 서브넷으로 나뉜다. 각 서브넷의 네트워크 주소는 .0, .64, .128, .192, 브로드캐스트 주소는 .63, .127, .191, .255이며 각각 호스트 62개를 쓴다. 192.168.10.77은 두 번째 서브넷에 속한다고 강조했고, 아래에 마스크 192는 /26, 블록 크기 256 빼기 192는 64, 호스트 수 2의 6제곱 빼기 2는 62라는 계산을 적었다.</desc>
  <defs><marker id="lm2-l12b-subnet-26-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l12b-subnet-26-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l12b-subnet-26-a)}.flow.both{marker-start:url(#lm2-l12b-subnet-26-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l12b-subnet-26-m)}.dash.both{marker-start:url(#lm2-l12b-subnet-26-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="724"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 3과목 2장</text><text class="title" x="24" y="74">서브네팅 — /24를 /26으로 나누기</text><text class="subtitle" x="24" y="104">블록 크기만 알면 네트워크·브로드캐스트 주소가 바로 나온다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="small" x="24" y="176">원래 네트워크 · /24 (마스크 255.255.255.0)</text><rect class="zone" x="24" y="186" width="512" height="50" rx="6"/><text class="name" x="280" y="218" text-anchor="middle">192.168.10.0 /24 · 주소 256개 (.0–.255)</text><path class="flow" d="M280 236 L280 280"/><rect class="mask" x="165.0" y="248" width="230.0" height="22" rx="4"/><text class="lab" x="280" y="264" text-anchor="middle">호스트 비트 2개를 빌림 → /26</text><text class="small" x="24" y="300">서브넷 4개 · /26 (마스크 255.255.255.192) · 블록 64</text><rect class="node" x="24.0" y="312" width="122" height="196" rx="6"/><text class="name" x="85.0" y="338" text-anchor="middle">1번 서브넷</text><text class="small" x="85.0" y="366" text-anchor="middle">네트워크</text><text class="name" x="85.0" y="386" text-anchor="middle">.0</text><text class="small" x="85.0" y="414" text-anchor="middle">호스트 62개</text><text class="name" x="85.0" y="434" text-anchor="middle">.1–.62</text><text class="small" x="85.0" y="462" text-anchor="middle">브로드캐스트</text><text class="name" x="85.0" y="482" text-anchor="middle">.63</text><rect class="focal" x="153.33" y="312" width="122" height="196" rx="6"/><text class="name inv" x="214.33" y="338" text-anchor="middle">2번 서브넷</text><text class="small inv" x="214.33" y="366" text-anchor="middle">네트워크</text><text class="name inv" x="214.33" y="386" text-anchor="middle">.64</text><text class="small inv" x="214.33" y="414" text-anchor="middle">호스트 62개</text><text class="name inv" x="214.33" y="434" text-anchor="middle">.65–.126</text><text class="small inv" x="214.33" y="462" text-anchor="middle">브로드캐스트</text><text class="name inv" x="214.33" y="482" text-anchor="middle">.127</text><rect class="node" x="282.66" y="312" width="122" height="196" rx="6"/><text class="name" x="343.66" y="338" text-anchor="middle">3번 서브넷</text><text class="small" x="343.66" y="366" text-anchor="middle">네트워크</text><text class="name" x="343.66" y="386" text-anchor="middle">.128</text><text class="small" x="343.66" y="414" text-anchor="middle">호스트 62개</text><text class="name" x="343.66" y="434" text-anchor="middle">.129–.190</text><text class="small" x="343.66" y="462" text-anchor="middle">브로드캐스트</text><text class="name" x="343.66" y="482" text-anchor="middle">.191</text><rect class="node" x="411.99" y="312" width="122" height="196" rx="6"/><text class="name" x="472.99" y="338" text-anchor="middle">4번 서브넷</text><text class="small" x="472.99" y="366" text-anchor="middle">네트워크</text><text class="name" x="472.99" y="386" text-anchor="middle">.192</text><text class="small" x="472.99" y="414" text-anchor="middle">호스트 62개</text><text class="name" x="472.99" y="434" text-anchor="middle">.193–.254</text><text class="small" x="472.99" y="462" text-anchor="middle">브로드캐스트</text><text class="name" x="472.99" y="482" text-anchor="middle">.255</text><path class="flow" d="M214.33 538 L214.33 512"/><rect class="outside" x="70" y="538" width="420" height="52" rx="6"/><text class="lab" x="280" y="560" text-anchor="middle">192.168.10.77은 64 ≤ 77 &lt; 128 → 2번 서브넷</text><text class="small" x="280" y="580" text-anchor="middle">네트워크 .64 · 브로드캐스트 .127 · 기본 게이트웨이도 이 안에</text><line class="rule" x1="24" y1="616" x2="536" y2="616"/><text class="lab" x="24" y="644">마스크 옥텟</text><text class="body" x="124" y="644">192 = 1100 0000 → 앞의 1이 26개 = /26</text><text class="lab" x="24" y="670">블록 크기</text><text class="body" x="124" y="670">256 − 192 = 64 → 경계 0 · 64 · 128 · 192</text><text class="lab" x="24" y="696">호스트 수</text><text class="body" x="124" y="696">2⁶ − 2 = 62 (네트워크·브로드캐스트 제외)</text>
</svg>
