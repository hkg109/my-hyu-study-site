<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 612" role="img" aria-labelledby="mis-gl-4i-quality-of-life-title mis-gl-4i-quality-of-life-desc">
  <title id="mis-gl-4i-quality-of-life-title">정보시스템의 사회적 비용</title>
  <desc id="mis-gl-4i-quality-of-life-desc">삶의 질 차원이 권력 집중과 변화 속도 같은 사회 변화, 컴퓨터 범죄와 남용, 디지털 격차, 건강 위험의 네 묶음을 포함하고, 범죄는 불법 행위이고 남용은 비윤리적이지만 반드시 불법은 아니며, 건강 위험에는 반복 긴장성 손상(대표 손목터널증후군), 컴퓨터 시각 증후군, 테크노스트레스가 있다는 그림</desc>
  <defs><marker id="mis-gl-4i-quality-of-life-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4i-quality-of-life-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4i-quality-of-life-a)}.flow.both{marker-start:url(#mis-gl-4i-quality-of-life-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4i-quality-of-life-m)}.dash.both{marker-start:url(#mis-gl-4i-quality-of-life-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="612"/>
  <text class="tag" x="24" y="40">4장 · 4-7 삶의 질</text><text class="title" x="24" y="74">정보시스템의 사회적 비용</text><text class="subtitle" x="24" y="104">효율의 대가로 권력 집중·경계 약화·범죄·격차·건강 위험이 생긴다. 불법인지가</text><text class="subtitle" x="24" y="124">crime과 abuse를 가른다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="172" width="512" height="63" rx="6"/><text class="small inv" x="280" y="198" text-anchor="middle">Quality of life</text><text class="name inv" x="280" y="219" text-anchor="middle">삶의 질 차원</text><rect class="node" x="24" y="293" width="249" height="130.5" rx="6"/><text class="small" x="148.5" y="319" text-anchor="middle">사회 변화</text><text class="name" x="148.5" y="340" text-anchor="middle">권력·경계</text><text class="body" x="148.5" y="367" text-anchor="middle">빅테크 권력 집중(DMA)</text><text class="body" x="148.5" y="387.5" text-anchor="middle">변화 속도·일과 삶 경계</text><text class="body" x="148.5" y="408" text-anchor="middle">의존·취약성</text><rect class="node" x="287" y="293" width="249" height="130.5" rx="6"/><text class="small" x="411.5" y="319" text-anchor="middle">Crime vs abuse</text><text class="name" x="411.5" y="340" text-anchor="middle">불법인가?</text><text class="body" x="411.5" y="367" text-anchor="middle">범죄 = 불법</text><text class="body" x="411.5" y="387.5" text-anchor="middle">남용 = 비윤리 (스팸)</text><text class="body" x="411.5" y="408" text-anchor="middle">CAN-SPAM은 기만만 금지</text><rect class="node" x="24" y="433.5" width="249" height="110" rx="6"/><text class="small" x="148.5" y="459.5" text-anchor="middle">Equity &amp; access</text><text class="name" x="148.5" y="480.5" text-anchor="middle">디지털 격차</text><text class="body" x="148.5" y="507.5" text-anchor="middle">소득·인구 집단별 접근 격차</text><text class="body" x="148.5" y="528" text-anchor="middle">time-wasting gap</text><rect class="node" x="287" y="433.5" width="249" height="110" rx="6"/><text class="small" x="411.5" y="459.5" text-anchor="middle">Health risks</text><text class="name" x="411.5" y="480.5" text-anchor="middle">건강 위험</text><text class="body" x="411.5" y="507.5" text-anchor="middle">RSI ⊃ CTS(손목)</text><text class="body" x="411.5" y="528" text-anchor="middle">CVS(눈) · 테크노스트레스</text><path class="line" d="M280 235 V266.9"/><path class="line" d="M148.5 266.9 H411.5"/><path class="flow" d="M148.5 266.9 L148.5 293"/><path class="flow" d="M411.5 266.9 L411.5 293"/><rect class="mask" x="258.6" y="239.95" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="255.95" text-anchor="middle">포함</text><path class="flow" d="M24 567.5 H54"/><text class="small" x="62" y="572.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="559.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="572.5">중심 개념</text>
</svg>
