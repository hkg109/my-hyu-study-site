<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="mis-00-ethics-chain-title mis-00-ethics-chain-desc">
  <title id="mis-00-ethics-chain-title">책임 개념은 선택에서 법적 절차까지 이어진다</title>
  <desc id="mis-00-ethics-chain-desc">네 개념의 순서를 잡고, 실제 사례는 다섯 단계 분석으로 풀어 간다</desc>
  <defs><marker id="mis-00-ethics-chain-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.link{stroke:#65645e;stroke-width:2;fill:none}.flow{stroke:#65645e;stroke-width:2;fill:none;marker-end:url(#mis-00-ethics-chain-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.step{font:600 12px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.inverse{fill:#f7f6f2}</style>
  <rect class="bg" width="1280" height="700"/><text class="tag" x="64" y="52">4장 · 윤리적 판단</text><text class="title" x="64" y="92">책임 개념은 선택에서 법적 절차까지 이어진다</text><text class="subtitle" x="64" y="122">네 개념의 순서를 잡고, 실제 사례는 다섯 단계 분석으로 풀어 간다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
  <text class="step" x="64" y="186">책임의 네 개념</text>
  <g><rect class="node" x="64" y="200" width="256" height="150" rx="6"/><text class="step" x="88" y="230">선택한 사람</text><text class="name" x="88" y="262">Responsibility</text><text class="sub" x="88" y="288">결정의 비용과 의무를</text><text class="sub" x="88" y="314">스스로 받아들인다</text></g>
  <g><rect class="focal" x="360" y="200" width="256" height="150" rx="6"/><text class="step inverse" x="384" y="230">추적 가능성</text><text class="name inverse" x="384" y="262">Accountability</text><text class="sub inverse" x="384" y="288">누가 무엇을 했는지</text><text class="sub inverse" x="384" y="314">확인할 수 있다</text></g>
  <g><rect class="node" x="656" y="200" width="256" height="150" rx="6"/><text class="step" x="680" y="230">법적 배상</text><text class="name" x="680" y="262">Liability</text><text class="sub" x="680" y="288">피해에 대해 배상을</text><text class="sub" x="680" y="314">청구할 수 있다</text></g>
  <g><rect class="node" x="952" y="200" width="264" height="150" rx="6"/><text class="step" x="976" y="230">공정한 절차</text><text class="name" x="976" y="262">Due Process</text><text class="sub" x="976" y="288">규칙이 공개되고</text><text class="sub" x="976" y="314">이의를 제기할 수 있다</text></g>
  <path class="flow" d="M320 275 H356"/><path class="flow" d="M616 275 H652"/><path class="flow" d="M912 275 H948"/>
  <text class="step" x="64" y="426">윤리적 분석 5단계</text>
  <g><rect class="node" x="64" y="440" width="208" height="100" rx="6"/><text class="step" x="88" y="470">1</text><text class="name" x="88" y="502">Facts</text><text class="sub" x="88" y="528">사실관계 정리</text></g>
  <g><rect class="node" x="300" y="440" width="208" height="100" rx="6"/><text class="step" x="324" y="470">2</text><text class="name" x="324" y="502">Values</text><text class="sub" x="324" y="528">충돌하는 가치</text></g>
  <g><rect class="node" x="536" y="440" width="208" height="100" rx="6"/><text class="step" x="560" y="470">3</text><text class="name" x="560" y="502">Stakeholders</text><text class="sub" x="560" y="528">영향받는 사람</text></g>
  <g><rect class="node" x="772" y="440" width="208" height="100" rx="6"/><text class="step" x="796" y="470">4</text><text class="name" x="796" y="502">Options</text><text class="sub" x="796" y="528">가능한 선택지</text></g>
  <g><rect class="node" x="1008" y="440" width="208" height="100" rx="6"/><text class="step" x="1032" y="470">5</text><text class="name" x="1032" y="502">Consequences</text><text class="sub" x="1032" y="528">선택별 결과</text></g>
  <path class="flow" d="M272 490 H296"/><path class="flow" d="M508 490 H532"/><path class="flow" d="M744 490 H768"/><path class="flow" d="M980 490 H1004"/>
  <rect class="zone" x="64" y="584" width="1152" height="70" rx="6"/><text class="step" x="88" y="612">선택지를 비교하는 판단 원칙</text><text class="sub" x="88" y="638">Golden Rule  /  Kant’s Categorical Imperative  /  Slippery Slope  /  Utilitarian  /  Risk Aversion  /  No Free Lunch</text>
</svg>
