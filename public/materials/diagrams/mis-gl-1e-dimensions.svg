  <text class="tag" x="24" y="40">1장 · 1-4 세 차원과 IT 인프라</text><text class="title" x="24" y="74">정보시스템을 이해하는 세 차원</text><text class="subtitle" x="24" y="104">조직·경영·기술은 별도 제품이 아니라 같은 시스템을 보는 세 관점이다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="focal" x="24" y="152" width="512" height="71.5" rx="6"/><text class="name inv" x="280" y="180" text-anchor="middle">정보시스템</text><text class="body inv" x="280" y="207" text-anchor="middle">환경이 던진 비즈니스 문제에 대한 조직적·경영적 해결책</text><rect class="node" x="24" y="281.5" width="161" height="130.5" rx="6"/><text class="small" x="104.5" y="307.5" text-anchor="middle">Organization</text><text class="name" x="104.5" y="328.5" text-anchor="middle">조직</text><text class="body" x="104.5" y="355.5" text-anchor="middle">사람·구조</text><text class="body" x="104.5" y="376" text-anchor="middle">프로세스</text><text class="body" x="104.5" y="396.5" text-anchor="middle">정치·문화</text><rect class="node" x="199" y="281.5" width="161" height="130.5" rx="6"/><text class="small" x="279.5" y="307.5" text-anchor="middle">Management</text><text class="name" x="279.5" y="328.5" text-anchor="middle">경영</text><text class="body" x="279.5" y="355.5" text-anchor="middle">전략 설정</text><text class="body" x="279.5" y="376" text-anchor="middle">자원 배분</text><text class="body" x="279.5" y="396.5" text-anchor="middle">변화 주도</text><rect class="node" x="374" y="281.5" width="161" height="130.5" rx="6"/><text class="small" x="454.5" y="307.5" text-anchor="middle">Technology</text><text class="name" x="454.5" y="328.5" text-anchor="middle">기술</text><text class="body" x="454.5" y="355.5" text-anchor="middle">H/W·S/W</text><text class="body" x="454.5" y="376" text-anchor="middle">데이터 관리</text><text class="body" x="454.5" y="396.5" text-anchor="middle">네트워크</text><path class="line" d="M280 223.5 V255.4"/><path class="line" d="M104.5 255.4 H454.5"/><path class="flow" d="M104.5 255.4 L104.5 281.5"/><path class="flow" d="M279.5 255.4 L279.5 281.5"/><path class="flow" d="M454.5 255.4 L454.5 281.5"/><rect class="mask" x="249.2" y="228.45" width="61.7" height="22" rx="4"/><text class="lab" x="280" y="244.45" text-anchor="middle">세 관점</text><rect class="node" x="219" y="470" width="317" height="110" rx="6"/><text class="small" x="377.5" y="496" text-anchor="middle">IT infrastructure</text><text class="name" x="377.5" y="517" text-anchor="middle">IT 인프라</text><text class="body" x="377.5" y="544" text-anchor="middle">여러 시스템이 함께 쓰는 기술 기반 + 운영</text><text class="body" x="377.5" y="564.5" text-anchor="middle">인력</text><path class="flow" d="M454.5 412 L454.5 470"/><rect class="mask" x="433.1" y="430" width="42.9" height="22" rx="4"/><text class="lab" x="454.5" y="446" text-anchor="middle">구성</text><path class="flow" d="M24 610 H54"/><text class="small" x="62" y="615">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="602" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="615">중심 개념</text>
