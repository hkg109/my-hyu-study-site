<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 788" role="img" aria-labelledby="acc-gl-5c-periodic-adjusting-title acc-gl-5c-periodic-adjusting-desc">
  <title id="acc-gl-5c-periodic-adjusting-title">결산정리 분개 ⓐ · ⓑ · ⓒ의 흐름</title>
  <desc id="acc-gl-5c-periodic-adjusting-desc">왼쪽 위 상품 계정의 기초 8,000원이 ⓐ로, 오른쪽 위 매입 계정의 30,000원이 ⓑ로 가운데 매출원가 계정으로 옮겨지고, 매출원가에서 ⓒ 18,000원이 상품 계정으로 되돌아가는 그림. 아래 결과 상자는 상품 18,000원, 매입 0원, 매출원가 20,000원을 보여 준다</desc>
  <defs><marker id="acc-gl-5c-periodic-adjusting-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-5c-periodic-adjusting-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-5c-periodic-adjusting-a)}.flow.both{marker-start:url(#acc-gl-5c-periodic-adjusting-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-5c-periodic-adjusting-m)}.dash.both{marker-start:url(#acc-gl-5c-periodic-adjusting-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="788"/>
  <text class="tag" x="24" y="40">5장 · 5-2 실지재고조사법에 따른 상품의 결산정리</text><text class="title" x="24" y="74">결산정리 분개 ⓐ · ⓑ · ⓒ의 흐름</text><text class="subtitle" x="24" y="104">기초상품과 매입을 모두 매출원가로 옮긴 뒤(ⓐ·ⓑ), 실사로 남은 18,000을</text><text class="subtitle" x="24" y="124">상품으로 되돌린다(ⓒ). 그 결과 매출원가 20,000이 남는다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="240" height="116" rx="6"/><text class="small" x="144" y="202.5" text-anchor="middle">자산</text><text class="name" x="144" y="222.5" text-anchor="middle">상품</text><text class="body" x="144" y="246.5" text-anchor="middle">결산 전 잔액 = 기초 8,000</text><text class="small" x="144" y="267.5" text-anchor="middle">(기중에 증감 기록 없음)</text><rect class="node" x="296" y="172" width="240" height="116" rx="6"/><text class="small" x="416" y="202.5" text-anchor="middle">매입 (임시 계정)</text><text class="name" x="416" y="222.5" text-anchor="middle">매입</text><text class="body" x="416" y="246.5" text-anchor="middle">당기매입액 30,000</text><text class="small" x="416" y="267.5" text-anchor="middle">(기중 매입을 모아 둔 곳)</text><rect class="focal" x="104" y="400" width="432" height="116" rx="6"/><text class="small inv" x="320" y="430" text-anchor="middle">비용</text><text class="name inv" x="320" y="450" text-anchor="middle">매출원가</text><text class="body inv" x="320" y="474" text-anchor="middle">차변 8,000 + 30,000 · 대변 18,000</text><text class="body inv" x="320" y="495" text-anchor="middle">잔액 20,000</text><path class="flow" d="M190 288 L190 400"/><rect class="mask" x="139.8" y="334" width="100.4" height="22" rx="4"/><text class="lab" x="190" y="350" text-anchor="middle">ⓐ 8,000 대체</text><path class="flow" d="M416 288 L416 400"/><rect class="mask" x="362.02" y="334" width="107.96" height="22" rx="4"/><text class="lab" x="416" y="350" text-anchor="middle">ⓑ 30,000 대체</text><path class="flow" d="M104 470 L58 470 L58 288"/><rect class="mask" x="33.545" y="376" width="76.91" height="22" rx="4"/><text class="lab" x="72" y="392" text-anchor="middle">ⓒ 18,000</text><rect class="zone" x="24" y="556" width="512" height="172" rx="6"/><text class="small" x="280" y="582" text-anchor="middle">분개장 (12/31)</text><text class="body" x="280" y="602" text-anchor="middle">ⓐ 차) 매출원가 8,000 · 대) 상품 8,000</text><text class="body" x="280" y="623" text-anchor="middle">ⓑ 차) 매출원가 30,000 · 대) 매입 30,000</text><text class="body" x="280" y="644" text-anchor="middle">ⓒ 차) 상품 18,000 · 대) 매출원가 18,000</text><text class="small" x="280" y="665" text-anchor="middle">전기 결과</text><text class="body" x="280" y="685" text-anchor="middle">상품 18,000 = 기말상품 · 매입 0</text><text class="body" x="280" y="706" text-anchor="middle">매출원가 20,000 = 8,000 + 30,000 − 18,000</text><path class="flow" d="M320 516 L320 556"/><rect class="mask" x="299.5" y="526" width="41" height="22" rx="4"/><text class="lab" x="320" y="542" text-anchor="middle">전기</text><path class="flow" d="M24 758 H54"/><text class="small" x="62" y="763">흐름·기록 순서</text><rect class="focal" x="176.61" y="750" width="22" height="16" rx="3"/><text class="small" x="206.61" y="763">중심 개념</text><rect class="zone" x="286.66" y="750" width="22" height="16" rx="3"/><text class="small" x="316.66" y="763">범위·묶음</text>
</svg>
