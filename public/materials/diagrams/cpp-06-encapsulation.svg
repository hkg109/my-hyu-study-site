<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" width="720" height="472" role="img" aria-labelledby="cpp-06-encapsulation-title cpp-06-encapsulation-desc">
  <title id="cpp-06-encapsulation-title">private 속성은 public 메서드를 통해서만</title>
  <desc id="cpp-06-encapsulation-desc">Circle 클래스 안의 private radius는 바깥 main에서 직접 접근할 수 없고, public 메서드 set_radius, get_radius, area를 통해서만 읽고 쓰며, 생성자는 객체가 생길 때 소멸자는 사라질 때 자동으로 불린다는 그림</desc>
  <defs>
    <marker id="cpp-06-encapsulation-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-06-encapsulation-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-06-encapsulation-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="472" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">06 · 정보 은닉</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">private 속성은 public 메서드를 통해서만</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <rect x="240" y="112" width="448" height="288" rx="8" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.2"/><text x="252" y="132" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">class Circle</text><path d="M192 180 L264 180" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-06-encapsulation-m)"/><path d="M192 236 L264 236" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-06-encapsulation-m)"/><path d="M160 288 L160 340 Q160 348 168 348 L472 348 Q480 348 480 340 L480 324" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-06-encapsulation-a)"/><rect x="264" y="320" width="112" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="320" y="334.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">c.radius = 3; ✕</text><rect x="32" y="152" width="160" height="136" rx="6" fill="#f7f6f2"/><rect x="32" y="152" width="160" height="136" rx="6" fill="#f7f6f2" stroke="#65645e" stroke-width="1.5" stroke-dasharray="5,4"/><text x="112" y="200" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">main()</text><text x="112" y="220" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">Circle c(5.0);</text><text x="112" y="236" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">c.set_radius(3);</text><text x="112" y="252" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">c.area();</text><rect x="264" y="148" width="196" height="64" rx="6" fill="#f7f6f2"/><rect x="2