L572 272" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-06-encapsulation-m)"/><rect x="480" y="128" width="184" height="36" rx="6" fill="#f7f6f2"/><rect x="480" y="128" width="184" height="36" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="572" y="150" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">Circle(double r)</text><rect x="480" y="344" width="184" height="36" rx="6" fill="#f7f6f2"/><rect x="480" y="344" width="184" height="36" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="572" y="366" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">~Circle()</text>
