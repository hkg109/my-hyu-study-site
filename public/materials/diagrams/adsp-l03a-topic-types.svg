<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 738" role="img" aria-labelledby="adsp-l03a-topic-types-title adsp-l03a-topic-types-desc">
  <title id="adsp-l03a-topic-types-title">분석 주제의 4가지 유형</title>
  <desc id="adsp-l03a-topic-types-desc">분석 대상(What)을 행, 분석 방법(How)을 열로 둔 2×2 표. 대상과 방법을 모두 알면 최적화, 대상만 알면 솔루션, 방법만 알면 통찰, 둘 다 모르면 발견이다. 솔루션과 통찰은 자주 뒤바꿔 출제되는 쌍으로 표시했고, 대상을 아는 윗줄은 하향식 접근, 대상을 모르는 아랫줄은 상향식 접근과 연결된다.</desc>
  <defs><marker id="adsp-l03a-topic-types-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l03a-topic-types-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l03a-topic-types-a)}.flow.both{marker-start:url(#adsp-l03a-topic-types-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l03a-topic-types-m)}.dash.both{marker-start:url(#adsp-l03a-topic-types-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="738"/>
  <text class="tag" x="24" y="40">ADsP · 2과목 1장 · 분석 기획</text><text class="title" x="24" y="74">분석 주제의 4가지 유형</text><text class="subtitle" x="24" y="104">분석 대상(What)과 분석 방법(How)을 아는지 모르는지로 가른다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="small" x="336" y="164" text-anchor="middle">분석 방법 How →</text><rect class="zone" x="24" y="176" width="104" height="40" rx="6"/><text class="small" x="76" y="201" text-anchor="middle">대상 ↓ · 방법 →</text><rect class="deep" x="136" y="176" width="196" height="40" rx="6"/><text class="lab" x="234" y="202" text-anchor="middle">방법을 앎 (Known)</text><rect class="deep" x="340" y="176" width="196" height="40" rx="6"/><text class="lab" x="438" y="202" text-anchor="middle">방법을 모름 (Unknown)</text><rect class="deep" x="24" y="224" width="104" height="140" rx="6"/><text class="lab" x="76" y="276" text-anchor="middle">대상을 앎</text><text class="small" x="76" y="296" text-anchor="middle">Known</text><text class="lab" x="76" y="330" text-anchor="middle">→ 하향식</text><rect class="node" x="136" y="224" width="196" height="140" rx="6"/><text class="small" x="234" y="250" text-anchor="middle">Optimization</text><text class="name" x="234" y="276" text-anchor="middle">최적화</text><text class="body" x="234" y="302" text-anchor="middle">대상 ○ · 방법 ○</text><text class="task" x="234" y="326" text-anchor="middle">개선만 하면 된다</text><rect class="zone" x="340" y="224" width="196" height="140" rx="6"/><text class="small" x="438" y="250" text-anchor="middle">Solution</text><text class="name" x="438" y="276" text-anchor="middle">솔루션</text><text class="body" x="438" y="302" text-anchor="middle">대상 ○ · 방법 ×</text><text class="task" x="438" y="326" text-anchor="middle">방법을 찾아야 한다</text><text class="small" x="438" y="351" text-anchor="middle">(헷갈리는 쌍)</text><rect class="deep" x="24" y="372" width="104" height="140" rx="6"/><text class="lab" x="76" y="424" text-anchor="middle">대상을 모름</text><text class="small" x="76" y="444" text-anchor="middle">Unknown</text><text class="lab" x="76" y="478" text-anchor="middle">→ 상향식</text><rect class="zone" x="136" y="372" width="196" height="140" rx="6"/><text class="small" x="234" y="398" text-anchor="middle">Insight</text><text class="name" x="234" y="424" text-anchor="middle">통찰</text><text class="body" x="234" y="450" text-anchor="middle">대상 × · 방법 ○</text><text class="task" x="234" y="474" text-anchor="middle">돌려 보며 시사점 발견</text><text class="small" x="234" y="499" text-anchor="middle">(헷갈리는 쌍)</text><rect class="node" x="340" y="372" width="196" height="140" rx="6"/><text class="small" x="438" y="398" text-anchor="middle">Discovery</text><text class="name" x="438" y="424" text-anchor="middle">발견</text><text class="body" x="438" y="450" text-anchor="middle">대상 × · 방법 ×</text><text class="task" x="438" y="474" text-anchor="middle">처음부터 찾아 나선다</text><rect class="node" x="24" y="540" width="512" height="64" rx="6"/><text class="lab" x="40" y="566">하향식 접근 (윗줄 · 대상을 알 때)</text><text class="task" x="40" y="590">문제가 주어짐 → 해법 탐색 · Why 관점 · 주로 지도 학습</text><rect class="node" x="24" y="616" width="512" height="64" rx="6"/><text class="lab" x="40" y="642">상향식 접근 (아랫줄 · 대상을 모를 때)</text><text class="task" x="40" y="666">데이터에서 문제를 찾음 · What 관점 · 주로 비지도 학습</text><rect class="zone" x="24" y="700" width="22" height="16" rx="3"/><text class="small" x="54" y="713">솔루션↔통찰: 행·열을 바꿔 내는 함정</text><rect class="deep" x="294.47999999999996" y="700" width="22" height="16" rx="3"/><text class="small" x="324.47999999999996" y="713">축 이름 (대상·방법)</text>
</svg>
