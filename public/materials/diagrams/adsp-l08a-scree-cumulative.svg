<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 920" role="img" aria-labelledby="adsp-l08a-scree-cumulative-title adsp-l08a-scree-cumulative-desc">
  <title id="adsp-l08a-scree-cumulative-title">주성분 수를 정하는 세 기준</title>
  <desc id="adsp-l08a-scree-cumulative-desc">위는 스크리 플롯으로 PC1부터 PC5의 고유값 3.0, 0.9, 0.5, 0.4, 0.2와 고유값 1 기준선, PC2에서 꺾이는 엘보를 표시한다. 아래는 누적 기여율 막대 60, 78, 88, 96, 100%와 80%, 90% 기준선이다. 80% 이상이면 3개, 90% 이상이면 4개, 고유값 1 이상이면 1개, 엘보 직전까지면 1개다.</desc>
  <defs><marker id="adsp-l08a-scree-cumulative-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l08a-scree-cumulative-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l08a-scree-cumulative-a)}.flow.both{marker-start:url(#adsp-l08a-scree-cumulative-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l08a-scree-cumulative-m)}.dash.both{marker-start:url(#adsp-l08a-scree-cumulative-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="920"/>
  <style>.ax{stroke:#1d1d1a;stroke-width:1.5;fill:none}.grid{stroke:#b9b6ac;stroke-width:1;stroke-dasharray:3 4;fill:none}.cv{stroke:#1d1d1a;stroke-width:2.2;fill:none}.cvm{stroke:#65645e;stroke-width:2;fill:none;stroke-dasharray:7 5}.dot{fill:#1d1d1a}.dotm{fill:#65645e}.dotl{fill:#f7f6f2;stroke:#1d1d1a;stroke-width:1.5}.shd{fill:#1d1d1a}.shl{fill:#c9c5b9}.shs{fill:#e4e1d8}.ln{stroke:#1d1d1a;stroke-width:1.6;fill:none}.lnm{stroke:#65645e;stroke-width:1.4;fill:none}.lnd{stroke:#1d1d1a;stroke-width:1.6;stroke-dasharray:6 4;fill:none}.lnt{stroke:#1d1d1a;stroke-width:2;stroke-dasharray:2 3;fill:none}.thick{stroke:#1d1d1a;stroke-width:3;fill:none}.tick{font:400 12.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.bodyb{font:700 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 19px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style><text class="tag" x="24" y="40">ADsP · 3과목 2장 04 · 주성분분석</text><text class="title" x="24" y="74">주성분 수를 정하는 세 기준</text><text class="subtitle" x="24" y="104">본문 prcomp 예시(체력 5개 변수)의 고유값과 누적 기여율</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="name" x="24" y="156">① 스크리 플롯 · 고유값(분산)</text><path class="ax" d="M70 352 L530 352"/><path class="ax" d="M70 352 L70 182"/><text class="tick" x="62" y="356" text-anchor="end">0</text><text class="tick" x="62" y="304.5" text-anchor="end">1</text><path class="ax" d="M66 300.5 L70 300.5"/><text class="tick" x="62" y="253" text-anchor="end">2</text><path class="ax" d="M66 249 L70 249"/><text class="tick" x="62" y="201.5" text-anchor="end">3</text><path class="ax" d="M66 197.5 L70 197.5"/><path class="lnd" d="M70 300.5 L530 300.5"/><text class="lab" x="526" y="292.5" text-anchor="end">고유값 1 기준선</text><path class="cv" d="M130 197.4 L220 305.6 L310 326.2 L400 331.4 L490 341.7"/><circle class="focal" cx="130" cy="197.4" r="5.5"/><text class="lab" x="142" y="201.4">3.0</text><text class="lab" x="130" y="372" text-anchor="middle">PC1</text><circle class="dotl" cx="220" cy="305.6" r="5.5"/><text class="lab" x="200" y="310.6" text-anchor="end">0.9</text><text class="lab" x="220" y="372" text-anchor="middle">PC2</text><circle class="dotl" cx="310" cy="326.2" r="5.5"/><text class="lab" x="310" y="314.2" text-anchor="middle">0.5</text><text class="lab" x="310" y="372" text-anchor="middle">PC3</text><circle class="dotl" cx="400" cy="331.4" r="5.5"/><text class="lab" x="400" y="319.4" text-anchor="middle">0.4</text><text class="lab" x="400" y="372" text-anchor="middle">PC4</text><circle class="dotl" cx="490" cy="341.7" r="5.5"/><text class="lab" x="490" y="329.7" text-anchor="middle">0.2</text><text class="lab" x="490" y="372" text-anchor="middle">PC5</text><circle cx="220" cy="305.6" r="14" class="ln"/><path class="lnm" d="M232 295.6 L280 233.5"/><text class="lab" x="284" y="231.5">엘보: 여기서부터 기울기가</text><text class="lab" x="284" y="250.5">완만해진다</text><text class="name" x="24" y="402">② 누적 기여율 (Cumulative Proportion)</text><path class="ax" d="M70 608 L530 608"/><path class="ax" d="M70 608 L70 438"/><text class="tick" x="62" y="612" text-anchor="end">0%</text><text class="tick" x="62" y="527" text-anchor="end">50%</text><text class="tick" x="62" y="442" text-anchor="end">100%</text><rect class="node" x="104" y="506" width="52" height="102" rx="2"/><text class="lab" x="130" y="594" text-anchor="middle">60%</text><text class="lab" x="130" y="628" text-anchor="middle">PC1</text><rect class="node" x="194" y="475.4" width="52" height="132.6" rx="2"/><text class="lab" x="220" y="594" text-anchor="middle">78%</text><text class="lab" x="220" y="628" text-anchor="middle">PC2</text><rect class="focal" x="284" y="458.4" width="52" height="149.6" rx="2"/><text class="lab inv" x="310" y="594" text-anchor="middle">88%</text><text class="lab" x="310" y="628" text-anchor="middle">PC3</text><rect class="deep" x="374" y="444.8" width="52" height="163.2" rx="2"/><text class="lab" x="400" y="594" text-anchor="middle">96%</text><text class="lab" x="400" y="628" text-anchor="middle">PC4</text><rect class="node" x="464" y="438" width="52" height="170" rx="2"/><text class="lab" x="490" y="594" text-anchor="middle">100%</text><text class="lab" x="490" y="628" text-anchor="middle">PC5</text><path class="lnd" d="M70 472 L530 472"/><text class="small" x="74" y="467">80%</text><path class="lnd" d="M70 455 L530 455"/><text class="small" x="74" y="450">90%</text><rect class="zone" x="24" y="652" width="512" height="196" rx="8"/><text class="bodyb" x="40" y="680">누적 기여율 80% 이상</text><text class="small" x="40" y="698">PC2까지 78%, PC3까지 88%</text><rect class="focal" x="436" y="666" width="84" height="32" rx="6"/><text class="lab inv" x="478" y="687" text-anchor="middle">3개</text><text class="bodyb" x="40" y="726">누적 기여율 90% 이상</text><text class="small" x="40" y="744">PC4까지 96%</text><rect class="node" x="436" y="712" width="84" height="32" rx="6"/><text class="lab" x="478" y="733" text-anchor="middle">4개</text><text class="bodyb" x="40" y="772">고유값 1 이상</text><text class="small" x="40" y="790">PC1만 3.0, PC2는 0.9</text><rect class="node" x="436" y="758" width="84" height="32" rx="6"/><text class="lab" x="478" y="779" text-anchor="middle">1개</text><text class="bodyb" x="40" y="818">스크리 엘보 직전까지</text><text class="small" x="40" y="836">PC2에서 꺾인다</text><rect class="node" x="436" y="804" width="84" height="32" rx="6"/><text class="lab" x="478" y="825" text-anchor="middle">1개</text><text class="bodyb" x="24" y="876">기준마다 답이 다르다 → 최종 개수는 분석가가 판단</text><text class="small" x="24" y="896">고유값 = Standard deviation의 제곱 (합 5.0 = 변수 수)</text>
</svg>
