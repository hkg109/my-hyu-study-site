class="small" x="44" y="485">5편 · 1장</text><text class="body" x="44" y="507">파일 시스템 관리</text><rect class="node" x="282" y="464" width="240" height="54" rx="6"/><text class="small" x="296" y="485">6편 · 2장</text><text class="body" x="296" y="507">셸</text><rect class="node" x="30" y="526" width="240" height="54" rx="6"/><text class="small" x="44" y="547">7편 · 3장</text><text class="body" x="44" y="569">프로세스 관리</text><rect class="node" x="282" y="526" width="240" height="54" rx="6"/><text class="small" x="296" y="547">8편 · 4장</text><text class="body" x="296" y="569">에디터 vi/vim</text><rect class="node" x="30" y="588" width="240" height="54" rx="6"/><text class="small" x="44" y="609">9편 · 5장</text><text class="body" x="44" y="631">소프트웨어 설치</text><rect class="node" x="282" y="588" width="240" height="54" rx="6"/><text class="small" x="296" y="609">10편 · 6장</text><text class="body" x="296" y="631">장치 설정</text><rect class="zone" x="16" y="674" width="528" height="172" rx="8"/><text class="lab" x="30" y="698">3과목 리눅스 활용 · 최소 8문항</text><rect class="node" x="30" y="710" width="240" height="54" rx="6"/><text class="small" x="44" y="731">11편 · 1장</text><text class="body" x="44" y="753">X 윈도우</text><rect class="node" x="282" y="710" width="240" height="54" rx="6"/><text class="small" x="296" y="731">12편 · 2장</text><text class="body" x="296" y="753">네트워크 기초·서브네팅</text><rect class="node" x="30" y="772" width="240" height="54" rx="6"/><text class="small" x="44" y="793">13편 · 2장</text><text class="body" x="44" y="815">네트워크 서비스</text><rect class="node" x="282" y="772" width="240" height="54" rx="6"/><text class="small" x="296" y="793">14편 · 3장</text><text class="body" x="296" y="815">클러스터·가상화·클라우드</text><rect class="focal" x="24" y="862" width="512" height="66" rx="6"/><text class="name inv" x="280" y="890" text-anchor="middle">합격 = 평균 60점 이상 (36문항 이상)</text><text class="body inv" x="280" y="914" text-anchor="middle">+ 어느 과목도 40점 미만(과락)이 없을 것</text><text class="lab" x="24" y="962">추천 공부