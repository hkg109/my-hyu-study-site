<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 894" role="img" aria-labelledby="adsp-l06a-stratified-cluster-title adsp-l06a-stratified-cluster-desc">
  <title id="adsp-l06a-stratified-cluster-title">층화 추출과 군집 추출</title>
  <desc id="adsp-l06a-stratified-cluster-desc">위: 층화 추출. 같은 모양만 모인 세 층에서 각각 두 개씩 무작위로 뽑아 표본을 만든다. 층 안은 동질, 층 사이는 이질이다. 아래: 군집 추출. 여러 모양이 섞인 네 반 가운데 2반과 4반을 골라 그 반 전체를 표본으로 삼는다. 군집 안은 이질, 군집 사이는 동질이다.</desc>
  <defs><marker id="adsp-l06a-stratified-cluster-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l06a-stratified-cluster-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l06a-stratified-cluster-a)}.flow.both{marker-start:url(#adsp-l06a-stratified-cluster-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l06a-stratified-cluster-m)}.dash.both{marker-start:url(#adsp-l06a-stratified-cluster-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="894"/>
  <style>.ax{stroke:#1d1d1a;stroke-width:1.5;fill:none}.grid{stroke:#b9b6ac;stroke-width:1;stroke-dasharray:3 4;fill:none}.cv{stroke:#1d1d1a;stroke-width:2.2;fill:none}.cvm{stroke:#65645e;stroke-width:2;fill:none;stroke-dasharray:7 5}.dot{fill:#1d1d1a}.dotm{fill:#65645e}.dotl{fill:#f7f6f2;stroke:#1d1d1a;stroke-width:1.5}.shd{fill:#1d1d1a}.shl{fill:#c9c5b9}.shs{fill:#e4e1d8}.ln{stroke:#1d1d1a;stroke-width:1.6;fill:none}.lnm{stroke:#65645e;stroke-width:1.4;fill:none}.lnd{stroke:#1d1d1a;stroke-width:1.6;stroke-dasharray:6 4;fill:none}.lnt{stroke:#1d1d1a;stroke-width:2;stroke-dasharray:2 3;fill:none}.thick{stroke:#1d1d1a;stroke-width:3;fill:none}.tick{font:400 12.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.bodyb{font:700 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 19px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style><text class="tag" x="24" y="40">ADsP · 3과목 2장 01 · 표본추출</text><text class="title" x="24" y="74">층화 추출과 군집 추출</text><text class="subtitle" x="24" y="104">같은 모양 = 같은 특성. 층은 안이 같고, 군집은 안이 섞여 있다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="zone" x="16" y="152" width="528" height="328" rx="8"/><text class="small" x="28" y="172">① 층화 추출 (Stratified)</text><rect class="node" x="28" y="204" width="330" height="44" rx="6"/><text class="lab" x="42" y="231">층 1</text><circle class="node" cx="100" cy="226" r="7" style="stroke:#1d1d1a"/><circle class="focal" cx="131" cy="226" r="7"/><circle class="node" cx="162" cy="226" r="7" style="stroke:#1d1d1a"/><circle class="node" cx="193" cy="226" r="7" style="stroke:#1d1d1a"/><circle class="node" cx="224" cy="226" r="7" style="stroke:#1d1d1a"/><circle class="focal" cx="255" cy="226" r="7"/><circle class="node" cx="286" cy="226" r="7" style="stroke:#1d1d1a"/><circle class="node" cx="317" cy="226" r="7" style="stroke:#1d1d1a"/><path class="flow" d="M358 226 L404 226"/><rect class="node" x="28" y="258" width="330" height="44" rx="6"/><text class="lab" x="42" y="285">층 2</text><rect class="node" x="93.5" y="273.5" width="13" height="13" style="stroke:#1d1d1a"/><rect class="node" x="124.5" y="273.5" width="13" height="13" style="stroke:#1d1d1a"/><rect class="focal" x="155.5" y="273.5" width="13" height="13"/><rect class="node" x="186.5" y="273.5" width="13" height="13" style="stroke:#1d1d1a"/><rect class="node" x="217.5" y="273.5" width="13" height="13" style="stroke:#1d1d1a"/><rect class="node" x="248.5" y="273.5" width="13" height="13" style="stroke:#1d1d1a"/><rect class="focal" x="279.5" y="273.5" width="13" height="13"/><rect class="node" x="310.5" y="273.5" width="13" height="13" style="stroke:#1d1d1a"/><path class="flow" d="M358 280 L404 280"/><rect class="node" x="28" y="312" width="330" height="44" rx="6"/><text class="lab" x="42" y="339">층 3</text><path class="focal" d="M100 326 L108 340 L92 340 Z"/><path class="node" d="M131 326 L139 340 L123 340 Z" style="stroke:#1d1d1a"/><path class="node" d="M162 326 L170 340 L154 340 Z" style="stroke:#1d1d1a"/><path class="node" d="M193 326 L201 340 L185 340 Z" style="stroke:#1d1d1a"/><path class="focal" d="M224 326 L232 340 L216 340 Z"/><path class="node" d="M255 326 L263 340 L247 340 Z" style="stroke:#1d1d1a"/><path class="node" d="M286 326 L294 340 L278 340 Z" style="stroke:#1d1d1a"/><path class="node" d="M317 326 L325 340 L309 340 Z" style="stroke:#1d1d1a"/><path class="flow" d="M358 334 L404 334"/><text class="small" x="381" y="194" text-anchor="middle">층마다 무작위</text><rect class="deep" x="404" y="204" width="128" height="152" rx="6"/><text class="name" x="468" y="228" text-anchor="middle">표본</text><circle class="focal" cx="448" cy="260" r="7"/><circle class="focal" cx="488" cy="260" r="7"/><rect class="focal" x="441.5" y="285.5" width="13" height="13"/><rect class="focal" x="481.5" y="285.5" width="13" height="13"/><path class="focal" d="M448 316 L456 330 L440 330 Z"/><path class="focal" d="M488 316 L496 330 L480 330 Z"/><text class="bodyb" x="32" y="388">층 안: 동질 — 한 층에는 같은 모양만</text><text class="bodyb" x="32" y="412">층 사이: 이질 — 층마다 모양이 다르다</text><text class="body" x="32" y="438">→ 모든 층에서 조금씩 뽑아 대표성을 높인다</text><text class="small" x="32" y="462">(층 크기에 비례해 뽑으면 비례 층화 추출)</text><rect class="zone" x="16" y="498" width="528" height="326" rx="8"/><text class="small" x="28" y="518">② 군집(집락) 추출 (Cluster)</text><rect class="node" x="28" y="550" width="76" height="152" rx="6"/><text class="lab" x="66" y="572" text-anchor="middle">반 1</text><circle class="node" cx="52" cy="598" r="7" style="stroke:#1d1d1a"/><rect class="node" x="73.5" y="591.5" width="13" height="13" style="stroke:#1d1d1a"/><path class="node" d="M52 620 L60 634 L44 634 Z" style="stroke:#1d1d1a"/><path class="node" d="M80 620 L88 634 L72 634 Z" style="stroke:#1d1d1a"/><circle class="node" cx="52" cy="658" r="7" style="stroke:#1d1d1a"/><rect class="node" x="73.5" y="651.5" width="13" height="13" style="stroke:#1d1d1a"/><text class="small" x="66" y="692" text-anchor="middle">제외</text><rect class="deep" x="112" y="550" width="76" height="152" rx="6"/><rect class="thick" x="112" y="550" width="76" height="152" rx="6"/><text class="lab" x="150" y="572" text-anchor="middle">반 2</text><rect class="focal" x="129.5" y="591.5" width="13" height="13"/><circle class="focal" cx="164" cy="598" r="7"/><path class="focal" d="M136 620 L144 634 L128 634 Z"/><circle class="focal" cx="164" cy="628" r="7"/><rect class="focal" x="129.5" y="651.5" width="13" height="13"/><path class="focal" d="M164 650 L172 664 L156 664 Z"/><text class="lab" x="150" y="692" text-anchor="middle">선택</text><rect class="node" x="196" y="550" width="76" height="152" rx="6"/><text class="lab" x="234" y="572" text-anchor="middle">반 3</text><path class="node" d="M220 590 L228 604 L212 604 Z" style="stroke:#1d1d1a"/><rect class="node" x="241.5" y="591.5" width="13" height="13" style="stroke:#1d1d1a"/><circle class="node" cx="220" cy="628" r="7" style="stroke:#1d1d1a"/><rect class="node" x="241.5" y="621.5" width="13" height="13" style="stroke:#1d1d1a"/><path class="node" d="M220 650 L228 664 L212 664 Z" style="stroke:#1d1d1a"/><circle class="node" cx="248" cy="658" r="7" style="stroke:#1d1d1a"/><text class="small" x="234" y="692" text-anchor="middle">제외</text><rect class="deep" x="280" y="550" width="76" height="152" rx="6"/><rect class="thick" x="280" y="550" width="76" height="152" rx="6"/><text class="lab" x="318" y="572" text-anchor="middle">반 4</text><circle class="focal" cx="304" cy="598" r="7"/><path class="focal" d="M332 590 L340 604 L324 604 Z"/><rect class="focal" x="297.5" y="621.5" width="13" height="13"/><rect class="focal" x="325.5" y="621.5" width="13" height="13"/><circle class="focal" cx="304" cy="658" r="7"/><path class="focal" d="M332 650 L340 664 L324 664 Z"/><text class="lab" x="318" y="692" text-anchor="middle">선택</text><path class="flow" d="M364 626 L404 626"/><text class="small" x="384" y="540" text-anchor="middle">고른 반 전체</text><rect class="deep" x="404" y="550" width="128" height="152" rx="6"/><text class="name" x="468" y="574" text-anchor="middle">표본</text><rect class="focal" x="425.5" y="603.5" width="13" height="13"/><circle class="focal" cx="456" cy="610" r="7"/><path class="focal" d="M480 602 L488 616 L472 616 Z"/><circle class="focal" cx="504" cy="610" r="7"/><rect class="focal" x="425.5" y="633.5" width="13" height="13"/><path class="focal" d="M456 632 L464 646 L448 646 Z"/><circle class="focal" cx="480" cy="640" r="7"/><path class="focal" d="M504 632 L512 646 L496 646 Z"/><rect class="focal" x="425.5" y="663.5" width="13" height="13"/><rect class="focal" x="449.5" y="663.5" width="13" height="13"/><circle class="focal" cx="480" cy="670" r="7"/><path class="focal" d="M504 662 L512 676 L496 676 Z"/><text class="bodyb" x="32" y="732">군집 안: 이질 — 한 반에 여러 모양이 섞임</text><text class="bodyb" x="32" y="756">군집 사이: 동질 — 반끼리 구성이 비슷하다</text><text class="body" x="32" y="782">→ 일부 군집만 골라 그 안을 조사해 비용을 줄인다</text><text class="small" x="32" y="806">(고른 군집 안에서 다시 뽑기도 한다)</text><circle class="focal" cx="34" cy="845" r="7"/><text class="small" x="48" y="850">검은 도형 = 표본으로 뽑힘</text><circle class="node" style="stroke:#1d1d1a" cx="246" cy="845" r="7"/><text class="small" x="260" y="850">흰 도형 = 뽑히지 않음</text><text class="small" x="24" y="874">도형 모양(○ □ △) = 원소의 특성 (예: 학년, 성적대)</text>
</svg>
