<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 840" role="img" aria-labelledby="adsp-l05b-melt-cast-title adsp-l05b-melt-cast-desc">
  <title id="adsp-l05b-melt-cast-title">reshape: melt와 cast</title>
  <desc id="adsp-l05b-melt-cast-desc">학생, 국어, 영어 열을 가진 넓은 표(민수 80·70, 지아 90·60)를 melt(df, id = "학생")로 녹이면 학생, variable, value 세 열의 긴 표 네 행이 된다. 긴 표를 cast(md, 학생 ~ variable)로 짜면 원래 넓은 표로 돌아가고, cast(md, variable ~ ., mean)으로 짜면 국어 평균 85, 영어 평균 65인 요약 표가 된다.</desc>
  <defs><marker id="adsp-l05b-melt-cast-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l05b-melt-cast-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l05b-melt-cast-a)}.flow.both{marker-start:url(#adsp-l05b-melt-cast-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l05b-melt-cast-m)}.dash.both{marker-start:url(#adsp-l05b-melt-cast-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="840"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 1장 · 데이터 마트</text><text class="title" x="24" y="74">reshape: melt로 녹이고 cast로 다시 짠다</text><text class="subtitle" x="24" y="104">넓은 표 → 긴 표(식별자·변수·값) → 원하는 모양의 요약 표</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="lab" x="24" y="160">① 넓은 표 (학생마다 한 행)</text><rect class="cellh" x="140" y="172" width="100" height="34"/><text class="lab" x="190" y="194" text-anchor="middle">학생</text><rect class="cellh" x="240" y="172" width="90" height="34"/><text class="lab" x="285" y="194" text-anchor="middle">국어</text><rect class="cellh" x="330" y="172" width="90" height="34"/><text class="lab" x="375" y="194" text-anchor="middle">영어</text><rect class="cell" x="140" y="206" width="100" height="34"/><text class="task" x="190" y="228" text-anchor="middle">민수</text><rect class="cell" x="240" y="206" width="90" height="34"/><text class="task" x="285" y="228" text-anchor="middle">80</text><rect class="cell" x="330" y="206" width="90" height="34"/><text class="task" x="375" y="228" text-anchor="middle">70</text><rect class="cell" x="140" y="240" width="100" height="34"/><text class="task" x="190" y="262" text-anchor="middle">지아</text><rect class="cell" x="240" y="240" width="90" height="34"/><text class="task" x="285" y="262" text-anchor="middle">90</text><rect class="cell" x="330" y="240" width="90" height="34"/><text class="task" x="375" y="262" text-anchor="middle">60</text><path class="flow" d="M280 280 L280 332"/><rect class="mask" x="190.5" y="295" width="179.0" height="22" rx="4"/><text class="monos" x="280" y="311" text-anchor="middle">melt(df, id = "학생")</text><text class="lab" x="24" y="358">② 긴 표 (관측 하나가 한 행)</text><text class="small" x="185" y="384" text-anchor="middle">식별자(id)</text><text class="small" x="285" y="384" text-anchor="middle">변수</text><text class="small" x="380" y="384" text-anchor="middle">값</text><rect class="cellh" x="135" y="392" width="100" height="32"/><text class="lab" x="185" y="413" text-anchor="middle">학생</text><rect class="cellh" x="235" y="392" width="100" height="32"/><text class="lab" x="285" y="413" text-anchor="middle">variable</text><rect class="cellh" x="335" y="392" width="90" height="32"/><text class="lab" x="380" y="413" text-anchor="middle">value</text><rect class="cell" x="135" y="424" width="100" height="32"/><text class="task" x="185" y="445" text-anchor="middle">민수</text><rect class="cell" x="235" y="424" width="100" height="32"/><text class="task" x="285" y="445" text-anchor="middle">국어</text><rect class="cell" x="335" y="424" width="90" height="32"/><text class="task" x="380" y="445" text-anchor="middle">80</text><rect class="cell" x="135" y="456" width="100" height="32"/><text class="task" x="185" y="477" text-anchor="middle">지아</text><rect class="cell" x="235" y="456" width="100" height="32"/><text class="task" x="285" y="477" text-anchor="middle">국어</text><rect class="cell" x="335" y="456" width="90" height="32"/><text class="task" x="380" y="477" text-anchor="middle">90</text><rect class="cell" x="135" y="488" width="100" height="32"/><text class="task" x="185" y="509" text-anchor="middle">민수</text><rect class="cell" x="235" y="488" width="100" height="32"/><text class="task" x="285" y="509" text-anchor="middle">영어</text><rect class="cell" x="335" y="488" width="90" height="32"/><text class="task" x="380" y="509" text-anchor="middle">70</text><rect class="cell" x="135" y="520" width="100" height="32"/><text class="task" x="185" y="541" text-anchor="middle">지아</text><rect class="cell" x="235" y="520" width="100" height="32"/><text class="task" x="285" y="541" text-anchor="middle">영어</text><rect class="cell" x="335" y="520" width="90" height="32"/><text class="task" x="380" y="541" text-anchor="middle">60</text><path class="flow" d="M280 558 V574 H140 V622"/><path class="flow" d="M280 574 H420 V622"/><rect class="mask" x="34.4" y="587" width="211.3" height="22" rx="4"/><text class="monos" x="140" y="603" text-anchor="middle">cast(md, 학생 ~ variable)</text><rect class="mask" x="299.2" y="587" width="241.7" height="22" rx="4"/><text class="monos" x="420" y="603" text-anchor="middle">cast(md, variable ~ ., mean)</text><text class="lab" x="140" y="636" text-anchor="middle">③ 원래 넓은 표로 복원</text><text class="lab" x="420" y="636" text-anchor="middle">③ 과목별 평균으로 요약</text><rect class="cellh" x="30" y="650" width="80" height="32"/><text class="lab" x="70" y="671" text-anchor="middle">학생</text><rect class="cellh" x="110" y="650" width="70" height="32"/><text class="lab" x="145" y="671" text-anchor="middle">국어</text><rect class="cellh" x="180" y="650" width="70" height="32"/><text class="lab" x="215" y="671" text-anchor="middle">영어</text><rect class="cell" x="30" y="682" width="80" height="32"/><text class="task" x="70" y="703" text-anchor="middle">민수</text><rect class="cell" x="110" y="682" width="70" height="32"/><text class="task" x="145" y="703" text-anchor="middle">80</text><rect class="cell" x="180" y="682" width="70" height="32"/><text class="task" x="215" y="703" text-anchor="middle">70</text><rect class="cell" x="30" y="714" width="80" height="32"/><text class="task" x="70" y="735" text-anchor="middle">지아</text><rect class="cell" x="110" y="714" width="70" height="32"/><text class="task" x="145" y="735" text-anchor="middle">90</text><rect class="cell" x="180" y="714" width="70" height="32"/><text class="task" x="215" y="735" text-anchor="middle">60</text><rect class="cellh" x="330" y="650" width="100" height="32"/><text class="lab" x="380" y="671" text-anchor="middle">variable</text><rect class="cellh" x="430" y="650" width="80" height="32"/><text class="lab" x="470" y="671" text-anchor="middle">(all)</text><rect class="cell" x="330" y="682" width="100" height="32"/><text class="task" x="380" y="703" text-anchor="middle">국어</text><rect class="cellf" x="430" y="682" width="80" height="32"/><text class="task inv" x="470" y="703" text-anchor="middle">85</text><rect class="cell" x="330" y="714" width="100" height="32"/><text class="task" x="380" y="735" text-anchor="middle">영어</text><rect class="cellf" x="430" y="714" width="80" height="32"/><text class="task inv" x="470" y="735" text-anchor="middle">65</text><text class="small" x="24" y="780">melt는 표를 길게 펴고, cast는 공식(행 ~ 열)과 요약 함수로 다시 접는다.</text><path class="flow" d="M24 810 H54"/><text class="small" x="62" y="815">함수 적용</text><rect class="cellh" x="138.32" y="802" width="22" height="16" rx="3"/><text class="small" x="168.32" y="815">열 이름</text><rect class="focal" x="231.14" y="802" width="22" height="16" rx="3"/><text class="small" x="261.14" y="815">요약된 값 (평균)</text>
</svg>
