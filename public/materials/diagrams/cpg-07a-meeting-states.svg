<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" role="img" aria-labelledby="cpg-07a-meeting-states-title cpg-07a-meeting-states-desc">
  <title id="cpg-07a-meeting-states-title">회의록 상태와 편집 가능 여부</title>
  <desc id="cpg-07a-meeting-states-desc">DRAFT에서는 지정 편집자와 회장단이 편집하고, 생성자나 회장단이 CONFIRMED로 확정하면 편집자도 저장할 수 없으며, ARCHIVED는 목록에서 숨는 읽기 전용이고, CONFIRMED를 DRAFT로 되돌리는 것은 회장단만 사유를 남겨 할 수 있다는 상태 그림.</desc>
  <defs><marker id="cpg-07a-meeting-states-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-07a-meeting-states-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-07a-meeting-states-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-07a-meeting-states-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="640"/>
  <text class="tag" x="24" y="40">06-3 · 회의록</text><text class="title" x="24" y="74">회의록 상태와 편집 가능 여부</text><text class="subtitle" x="24" y="104">상태가 바뀌면 재구독 신호로 편집기를 읽기 전용으로 바꾼다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <path class="flow" d="M150 232 V304"/><rect class="mask" x="158.0" y="258" width="38.5" height="21" rx="4"/><text class="lab" x="164" y="273">확정</text>
  <path class="flow" d="M150 384 V456"/><rect class="mask" x="158.0" y="410" width="38.5" height="21" rx="4"/><text class="lab" x="164" y="425">보관</text>
  <path class="flow" d="M276 344 H340 Q348 344 348 336 V200 Q348 192 340 192 H276"/>
  <rect class="mask" x="356.0" y="259" width="64.9" height="21" rx="4"/><text class="lab" x="362" y="274">되돌리기</text>
  <rect class="node" x="24" y="152" width="252" height="80" rx="6"/><text class="code" x="150" y="178.0" text-anchor="middle">DRAFT</text><text class="small" x="150" y="197.6" text-anchor="middle">편집자 · 회장단 편집</text><text class="small" x="150" y="216.6" text-anchor="middle">생성 시 기본값</text>
  <rect class="focal" x="24" y="304" width="252" height="80" rx="6"/><text class="code inv" x="150" y="330.0" text-anchor="middle">CONFIRMED</text><text class="small inv" x="150" y="349.6" text-anchor="middle">읽기 전용</text><text class="small inv" x="150" y="368.6" text-anchor="middle">편집자도 저장 불가</text>
  <rect class="deep" x="24" y="456" width="252" height="80" rx="6"/><text class="code" x="150" y="482.0" text-anchor="middle">ARCHIVED</text><text class="small" x="150" y="501.6" text-anchor="middle">읽기 전용</text><text class="small" x="150" y="520.6" text-anchor="middle">목록에서 숨김</text>
  <rect class="outside" x="408" y="236" width="128" height="76" rx="6"/><text class="lab" x="472" y="259.8" text-anchor="middle">회장단만</text><text class="small" x="472" y="279.1" text-anchor="middle">사유를</text><text class="small" x="472" y="298.1" text-anchor="middle">Activity Log에</text>
  <text class="small" x="280" y="572" text-anchor="middle">확정은 생성자 또는 회장단 · 확정 시 최종 Snapshot을 만든다</text>
  <rect class="focal" x="24" y="604" width="22" height="16" rx="3"/><text class="small" x="54" y="617">편집 잠금</text><rect class="deep" x="132.97" y="604" width="22" height="16" rx="3"/><text class="small" x="162.97" y="617">보관</text><rect class="outside" x="211.43" y="604" width="22" height="16" rx="3"/><text class="small" x="241.43" y="617">예외 권한</text>
</svg>
