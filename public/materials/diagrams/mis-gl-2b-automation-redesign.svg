<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 686" role="img" aria-labelledby="mis-gl-2b-automation-redesign-title mis-gl-2b-automation-redesign-desc">
  <title id="mis-gl-2b-automation-redesign-title">자동화 vs 프로세스 재설계</title>
  <desc id="mis-gl-2b-automation-redesign-desc">왼쪽은 접수, 확인, 승인의 순서가 그대로이고 각 단계가 빨라지는 자동화, 오른쪽은 같은 주문 정보를 여러 부서가 동시에 확인해 순차 단계가 병렬로 바뀌는 재설계를 비교하고, 아래에 IT가 가능하게 한 새 프로세스 사례를 둔 비교 그림</desc>
  <defs><marker id="mis-gl-2b-automation-redesign-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2b-automation-redesign-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2b-automation-redesign-a)}.flow.both{marker-start:url(#mis-gl-2b-automation-redesign-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2b-automation-redesign-m)}.dash.both{marker-start:url(#mis-gl-2b-automation-redesign-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="686"/>
  <text class="tag" x="24" y="40">2장 · 2-1 비즈니스 프로세스와 IT ②</text><text class="title" x="24" y="74">자동화 vs 프로세스 재설계</text><text class="subtitle" x="24" y="104">업무 순서가 그대로면 자동화, 정보 흐름이 바뀌어 순서 자체가 달라지면</text><text class="subtitle" x="24" y="124">재설계다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="18" y="172" width="256" height="330" rx="8"/><text class="small" x="30" y="192">Automation · 자동화</text><rect class="zone" x="286" y="172" width="256" height="330" rx="8"/><text class="small" x="298" y="192">Redesign · 재설계</text><rect class="node" x="34" y="206" width="224" height="46" rx="6"/><text class="name" x="146" y="234.5" text-anchor="middle">주문 접수</text><path class="flow" d="M146 252 L146 278"/><rect class="node" x="34" y="278" width="224" height="46" rx="6"/><text class="name" x="146" y="306.5" text-anchor="middle">재고 확인</text><path class="flow" d="M146 324 L146 350"/><rect class="node" x="34" y="350" width="224" height="46" rx="6"/><text class="name" x="146" y="378.5" text-anchor="middle">신용 승인</text><path class="flow" d="M146 396 L146 422"/><rect class="node" x="34" y="422" width="224" height="46" rx="6"/><text class="name" x="146" y="450.5" text-anchor="middle">출고</text><rect class="node" x="302" y="206" width="224" height="46" rx="6"/><text class="name" x="414" y="234.5" text-anchor="middle">주문 접수</text><rect class="node" x="302" y="314" width="107" height="46" rx="6"/><text class="name" x="355.5" y="342.5" text-anchor="middle">재고 확인</text><rect class="node" x="419" y="314" width="107" height="46" rx="6"/><text class="name" x="472.5" y="342.5" text-anchor="middle">신용 승인</text><path class="flow" d="M355.5 252 L355.5 314"/><rect class="mask" x="326.8" y="272" width="57.3" height="22" rx="4"/><text class="lab" x="355.5" y="288" text-anchor="middle">동시에</text><path class="flow" d="M472.5 252 L472.5 314"/><rect class="node" x="302" y="422" width="224" height="46" rx="6"/><text class="name" x="414" y="450.5" text-anchor="middle">출고</text><path class="flow" d="M355.5 360 L355.5 422"/><path class="flow" d="M472.5 360 L472.5 422"/><text class="small" x="28" y="494">순서 그대로 · 단계만 빨라짐</text><text class="small" x="296" y="494">순차 → 병렬 · 대기 시간 제거</text><rect class="node" x="24" y="522" width="512" height="89.5" rx="6"/><text class="small" x="280" y="548" text-anchor="middle">IT가 가능하게 한 완전히 새로운 프로세스</text><text class="name" x="280" y="569" text-anchor="middle">iTunes 노래 다운로드 · Kindle 원클릭 구매</text><text class="body" x="280" y="596" text-anchor="middle">이전에는 없던 업무 흐름 = 재설계의 극단</text><path class="flow" d="M24 641.5 H54"/><text class="small" x="62" y="646.5">흐름·데이터 제공</text><rect class="zone" x="191.94875000000002" y="633.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="646.5">범위·묶음</text>
</svg>
