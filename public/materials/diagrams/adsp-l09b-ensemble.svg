<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 950" width="560" height="950" role="img" aria-labelledby="adsp-l09b-ensemble-title adsp-l09b-ensemble-desc">
  <title id="adsp-l09b-ensemble-title">배깅과 부스팅</title>
  <desc id="adsp-l09b-ensemble-desc">위쪽은 원 데이터에서 복원 추출한 부트스트랩 표본 세 개로 나무 세 그루를 따로 학습한 뒤 보팅으로 결합하는 병렬 구조의 배깅과, 분리마다 변수를 무작위로 일부만 쓰는 랜덤 포레스트 설명이다. 아래쪽은 모델 1이 틀린 데이터에 가중치를 키워 모델 2와 모델 3을 차례로 학습하고 마지막에 가중 결합하는 순차 구조의 부스팅이다.</desc>
  <defs><marker id="adsp-l09b-ensemble-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l09b-ensemble-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l09b-ensemble-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.dasharrow{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l09b-ensemble-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#65645e;stroke-width:1.2;fill:none}.grid{stroke:#e4e1d8;stroke-width:1;fill:none}.axis{stroke:#1d1d1a;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.head{font:700 16px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.bodym{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.tiny{font:600 12px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="950"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 3장 · 앙상블</text><text class="title" x="24" y="74">배깅과 부스팅</text><text class="subtitle" x="24" y="104">병렬로 따로 만들어 투표하는가, 앞 모델의 실수를 보며 차례로</text><text class="subtitle" x="24" y="124">고쳐 가는가</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
<rect class="zone" x="16" y="174" width="528" height="344" rx="8"/><text class="head" x="32" y="202">배깅 (Bagging) · 병렬</text><text class="small" x="528" y="202" text-anchor="end">분산 감소</text><text class="tiny" x="207" y="230" text-anchor="middle">부트스트랩 표본 (복원 추출)</text><text class="tiny" x="337" y="230" text-anchor="middle">모델</text><rect class="node" x="32" y="298" width="92" height="60" rx="6"/><text class="lab" x="78" y="324" text-anchor="middle">원</text><text class="lab" x="78" y="343" text-anchor="middle">데이터</text><rect class="node" x="162" y="240" width="90" height="44" rx="6"/><text class="lab" x="207" y="268" text-anchor="middle">표본 1</text><rect class="deep" x="292" y="240" width="90" height="44" rx="6"/><text class="lab" x="337" y="268" text-anchor="middle">나무 1</text><path class="flow" d="M124 328 C143 328 143 262 162 262"/><path class="flow" d="M252 262 H292"/><path class="flow" d="M382 262 C401 262 401 328 420 328"/><rect class="node" x="162" y="306" width="90" height="44" rx="6"/><text class="lab" x="207" y="334" text-anchor="middle">표본 2</text><rect class="deep" x="292" y="306" width="90" height="44" rx="6"/><text class="lab" x="337" y="334" text-anchor="middle">나무 2</text><path class="flow" d="M124 328 C143 328 143 328 162 328"/><path class="flow" d="M252 328 H292"/><path class="flow" d="M382 328 C401 328 401 328 420 328"/><rect class="node" x="162" y="372" width="90" height="44" rx="6"/><text class="lab" x="207" y="400" text-anchor="middle">표본 3</text><rect class="deep" x="292" y="372" width="90" height="44" rx="6"/><text class="lab" x="337" y="400" text-anchor="middle">나무 3</text><path class="flow" d="M124 328 C143 328 143 394 162 394"/><path class="flow" d="M252 394 H292"/><path class="flow" d="M382 394 C401 394 401 328 420 328"/><rect class="focal" x="420" y="292" width="108" height="72" rx="6"/><text class="lab inv" x="474" y="320" text-anchor="middle">보팅</text><text class="tiny inv" x="474" y="340" text-anchor="middle">(다수결·평균)</text><path class="rule" d="M32 436 H528"/><text class="bodym" x="32" y="460">· 각 나무는 가지치기 없이 최대로 성장시킨다</text><text class="bodym" x="32" y="482">· 랜덤 포레스트 = 배깅 + 분리할 때마다 변수 일부만 무작위</text><text class="bodym" x="46" y="502">후보로 사용 → 나무끼리 덜 닮아 분산이 더 줄어든다</text><rect class="zone" x="16" y="534" width="528" height="370" rx="8"/><text class="head" x="32" y="562">부스팅 (Boosting) · 순차</text><text class="small" x="528" y="562" text-anchor="end">편향 감소</text><rect class="node" x="28" y="582" width="150" height="150" rx="6"/><text class="lab" x="103" y="608" text-anchor="middle">모델 1</text><circle class="deep" cx="46" cy="644" r="7"/><circle class="deep" cx="68.8" cy="644" r="7"/><path class="line" d="M63.8 639 L73.8 649 M73.8 639 L63.8 649"/><circle class="deep" cx="91.6" cy="644" r="7"/><circle class="deep" cx="114.4" cy="644" r="7"/><circle class="deep" cx="137.2" cy="644" r="7"/><path class="line" d="M132.2 639 L142.2 649 M142.2 639 L132.2 649"/><circle class="deep" cx="160" cy="644" r="7"/><text class="tiny" x="103" y="688" text-anchor="middle">모두 같은 가중치</text><text class="tiny" x="103" y="708" text-anchor="middle">2개 틀림 (×)</text><path class="flow" d="M180 644 H203"/><rect class="node" x="205" y="582" width="150" height="150" rx="6"/><text class="lab" x="280" y="608" text-anchor="middle">모델 2</text><circle class="deep" cx="223" cy="644" r="7"/><circle class="deep" cx="245.8" cy="644" r="12"/><circle class="deep" cx="268.6" cy="644" r="7"/><circle class="deep" cx="291.4" cy="644" r="7"/><path class="line" d="M286.4 639 L296.4 649 M296.4 639 L286.4 649"/><circle class="deep" cx="314.2" cy="644" r="12"/><circle class="deep" cx="337" cy="644" r="7"/><text class="tiny" x="280" y="688" text-anchor="middle">틀린 점 가중치 ↑</text><text class="tiny" x="280" y="708" text-anchor="middle">(큰 원) → 1개 틀림</text><path class="flow" d="M357 644 H380"/><rect class="node" x="382" y="582" width="150" height="150" rx="6"/><text class="lab" x="457" y="608" text-anchor="middle">모델 3</text><circle class="deep" cx="400" cy="644" r="7"/><circle class="deep" cx="422.8" cy="644" r="9"/><circle class="deep" cx="445.6" cy="644" r="7"/><circle class="deep" cx="468.4" cy="644" r="13"/><circle class="deep" cx="491.2" cy="644" r="9"/><circle class="deep" cx="514" cy="644" r="7"/><text class="tiny" x="457" y="688" text-anchor="middle">다시 틀린 점 ↑</text><text class="tiny" x="457" y="708" text-anchor="middle">남은 오류를 보완</text><rect class="focal" x="150" y="788" width="260" height="52" rx="6"/><text class="lab inv" x="280" y="810" text-anchor="middle">가중 결합</text><text class="tiny inv" x="280" y="829" text-anchor="middle">(잘한 모델에 큰 비중)</text><path class="dasharrow" d="M103 732 L200.4 788"/><path class="dasharrow" d="M280 732 L280 788"/><path class="dasharrow" d="M457 732 L359.7 788"/><text class="bodym" x="32" y="870">· 이상값을 계속 틀리면 가중치가 커져 이상값에 민감하다</text><text class="bodym" x="32" y="892">· 예: AdaBoost, GBM, XGBoost, LightGBM</text><path class="flow" d="M24 928 H54"/><text class="small" x="62" y="933">학습 순서·흐름</text><path class="dasharrow" d="M190 928 H220"/><text class="small" x="228" y="933">결과를 결합</text><circle class="deep" cx="350" cy="928" r="7"/><text class="small" x="364" y="933">데이터 (원 크기 = 가중치)</text>
</svg>
