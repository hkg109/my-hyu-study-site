<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 768" width="560" height="768" role="img" aria-labelledby="lm2-l01b-license-title lm2-l01b-license-desc">
  <title id="lm2-l01b-license-title">오픈소스 라이선스별 소스 공개 범위</title>
  <desc id="lm2-l01b-license-desc">위에서 아래로 카피레프트가 약해지는 순서로 GPL, LGPL, MPL, Apache 2.0, BSD, MIT를 나열했다. GPL은 결합한 프로그램 전체, LGPL은 수정한 라이브러리, MPL은 수정한 파일만 공개해야 하고, Apache, BSD, MIT는 공개 의무가 없다. Apache는 특허 사용권을 명시한다. 맨 아래 두 상자는 공개 의무가 있는 GPL·LGPL·MPL과 없는 Apache·BSD·MIT를 묶고, 화살표는 강한 카피레프트에서 허용적 라이선스로 가는 방향이다.</desc>
  <defs><marker id="lm2-l01b-license-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l01b-license-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l01b-license-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l01b-license-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="768"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 1과목 1장</text><text class="title" x="24" y="74">라이선스 — 무엇을 공개해야 하나</text><text class="subtitle" x="24" y="104">위에서 아래로 갈수록 공개 의무가 약해진다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="focal" x="24" y="160" width="132" height="64" rx="6"/><text class="name inv" x="90" y="199" text-anchor="middle">GPL</text><rect class="node" x="168" y="160" width="368" height="64" rx="6"/><text class="lab" x="184" y="187">결합·링크한 프로그램 전체</text><text class="small" x="184" y="210">가장 강한 카피레프트 · 리눅스 커널(v2)</text><rect class="deep" x="24" y="236" width="132" height="64" rx="6"/><text class="name" x="90" y="275" text-anchor="middle">LGPL</text><rect class="node" x="168" y="236" width="368" height="64" rx="6"/><text class="lab" x="184" y="263">수정한 라이브러리만</text><text class="small" x="184" y="286">동적 링크로 쓰기만 하면 공개 X</text><rect class="zone" x="24" y="312" width="132" height="64" rx="6"/><text class="name" x="90" y="351" text-anchor="middle">MPL</text><rect class="node" x="168" y="312" width="368" height="64" rx="6"/><text class="lab" x="184" y="339">수정한 파일만</text><text class="small" x="184" y="362">파일 단위 카피레프트 · Firefox</text><rect class="node" x="24" y="388" width="132" height="64" rx="6"/><text class="name" x="90" y="427" text-anchor="middle">Apache 2.0</text><rect class="node" x="168" y="388" width="368" height="64" rx="6"/><text class="lab" x="184" y="415">공개 의무 없음</text><text class="small" x="184" y="438">특허 사용권 명시 · NOTICE 유지</text><rect class="node" x="24" y="464" width="132" height="64" rx="6"/><text class="name" x="90" y="503" text-anchor="middle">BSD</text><rect class="node" x="168" y="464" width="368" height="64" rx="6"/><text class="lab" x="184" y="491">공개 의무 없음</text><text class="small" x="184" y="514">저작권 표시·면책 조항만 유지</text><rect class="node" x="24" y="540" width="132" height="64" rx="6"/><text class="name" x="90" y="579" text-anchor="middle">MIT</text><rect class="node" x="168" y="540" width="368" height="64" rx="6"/><text class="lab" x="184" y="567">공개 의무 없음</text><text class="small" x="184" y="590">가장 짧고 허용적 · X11</text><rect class="zone" x="24" y="620" width="248" height="40" rx="6"/><text class="lab" x="148" y="645" text-anchor="middle">공개 의무 O · GPL·LGPL·MPL</text><rect class="outside" x="288" y="620" width="248" height="40" rx="6"/><text class="lab" x="412" y="645" text-anchor="middle">공개 의무 X · Apache·BSD·MIT</text><path class="flow" d="M30 686 H530"/><text class="small" x="30" y="712">강한 카피레프트</text><text class="small" x="530" y="712" text-anchor="end">허용적(permissive)</text><rect class="focal" x="24" y="738" width="22" height="16" rx="3"/><text class="small" x="54" y="751">가장 강한 의무</text><rect class="zone" x="165.1" y="738" width="22" height="16" rx="3"/><text class="small" x="195.1" y="751">공개 의무 있음</text><rect class="outside" x="306.2" y="738" width="22" height="16" rx="3"/><text class="small" x="336.2" y="751">공개 의무 없음</text>
