<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 958" width="560" height="958" role="img" aria-labelledby="adsp-l01c-dw-flow-title adsp-l01c-dw-flow-desc">
  <title id="adsp-l01c-dw-flow-title">운영 DB에서 DW, 데이터 마트, 분석까지</title>
  <desc id="adsp-l01c-dw-flow-desc">원천 데이터 영역에 주문·고객·재고 OLTP DB와 로그·영상·SNS 같은 비정형 원천이 있다. OLTP 데이터는 추출되어 ODS에 임시 통합되고, 변환·적재를 거쳐 데이터 웨어하우스에 들어간다. DW는 주제지향·통합·시계열·비휘발 특징을 가지며 부서별 데이터 마트로 나뉘고, 데이터 마트는 OLAP·BI로 조회·분석된다. 오른쪽에는 원천 데이터를 원형 그대로 저장하는 데이터 레이크와 하둡의 HDFS, MapReduce가 있다.</desc>
  <defs><marker id="adsp-l01c-dw-flow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l01c-dw-flow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l01c-dw-flow-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l01c-dw-flow-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="958"/><text class="tag" x="24" y="40">ADsP · 1과목 1장</text><text class="title" x="24" y="74">데이터가 DW를 거쳐 분석되기까지</text><text class="subtitle" x="24" y="104">ETL → ODS → DW → DM → OLAP·BI, 옆길로 데이터 레이크</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="zone" x="16" y="154" width="528" height="106" rx="8"/><text class="lab" x="30" y="176">원천 데이터</text><rect class="node" x="30" y="188" width="100" height="58" rx="6"/><text class="small" x="80" y="210" text-anchor="middle">OLTP</text><text class="lab" x="80" y="234" text-anchor="middle">주문 DB</text><rect class="node" x="138" y="188" width="100" height="58" rx="6"/><text class="small" x="188" y="210" text-anchor="middle">OLTP</text><text class="lab" x="188" y="234" text-anchor="middle">고객 DB</text><rect class="node" x="246" y="188" width="100" height="58" rx="6"/><text class="small" x="296" y="210" text-anchor="middle">OLTP</text><text class="lab" x="296" y="234" text-anchor="middle">재고 DB</text><rect class="outside" x="384" y="188" width="146" height="58" rx="6"/><text class="small" x="457" y="210" text-anchor="middle">비정형 원천</text><text class="lab" x="457" y="234" text-anchor="middle">로그·영상·SNS</text><path class="flow" d="M188 260 V312"/><rect class="mask" x="154.27" y="275" width="67.46" height="22" rx="4"/><text class="lab" x="188" y="291" text-anchor="middle">추출 (E)</text><rect class="node" x="24" y="312" width="328" height="60" rx="6"/><text class="name" x="188" y="336" text-anchor="middle">ODS</text><text class="small" x="188" y="360" text-anchor="middle">적재 전 임시 통합 저장</text><path class="flow" d="M188 372 V426"/><rect class="mask" x="123.085" y="388" width="129.83" height="22" rx="4"/><text class="lab" x="188" y="404" text-anchor="middle">변환·적재 (T·L)</text><rect class="focal" x="24" y="426" width="328" height="120" rx="6"/><text class="small inv" x="188" y="452" text-anchor="middle">Data Warehouse</text><text class="name inv" x="188" y="478" text-anchor="middle">데이터 웨어하우스 (DW)</text><text class="body inv" x="188" y="506" text-anchor="middle">주제지향 · 통합 · 시계열 · 비휘발</text><text class="small inv" x="188" y="530" text-anchor="middle">적재 후 읽기 전용 (DB의 ‘변화’와 반대)</text><path class="flow" d="M102 546 V600"/><rect class="node" x="24" y="600" width="156" height="64" rx="6"/><text class="lab" x="102" y="626" text-anchor="middle">마케팅 DM</text><text class="small" x="102" y="650" text-anchor="middle">부서용 소규모 DW</text><path class="flow" d="M102 664 V718"/><path class="flow" d="M274 546 V600"/><rect class="node" x="196" y="600" width="156" height="64" rx="6"/><text class="lab" x="274" y="626" text-anchor="middle">영업 DM</text><text class="small" x="274" y="650" text-anchor="middle">부서용 소규모 DW</text><path class="flow" d="M274 664 V718"/><rect class="mask" x="109.45" y="562" width="157.1" height="22" rx="4"/><text class="lab" x="188" y="578" text-anchor="middle">부서·주제별로 떼어 냄</text><rect class="mask" x="147.25" y="680" width="81.5" height="22" rx="4"/><text class="lab" x="188" y="696" text-anchor="middle">조회·분석</text><rect class="node" x="24" y="718" width="328" height="64" rx="6"/><text class="name" x="188" y="744" text-anchor="middle">OLAP · BI</text><text class="small" x="188" y="768" text-anchor="middle">다차원 분석 · 리포트 · 대시보드</text><path class="flow" d="M460.0 260 V312"/><rect class="mask" x="417.225" y="275" width="85.55" height="22" rx="4"/><text class="lab" x="460" y="291" text-anchor="middle">원형 그대로</text><rect class="zone" x="384" y="312" width="152" height="352" rx="6"/><text class="small" x="460" y="338" text-anchor="middle">Data Lake</text><text class="name" x="460" y="362" text-anchor="middle">데이터 레이크</text><text class="body" x="460" y="392" text-anchor="middle">정형·반정형·</text><text class="body" x="460" y="414" text-anchor="middle">비정형 모두</text><text class="body" x="460" y="436" text-anchor="middle">원래 형태로</text><text class="body" x="460" y="458" text-anchor="middle">대량 저장</text><line class="rule" x1="400" y1="488" x2="520" y2="488"/><text class="lab" x="460" y="512" text-anchor="middle">하둡 연계</text><text class="body" x="460" y="540" text-anchor="middle">HDFS</text><text class="small" x="460" y="560" text-anchor="middle">분산 파일 저장</text><text class="body" x="460" y="594" text-anchor="middle">MapReduce</text><text class="small" x="460" y="614" text-anchor="middle">병렬 처리</text><rect class="deep" x="24" y="806" width="512" height="74" rx="6"/><text class="lab" x="40" y="836">함정 · DW에 ‘휘발성’·‘실시간 갱신’ 보기 → 오답</text><text class="lab" x="40" y="862">DM은 DW의 부분집합 (DW의 상위 개념이 아니다)</text><path class="flow" d="M24 910 H54"/><text class="small" x="62" y="915">데이터 흐름</text><rect class="focal" x="155.55" y="902" width="22" height="16" rx="3"/><text class="small" x="185.55" y="915">중심 저장소</text><rect class="outside" x="279.1" y="902" width="22" height="16" rx="3"/><text class="small" x="309.1" y="915">비정형 원천</text><rect class="zone" x="24" y="928" width="22" height="16" rx="3"/><text class="small" x="54" y="941">원천 묶음·별도 저장소</text><rect class="deep" x="219.1" y="928" width="22" height="16" rx="3"/><text class="small" x="249.1" y="941">시험 함정</text>
</svg>
