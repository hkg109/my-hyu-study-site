<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 584" role="img" aria-labelledby="mis-gl-2f-connection-scope-title mis-gl-2f-connection-scope-desc">
  <title id="mis-gl-2f-connection-scope-title">누구에게 열리고 무엇을 포함하나</title>
  <desc id="mis-gl-2f-connection-scope-desc">왼쪽은 직원만 쓰는 인트라넷을 허가된 외부 파트너까지 여는 엑스트라넷이 감싸는 접근 범위, 오른쪽은 인터넷으로 사고파는 전자상거래를 주요 비즈니스 프로세스 전체의 전자 비즈니스가 감싸는 업무 범위, 아래는 공공부문의 전자정부를 보여 주는 포함 관계 그림</desc>
  <defs><marker id="mis-gl-2f-connection-scope-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2f-connection-scope-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2f-connection-scope-a)}.flow.both{marker-start:url(#mis-gl-2f-connection-scope-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2f-connection-scope-m)}.dash.both{marker-start:url(#mis-gl-2f-connection-scope-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="584"/>
  <text class="tag" x="24" y="40">2장 · 2-4 인터넷 기반 연결 범위</text><text class="title" x="24" y="74">누구에게 열리고 무엇을 포함하나</text><text class="subtitle" x="24" y="104">Intranet ⊂ Extranet의 접근 범위, E-commerce ⊂ E-business의 업무</text><text class="subtitle" x="24" y="124">범위를 포함 관계로 본다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="24" y="172" width="246" height="230" rx="8"/><text class="name" x="36" y="200">Extranet</text><text class="body" x="36" y="224">+ 허가된 외부 파트너</text><rect class="node" x="38" y="272" width="218" height="112" rx="6"/><text class="small" x="147" y="309.25" text-anchor="middle">포함</text><text class="name" x="147" y="330.25" text-anchor="middle">Intranet</text><text class="body" x="147" y="357.25" text-anchor="middle">직원만 · 인터넷 표준 기반</text><rect class="zone" x="290" y="172" width="246" height="230" rx="8"/><text class="name" x="302" y="200">E-business</text><text class="body" x="302" y="224">주요 프로세스 전체를 디지털로</text><rect class="node" x="304" y="272" width="218" height="112" rx="6"/><text class="small" x="413" y="309.25" text-anchor="middle">포함</text><text class="name" x="413" y="330.25" text-anchor="middle">E-commerce</text><text class="body" x="413" y="357.25" text-anchor="middle">인터넷으로 사고팔기</text><rect class="outside" x="24" y="420" width="512" height="89.5" rx="6"/><text class="small" x="280" y="446" text-anchor="middle">E-government · 공공부문</text><text class="name" x="280" y="467" text-anchor="middle">전자정부</text><text class="body" x="280" y="494" text-anchor="middle">시민·직원·기업에 공공 정보·서비스 제공</text><rect class="outside" x="24" y="531.5" width="22" height="16" rx="3"/><text class="small" x="54" y="544.5">조직 밖 주체</text><rect class="zone" x="152.892" y="531.5" width="22" height="16" rx="3"/><text class="small" x="182.892" y="544.5">범위·묶음</text>
</svg>
