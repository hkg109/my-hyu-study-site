<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-labelledby="sci1-5-03-resultant-title sci1-5-03-resultant-desc">
  <title id="sci1-5-03-resultant-title">나란한 두 힘의 합력</title>
  <desc id="sci1-5-03-resultant-desc">세 줄로 나눈 그림. 첫째 줄: 상자에 오른쪽으로 50 N과 30 N이 작용해 합력은 오른쪽 80 N. 둘째 줄: 오른쪽 50 N, 왼쪽 30 N이 작용해 합력은 오른쪽 20 N. 셋째 줄: 오른쪽 5 N, 왼쪽 5 N이 작용해 합력은 0이고 힘의 평형이다. 각 줄 오른쪽 상자에 합력 화살표를 굵게 그렸다. 화살표 길이는 10 N당 4 px 비율이다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="560"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">나란한 두 힘의 합력</text><text class="subtitle" x="24.0" y="104.0">같은 방향은 더하고, 반대 방향은 차를 구하고, 같은 크기로 맞서면 0</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="150.0" width="512.0" height="112.0" rx="6"/><text class="name" x="40.0" y="174.0">같은 방향</text><rect class="solid" x="130.0" y="190.0" width="44.0" height="40.0" rx="3"/><line x1="174.0" y1="202.0" x2="263.0" y2="202.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M274.0,202.0 L263.0,206.9 L263.0,197.1 Z" fill="#1d1d1a"/><text class="small" x="280.0" y="207.0">50 N</text><line x1="174.0" y1="220.0" x2="223.0" y2="220.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M234.0,220.0 L223.0,224.9 L223.0,215.1 Z" fill="#1d1d1a"/><text class="small" x="240.0" y="225.0">30 N</text><text class="lab" x="40.0" y="248.0">50 N + 30 N = 80 N</text><line class="thin" x1="322.0" y1="160.0" x2="322.0" y2="252.0"/><rect class="solid" x="336.0" y="190.0" width="36.0" height="40.0" rx="3"/><line x1="372.0" y1="210.0" x2="501.0" y2="210.0" stroke="#1d1d1a" stroke-width="5"/><path d="M516.0,210.0 L501.0,216.8 L501.0,203.2 Z" fill="#1d1d1a"/><text class="small" x="336.0" y="174.0">합력</text><text class="lab" x="524.0" y="248.0" text-anchor="end">오른쪽 80 N</text><rect class="zone" x="24.0" y="280.0" width="512.0" height="112.0" rx="6"/><text class="name" x="40.0" y="304.0">반대 방향</text><rect class="solid" x="130.0" y="320.0" width="44.0" height="40.0" rx="3"/><line x1="174.0" y1="340.0" x2="263.0" y2="340.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M274.0,340.0 L263.0,344.9 L263.0,335.1 Z" fill="#1d1d1a"/><text class="small" x="280.0" y="345.0">50 N</text><line x1="130.0" y1="340.0" x2="81.0" y2="340.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M70.0,340.0 L81.0,335.1 L81.0,344.9 Z" fill="#1d1d1a"/><text class="small" x="64.0" y="345.0" text-anchor="end">30 N</text><text class="lab" x="40.0" y="378.0">50 N − 30 N = 20 N</text><line class="thin" x1="322.0" y1="290.0" x2="322.0" y2="382.0"/><rect class="solid" x="336.0" y="320.0" width="36.0" height="40.0" rx="3"/><line x1="372.0" y1="340.0" x2="393.0" y2="340.0" stroke="#1d1d1a" stroke-width="5"/><path d="M408.0,340.0 L393.0,346.8 L393.0,333.2 Z" fill="#1d1d1a"/><text class="small" x="336.0" y="304.0">합력</text><text class="lab" x="524.0" y="378.0" text-anchor="end">더 큰 쪽(오른쪽) 20 N</text><rect class="zone" x="24.0" y="410.0" width="512.0" height="112.0" rx="6"/><text class="name" x="40.0" y="434.0">같은 크기 · 반대</text><rect class="solid" x="130.0" y="450.0" width="44.0" height="40.0" rx="3"/><line x1="174.0" y1="470.0" x2="203.0" y2="470.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M214.0,470.0 L203.0,474.9 L203.0,465.1 Z" fill="#1d1d1a"/><text class="small" x="220.0" y="475.0">5 N</text><line x1="130.0" y1="470.0" x2="101.0" y2="470.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M90.0,470.0 L101.0,465.1 L101.0,474.9 Z" fill="#1d1d1a"/><text class="small" x="84.0" y="475.0" text-anchor="end">5 N</text><text class="lab" x="40.0" y="508.0">5 N − 5 N = 0</text><line class="thin" x1="322.0" y1="420.0" x2="322.0" y2="512.0"/><rect class="solid" x="336.0" y="450.0" width="36.0" height="40.0" rx="3"/><text class="big" x="406.0" y="478.0">0 N</text><text class="small" x="336.0" y="434.0">합력</text><text class="lab" x="524.0" y="508.0" text-anchor="end">합력 0 → 힘의 평형</text><text class="small" x="24.0" y="540.0">반대 방향일 때 합력의 방향은 언제나 더 큰 힘 쪽이다.</text>
</svg>
