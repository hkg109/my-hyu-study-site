<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="mis-00-it-governance-title mis-00-it-governance-desc">
  <title id="mis-00-it-governance-title">IT 거버넌스의 권한과 책임 흐름</title>
  <desc id="mis-00-it-governance-desc">중앙집중 또는 분산 구조에서 의사결정 권한을 정하고 시스템 분석가가 요구사항을 기술로 번역하며 결과 책임을 확인하는 흐름</desc>
  <defs><marker id="mis-00-it-governance-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1}.flow{stroke:#65645e;stroke-width:2;fill:none;marker-end:url(#mis-00-it-governance-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.inverse{fill:#f7f6f2}.step{font:600 10px 'JetBrains Mono',monospace;fill:#65645e;letter-spacing:.08em}</style>
  <rect class="bg" width="1280" height="700"/><text class="tag" x="64" y="52">LECTURE 00 · IT GOVERNANCE</text><text class="title" x="64" y="92">Governance는 기술보다 먼저 권한과 책임을 정한다</text><text class="subtitle" x="64" y="122">누가 결정하는지와 누가 결과를 책임지는지를 연결해야 시스템 투자가 통제된다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
  <path class="flow" d="M264 276 H336 V320"/><path class="flow" d="M264 448 H336 V404"/><path class="flow" d="M592 362 H664"/><path class="flow" d="M920 362 H992"/>
  <g><rect class="node" x="64" y="220" width="200" height="112" rx="6"/><text class="step" x="88" y="248">STRUCTURE A</text><text class="name" x="88" y="282">Centralized</text><text class="sub" x="88" y="306">중앙 IT에 결정 집중</text></g>
  <g><rect class="node" x="64" y="392" width="200" height="112" rx="6"/><text class="step" x="88" y="420">STRUCTURE B</text><text class="name" x="88" y="454">Decentralized</text><text class="sub" x="88" y="478">Business Unit에 분산</text></g>
  <g><rect class="zone" x="336" y="292" width="256" height="140" rx="6"/><text class="step" x="360" y="320">DECISION RIGHTS</text><text class="name" x="360" y="356">누가 결정하는가?</text><text class="sub" x="360" y="386">투자 · 표준 · 우선순위</text><text class="sub" x="360" y="410">데이터 · 위험 허용 수준</text></g>
  <g><rect class="focal" x="664" y="292" width="256" height="140" rx="6"/><text class="step inverse" x="688" y="320">TRANSLATION</text><text class="name inverse" x="688" y="356">Systems Analyst</text><text class="sub inverse" x="688" y="386">Business requirement</text><text class="sub inverse" x="688" y="410">→ system requirement</text></g>
  <g><rect class="node" x="992" y="292" width="224" height="140" rx="6"/><text class="step" x="1016" y="320">ACCOUNTABILITY</text><text class="name" x="1016" y="356">누가 책임지는가?</text><text class="sub" x="1016" y="386">성과 · 위험 · 규정 준수</text><text class="sub" x="1016" y="410">결과와 개선 조치</text></g>
  <rect class="node" x="336" y="504" width="880" height="80" rx="6"/><text class="sub" x="776" y="540" text-anchor="middle">IT Governance = 구조 선택 + Decision Rights + Accountability</text><text class="sub" x="776" y="564" text-anchor="middle">중앙집중과 분산은 정답이 아니라 조직 상황에 맞춰 설계하는 선택지다</text>
</svg>
