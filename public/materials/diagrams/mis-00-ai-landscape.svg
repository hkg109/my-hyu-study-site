<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="mis-00-ai-landscape-title mis-00-ai-landscape-desc">
  <title id="mis-00-ai-landscape-title">AI 핵심 용어 지도</title>
  <desc id="mis-00-ai-landscape-desc">인공지능을 학습과 패턴, 언어와 생성, 규칙과 탐색의 세 영역으로 나눈 개념 지도</desc>
  <defs><marker id="mis-00-ai-landscape-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>
    .bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.flow{stroke:#65645e;stroke-width:2;fill:none;marker-end:url(#mis-00-ai-landscape-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.tag{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.inverse{fill:#f7f6f2}.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.term{font:650 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:500 12px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}
  </style>
  <rect class="bg" width="1280" height="720"/>
  <text class="tag" x="64" y="52">LECTURE 00 · AI MAP</text><text class="title" x="64" y="92">AI는 하나의 기술이 아니라 큰 기술군이다</text><text class="subtitle" x="64" y="122">시험에서는 각 용어가 학습·언어·추론 중 어디에 속하는지 먼저 찾는다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
  <path class="flow" d="M640 276 V316 Q640 324 632 324 H260 Q252 324 252 348 V372"/><path class="flow" d="M640 276 V372"/><path class="flow" d="M640 316 Q640 324 648 324 H1020 Q1028 324 1028 348 V372"/>
  <g><rect class="focal" x="500" y="188" width="280" height="88" rx="6"/><text class="name inverse" x="640" y="226" text-anchor="middle">AI</text><text class="sub inverse" x="640" y="250" text-anchor="middle">Artificial Intelligence</text></g>
  <g><rect class="zone" x="96" y="372" width="312" height="252" rx="8"/><text class="tag" x="120" y="404">LEARN · DISCOVER</text><text class="name" x="120" y="440">학습과 패턴</text><line class="rule" x1="120" y1="460" x2="384" y2="460"/><text class="term" x="120" y="500">ML · Machine Learning</text><text class="small" x="120" y="524">데이터에서 패턴 학습</text><text class="term" x="120" y="560">Neural Network</text><text class="small" x="120" y="584">복잡한 패턴을 학습하는 구조</text><text class="term" x="120" y="616">Data Mining</text></g>
  <g><rect class="zone" x="484" y="372" width="312" height="252" rx="8"/><text class="tag" x="508" y="404">UNDERSTAND · GENERATE</text><text class="name" x="508" y="440">언어와 생성</text><line class="rule" x1="508" y1="460" x2="772" y2="460"/><text class="term" x="508" y="500">NLP</text><text class="small" x="508" y="524">인간 언어 처리</text><text class="term" x="508" y="560">GenAI · RAG</text><text class="small" x="508" y="584">콘텐츠 생성 · 외부 근거 결합</text><text class="term" x="508" y="616">AI Agent</text></g>
  <g><rect class="zone" x="872" y="372" width="312" height="252" rx="8"/><text class="tag" x="896" y="404">REASON · SEARCH</text><text class="name" x="896" y="440">규칙과 탐색</text><line class="rule" x1="896" y1="460" x2="1160" y2="460"/><text class="term" x="896" y="500">Expert System</text><text class="small" x="896" y="524">전문가 규칙으로 추론</text><text class="term" x="896" y="560">Fuzzy Logic</text><text class="small" x="896" y="584">애매한 정도를 표현</text><text class="term" x="896" y="616">Genetic Algorithm</text></g>
  <text class="small" x="64" y="680">분류는 기술의 주된 역할을 보여 주며, 실제 시스템에서는 여러 기술이 함께 결합된다.</text>
</svg>
