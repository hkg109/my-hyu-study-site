<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 671" role="img" aria-labelledby="mis-gl-9-overview-title mis-gl-9-overview-desc">
  <title id="mis-gl-9-overview-title">안을 묶고, 공급 쪽과 고객 쪽으로 넓힌다</title>
  <desc id="mis-gl-9-overview-desc">9-1 ERP가 통합 모듈과 하나의 중앙 데이터베이스로 회사 안을 묶고, 공급 쪽으로 9-2 공급망과 SCM(채찍 효과, 계획·실행, 푸시·풀, 글로벌 공급망), 고객 쪽으로 9-3 CRM(영업·마케팅·서비스, 운영적·분석적 CRM, CLTV·이탈률)으로 넓어진 뒤, 세 시스템의 공통 과제와 차세대 애플리케이션·AI를 다루는 9-4로 모이는 개요도</desc>
  <defs><marker id="mis-gl-9-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-9-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-9-overview-a)}.flow.both{marker-start:url(#mis-gl-9-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-9-overview-m)}.dash.both{marker-start:url(#mis-gl-9-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="671"/>
  <text class="tag" x="24" y="40">9장 개요 · 개념 묶음 4개</text><text class="title" x="24" y="74">안을 묶고, 공급 쪽과 고객 쪽으로 넓힌다</text><text class="subtitle" x="24" y="104">핵심 질문: 회사 안과 공급자·고객 쪽 바깥을 소프트웨어로 어떻게 묶어 운영</text><text class="subtitle" x="24" y="124">탁월성과 고객 친밀성을 얻을까?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="285.5" width="528" height="154" rx="8"/><text class="small" x="280" y="305.5" text-anchor="middle">회사 바깥으로 확장</text><rect class="focal" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="198" text-anchor="middle">9-1</text><text class="name inv" x="280" y="219" text-anchor="middle">ERP · 회사 안 통합</text><text class="body inv" x="280" y="246" text-anchor="middle">통합 모듈 + 중앙 DB, 모범 사례, 최소 커스터마이징</text><rect class="node" x="24" y="319.5" width="249" height="110" rx="6"/><text class="small" x="148.5" y="345.5" text-anchor="middle">9-2</text><text class="name" x="148.5" y="366.5" text-anchor="middle">공급망과 SCM</text><text class="body" x="148.5" y="393.5" text-anchor="middle">상류·하류, 채찍 효과,</text><text class="body" x="148.5" y="414" text-anchor="middle">계획·실행, 푸시·풀, 글로벌</text><rect class="node" x="287" y="319.5" width="249" height="110" rx="6"/><text class="small" x="411.5" y="345.5" text-anchor="middle">9-3</text><text class="name" x="411.5" y="366.5" text-anchor="middle">CRM</text><text class="body" x="411.5" y="393.5" text-anchor="middle">영업·마케팅·서비스, 운영·분석,</text><text class="body" x="411.5" y="414" text-anchor="middle">CLTV·이탈률</text><rect class="node" x="24" y="513.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="539.5" text-anchor="middle">9-4</text><text class="name" x="280" y="560.5" text-anchor="middle">도입 과제와 차세대 애플리케이션</text><text class="body" x="280" y="587.5" text-anchor="middle">비용·프로세스 변화·전환 비용, 클라우드·소셜 CRM·BI·AI</text><path class="flow" d="M148.5 261.5 L148.5 319.5"/><rect class="mask" x="103.2" y="279.5" width="90.6" height="22" rx="4"/><text class="lab" x="148.5" y="295.5" text-anchor="middle">공급 쪽으로</text><path class="flow" d="M411.5 261.5 L411.5 319.5"/><rect class="mask" x="366.2" y="279.5" width="90.6" height="22" rx="4"/><text class="lab" x="411.5" y="295.5" text-anchor="middle">고객 쪽으로</text><path class="line" d="M148.5 429.5 V467.5"/><path class="line" d="M411.5 429.5 V467.5"/><path class="line" d="M148.5 467.5 H411.5"/><path class="flow" d="M280 467.5 L280 513.5"/><rect class="mask" x="241.9" y="456.5" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="472.5" text-anchor="middle">공통 과제</text><path class="flow" d="M24 627 H54"/><text class="small" x="62" y="632">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="619" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="632">중심 개념</text><rect class="zone" x="302.06225" y="619" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="632">범위·묶음</text>
</svg>
