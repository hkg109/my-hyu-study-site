  <title id="adsp-l09d-roc-title">ROC 곡선과 AUC</title>
  <desc id="adsp-l09d-roc-desc">가로축 FPR(1 − 특이도), 세로축 TPR(민감도)인 ROC 평면에 성능이 좋은 모델 A(AUC 약 0.92)와 약한 모델 B(AUC 약 0.76), 무작위 분류 대각선(AUC 0.5)을 그리고 모델 A 아래 면적을 칠한 그림. 왼쪽 위 모서리 (0, 1)이 완벽한 분류이며, 임계값을 낮출수록 점이 오른쪽 위로 이동한다.</desc>
