  <text class="small" x="426" y="373">출발점: 제조업체의 예측</text>
  <text class="name" x="640" y="440" text-anchor="middle">Pull-Based Model · 주문 기반 (build-to-order, demand-driven)</text>
  <rect class="zone" x="96" y="462" width="176" height="70" rx="6"/><text class="name" x="184" y="503" text-anchor="middle">Supplier</text><text class="sub" x="184" y="562" text-anchor="middle">Supply to order</text>
  <rect class="zone" x="324" y="462" width="176" height="70" rx="6"/><text class="name" x="412" y="503" text-anchor="middle">Manufacturer</text><text class="sub" x="412" y="562" text-anchor="middle">Produce to order</text>
  <rect class="zone" x="552" y="462" width="176" height="70" rx="6"/><text class="name" x="640" y="503" text-anchor="middle">Distributor</text><text class="sub" x="640" y="562" text-anchor="middle">Automatically replenish</text><text class="sub" x="640" y="582" text-anchor="middle">warehouse</text>
  <rect class="zone" x="780" y="462" width="176" height="70" rx="6"/><text class="name" x="868" y="503" text-anchor="middle">Retailer</text><text class="sub" x="868" y="562" text-anchor="middle">Automatically replenish</text><text class="sub" x="868" y="582" text-anchor="middle">stock</text>
  <rect class="focal" x="1008" y="462" width="176" height="70" rx="6"/><text class="name inverse" x="1096" y="503" text-anchor="middle">Customer</text><text class="sub" x="1096" y="562" text-anchor="middle">Customer orders</text>
