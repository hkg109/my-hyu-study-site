  <title id="mis-fig-9-04-title">Figure 9.4 Push- Versus Pull-Based Supply Chain Models</title>
  <desc id="mis-fig-9-04-desc">“Make what we sell, not sell what we make.” — 푸시는 예측이, 풀은 실제 주문이 공급망을 움직인다</desc>
