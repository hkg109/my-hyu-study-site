  <rect class="zone" x="96" y="660" width="1088" height="56" rx="6"/>
  <text class="label" x="640" y="694" text-anchor="middle">푸시: 예측 → 만들어 밀어냄 · 풀: 주문 → 그만큼 당겨 만듦 (화살표 방향이 반대)</text>
