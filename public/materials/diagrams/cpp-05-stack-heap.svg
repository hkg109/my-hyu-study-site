<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" role="img" aria-labelledby="cpp-05-stack-heap-title cpp-05-stack-heap-desc">
  <title id="cpp-05-stack-heap-title">스택의 포인터가 힙의 블록을 가리킨다</title>
  <desc id="cpp-05-stack-heap-desc">함수의 지역 변수는 스택에 있다가 함수가 끝나면 사라지고, new로 힙에 빌린 블록은 delete할 때까지 남으며, 포인터를 잃어버리면 힙 블록을 돌려줄 수 없는 메모리 누수가 생긴다는 그림</desc>
  <defs>
    <marker id="cpp-05-stack-heap-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-05-stack-heap-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-05-stack-heap-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="452" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">05 · 동적 메모리</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">스택의 포인터가 힙의 블록을 가리킨다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <rect x="32" y="112" width="240" height="268" rx="8" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.2"/><text x="44" y="132" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">스택 · 자동으로 사라짐</text><rect x="320" y="112" width="368" height="268" rx="8" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.2"/><text x="332" y="132" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">힙 · delete 해야 사라짐</text><path d="M240 168 L368 168" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-05-stack-heap-m)"/><path d="M240 248 L368 248" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-05-stack-heap-m)"/><rect x="56" y="144" width="184" height="48" rx="6" fill="#f7f6f2"/><rect x="56" y="144" width="184" height="48" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="148" y="164" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">int *arr</text><text x="148" y="184" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">지역 변수 · 8 B</text><rect x="56" y="224" width="184" height="48" rx="6" fill="#f7f6f2"/><rect x="56" y="224" width="184" height="48" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="148" y="244" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">Circle *c</text><text x="148" y="264" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">지역 변수 · 8 B</text><rect x="368" y="144" width="296" height="48" rx="6" fill="#f7f6f2"/><rect x="368" y="144" width="296" height="48" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="516" y="164" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">new int[n]</text><text x="516" y="184" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">실행 중에 크기 결정 → delete[]</text><rect x="368" y="224" width="296" height="48" rx="6" fill="#f7f6f2"/><rect x="368" y="224" width="296" height="48" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="516" y="244" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">new Circle(9)</text><text x="516" y="264" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">객체 하나 → delete</text><rect x="368" y="304" width="296" height="52" rx="6" fill="#f7f6f2"/><rect x="368" y="304" width="296" height="52" rx="6" fill="#f3e3dc" stroke="#a8431f" stroke-width="1.5"/><text x="516" y="326" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">주소를 잃은 블록</text><text x="516" y="346" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">p = new int(1); p = new int(2);</text><text x="56" y="320" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">C++에는 가비지 컬렉터가</text><text x="56" y="340" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">없다 — 직접 delete</text>
