<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="sci1-5-13-balance-vs-reaction-title sci1-5-13-balance-vs-reaction-desc">
  <title id="sci1-5-13-balance-vs-reaction-title">두 힘의 평형 vs 작용·반작용</title>
  <desc id="sci1-5-13-balance-vs-reaction-desc">책상 위 책을 두 번 그렸다. 왼쪽은 두 힘의 평형: 책이 받는 중력(아래)과 책상이 책을 떠받치는 힘(위)이 모두 책 한 물체에 작용하므로 더하면 0이다. 오른쪽은 작용·반작용: 책이 책상을 누르는 힘(책상이 받음, 아래)과 책상이 책을 떠받치는 힘(책이 받음, 위)으로 받는 물체가 서로 달라 한 물체의 합력으로 더하지 않는다. 각 화살표 옆에 받는 물체를 적었다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="470"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">두 힘의 평형 vs 작용·반작용</text><text class="subtitle" x="24.0" y="104.0">둘 다 크기가 같고 방향이 반대 — 차이는 ‘누가 받는 힘인가’</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="146.0" width="248.0" height="270.0" rx="6"/><text class="name" x="148.0" y="172.0" text-anchor="middle">두 힘의 평형</text><text class="small" x="148.0" y="194.0" text-anchor="middle">한 물체(책)가 받는 두 힘</text><rect class="deep" x="58.0" y="316.0" width="180.0" height="16.0" rx="2"/><rect class="deep" x="70.0" y="332.0" width="12.0" height="72.0" rx="2"/><rect class="deep" x="214.0" y="332.0" width="12.0" height="72.0" rx="2"/><text class="small" x="108.0" y="352.0" text-anchor="middle">책상</text><rect class="solid" x="118.0" y="288.0" width="60.0" height="28.0" rx="3"/><text class="lab" x="148.0" y="307.0" text-anchor="middle">책</text><line x1="134.0" y1="296.0" x2="134.0" y2="241.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M134.0,230.0 L138.9,241.0 L129.1,241.0 Z" fill="#1d1d1a"/><text class="small" x="126.0" y="236.0" text-anchor="end">떠받치는 힘</text><text class="small" x="126.0" y="254.0" text-anchor="end">(책이 받음)</text><line x1="162.0" y1="300.0" x2="162.0" y2="357.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M162.0,368.0 L157.1,357.0 L166.9,357.0 Z" fill="#1d1d1a"/><text class="small" x="170.0" y="384.0">중력 (책이 받음)</text><rect class="zone" x="288.0" y="146.0" width="248.0" height="270.0" rx="6"/><text class="name" x="412.0" y="172.0" text-anchor="middle">작용 · 반작용</text><text class="small" x="412.0" y="194.0" text-anchor="middle">서로 다른 두 물체가 주고받는 힘</text><rect class="deep" x="322.0" y="316.0" width="180.0" height="16.0" rx="2"/><rect class="deep" x="334.0" y="332.0" width="12.0" height="72.0" rx="2"/><rect class="deep" x="478.0" y="332.0" width="12.0" height="72.0" rx="2"/><text class="small" x="372.0" y="352.0" text-anchor="middle">책상</text><rect class="solid" x="382.0" y="288.0" width="60.0" height="28.0" rx="3"/><text class="lab" x="412.0" y="307.0" text-anchor="middle">책</text><line x1="398.0" y1="312.0" x2="398.0" y2="257.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M398.0,246.0 L402.9,257.0 L393.1,257.0 Z" fill="#1d1d1a"/><text class="small" x="390.0" y="252.0" text-anchor="end">떠받치는 힘</text><text class="small" x="390.0" y="270.0" text-anchor="end">(책이 받음)</text><line x1="426.0" y1="316.0" x2="426.0" y2="371.0" stroke="#65645e" stroke-width="3.5"/><path d="M426.0,382.0 L421.1,371.0 L430.9,371.0 Z" fill="#65645e"/><text class="small" x="434.0" y="252.0">누르는 힘</text><text class="small" x="434.0" y="270.0">(책상이 받음)</text><rect class="focal" x="24.0" y="428.0" width="248.0" height="30.0" rx="6"/><text class="lab inv" x="148.0" y="448.0" text-anchor="middle">더하면 0 → 평형</text><rect class="deep" x="288.0" y="428.0" width="248.0" height="30.0" rx="6"/><text class="lab" x="412.0" y="448.0" text-anchor="middle">받는 물체가 달라 더하지 않는다</text>
</svg>
