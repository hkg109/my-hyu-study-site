<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="mis-00-rag-flow-title mis-00-rag-flow-desc">
  <title id="mis-00-rag-flow-title">RAG 답변 생성 흐름</title>
  <desc id="mis-00-rag-flow-desc">질문을 받은 뒤 승인된 자료를 검색하고 검색 근거를 이용해 답변을 생성하는 과정</desc>
  <defs><marker id="mis-00-rag-flow-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1}.flow{stroke:#65645e;stroke-width:2;fill:none;marker-end:url(#mis-00-rag-flow-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.store{fill:#f0eee8;stroke:#65645e;stroke-width:1.5}.tag{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.inverse{fill:#f7f6f2}.step{font:600 11px 'JetBrains Mono',monospace;fill:#65645e;letter-spacing:.08em}</style>
  <rect class="bg" width="1280" height="640"/><text class="tag" x="64" y="52">LECTURE 00 · RAG FLOW</text><text class="title" x="64" y="92">먼저 찾고, 근거를 넣고, 답한다</text><text class="subtitle" x="64" y="122">RAG의 차이는 생성 전에 신뢰할 수 있는 외부 지식을 검색한다는 점이다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
  <path class="flow" d="M328 332 H448"/><path class="flow" d="M704 332 H824"/><path class="flow" d="M576 420 V480 Q576 488 584 488 H816 Q824 488 824 480 V420"/>
  <g><rect class="node" x="96" y="276" width="232" height="112" rx="6"/><text class="step" x="120" y="304">01 · QUESTION</text><text class="name" x="120" y="340">사용자 질문</text><text class="sub" x="120" y="364">query · intent</text></g>
  <g><rect class="focal" x="448" y="276" width="256" height="144" rx="6"/><text class="step inverse" x="472" y="304">02 · RETRIEVE</text><text class="name inverse" x="472" y="344">승인된 자료 검색</text><text class="sub inverse" x="472" y="372">관련 근거를 선택해</text><text class="sub inverse" x="472" y="394">context로 전달</text></g>
  <g><rect class="node" x="824" y="276" width="360" height="144" rx="6"/><text class="step" x="848" y="304">03 · GENERATE</text><text class="name" x="848" y="344">근거 기반 답변</text><text class="sub" x="848" y="372">모델 지식 + 검색한 context</text><text class="sub" x="848" y="394">출처 확인 가능한 응답</text></g>
  <g><rect class="store" x="448" y="488" width="376" height="88" rx="6"/><text class="name" x="636" y="524" text-anchor="middle">Enterprise Knowledge</text><text class="sub" x="636" y="548" text-anchor="middle">문서 · 정책 · 데이터 · 승인된 Source</text></g>
</svg>
