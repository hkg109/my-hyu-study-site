<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 965" role="img" aria-labelledby="acc-gl-1a-accounting-info-system-title acc-gl-1a-accounting-info-system-desc">
  <title id="acc-gl-1a-accounting-info-system-title">회계정보시스템과 회계의 목적</title>
  <desc id="acc-gl-1a-accounting-info-system-desc">경제활동 자료가 인식을 거쳐 경제실체 안의 회계처리로 들어가고, 측정·평가를 거쳐 회계정보가 되며, 전달을 거쳐 정보이용자에게 간다. 정보이용자는 이 정보로 경제적 의사결정을 하고, 경영자는 회계책임을 통해 수탁책임을 해소한다.</desc>
  <defs><marker id="acc-gl-1a-accounting-info-system-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-1a-accounting-info-system-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-1a-accounting-info-system-a)}.flow.both{marker-start:url(#acc-gl-1a-accounting-info-system-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-1a-accounting-info-system-m)}.dash.both{marker-start:url(#acc-gl-1a-accounting-info-system-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="965"/>
  <text class="tag" x="24" y="40">1장 · 1-1 회계의 의의</text><text class="title" x="24" y="74">회계정보시스템과 회계의 목적</text><text class="subtitle" x="24" y="104">자료 1-1 · 경제활동 자료를 인식 → 측정·평가 → 전달하여</text><text class="subtitle" x="24" y="124">의사결정에 유용한 정보로 바꾸는 과정이 회계다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="outside" x="64" y="180" width="432" height="74" rx="6"/><text class="small" x="280.0" y="211.0" text-anchor="middle">경제활동자료 · 회계의 대상</text><text class="name" x="280.0" y="230.0" text-anchor="middle">거래 (transaction)</text><rect class="zone" x="24" y="300" width="512" height="136" rx="6"/><text class="small" x="36" y="320">경제실체 (기업·정부·학교 등 회계주체)</text><rect class="focal" x="64" y="332" width="432" height="88" rx="6"/><text class="small inv" x="280.0" y="359.5" text-anchor="middle">회계처리 · 부기(bookkeeping) 포함</text><text class="name inv" x="280.0" y="378.5" text-anchor="middle">기록 → 분류 → 요약 → 가공</text><text class="body inv" x="280.0" y="401.5" text-anchor="middle">자료를 정보로 전환</text><path class="flow" d="M280 254 L280 332"/><rect class="mask" x="197.4" y="267" width="165.2" height="22" rx="4"/><text class="lab" x="280" y="283" text-anchor="middle">① 인식 · 식별하고 기록</text><rect class="node" x="64" y="486" width="432" height="80" rx="6"/><text class="name" x="280.0" y="519.0" text-anchor="middle">회계정보</text><text class="body" x="280.0" y="542.0" text-anchor="middle">금액이 붙은 화폐정보 · 의사결정용 가공</text><path class="flow" d="M280 420 L280 486"/><rect class="mask" x="190.7" y="442" width="178.7" height="22" rx="4"/><text class="lab" x="280" y="458" text-anchor="middle">② 측정·평가 · 금액 부여</text><rect class="node" x="64" y="616" width="432" height="80" rx="6"/><text class="name" x="280.0" y="649.0" text-anchor="middle">정보이용자 (이해관계자)</text><text class="body" x="280.0" y="672.0" text-anchor="middle">내부: 경영자·관리자 / 외부: 주주·채권자 등</text><path class="flow" d="M280 566 L280 616"/><rect class="mask" x="204.2" y="580" width="151.7" height="22" rx="4"/><text class="lab" x="280" y="596" text-anchor="middle">③ 전달 · 경영의 언어</text><rect class="deep" x="24" y="750" width="248" height="130" rx="6"/><text class="small" x="148.0" y="777.5" text-anchor="middle">목적 ①</text><text class="name" x="148.0" y="796.5" text-anchor="middle">의사결정 유용성</text><text class="body" x="148.0" y="819.5" text-anchor="middle">자원 제약 속 대안을</text><text class="body" x="148.0" y="840.5" text-anchor="middle">비교·분석 → 최선 선택</text><text class="body" x="148.0" y="861.5" text-anchor="middle">선택·포기를 정당화</text><rect class="deep" x="288" y="750" width="248" height="130" rx="6"/><text class="small" x="412.0" y="777.5" text-anchor="middle">목적 ②</text><text class="name" x="412.0" y="796.5" text-anchor="middle">수탁책임 해소</text><text class="body" x="412.0" y="819.5" text-anchor="middle">경영자 = 자원의 수탁자</text><text class="body" x="412.0" y="840.5" text-anchor="middle">회계책임(accountability)</text><text class="body" x="412.0" y="861.5" text-anchor="middle">을 통해 의무 이행 보고</text><path class="flow" d="M180 696 L148 750"/><rect class="mask" x="128.0" y="711" width="72.0" height="22" rx="4"/><text class="lab" x="164" y="727" text-anchor="middle">선택 근거</text><path class="flow" d="M380 696 L412 750"/><rect class="mask" x="360.0" y="711" width="72.0" height="22" rx="4"/><text class="lab" x="396" y="727" text-anchor="middle">책임 확인</text><text class="body" x="280" y="910" text-anchor="middle">단순 요약·정리 (X) → 의사결정을 지원하도록 가공 (O)</text><path class="flow" d="M24 940 H54"/><text class="small" x="62" y="945">처리 단계</text><rect class="focal" x="142.05" y="932" width="22" height="16" rx="3"/><text class="small" x="172.05" y="945">중심 개념</text><rect class="outside" x="252.10000000000002" y="932" width="22" height="16" rx="3"/><text class="small" x="282.1" y="945">회계 밖 원자료</text><rect class="zone" x="393.20000000000005" y="932" width="22" height="16" rx="3"/><text class="small" x="423.20000000000005" y="945">회계 주체</text>
</svg>
