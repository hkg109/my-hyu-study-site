<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" role="img" aria-labelledby="cpg-06a-task-lifecycle-title cpg-06a-task-lifecycle-desc">
  <title id="cpg-06a-task-lifecycle-title">업무의 상태와 되돌리기</title>
  <desc id="cpg-06a-task-lifecycle-desc">TODO, IN_PROGRESS, REVIEW, DONE의 네 상태를 위에서 아래로 놓고, DONE은 잠금이 아니어서 권한자가 IN_PROGRESS로 재개할 수 있으며, 잘못 만든 업무는 어느 상태에서든 물리 삭제 대신 보관하고 복원한다는 상태 그림.</desc>
  <defs><marker id="cpg-06a-task-lifecycle-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-06a-task-lifecycle-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-06a-task-lifecycle-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-06a-task-lifecycle-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="700"/>
  <text class="tag" x="24" y="40">06-1 · 업무</text><text class="title" x="24" y="74">업무의 상태와 되돌리기</text><text class="subtitle" x="24" y="104">DONE은 영구 잠금이 아니다.</text><text class="subtitle" x="24" y="124">지우는 대신 보관하고, 변경은 Activity Log에 남는다.</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
  <path class="flow" d="M150 216 V252"/>
  <path class="flow" d="M150 308 V344"/>
  <path class="flow" d="M150 400 V436"/>
  <path class="flow" d="M276 464 H340 Q348 464 348 456 V288 Q348 280 340 280 H276"/>
  <rect class="mask" x="356.0" y="365" width="38.5" height="21" rx="4"/><text class="lab" x="362" y="380">재개</text>
  <rect class="node" x="24" y="160" width="252" height="56" rx="6"/><text class="code" x="150" y="183.5" text-anchor="middle">TODO</text><text class="small" x="150" y="203.1" text-anchor="middle">할 일</text>
  <rect class="node" x="24" y="252" width="252" height="56" rx="6"/><text class="code" x="150" y="275.5" text-anchor="middle">IN_PROGRESS</text><text class="small" x="150" y="295.1" text-anchor="middle">진행 중</text>
  <rect class="node" x="24" y="344" width="252" height="56" rx="6"/><text class="code" x="150" y="367.5" text-anchor="middle">REVIEW</text><text class="small" x="150" y="387.1" text-anchor="middle">검토 중</text>
  <rect class="focal" x="24" y="436" width="252" height="56" rx="6"/><text class="code inv" x="150" y="459.5" text-anchor="middle">DONE</text><text class="small inv" x="150" y="479.1" text-anchor="middle">완료 · 권한자는 수정·재개</text>
  <rect class="outside" x="24" y="520" width="512" height="64" rx="6"/><text class="name" x="280" y="548.0" text-anchor="middle">어느 상태에서든 → 보관 (archived_at) ⇄ 복원</text><text class="small" x="280" y="568.1" text-anchor="middle">물리 삭제 대신 Soft Delete</text>
  <rect class="zone" x="408" y="160" width="128" height="104" rx="6"/><text class="lab" x="472" y="197.8" text-anchor="middle">MEMBER</text><text class="small" x="472" y="217.1" text-anchor="middle">본인 담당의</text><text class="small" x="472" y="236.1" text-anchor="middle">상태·설명·첨부</text>
  <rect class="zone" x="408" y="280" width="128" height="104" rx="6"/><text class="lab" x="472" y="317.8" text-anchor="middle">DIRECTOR</text><text class="small" x="472" y="337.1" text-anchor="middle">관리 Task의</text><text class="small" x="472" y="356.1" text-anchor="middle">제목·담당자·마감</text>
  <rect class="zone" x="408" y="400" width="128" height="92" rx="6"/><text class="lab" x="472" y="441.3" text-anchor="middle">공개 모드·ACL</text><text class="small" x="472" y="460.6" text-anchor="middle">별도 권한</text>
  <text class="small" x="280" y="624" text-anchor="middle">볼 수 있다고 모든 필드를 고칠 수 있는 것은 아니다</text>
  <rect class="focal" x="24" y="660" width="22" height="16" rx="3"/><text class="small" x="54" y="673">다시 열 수 있는 끝</text><rect class="zone" x="184.81" y="660" width="22" height="16" rx="3"/><text class="small" x="214.81" y="673">누가 무엇을 고치나</text><rect class="outside" x="350.75" y="660" width="22" height="16" rx="3"/><text class="small" x="380.75" y="673">보관</text>
</svg>
