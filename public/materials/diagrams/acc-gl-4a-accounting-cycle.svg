<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1150" role="img" aria-labelledby="acc-gl-4a-accounting-cycle-title acc-gl-4a-accounting-cycle-desc">
  <title id="acc-gl-4a-accounting-cycle-title">회계순환과정 — 기중 기록과 기말 결산</title>
  <desc id="acc-gl-4a-accounting-cycle-desc">기중에는 거래의 발생, 분개, 전기 순서로 기록하고, 기말 결산에서는 수정전 시산표, 결산정리, 수정후 시산표, 재무제표 작성, 장부 마감 순서로 진행한다. 수정전 시산표는 기중 기록을, 수정후 시산표는 결산정리를 다시 확인하는 점선 화살표로 표시한 그림</desc>
  <defs><marker id="acc-gl-4a-accounting-cycle-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-4a-accounting-cycle-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-4a-accounting-cycle-a)}.flow.both{marker-start:url(#acc-gl-4a-accounting-cycle-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-4a-accounting-cycle-m)}.dash.both{marker-start:url(#acc-gl-4a-accounting-cycle-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1150"/>
  <text class="tag" x="24" y="40">4장 · 4-1 회계순환과정</text><text class="title" x="24" y="74">회계순환과정 (자료 4-1)</text><text class="subtitle" x="24" y="104">기중에는 거래를 기록하고, 기말에는 결산으로 정확한</text><text class="subtitle" x="24" y="124">재무제표를 만든다 — 중심은 결산정리</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="172" width="528" height="330" rx="8"/><text class="small" x="28" y="194">기중 거래의 기록 · 3장</text><rect class="zone" x="16" y="540" width="528" height="520" rx="8"/><text class="small" x="28" y="562">기말 결산 · 4장</text><rect class="node" x="80" y="206" width="330" height="64" rx="6"/><text class="name" x="245.0" y="234.0" text-anchor="middle">거래의 발생</text><text class="body" x="245.0" y="255.0" text-anchor="middle">자산·부채·자본·수익·비용 변동</text><rect class="node" x="80" y="306" width="330" height="64" rx="6"/><text class="name" x="245.0" y="334.0" text-anchor="middle">분개</text><text class="body" x="245.0" y="355.0" text-anchor="middle">분개장에 차변·대변으로 기록</text><rect class="node" x="80" y="406" width="330" height="64" rx="6"/><text class="name" x="245.0" y="434.0" text-anchor="middle">전기</text><text class="body" x="245.0" y="455.0" text-anchor="middle">분개를 원장 계정별로 옮김</text><rect class="node" x="80" y="576" width="330" height="64" rx="6"/><text class="name" x="245.0" y="604.0" text-anchor="middle">수정전 시산표의 작성</text><text class="body" x="245.0" y="625.0" text-anchor="middle">기중 기록의 대차 일치 확인</text><rect class="focal" x="80" y="676" width="330" height="64" rx="6"/><text class="name inv" x="245.0" y="704.0" text-anchor="middle">결산정리</text><text class="body inv" x="245.0" y="725.0" text-anchor="middle">결산수정분개 및 전기</text><rect class="node" x="80" y="776" width="330" height="64" rx="6"/><text class="name" x="245.0" y="804.0" text-anchor="middle">수정후 시산표의 작성</text><text class="body" x="245.0" y="825.0" text-anchor="middle">수정 결과의 대차 일치 재확인</text><rect class="node" x="80" y="876" width="330" height="64" rx="6"/><text class="name" x="245.0" y="904.0" text-anchor="middle">재무제표의 작성</text><text class="body" x="245.0" y="925.0" text-anchor="middle">포괄손익계산서 → 재무상태표</text><rect class="node" x="80" y="976" width="330" height="64" rx="6"/><text class="name" x="245.0" y="1004.0" text-anchor="middle">장부의 마감</text><text class="body" x="245.0" y="1025.0" text-anchor="middle">다음 회계기간 기록 준비</text><path class="flow" d="M245.0 270 L245.0 306"/><rect class="mask" x="224.4" y="277.0" width="41.2" height="22" rx="4"/><text class="lab" x="245.0" y="293.0" text-anchor="middle">기록</text><path class="flow" d="M245.0 370 L245.0 406"/><rect class="mask" x="206.9" y="377.0" width="76.3" height="22" rx="4"/><text class="lab" x="245.0" y="393.0" text-anchor="middle">옮겨 적기</text><path class="flow" d="M245.0 470 L245.0 576"/><rect class="mask" x="185.4" y="512.0" width="119.3" height="22" rx="4"/><text class="lab" x="245.0" y="528.0" text-anchor="middle">기말: 잔액 집계</text><path class="flow" d="M245.0 640 L245.0 676"/><rect class="mask" x="189.3" y="647.0" width="111.4" height="22" rx="4"/><text class="lab" x="245.0" y="663.0" text-anchor="middle">수정 사항 반영</text><path class="flow" d="M245.0 740 L245.0 776"/><rect class="mask" x="206.9" y="747.0" width="76.3" height="22" rx="4"/><text class="lab" x="245.0" y="763.0" text-anchor="middle">다시 집계</text><path class="flow" d="M245.0 840 L245.0 876"/><rect class="mask" x="196.1" y="847.0" width="97.8" height="22" rx="4"/><text class="lab" x="245.0" y="863.0" text-anchor="middle">대차 일치 시</text><path class="flow" d="M245.0 940 L245.0 976"/><rect class="mask" x="206.9" y="947.0" width="76.3" height="22" rx="4"/><text class="lab" x="245.0" y="963.0" text-anchor="middle">결산 완료</text><path class="dash" d="M410 608 L470 608 L470 438 L410 438"/><rect class="mask" x="414.3" y="510" width="111.4" height="22" rx="4"/><text class="lab" x="470" y="526" text-anchor="middle">기중 기록 검증</text><path class="dash" d="M410 808 L470 808 L470 708 L410 708"/><rect class="mask" x="425.1" y="747" width="89.9" height="22" rx="4"/><text class="lab" x="470" y="763" text-anchor="middle">수정 재확인</text><path class="flow" d="M24 1095 H54"/><text class="small" x="62" y="1100">흐름·순서</text><path class="dash" d="M150 1095 H180"/><text class="small" x="188" y="1100">확인·대체(되돌림)</text><rect class="focal" x="330" y="1087" width="22" height="16" rx="3"/><text class="small" x="360" y="1100">중심 개념</text><rect class="zone" x="440" y="1087" width="22" height="16" rx="3"/><text class="small" x="470" y="1100">범위·묶음</text>
</svg>
