<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 586" width="560" height="586" role="img" aria-labelledby="sci1-6-10-concept-link-title sci1-6-10-concept-link-desc">
  <title id="sci1-6-10-concept-link-title">기체의 성질 개념 연결 지도</title>
  <desc id="sci1-6-10-concept-link-desc">위에서 아래로 개념을 연결했다. 압력(일정한 면적에 작용하는 힘, 힘 나누기 면적)에서 기체의 압력(입자가 벽에 충돌, 모든 방향)으로 이어지고, 다시 두 갈래로 나뉜다. 왼쪽은 온도가 일정할 때 압력이 커지면 부피가 줄어드는 압력과 부피 관계로, 충돌 횟수와 입자 사이 거리가 변하고 그래프는 반비례 곡선이다. 오른쪽은 압력이 일정할 때 온도가 높아지면 부피가 늘어나는 온도와 부피 관계로, 운동 속도와 충돌 세기와 거리가 변하고 그래프는 일정하게 증가하는 직선이다. 두 갈래는 생활 속 예와 물 뿜는 인형 설명으로 모인다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.ptc{fill:#1d1d1a}.ptcl{fill:#65645e}</style>
  <rect class="bg" width="560" height="586"/><text class="tag" x="24.0" y="40.0">중1 과학 · VI. 기체의 성질</text><text class="title" x="24.0" y="74.0">기체의 성질 개념 연결 지도</text><text class="subtitle" x="24.0" y="104.0">압력 → 기체의 압력 → 두 가지 부피 관계 → 생활 속 적용</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="150.0" width="512.0" height="56.0" rx="6"/><text class="name" x="40.0" y="175.0">압력</text><text class="small" x="40.0" y="196.0">일정한 면적에 수직으로 작용하는 힘 · 힘 ÷ 면적</text><line x1="280.0" y1="208.0" x2="280.0" y2="221.0" stroke="#1d1d1a" stroke-width="2"/><path d="M280.0,230.0 L276.0,221.0 L284.1,221.0 Z" fill="#1d1d1a"/><rect class="deep" x="24.0" y="232.0" width="512.0" height="56.0" rx="6"/><text class="name" x="40.0" y="257.0">기체의 압력</text><text class="small" x="40.0" y="278.0">기체 입자가 용기 벽에 충돌 · 모든 방향으로 작용</text><line x1="150.0" y1="290.0" x2="150.0" y2="305.0" stroke="#1d1d1a" stroke-width="2"/><path d="M150.0,314.0 L146.0,305.0 L154.1,305.0 Z" fill="#1d1d1a"/><line x1="410.0" y1="290.0" x2="410.0" y2="305.0" stroke="#1d1d1a" stroke-width="2"/><path d="M410.0,314.0 L406.0,305.0 L414.1,305.0 Z" fill="#1d1d1a"/><rect class="node" x="24.0" y="316.0" width="248.0" height="180.0" rx="6"/><text class="name" x="38.0" y="342.0">압력과 부피 관계</text><text class="small" x="38.0" y="362.0">온도 일정</text><text class="lab" x="38.0" y="386.0">압력↑ → 부피↓</text><text class="small" x="38.0" y="408.0">충돌 횟수 · 입자 사이 거리 변화</text><line class="line" x1="174.0" y1="484.0" x2="258.0" y2="484.0"/><line class="line" x1="174.0" y1="484.0" x2="174.0" y2="432.0"/><polyline points="184.1,434.6 187.4,447.0 190.8,454.4 194.2,459.3 197.5,462.8 200.9,465.5 204.2,467.5 207.6,469.2 211.0,470.5 214.3,471.7 217.7,472.6 221.0,473.4 224.4,474.1 227.8,474.7 231.1,475.3 234.5,475.8 237.8,476.2 241.2,476.6 244.6,476.9 247.9,477.3 251.3,477.6 254.6,477.8 258.0,478.1" fill="none" stroke="#1d1d1a" stroke-width="2"/><text class="small" x="38.0" y="448.0">반비례 곡선</text><text class="small" x="38.0" y="470.0">압력 × 부피 = 일정</text><rect class="node" x="288.0" y="316.0" width="248.0" height="180.0" rx="6"/><text class="name" x="302.0" y="342.0">온도와 부피 관계</text><text class="small" x="302.0" y="362.0">압력 일정</text><text class="lab" x="302.0" y="386.0">온도↑ → 부피↑</text><text class="small" x="302.0" y="408.0">운동 속도 · 충돌 세기 · 거리 변화</text><line class="line" x1="438.0" y1="484.0" x2="522.0" y2="484.0"/><line class="line" x1="438.0" y1="484.0" x2="438.0" y2="432.0"/><line x1="438" y1="466" x2="522" y2="434" stroke="#1d1d1a" stroke-width="2"/><text class="small" x="302.0" y="448.0">일정하게 증가</text><text class="small" x="302.0" y="470.0">하는 직선</text><line x1="150.0" y1="498.0" x2="221.4" y2="521.2" stroke="#65645e" stroke-width="2"/><path d="M230.0,524.0 L220.2,525.1 L222.7,517.4 Z" fill="#65645e"/><line x1="410.0" y1="498.0" x2="338.6" y2="521.2" stroke="#65645e" stroke-width="2"/><path d="M330.0,524.0 L337.3,517.4 L339.8,525.1 Z" fill="#65645e"/><rect class="focal" x="154.0" y="526.0" width="252.0" height="40.0" rx="6"/><text class="lab inv" x="280.0" y="551.0" text-anchor="middle">생활 속 예 · 물 뿜는 인형 설명</text>
