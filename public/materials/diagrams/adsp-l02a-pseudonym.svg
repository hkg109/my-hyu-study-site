<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 790" width="560" height="790" role="img" aria-labelledby="adsp-l02a-pseudonym-title adsp-l02a-pseudonym-desc">
  <title id="adsp-l02a-pseudonym-title">개인정보 · 가명정보 · 익명정보</title>
  <desc id="adsp-l02a-pseudonym-desc">위에서 아래로 개인정보, 가명정보, 익명정보가 놓이고 아래로 갈수록 식별 가능성이 낮아진다. 개인정보(홍길동, 33세)는 동의가 필요하고, 가명처리 등 비식별 조치를 거친 가명정보(홍OO, 30대 초반)는 통계 작성·과학적 연구·공익적 기록 보존 목적이면 동의 없이 활용할 수 있으나 추가 정보와 결합하면 재식별될 수 있어 점선 화살표가 위로 돌아간다. 추가 정보로도 재식별할 수 없게 하면 익명정보(OOO, 30대)가 되어 제한 없이 쓴다. 아래에 데이터 3법이 가명정보를 도입했다고 적었다.</desc>
  <defs><marker id="adsp-l02a-pseudonym-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l02a-pseudonym-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l02a-pseudonym-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l02a-pseudonym-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="790"/><text class="tag" x="24" y="40">ADsP · 1과목 2장</text><text class="title" x="24" y="74">개인정보 → 가명정보 → 익명정보</text><text class="subtitle" x="24" y="104">아래로 갈수록 알아보기 어려워지고, 활용 조건은 느슨해진다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="node" x="72" y="156" width="464" height="108" rx="6"/><text class="small" x="90" y="186">Personal</text><text class="big" x="90" y="214">개인정보</text><line class="thin" x1="222" y1="172" x2="222" y2="248"/><text class="name" x="238" y="188">홍길동, 33세</text><text class="body" x="238" y="214">특정 개인을 알아볼 수 있음</text><text class="small" x="238" y="240">활용: 정보주체 동의 필요</text><rect class="focal" x="72" y="330" width="464" height="126" rx="6"/><text class="small inv" x="90" y="360">Pseudonymous</text><text class="big inv" x="90" y="388">가명정보</text><line class="thin" x1="222" y1="346" x2="222" y2="440"/><text class="name inv" x="238" y="362">홍OO, 30대 초반</text><text class="body inv" x="238" y="388">추가 정보 없이는 특정 불가</text><text class="small inv" x="238" y="414">통계 작성·과학적 연구·공익적 기록</text><text class="small inv" x="238" y="436">보존 목적이면 동의 없이 활용</text><rect class="node" x="72" y="526" width="464" height="108" rx="6"/><text class="small" x="90" y="556">Anonymous</text><text class="big" x="90" y="584">익명정보</text><line class="thin" x1="222" y1="542" x2="222" y2="618"/><text class="name" x="238" y="558">OOO, 30대</text><text class="body" x="238" y="584">더 이상 개인을 알아볼 수 없음</text><text class="small" x="238" y="610">활용: 제한 없이 자유롭게</text><path class="flow" d="M190 264 V330"/><rect class="mask" x="109.425" y="286" width="161.15" height="22" rx="4"/><text class="lab" x="190" y="302" text-anchor="middle">가명처리 등 비식별 조치</text><path class="dash" d="M420 330 V264"/><rect class="mask" x="330.65" y="286" width="178.7" height="22" rx="4"/><text class="lab" x="420" y="302" text-anchor="middle">추가 정보와 결합 시 재식별</text><path class="flow" d="M304 456 V526"/><rect class="mask" x="203.175" y="480" width="201.65" height="22" rx="4"/><text class="lab" x="304" y="496" text-anchor="middle">추가 정보로도 재식별 불가하게</text><line class="line" x1="44" y1="166" x2="44" y2="624" marker-end="url(#adsp-l02a-pseudonym-a)"/><text class="small" x="26" y="395" text-anchor="middle" transform="rotate(-90 26 395)">아래로 갈수록 식별 가능성 낮음</text><rect class="deep" x="24" y="664" width="512" height="74" rx="6"/><text class="lab" x="40" y="694">데이터 3법 (개인정보보호법·정보통신망법·신용정보법)</text><text class="lab" x="40" y="720">→ 핵심은 ‘가명정보’ 개념의 도입</text><path class="flow" d="M24 768 H54"/><text class="small" x="62" y="773">비식별 조치</text><path class="dash" d="M155.55 768 H185.55"/><text class="small" x="193.55" y="773">재식별 위험</text><rect class="focal" x="287.1" y="760" width="22" height="16" rx="3"/><text class="small" x="317.1" y="773">데이터 3법의 핵심</text>
</svg>
