xt-anchor="middle">n</text><rect x="556" y="152" width="64" height="40" fill="#f3e3dc" stroke="#b9b6ac" stroke-width="1.4"/><text x="588" y="177" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">1</text><text x="588" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">m</text><rect x="428" y="256" width="64" height="40" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.4"/><text x="460" y="281" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#f7f6f2" text-anchor="middle">&amp;n</text><rect x="556" y="256" width="64" height="40" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.4"/><text x="588" y="281" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#f7f6f2" text-anchor="middle">&amp;m</text><text x="460" y="316" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#65645e" text-anchor="middle">p1</text><text x="588" y="316" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#65645e" text-anchor="middle">p2</text><text x="530" y="360" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">출력: 2 1  (원본이 바뀜)</text>
