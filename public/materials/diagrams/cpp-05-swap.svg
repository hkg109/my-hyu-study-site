<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 464" width="720" height="464" role="img" aria-labelledby="cpp-05-swap-title cpp-05-swap-desc">
  <title id="cpp-05-swap-title">swap(n, m)과 swap(&amp;n, &amp;m)의 차이</title>
  <desc id="cpp-05-swap-desc">값으로 받은 swap은 복사본 x, y만 바꿔 n과 m이 1과 2로 그대로 남고, 포인터로 받은 swap은 p1, p2가 n과 m을 가리켜 *p1, *p2를 바꾸므로 n과 m이 2와 1로 바뀐다는 비교 그림</desc>
  <defs>
    <marker id="cpp-05-swap-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-05-swap-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-05-swap-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="464" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">05 · 포인터와 함수</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">swap(n, m)과 swap(&amp;n, &amp;m)의 차이</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <rect x="32" y="112" width="316" height="280" rx="8" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.2"/><text x="44" y="132" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">call by value · swap(n, m)</text><rect x="372" y="112" width="316" height="280" rx="8" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.2"/><text x="384" y="132" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">call by reference · swap(&amp;n, &amp;m)</text><path d="M120 192 L120 256" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-05-swap-m)"/><path d="M248 192 L248 256" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-05-swap-m)"/><rect x="158" y="214" width="52" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="184" y="228.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">값 복사</text><rect x="88" y="152" width="64" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="120" y="177" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">1</text><text x="120" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">n</text><rect x="216" y="152" width="64" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="248" y="177" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">2</text><text x="248" y="144" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">m</text