<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 703" role="img" aria-labelledby="mis-gl-2d-management-systems-title mis-gl-2d-management-systems-desc">
  <title id="mis-gl-2d-management-systems-title">TPS → MIS · DSS → ESS</title>
  <desc id="mis-gl-2d-management-systems-desc">운영 수준의 TPS가 거래 데이터를 중간관리층의 MIS와 DSS에 제공하고, MIS와 DSS가 요약 정보를 최고경영진의 ESS에 제공하며, 세법·경쟁사 같은 외부 정보가 DSS와 ESS에 들어가고, BI 범주가 MIS·DSS·ESS를 포함하는 계층 그림</desc>
  <defs><marker id="mis-gl-2d-management-systems-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2d-management-systems-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2d-management-systems-a)}.flow.both{marker-start:url(#mis-gl-2d-management-systems-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2d-management-systems-m)}.dash.both{marker-start:url(#mis-gl-2d-management-systems-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="703"/>
  <text class="tag" x="24" y="40">2장 · 2-2 관리 계층별 정보시스템</text><text class="title" x="24" y="74">TPS → MIS · DSS → ESS</text><text class="subtitle" x="24" y="104">아래 시스템의 데이터가 위 시스템의 품질을 결정한다. BI는 분석 시스템</text><text class="subtitle" x="24" y="124">전체를 묶는 큰 범주다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="172" width="354" height="287" rx="8"/><text class="small" x="28" y="192">BI 범주 · 분석 도구 전체</text><rect class="focal" x="24" y="206" width="338" height="89.5" rx="6"/><text class="small inv" x="193" y="232" text-anchor="middle">최고경영진 · 전략적·비정형</text><text class="name inv" x="193" y="253" text-anchor="middle">ESS</text><text class="body inv" x="193" y="280" text-anchor="middle">디지털 대시보드·KPI</text><rect class="node" x="24" y="359.5" width="162" height="89.5" rx="6"/><text class="small" x="105" y="385.5" text-anchor="middle">중간 · 정형</text><text class="name" x="105" y="406.5" text-anchor="middle">MIS</text><text class="body" x="105" y="433.5" text-anchor="middle">정기 보고서</text><rect class="node" x="200" y="359.5" width="162" height="89.5" rx="6"/><text class="small" x="281" y="385.5" text-anchor="middle">중간 · 비정형</text><text class="name" x="281" y="406.5" text-anchor="middle">DSS</text><text class="body" x="281" y="433.5" text-anchor="middle">모델·what-if</text><rect class="node" x="24" y="519" width="338" height="89.5" rx="6"/><text class="small" x="193" y="545" text-anchor="middle">운영 수준 · 정형 거래</text><text class="name" x="193" y="566" text-anchor="middle">TPS</text><text class="body" x="193" y="593" text-anchor="middle">주문·급여·배송 기록</text><rect class="outside" x="392" y="272.5" width="144" height="110" rx="6"/><text class="small" x="464" y="298.5" text-anchor="middle">External</text><text class="name" x="464" y="319.5" text-anchor="middle">외부 정보</text><text class="body" x="464" y="346.5" text-anchor="middle">세법·경쟁사</text><text class="body" x="464" y="367" text-anchor="middle">주가</text><path class="flow" d="M105 519 L105 449"/><rect class="mask" x="59.7" y="473" width="90.6" height="22" rx="4"/><text class="lab" x="105" y="489" text-anchor="middle">데이터 제공</text><path class="flow" d="M281 519 L281 449"/><path class="flow" d="M105 359.5 L105 295.5"/><rect class="mask" x="66.9" y="316.5" width="76.1" height="22" rx="4"/><text class="lab" x="105" y="332.5" text-anchor="middle">요약 제공</text><path class="flow" d="M281 359.5 L281 295.5"/><path class="dash" d="M392 300 L362 250.75"/><path class="dash" d="M392 355 L362 404.25"/><path class="flow" d="M24 632.5 H54"/><text class="small" x="62" y="637.5">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 632.5 H221.94875000000002"/><text class="small" x="229.94875000000002" y="637.5">영향·제약</text><rect class="focal" x="312.22900000000004" y="624.5" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="637.5">중심 개념</text><rect class="outside" x="422.34250000000003" y="624.5" width="22" height="16" rx="3"/><text class="small" x="452.34250000000003" y="637.5">조직 밖 주체</text><rect class="zone" x="24" y="650.5" width="22" height="16" rx="3"/><text class="small" x="54" y="663.5">범위·묶음</text>
</svg>
