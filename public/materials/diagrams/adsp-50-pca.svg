<title id="adsp-50-pca-title">주성분은 합 방향과 차 방향</title><desc id="adsp-50-pca-desc">상관계수 0.1인 두 표준화 변수의 분산 타원과 수직인 두 주성분 축. 첫 주성분은 A와 B의 합, 두 번째 주성분은 차 방향이다.</desc>
