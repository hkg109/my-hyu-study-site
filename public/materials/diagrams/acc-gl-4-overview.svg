<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 612" role="img" aria-labelledby="acc-gl-4-overview-title acc-gl-4-overview-desc">
  <title id="acc-gl-4-overview-title">서비스기업의 기말 결산</title>
  <desc id="acc-gl-4-overview-desc">4장의 네 개념 묶음을 회계순환과정과 결산, 결산정리 4유형, 수정후 시산표와 재무제표 작성, 정산표 순서로 지그재그로 잇고 단계·반영·요약이라는 이름표를 단 개요도</desc>
  <defs><marker id="acc-gl-4-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-4-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-4-overview-a)}.flow.both{marker-start:url(#acc-gl-4-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-4-overview-m)}.dash.both{marker-start:url(#acc-gl-4-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="612"/>
  <text class="tag" x="24" y="40">4장 개요 · 개념 묶음 4개</text><text class="title" x="24" y="74">서비스기업의 기말 결산</text><text class="subtitle" x="24" y="104">핵심 질문: 기중 기록이 끝난 장부를 기말에 어떻게 고쳐서 정확한 재무제표를</text><text class="subtitle" x="24" y="124">만드는가?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="224" height="130.5" rx="6"/><text class="small" x="136" y="198" text-anchor="middle">4-1</text><text class="name" x="136" y="219" text-anchor="middle">회계순환과정과 결산</text><text class="body" x="136" y="246" text-anchor="middle">기중: 분개 → 전기</text><text class="body" x="136" y="266.5" text-anchor="middle">기말: 시산표 → 정리 →</text><text class="body" x="136" y="287" text-anchor="middle">재무제표</text><rect class="focal" x="312" y="172" width="224" height="130.5" rx="6"/><text class="small inv" x="424" y="198" text-anchor="middle">4-2</text><text class="name inv" x="424" y="219" text-anchor="middle">결산정리 4유형</text><text class="body inv" x="424" y="246" text-anchor="middle">미수수익·미지급비용</text><text class="body inv" x="424" y="266.5" text-anchor="middle">선급비용·선수수익</text><text class="body inv" x="424" y="287" text-anchor="middle">감가상각 · 대손</text><rect class="node" x="312" y="360.5" width="224" height="133" rx="6"/><text class="small" x="424" y="386.5" text-anchor="middle">4-3</text><text class="name" x="424" y="407.5" text-anchor="middle">수정후 시산표와</text><text class="name" x="424" y="430.5" text-anchor="middle">재무제표</text><text class="body" x="424" y="457.5" text-anchor="middle">손익 먼저 → 순이익 대체</text><text class="body" x="424" y="478" text-anchor="middle">→ 재무상태표</text><rect class="node" x="24" y="360.5" width="224" height="133" rx="6"/><text class="small" x="136" y="398" text-anchor="middle">4-4</text><text class="name" x="136" y="419" text-anchor="middle">정산표</text><text class="body" x="136" y="446" text-anchor="middle">결산 과정 전체를</text><text class="body" x="136" y="466.5" text-anchor="middle">10개 금액 열 한 장에</text><path class="flow" d="M248 237.25 L312 237.25"/><rect class="mask" x="258.6" y="226.25" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="242.25" text-anchor="middle">단계</text><path class="flow" d="M424 302.5 L424 360.5"/><rect class="mask" x="402.6" y="320.5" width="42.9" height="22" rx="4"/><text class="lab" x="424" y="336.5" text-anchor="middle">반영</text><path class="flow" d="M312 427 L248 427"/><rect class="mask" x="258.6" y="416" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="432" text-anchor="middle">요약</text><path class="flow" d="M24 523.5 H54"/><text class="small" x="62" y="528.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="515.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="528.5">중심 개념</text><text class="small" x="24" y="555.5">(주)바람돌이 1월: 수정전 31,600 → 결산정리 1,150 → 수정후 32,150 →</text><text class="small" x="24" y="573.5">순이익 1,450.</text>
</svg>
