<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 798" role="img" aria-labelledby="mis-gl-5d-tco-title mis-gl-5d-tco-desc">
  <title id="mis-gl-5d-tco-title">TCO — 구입가는 빙산의 일각</title>
  <desc id="mis-gl-5d-tco-desc">총소유비용이 보이는 비용인 하드웨어·소프트웨어 구입비 약 20%와 숨은 비용 약 80%로 이루어지고, 숨은 비용에는 설치·교육·지원·유지보수·인프라·다운타임·공간·에너지가 포함되며, 클라우드 서비스 사용과 하드웨어·소프트웨어의 중앙화·표준화로 TCO를 줄인다는 그림</desc>
  <defs><marker id="mis-gl-5d-tco-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-5d-tco-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-5d-tco-a)}.flow.both{marker-start:url(#mis-gl-5d-tco-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-5d-tco-m)}.dash.both{marker-start:url(#mis-gl-5d-tco-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="798"/>
  <text class="tag" x="24" y="40">5장 · 5-5 인프라 관리 과제</text><text class="title" x="24" y="74">TCO — 구입가는 빙산의 일각</text><text class="subtitle" x="24" y="104">TCO는 하드웨어의 숨은 비용을 수치화한다. 구입비는 약 20%이고 나머지 약</text><text class="subtitle" x="24" y="124">80%가 관리·운영 비용이다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="459" width="528" height="144" rx="8"/><text class="small" x="280" y="479" text-anchor="middle">숨은 비용 여덟 가지</text><rect class="focal" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="198" text-anchor="middle">Total cost of ownership</text><text class="name inv" x="280" y="219" text-anchor="middle">TCO · 총소유비용</text><text class="body inv" x="280" y="246" text-anchor="middle">기술 자원을 소유하는 직접·간접 비용의 총합</text><rect class="node" x="24" y="319.5" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="345.5" text-anchor="middle">보이는 비용 · 약 20%</text><text class="name" x="148.5" y="366.5" text-anchor="middle">HW·SW 구입비</text><text class="body" x="148.5" y="393.5" text-anchor="middle">초기 구입·설치</text><rect class="node" x="287" y="319.5" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="345.5" text-anchor="middle">숨은 비용 · 약 80%</text><text class="name" x="411.5" y="366.5" text-anchor="middle">관리·운영 비용</text><text class="body" x="411.5" y="393.5" text-anchor="middle">판서: hidden costs</text><rect class="node" x="24" y="493" width="118" height="45" rx="6"/><text class="name" x="83" y="521" text-anchor="middle">설치</text><rect class="node" x="156" y="493" width="118" height="45" rx="6"/><text class="name" x="215" y="521" text-anchor="middle">교육</text><rect class="node" x="288" y="493" width="118" height="45" rx="6"/><text class="name" x="347" y="521" text-anchor="middle">지원</text><rect class="node" x="420" y="493" width="118" height="45" rx="6"/><text class="name" x="479" y="521" text-anchor="middle">유지보수</text><rect class="node" x="24" y="548" width="118" height="45" rx="6"/><text class="name" x="83" y="576" text-anchor="middle">인프라</text><rect class="node" x="156" y="548" width="118" height="45" rx="6"/><text class="name" x="215" y="576" text-anchor="middle">다운타임</text><rect class="node" x="288" y="548" width="118" height="45" rx="6"/><text class="name" x="347" y="576" text-anchor="middle">공간</text><rect class="node" x="420" y="548" width="118" height="45" rx="6"/><text class="name" x="479" y="576" text-anchor="middle">에너지</text><rect class="node" x="24" y="685" width="249" height="45" rx="6"/><text class="name" x="148.5" y="713" text-anchor="middle">클라우드 서비스 사용</text><rect class="node" x="287" y="685" width="249" height="45" rx="6"/><text class="name" x="411.5" y="713" text-anchor="middle">HW·SW 중앙화·표준화</text><path class="line" d="M280 261.5 V293.4"/><path class="line" d="M148.5 293.4 H411.5"/><path class="flow" d="M148.5 293.4 L148.5 319.5"/><path class="flow" d="M411.5 293.4 L411.5 319.5"/><rect class="mask" x="258.6" y="266.45" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="282.45" text-anchor="middle">구성</text><path class="flow" d="M411.5 409 L411.5 459"/><rect class="mask" x="390.1" y="423" width="42.9" height="22" rx="4"/><text class="lab" x="411.5" y="439" text-anchor="middle">포함</text><path class="flow" d="M280 603 L280 685"/><rect class="mask" x="234.7" y="633" width="90.6" height="22" rx="4"/><text class="lab" x="280" y="649" text-anchor="middle">줄이는 방법</text><path class="flow" d="M24 754 H54"/><text class="small" x="62" y="759">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="746" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="759">중심 개념</text><rect class="zone" x="302.06225" y="746" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="759">범위·묶음</text>
</svg>
