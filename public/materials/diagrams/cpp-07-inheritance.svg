<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 492" width="720" height="492" role="img" aria-labelledby="cpp-07-inheritance-title cpp-07-inheritance-desc">
  <title id="cpp-07-inheritance-title">Cylinder는 Circle을 물려받아 높이와 부피를 더한다</title>
  <desc id="cpp-07-inheritance-desc">기반 클래스 Circle의 protected radius와 virtual area()를 파생 클래스 Cylinder가 물려받고, height 속성과 volume() 메서드를 더하며 area()를 원기둥 겉넓이로 오버라이딩하고, 생성자에서 Circle(r)을 먼저 호출한다는 UML 클래스 그림</desc>
  <defs>
    <marker id="cpp-07-inheritance-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-07-inheritance-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-07-inheritance-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="492" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">07 · 상속</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">Cylinder는 Circle을 물려받아 높이와 부피를 더한다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <path d="M360 300 L360 236" fill="none" stroke="#1d1d1a" stroke-width="1.6" marker-end="url(#cpp-07-inheritance-k)"/><rect x="374" y="258" width="84" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="416" y="272.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">public 상속</text><rect x="208" y="120" width="304" height="116" rx="6" fill="#f7f6f2"/><rect x="208" y="120" width="304" height="116" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><rect x="216" y="126" width="120" height="16" rx="2" fill="#3a3a36" stroke="#55554f"/><text x="276" y="138" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#d9d6cc" text-anchor="middle">base · superclass</text><text x="360" y="171" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#f7f6f2" text-anchor="middle">Circle</text><text x="360" y="191" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#d9d6cc" text-anchor="middle"># radius : double</text><text x="360" y="207" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#d9d6cc" text-anchor="middle">+ virtual area() : double</text><text x="360" y="223" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#d9d6cc" text-anchor="middle">+ Circle(double r)</text><rect x="208" y="300" width="304" height="116" rx="6" fill="#f7f6f2"/><rect x="208" y="300" width="304" height="116" rx="6" fill="#f3e3dc" stroke="#a8431f" stroke-width="1.5"/><rect x="216" y="306" width="128" height="16" rx="2" fill="#f0eee8" stroke="#b9b6ac"/><text x="280" y="318" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#a8431f" text-anchor="middle">derived · subclass</text><text x="360" y="351" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#1d1d1a" text-anchor="middle">Cylinder</text><text x="360" y="371" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">- height : double</text><text x="360" y="387" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">+ area() : double   // 겉넓이</text><text x="360" y="403" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">+ volume() : double</text><text x="536" y="330" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#1d1d1a">Cylinder(r, h)</text><text x="536" y="350" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#1d1d1a">  : Circle(r) { … }</text><text x="536" y="376" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">기반 생성자 먼저</text><text x="32" y="150" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e"># protected</text><text x="32" y="170" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e">+ public</text><text x="32" y="190" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e">- private</text>
