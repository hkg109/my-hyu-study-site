<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 829" role="img" aria-labelledby="mis-gl-5c-web-services-title mis-gl-5c-web-services-desc">
  <title id="mis-gl-5c-web-services-title">웹 서비스 = 표준 중간 계층, 기반은 XML</title>
  <desc id="mis-gl-5c-web-services-desc">Southwest Airlines, 여행사와 여행 예약 시스템, 무선 웹사이트와 미래 파트너의 시스템이 웹 표준으로 웹 서비스 계층과 정보를 교환하고, 웹 서비스 계층이 Dollar Rent A Car의 오래된 예약 시스템과 연결되며, 웹 서비스의 기반 기술은 사용자 정의 태그로 컴퓨터가 데이터를 자동 처리하게 하는 XML이고, 아래에서 파트너마다 전용 연결을 만드는 방식과 웹 서비스 방식을 비교하는 그림</desc>
  <defs><marker id="mis-gl-5c-web-services-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-5c-web-services-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-5c-web-services-a)}.flow.both{marker-start:url(#mis-gl-5c-web-services-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-5c-web-services-m)}.dash.both{marker-start:url(#mis-gl-5c-web-services-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="829"/>
  <text class="tag" x="24" y="40">5장 · 5-4 소프트웨어 플랫폼과 조달</text><text class="title" x="24" y="74">웹 서비스 = 표준 중간 계층, 기반은 XML</text><text class="subtitle" x="24" y="104">Figure 5.7 · 서로 대화하지 못하는 시스템 사이에 표준 계층 하나를 두면</text><text class="subtitle" x="24" y="124">파트너마다 연결을 따로 만들 필요가 없다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="625.5" width="528" height="133.5" rx="8"/><text class="small" x="280" y="645.5" text-anchor="middle">비교 · 파트너가 늘어날 때</text><rect class="outside" x="24" y="172" width="161" height="92" rx="6"/><text class="name" x="104.5" y="200" text-anchor="middle">항공사</text><text class="body" x="104.5" y="227" text-anchor="middle">Southwest</text><text class="body" x="104.5" y="247.5" text-anchor="middle">Airlines</text><rect class="outside" x="199" y="172" width="161" height="92" rx="6"/><text class="name" x="279.5" y="210.25" text-anchor="middle">여행사</text><text class="body" x="279.5" y="237.25" text-anchor="middle">여행 예약 시스템</text><rect class="outside" x="374" y="172" width="161" height="92" rx="6"/><text class="name" x="454.5" y="210.25" text-anchor="middle">무선 웹사이트</text><text class="body" x="454.5" y="237.25" text-anchor="middle">미래 파트너</text><rect class="focal" x="24" y="344" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="370" text-anchor="middle">Web services</text><text class="name inv" x="280" y="391" text-anchor="middle">표준 중간 소프트웨어 계층</text><text class="body inv" x="280" y="418" text-anchor="middle">모든 파트너가 같은 방식으로 접속</text><rect class="node" x="24" y="491.5" width="249" height="110" rx="6"/><text class="small" x="148.5" y="527.75" text-anchor="middle">Dollar Rent A Car</text><text class="name" x="148.5" y="548.75" text-anchor="middle">Legacy 예약 시스템</text><text class="body" x="148.5" y="575.75" text-anchor="middle">교체하지 않고 그대로 사용</text><rect class="node" x="287" y="491.5" width="249" height="110" rx="6"/><text class="small" x="411.5" y="517.5" text-anchor="middle">Extensible Markup Language</text><text class="name" x="411.5" y="538.5" text-anchor="middle">XML</text><text class="body" x="411.5" y="565.5" text-anchor="middle">사용자 정의 태그로 자동 처리</text><text class="body" x="411.5" y="586" text-anchor="middle">HTML은 보여 주기만</text><rect class="node" x="24" y="659.5" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="685.5" text-anchor="middle">전용 연결 방식</text><text class="name" x="148.5" y="706.5" text-anchor="middle">파트너 N곳 → 연결 N개</text><text class="body" x="148.5" y="733.5" text-anchor="middle">파트너가 늘 때마다 개발·유지</text><rect class="node" x="287" y="659.5" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="685.5" text-anchor="middle">웹 서비스 방식</text><text class="name" x="411.5" y="706.5" text-anchor="middle">계층 하나에 모두 접속</text><text class="body" x="411.5" y="733.5" text-anchor="middle">새 파트너도 같은 표준으로</text><path class="flow" d="M148.5 433.5 L148.5 491.5"/><rect class="mask" x="127.1" y="451.5" width="42.9" height="22" rx="4"/><text class="lab" x="148.5" y="467.5" text-anchor="middle">연결</text><path class="flow" d="M411.5 433.5 L411.5 491.5"/><rect class="mask" x="373.4" y="451.5" width="76.1" height="22" rx="4"/><text class="lab" x="411.5" y="467.5" text-anchor="middle">기반 기술</text><path class="line" d="M104.5 264 V292"/><path class="line" d="M279.5 264 V292"/><path class="line" d="M454.5 264 V292"/><path class="line" d="M104.5 292 H454.5"/><path class="flow" d="M280 292 L280 344"/><rect class="mask" x="218.1" y="281" width="123.8" height="22" rx="4"/><text class="lab" x="280" y="297" text-anchor="middle">웹 표준으로 교환</text><path class="flow" d="M24 785 H54"/><text class="small" x="62" y="790">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="777" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="790">중심 개념</text><rect class="outside" x="302.06225" y="777" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="790">조직 밖 주체</text><rect class="zone" x="430.95425" y="777" width="22" height="16" rx="3"/><text class="small" x="460.95425" y="790">범위·묶음</text>
</svg>
