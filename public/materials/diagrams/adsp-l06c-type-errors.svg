<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 596" role="img" aria-labelledby="adsp-l06c-type-errors-title adsp-l06c-type-errors-desc">
  <title id="adsp-l06c-type-errors-title">1종 오류 α와 2종 오류 β</title>
  <desc id="adsp-l06c-type-errors-desc">평균 0인 귀무가설 분포와 평균 2.5인 대립가설 분포가 겹쳐 있고, 우측 단측검정의 임계값 1.645에서 세로선이 그어져 있다. 임계값 오른쪽 H0 분포의 꼬리는 1종 오류 α 0.05, 임계값 왼쪽 H1 분포의 넓이는 2종 오류 β 약 0.20, 오른쪽 H1 넓이는 검정력 1 - β다. 임계값을 오른쪽으로 옮기면 α는 줄고 β는 는다.</desc>
