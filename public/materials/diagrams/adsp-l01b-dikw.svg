<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 822" width="560" height="822" role="img" aria-labelledby="adsp-l01b-dikw-title adsp-l01b-dikw-desc">
  <title id="adsp-l01b-dikw-title">DIKW 피라미드와 우유 가격 예시</title>
  <desc id="adsp-l01b-dikw-desc">아래부터 Data, Information, Knowledge, Wisdom 네 층의 피라미드. 각 층 오른쪽에 편의점 우유 가격 예시를 붙였다. 데이터는 A점 2,500원과 B점 2,900원, 정보는 A점 우유가 더 싸다, 지식은 A점에서 사야겠다, 지혜는 A점은 다른 유제품도 쌀 것이다. 아래 띠는 가공, 맥락 연결, 원리 이해 화살표로 네 층을 잇고, 위로 갈수록 양은 줄고 가치와 추상도는 높아진다고 적었다.</desc>
  <defs><marker id="adsp-l01b-dikw-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l01b-dikw-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l01b-dikw-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l01b-dikw-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="822"/><text class="tag" x="24" y="40">ADsP · 1과목 1장</text><text class="title" x="24" y="74">DIKW — 사실이 지혜가 되기까지</text><text class="subtitle" x="24" y="104">위로 갈수록 양은 줄고 가치·추상도는 높아진다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="small" x="352" y="158">예: 편의점 우유 가격</text><path class="focal" d="M144.0 168 L208.0 168 L237.5 258 L114.5 258 Z"/><text class="small inv" x="176" y="197" text-anchor="middle">Wisdom</text><text class="name inv" x="176" y="219" text-anchor="middle">지혜</text><text class="small inv" x="176" y="241" text-anchor="middle">창의적 통찰</text><rect class="node" x="352" y="179" width="184" height="68" rx="6"/><text class="body" x="444" y="207" text-anchor="middle">A점은 다른 유제품도</text><text class="body" x="444" y="231" text-anchor="middle">쌀 것이다</text><line class="thin" x1="226.8" y1="213.0" x2="352" y2="213.0" stroke-dasharray="3 3"/><path class="deep" d="M114.5 258 L237.5 258 L267.0 348 L85.0 348 Z"/><text class="small" x="176" y="287" text-anchor="middle">Knowledge</text><text class="name" x="176" y="309" text-anchor="middle">지식</text><text class="small" x="176" y="331" text-anchor="middle">예측·행동 계획</text><rect class="node" x="352" y="269" width="184" height="68" rx="6"/><text class="body" x="444" y="297" text-anchor="middle">우유는 A점에서</text><text class="body" x="444" y="321" text-anchor="middle">사야겠다</text><line class="thin" x1="256.2" y1="303.0" x2="352" y2="303.0" stroke-dasharray="3 3"/><path class="zone" d="M85.0 348 L267.0 348 L296.5 438 L55.5 438 Z"/><text class="small" x="176" y="377" text-anchor="middle">Information</text><text class="name" x="176" y="399" text-anchor="middle">정보</text><text class="small" x="176" y="421" text-anchor="middle">패턴·의미 부여</text><rect class="node" x="352" y="359" width="184" height="68" rx="6"/><text class="body" x="444" y="387" text-anchor="middle">A점 우유가</text><text class="body" x="444" y="411" text-anchor="middle">B점보다 싸다</text><line class="thin" x1="285.8" y1="393.0" x2="352" y2="393.0" stroke-dasharray="3 3"/><path class="node" d="M55.5 438 L296.5 438 L326.0 528 L26.0 528 Z"/><text class="small" x="176" y="467" text-anchor="middle">Data</text><text class="name" x="176" y="489" text-anchor="middle">데이터</text><text class="small" x="176" y="511" text-anchor="middle">가공 전 객관적 사실</text><rect class="node" x="352" y="449" width="184" height="68" rx="6"/><text class="body" x="444" y="477" text-anchor="middle">A점 우유 2,500원</text><text class="body" x="444" y="501" text-anchor="middle">B점 우유 2,900원</text><line class="thin" x1="315.2" y1="483.0" x2="352" y2="483.0" stroke-dasharray="3 3"/><text class="lab" x="24" y="568">아래에서 위로 — 한 층씩 올라가는 일</text><rect class="node" x="24" y="608" width="104" height="36" rx="6"/><text class="lab" x="76" y="631" text-anchor="middle">Data</text><path class="flow" d="M128.0 626 H160.0"/><text class="small" x="144" y="600" text-anchor="middle">가공</text><rect class="node" x="160" y="608" width="104" height="36" rx="6"/><text class="lab" x="212" y="631" text-anchor="middle">Information</text><path class="flow" d="M264.0 626 H296.0"/><text class="small" x="280" y="600" text-anchor="middle">맥락 연결</text><rect class="node" x="296" y="608" width="104" height="36" rx="6"/><text class="lab" x="348" y="631" text-anchor="middle">Knowledge</text><path class="flow" d="M400.0 626 H432.0"/><text class="small" x="416" y="600" text-anchor="middle">원리 이해</text><rect class="focal" x="432" y="608" width="104" height="36" rx="6"/><text class="lab inv" x="484" y="631" text-anchor="middle">Wisdom</text><rect class="deep" x="24" y="670" width="512" height="100" rx="6"/><text class="lab" x="40" y="698">구분 기준 · 비교·패턴 발견에서 멈추면 → 정보</text><text class="lab" x="40" y="724">‘○○해야겠다’ (행동 결정) → 지식</text><text class="lab" x="40" y="750">‘다른 것도 그럴 것이다’ (일반화) → 지혜</text><path class="flow" d="M24 800 H54"/><text class="small" x="62" y="805">한 층 위로</text><rect class="focal" x="146.1" y="792" width="22" height="16" rx="3"/><text class="small" x="176.1" y="805">가장 높은 층</text><rect class="deep" x="273.7" y="792" width="22" height="16" rx="3"/><text class="small" x="303.7" y="805">구분 기준</text>
</svg>
