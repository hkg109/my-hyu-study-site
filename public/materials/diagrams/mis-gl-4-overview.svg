<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 749" role="img" aria-labelledby="mis-gl-4-overview-title mis-gl-4-overview-desc">
  <title id="mis-gl-4-overview-title">윤리 분석 틀을 다섯 차원에 적용한다</title>
  <desc id="mis-gl-4-overview-desc">4-1 윤리 쟁점의 구조에서 4-3 책임 개념과 판단 원칙이 나오고, 이 원칙이 다섯 도덕적 차원에 대응하는 4-2와 4-4 정보 권리, 4-5 재산권, 4-6 책임과 시스템 품질, 4-7 삶의 질 묶음에 적용되는 구조</desc>
  <defs><marker id="mis-gl-4-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4-overview-a)}.flow.both{marker-start:url(#mis-gl-4-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4-overview-m)}.dash.both{marker-start:url(#mis-gl-4-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="749"/>
  <text class="tag" x="24" y="40">4장 개요 · 개념 묶음 7개</text><text class="title" x="24" y="74">윤리 분석 틀을 다섯 차원에 적용한다</text><text class="subtitle" x="24" y="104">핵심 질문: 정보시스템이 만든 새로운 힘을 누가 어떤 권리·책임·규칙으로</text><text class="subtitle" x="24" y="124">통제할 것인가?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="433" width="528" height="257.5" rx="8"/><text class="small" x="280" y="453" text-anchor="middle">다섯 도덕적 차원별 쟁점</text><rect class="focal" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="198" text-anchor="middle">4-1</text><text class="name inv" x="280" y="219" text-anchor="middle">윤리 쟁점의 구조</text><text class="body inv" x="280" y="246" text-anchor="middle">개인 → 사회 → 정치로 번지는 파장, 다섯 도덕적 차원</text><rect class="node" x="24" y="319.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="345.5" text-anchor="middle">4-3</text><text class="name" x="280" y="366.5" text-anchor="middle">책임 개념과 판단 원칙</text><text class="body" x="280" y="393.5" text-anchor="middle">책임 → 추적 → 배상 → 적법 절차, 분석 5단계, 6원칙</text><rect class="node" x="24" y="467" width="249" height="110" rx="6"/><text class="small" x="148.5" y="493" text-anchor="middle">정보 권리</text><text class="name" x="148.5" y="514" text-anchor="middle">4-2 · 4-4</text><text class="body" x="148.5" y="541" text-anchor="middle">프로파일링·NORA,</text><text class="body" x="148.5" y="561.5" text-anchor="middle">프라이버시·FIP·동의</text><rect class="node" x="287" y="467" width="249" height="110" rx="6"/><text class="small" x="411.5" y="503.25" text-anchor="middle">재산권</text><text class="name" x="411.5" y="524.25" text-anchor="middle">4-5</text><text class="body" x="411.5" y="551.25" text-anchor="middle">저작권·특허·상표·영업비밀</text><rect class="node" x="24" y="591" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="617" text-anchor="middle">책임·통제 + 시스템 품질</text><text class="name" x="148.5" y="638" text-anchor="middle">4-6</text><text class="body" x="148.5" y="665" text-anchor="middle">소프트웨어 책임, 데이터 품질</text><rect class="node" x="287" y="591" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="617" text-anchor="middle">삶의 질</text><text class="name" x="411.5" y="638" text-anchor="middle">4-7</text><text class="body" x="411.5" y="665" text-anchor="middle">권력 집중·범죄·격차·건강</text><path class="flow" d="M280 261.5 L280 319.5"/><rect class="mask" x="225.3" y="279.5" width="109.3" height="22" rx="4"/><text class="lab" x="280" y="295.5" text-anchor="middle">분석 도구 제공</text><path class="flow" d="M148.5 409 L148.5 467"/><rect class="mask" x="127.1" y="427" width="42.9" height="22" rx="4"/><text class="lab" x="148.5" y="443" text-anchor="middle">적용</text><path class="flow" d="M411.5 409 L411.5 467"/><rect class="mask" x="390.1" y="427" width="42.9" height="22" rx="4"/><text class="lab" x="411.5" y="443" text-anchor="middle">적용</text><path class="flow" d="M24 704.5 H54"/><text class="small" x="62" y="709.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="696.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="709.5">중심 개념</text><rect class="zone" x="302.06225" y="696.5" width="22" height="16" rx="3"/><text class="small" x="332.06225" y="709.5">범위·묶음</text>
</svg>
