<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 832" width="560" height="832" role="img" aria-labelledby="adsp-l02c-data-science-title adsp-l02c-data-science-desc">
  <title id="adsp-l02c-data-science-title">데이터 사이언스의 세 영역과 사이언티스트 역량</title>
  <desc id="adsp-l02c-data-science-desc">세 원이 겹치는 벤 다이어그램. 왼쪽 위 Analytics(수학·확률 모델, 머신러닝), 오른쪽 위 IT 데이터 관리(프로그래밍, 데이터 엔지니어링·DW), 아래 비즈니스 분석(커뮤니케이션, 시각화·발표)이 겹치는 가운데가 데이터 사이언스다. 아래에 하드 스킬(이론 지식, 분석 기술)과 소프트 스킬(통찰력 있는 분석, 설득력 있는 전달, 다분야 간 협력)을 나란히 두고, 가트너의 역량인 데이터 관리, 분석 모델링, 비즈니스 분석, 소프트 스킬에는 하드 스킬이 없다고 강조한다.</desc>
  <defs><marker id="adsp-l02c-data-science-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l02c-data-science-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l02c-data-science-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l02c-data-science-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="832"/><text class="tag" x="24" y="40">ADsP · 1과목 3장</text><text class="title" x="24" y="74">데이터 사이언스 = 세 영역의 교집합</text><text class="subtitle" x="24" y="104">분석 이론 + IT + 비즈니스, 그리고 사람의 역량</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><circle cx="196" cy="262" r="104" fill="#e4e1d8" fill-opacity=".55" stroke="#65645e" stroke-width="1.5"/><circle cx="364" cy="262" r="104" fill="#e4e1d8" fill-opacity=".55" stroke="#65645e" stroke-width="1.5"/><circle cx="280" cy="404" r="104" fill="#e4e1d8" fill-opacity=".55" stroke="#65645e" stroke-width="1.5"/><text class="small" x="152" y="216" text-anchor="middle">Analytics</text><text class="name" x="152" y="239" text-anchor="middle">분석적 영역</text><text class="body" x="152" y="262" text-anchor="middle">수학·확률 모델</text><text class="body" x="152" y="285" text-anchor="middle">머신러닝</text><text class="small" x="408" y="216" text-anchor="middle">IT</text><text class="name" x="408" y="239" text-anchor="middle">데이터 관리</text><text class="body" x="408" y="262" text-anchor="middle">프로그래밍</text><text class="body" x="408" y="285" text-anchor="middle">엔지니어링·DW</text><text class="small" x="280" y="418" text-anchor="middle">Business</text><text class="name" x="280" y="441" text-anchor="middle">비즈니스 분석</text><text class="body" x="280" y="464" text-anchor="middle">커뮤니케이션</text><text class="body" x="280" y="487" text-anchor="middle">시각화·발표</text><rect class="focal" x="236" y="285" width="88" height="50" rx="6"/><text class="lab inv" x="280" y="306" text-anchor="middle">데이터</text><text class="lab inv" x="280" y="326" text-anchor="middle">사이언스</text><text class="lab" x="24" y="540">데이터 사이언티스트의 역량</text><rect class="node" x="24" y="554" width="250" height="140" rx="6"/><text class="small" x="42" y="580">Hard Skill · 이과적</text><text class="name" x="42" y="606">하드 스킬</text><text class="body" x="42" y="634">빅데이터 이론 지식</text><text class="body" x="42" y="656">분석 기술 숙련</text><text class="body" x="42" y="678">머신러닝·통계·코딩</text><rect class="node" x="286" y="554" width="250" height="140" rx="6"/><text class="small" x="304" y="580">Soft Skill · 인문학적</text><text class="name" x="304" y="606">소프트 스킬</text><text class="body" x="304" y="634">통찰력 있는 분석</text><text class="body" x="304" y="656">설득력 있는 전달</text><text class="body" x="304" y="678">다분야 간 협력</text><rect class="focal" x="24" y="710" width="512" height="70" rx="6"/><text class="lab inv" x="40" y="739">가트너 역량 = 데이터 관리 · 분석 모델링 ·</text><text class="lab inv" x="40" y="763">비즈니스 분석 · 소프트 스킬 → 하드 스킬은 없다</text><rect class="zone" x="24" y="802" width="22" height="16" rx="3"/><text class="small" x="54" y="815">구성 영역 (원)</text><rect class="focal" x="165.64" y="802" width="22" height="16" rx="3"/><text class="small" x="195.64" y="815">교집합 · 시험 포인트</text><rect class="node" x="351.29" y="802" width="22" height="16" rx="3"/><text class="small" x="381.29" y="815">역량 묶음</text>
</svg>
