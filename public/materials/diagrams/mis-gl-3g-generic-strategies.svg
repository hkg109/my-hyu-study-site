<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 725" role="img" aria-labelledby="mis-gl-3g-generic-strategies-title mis-gl-3g-generic-strategies-desc">
  <title id="mis-gl-3g-generic-strategies-title">압력에 맞는 네 가지 기본 전략</title>
  <desc id="mis-gl-3g-generic-strategies-desc">가격 경쟁이 심하면 저원가 리더십(Walmart), 대체재가 많으면 제품 차별화(Apple·Nike·Google), 큰 시장에서 열세면 틈새시장 집중(Hilton OnQ), 고객·공급자가 쉽게 떠나면 고객·공급자 친밀성(Amazon·Toyota)으로 대응하는 네 쌍의 화살표 그림</desc>
  <defs><marker id="mis-gl-3g-generic-strategies-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-3g-generic-strategies-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-3g-generic-strategies-a)}.flow.both{marker-start:url(#mis-gl-3g-generic-strategies-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-3g-generic-strategies-m)}.dash.both{marker-start:url(#mis-gl-3g-generic-strategies-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="725"/>
  <text class="tag" x="24" y="40">3장 · 3-4 경쟁 요인과 경쟁 전략 ②</text><text class="title" x="24" y="74">압력에 맞는 네 가지 기본 전략</text><text class="subtitle" x="24" y="104">다섯 힘은 분석, 네 전략은 대응이다. 왼쪽 압력을 읽고 오른쪽 전략과 사례를</text><text class="subtitle" x="24" y="124">고른다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="197" height="89.5" rx="6"/><text class="small" x="122.5" y="211.25" text-anchor="middle">압력</text><text class="name" x="122.5" y="232.25" text-anchor="middle">가격 경쟁이 심하다</text><rect class="focal" x="285" y="172" width="251" height="89.5" rx="6"/><text class="small inv" x="410.5" y="198" text-anchor="middle">Low-cost leadership</text><text class="name inv" x="410.5" y="219" text-anchor="middle">저원가 리더십</text><text class="body inv" x="410.5" y="246" text-anchor="middle">Walmart 연속 보충</text><path class="flow" d="M221 216.75 L285 216.75"/><rect class="mask" x="231.6" y="205.75" width="42.9" height="22" rx="4"/><text class="lab" x="253" y="221.75" text-anchor="middle">대응</text><rect class="node" x="24" y="275.5" width="197" height="110" rx="6"/><text class="small" x="122.5" y="325" text-anchor="middle">압력</text><text class="name" x="122.5" y="346" text-anchor="middle">대체재가 많다</text><rect class="focal" x="285" y="275.5" width="251" height="110" rx="6"/><text class="small inv" x="410.5" y="301.5" text-anchor="middle">Product differentiation</text><text class="name inv" x="410.5" y="322.5" text-anchor="middle">제품 차별화</text><text class="body inv" x="410.5" y="349.5" text-anchor="middle">Apple·Nike·Google, 대량</text><text class="body inv" x="410.5" y="370" text-anchor="middle">맞춤화</text><path class="flow" d="M221 330.5 L285 330.5"/><rect class="mask" x="231.6" y="319.5" width="42.9" height="22" rx="4"/><text class="lab" x="253" y="335.5" text-anchor="middle">대응</text><rect class="node" x="24" y="399.5" width="197" height="89.5" rx="6"/><text class="small" x="122.5" y="438.75" text-anchor="middle">압력</text><text class="name" x="122.5" y="459.75" text-anchor="middle">큰 시장에서 열세</text><rect class="focal" x="285" y="399.5" width="251" height="89.5" rx="6"/><text class="small inv" x="410.5" y="425.5" text-anchor="middle">Focus on market niche</text><text class="name inv" x="410.5" y="446.5" text-anchor="middle">틈새시장 집중</text><text class="body inv" x="410.5" y="473.5" text-anchor="middle">Hilton OnQ (CRM 분석)</text><path class="flow" d="M221 444.25 L285 444.25"/><rect class="mask" x="231.6" y="433.25" width="42.9" height="22" rx="4"/><text class="lab" x="253" y="449.25" text-anchor="middle">대응</text><rect class="node" x="24" y="503" width="197" height="110" rx="6"/><text class="small" x="122.5" y="541" text-anchor="middle">압력</text><text class="name" x="122.5" y="562" text-anchor="middle">고객·공급자가 쉽게</text><text class="name" x="122.5" y="585" text-anchor="middle">떠난다</text><rect class="focal" x="285" y="503" width="251" height="110" rx="6"/><text class="small inv" x="410.5" y="529" text-anchor="middle">Customer &amp; supplier intimacy</text><text class="name inv" x="410.5" y="550" text-anchor="middle">고객·공급자 친밀성</text><text class="body inv" x="410.5" y="577" text-anchor="middle">Amazon 추천, Toyota · 전환</text><text class="body inv" x="410.5" y="597.5" text-anchor="middle">비용 ↑</text><path class="flow" d="M221 558 L285 558"/><rect class="mask" x="231.6" y="547" width="42.9" height="22" rx="4"/><text class="lab" x="253" y="563" text-anchor="middle">대응</text><path class="flow" d="M24 637 H54"/><text class="small" x="62" y="642">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="629" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="642">중심 개념</text><text class="small" x="24" y="669">압력과 전략의 짝은 강의 판서(3장 Slide 32)의 정리다. 실제 기업은 여러</text><text class="small" x="24" y="687">전략을 함께 쓸 수 있다.</text>
</svg>
