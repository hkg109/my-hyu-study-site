<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" role="img" aria-labelledby="cpg-16-handover-title cpg-16-handover-desc">
  <title id="cpg-16-handover-title">다음 회장단을 지정하는 길</title>
  <desc id="cpg-16-handover-desc">현 회장이 새 기수를 DRAFT로 만들고 다음 회장단 이메일을 지정하면 PENDING 요청이 생기고, 요청자가 아닌 다른 회장단이 승인하면 DB 함수가 DRAFT 기수의 승인 명단에 EXECUTIVE로 등록하며, 다음 회장이 첫 로그인하면 DRAFT 기수 Membership이 생겨 세팅 화면을 쓰기 시작하고, 거절·만료된 요청은 기록만 남는 흐름.</desc>
  <defs><marker id="cpg-16-handover-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-16-handover-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-16-handover-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-16-handover-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="800"/>
  <text class="tag" x="24" y="40">06-5 · 회장단 권한 이양</text><text class="title" x="24" y="74">다음 회장단을 지정하는 길</text><text class="subtitle" x="24" y="104">한 사람이 혼자 권한을 넘길 수 없다.</text><text class="subtitle" x="24" y="124">승인 전까지 다음 회장단은 아무 권한도 없다.</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
  <path class="flow" d="M172 224 V264"/><rect class="mask" x="180.0" y="234" width="69.0" height="21" rx="4"/><text class="lab" x="186" y="249">지정 요청</text>
  <path class="flow" d="M172 328 V368"/>
  <path class="flow" d="M172 440 V488"/><rect class="mask" x="180.0" y="454" width="64.9" height="21" rx="4"/><text class="lab" x="186" y="469">승인되면</text>
  <path class="flow" d="M172 552 V600"/><rect class="mask" x="180.0" y="566" width="69.0" height="21" rx="4"/><text class="lab" x="186" y="581">첫 로그인</text>
  <path class="flow" d="M320 404 H380"/><rect class="mask" x="313.8" y="380" width="72.3" height="21" rx="4"/><text class="lab" x="350" y="395" text-anchor="middle">거절·만료</text>
  <rect class="node" x="24" y="152" width="296" height="72" rx="6"/><text class="lab" x="172" y="173.8" text-anchor="middle">현 회장 (ACTIVE EXECUTIVE)</text><text class="small" x="172" y="193.1" text-anchor="middle">새 기수 DRAFT 생성</text><text class="small" x="172" y="212.1" text-anchor="middle">다음 회장단 이메일 지정</text>
  <rect class="deep" x="24" y="264" width="296" height="64" rx="6"/><text class="code" x="172" y="291.5" text-anchor="middle">term_handover_requests</text><text class="small" x="172" y="311.1" text-anchor="middle">status = PENDING · 기한 7일</text>
  <rect class="focal" x="24" y="368" width="296" height="72" rx="6"/><text class="lab inv" x="172" y="389.8" text-anchor="middle">다른 회장단 1명이 승인</text><text class="small inv" x="172" y="409.1" text-anchor="middle">요청자 본인은 승인 불가</text><text class="small inv" x="172" y="428.1" text-anchor="middle">둘 다 ACTIVE EXECUTIVE</text>
  <rect class="outside" x="380" y="368" width="156" height="72" rx="6"/><text class="lab" x="458" y="389.8" text-anchor="middle">요청 종료</text><text class="small" x="458" y="409.1" text-anchor="middle">권한 없음</text><text class="small" x="458" y="428.1" text-anchor="middle">기록만 남음</text>
  <rect class="deep" x="24" y="488" width="296" height="64" rx="6"/><text class="code" x="172" y="515.5" text-anchor="middle">approved_council_accounts</text><text class="small" x="172" y="535.1" text-anchor="middle">DRAFT 기수 · role = EXECUTIVE</text>
  <rect class="node" x="24" y="600" width="296" height="72" rx="6"/><text class="lab" x="172" y="621.8" text-anchor="middle">다음 회장 · DRAFT Membership</text><text class="small" x="172" y="641.1" text-anchor="middle">세팅 화면 시작 (06-6)</text><text class="small" x="172" y="660.1" text-anchor="middle">이 Membership은 DRAFT 준비용</text>
  <text class="small" x="280" y="712" text-anchor="middle">회장단이 한 명도 없을 때만 운영자 비상 절차를 쓴다</text>
  <rect class="focal" x="24" y="748" width="22" height="16" rx="3"/><text class="small" x="54" y="761">두 번째 사람의 확인</text><rect class="deep" x="193.99" y="748" width="22" height="16" rx="3"/><text class="small" x="223.99" y="761">DB 기록</text><rect class="outside" x="293.78000000000003" y="748" width="22" height="16" rx="3"/><text class="small" x="323.78000000000003" y="761">끝난 요청</text>
</svg>
