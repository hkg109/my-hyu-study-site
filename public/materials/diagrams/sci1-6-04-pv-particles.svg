<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 548" width="560" height="548" role="img" aria-labelledby="sci1-6-04-pv-particles-title sci1-6-04-pv-particles-desc">
  <title id="sci1-6-04-pv-particles-title">온도가 일정할 때 압력과 부피</title>
  <desc id="sci1-6-04-pv-particles-desc">피스톤이 달린 원통 세 개를 그렸다. 왼쪽은 추 1개(압력 1)로 기체 부피가 6칸, 가운데는 추 2개(압력 2배)로 부피가 3칸, 오른쪽은 추 3개(압력 3배)로 부피가 2칸이다. 세 원통 모두 입자 8개가 들어 있고 압력이 커질수록 입자 사이 거리가 가까워지며 벽에 부딪히는 횟수가 많아진다. 아래 띠에는 입자 수, 크기, 질량은 변하지 않는다고 적었다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.ptc{fill:#1d1d1a}.ptcl{fill:#65645e}</style>
  <rect class="bg" width="560" height="548"/><text class="tag" x="24.0" y="40.0">중1 과학 · VI. 기체의 성질</text><text class="title" x="24.0" y="74.0">온도가 일정할 때 압력과 부피</text><text class="subtitle" x="24.0" y="104.0">누르는 힘을 키우면 같은 입자가 더 좁은 공간에 모인다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><path class="line" d="M53.0,146.0 L53.0,360.0 L163.0,360.0 L163.0,146.0"/><rect class="solid" x="54.0" y="168.0" width="108.0" height="12.0" rx="2"/><rect class="focal" x="95.0" y="150.0" width="26.0" height="18.0" rx="2"/><circle class="ptc" cx="85.4" cy="351.1" r="5.5"/><circle class="ptc" cx="79.4" cy="304.1" r="5.5"/><circle class="ptc" cx="64.0" cy="221.5" r="5.5"/><circle class="ptc" cx="147.8" cy="253.6" r="5.5"/><circle class="ptc" cx="123.0" cy="336.8" r="5.5"/><circle class="ptc" cx="147.6" cy="290.5" r="5.5"/><circle class="ptc" cx="142.6" cy="219.0" r="5.5"/><circle class="ptc" cx="97.1" cy="279.1" r="5.5"/><text class="name" x="108.0" y="392.0" text-anchor="middle">압력 1</text><text class="lab" x="108.0" y="414.0" text-anchor="middle">부피 6</text><line x1="172.0" y1="250.0" x2="203.0" y2="250.0" stroke="#65645e" stroke-width="2.5"/><path d="M212.0,250.0 L203.0,254.1 L203.0,246.0 Z" fill="#65645e"/><path class="line" d="M225.0,146.0 L225.0,360.0 L335.0,360.0 L335.0,146.0"/><rect class="solid" x="226.0" y="258.0" width="108.0" height="12.0" rx="2"/><rect class="focal" x="252.0" y="240.0" width="26.0" height="18.0" rx="2"/><rect class="focal" x="282.0" y="240.0" width="26.0" height="18.0" rx="2"/><circle class="ptc" cx="257.5" cy="284.9" r="5.5"/><circle class="ptc" cx="254.8" cy="305.9" r="5.5"/><circle class="ptc" cx="314.0" cy="351.1" r="5.5"/><circle class="ptc" cx="280.0" cy="325.4" r="5.5"/><circle class="ptc" cx="288.8" cy="285.1" r="5.5"/><circle class="ptc" cx="315.4" cy="318.7" r="5.5"/><circle class="ptc" cx="248.6" cy="339.0" r="5.5"/><circle class="ptc" cx="323.7" cy="286.0" r="5.5"/><text class="name" x="280.0" y="392.0" text-anchor="middle">압력 2배</text><text class="lab" x="280.0" y="414.0" text-anchor="middle">부피 1/2</text><line x1="344.0" y1="250.0" x2="375.0" y2="250.0" stroke="#65645e" stroke-width="2.5"/><path d="M384.0,250.0 L375.0,254.1 L375.0,246.0 Z" fill="#65645e"/><path class="line" d="M397.0,146.0 L397.0,360.0 L507.0,360.0 L507.0,146.0"/><rect class="solid" x="398.0" y="288.0" width="108.0" height="12.0" rx="2"/><rect class="focal" x="409.0" y="270.0" width="26.0" height="18.0" rx="2"/><rect class="focal" x="439.0" y="270.0" width="26.0" height="18.0" rx="2"/><rect class="focal" x="469.0" y="270.0" width="26.0" height="18.0" rx="2"/><circle class="ptc" cx="429.5" cy="316.2" r="5.5"/><circle class="ptc" cx="476.9" cy="346.3" r="5.5"/><circle class="ptc" cx="462.8" cy="343.5" r="5.5"/><circle class="ptc" cx="457.2" cy="321.1" r="5.5"/><circle class="ptc" cx="426.8" cy="341.9" r="5.5"/><circle class="ptc" cx="474.1" cy="318.0" r="5.5"/><circle class="ptc" cx="412.0" cy="319.8" r="5.5"/><circle class="ptc" cx="495.4" cy="342.6" r="5.5"/><text class="name" x="452.0" y="392.0" text-anchor="middle">압력 3배</text><text class="lab" x="452.0" y="414.0" text-anchor="middle">부피 1/3</text><text class="small" x="194.0" y="238.0" text-anchor="middle">추 추가</text><text class="small" x="366.0" y="238.0" text-anchor="middle">추 추가</text><rect class="zone" x="24.0" y="436.0" width="512.0" height="26.0" rx="4"/><text class="lab" x="36.0" y="454.0">입자 사이 거리</text><text class="small" x="260.0" y="454.0" text-anchor="middle">멀다  →  가깝다</text><rect class="zone" x="24.0" y="466.0" width="512.0" height="26.0" rx="4"/><text class="lab" x="36.0" y="484.0">벽 충돌 횟수</text><text class="small" x="260.0" y="484.0" text-anchor="middle">적다  →  많다</text><rect class="focal" x="24.0" y="500.0" width="512.0" height="30.0" rx="4"/><text class="lab inv" x="280.0" y="520.0" text-anchor="middle">세 경우 모두 입자 8개 · 입자 크기와 질량도 그대로</text>
</svg>
