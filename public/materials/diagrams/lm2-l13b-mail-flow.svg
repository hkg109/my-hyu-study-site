<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img" aria-labelledby="lm2-l13b-mail-flow-title lm2-l13b-mail-flow-desc">
  <title id="lm2-l13b-mail-flow-title">메일이 전달되는 길</title>
  <desc id="lm2-l13b-mail-flow-desc">보내는 사람의 MUA가 SMTP 25번으로 보내는 쪽 MTA에 메일을 넘기고, MTA는 인터넷을 거쳐 SMTP 25번으로 받는 쪽 MTA에 전달한다. 받는 쪽 MTA는 MDA에 넘기고, MDA는 /var/spool/mail 메일함에 저장한다. 받는 사람의 MUA는 POP3 110번 또는 IMAP 143번으로 메일을 가져온다. 위쪽 구간은 모두 SMTP, 아래쪽 구간은 POP3 또는 IMAP이다.</desc>
  <defs><marker id="lm2-l13b-mail-flow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l13b-mail-flow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l13b-mail-flow-a)}.flow.both{marker-start:url(#lm2-l13b-mail-flow-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l13b-mail-flow-m)}.dash.both{marker-start:url(#lm2-l13b-mail-flow-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="640"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 3과목 2장</text><text class="title" x="24" y="74">메일이 전달되는 길</text><text class="subtitle" x="24" y="104">보내고 서버끼리 주고받는 것은 SMTP, 메일함에서 꺼내 오는 것만</text><text class="subtitle" x="24" y="124">POP3·IMAP이다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="170" width="528" height="268" rx="6"/><text class="small" x="28" y="190">보내기·전달 구간 — 모두 SMTP</text><rect class="node" x="24" y="204" width="196" height="84" rx="6"/><text class="small" x="122.0" y="228" text-anchor="middle">보내는 사람</text><text class="name" x="122.0" y="252" text-anchor="middle">MUA</text><text class="small" x="122.0" y="274" text-anchor="middle">Thunderbird · mutt</text><rect class="node" x="340" y="204" width="196" height="84" rx="6"/><text class="small" x="438.0" y="228" text-anchor="middle">보내는 쪽 서버</text><text class="name" x="438.0" y="252" text-anchor="middle">MTA</text><text class="small" x="438.0" y="274" text-anchor="middle">sendmail · postfix</text><path class="flow" d="M220 246.0 L340 246.0"/><rect class="mask" x="230.0" y="235.0" width="80.0" height="22" rx="4"/><text class="lab" x="270" y="251.0" text-anchor="middle">SMTP 25</text><rect class="focal" x="340" y="338" width="196" height="84" rx="6"/><text class="small inv" x="438.0" y="362" text-anchor="middle">받는 쪽 서버</text><text class="name inv" x="438.0" y="386" text-anchor="middle">MTA</text><text class="small inv" x="438.0" y="408" text-anchor="middle">메일 수신·중계</text><path class="flow" d="M438 288 L438 338"/><rect class="mask" x="368.0" y="302" width="140.0" height="22" rx="4"/><text class="lab" x="438" y="318" text-anchor="middle">SMTP 25 · 인터넷</text><rect class="node" x="24" y="338" width="196" height="84" rx="6"/><text class="small" x="122.0" y="362" text-anchor="middle">배달</text><text class="name" x="122.0" y="386" text-anchor="middle">MDA</text><text class="small" x="122.0" y="408" text-anchor="middle">procmail · maildrop</text><path class="flow" d="M340 380.0 L220 380.0"/><rect class="mask" x="255.0" y="369.0" width="50.0" height="22" rx="4"/><text class="lab" x="280" y="385.0" text-anchor="middle">넘김</text><rect class="deep" x="16" y="452" width="528" height="138" rx="6"/><text class="small" x="150" y="472">받아 오기 구간 — POP3 또는 IMAP</text><rect class="node" x="24" y="488" width="196" height="84" rx="6"/><text class="small" x="122.0" y="512" text-anchor="middle">메일함</text><text class="name" x="122.0" y="536" text-anchor="middle">/var/spool/mail</text><text class="small" x="122.0" y="558" text-anchor="middle">MRA: dovecot</text><path class="flow" d="M122 422 L122 488"/><rect class="node" x="340" y="488" width="196" height="84" rx="6"/><text class="small" x="438.0" y="512" text-anchor="middle">받는 사람</text><text class="name" x="438.0" y="536" text-anchor="middle">MUA</text><text class="small" x="438.0" y="558" text-anchor="middle">Outlook · Thunderbird</text><path class="flow" d="M220 530.0 L340 530.0"/><rect class="mask" x="238.0" y="500.0" width="84.0" height="22" rx="4"/><text class="lab" x="280" y="516.0" text-anchor="middle">POP3 110</text><rect class="mask" x="238.0" y="538.0" width="84.0" height="22" rx="4"/><text class="lab" x="280" y="554.0" text-anchor="middle">IMAP 143</text><text class="small" x="24" y="616">POP3: 내려받고 서버에서 삭제(기본) · IMAP: 서버에 남겨 두고 동기화</text>
</svg>
