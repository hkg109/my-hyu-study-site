<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 512" width="560" height="512" role="img" aria-labelledby="sci1-6-05-pv-graph-title sci1-6-05-pv-graph-desc">
  <title id="sci1-6-05-pv-graph-title">압력과 부피는 반비례한다</title>
  <desc id="sci1-6-05-pv-graph-desc">가로축은 압력(기압) 0부터 7, 세로축은 부피(L) 0부터 7인 그래프에 압력 곱하기 부피가 6인 곡선을 그렸다. 곡선 위 점 (1, 6), (2, 3), (3, 2), (6, 1)을 표시하고 각 점에서 원점까지의 직사각형 넓이가 모두 같음을 점선으로 보여 준다. 오른쪽 표는 1×6, 2×3, 3×2, 6×1이 모두 6으로 압력과 부피의 곱이 항상 일정하다고 정리한다. 곡선은 축에 점점 가까워질 뿐 원점을 지나지 않는다.</desc>
