<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 782" role="img" aria-labelledby="adsp-l08d-decomposition-title adsp-l08d-decomposition-desc">
  <title id="adsp-l08d-decomposition-title">시계열을 네 요인으로 나누기</title>
  <desc id="adsp-l08d-decomposition-desc">월별 8년 합성 시계열을 추세, 계절, 순환, 불규칙 네 줄로 분해한 그림. 추세는 꾸준히 오르고, 계절 요인은 12개월마다 같은 모양으로 반복되며, 순환 요인은 봉우리 사이 간격이 매번 다르고, 불규칙 요인은 무작위 잔차다.</desc>
