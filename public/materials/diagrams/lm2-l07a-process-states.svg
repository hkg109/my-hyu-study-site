<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 880" role="img" aria-labelledby="lm2-l07a-process-states-title lm2-l07a-process-states-desc">
<title id="lm2-l07a-process-states-title">프로세스 상태 전이와 시그널</title>
<desc id="lm2-l07a-process-states-desc">fork로 생성된 프로세스가 실행·실행 대기 상태 R을 중심으로 이벤트를 기다리면 S나 D로 갔다가 깨어나 돌아오고, 19 SIGSTOP이나 20 SIGTSTP를 받으면 정지 T가 되었다가 18 SIGCONT로 돌아오며, 종료하면 부모가 회수할 때까지 좀비 Z로 남았다가 사라지는 상태 전이도</desc>
<defs><marker id="lm2-l07a-process-states-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l07a-process-states-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
<style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l07a-process-states-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l07a-process-states-m)}.plain{marker-end:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:700 16px 'D2Coding','JetBrains Mono','Menlo','Consolas',monospace;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
<rect class="bg" width="560" height="880"/>
<text class="tag" x="24" y="40">리눅스마스터 2급 · 2과목 3장</text><text class="title" x="24" y="74">프로세스 상태 전이와 시그널</text><text class="subtitle" x="24" y="104">ps의 STAT 글자 하나가 지금 어느 칸에 있는지를 말한다. 정지·재개·</text><text class="subtitle" x="24" y="124">종료는 시그널이 일으킨다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
<rect class="outside" x="170" y="170" width="220" height="56" rx="6"/><text class="name" x="280.0" y="193.0" text-anchor="middle">생성</text><text class="small" x="280.0" y="215.0" text-anchor="middle">부모가 fork() → exec()</text>
<rect class="focal" x="100" y="286" width="360" height="80" rx="6"/><text class="name inv" x="280.0" y="321.0" text-anchor="middle">R · 실행 / 실행 대기</text><text class="small inv" x="280.0" y="343.0" text-anchor="middle">CPU를 쓰거나 차례를 기다림</text>
<path class="flow" d="M280 226 V286"/>
<rect class="node" x="24" y="436" width="220" height="96" rx="6"/><text class="name" x="134.0" y="468.0" text-anchor="middle">S · D 대기</text><text class="body" x="134.0" y="490.0" text-anchor="middle">I/O·이벤트를 기다림</text><text class="small" x="134.0" y="512.0" text-anchor="middle">D는 시그널로 못 깨움</text>
<rect class="node" x="316" y="436" width="220" height="96" rx="6"/><text class="name" x="426.0" y="468.0" text-anchor="middle">T · 정지</text><text class="body" x="426.0" y="490.0" text-anchor="middle">시그널로 멈춤</text><text class="small" x="426.0" y="512.0" text-anchor="middle">Ctrl+Z = 20 TSTP</text>
<path class="flow" d="M130 366 V436"/><path class="flow" d="M170 436 V366"/>
<rect class="mask" x="40.0" y="391" width="84.0" height="22" rx="4"/><text class="lab" x="82.0" y="407" text-anchor="middle">이벤트 대기</text>
<rect class="mask" x="176.0" y="391" width="56.0" height="22" rx="4"/><text class="lab" x="204.0" y="407" text-anchor="middle">깨어남</text>
<path class="flow" d="M390 366 V436"/><path class="flow" d="M430 436 V366"/>
<rect class="mask" x="322.0" y="391" width="62.0" height="22" rx="4"/><text class="lab" x="353.0" y="407" text-anchor="middle">19 · 20</text>
<rect class="mask" x="436.0" y="391" width="66.0" height="22" rx="4"/><text class="lab" x="469.0" y="407" text-anchor="middle">18 CONT</text>
<rect class="deep" x="150" y="600" width="260" height="80" rx="6"/><text class="name" x="280.0" y="635.0" text-anchor="middle">Z · 좀비</text><text class="small" x="280.0" y="657.0" text-anchor="middle">종료했지만 부모가 아직 회수 안 함</text>
<path class="flow" d="M280 366 V600"/>
<rect class="mask" x="192.0" y="555" width="176.0" height="22" rx="4"/><text class="lab" x="280.0" y="571" text-anchor="middle">exit · 15 TERM · 9 KILL</text>
<rect class="outside" x="170" y="736" width="220" height="52" rx="6"/><text class="name" x="280.0" y="768.0" text-anchor="middle">소멸 · PID 반환</text>
<path class="flow" d="M280 680 V736"/>
<rect class="mask" x="205.0" y="698" width="150.0" height="22" rx="4"/><text class="lab" x="280.0" y="714" text-anchor="middle">부모가 wait()로 회수</text>
<path class="flow" d="M24 834 H54"/><text class="small" x="62" y="839">전이·시그널</text><rect class="focal" x="163.0" y="826" width="22" height="16" rx="3"/><text class="small" x="193.0" y="839">중심 상태</text><rect class="deep" x="275.0" y="826" width="22" height="16" rx="3"/><text class="small" x="305.0" y="839">kill로 못 지움</text><rect class="outside" x="427.0" y="826" width="22" height="16" rx="3"/><text class="small" x="457.0" y="839">시작·끝</text>
</svg>
