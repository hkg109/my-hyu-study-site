<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 782" role="img" aria-labelledby="adsp-l08c-stationarity-title adsp-l08c-stationarity-desc">
  <title id="adsp-l08c-stationarity-title">정상 시계열로 만드는 법</title>
  <desc id="adsp-l08c-stationarity-desc">세 줄. 첫째는 평균과 흔들림 폭이 일정한 정상 시계열. 둘째는 평균이 계속 오르는 추세 시계열을 1차 차분하면 평균이 일정해진다. 셋째는 수준이 오를수록 흔들림이 커지는 시계열을 로그 변환하면 폭이 일정해지지만 추세는 남아 이어서 차분한다.</desc>
  <defs><marker id="adsp-l08c-stationarity-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l08c-stationarity-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
