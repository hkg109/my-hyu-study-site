<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-labelledby="sci1-6-09-water-doll-title sci1-6-09-water-doll-desc">
  <title id="sci1-6-09-water-doll-title">물 뿜는 인형의 원리</title>
  <desc id="sci1-6-09-water-doll-desc">세 칸으로 물 뿜는 인형이 물을 뿜는 과정을 나타냈다. 첫째 칸은 인형을 뜨거운 물에 담그면 안의 공기가 팽창하여 일부가 아래쪽 구멍으로 거품이 되어 빠져나간다. 둘째 칸은 인형을 찬물로 옮기면 공기가 수축하여 부피가 줄고 구멍으로 물이 들어온다. 셋째 칸은 인형 위에 뜨거운 물을 부으면 안의 공기가 데워져 부피가 늘어나 아래에 고인 물을 구멍 밖으로 밀어내어 물줄기가 뿜어져 나온다. 인형 안의 기체 입자는 데워질 때 화살표가 길고 식을 때 짧다.</desc>
