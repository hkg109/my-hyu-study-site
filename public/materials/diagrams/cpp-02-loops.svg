  <title id="cpp-02-loops-title">조건을 언제 검사하느냐가 다르다</title>
  <desc id="cpp-02-loops-desc">while은 본문 전에 조건을 검사해 0번 실행될 수 있고, do-while은 본문 뒤에 검사해 최소 한 번 실행되며, for는 초기화 후 조건 검사, 본문, 갱신을 반복한다는 세 흐름도</desc>
