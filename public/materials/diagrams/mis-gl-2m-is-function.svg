<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 858" role="img" aria-labelledby="mis-gl-2m-is-function-title mis-gl-2m-is-function-desc">
  <title id="mis-gl-2m-is-function-title">누가 IT를 결정하고 누가 책임지는가</title>
  <desc id="mis-gl-2m-is-function-desc">IT 거버넌스가 결정 권한과 책임을 중앙 IT와 사업부에 배분하고, 두 쪽이 데이터와 AI 책임을 공유하며, CIO가 이끄는 IS 부서와 시스템 분석가, 그리고 CIO·CISO·CPO·CKO·CDO·CAIO의 담당 영역을 보여 주는 그림</desc>
  <defs><marker id="mis-gl-2m-is-function-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2m-is-function-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2m-is-function-a)}.flow.both{marker-start:url(#mis-gl-2m-is-function-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2m-is-function-m)}.dash.both{marker-start:url(#mis-gl-2m-is-function-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="858"/>
  <text class="tag" x="24" y="40">2장 · 2-9 IS 기능과 IT 거버넌스</text><text class="title" x="24" y="74">누가 IT를 결정하고 누가 책임지는가</text><text class="subtitle" x="24" y="104">IT 거버넌스가 결정 권한과 책임을 배분하고, IS 부서와 C-level 역할이 그</text><text class="subtitle" x="24" y="124">틀 안에서 일한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="198" text-anchor="middle">IT governance</text><text class="name inv" x="280" y="219" text-anchor="middle">결정 권한 + 책임</text><text class="body inv" x="280" y="246" text-anchor="middle">IT가 사업 전략을 지원하게 하는 틀</text><rect class="node" x="24" y="319.5" width="224" height="110" rx="6"/><text class="small" x="136" y="345.5" text-anchor="middle">Central · 중앙 IT</text><text class="name" x="136" y="366.5" text-anchor="middle">표준·통제</text><text class="body" x="136" y="393.5" text-anchor="middle">아키텍처·보안</text><text class="body" x="136" y="414" text-anchor="middle">공유 플랫폼·데이터 표준</text><rect class="node" x="312" y="319.5" width="224" height="110" rx="6"/><text class="small" x="424" y="345.5" text-anchor="middle">Distributed · 사업부</text><text class="name" x="424" y="366.5" text-anchor="middle">현장 실행</text><text class="body" x="424" y="393.5" text-anchor="middle">성과 정의·우선순위</text><text class="body" x="424" y="414" text-anchor="middle">프로세스 개선·도입</text><path class="flow both" d="M248 374.5 L312 374.5"/><rect class="mask" x="258.6" y="363.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="379.5" text-anchor="middle">공유</text><rect class="node" x="24" y="487.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="513.5" text-anchor="middle">IS department · CIO가 지휘</text><text class="name" x="280" y="534.5" text-anchor="middle">IS 부서</text><text class="body" x="280" y="561.5" text-anchor="middle">시스템 분석가 = 업무 ↔ 기술 번역자</text><rect class="node" x="24" y="635" width="161" height="71.5" rx="6"/><text class="name" x="104.5" y="663" text-anchor="middle">CIO</text><text class="body" x="104.5" y="690" text-anchor="middle">IT 전체</text><rect class="node" x="199" y="635" width="161" height="71.5" rx="6"/><text class="name" x="279.5" y="663" text-anchor="middle">CISO</text><text class="body" x="279.5" y="690" text-anchor="middle">보안</text><rect class="node" x="374" y="635" width="161" height="71.5" rx="6"/><text class="name" x="454.5" y="663" text-anchor="middle">CPO</text><text class="body" x="454.5" y="690" text-anchor="middle">프라이버시</text><rect class="node" x="24" y="718.5" width="161" height="71.5" rx="6"/><text class="name" x="104.5" y="746.5" text-anchor="middle">CKO</text><text class="body" x="104.5" y="773.5" text-anchor="middle">지식</text><rect class="node" x="199" y="718.5" width="161" height="71.5" rx="6"/><text class="name" x="279.5" y="746.5" text-anchor="middle">CDO</text><text class="body" x="279.5" y="773.5" text-anchor="middle">데이터</text><rect class="node" x="374" y="718.5" width="161" height="71.5" rx="6"/><text class="name" x="454.5" y="746.5" text-anchor="middle">CAIO</text><text class="body" x="454.5" y="773.5" text-anchor="middle">AI</text><path class="line" d="M280 261.5 V293.4"/><path class="line" d="M136 293.4 H424"/><path class="flow" d="M136 293.4 L136 319.5"/><path class="flow" d="M424 293.4 L424 319.5"/><rect class="mask" x="258.6" y="266.45" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="282.45" text-anchor="middle">배분</text><path class="line" d="M136 429.5 V455.6"/><path class="line" d="M424 429.5 V455.6"/><path class="line" d="M136 455.6 H424"/><path class="flow" d="M280 455.6 L280 487.5"/><rect class="mask" x="258.6" y="460.55" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="476.55" text-anchor="middle">운영</text><path class="line" d="M280 577 V608.9"/><path class="line" d="M104.5 608.9 H454.5"/><path class="flow" d="M104.5 608.9 L104.5 635"/><path class="flow" d="M279.5 608.9 L279.5 635"/><path class="flow" d="M454.5 608.9 L454.5 635"/><rect class="mask" x="241.9" y="581.95" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="597.95" text-anchor="middle">임원 역할</text><path class="flow" d="M24 814 H54"/><text class="small" x="62" y="819">흐름·데이터 제공</text><path class="flow both" d="M193.94875000000002 814 H221.94875000000002"/><text class="small" x="229.94875000000002" y="819">상호 영향</text><rect class="focal" x="310.06225" y="806" width="22" height="16" rx="3"/><text class="small" x="340.06225" y="819">중심 개념</text>
