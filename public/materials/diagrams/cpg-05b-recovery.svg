<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" role="img" aria-labelledby="cpg-05b-recovery-title cpg-05b-recovery-desc">
  <title id="cpg-05b-recovery-title">순번과 Snapshot으로 복구하기</title>
  <desc id="cpg-05b-recovery-desc">재접속하면 최신 Snapshot과 그 뒤 Update로 문서를 복원하고, 받은 순번이 5 다음 7이면 6이 빠졌음을 알아차려 DB에서 다시 읽으며, 같은 client_update_id로 재시도해도 한 번만 저장된다는 세 가지 복구 장면.</desc>
  <defs><marker id="cpg-05b-recovery-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-05b-recovery-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-05b-recovery-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-05b-recovery-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="760"/>
  <text class="tag" x="24" y="40">5편 · 실시간 공동편집</text><text class="title" x="24" y="74">순번과 Snapshot으로 복구하기</text><text class="subtitle" x="24" y="104">Broadcast는 놓칠 수 있다. DB에 남은 순번이 기준이다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <rect class="zone" x="24" y="148" width="512" height="164" rx="6"/>
  <text class="name" x="40" y="174">① 재접속 · 새로 열기</text>
  <rect class="deep" x="40" y="192" width="160" height="44" rx="6"/><text class="lab" x="120" y="218.8" text-anchor="middle">Snapshot ≤ #4</text>
  <text class="big" x="214" y="220">+</text>
  <rect class="node" x="240" y="192" width="64" height="44" rx="6"/><text class="lab" x="272" y="218.8" text-anchor="middle">#5</text>
  <rect class="node" x="312" y="192" width="64" height="44" rx="6"/><text class="lab" x="344" y="218.8" text-anchor="middle">#6</text>
  <rect class="node" x="384" y="192" width="64" height="44" rx="6"/><text class="lab" x="416" y="218.8" text-anchor="middle">#7</text>
  <path class="flow" d="M452 214 H484"/>
  <text class="lab" x="510" y="220" text-anchor="middle">문서</text>
  <text class="small" x="40" y="278">Snapshot이 포함한 마지막 순번(last_sequence_no) 뒤만 읽는다</text>
  <text class="small" x="40" y="298">오래된 Update 정리도 이 순번 이하만 대상</text>
  <rect class="zone" x="24" y="332" width="512" height="176" rx="6"/>
  <text class="name" x="40" y="358">② Broadcast 유실 · 순번 공백 감지</text>
  <rect class="node" x="40" y="376" width="64" height="44" rx="6"/><text class="lab" x="72" y="402.8" text-anchor="middle">#5</text>
  <rect class="outside" x="112" y="376" width="64" height="44" rx="6"/><text class="lab" x="144" y="402.8" text-anchor="middle">#6</text>
  <rect class="node" x="184" y="376" width="64" height="44" rx="6"/><text class="lab" x="216" y="402.8" text-anchor="middle">#7</text>
  <rect class="focal" x="272" y="376" width="248" height="44" rx="6"/><text class="lab inv" x="396" y="402.8" text-anchor="middle">5 다음 7 → 6이 빠짐</text>
  <path class="flow" d="M144 420 V452"/>
  <rect class="node" x="112" y="452" width="408" height="40" rx="6"/><text class="body" x="316" y="477.0" text-anchor="middle">DB에서 #6을 다시 읽고 순서대로 적용</text>
  <rect class="zone" x="24" y="528" width="512" height="156" rx="6"/>
  <text class="name" x="40" y="554">③ 저장 실패 후 재시도 · 멱등성</text>
  <rect class="node" x="40" y="572" width="152" height="44" rx="6"/><text class="small" x="116" y="598.6" text-anchor="middle">update id = u-17</text>
  <rect class="node" x="40" y="624" width="152" height="44" rx="6"/><text class="small" x="116" y="650.6" text-anchor="middle">update id = u-17</text>
  <path class="flow" d="M192 594 H292 Q300 594 300 602 V616"/>
  <path class="flow" d="M192 646 H264"/>
  <rect class="deep" x="264" y="616" width="256" height="60" rx="6"/><text class="lab" x="392" y="641.3" text-anchor="middle">DB에는 한 번만 기록</text><text class="small" x="392" y="660.6" text-anchor="middle">기존 순번을 돌려준다</text>
  <rect class="focal" x="24" y="712" width="22" height="16" rx="3"/><text class="small" x="54" y="725">이상 감지</text><rect class="deep" x="132.97" y="712" width="22" height="16" rx="3"/><text class="small" x="162.97" y="725">기준이 되는 저장</text><rect class="outside" x="285.68" y="712" width="22" height="16" rx="3"/><text class="small" x="315.68" y="725">받지 못한 Update</text>
</svg>
