<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 616" width="560" height="616" role="img" aria-labelledby="sci1-6-00-map-title sci1-6-00-map-desc">
  <title id="sci1-6-00-map-title">VI. 기체의 성질 — 단원 한눈에 보기</title>
  <desc id="sci1-6-00-map-desc">단원의 흐름을 위에서 아래로 네 단계로 보여 준다. 1 압력의 뜻(힘의 크기를 면적으로 나눈 값), 2 기체의 압력(입자가 벽에 충돌하여 모든 방향으로 미는 힘), 3 온도가 일정할 때 압력과 부피 관계, 4 압력이 일정할 때 온도와 부피 관계. 오른쪽에는 단원 질문인 물 뿜는 인형을 그리고, 찬물에서는 공기 부피가 줄어 물이 들어가고 뜨거운 물에서는 부피가 늘어 물을 밀어낸다고 적었다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.ptc{fill:#1d1d1a}.ptcl{fill:#65645e}</style>
  <rect class="bg" width="560" height="616"/><text class="tag" x="24.0" y="40.0">중1 과학 · VI. 기체의 성질</text><text class="title" x="24.0" y="74.0">VI. 기체의 성질 — 단원 한눈에 보기</text><text class="subtitle" x="24.0" y="104.0">압력의 뜻 → 기체의 압력 → 압력·온도에 따른 부피 변화</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="156.0" width="330.0" height="70.0" rx="6"/><circle class="node" cx="56.0" cy="191.0" r="17.0"/><text class="name" x="56.0" y="197.0" text-anchor="middle">1</text><text class="name" x="86.0" y="186.0">압력의 뜻</text><text class="small" x="86.0" y="210.0">압력 = 힘의 크기 ÷ 힘을 받는 면적</text><line x1="189.0" y1="228.0" x2="189.0" y2="242.0" stroke="#1d1d1a" stroke-width="2"/><path d="M189.0,252.0 L184.5,242.0 L193.5,242.0 Z" fill="#1d1d1a"/><rect class="zone" x="24.0" y="254.0" width="330.0" height="70.0" rx="6"/><circle class="node" cx="56.0" cy="289.0" r="17.0"/><text class="name" x="56.0" y="295.0" text-anchor="middle">2</text><text class="name" x="86.0" y="284.0">기체의 압력</text><text class="small" x="86.0" y="308.0">입자가 벽에 충돌 → 모든 방향으로 민다</text><line x1="189.0" y1="326.0" x2="189.0" y2="340.0" stroke="#1d1d1a" stroke-width="2"/><path d="M189.0,350.0 L184.5,340.0 L193.5,340.0 Z" fill="#1d1d1a"/><rect class="zone" x="24.0" y="352.0" width="330.0" height="70.0" rx="6"/><circle class="node" cx="56.0" cy="387.0" r="17.0"/><text class="name" x="56.0" y="393.0" text-anchor="middle">3</text><text class="name" x="86.0" y="382.0">압력과 부피 관계</text><text class="small" x="86.0" y="406.0">온도 일정: 압력↑ → 부피↓ (보일 법칙)</text><line x1="189.0" y1="424.0" x2="189.0" y2="438.0" stroke="#1d1d1a" stroke-width="2"/><path d="M189.0,448.0 L184.5,438.0 L193.5,438.0 Z" fill="#1d1d1a"/><rect class="focal" x="24.0" y="450.0" width="330.0" height="70.0" rx="6"/><circle class="node" cx="56.0" cy="485.0" r="17.0"/><text class="name" x="56.0" y="491.0" text-anchor="middle">4</text><text class="name inv" x="86.0" y="480.0">온도와 부피 관계</text><text class="small inv" x="86.0" y="504.0">압력 일정: 온도↑ → 부피↑ (샤를 법칙)</text><rect class="node" x="376.0" y="156.0" width="160.0" height="364.0" rx="6"/><text class="small" x="456.0" y="184.0" text-anchor="middle">단원 질문</text><text class="lab" x="456.0" y="208.0" text-anchor="middle">물 뿜는 인형은</text><text class="lab" x="456.0" y="228.0" text-anchor="middle">어떻게 물을 뿜을까?</text><path class="solid" d="M424,330 L424,284 Q424,262 446,262 L466,262 Q488,262 488,284 L488,330 Z"/><circle class="solid" cx="456.0" cy="254.0" r="16.0"/><rect class="water" x="426" y="306" width="60" height="22" rx="2"/><circle class="ptcl" cx="444.0" cy="280.0" r="3.0"/><circle class="ptcl" cx="462.0" cy="288.0" r="3.0"/><circle class="ptcl" cx="472.0" cy="274.0" r="3.0"/><circle class="ptcl" cx="452.0" cy="294.0" r="3.0"/><path d="M424,320 Q404,312 392,336" fill="none" stroke="#1d1d1a" stroke-width="2" stroke-dasharray="3 3"/><line class="thin" x1="392.0" y1="358.0" x2="520.0" y2="358.0"/><text class="small" x="456.0" y="380.0" text-anchor="middle">인형 속 공기 =</text><text class="small" x="456.0" y="398.0" text-anchor="middle">움직이는 기체 입자</text><line class="thin" x1="392.0" y1="410.0" x2="520.0" y2="410.0"/><text class="small" x="456.0" y="432.0" text-anchor="middle">찬물: 부피 줄어듦</text><text class="small" x="456.0" y="450.0" text-anchor="middle">→ 물이 들어간다</text><line class="thin" x1="392.0" y1="462.0" x2="520.0" y2="462.0"/><text class="small" x="456.0" y="484.0" text-anchor="middle">뜨거운 물: 부피 늘어남</text><text class="small" x="456.0" y="502.0" text-anchor="middle">→ 물을 밀어낸다</text><text class="small" x="24.0" y="560.0">1·2는 압력이 무엇인지, 3·4는 부피가 언제 변하는지 다룬다.</text><text class="small" x="24.0" y="584.0">4단계까지 배우면 물 뿜는 인형의 원리를 입자로 설명할 수 있다.</text>
</svg>
