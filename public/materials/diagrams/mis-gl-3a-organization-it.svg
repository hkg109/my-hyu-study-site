  <text class="tag" x="24" y="40">3장 · 3-1 조직의 정의와 IT와의 관계 ①</text><text class="title" x="24" y="74">조직과 IT의 양방향 관계</text><text class="subtitle" x="24" y="104">Figure 3.1 · 조직이 IT를 형성하고 IT가 조직을 바꾼다. 그 사이를 여섯</text><text class="subtitle" x="24" y="124">매개 요인이 조정한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small" x="280" y="198" text-anchor="middle">Organizations</text><text class="name" x="280" y="219" text-anchor="middle">조직</text><text class="body" x="280" y="246" text-anchor="middle">전략 · 구조 · 프로세스</text><rect class="zone" x="130.5" y="295.5" width="299" height="122" rx="8"/><rect class="node" x="136.5" y="301.5" width="287" height="110" rx="6"/><text class="small" x="280" y="327.5" text-anchor="middle">Mediating factors · 매개 요인</text><text class="name" x="280" y="348.5" text-anchor="middle">환경 · 문화 · 구조</text><text class="body" x="280" y="375.5" text-anchor="middle">비즈니스 프로세스 · 정치</text><text class="body" x="280" y="396" text-anchor="middle">경영 의사결정</text><rect class="focal" x="24" y="451.5" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="477.5" text-anchor="middle">Information technology</text><text class="name inv" x="280" y="498.5" text-anchor="middle">정보기술</text><text class="body inv" x="280" y="525.5" text-anchor="middle">데이터 · 소프트웨어 · 네트워크</text><path class="flow" d="M68 261.5 L68 451.5"/><rect class="mask" x="46.6" y="345.5" width="42.9" height="22" rx="4"/><text class="lab" x="68" y="361.5" text-anchor="middle">형성</text><path class="flow" d="M492 451.5 L492 261.5"/><rect class="mask" x="470.6" y="345.5" width="42.9" height="22" rx="4"/><text class="lab" x="492" y="361.5" text-anchor="middle">변화</text><path class="flow" d="M24 571 H54"/><text class="small" x="62" y="576">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="563" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="576">중심 개념</text><rect cl