  <title id="mis-gl-3a-organization-it-title">조직과 IT의 양방향 관계</title>
  <desc id="mis-gl-3a-organization-it-desc">위의 조직과 아래의 정보기술이 왼쪽 형성 화살표와 오른쪽 변화 화살표로 양방향 연결되고, 가운데에 환경·문화·구조·비즈니스 프로세스·정치·경영 의사결정의 매개 요인이 놓인 그림</desc>
