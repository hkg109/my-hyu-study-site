<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" role="img" aria-labelledby="cpg-03b-login-flow-title cpg-03b-login-flow-desc">
  <title id="cpg-03b-login-flow-title">로그인 결과는 세 갈래</title>
  <desc id="cpg-03b-login-flow-desc">학교 Google 계정을 고르면 Auth Hook이 이메일 검증과 학교 계정 여부를 확인해 아니면 생성을 거부하고, 통과하면 Profile 경로가 다시 검사한 뒤 같은 Term 승인 행이 있으면 Membership을 원자적으로 만들고, 없으면 일반 학생으로 남는 흐름.</desc>
  <defs><marker id="cpg-03b-login-flow-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-03b-login-flow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-03b-login-flow-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-03b-login-flow-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="800"/>
  <text class="tag" x="24" y="40">03-3 · 로그인 구현</text><text class="title" x="24" y="74">로그인 결과는 세 갈래</text><text class="subtitle" x="24" y="104">학교 계정 확인과 학생회 승인은 서로 다른 검사다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <path class="flow" d="M172 208 V240"/>
  <path class="flow" d="M172 328 V368"/><rect class="mask" x="180.0" y="338" width="38.5" height="21" rx="4"/><text class="lab" x="186" y="353">통과</text>
  <path class="flow" d="M172 432 V464"/>
  <path class="flow" d="M172 552 V600"/><rect class="mask" x="180.0" y="566" width="38.5" height="21" rx="4"/><text class="lab" x="186" y="581">있음</text>
  <path class="flow" d="M320 284 H380"/><rect class="mask" x="324.2" y="260" width="51.7" height="21" rx="4"/><text class="lab" x="350" y="275" text-anchor="middle">아니오</text>
  <path class="flow" d="M320 508 H380"/><rect class="mask" x="330.8" y="484" width="38.5" height="21" rx="4"/><text class="lab" x="350" y="499" text-anchor="middle">없음</text>
  <rect class="outside" x="24" y="152" width="296" height="56" rx="6"/><text class="name" x="172" y="176.0" text-anchor="middle">학교 Google 계정 선택</text><text class="small" x="172" y="196.1" text-anchor="middle">hd 값은 고르기 쉽게 돕는 힌트</text>
  <rect class="deep" x="24" y="240" width="296" height="88" rx="6"/><text class="name" x="172" y="268.5" text-anchor="middle">Auth Hook</text><text class="code" x="172" y="290.0" text-anchor="middle">Before User Created</text><text class="body" x="172" y="311.0" text-anchor="middle">이메일 검증 · 학교 계정인가?</text>
  <rect class="node" x="24" y="368" width="296" height="64" rx="6"/><text class="name" x="172" y="395.0" text-anchor="middle">Profile 생성·활성화</text><text class="body" x="172" y="416.5" text-anchor="middle">같은 조건을 한 번 더 검사</text>
  <rect class="deep" x="24" y="464" width="296" height="88" rx="6"/><text class="name" x="172" y="492.5" text-anchor="middle">승인 명단 조회</text><text class="code" x="172" y="514.0" text-anchor="middle">approved_council_accounts</text><text class="body" x="172" y="535.0" text-anchor="middle">같은 Term 승인 행이 있나?</text>
  <rect class="focal" x="24" y="600" width="296" height="72" rx="6"/><text class="name inv" x="172" y="631.0" text-anchor="middle">Membership 생성</text><text class="body inv" x="172" y="652.5" text-anchor="middle">Role·부서·직책을 한 번에</text>
  <rect class="outside" x="380" y="244" width="156" height="80" rx="6"/><text class="lab" x="458" y="269.8" text-anchor="middle">생성 거부</text><text class="small" x="458" y="289.1" text-anchor="middle">auth.users·profiles</text><text class="small" x="458" y="308.1" text-anchor="middle">행이 생기지 않음</text>
  <rect class="zone" x="380" y="468" width="156" height="80" rx="6"/><text class="lab" x="458" y="493.8" text-anchor="middle">일반 학생</text><text class="small" x="458" y="513.1" text-anchor="middle">STUDENT 상태</text><text class="small" x="458" y="532.1" text-anchor="middle">건의만 가능</text>
  <text class="small" x="280" y="712" text-anchor="middle">다음 회장단은 전임 회장단 2명이 지정 · 승인한다 (06-5)</text>
  <rect class="deep" x="24" y="748" width="22" height="16" rx="3"/><text class="small" x="54" y="761">검사 지점</text><rect class="focal" x="132.97" y="748" width="22" height="16" rx="3"/><text class="small" x="162.97" y="761">내부 권한 시작</text><rect class="outside" x="272.45000000000005" y="748" width="22" height="16" rx="3"/><text class="small" x="302.45000000000005" y="761">입력·거부</text>
</svg>
