<svg xmlns="http://www.w3.org/2000/svg" width="560" height="540" viewBox="0 0 560 540" role="img" aria-labelledby="adsp-50-readiness-title adsp-50-readiness-desc">
<title id="adsp-50-readiness-title">준비도와 성숙도로 읽는 네 유형</title><desc id="adsp-50-readiness-desc">준비도를 가로축, 성숙도를 세로축으로 둔 사분면. 왼쪽 아래 준비형, 오른쪽 아래 도입형, 왼쪽 위 정착형, 오른쪽 위 확산형이며 준비형을 강조한다.</desc>
<g font-family="Pretendard, Malgun Gothic, Noto Sans KR, sans-serif">
<rect width="560" height="540" fill="#f7f6f2"/>
<text x="24" y="32" font-size="13.5" text-anchor="start" fill="#65645e">[50회] ADsP · 복습 도식</text>
<text x="24" y="66" font-size="22" text-anchor="start" fill="#1d1d1a" font-weight="700">준비도와 성숙도로 읽는 네 유형</text>
<line x1="24" y1="86" x2="536" y2="86" stroke="#b9b6ac" stroke-width="1.5"/><text x="24" y="114" font-size="14.5" text-anchor="start" fill="#65645e">가로축: 분석 준비도 · 세로축: 분석 성숙도</text><rect x="90" y="148" width="210" height="125" rx="5" fill="#f0eee8" stroke="#b9b6ac"/><text x="195" y="195" font-size="23" text-anchor="middle" fill="#1d1d1a" font-weight="700">정착형</text><text x="195" y="224" font-size="14.5" text-anchor="middle" fill="#65645e">준비도 낮음</text><text x="195" y="246" font-size="14.5" text-anchor="middle" fill="#65645e">성숙도 높음</text><rect x="310" y="148" width="210" height="125" rx="5" fill="#f0eee8" stroke="#b9b6ac"/><text x="415" y="195" font-size="23" text-anchor="middle" fill="#1d1d1a" font-weight="700">확산형</text><text x="415" y="224" font-size="14.5" text-anchor="middle" fill="#65645e">준비도 높음</text><text x="415" y="246" font-size="14.5" text-anchor="middle" fill="#65645e">성숙도 높음</text><rect x="90" y="285" width="210" height="125" rx="5" fill="#e1eee9" stroke="#126b61"/><text x="195" y="332" font-size="23" text-anchor="middle" fill="#126b61" font-weight="700">준비형</text><text x="195" y="361" font-size="14.5" text-anchor="middle" fill="#65645e">준비도 낮음</text><text x="195" y="383" font-size="14.5" text-anchor="middle" fill="#65645e">성숙도 낮음</text><rect x="310" y="285" width="210" height="125" rx="5" fill="#f0eee8" stroke="#b9b6ac"/><text x="415" y="332" font-size="23" text-anchor="middle" fill="#1d1d1a" font-weight="700">도입형</text><text x="415" y="361" font-size="14.5" text-anchor="middle" fill="#65645e">준비도 높음</text><text x="415" y="383" font-size="14.5" text-anchor="middle" fill="#65645e">성숙도 낮음</text><line x1="76" y1="423" x2="530" y2="423" stroke="#1d1d1a" stroke-width="1.5"/><line x1="76" y1="423" x2="76" y2="140" stroke="#1d1d1a" stroke-width="1.5"/><text x="190" y="450" font-size="14" text-anchor="middle" fill="#1d1d1a">낮음</text><text x="415" y="450" font-size="14" text-anchor="middle" fill="#1d1d1a">높음</text><text x="295" y="478" font-size="16" text-anchor="middle" fill="#1d1d1a" font-weight="700">분석 준비도 →</text><text x="50" y="215" font-size="14" text-anchor="middle" fill="#1d1d1a">높음</text><text x="50" y="355" font-size="14" text-anchor="middle" fill="#1d1d1a">낮음</text><text x="24" y="516" font-size="15" text-anchor="start" fill="#126b61">둘 다 낮으면, 분석을 위한 사전 준비부터 시작합니다.</text></g></svg>
