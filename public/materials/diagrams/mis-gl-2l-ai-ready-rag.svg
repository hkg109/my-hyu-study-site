  <title id="mis-gl-2l-ai-ready-rag-title">AI-ready content와 RAG</title>
  <desc id="mis-gl-2l-ai-ready-rag-desc">사용자 질문과 품질·메타데이터·접근 권한·출처·평가를 갖춘 승인 저장소가 검색 단계로 합쳐지고, 검색된 근거로 답변을 생성한 뒤 사람이 검토해 업무에 적용하는 RAG 흐름 그림</desc>
