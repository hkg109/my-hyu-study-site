  <text class="tag" x="24" y="40">2장 · 2-8 KMS 유형과 AI 지식 도구 ②</text><text class="title" x="24" y="74">AI-ready content와 RAG</text><text class="subtitle" x="24" y="104">RAG는 승인된 기업 콘텐츠를 먼저 검색하고 그 근거로 답한다. 콘텐츠가</text><text class="subtitle" x="24" y="124">준비되지 않으면 답도 틀린다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="249" height="130.5" rx="6"/><text class="small" x="148.5" y="231.75" text-anchor="middle">Question</text><text class="name" x="148.5" y="252.75" text-anchor="middle">사용자 질문</text><rect class="node" x="287" y="172" width="249" height="130.5" rx="6"/><text class="small" x="411.5" y="198" text-anchor="middle">AI-ready content</text><text class="name" x="411.5" y="219" text-anchor="middle">승인된 저장소</text><text class="body" x="411.5" y="246" text-anchor="middle">품질 · 메타데이터</text><text class="body" x="411.5" y="266.5" text-anchor="middle">접근 권한 · 출처</text><text class="body" x="411.5" y="287" text-anchor="middle">평가</text><rect class="node" x="24" y="360.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="386.5" text-anchor="middle">Retrieve</text><text class="name" x="280" y="407.5" text-anchor="middle">관련 근거 검색</text><text class="body" x="280" y="434.5" text-anchor="middle">권한이 있는 원본만 찾는다</text><rect class="focal" x="24" y="508" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="534" text-anchor="middle">Generate</text><text class="name inv" x="280" y="555" text-anchor="middle">근거 기반 답변 생성</text><text class="body inv" x="280" y="582" text-anchor="middle">출처 인용 · grounding</text><rect class="node" x="24" y="655.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="681.5" text-anchor="middle">Apply</text><text class="name" x="280" y="702.5" text-anchor="middle">사람이 검토 후 적용</text><text class="body" x="280" y="729.5" text-anchor="middle">권한 · 모니터링 · 에스컬레이션</text><path class="line" d="M148.5 302.5 V328.6"/><path class="line" d="M411.5 302.5 V328.6"/><path class="line" d="M148.5 328.6 H411.5"/><path class="flow" d="M280 328.6 L280 360.5"/><rect class="mask" x="241.9" y="333.55" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="349.55" text-anchor="middle">함께 입력</text><path class="flow" d="M280 450 L280 508"/><rect class="mask" x="241.9" y="468" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="484" text-anchor="middle">근거 제공</text><path class="flow" d="M280 597.5 L280 655.5"/><rect class="mask" x="218.1" y="615.5" width="123.8" height="22" rx="4"/><text class="lab" x="280" y="631.5" text-anchor="middle">검증 필요한 주장</text><path class="flow" d="M24 769 H54"/><text class="small" x="62" y="774">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="761" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="774">중심 개념</text>
