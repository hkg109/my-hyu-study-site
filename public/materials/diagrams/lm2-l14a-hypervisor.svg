<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 612" width="560" height="612" role="img" aria-labelledby="lm2-l14a-hypervisor-title lm2-l14a-hypervisor-desc">
  <title id="lm2-l14a-hypervisor-title">하이퍼바이저 타입 1·2와 컨테이너</title>
  <desc id="lm2-l14a-hypervisor-desc">세 개의 쌓기 기둥. 타입 1은 아래부터 하드웨어, 하이퍼바이저, 게스트 OS, 앱이며 예는 Xen, KVM, ESXi. 타입 2는 하드웨어, 호스트 OS, 하이퍼바이저, 게스트 OS, 앱이며 예는 VirtualBox와 VMware Workstation. 컨테이너는 하드웨어, 호스트 OS 커널, 컨테이너 엔진, 앱으로 게스트 OS 층이 없고 예는 Docker와 LXC.</desc>
  <defs><marker id="lm2-l14a-hypervisor-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l14a-hypervisor-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l14a-hypervisor-a)}.flow.both{marker-start:url(#lm2-l14a-hypervisor-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l14a-hypervisor-m)}.dash.both{marker-start:url(#lm2-l14a-hypervisor-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="612"/><text class="tag" x="24" y="40">리눅스마스터 2급 · 3과목 3장</text><text class="title" x="24" y="74">하이퍼바이저 타입 1·2와 컨테이너</text><text class="subtitle" x="24" y="104">검은 가상화 층이 어디에 끼어 있는지, 게스트 OS가 있는지를 본다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="lab" x="104.0" y="186" text-anchor="middle">타입 1 · Bare-metal</text><rect class="deep" x="24" y="450" width="160" height="52" rx="6"/><text class="name" x="104.0" y="482" text-anchor="middle">하드웨어</text><rect class="focal" x="24" y="390" width="160" height="52" rx="6"/><text class="name inv" x="104.0" y="422" text-anchor="middle">하이퍼바이저</text><rect class="zone" x="24" y="330" width="160" height="52" rx="6"/><text class="name" x="104.0" y="362" text-anchor="middle">게스트 OS</text><rect class="node" x="24" y="270" width="160" height="52" rx="6"/><text class="name" x="104.0" y="302" text-anchor="middle">앱 · 앱</text><text class="small" x="104.0" y="528" text-anchor="middle">Xen · KVM · ESXi</text><text class="lab" x="280.0" y="186" text-anchor="middle">타입 2 · Hosted</text><rect class="deep" x="200" y="450" width="160" height="52" rx="6"/><text class="name" x="280.0" y="482" text-anchor="middle">하드웨어</text><rect class="node" x="200" y="390" width="160" height="52" rx="6"/><text class="name" x="280.0" y="422" text-anchor="middle">호스트 OS</text><rect class="focal" x="200" y="330" width="160" height="52" rx="6"/><text class="name inv" x="280.0" y="362" text-anchor="middle">하이퍼바이저</text><rect class="zone" x="200" y="270" width="160" height="52" rx="6"/><text class="name" x="280.0" y="302" text-anchor="middle">게스트 OS</text><rect class="node" x="200" y="210" width="160" height="52" rx="6"/><text class="name" x="280.0" y="242" text-anchor="middle">앱 · 앱</text><text class="small" x="280.0" y="528" text-anchor="middle">VirtualBox · VMware WS</text><text class="lab" x="456.0" y="186" text-anchor="middle">컨테이너</text><rect class="deep" x="376" y="450" width="160" height="52" rx="6"/><text class="name" x="456.0" y="482" text-anchor="middle">하드웨어</text><rect class="node" x="376" y="390" width="160" height="52" rx="6"/><text class="name" x="456.0" y="422" text-anchor="middle">호스트 OS 커널</text><rect class="focal" x="376" y="330" width="160" height="52" rx="6"/><text class="name inv" x="456.0" y="362" text-anchor="middle">컨테이너 엔진</text><rect class="node" x="376" y="270" width="160" height="52" rx="6"/><text class="name" x="456.0" y="302" text-anchor="middle">앱 · 앱</text><text class="small" x="456.0" y="528" text-anchor="middle">Docker · LXC</text><line class="rule" x1="24" y1="542" x2="536" y2="542"/><rect class="focal" x="24" y="552" width="22" height="16" rx="3"/><text class="small" x="54" y="565">가상화 계층 (하이퍼바이저 · 컨테이너 엔진)</text><rect class="zone" x="24" y="576" width="22" height="16" rx="3"/><text class="small" x="54" y="589">게스트 OS — 컨테이너에는 이 층이 없다</text>
</svg>
