<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1012" width="560" height="1012" role="img" aria-labelledby="adsp-l00a-exam-map-title adsp-l00a-exam-map-desc">
  <title id="adsp-l00a-exam-map-title">ADsP 시험 지도 — 세 과목과 노트 10편</title>
  <desc id="adsp-l00a-exam-map-desc">50문항을 문항 수에 비례한 띠로 나눠 1과목 10문항 20%, 2과목 10문항 20%, 3과목 30문항 60%를 보이고, 각 과목 아래에 대응하는 노트 1편부터 10편과 과목별 과락선(4, 4, 12문항)을 묶었다. 합격 기준은 총점 60점 이상이면서 과목별 40% 미만이 없어야 하며, 맨 아래에 추천 공부 순서 1-2-3-4편, 6-7-9-10-8-5편을 화살표로 보인다.</desc>
  <defs><marker id="adsp-l00a-exam-map-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l00a-exam-map-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l00a-exam-map-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l00a-exam-map-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="1012"/><text class="tag" x="24" y="40">ADsP · 0편 시험 지도</text><text class="title" x="24" y="74">ADsP 시험 지도 — 3과목 · 10편</text><text class="subtitle" x="24" y="104">띠의 폭 = 문항 수. 3과목이 절반이 넘는다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="small" x="24" y="162">객관식 50문항 · 90분 · 문항당 2점</text><rect class="zone" x="24" y="174" width="102.4" height="52" rx="4"/><text class="lab" x="75.2" y="196" text-anchor="middle">1과목</text><text class="small" x="75.2" y="216" text-anchor="middle">10문항 · 20%</text><rect class="zone" x="126.4" y="174" width="102.4" height="52" rx="4"/><text class="lab" x="177.6" y="196" text-anchor="middle">2과목</text><text class="small" x="177.6" y="216" text-anchor="middle">10문항 · 20%</text><rect class="focal" x="228.8" y="174" width="307.2" height="52" rx="4"/><text class="lab inv" x="382.4" y="196" text-anchor="middle">3과목</text><text class="small inv" x="382.4" y="216" text-anchor="middle">30문항 · 60%</text><rect class="zone" x="16" y="244" width="528" height="110" rx="8"/><text class="lab" x="30" y="268">1과목 데이터 이해 · 최소 4문항</text><rect class="node" x="30" y="280" width="240" height="54" rx="6"/><text class="small" x="44" y="301">1편 · 1장</text><text class="body" x="44" y="323">데이터의 이해</text><rect class="node" x="282" y="280" width="240" height="54" rx="6"/><text class="small" x="296" y="301">2편 · 2·3장</text><text class="body" x="296" y="323">가치·미래·데이터 사이언스</text><rect class="zone" x="16" y="366" width="528" height="110" rx="8"/><text class="lab" x="30" y="390">2과목 데이터 분석 기획 · 최소 4문항</text><rect class="node" x="30" y="402" width="240" height="54" rx="6"/><text class="small" x="44" y="423">3편 · 1장</text><text class="body" x="44" y="445">분석 기획의 이해</text><rect class="node" x="282" y="402" width="240" height="54" rx="6"/><text class="small" x="296" y="423">4편 · 2장</text><text class="body" x="296" y="445">분석 마스터플랜</text><rect class="zone" x="16" y="488" width="528" height="234" rx="8"/><text class="lab" x="30" y="512">3과목 데이터 분석 · 최소 12문항</text><rect class="node" x="30" y="524" width="240" height="54" rx="6"/><text class="small" x="44" y="545">5편 · 1장</text><text class="body" x="44" y="567">R 기초·데이터 마트·EDA</text><rect class="node" x="282" y="524" width="240" height="54" rx="6"/><text class="small" x="296" y="545">6편 · 2장</text><text class="body" x="296" y="567">통계의 이해</text><rect class="node" x="30" y="586" width="240" height="54" rx="6"/><text class="small" x="44" y="607">7편 · 2장</text><text class="body" x="44" y="629">기초통계·회귀분석</text><rect class="node" x="282" y="586" width="240" height="54" rx="6"/><text class="small" x="296" y="607">8편 · 2장</text><text class="body" x="296" y="629">다변량·시계열</text><rect class="node" x="30" y="648" width="240" height="54" rx="6"/><text class="small" x="44" y="669">9편 · 3장</text><text class="body" x="44" y="691">데이터마이닝·분류분석</text><rect class="node" x="282" y="648" width="240" height="54" rx="6"/><text class="small" x="296" y="669">10편 · 3장</text><text class="body" x="296" y="691">군집·연관분석</text><rect class="focal" x="24" y="738" width="512" height="66" rx="6"/><text class="name inv" x="280" y="766" text-anchor="middle">합격 = 총점 60점 이상 (30문항 이상)</text><text class="body inv" x="280" y="790" text-anchor="middle">+ 어느 과목도 40% 미만(과락)이 없을 것</text><text class="lab" x="24" y="838">추천 공부 순서</text><text class="small" x="24" y="876">1·2과목 먼저</text><rect class="node" x="128" y="854" width="46" height="32" rx="6"/><text class="lab" x="151" y="875" text-anchor="middle">1편</text><path class="flow" d="M174 870 H200"/><rect class="node" x="200" y="854" width="46" height="32" rx="6"/><text class="lab" x="223" y="875" text-anchor="middle">2편</text><path class="flow" d="M246 870 H272"/><rect class="node" x="272" y="854" width="46" height="32" rx="6"/><text class="lab" x="295" y="875" text-anchor="middle">3편</text><path class="flow" d="M318 870 H344"/><rect class="node" x="344" y="854" width="46" height="32" rx="6"/><text class="lab" x="367" y="875" text-anchor="middle">4편</text><text class="small" x="420" y="876">이틀 안에</text><text class="small" x="24" y="920">그다음 3과목</text><rect class="node" x="128" y="898" width="46" height="32" rx="6"/><text class="lab" x="151" y="919" text-anchor="middle">6편</text><path class="flow" d="M174 914 H200"/><rect class="node" x="200" y="898" width="46" height="32" rx="6"/><text class="lab" x="223" y="919" text-anchor="middle">7편</text><path class="flow" d="M246 914 H272"/><rect class="node" x="272" y="898" width="46" height="32" rx="6"/><text class="lab" x="295" y="919" text-anchor="middle">9편</text><path class="flow" d="M318 914 H344"/><rect class="node" x="344" y="898" width="46" height="32" rx="6"/><text class="lab" x="367" y="919" text-anchor="middle">10편</text><path class="flow" d="M390 914 H416"/><rect class="node" x="416" y="898" width="46" height="32" rx="6"/><text class="lab" x="439" y="919" text-anchor="middle">8편</text><path class="flow" d="M462 914 H488"/><rect class="node" x="488" y="898" width="46" height="32" rx="6"/><text class="lab" x="511" y="919" text-anchor="middle">5편</text><text class="small" x="24" y="958">5편(R 문법)은 출력 해석 문제를 풀며 필요할 때 돌아와 본다.</text><path class="flow" d="M24 988 H54"/><text class="small" x="62" y="993">다음에 볼 노트</text><rect class="focal" x="173.1" y="980" width="22" height="16" rx="3"/><text class="small" x="203.1" y="993">가장 비중 큰 과목·합격선</text><rect class="zone" x="385.75" y="980" width="22" height="16" rx="3"/><text class="small" x="415.75" y="993">과목 묶음</text>
</svg>
