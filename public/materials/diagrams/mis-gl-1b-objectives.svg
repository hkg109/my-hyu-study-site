<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 811" role="img" aria-labelledby="mis-gl-1b-objectives-title mis-gl-1b-objectives-desc">
  <title id="mis-gl-1b-objectives-title">여섯 전략적 비즈니스 목표와 대표 사례</title>
  <desc id="mis-gl-1b-objectives-desc">운영 우수성, 신제품·서비스·사업모형, 고객·공급업체 친밀성, 의사결정 개선의 네 목표와 슬라이드 사례가 경쟁우위로 이어지고, 경쟁사가 같은 시스템을 도입하면 생존 목표가 되는 관계를 보여 주는 그림</desc>
  <defs><marker id="mis-gl-1b-objectives-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-1b-objectives-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-1b-objectives-a)}.flow.both{marker-start:url(#mis-gl-1b-objectives-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-1b-objectives-m)}.dash.both{marker-start:url(#mis-gl-1b-objectives-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="811"/>
  <text class="tag" x="24" y="40">1장 · 1-2 IS 투자의 여섯 목표</text><text class="title" x="24" y="74">여섯 전략적 비즈니스 목표와 대표 사례</text><text class="subtitle" x="24" y="104">운·신·친·결 네 목표는 경쟁우위로 이어질 수 있고, 경쟁사가 따라 하면 같은</text><text class="subtitle" x="24" y="124">기술이 생존 조건이 된다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="164" width="528" height="293.5" rx="8"/><text class="small" x="28" y="184">앞의 네 목표 (자기 기업 기준의 개선)</text><rect class="node" x="24" y="198" width="249" height="107.5" rx="6"/><text class="small" x="148.5" y="233" text-anchor="middle">① Operational excellence</text><text class="name" x="148.5" y="254" text-anchor="middle">운영 우수성</text><text class="body" x="148.5" y="281" text-anchor="middle">Walmart Retail Link</text><rect class="node" x="287" y="198" width="249" height="107.5" rx="6"/><text class="small" x="411.5" y="224" text-anchor="middle">② New products · business</text><text class="small" x="411.5" y="242" text-anchor="middle">models</text><text class="name" x="411.5" y="263" text-anchor="middle">신제품·사업모형</text><text class="body" x="411.5" y="290" text-anchor="middle">Apple iTunes</text><rect class="node" x="24" y="319.5" width="249" height="128" rx="6"/><text class="small" x="148.5" y="345.5" text-anchor="middle">③ Customer &amp; supplier</text><text class="small" x="148.5" y="363.5" text-anchor="middle">intimacy</text><text class="name" x="148.5" y="384.5" text-anchor="middle">고객·공급업체 친밀성</text><text class="body" x="148.5" y="411.5" text-anchor="middle">Mandarin Oriental,</text><text class="body" x="148.5" y="432" text-anchor="middle">JCPenney–TAL</text><rect class="node" x="287" y="319.5" width="249" height="128" rx="6"/><text class="small" x="411.5" y="364.75" text-anchor="middle">④ Improved decision making</text><text class="name" x="411.5" y="385.75" text-anchor="middle">의사결정 개선</text><text class="body" x="411.5" y="412.75" text-anchor="middle">Verizon 대시보드</text><rect class="focal" x="24" y="505.5" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="531.5" text-anchor="middle">⑤ Competitive advantage</text><text class="name inv" x="280" y="552.5" text-anchor="middle">경쟁우위</text><text class="body inv" x="280" y="579.5" text-anchor="middle">경쟁사 대비 우위 · Apple, Walmart, UPS</text><rect class="node" x="24" y="653" width="512" height="89.5" rx="6"/><text class="small" x="280" y="679" text-anchor="middle">⑥ Survival</text><text class="name" x="280" y="700" text-anchor="middle">생존</text><text class="body" x="280" y="727" text-anchor="middle">업계 표준·규제 대응 · Citibank ATM, SOX</text><path class="flow" d="M280 447.5 L280 505.5"/><rect class="mask" x="201.5" y="465.5" width="157.0" height="22" rx="4"/><text class="lab" x="280" y="481.5" text-anchor="middle">결과로 이어질 수 있음</text><path class="dash" d="M280 595 L280 653"/><rect class="mask" x="210.9" y="613" width="138.2" height="22" rx="4"/><text class="lab" x="280" y="629" text-anchor="middle">경쟁사가 따라 하면</text><path class="flow" d="M24 766.5 H54"/><text class="small" x="62" y="771.5">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 766.5 H221.94875000000002"/><text class="small" x="229.94875000000002" y="771.5">영향·제약</text><rect class="focal" x="312.22900000000004" y="758.5" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="771.5">중심 개념</text><rect class="zone" x="422.34250000000003" y="758.5" width="22" height="16" rx="3"/><text class="small" x="452.34250000000003" y="771.5">범위·묶음</text>
