<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 985" role="img" aria-labelledby="mis-gl-00-concept-map-title mis-gl-00-concept-map-desc">
  <title id="mis-gl-00-concept-map-title">네 장은 하나의 질문 사슬이다</title>
  <desc id="mis-gl-00-concept-map-desc">1장 정보시스템과 가치, 2장 프로세스·전사 시스템·지식관리, 3장 조직과 전략, 4장 윤리와 사회적 책임을 위에서 아래로 놓고, 각 장의 핵심 질문과 개념 묶음, 장 사이의 구체화·영향·새 쟁점 관계와 4장이 앞 장을 제약하는 점선 관계를 보여 주는 개념 지도</desc>
  <defs><marker id="mis-gl-00-concept-map-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-00-concept-map-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-00-concept-map-a)}.flow.both{marker-start:url(#mis-gl-00-concept-map-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-00-concept-map-m)}.dash.both{marker-start:url(#mis-gl-00-concept-map-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="985"/>
  <text class="tag" x="24" y="40">Chapter 1–4 · 전체 개념 지도</text><text class="title" x="24" y="74">네 장은 하나의 질문 사슬이다</text><text class="subtitle" x="24" y="104">IS가 가치를 만드는 원리 → 업무를 지원하는 시스템 → 조직·전략과의</text><text class="subtitle" x="24" y="124">상호작용 → 윤리·사회적 책임</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="24" y="172" width="448" height="130.5" rx="8"/><text class="small" x="36" y="192">1장 · 정보시스템과 비즈니스 가치</text><text class="name" x="36" y="216">같은 IT를 사도 왜 성과가 다를까?</text><text class="body" x="36" y="245">1-1 디지털 기업 · 1-2 여섯 투자 목표 · 1-3 IT·IS,</text><text class="body" x="36" y="265.5">데이터·정보, IPO · 1-4 세 차원·IT 인프라 · 1-5 정보</text><text class="body" x="36" y="286">가치사슬·보완 자산 · 1-6 사회기술적 관점</text><rect class="zone" x="24" y="354.5" width="448" height="130.5" rx="8"/><text class="small" x="36" y="374.5">2장 · 프로세스·전사 시스템·지식관리</text><text class="name" x="36" y="398.5">시스템은 업무·결정·지식을 어떻게 지원할까?</text><text class="body" x="36" y="427.5">2-1 프로세스 · 2-2 TPS·MIS·DSS·ESS · 2-3</text><text class="body" x="36" y="448">ERP·SCM·CRM·KMS · 2-4 인트라넷·e-business · 2-5 협업</text><text class="body" x="36" y="468.5">· 2-6~2-8 지식관리·AI · 2-9 IT 거버넌스</text><rect class="zone" x="24" y="537" width="448" height="153.5" rx="8"/><text class="small" x="36" y="557">3장 · 조직과 전략</text><text class="name" x="36" y="581">조직과 IT는 서로를 어떻게 바꾸고, IT로 어떻게</text><text class="name" x="36" y="604">경쟁할까?</text><text class="body" x="36" y="633">3-1 조직의 정의·양방향 관계 · 3-2 루틴·문화·정치·구조 · 3-3</text><text class="body" x="36" y="653.5">거래·대리인 비용, 변화 저항 · 3-4 다섯 경쟁 요인·네 전략 ·</text><text class="body" x="36" y="674">3-5 가치사슬·네트워크 전략</text><rect class="zone" x="24" y="742.5" width="448" height="130.5" rx="8"/><text class="small" x="36" y="762.5">4장 · 윤리와 사회적 책임</text><text class="name" x="36" y="786.5">IS가 만든 힘을 누가 어떤 책임으로 통제할까?</text><text class="body" x="36" y="815.5">4-1 다섯 도덕적 차원 · 4-2 프로파일링·NORA · 4-3 책임·판단</text><text class="body" x="36" y="836">원칙 · 4-4 프라이버시·FIP · 4-5 지식재산 · 4-6 책임·시스템</text><text class="body" x="36" y="856.5">품질 · 4-7 삶의 질</text><path class="flow" d="M248 302.5 L248 354.5"/><rect class="mask" x="142.8" y="317.5" width="210.5" height="22" rx="4"/><text class="lab" x="248" y="333.5" text-anchor="middle">구체화: 원리 → 업무별 시스템</text><path class="flow" d="M248 485 L248 537"/><rect class="mask" x="134.5" y="500" width="227.1" height="22" rx="4"/><text class="lab" x="248" y="516" text-anchor="middle">영향: 시스템이 조직·경쟁을 바꿈</text><path class="flow" d="M248 690.5 L248 742.5"/><rect class="mask" x="148.9" y="705.5" width="198.2" height="22" rx="4"/><text class="lab" x="248" y="721.5" text-anchor="middle">새 쟁점: 데이터·권력의 집중</text><path class="dash" d="M472 807.75 L504 807.75 L504 237.25 L472 237.25"/><rect class="mask" x="482.6" y="511.5" width="42.9" height="22" rx="4"/><text class="lab" x="504" y="527.5" text-anchor="middle">제약</text><path class="flow" d="M24 897 H54"/><text class="small" x="62" y="902">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 897 H221.94875000000002"/><text class="small" x="229.94875000000002" y="902">영향·제약</text><rect class="zone" x="312.22900000000004" y="889" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="902">범위·묶음</text><text class="small" x="24" y="929">점선 화살표: 4장의 법·윤리 기준이 1–3장의 시스템 설계와 투자 판단을 다시</text><text class="small" x="24" y="947">제약한다.</text>
</svg>
