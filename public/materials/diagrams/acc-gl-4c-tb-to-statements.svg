<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 980" role="img" aria-labelledby="acc-gl-4c-tb-to-statements-title acc-gl-4c-tb-to-statements-desc">
  <title id="acc-gl-4c-tb-to-statements-title">수정후 시산표에서 재무제표로 — (주)바람돌이 1월</title>
  <desc id="acc-gl-4c-tb-to-statements-desc">수정후 시산표를 위 칸의 자산과 부채·자본, 아래 칸의 비용과 수익으로 나눈다. 아래 칸으로 포괄손익계산서를 만들어 당기순이익 1,450원을 계산하고, 이를 재무상태표의 이익잉여금으로 대체한다. 위 칸으로 재무상태표를 만들면 자산 29,150원이 부채 17,700원과 자본 11,450원의 합과 같아진다. 아래에 시산표 등식을 적은 그림</desc>
  <defs><marker id="acc-gl-4c-tb-to-statements-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-4c-tb-to-statements-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-4c-tb-to-statements-a)}.flow.both{marker-start:url(#acc-gl-4c-tb-to-statements-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-4c-tb-to-statements-m)}.dash.both{marker-start:url(#acc-gl-4c-tb-to-statements-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="980"/>
  <text class="tag" x="24" y="40">4장 · 4-3 수정후 시산표와 재무제표</text><text class="title" x="24" y="74">수정후 시산표 → 재무제표</text><text class="subtitle" x="24" y="104">(주)바람돌이 1월 사례: 수익·비용으로 손익을, 순이익을 대체한 뒤</text><text class="subtitle" x="24" y="124">자산·부채·자본으로 재무상태표를 만든다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="512" height="214" rx="6"/><text class="name" x="280" y="198" text-anchor="middle">수정후 시산표 · 20××년 1월 31일</text><text class="small" x="152" y="222" text-anchor="middle">차변 32,150</text><text class="small" x="408" y="222" text-anchor="middle">대변 32,150</text><line class="rule" x1="280" y1="208" x2="280" y2="386"/><line class="rule" x1="24" y1="300" x2="536" y2="300"/><line class="rule" x1="24" y1="230" x2="536" y2="230"/><text class="name" x="152" y="258" text-anchor="middle">자산</text><text class="body" x="152" y="282" text-anchor="middle">29,600</text><text class="name" x="408" y="252" text-anchor="middle">부채 · 자본 ·</text><text class="body" x="408" y="274" text-anchor="middle">차감계정(450)</text><text class="body" x="408" y="293" text-anchor="middle">28,150</text><text class="name" x="152" y="332" text-anchor="middle">비용</text><text class="body" x="152" y="356" text-anchor="middle">2,550</text><text class="name" x="408" y="332" text-anchor="middle">수익</text><text class="body" x="408" y="356" text-anchor="middle">4,000</text><rect class="node" x="24" y="450" width="210" height="104" rx="6"/><text class="name" x="129.0" y="487.5" text-anchor="middle">포괄손익계산서</text><text class="body" x="129.0" y="508.5" text-anchor="middle">수익 4,000</text><text class="body" x="129.0" y="529.5" text-anchor="middle">비용 2,550</text><rect class="focal" x="24" y="610" width="210" height="76" rx="6"/><text class="name inv" x="129.0" y="643.0" text-anchor="middle">당기순이익</text><text class="name inv" x="129.0" y="666.0" text-anchor="middle">1,450</text><rect class="node" x="326" y="450" width="210" height="236" rx="6"/><text class="name" x="431.0" y="524.0" text-anchor="middle">재무상태표</text><text class="body" x="431.0" y="545.0" text-anchor="middle">자산 29,150</text><text class="body" x="431.0" y="566.0" text-anchor="middle">부채 17,700</text><text class="body" x="431.0" y="587.0" text-anchor="middle">자본 11,450</text><text class="small" x="431.0" y="606.0" text-anchor="middle">자본금 10,000</text><text class="small" x="431.0" y="625.0" text-anchor="middle">+ 이익잉여금 1,450</text><path class="flow" d="M129.0 386 L129.0 450"/><rect class="mask" x="59.7" y="407" width="138.6" height="22" rx="4"/><text class="lab" x="129.0" y="423" text-anchor="middle">① 수익·비용 계정</text><path class="flow" d="M129.0 554 L129.0 610"/><rect class="mask" x="73.3" y="571" width="111.4" height="22" rx="4"/><text class="lab" x="129.0" y="587" text-anchor="middle">② 순이익 계산</text><path class="flow" d="M234 648 L326 648"/><rect class="mask" x="248.7" y="637" width="62.7" height="22" rx="4"/><text class="lab" x="280.0" y="653" text-anchor="middle">② 대체</text><path class="flow" d="M431.0 386 L431.0 450"/><rect class="mask" x="358.9" y="407" width="144.3" height="22" rx="4"/><text class="lab" x="431.0" y="423" text-anchor="middle">③ 자산·부채·자본</text><rect class="zone" x="24" y="720" width="512" height="196" rx="8"/><text class="small" x="40" y="746">시산표 등식으로 보는 이유</text><text class="body" x="40" y="778">자산 + 비용 = 부채 + 자본 + 수익</text><text class="body" x="40" y="808">자산 = 부채 + 자본 + (수익 − 비용)</text><text class="small" x="40" y="838">(수익 − 비용) = 이익 → 포괄손익계산서</text><text class="body" x="40" y="870">자산 = 부채 + 자본(이익 포함): 재무상태표</text><text class="small" x="40" y="898">29,150 = 17,700 + 11,450 (차감계정 450 순액)</text><path class="flow" d="M24 950 H54"/><text class="small" x="62" y="955">흐름·순서</text><path class="dash" d="M150 950 H180"/><text class="small" x="188" y="955">확인·대체(되돌림)</text><rect class="focal" x="330" y="942" width="22" height="16" rx="3"/><text class="small" x="360" y="955">중심 개념</text><rect class="zone" x="440" y="942" width="22" height="16" rx="3"/><text class="small" x="470" y="955">범위·묶음</text>
</svg>
