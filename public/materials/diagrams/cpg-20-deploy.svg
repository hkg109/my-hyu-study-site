<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 900" role="img" aria-labelledby="cpg-20-deploy-title cpg-20-deploy-desc">
  <title id="cpg-20-deploy-title">PR이 운영 사이트가 되기까지</title>
  <desc id="cpg-20-deploy-desc">개발자가 Branch에서 PR을 열면 GitHub Actions가 lint·test·build를 돌리고, 리뷰 1명 승인과 검사 통과 뒤에만 main에 Merge되며, main에서는 Actions가 Supabase 마이그레이션 적용과 Vercel 빌드·배포를 학생회 계정 토큰으로 실행해 운영 사이트와 DB 구조가 갱신되는 흐름. 토큰은 GitHub Secrets에만 둔다.</desc>
  <defs><marker id="cpg-20-deploy-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-20-deploy-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-20-deploy-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-20-deploy-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="900"/>
  <text class="tag" x="24" y="40">07-2 · 배포 흐름</text><text class="title" x="24" y="74">PR이 운영 사이트가 되기까지</text><text class="subtitle" x="24" y="104">main은 사람이 직접 배포하지 않는다. Actions가 한다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <path class="flow" d="M280 216 V256"/>
  <path class="flow" d="M280 344 V392"/><rect class="mask" x="288.0" y="358" width="38.5" height="21" rx="4"/><text class="lab" x="294" y="373">통과</text>
  <path class="flow" d="M280 456 V504"/><rect class="mask" x="288.0" y="470" width="50.3" height="21" rx="4"/><text class="lab" x="294" y="485">Merge</text>
  <path class="flow" d="M280 616 V656"/>
  <rect class="outside" x="24" y="152" width="512" height="64" rx="6"/><text class="name" x="280" y="179.0" text-anchor="middle">개발자 · Branch에서 작업 → PR</text><text class="body" x="280" y="200.5" text-anchor="middle">Organization Member 누구나</text>
  <rect class="node" x="24" y="256" width="512" height="88" rx="6"/><text class="name" x="280" y="284.5" text-anchor="middle">GitHub Actions · 검사</text><text class="code" x="280" y="306.0" text-anchor="middle">npm run lint · npm test</text><text class="code" x="280" y="327.0" text-anchor="middle">npm run build</text>
  <rect class="node" x="24" y="392" width="512" height="64" rx="6"/><text class="name" x="280" y="419.0" text-anchor="middle">리뷰 1명 승인 + 검사 통과</text><text class="body" x="280" y="440.5" text-anchor="middle">브랜치 보호 규칙이 강제한다</text>
  <rect class="focal" x="24" y="504" width="512" height="112" rx="6"/><text class="name inv" x="280" y="534.0" text-anchor="middle">main → Actions 배포 작업</text><text class="code inv" x="280" y="555.5" text-anchor="middle">supabase db push</text><text class="code inv" x="280" y="576.5" text-anchor="middle">vercel build --prod</text><text class="code inv" x="280" y="597.5" text-anchor="middle">vercel deploy --prebuilt --prod</text>
  <rect class="deep" x="24" y="656" width="512" height="64" rx="6"/><text class="name" x="280" y="683.0" text-anchor="middle">운영 사이트 (Vercel) · DB 구조 (Supabase)</text><text class="body" x="280" y="704.5" text-anchor="middle">문제가 생기면 이전 배포로 되돌린다</text>
  <rect class="outside" x="24" y="744" width="512" height="88" rx="6"/><text class="name" x="280" y="773.5" text-anchor="middle">비밀 값은 GitHub Secrets에만</text><text class="code" x="280" y="795.0" text-anchor="middle">VERCEL_TOKEN · SUPABASE_ACCESS_TOKEN</text><text class="small" x="280" y="814.6" text-anchor="middle">fork에서 온 PR에는 전달되지 않는다</text>
  <rect class="focal" x="24" y="860" width="22" height="16" rx="3"/><text class="small" x="54" y="873">자동 배포</text><rect class="deep" x="132.97" y="860" width="22" height="16" rx="3"/><text class="small" x="162.97" y="873">운영 환경</text><rect class="outside" x="241.94" y="860" width="22" height="16" rx="3"/><text class="small" x="271.94" y="873">사람·비밀 값</text>
</svg>
