<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" width="560" height="760" role="img" aria-labelledby="adsp-l10b-linkage-title adsp-l10b-linkage-desc">
  <title id="adsp-l10b-linkage-title">군집 사이 거리를 재는 법</title>
  <desc id="adsp-l10b-linkage-desc">같은 두 군집 P와 Q를 네 번 그려, 최단 연결법은 가장 가까운 두 점 사이 선, 최장 연결법은 가장 먼 두 점 사이 선, 평균 연결법은 모든 점 쌍 9개 선의 평균, 중심 연결법은 두 중심점 사이 선으로 군집 간 거리를 잰다는 것을 보여 주고, 와드 연결법은 거리 대신 합쳤을 때 오차제곱합 증가량을 본다고 덧붙인 그림</desc>
  <defs><marker id="adsp-l10b-linkage-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l10b-linkage-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l10b-linkage-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.dasharrow{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l10b-linkage-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#65645e;stroke-width:1.2;fill:none}.grid{stroke:#e4e1d8;stroke-width:1;fill:none}.axis{stroke:#1d1d1a;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.head{font:700 16px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.bodym{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.tiny{font:600 12px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="760"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 3장 · 계층적 군집</text><text class="title" x="24" y="74">군집 사이 거리를 재는 법</text><text class="subtitle" x="24" y="104">같은 두 군집이라도 어느 선의 길이를 쓰느냐에 따라 병합 순서가</text><text class="subtitle" x="24" y="124">달라진다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/>
<rect class="zone" x="24" y="174" width="250" height="196" rx="8"/><text class="lab" x="38" y="200">최단 연결 (Single)</text><text class="tiny" x="38" y="220">가장 가까운 두 점</text><ellipse class="node" cx="84" cy="301" rx="40" ry="50"/><ellipse class="node" cx="216" cy="299" rx="40" ry="52"/><text class="lab" x="84" y="368" text-anchor="middle">P</text><text class="lab" x="216" y="368" text-anchor="middle">Q</text><path class="line" style="stroke-width:2.4" d="M100 304 L198 262"/><circle class="focal" style="stroke:#1d1d1a" cx="70" cy="270" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="100" cy="304" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="66" cy="332" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="198" cy="262" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="240" cy="298" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="208" cy="336" r="5"/><rect class="zone" x="286" y="174" width="250" height="196" rx="8"/><text class="lab" x="300" y="200">최장 연결 (Complete)</text><text class="tiny" x="300" y="220">가장 먼 두 점</text><ellipse class="node" cx="346" cy="301" rx="40" ry="50"/><ellipse class="node" cx="478" cy="299" rx="40" ry="52"/><text class="lab" x="346" y="368" text-anchor="middle">P</text><text class="lab" x="478" y="368" text-anchor="middle">Q</text><path class="line" style="stroke-width:2.4" d="M328 332 L502 298"/><circle class="focal" style="stroke:#1d1d1a" cx="332" cy="270" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="362" cy="304" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="328" cy="332" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="460" cy="262" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="502" cy="298" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="470" cy="336" r="5"/><rect class="zone" x="24" y="384" width="250" height="196" rx="8"/><text class="lab" x="38" y="410">평균 연결 (Average)</text><text class="tiny" x="38" y="430">모든 쌍(3 × 3) 거리의 평균</text><ellipse class="node" cx="84" cy="511" rx="40" ry="50"/><ellipse class="node" cx="216" cy="509" rx="40" ry="52"/><text class="lab" x="84" y="578" text-anchor="middle">P</text><text class="lab" x="216" y="578" text-anchor="middle">Q</text><path class="thin" d="M70 480 L198 472"/><path class="thin" d="M70 480 L240 508"/><path class="thin" d="M70 480 L208 546"/><path class="thin" d="M100 514 L198 472"/><path class="thin" d="M100 514 L240 508"/><path class="thin" d="M100 514 L208 546"/><path class="thin" d="M66 542 L198 472"/><path class="thin" d="M66 542 L240 508"/><path class="thin" d="M66 542 L208 546"/><circle class="focal" style="stroke:#1d1d1a" cx="70" cy="480" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="100" cy="514" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="66" cy="542" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="198" cy="472" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="240" cy="508" r="5"/><circle class="focal" style="stroke:#1d1d1a" cx="208" cy="546" r="5"/><rect class="zone" x="286" y="384" width="250" height="196" rx="8"/><text class="lab" x="300" y="410">중심 연결 (Centroid)</text><text class="tiny" x="300" y="430">두 중심점(+) 사이</text><ellipse class="node" cx="346" cy="511" rx="40" ry="50"/><ellipse class="node" cx="478" cy="509" rx="40" ry="52"/><text class="lab" x="346" y="578" text-anchor="middle">P</text><text class="lab" x="478" y="578" text-anchor="middle">Q</text><path class="line" style="stroke-width:2.4" d="M340.7 512 L477.3 508.7"/><path class="line" style="stroke-width:2.6" d="M333.7 512 H347.7 M340.7 505 V519"/><path class="line" style="stroke-width:2.6" d="M470.3 508.7 H484.3 M477.3 501.7 V515.7"/><circle class="node" style="stroke:#1d1d1a" cx="332" cy="480" r="5"/><circle class="node" style="stroke:#1d1d1a" cx="362" cy="514" r="5"/><circle class="node" style="stroke:#1d1d1a" cx="328" cy="542" r="5"/><circle class="node" style="stroke:#1d1d1a" cx="460" cy="472" r="5"/><circle class="node" style="stroke:#1d1d1a" cx="502" cy="508" r="5"/><circle class="node" style="stroke:#1d1d1a" cx="470" cy="546" r="5"/><rect class="focal" x="24" y="594" width="512" height="100" rx="8"/><text class="name inv" x="40" y="624">와드 연결 (Ward)</text><text class="bodym inv" x="40" y="650">선의 길이(거리)를 보지 않고, 합쳤을 때 군집 내</text><text class="bodym inv" x="40" y="672">오차제곱합(SSE) 증가량이 가장 작은 쌍을 병합한다</text><text class="small" x="24" y="718">최단은 사슬 모양 군집이 생기기 쉽고, 최장은 둥글고 응집된 군집을</text><text class="small" x="24" y="738">만든다</text>
</svg>
