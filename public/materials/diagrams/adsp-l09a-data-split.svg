<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1160" width="560" height="1160" role="img" aria-labelledby="adsp-l09a-data-split-title adsp-l09a-data-split-desc">
  <title id="adsp-l09a-data-split-title">데이터 분할 네 가지</title>
  <desc id="adsp-l09a-data-split-desc">홀드아웃은 훈련 70퍼센트와 평가 30퍼센트로 한 번 나누고, 5-fold 교차검증은 다섯 조각 중 한 조각씩 돌아가며 평가해 다섯 번의 성능을 평균하며, LOOCV는 관측치 하나만 평가용으로 두고 n번 반복하고, 부트스트랩은 복원 추출로 같은 크기의 표본을 만들며 한 번도 뽑히지 않은 OOB 데이터가 n이 커지면 약 36.8퍼센트가 됨을 보여 주는 그림</desc>
  <defs><marker id="adsp-l09a-data-split-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l09a-data-split-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l09a-data-split-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.dasharrow{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l09a-data-split-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#65645e;stroke-width:1.2;fill:none}.grid{stroke:#e4e1d8;stroke-width:1;fill:none}.axis{stroke:#1d1d1a;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.head{font:700 16px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.bodym{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.tiny{font:600 12px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1160"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 3장 · 데이터 분할</text><text class="title" x="24" y="74">데이터 분할 네 가지</text><text class="subtitle" x="24" y="104">평가용을 어떻게 떼어 내고 몇 번 반복하는가로 구분한다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
<rect class="zone" x="16" y="154" width="528" height="132" rx="8"/><text class="head" x="32" y="182">① 홀드아웃 (Hold-out)</text><text class="small" x="528" y="182" text-anchor="end">1번 분할</text><rect class="node" x="32" y="200" width="347.2" height="40" rx="4"/><text class="lab" x="205.6" y="226" text-anchor="middle">훈련용 70%</text><rect class="focal" x="379.2" y="200" width="148.8" height="40" rx="4"/><text class="lab inv" x="453.6" y="226" text-anchor="middle">평가용 30%</text><text class="bodym" x="32" y="270">간단하지만, 어떻게 나뉘었느냐에 따라 성능이 흔들린다</text><rect class="zone" x="16" y="302" width="528" height="252" rx="8"/><text class="head" x="32" y="330">② k-fold 교차검증 (k = 5)</text><text class="small" x="528" y="330" text-anchor="end">k번 반복 → 평균</text><text class="small" x="72" y="366" text-anchor="end">1회</text><rect class="focal" x="84" y="348" width="60" height="26" rx="3"/><text class="tiny inv" x="114" y="366" text-anchor="middle">평가</text><rect class="node" x="148" y="348" width="60" height="26" rx="3"/><text class="tiny" x="178" y="366" text-anchor="middle">학습</text><rect class="node" x="212" y="348" width="60" height="26" rx="3"/><text class="tiny" x="242" y="366" text-anchor="middle">학습</text><rect class="node" x="276" y="348" width="60" height="26" rx="3"/><text class="tiny" x="306" y="366" text-anchor="middle">학습</text><rect class="node" x="340" y="348" width="60" height="26" rx="3"/><text class="tiny" x="370" y="366" text-anchor="middle">학습</text><path class="thin" d="M408 361 H434"/><text class="small" x="440" y="366">성능 1</text><text class="small" x="72" y="400" text-anchor="end">2회</text><rect class="node" x="84" y="382" width="60" height="26" rx="3"/><text class="tiny" x="114" y="400" text-anchor="middle">학습</text><rect class="focal" x="148" y="382" width="60" height="26" rx="3"/><text class="tiny inv" x="178" y="400" text-anchor="middle">평가</text><rect class="node" x="212" y="382" width="60" height="26" rx="3"/><text class="tiny" x="242" y="400" text-anchor="middle">학습</text><rect class="node" x="276" y="382" width="60" height="26" rx="3"/><text class="tiny" x="306" y="400" text-anchor="middle">학습</text><rect class="node" x="340" y="382" width="60" height="26" rx="3"/><text class="tiny" x="370" y="400" text-anchor="middle">학습</text><path class="thin" d="M408 395 H434"/><text class="small" x="440" y="400">성능 2</text><text class="small" x="72" y="434" text-anchor="end">3회</text><rect class="node" x="84" y="416" width="60" height="26" rx="3"/><text class="tiny" x="114" y="434" text-anchor="middle">학습</text><rect class="node" x="148" y="416" width="60" height="26" rx="3"/><text class="tiny" x="178" y="434" text-anchor="middle">학습</text><rect class="focal" x="212" y="416" width="60" height="26" rx="3"/><text class="tiny inv" x="242" y="434" text-anchor="middle">평가</text><rect class="node" x="276" y="416" width="60" height="26" rx="3"/><text class="tiny" x="306" y="434" text-anchor="middle">학습</text><rect class="node" x="340" y="416" width="60" height="26" rx="3"/><text class="tiny" x="370" y="434" text-anchor="middle">학습</text><path class="thin" d="M408 429 H434"/><text class="small" x="440" y="434">성능 3</text><text class="small" x="72" y="468" text-anchor="end">4회</text><rect class="node" x="84" y="450" width="60" height="26" rx="3"/><text class="tiny" x="114" y="468" text-anchor="middle">학습</text><rect class="node" x="148" y="450" width="60" height="26" rx="3"/><text class="tiny" x="178" y="468" text-anchor="middle">학습</text><rect class="node" x="212" y="450" width="60" height="26" rx="3"/><text class="tiny" x="242" y="468" text-anchor="middle">학습</text><rect class="focal" x="276" y="450" width="60" height="26" rx="3"/><text class="tiny inv" x="306" y="468" text-anchor="middle">평가</text><rect class="node" x="340" y="450" width="60" height="26" rx="3"/><text class="tiny" x="370" y="468" text-anchor="middle">학습</text><path class="thin" d="M408 463 H434"/><text class="small" x="440" y="468">성능 4</text><text class="small" x="72" y="502" text-anchor="end">5회</text><rect class="node" x="84" y="484" width="60" height="26" rx="3"/><text class="tiny" x="114" y="502" text-anchor="middle">학습</text><rect class="node" x="148" y="484" width="60" height="26" rx="3"/><text class="tiny" x="178" y="502" text-anchor="middle">학습</text><rect class="node" x="212" y="484" width="60" height="26" rx="3"/><text class="tiny" x="242" y="502" text-anchor="middle">학습</text><rect class="node" x="276" y="484" width="60" height="26" rx="3"/><text class="tiny" x="306" y="502" text-anchor="middle">학습</text><rect class="focal" x="340" y="484" width="60" height="26" rx="3"/><text class="tiny inv" x="370" y="502" text-anchor="middle">평가</text><path class="thin" d="M408 497 H434"/><text class="small" x="440" y="502">성능 5</text><text class="bodym" x="32" y="542">5개 조각이 한 번씩 평가용 → 최종 성능 = 5개 성능의 평균</text><rect class="zone" x="16" y="570" width="528" height="196" rx="8"/><text class="head" x="32" y="598">③ LOOCV (Leave-One-Out)</text><text class="small" x="528" y="598" text-anchor="end">n번 반복</text><text class="small" x="72" y="633" text-anchor="end">1회</text><rect class="focal" x="84" y="616" width="26" height="22" rx="3"/><rect class="node" x="114" y="616" width="26" height="22" rx="3"/><rect class="node" x="144" y="616" width="26" height="22" rx="3"/><rect class="node" x="174" y="616" width="26" height="22" rx="3"/><rect class="node" x="204" y="616" width="26" height="22" rx="3"/><rect class="node" x="234" y="616" width="26" height="22" rx="3"/><rect class="node" x="264" y="616" width="26" height="22" rx="3"/><rect class="node" x="294" y="616" width="26" height="22" rx="3"/><rect class="node" x="324" y="616" width="26" height="22" rx="3"/><rect class="node" x="354" y="616" width="26" height="22" rx="3"/><rect class="node" x="384" y="616" width="26" height="22" rx="3"/><rect class="node" x="414" y="616" width="26" height="22" rx="3"/><text class="small" x="72" y="663" text-anchor="end">2회</text><rect class="node" x="84" y="646" width="26" height="22" rx="3"/><rect class="focal" x="114" y="646" width="26" height="22" rx="3"/><rect class="node" x="144" y="646" width="26" height="22" rx="3"/><rect class="node" x="174" y="646" width="26" height="22" rx="3"/><rect class="node" x="204" y="646" width="26" height="22" rx="3"/><rect class="node" x="234" y="646" width="26" height="22" rx="3"/><rect class="node" x="264" y="646" width="26" height="22" rx="3"/><rect class="node" x="294" y="646" width="26" height="22" rx="3"/><rect class="node" x="324" y="646" width="26" height="22" rx="3"/><rect class="node" x="354" y="646" width="26" height="22" rx="3"/><rect class="node" x="384" y="646" width="26" height="22" rx="3"/><rect class="node" x="414" y="646" width="26" height="22" rx="3"/><text class="name" x="264" y="692" text-anchor="middle">⋮</text><text class="small" x="72" y="723" text-anchor="end">n회</text><rect class="node" x="84" y="706" width="26" height="22" rx="3"/><rect class="node" x="114" y="706" width="26" height="22" rx="3"/><rect class="node" x="144" y="706" width="26" height="22" rx="3"/><rect class="node" x="174" y="706" width="26" height="22" rx="3"/><rect class="node" x="204" y="706" width="26" height="22" rx="3"/><rect class="node" x="234" y="706" width="26" height="22" rx="3"/><rect class="node" x="264" y="706" width="26" height="22" rx="3"/><rect class="node" x="294" y="706" width="26" height="22" rx="3"/><rect class="node" x="324" y="706" width="26" height="22" rx="3"/><rect class="node" x="354" y="706" width="26" height="22" rx="3"/><rect class="node" x="384" y="706" width="26" height="22" rx="3"/><rect class="focal" x="414" y="706" width="26" height="22" rx="3"/><text class="small" x="452" y="633">n개 중</text><text class="small" x="452" y="651">1개만 평가</text><text class="bodym" x="32" y="750">검은 칸(관측치 1개)만 평가용, 나머지 n − 1개로 학습 — 데이터가 적을 때</text><rect class="zone" x="16" y="782" width="528" height="360" rx="8"/><text class="head" x="32" y="810">④ 부트스트랩 (Bootstrap)</text><text class="small" x="528" y="810" text-anchor="end">복원 추출</text><text class="small" x="32" y="834">원 데이터 (n = 8)</text><circle class="node" cx="72" cy="864" r="15"/><text class="lab" x="72" y="869" text-anchor="middle">1</text><circle class="node" cx="124" cy="864" r="15"/><text class="lab" x="124" y="869" text-anchor="middle">2</text><circle class="focal" cx="176" cy="864" r="15"/><text class="lab inv" x="176" y="869" text-anchor="middle">3</text><circle class="focal" cx="228" cy="864" r="15"/><text class="lab inv" x="228" y="869" text-anchor="middle">4</text><circle class="node" cx="280" cy="864" r="15"/><text class="lab" x="280" y="869" text-anchor="middle">5</text><circle class="focal" cx="332" cy="864" r="15"/><text class="lab inv" x="332" y="869" text-anchor="middle">6</text><circle class="node" cx="384" cy="864" r="15"/><text class="lab" x="384" y="869" text-anchor="middle">7</text><circle class="node" cx="436" cy="864" r="15"/><text class="lab" x="436" y="869" text-anchor="middle">8</text><path class="flow" d="M280 886 V930"/><rect class="mask" x="231.9" y="899" width="96.2" height="21" rx="4"/><text class="lab" x="280" y="914" text-anchor="middle">8번 복원 추출</text><text class="small" x="32" y="940">부트스트랩 표본 (같은 크기 8, 중복 허용)</text><circle class="node" cx="72" cy="970" r="15"/><text class="lab" x="72" y="975" text-anchor="middle">2</text><circle class="node" cx="124" cy="970" r="15"/><text class="lab" x="124" y="975" text-anchor="middle">5</text><circle class="node" cx="176" cy="970" r="15"/><text class="lab" x="176" y="975" text-anchor="middle">5</text><circle class="node" cx="228" cy="970" r="15"/><text class="lab" x="228" y="975" text-anchor="middle">1</text><circle class="node" cx="280" cy="970" r="15"/><text class="lab" x="280" y="975" text-anchor="middle">7</text><circle class="node" cx="332" cy="970" r="15"/><text class="lab" x="332" y="975" text-anchor="middle">2</text><circle class="node" cx="384" cy="970" r="15"/><text class="lab" x="384" y="975" text-anchor="middle">8</text><circle class="node" cx="436" cy="970" r="15"/><text class="lab" x="436" y="975" text-anchor="middle">1</text><text class="bodym" x="32" y="1016">2·5·1이 두 번씩 뽑히고, 검은 원 3·4·6은 한 번도 안 뽑힘</text><text class="bodym" x="32" y="1038">→ OOB(Out-Of-Bag) 데이터, 평가용으로 사용</text><rect class="focal" x="32" y="1062" width="496" height="72" rx="6"/><text class="lab inv" x="280" y="1090" text-anchor="middle">한 관측치가 끝까지 안 뽑힐 확률 (1 − 1/n)ⁿ</text><text class="small inv" x="280" y="1116" text-anchor="middle">n = 10 → 34.9% · n = 100 → 36.6% · n → ∞ → 36.8%</text>
</svg>
