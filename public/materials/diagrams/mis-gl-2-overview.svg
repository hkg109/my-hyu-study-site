<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 759" role="img" aria-labelledby="mis-gl-2-overview-title mis-gl-2-overview-desc">
  <title id="mis-gl-2-overview-title">업무 흐름에서 조직 지식과 IT 거버넌스까지</title>
  <desc id="mis-gl-2-overview-desc">2장의 흐름을 프로세스, 관리 계층별 시스템, 전사 통합과 인터넷 연결, 협업, 지식관리, IS 기능의 여섯 단계로 지그재그로 연결하고 각 단계에 해당하는 개념 묶음 번호를 적은 개요도</desc>
  <defs><marker id="mis-gl-2-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2-overview-a)}.flow.both{marker-start:url(#mis-gl-2-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2-overview-m)}.dash.both{marker-start:url(#mis-gl-2-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="759"/>
  <text class="tag" x="24" y="40">2장 개요 · 개념 묶음 9개</text><text class="title" x="24" y="74">업무 흐름에서 조직 지식과 IT 거버넌스까지</text><text class="subtitle" x="24" y="104">핵심 질문: 정보시스템은 기업의 업무·의사결정·협업·지식을 어떻게</text><text class="subtitle" x="24" y="124">지원하는가?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="224" height="133" rx="6"/><text class="small" x="136" y="198" text-anchor="middle">2-1</text><text class="name" x="136" y="219" text-anchor="middle">비즈니스 프로세스와</text><text class="name" x="136" y="242" text-anchor="middle">IT</text><text class="body" x="136" y="269" text-anchor="middle">기능별·범기능 프로세스,</text><text class="body" x="136" y="289.5" text-anchor="middle">자동화·재설계, AI 역할</text><rect class="node" x="312" y="172" width="224" height="133" rx="6"/><text class="small" x="424" y="209.5" text-anchor="middle">2-2</text><text class="name" x="424" y="230.5" text-anchor="middle">관리 계층별 시스템</text><text class="body" x="424" y="257.5" text-anchor="middle">TPS → MIS · DSS → ESS,</text><text class="body" x="424" y="278" text-anchor="middle">BI</text><rect class="node" x="312" y="363" width="224" height="130.5" rx="6"/><text class="small" x="424" y="389" text-anchor="middle">2-3 · 2-4</text><text class="name" x="424" y="410" text-anchor="middle">전사 통합과 연결 범위</text><text class="body" x="424" y="437" text-anchor="middle">ERP·SCM·CRM·KMS,</text><text class="body" x="424" y="457.5" text-anchor="middle">인트라넷·엑스트라넷·</text><text class="body" x="424" y="478" text-anchor="middle">e-business</text><rect class="node" x="24" y="363" width="224" height="130.5" rx="6"/><text class="small" x="136" y="399.25" text-anchor="middle">2-5</text><text class="name" x="136" y="420.25" text-anchor="middle">협업과 소셜 비즈니스</text><text class="body" x="136" y="447.25" text-anchor="middle">역량 + 기술 → 협업의 질,</text><text class="body" x="136" y="467.75" text-anchor="middle">시간·공간 매트릭스</text><rect class="focal" x="24" y="551.5" width="224" height="133" rx="6"/><text class="small inv" x="136" y="589" text-anchor="middle">2-6 · 2-7 · 2-8</text><text class="name inv" x="136" y="610" text-anchor="middle">지식관리</text><text class="body inv" x="136" y="637" text-anchor="middle">지식의 성격, KM 가치사슬,</text><text class="body inv" x="136" y="657.5" text-anchor="middle">KMS 유형·AI</text><rect class="node" x="312" y="551.5" width="224" height="133" rx="6"/><text class="small" x="424" y="577.5" text-anchor="middle">2-9</text><text class="name" x="424" y="598.5" text-anchor="middle">IS 기능과 IT</text><text class="name" x="424" y="621.5" text-anchor="middle">거버넌스</text><text class="body" x="424" y="648.5" text-anchor="middle">IS 부서, C-level 역할,</text><text class="body" x="424" y="669" text-anchor="middle">결정 권한·책임</text><path class="flow" d="M248 238.5 L312 238.5"/><rect class="mask" x="258.6" y="227.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="243.5" text-anchor="middle">지원</text><path class="flow" d="M424 305 L424 363"/><rect class="mask" x="402.6" y="323" width="42.9" height="22" rx="4"/><text class="lab" x="424" y="339" text-anchor="middle">통합</text><path class="flow" d="M312 428.25 L248 428.25"/><rect class="mask" x="258.6" y="417.25" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="433.25" text-anchor="middle">확장</text><path class="flow" d="M136 493.5 L136 551.5"/><rect class="mask" x="114.6" y="511.5" width="42.9" height="22" rx="4"/><text class="lab" x="136" y="527.5" text-anchor="middle">공유</text><path class="flow" d="M248 618 L312 618"/><rect class="mask" x="258.6" y="607" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="623" text-anchor="middle">운영</text><path class="flow" d="M24 714.5 H54"/><text class="small" x="62" y="719.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="706.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="719.5">중심 개념</text>
</svg>
