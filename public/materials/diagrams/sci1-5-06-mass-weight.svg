<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="sci1-5-06-mass-weight-title sci1-5-06-mass-weight-desc">
  <title id="sci1-5-06-mass-weight-title">질량과 무게 — 지구와 달에서</title>
  <desc id="sci1-5-06-mass-weight-desc">왼쪽은 지구, 오른쪽은 달. 둘 다 질량 6 kg인 같은 상자를 용수철저울에 매단 모습이다. 지구에서는 무게가 약 58.8 N이라 아래쪽 중력 화살표가 길고, 달에서는 약 1/6인 9.8 N이라 화살표가 짧다. 아래 표에 질량은 kg 단위로 변하지 않고, 무게는 N 단위로 장소에 따라 변한다고 정리했다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}</style>
  <rect class="bg" width="560" height="470"/><text class="tag" x="24.0" y="40.0">중1 과학 · V. 힘의 작용</text><text class="title" x="24.0" y="74.0">질량과 무게 — 지구와 달에서</text><text class="subtitle" x="24.0" y="104.0">질량은 그대로, 무게(중력의 크기)는 천체에 따라 달라진다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="zone" x="24.0" y="146.0" width="248.0" height="210.0" rx="6"/><text class="name" x="148.0" y="172.0" text-anchor="middle">지구</text><line class="line" x1="114.0" y1="184.0" x2="114.0" y2="196.0"/><rect class="node" x="102.0" y="196.0" width="24.0" height="70.0" rx="4"/><path class="line" d="M114,200 l-6,5.2 l12,10.3 l-12,10.3 l12,10.3 l-12,10.3 l12,10.3 l6,5.2"/><line class="line" x1="114.0" y1="266.0" x2="114.0" y2="278.0"/><rect class="solid" x="88.0" y="278.0" width="52.0" height="40.0" rx="3"/><text class="lab" x="114.0" y="303.0" text-anchor="middle">6 kg</text><line x1="158.0" y1="282.0" x2="158.0" y2="331.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M158.0,342.0 L153.1,331.0 L162.9,331.0 Z" fill="#1d1d1a"/><text class="lab" x="168.0" y="296.0">무게 58.8 N</text><text class="small" x="168.0" y="316.0">중력</text><text class="small" x="94.0" y="236.0" text-anchor="end">많이 늘어남</text><rect class="zone" x="288.0" y="146.0" width="248.0" height="210.0" rx="6"/><text class="name" x="412.0" y="172.0" text-anchor="middle">달 (중력 약 1/6)</text><line class="line" x1="378.0" y1="184.0" x2="378.0" y2="196.0"/><rect class="node" x="366.0" y="196.0" width="24.0" height="34.0" rx="4"/><path class="line" d="M378,200 l-6,2.2 l12,4.3 l-12,4.3 l12,4.3 l-12,4.3 l12,4.3 l6,2.2"/><line class="line" x1="378.0" y1="230.0" x2="378.0" y2="242.0"/><rect class="solid" x="352.0" y="242.0" width="52.0" height="40.0" rx="3"/><text class="lab" x="378.0" y="267.0" text-anchor="middle">6 kg</text><line x1="422.0" y1="246.0" x2="422.0" y2="248.0" stroke="#1d1d1a" stroke-width="3.5"/><path d="M422.0,256.0 L418.4,248.0 L425.6,248.0 Z" fill="#1d1d1a"/><text class="lab" x="432.0" y="260.0">무게 9.8 N</text><text class="small" x="432.0" y="280.0">중력</text><text class="small" x="358.0" y="220.0" text-anchor="end">조금 늘어남</text><rect class="node" x="24.0" y="380.0" width="512.0" height="74.0" rx="6"/><line class="thin" x1="24.0" y1="417.0" x2="536.0" y2="417.0"/><line class="thin" x1="150.0" y1="380.0" x2="150.0" y2="454.0"/><line class="thin" x1="343.0" y1="380.0" x2="343.0" y2="454.0"/><text class="lab" x="40.0" y="404.0">단위</text><text class="lab" x="246.0" y="404.0" text-anchor="middle">kg</text><text class="lab" x="440.0" y="404.0" text-anchor="middle">N</text><text class="lab" x="40.0" y="441.0">장소가 바뀌면</text><text class="body" x="246.0" y="441.0" text-anchor="middle">변하지 않는다</text><text class="body" x="440.0" y="441.0" text-anchor="middle">천체의 중력에 따라 변한다</text>
</svg>
