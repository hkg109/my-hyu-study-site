<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 755" role="img" aria-labelledby="mis-gl-3b-organization-definitions-title mis-gl-3b-organization-definitions-desc">
  <title id="mis-gl-3b-organization-definitions-title">기술적 정의 vs 행동적 정의</title>
  <desc id="mis-gl-3b-organization-definitions-desc">왼쪽 기술적 미시경제 정의는 환경의 자본·노동이 생산 과정을 거쳐 제품·서비스가 되는 흐름이고, 오른쪽 행동적 정의는 권리·특권·의무·책임이 갈등과 해결을 거쳐 균형 잡힌 사회 시스템이 되는 흐름이며, 아래에서 두 정의가 보완 관계로 합쳐지는 비교 그림</desc>
  <defs><marker id="mis-gl-3b-organization-definitions-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-3b-organization-definitions-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-3b-organization-definitions-a)}.flow.both{marker-start:url(#mis-gl-3b-organization-definitions-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-3b-organization-definitions-m)}.dash.both{marker-start:url(#mis-gl-3b-organization-definitions-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="755"/>
  <text class="tag" x="24" y="40">3장 · 3-1 조직의 정의와 IT와의 관계 ②</text><text class="title" x="24" y="74">기술적 정의 vs 행동적 정의</text><text class="subtitle" x="24" y="104">Figure 3.2 · 3.3 · 둘은 경쟁하는 정의가 아니라 서로 보완한다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="focal" x="24" y="152" width="249" height="63" rx="6"/><text class="small inv" x="148.5" y="178" text-anchor="middle">Technical</text><text class="name inv" x="148.5" y="199" text-anchor="middle">기술적 정의</text><rect class="focal" x="287" y="152" width="249" height="63" rx="6"/><text class="small inv" x="411.5" y="178" text-anchor="middle">Behavioral</text><text class="name inv" x="411.5" y="199" text-anchor="middle">행동적 정의</text><rect class="node" x="24" y="233" width="249" height="71.5" rx="6"/><text class="name" x="148.5" y="261" text-anchor="middle">자본 · 노동</text><text class="body" x="148.5" y="288" text-anchor="middle">환경에서 들어오는 입력</text><rect class="node" x="287" y="233" width="249" height="71.5" rx="6"/><text class="name" x="411.5" y="274.25" text-anchor="middle">권리 · 특권 · 의무 · 책임</text><rect class="node" x="24" y="362.5" width="249" height="71.5" rx="6"/><text class="name" x="148.5" y="390.5" text-anchor="middle">제품 · 서비스</text><text class="body" x="148.5" y="417.5" text-anchor="middle">환경으로 나가는 산출</text><rect class="node" x="287" y="362.5" width="249" height="71.5" rx="6"/><text class="name" x="411.5" y="392.25" text-anchor="middle">섬세하게 균형 잡힌 사회</text><text class="name" x="411.5" y="415.25" text-anchor="middle">시스템</text><rect class="node" x="24" y="492" width="249" height="92" rx="6"/><text class="name" x="148.5" y="520" text-anchor="middle">생산 기계</text><text class="body" x="148.5" y="547" text-anchor="middle">쉽게 재배열 가능</text><text class="body" x="148.5" y="567.5" text-anchor="middle">사람 요소는 거의 고려 X</text><rect class="node" x="287" y="492" width="249" height="92" rx="6"/><text class="name" x="411.5" y="520" text-anchor="middle">사람과 관계</text><text class="body" x="411.5" y="547" text-anchor="middle">위계·규칙·문화 때문에</text><text class="body" x="411.5" y="567.5" text-anchor="middle">바꾸기 어렵고 느림</text><rect class="node" x="24" y="642" width="512" height="45" rx="6"/><text class="name" x="280" y="670" text-anchor="middle">IS 도입 = 기술 설치 + 조직 변화를 함께 다룬다</text><path class="flow" d="M148.5 304.5 L148.5 362.5"/><rect class="mask" x="110.4" y="322.5" width="76.1" height="22" rx="4"/><text class="lab" x="148.5" y="338.5" text-anchor="middle">생산 과정</text><path class="flow" d="M411.5 304.5 L411.5 362.5"/><rect class="mask" x="366.2" y="322.5" width="90.6" height="22" rx="4"/><text class="lab" x="411.5" y="338.5" text-anchor="middle">갈등과 해결</text><path class="flow" d="M148.5 434 L148.5 492"/><rect class="mask" x="127.1" y="452" width="42.9" height="22" rx="4"/><text class="lab" x="148.5" y="468" text-anchor="middle">관점</text><path class="flow" d="M411.5 434 L411.5 492"/><rect class="mask" x="390.1" y="452" width="42.9" height="22" rx="4"/><text class="lab" x="411.5" y="468" text-anchor="middle">관점</text><path class="line" d="M148.5 584 V610.1"/><path class="line" d="M411.5 584 V610.1"/><path class="line" d="M148.5 610.1 H411.5"/><path class="flow" d="M280 610.1 L280 642"/><rect class="mask" x="258.6" y="615.05" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="631.05" text-anchor="middle">보완</text><path class="flow" d="M24 711 H54"/><text class="small" x="62" y="716">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="703" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="716">중심 개념</text>
</svg>
