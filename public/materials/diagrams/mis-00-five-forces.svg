<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="mis-00-five-forces-title mis-00-five-forces-desc">
  <title id="mis-00-five-forces-title">경쟁 압력은 다섯 방향에서 들어온다</title>
  <desc id="mis-00-five-forces-desc">Porter의 Competitive Forces Model: 기존 경쟁자 주변의 네 힘이 수익성과 전략 선택을 압박한다</desc>
  <defs><marker id="mis-00-five-forces-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.link{stroke:#65645e;stroke-width:2;fill:none}.flow{stroke:#65645e;stroke-width:2;fill:none;marker-end:url(#mis-00-five-forces-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.step{font:600 12px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.inverse{fill:#f7f6f2}</style>
  <rect class="bg" width="1280" height="700"/><text class="tag" x="64" y="52">3장 · 경쟁 전략</text><text class="title" x="64" y="92">경쟁 압력은 다섯 방향에서 들어온다</text><text class="subtitle" x="64" y="122">Porter의 Competitive Forces Model: 기존 경쟁자 주변의 네 힘이 수익성과 전략 선택을 압박한다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
  <path class="flow" d="M640 272 V306"/><path class="flow" d="M640 458 V424"/><path class="flow" d="M384 365 H476"/><path class="flow" d="M896 365 H804"/>
  <g><rect class="node" x="480" y="172" width="320" height="100" rx="6"/><text class="step" x="640" y="202" text-anchor="middle">진입 위협</text><text class="name" x="640" y="234" text-anchor="middle">New Market Entrants</text><text class="sub" x="640" y="260" text-anchor="middle">새 기업이 쉽게 들어올 수 있는가?</text></g>
  <g><rect class="focal" x="480" y="310" width="320" height="110" rx="6"/><text class="step inverse" x="640" y="340" text-anchor="middle">업계 내부 경쟁</text><text class="name inverse" x="640" y="372" text-anchor="middle">Traditional Competitors</text><text class="sub inverse" x="640" y="398" text-anchor="middle">가격·제품·효율로 계속 경쟁</text></g>
  <g><rect class="node" x="480" y="458" width="320" height="100" rx="6"/><text class="step" x="640" y="488" text-anchor="middle">대체 위협</text><text class="name" x="640" y="520" text-anchor="middle">Substitute Products</text><text class="sub" x="640" y="546" text-anchor="middle">다른 방식으로 같은 필요를 채우는가?</text></g>
  <g><rect class="node" x="64" y="310" width="320" height="110" rx="6"/><text class="step" x="224" y="340" text-anchor="middle">공급자 교섭력</text><text class="name" x="224" y="372" text-anchor="middle">Suppliers</text><text class="sub" x="224" y="398" text-anchor="middle">원가 인상을 떠넘길 수 있는가?</text></g>
  <g><rect class="node" x="896" y="310" width="320" height="110" rx="6"/><text class="step" x="1056" y="340" text-anchor="middle">고객 교섭력</text><text class="name" x="1056" y="372" text-anchor="middle">Customers</text><text class="sub" x="1056" y="398" text-anchor="middle">쉽게 바꾸거나 가격을 깎을 수 있는가?</text></g>
  <rect class="zone" x="64" y="594" width="1152" height="70" rx="6"/><text class="step" x="88" y="622">IT로 대응하는 네 가지 기본 전략</text><text class="sub" x="88" y="648">Low-Cost Leadership  /  Product Differentiation  /  Focus on Market Niche  /  Customer &amp; Supplier Intimacy</text>
</svg>
