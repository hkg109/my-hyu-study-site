<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 981" role="img" aria-labelledby="mis-gl-2j-km-value-chain-title mis-gl-2j-km-value-chain-desc">
  <title id="mis-gl-2j-km-value-chain-title">Acquire → Store → Disseminate → Apply</title>
  <desc id="mis-gl-2j-km-value-chain-desc">데이터와 정보 수집을 기반으로 획득, 저장, 전파, 적용의 네 단계가 차례로 이어지고 각 단계에 정보시스템 활동과 경영·조직 활동이 적혀 있으며, 적용 결과인 새 프로세스·제품·시장이 피드백 점선으로 획득 단계에 돌아가는 그림</desc>
  <defs><marker id="mis-gl-2j-km-value-chain-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2j-km-value-chain-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2j-km-value-chain-a)}.flow.both{marker-start:url(#mis-gl-2j-km-value-chain-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2j-km-value-chain-m)}.dash.both{marker-start:url(#mis-gl-2j-km-value-chain-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="981"/>
  <text class="tag" x="24" y="40">2장 · 2-7 지식관리 가치사슬</text><text class="title" x="24" y="74">Acquire → Store → Disseminate →</text><text class="title" x="24" y="104">Apply</text><text class="subtitle" x="24" y="134">Figure 11.1 · 각 단계에 IS 활동과 경영·조직 활동이 함께 있고, 적용 결과가</text><text class="subtitle" x="24" y="154">다시 획득으로 돌아온다</text><line class="rule" x1="24" y1="180" x2="536" y2="180"/><rect class="node" x="24" y="202" width="399" height="71.5" rx="6"/><text class="name" x="223.5" y="230" text-anchor="middle">데이터·정보 수집</text><text class="body" x="223.5" y="257" text-anchor="middle">TPS·외부 원천</text><rect class="node" x="24" y="331.5" width="399" height="89.5" rx="6"/><text class="small" x="223.5" y="357.5" text-anchor="middle">1 Acquire 획득</text><text class="name" x="223.5" y="378.5" text-anchor="middle">문서화·전문가 네트워크</text><text class="body" x="223.5" y="405.5" text-anchor="middle">IS: 데이터 마이닝·ML · 조직: 지식 문화</text><rect class="node" x="24" y="461" width="399" height="89.5" rx="6"/><text class="small" x="223.5" y="487" text-anchor="middle">2 Store 저장</text><text class="name" x="223.5" y="508" text-anchor="middle">지식 DB·콘텐츠 관리</text><text class="body" x="223.5" y="535" text-anchor="middle">IS: CMS·전문가 시스템 · 조직: 색인 스키마·보상</text><rect class="node" x="24" y="590.5" width="399" height="89.5" rx="6"/><text class="small" x="223.5" y="616.5" text-anchor="middle">3 Disseminate 전파</text><text class="name" x="223.5" y="637.5" text-anchor="middle">필요한 사람에게 전달</text><text class="body" x="223.5" y="664.5" text-anchor="middle">IS: 포털·검색·협업 도구 · 조직: 교육·COP</text><rect class="focal" x="24" y="720" width="399" height="89.5" rx="6"/><text class="small inv" x="223.5" y="746" text-anchor="middle">4 Apply 적용</text><text class="name inv" x="223.5" y="767" text-anchor="middle">결정·프로세스에 반영</text><text class="body inv" x="223.5" y="794" text-anchor="middle">IS: DSS·전사 앱 · 조직: 새 루틴</text><rect class="node" x="24" y="867.5" width="399" height="45" rx="6"/><text class="name" x="223.5" y="895.5" text-anchor="middle">새 프로세스 · 제품 · 서비스 · 시장</text><path class="flow" d="M223.5 273.5 L223.5 331.5"/><rect class="mask" x="202.1" y="291.5" width="42.9" height="22" rx="4"/><text class="lab" x="223.5" y="307.5" text-anchor="middle">기반</text><path class="flow" d="M223.5 421 L223.5 461"/><path class="flow" d="M223.5 550.5 L223.5 590.5"/><path class="flow" d="M223.5 680 L223.5 720"/><path class="flow" d="M223.5 809.5 L223.5 867.5"/><rect class="mask" x="202.1" y="827.5" width="42.9" height="22" rx="4"/><text class="lab" x="223.5" y="843.5" text-anchor="middle">결과</text><path class="dash" d="M423 890 L457 890 L457 376.25 L423 376.25"/><rect class="mask" x="428.3" y="608.5" width="57.3" height="22" rx="4"/><text class="lab" x="457" y="624.5" text-anchor="middle">피드백</text><path class="flow" d="M24 936.5 H54"/><text class="small" x="62" y="941.5">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 936.5 H221.94875000000002"/><text class="small" x="229.94875000000002" y="941.5">영향·제약</text><rect class="focal" x="312.22900000000004" y="928.5" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="941.5">중심 개념</text>
</svg>
