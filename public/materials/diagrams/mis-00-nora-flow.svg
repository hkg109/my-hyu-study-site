<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="mis-00-nora-flow-title mis-00-nora-flow-desc">
  <title id="mis-00-nora-flow-title">NORA는 흩어진 기록을 합쳐 숨은 관계를 찾는다</title>
  <desc id="mis-00-nora-flow-desc">Nonobvious Relationship Awareness: 여러 데이터베이스의 이름을 표준화하고 맞춰 본 뒤 경고를 만든다</desc>
  <defs><marker id="mis-00-nora-flow-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.link{stroke:#65645e;stroke-width:2;fill:none}.flow{stroke:#65645e;stroke-width:2;fill:none;marker-end:url(#mis-00-nora-flow-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.step{font:600 12px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.inverse{fill:#f7f6f2}</style>
  <rect class="bg" width="1280" height="700"/><text class="tag" x="64" y="52">4장 · 데이터 분석과 프라이버시</text><text class="title" x="64" y="92">NORA는 흩어진 기록을 합쳐 숨은 관계를 찾는다</text><text class="subtitle" x="64" y="122">Nonobvious Relationship Awareness: 여러 데이터베이스의 이름을 표준화하고 맞춰 본 뒤 경고를 만든다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
  <g><rect class="node" x="64" y="180" width="268" height="56" rx="6"/><text class="name" x="88" y="214" style="font-size:15px">Watch Lists</text></g><path class="flow" d="M332 208 H396"/>
  <g><rect class="node" x="64" y="256" width="268" height="56" rx="6"/><text class="name" x="88" y="290" style="font-size:15px">Incident &amp; Arrest Systems</text></g><path class="flow" d="M332 284 H396"/>
  <g><rect class="node" x="64" y="332" width="268" height="56" rx="6"/><text class="name" x="88" y="366" style="font-size:15px">Customer Transactions</text></g><path class="flow" d="M332 360 H396"/>
  <g><rect class="node" x="64" y="408" width="268" height="56" rx="6"/><text class="name" x="88" y="442" style="font-size:15px">Telephone Records</text></g><path class="flow" d="M332 436 H396"/>
  <g><rect class="node" x="64" y="484" width="268" height="56" rx="6"/><text class="name" x="88" y="518" style="font-size:15px">HR Systems</text></g><path class="flow" d="M332 512 H396"/>
  <rect class="zone" x="400" y="180" width="460" height="360" rx="6"/><text class="step" x="424" y="208">처리 단계</text>
  <g><rect class="node" x="432" y="224" width="396" height="80" rx="6"/><text class="name" x="456" y="262">Name Standardization</text><text class="sub" x="456" y="288">표기가 다른 이름을 같은 형식으로</text></g>
  <g><rect class="node" x="432" y="332" width="396" height="80" rx="6"/><text class="name" x="456" y="370">Match</text><text class="sub" x="456" y="396">같은 사람 · 주소 · 번호를 찾아 연결</text></g>
  <g><rect class="node" x="432" y="440" width="396" height="80" rx="6"/><text class="name" x="456" y="478">Merge</text><text class="sub" x="456" y="504">연결된 기록을 하나의 관계망으로</text></g>
  <path class="flow" d="M630 304 V328"/><path class="flow" d="M630 412 V436"/><path class="flow" d="M860 360 H932"/>
  <g><rect class="focal" x="936" y="296" width="280" height="128" rx="6"/><text class="step inverse" x="960" y="326">결과</text><text class="name inverse" x="960" y="358">NORA Alerts</text><text class="sub inverse" x="960" y="384">드러나지 않던 관계를</text><text class="sub inverse" x="960" y="410">실시간 경고로 알림</text></g>
  <rect class="zone" x="64" y="584" width="1152" height="70" rx="6"/><text class="step" x="88" y="612">Profiling과 구분하기</text><text class="sub" x="88" y="638">Profiling은 한 사람의 자료를 모아 상세 파일(dossier)을 만들고, NORA는 여러 사람과 기록 사이의 숨은 관계를 찾는다</text>
</svg>
