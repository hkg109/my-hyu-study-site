<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 666" width="560" height="666" role="img" aria-labelledby="lm2-l14b-cloud-models-title lm2-l14b-cloud-models-desc">
  <title id="lm2-l14b-cloud-models-title">IaaS·PaaS·SaaS 관리 범위</title>
  <desc id="lm2-l14b-cloud-models-desc">온프레미스, IaaS, PaaS, SaaS 네 기둥에 위에서부터 애플리케이션, 데이터, 런타임, 미들웨어, OS, 가상화, 서버, 스토리지, 네트워크 아홉 층을 쌓았다. 온프레미스는 모두 사용자가 관리하고, IaaS는 가상화부터 아래를, PaaS는 런타임부터 아래를, SaaS는 전부를 제공자가 관리한다. 예로 EC2와 OpenStack, App Engine과 Heroku, Gmail과 Microsoft 365를 적었다.</desc>
  <defs><marker id="lm2-l14b-cloud-models-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l14b-cloud-models-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
