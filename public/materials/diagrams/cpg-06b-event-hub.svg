<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 672" role="img" aria-labelledby="cpg-06b-event-hub-title cpg-06b-event-hub-desc">
  <title id="cpg-06b-event-hub-title">행사는 하위 자료의 상한이다</title>
  <desc id="cpg-06b-event-hub-desc">Event 아래에 Event 범위를 그대로 따르는 Resource, Schedule, Handover 묶음과, 그 범위 안에서 더 좁힐 수 있는 Task와 Meeting 묶음을 두고, 범위를 좁힐 때는 충돌 목록을 해결해야 저장된다는 그림.</desc>
  <defs><marker id="cpg-06b-event-hub-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="cpg-06b-event-hub-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#cpg-06b-event-hub-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#cpg-06b-event-hub-m)}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.soft{stroke:#929087;stroke-width:1.4;fill:none}.boundary{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:8 6}.mask{fill:#f7f6f2;stroke:none}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.code{font:500 14px 'D2Coding','JetBrains Mono','Consolas',monospace;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.big{font:800 22px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="560" height="672"/>
  <text class="tag" x="24" y="40">6편 · Event</text><text class="title" x="24" y="74">행사는 하위 자료의 상한이다</text><text class="subtitle" x="24" y="104">Event를 못 보는 사람은 그 아래 어떤 자료도 못 본다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/>
  <rect class="zone" x="24" y="152" width="512" height="384" rx="6"/>
  <rect class="focal" x="24" y="152" width="512" height="80" rx="6"/><text class="name inv" x="280" y="187.0" text-anchor="middle">Event 범위 · 행사 개요</text><text class="code inv" x="280" y="208.5" text-anchor="middle">ALL_COUNCIL 또는 RESTRICTED</text>
  <rect class="node" x="40" y="248" width="480" height="128" rx="6"/>
  <text class="small" x="56" y="272">그대로 상속 · 같은 범위</text>
  <rect class="zone" x="56" y="284" width="140" height="76" rx="6"/><text class="lab" x="126" y="317.3" text-anchor="middle">Resource</text><text class="small" x="126" y="336.6" text-anchor="middle">업로드·링크</text>
  <rect class="zone" x="208" y="284" width="140" height="76" rx="6"/><text class="lab" x="278" y="317.3" text-anchor="middle">Schedule</text><text class="small" x="278" y="336.6" text-anchor="middle">행사 일정</text>
  <rect class="zone" x="360" y="284" width="144" height="76" rx="6"/><text class="lab" x="432" y="317.3" text-anchor="middle">Handover</text><text class="small" x="432" y="336.6" text-anchor="middle">인수인계</text>
  <rect class="node" x="40" y="392" width="480" height="128" rx="6"/>
  <text class="small" x="56" y="416">이 범위 안에서 더 좁힐 수 있음</text>
  <rect class="deep" x="56" y="428" width="218" height="76" rx="6"/><text class="lab" x="165" y="461.3" text-anchor="middle">Task</text><text class="small" x="165" y="480.6" text-anchor="middle">DEFAULT · RESTRICTED</text>
  <rect class="deep" x="286" y="428" width="218" height="76" rx="6"/><text class="lab" x="395" y="461.3" text-anchor="middle">Meeting</text><text class="small" x="395" y="480.6" text-anchor="middle">Preset · 편집자 지정</text>
  <text class="small" x="280" y="572" text-anchor="middle">범위를 좁히면 충돌 목록을 보여 주고</text>
  <text class="small" x="280" y="594" text-anchor="middle">ACL에 남기기 · 담당자 바꾸기 · 지정 제거 중 골라야 저장된다</text>
  <rect class="focal" x="24" y="630" width="22" height="16" rx="3"/><text class="small" x="54" y="643">상한이 되는 범위</text><rect class="zone" x="176.71" y="630" width="22" height="16" rx="3"/><text class="small" x="206.71" y="643">그대로 상속</text><rect class="deep" x="298.91" y="630" width="22" height="16" rx="3"/><text class="small" x="328.91" y="643">추가로 좁힘</text>
</svg>
