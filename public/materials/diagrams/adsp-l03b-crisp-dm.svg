<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 946" role="img" aria-labelledby="adsp-l03b-crisp-dm-title adsp-l03b-crisp-dm-desc">
  <title id="adsp-l03b-crisp-dm-title">CRISP-DM 6단계와 피드백</title>
  <desc id="adsp-l03b-crisp-dm-desc">CRISP-DM의 업무 이해, 데이터 이해, 데이터 준비, 모델링, 평가, 전개 6단계를 위에서 아래로 놓고 단계별 주요 태스크를 적은 그림. 업무 이해와 데이터 이해, 데이터 준비와 모델링 사이는 왕복하고, 평가에서 업무 목표를 채우지 못하면 업무 이해로 되돌아간다. 데이터 탐색은 데이터 이해, 모델 평가는 모델링, 모델 적용성 평가는 평가 단계임을 굵게 표시했다.</desc>
  <defs><marker id="adsp-l03b-crisp-dm-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l03b-crisp-dm-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l03b-crisp-dm-a)}.flow.both{marker-start:url(#adsp-l03b-crisp-dm-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l03b-crisp-dm-m)}.dash.both{marker-start:url(#adsp-l03b-crisp-dm-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="946"/>
  <text class="tag" x="24" y="40">ADsP · 2과목 1장 · 분석 방법론</text><text class="title" x="24" y="74">CRISP-DM 6단계와 피드백</text><text class="subtitle" x="24" y="104">단계 사이를 오가며 다듬는다 — 태스크가 어느 단계인지 묻는다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="node" x="24" y="154" width="392" height="84" rx="6"/><text class="small" x="40" y="178">Business Understanding</text><text class="name" x="40" y="202">① 업무 이해</text><text class="task" x="40" y="226">업무 목적·상황 파악, 마이닝 목표, 계획 수립</text><path class="flow" d="M220 238 L220 268"/><rect class="node" x="24" y="268" width="392" height="84" rx="6"/><text class="small" x="40" y="292">Data Understanding</text><text class="name" x="40" y="316">② 데이터 이해</text><text class="task" x="40" y="340">초기 수집, 기술 분석, <tspan class="b">데이터 탐색(EDA)</tspan>, 품질 확인</text><path class="flow" d="M220 352 L220 382"/><rect class="node" x="24" y="382" width="392" height="84" rx="6"/><text class="small" x="40" y="406">Data Preparation</text><text class="name" x="40" y="430">③ 데이터 준비</text><text class="task" x="40" y="454">데이터셋 선택, 정제, 편성, 통합, 포맷팅</text><path class="flow" d="M220 466 L220 496"/><rect class="node" x="24" y="496" width="392" height="84" rx="6"/><text class="small" x="40" y="520">Modeling</text><text class="name" x="40" y="544">④ 모델링</text><text class="task" x="40" y="568">기법 선택, 테스트 계획, 모델 작성, <tspan class="b">모델 평가</tspan></text><path class="flow" d="M220 580 L220 610"/><rect class="zone" x="24" y="610" width="392" height="84" rx="6"/><text class="small" x="40" y="634">Evaluation</text><text class="name" x="40" y="658">⑤ 평가</text><text class="task" x="40" y="682">분석 결과 평가, 과정 평가, <tspan class="b">모델 적용성 평가</tspan></text><path class="flow" d="M220 694 L220 724"/><rect class="node" x="24" y="724" width="392" height="84" rx="6"/><text class="small" x="40" y="748">Deployment</text><text class="name" x="40" y="772">⑥ 전개</text><text class="task" x="40" y="796">전개 계획, 모니터링·유지보수, 종료 보고·리뷰</text><path class="dash" d="M416 298 H446 V210 H416"/><rect class="mask" x="425.5" y="243" width="41.0" height="22" rx="4"/><text class="lab" x="446" y="259" text-anchor="middle">왕복</text><path class="dash" d="M416 526 H446 V438 H416"/><rect class="mask" x="425.5" y="471" width="41.0" height="22" rx="4"/><text class="lab" x="446" y="487" text-anchor="middle">왕복</text><path class="dash" d="M416 652 H506 V176 H416"/><rect class="mask" x="469.8" y="532" width="72.3" height="22" rx="4"/><text class="lab" x="506" y="548" text-anchor="middle">목표 미달</text><text class="small" x="24" y="838">굵은 글씨: 단계 이름과 헷갈리는 태스크 — "모델 평가"는 모델링,</text><text class="small" x="24" y="858">"모델 적용성 평가"는 평가, EDA는 데이터 이해 단계다.</text><path class="flow" d="M24 890 H54"/><text class="small" x="62" y="895">기본 진행 순서</text><path class="dash" d="M169.64 890 H199.64"/><text class="small" x="207.64" y="895">앞 단계로 되돌아감</text><rect class="zone" x="24" y="908" width="22" height="16" rx="3"/><text class="small" x="54" y="921">업무 목표 충족 여부 판단</text>
</svg>
