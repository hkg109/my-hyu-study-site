<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" width="720" height="468" role="img" aria-labelledby="cpp-05-pointer-memory-title cpp-05-pointer-memory-desc">
  <title id="cpp-05-pointer-memory-title">포인터는 주소를 값으로 저장하는 변수</title>
  <desc id="cpp-05-pointer-memory-desc">주소 1004에 있는 int x와 주소 1016에 있는 포인터 p를 메모리 표로 그리고, p = &amp;x 로 p에 1004가 들어가 x를 가리키며, *p = 5 로 x의 값이 5가 되는 과정</desc>
  <defs>
    <marker id="cpp-05-pointer-memory-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-05-pointer-memory-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-05-pointer-memory-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="468" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">05 · 포인터</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">포인터는 주소를 값으로 저장하는 변수</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <text x="84" y="128" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">주소</text><text x="196" y="128" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">값</text><text x="84" y="165" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#65645e" text-anchor="middle">1000</text><rect x="136" y="140" width="120" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="196" y="166" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#1d1d1a" text-anchor="middle"></text><text x="84" y="205" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#65645e" text-anchor="middle">1004</text><rect x="136" y="180" width="120" height="40" fill="#f3e3dc" stroke="#a8431f" stroke-width="1.4"/><text x="196" y="206" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#1d1d1a" text-anchor="middle">5</text><text x="272" y="205" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a">x</text><text x="84" y="245" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#65645e" text-anchor="middle">1008</text><rect x="136" y="220" width="120" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="196" y="246" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#1d1d1a" text-anchor="middle"></text><text x="84" y="285" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#65645e" text-anchor="middle">1012</text><rect x="136" y="260" width="120" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="196" y="286" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#1d1d1a" text-anchor="middle"></text><text x="84" y="325" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#65645e" text-anchor="middle">1016</text><rect x="136" y="300" width="120" height="40" fill="#1d1d1a" stroke="#b9b6ac" stroke-width="1.4"/><text x="196" y="326" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#f7f6f2" text-anchor="middle">1004</text><text x="272" y="325" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a">p</text><text x="84" y="365" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="400" fill="#65645e" text-anchor="middle">1020</text><rect x="136" y="340" width="120" height="40" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.4"/><text x="196" y="366" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="15" font-weight="700" fill="#1d1d1a" text-anchor="middle"></text><path d="M256 312 L292 312 Q300 312 300 304 L300 216 Q300 208 292 208 L260 208" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-05-pointer-memory-a)"/><rect x="324" y="250" width="48" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="348" y="264.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">가리킴</text><text x="400" y="168" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#1d1d1a">int x = 0;</text><text x="400" y="196" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#1d1d1a">int *p;      // 선언의 *</text><text x="400" y="224" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#1d1d1a">p = &amp;x;      // &amp; = 주소</text><text x="400" y="252" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#1d1d1a">*p = 5;      // 식의 * = 역참조</text><text x="400" y="296" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a">→ x는 5, p는 1004</text><text x="400" y="324" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">주소 숫자는 실행마다 다르다.</text><text x="400" y="344" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">중요한 것은 "어느 칸을 가리키나"다.</text>
  <line x1="32" y1="420" x2="688" y2="420" stroke="#b9b6ac"/><path d="M32 442 H60" stroke="#a8431f" stroke-width="1.8" marker-end="url(#cpp-05-pointer-memory-a)"/><text x="68" y="447" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">p가 가리키는 칸</text><rect x="186.88" y="434" width="20" height="16" rx="3" fill="#1d1d1a"/><text x="218.88" y="447" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">주소를 담은 칸</text>
</svg>
