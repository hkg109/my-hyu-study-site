="6" fill="#f7f6f2"/><rect x="56" y="300" width="240" height="72" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><rect x="64" y="306" width="132" height="16" rx="2" fill="#f0eee8" stroke="#b9b6ac"/><text x="130" y="318" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#65645e" text-anchor="middle">정적 바인딩 · 컴파일 때</text><text x="176" y="344" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">Circle::area()</text><text x="176" y="364" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">포인터 자료형 기준</text><rect x="424" y="300" width="240" height="72" rx="6" fill="#f7f6f2"/><rect x="424" y="300" width="240" height="72" rx="6" fill="#f3e3dc" stroke="#a8431f" stroke-width="1.5"/><rect x="432" y="306" width="124" height="16" rx="2" fill="#f0eee8" stroke="#b9b6ac"/><text x="494" y="318" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#a8431f" text-anchor="middle">동적 바인딩 · 실행 때</text><text x="544" y="344" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">Cylinder::area()</text><text x="544" y="364" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">실제 객체 기준</text>
