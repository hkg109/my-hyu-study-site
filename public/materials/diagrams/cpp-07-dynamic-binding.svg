<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="cpp-07-dynamic-binding-title cpp-07-dynamic-binding-desc">
  <title id="cpp-07-dynamic-binding-title">Circle* 로 Cylinder를 가리킬 때 area()는 누구의 것?</title>
  <desc id="cpp-07-dynamic-binding-desc">Circle 포인터 cir1이 Cylinder 객체를 가리킬 때, area()가 virtual이면 실행 중에 실제 객체를 보고 Cylinder::area()를, virtual이 아니면 컴파일할 때 포인터 자료형을 보고 Circle::area()를 호출한다는 흐름</desc>
  <defs>
    <marker id="cpp-07-dynamic-binding-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-07-dynamic-binding-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-07-dynamic-binding-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="460" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">07 · 다형성</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">Circle* 로 Cylinder를 가리킬 때 area()는 누구의 것?</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
