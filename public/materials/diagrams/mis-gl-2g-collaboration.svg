<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 733" role="img" aria-labelledby="mis-gl-2g-collaboration-title mis-gl-2g-collaboration-desc">
  <title id="mis-gl-2g-collaboration-title">협업 역량 + 협업 기술 → 협업의 질</title>
  <desc id="mis-gl-2g-collaboration-desc">개방적 문화, 분권적 구조, 협업의 폭으로 이루어진 협업 역량과 실행·운영 및 전략 계획을 지원하는 협업 기술이 합쳐져 협업의 질을 정하고, 협업의 질이 생산성·품질·혁신·고객 서비스를 거쳐 기업 성과에 영향을 주는 그림</desc>
  <defs><marker id="mis-gl-2g-collaboration-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2g-collaboration-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2g-collaboration-a)}.flow.both{marker-start:url(#mis-gl-2g-collaboration-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2g-collaboration-m)}.dash.both{marker-start:url(#mis-gl-2g-collaboration-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="733"/>
  <text class="tag" x="24" y="40">2장 · 2-5 협업과 소셜 비즈니스 ①</text><text class="title" x="24" y="74">협업 역량 + 협업 기술 → 협업의 질</text><text class="subtitle" x="24" y="104">Figure 2.7 · 도구만 깔면 협업이 생기지 않는다. 문화·구조라는 역량이 함께</text><text class="subtitle" x="24" y="124">있어야 한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="249" height="130.5" rx="6"/><text class="small" x="148.5" y="198" text-anchor="middle">Collaboration capability</text><text class="name" x="148.5" y="219" text-anchor="middle">협업 역량</text><text class="body" x="148.5" y="246" text-anchor="middle">개방적 문화</text><text class="body" x="148.5" y="266.5" text-anchor="middle">분권적 구조</text><text class="body" x="148.5" y="287" text-anchor="middle">협업의 폭</text><rect class="node" x="287" y="172" width="249" height="130.5" rx="6"/><text class="small" x="411.5" y="208.25" text-anchor="middle">Collaboration technology</text><text class="name" x="411.5" y="229.25" text-anchor="middle">협업 기술</text><text class="body" x="411.5" y="256.25" text-anchor="middle">실행·운영 지원</text><text class="body" x="411.5" y="276.75" text-anchor="middle">전략 계획 지원</text><rect class="node" x="24" y="360.5" width="512" height="71.5" rx="6"/><text class="name" x="280" y="388.5" text-anchor="middle">협업의 질</text><text class="body" x="280" y="415.5" text-anchor="middle">내부 정치로 함께 일하지 못하면 낮아진다</text><rect class="node" x="24" y="490" width="512" height="71.5" rx="6"/><text class="name" x="280" y="518" text-anchor="middle">생산성 · 품질 · 혁신 · 고객 서비스</text><text class="body" x="280" y="545" text-anchor="middle">지식 공유·빠른 문제 해결</text><rect class="focal" x="24" y="619.5" width="512" height="45" rx="6"/><text class="name inv" x="280" y="647.5" text-anchor="middle">기업 성과 (재무 성과)</text><path class="line" d="M148.5 302.5 V328.6"/><path class="line" d="M411.5 302.5 V328.6"/><path class="line" d="M148.5 328.6 H411.5"/><path class="flow" d="M280 328.6 L280 360.5"/><rect class="mask" x="241.9" y="333.55" width="76.1" height="22" rx="4"/><text class="lab" x="280" y="349.55" text-anchor="middle">함께 결정</text><path class="flow" d="M280 432 L280 490"/><rect class="mask" x="258.6" y="450" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="466" text-anchor="middle">영향</text><path class="flow" d="M280 561.5 L280 619.5"/><rect class="mask" x="258.6" y="579.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="595.5" text-anchor="middle">누적</text><path class="flow" d="M24 688.5 H54"/><text class="small" x="62" y="693.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="680.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="693.5">중심 개념</text>
