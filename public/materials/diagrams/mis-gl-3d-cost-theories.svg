<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 648" role="img" aria-labelledby="mis-gl-3d-cost-theories-title mis-gl-3d-cost-theories-desc">
  <title id="mis-gl-3d-cost-theories-title">거래 비용(바깥) vs 대리인 비용(안쪽)</title>
  <desc id="mis-gl-3d-cost-theories-desc">IT와 인터넷이 정보 비용을 낮추고, 그 결과 시장에서 거래할 때의 거래 비용과 직원을 감독할 때의 대리인 비용이 함께 낮아지며, 거래 비용 감소는 외주 증가와 기업 규모 축소로, 대리인 비용 감소는 관리자를 크게 늘리지 않는 확장과 조직 납작화로 이어지는 비교 그림</desc>
  <defs><marker id="mis-gl-3d-cost-theories-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-3d-cost-theories-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-3d-cost-theories-a)}.flow.both{marker-start:url(#mis-gl-3d-cost-theories-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-3d-cost-theories-m)}.dash.both{marker-start:url(#mis-gl-3d-cost-theories-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="648"/>
  <text class="tag" x="24" y="40">3장 · 3-3 IT가 조직에 미치는 영향 ①</text><text class="title" x="24" y="74">거래 비용(바깥) vs 대리인 비용(안쪽)</text><text class="subtitle" x="24" y="104">IT가 정보 비용을 낮추면 두 비용이 모두 줄지만, 기업 규모에 미치는 방향은</text><text class="subtitle" x="24" y="124">다를 수 있다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="198" text-anchor="middle">IT · Internet</text><text class="name inv" x="280" y="219" text-anchor="middle">정보 비용 ↓</text><text class="body inv" x="280" y="246" text-anchor="middle">IT도 자본·노동 같은 생산 요소</text><rect class="node" x="24" y="319.5" width="249" height="110" rx="6"/><text class="small" x="148.5" y="345.5" text-anchor="middle">Transaction cost · 바깥(시장)</text><text class="name" x="148.5" y="366.5" text-anchor="middle">거래 비용 ↓</text><text class="body" x="148.5" y="393.5" text-anchor="middle">공급자 탐색·계약</text><text class="body" x="148.5" y="414" text-anchor="middle">품질 확인·감시</text><rect class="node" x="287" y="319.5" width="249" height="110" rx="6"/><text class="small" x="411.5" y="345.5" text-anchor="middle">Agency cost · 안쪽(직원)</text><text class="name" x="411.5" y="366.5" text-anchor="middle">대리인 비용 ↓</text><text class="body" x="411.5" y="393.5" text-anchor="middle">대리인(직원)</text><text class="body" x="411.5" y="414" text-anchor="middle">감독·관리</text><rect class="node" x="24" y="487.5" width="249" height="92" rx="6"/><text class="name" x="148.5" y="515.5" text-anchor="middle">외주 ↑</text><text class="body" x="148.5" y="542.5" text-anchor="middle">기업 규모 축소 가능</text><text class="body" x="148.5" y="563" text-anchor="middle">(수직 통합 필요 ↓)</text><rect class="node" x="287" y="487.5" width="249" height="92" rx="6"/><text class="name" x="411.5" y="515.5" text-anchor="middle">적은 관리자로 확장</text><text class="body" x="411.5" y="542.5" text-anchor="middle">계층 ↓ · 통제 범위 ↑</text><text class="body" x="411.5" y="563" text-anchor="middle">(Flattening)</text><path class="line" d="M280 261.5 V293.4"/><path class="line" d="M148.5 293.4 H411.5"/><path class="flow" d="M148.5 293.4 L148.5 319.5"/><path class="flow" d="M411.5 293.4 L411.5 319.5"/><rect class="mask" x="258.6" y="266.45" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="282.45" text-anchor="middle">낮춤</text><path class="flow" d="M148.5 429.5 L148.5 487.5"/><rect class="mask" x="127.1" y="447.5" width="42.9" height="22" rx="4"/><text class="lab" x="148.5" y="463.5" text-anchor="middle">결과</text><path class="flow" d="M411.5 429.5 L411.5 487.5"/><rect class="mask" x="390.1" y="447.5" width="42.9" height="22" rx="4"/><text class="lab" x="411.5" y="463.5" text-anchor="middle">결과</text><path class="flow" d="M24 603.5 H54"/><text class="small" x="62" y="608.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="595.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="608.5">중심 개념</text>
</svg>
