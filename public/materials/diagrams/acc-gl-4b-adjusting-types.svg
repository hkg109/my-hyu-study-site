<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1130" role="img" aria-labelledby="acc-gl-4b-adjusting-types-title acc-gl-4b-adjusting-types-desc">
  <title id="acc-gl-4b-adjusting-types-title">결산정리 4유형 — 발생 · 이연 · 감가상각 · 대손</title>
  <desc id="acc-gl-4b-adjusting-types-desc">결산정리를 중심으로 네 갈래가 뻗는다. 1 미수수익과 미지급비용은 발생했지만 기록되지 않은 수익과 비용을 인식하고, 2 선급비용과 선수수익은 기록한 수익과 비용 중 차기 몫을 이연하며, 3 감가상각비는 감가상각누계액으로, 4 대손상각비는 대손충당금으로 기록한다. 각 칸에 표준 분개와 계정 성격을 적은 그림</desc>
  <defs><marker id="acc-gl-4b-adjusting-types-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-4b-adjusting-types-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-4b-adjusting-types-a)}.flow.both{marker-start:url(#acc-gl-4b-adjusting-types-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-4b-adjusting-types-m)}.dash.both{marker-start:url(#acc-gl-4b-adjusting-types-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1130"/>
  <text class="tag" x="24" y="40">4장 · 4-2 결산정리 4유형</text><text class="title" x="24" y="74">결산정리 4유형</text><text class="subtitle" x="24" y="104">장부금액을 발생기준의 정확한 금액으로 고치는 네 가지</text><text class="subtitle" x="24" y="124">대표 분개 — 분개장에 기록하고 원장에 전기한다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="170" width="512" height="76" rx="6"/><text class="name inv" x="280.0" y="205.0" text-anchor="middle">결산정리 (결산일)</text><text class="small inv" x="280.0" y="224.0" text-anchor="middle">자산·부채·자본 = 결산일 실제 금액, 수익·비용 = 기간 발생액</text><path class="line" d="M44 246 L44 990"/><rect class="zone" x="140" y="282" width="396" height="186" rx="8"/><text class="name" x="154" y="308">① 미기록된 수익·비용의 인식</text><text class="small" x="154" y="330">발생했지만 아직 장부에 없음</text><path class="flow" d="M44 375.0 L140 375.0"/><rect class="mask" x="71.4" y="364.0" width="41.2" height="22" rx="4"/><text class="lab" x="92.0" y="380.0" text-anchor="middle">발생</text><rect class="node" x="154.0" y="344" width="179.0" height="112" rx="6"/><text class="lab" x="243.5" y="368" text-anchor="middle">미수수익 · 자산</text><text class="body" x="243.5" y="396" text-anchor="middle">차) 미수수익</text><text class="body" x="243.5" y="422" text-anchor="middle">대) ○○수익</text><rect class="node" x="343.0" y="344" width="179.0" height="112" rx="6"/><text class="lab" x="432.5" y="368" text-anchor="middle">미지급비용 · 부채</text><text class="body" x="432.5" y="396" text-anchor="middle">차) ○○비용</text><text class="body" x="432.5" y="422" text-anchor="middle">대) 미지급비용</text><rect class="zone" x="140" y="500" width="396" height="186" rx="8"/><text class="name" x="154" y="526">② 기록한 수익·비용의 이연</text><text class="small" x="154" y="548">기록했지만 일부가 차기 몫</text><path class="flow" d="M44 593.0 L140 593.0"/><rect class="mask" x="71.4" y="582.0" width="41.2" height="22" rx="4"/><text class="lab" x="92.0" y="598.0" text-anchor="middle">이연</text><rect class="node" x="154.0" y="562" width="179.0" height="112" rx="6"/><text class="lab" x="243.5" y="586" text-anchor="middle">선급비용 · 자산</text><text class="body" x="243.5" y="614" text-anchor="middle">차) 선급비용</text><text class="body" x="243.5" y="640" text-anchor="middle">대) ○○비용</text><rect class="node" x="343.0" y="562" width="179.0" height="112" rx="6"/><text class="lab" x="432.5" y="586" text-anchor="middle">선수수익 · 부채</text><text class="body" x="432.5" y="614" text-anchor="middle">차) ○○수익</text><text class="body" x="432.5" y="640" text-anchor="middle">대) 선수수익</text><rect class="zone" x="140" y="718" width="396" height="160" rx="8"/><text class="name" x="154" y="744">③ 유형자산의 감가상각</text><text class="small" x="154" y="766">사용기간에 걸쳐 원가를 비용으로 배부</text><path class="flow" d="M44 798.0 L140 798.0"/><rect class="mask" x="71.4" y="787.0" width="41.2" height="22" rx="4"/><text class="lab" x="92.0" y="803.0" text-anchor="middle">배부</text><rect class="node" x="154.0" y="780" width="368.0" height="86" rx="6"/><text class="lab" x="338.0" y="804" text-anchor="middle">누계액 = 유형자산 차감</text><text class="body" x="338.0" y="832" text-anchor="middle">차) 감가상각비</text><text class="body" x="338.0" y="858" text-anchor="middle">대) 감가상각누계액</text><rect class="zone" x="140" y="910" width="396" height="160" rx="8"/><text class="name" x="154" y="936">④ 매출채권의 대손</text><text class="small" x="154" y="958">회수 어려울 금액을 추정해 비용 인식</text><path class="flow" d="M44 990.0 L140 990.0"/><rect class="mask" x="71.4" y="979.0" width="41.2" height="22" rx="4"/><text class="lab" x="92.0" y="995.0" text-anchor="middle">추정</text><rect class="node" x="154.0" y="972" width="368.0" height="86" rx="6"/><text class="lab" x="338.0" y="996" text-anchor="middle">충당금 = 매출채권 차감</text><text class="body" x="338.0" y="1024" text-anchor="middle">차) 대손상각비</text><text class="body" x="338.0" y="1050" text-anchor="middle">대) 대손충당금</text><path class="flow" d="M24 1105 H54"/><text class="small" x="62" y="1110">흐름·순서</text><path class="dash" d="M150 1105 H180"/><text class="small" x="188" y="1110">확인·대체(되돌림)</text><rect class="focal" x="330" y="1097" width="22" height="16" rx="3"/><text class="small" x="360" y="1110">중심 개념</text><rect class="zone" x="440" y="1097" width="22" height="16" rx="3"/><text class="small" x="470" y="1110">범위·묶음</text>
</svg>
