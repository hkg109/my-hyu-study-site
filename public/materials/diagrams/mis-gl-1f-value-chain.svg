<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 734" role="img" aria-labelledby="mis-gl-1f-value-chain-title mis-gl-1f-value-chain-desc">
  <title id="mis-gl-1f-value-chain-title">비즈니스 정보 가치사슬</title>
  <desc id="mis-gl-1f-value-chain-desc">데이터 수집·저장, 비즈니스 시스템으로의 변환, 배포의 정보 처리 활동이 비즈니스 프로세스와 경영 활동의 개선으로 이어지고 기업의 수익성과 전략적 위치를 높이며, 보완 자산이 경영 활동 단계를 지원하는 점선 화살표가 있는 그림</desc>
  <defs><marker id="mis-gl-1f-value-chain-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-1f-value-chain-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-1f-value-chain-a)}.flow.both{marker-start:url(#mis-gl-1f-value-chain-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-1f-value-chain-m)}.dash.both{marker-start:url(#mis-gl-1f-value-chain-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="734"/>
  <text class="tag" x="24" y="40">1장 · 1-5 IT 투자가 가치가 되는 길 ①</text><text class="title" x="24" y="74">비즈니스 정보 가치사슬</text><text class="subtitle" x="24" y="104">정보 처리 활동이 경영 활동을 거쳐야 수익성과 전략적 위치라는 가치가 된다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="node" x="24" y="152" width="307" height="89.5" rx="6"/><text class="small" x="177.5" y="178" text-anchor="middle">정보 처리 활동</text><text class="name" x="177.5" y="199" text-anchor="middle">수집·저장 → 변환 → 배포</text><text class="body" x="177.5" y="226" text-anchor="middle">데이터가 정보로 바뀐다</text><rect class="node" x="24" y="299.5" width="307" height="89.5" rx="6"/><text class="small" x="177.5" y="325.5" text-anchor="middle">비즈니스 프로세스</text><text class="name" x="177.5" y="346.5" text-anchor="middle">SCM·전사·고객·지식 관리</text><text class="body" x="177.5" y="373.5" text-anchor="middle">업무 방식이 바뀐다</text><rect class="node" x="24" y="429" width="307" height="89.5" rx="6"/><text class="small" x="177.5" y="455" text-anchor="middle">경영 활동</text><text class="name" x="177.5" y="476" text-anchor="middle">계획·조정·통제·결정</text><text class="body" x="177.5" y="503" text-anchor="middle">더 나은 결정을 내린다</text><rect class="focal" x="24" y="576.5" width="307" height="89.5" rx="6"/><text class="small inv" x="177.5" y="602.5" text-anchor="middle">Business value</text><text class="name inv" x="177.5" y="623.5" text-anchor="middle">수익성·전략적 위치</text><text class="body inv" x="177.5" y="650.5" text-anchor="middle">생산성·매출 ↑</text><path class="flow" d="M177.5 241.5 L177.5 299.5"/><rect class="mask" x="139.4" y="259.5" width="76.1" height="22" rx="4"/><text class="lab" x="177.5" y="275.5" text-anchor="middle">정보 제공</text><path class="flow" d="M177.5 389 L177.5 429"/><path class="flow" d="M177.5 518.5 L177.5 576.5"/><rect class="mask" x="156.1" y="536.5" width="42.9" height="22" rx="4"/><text class="lab" x="177.5" y="552.5" text-anchor="middle">결과</text><rect class="node" x="371" y="334.75" width="165" height="148.5" rx="6"/><text class="small" x="453.5" y="360.75" text-anchor="middle">Complementary</text><text class="small" x="453.5" y="378.75" text-anchor="middle">assets</text><text class="name" x="453.5" y="399.75" text-anchor="middle">보완 자산</text><text class="body" x="453.5" y="426.75" text-anchor="middle">교육·권한</text><text class="body" x="453.5" y="447.25" text-anchor="middle">새 프로세스</text><text class="body" x="453.5" y="467.75" text-anchor="middle">경영 지원</text><path class="dash" d="M371 379.3 L331 344.25"/><path class="dash" d="M371 438.7 L331 473.75"/><rect class="mask" x="329.6" y="309.75" width="42.9" height="22" rx="4"/><text class="lab" x="351" y="325.75" text-anchor="middle">지원</text><path class="flow" d="M24 690 H54"/><text class="small" x="62" y="695">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 690 H221.94875000000002"/><text class="small" x="229.94875000000002" y="695">영향·제약</text><rect class="focal" x="312.22900000000004" y="682" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="695">중심 개념</text>
