  <text class="name inv" x="58" y="233">00</text>
  <text class="body inv" x="112" y="233">기획서 총정리 · 추가 결정</text>
  <path class="flow" d="M280 260 V292"/>
  <rect class="zone" x="24" y="292" width="512" height="92" rx="6"/>
