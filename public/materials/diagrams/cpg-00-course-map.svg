  <rect class="node" x="40" y="454" width="480" height="42" rx="6"/>
  <text class="name" x="58" y="481">02</text>
  <text class="body" x="112" y="481">프론트엔드 · 브라우저</text>
  <rect class="node" x="40" y="506" width="480" height="42" rx="6"/>
  <text class="name" x="58" y="533">03</text>
  <text class="body" x="112" y="533">백엔드 · Next.js 서버</text>
  <rect class="node" x="40" y="558" width="480" height="42" rx="6"/>
  <text class="name" x="58" y="585">04</text>
  <text class="body" x="112" y="585">데이터베이스 · Supabase</text>
  <rect class="node" x="40" y="610" width="480" height="42" rx="6"/>
  <text class="name" x="58" y="637">05</text>
  <text class="body" x="112" y="637">실시간 공동편집</text>
  <path class="flow" d="M280 664 V696"/>
  <rect class="zone" x="24" y="696" width="512" height="92" rx="6"/>
  <text class="small" x="40" y="722">기능으로 묶기</text>
  <rect class="node" x="40" y="734" width="480" height="42" rx="6"/>
  <text class="name" x="58" y="761">06</text>
  <text class="body" x="112" y="761">화면 → 서버 → DB 따라가기</text>
  <path class="flow" d="M280 788 V820"/>
  <rect class="zone" x="24" y="820" width="512" height="92" rx="6"/>
  <text class="small" x="40" y="846">오래 운영하기</text>
  <rect class="node" x="40" y="858" width="480" height="42" rx="6"/>
  <text class="name" x="58" y="885">07</text>
  <text class="body" x="112" y="885">n년 운영과 인수인계</text>
  <rect class="focal" x="24" y="940" width="22" height="16" rx="3"/><text class="small" x="54" y="953">여기서 시작</text><rect class="zone" x="146.2" y="940" width="22" height="16" rx="3"/><text class="small" x="176.2" y="953">단계 묶음</text><rect class="node" x="255.17" y="940" width="22" height="16" rx="3"/><text class="small" x="285.16999999999996" y="953">과목 하나</text>
