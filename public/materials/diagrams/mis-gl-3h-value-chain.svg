<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 963" role="img" aria-labelledby="mis-gl-3h-value-chain-title mis-gl-3h-value-chain-desc">
  <title id="mis-gl-3h-value-chain-title">가치사슬: 지원 활동과 본원적 활동</title>
  <desc id="mis-gl-3h-value-chain-desc">관리, 인적자원, 기술, 조달의 지원 활동 네 개가 본원적 활동을 지원하고, 입고 물류, 운영, 판매·마케팅, 서비스, 출고 물류의 본원적 활동 다섯 개가 고객 가치와 이윤을 만드는 그림. 각 칸에 교재의 정보시스템 예가 있다</desc>
  <defs><marker id="mis-gl-3h-value-chain-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-3h-value-chain-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-3h-value-chain-a)}.flow.both{marker-start:url(#mis-gl-3h-value-chain-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-3h-value-chain-m)}.dash.both{marker-start:url(#mis-gl-3h-value-chain-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="963"/>
  <text class="tag" x="24" y="40">3장 · 3-5 가치사슬과 네트워크 전략 ①</text><text class="title" x="24" y="74">가치사슬: 지원 활동과 본원적 활동</text><text class="subtitle" x="24" y="104">Figure 3.9 · Porter 모형이 “어떤 압력인가”라면 가치사슬은 “기업 안</text><text class="subtitle" x="24" y="124">어디를 고칠까”를 묻는다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="164" width="528" height="233" rx="8"/><text class="small" x="28" y="184">Support activities · 지원 활동</text><rect class="zone" x="16" y="439" width="528" height="332.5" rx="8"/><text class="small" x="28" y="459">Primary activities · 본원적 활동</text><rect class="node" x="24" y="198" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="224" text-anchor="middle">Administration</text><text class="name" x="148.5" y="245" text-anchor="middle">관리</text><text class="body" x="148.5" y="272" text-anchor="middle">전자 일정·메시징</text><rect class="node" x="287" y="198" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="224" text-anchor="middle">Human resources</text><text class="name" x="411.5" y="245" text-anchor="middle">인적자원</text><text class="body" x="411.5" y="272" text-anchor="middle">인력 계획</text><rect class="node" x="24" y="297.5" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="323.5" text-anchor="middle">Technology</text><text class="name" x="148.5" y="344.5" text-anchor="middle">기술</text><text class="body" x="148.5" y="371.5" text-anchor="middle">CAD</text><rect class="node" x="287" y="297.5" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="323.5" text-anchor="middle">Procurement</text><text class="name" x="411.5" y="344.5" text-anchor="middle">조달</text><text class="body" x="411.5" y="371.5" text-anchor="middle">전산 발주</text><rect class="node" x="24" y="473" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="499" text-anchor="middle">Inbound logistics</text><text class="name" x="148.5" y="520" text-anchor="middle">입고 물류</text><text class="body" x