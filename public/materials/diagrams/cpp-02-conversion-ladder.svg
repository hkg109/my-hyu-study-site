<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" width="720" height="468" role="img" aria-labelledby="cpp-02-conversion-ladder-title cpp-02-conversion-ladder-desc">
  <title id="cpp-02-conversion-ladder-title">섞어 쓰면 넓은 쪽으로 올라간다</title>
  <desc id="cpp-02-conversion-ladder-desc">bool·char·short가 먼저 int로 올라가고, 서로 다른 형이 섞이면 int, unsigned int, long, unsigned long, long long, unsigned long long, float, double 순서에서 더 넓은 쪽으로 자동 변환되며, 반대로 좁은 형에 넣으면 값이 잘리는 조용한 축소가 일어난다는 그림</desc>
  <defs>
    <marker id="cpp-02-conversion-ladder-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-02-conversion-ladder-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-02-conversion-ladder-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="468" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">02 · 형 변환</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">섞어 쓰면 넓은 쪽으로 올라간다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <path d="M176 146 L216 146" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-conversion-ladder-m)"/><rect x="178" y="110" width="36" height="20" rx="3" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1"/><text x="196" y="124.32" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e" text-anchor="middle">승격</text><path d="M284 146 L296 146" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-conversion-ladder-m)"/><path d="M364 146 L376 146" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-conversion-ladder-m)"/><path d="M444 146 L456 146" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-conversion-ladder-m)"/><path d="M524 146 L536 146" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-conversion-ladder-m)"/><path d="M604 146 L616 146" fill="none" stroke="#65645e" stroke-width="1.6" marker-end="url(#cpp-02-conversion-ladder-m)"/><rect x="32" y="120" width="144" height="52" rx="6" fill="#f7f6f2"/><rect x="32" y="120" width="144" height="52" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="104" y="150.5" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">bool·char·short</text><rect x="216" y="120" width="68" height="52" rx="6" fill="#f7f6f2"/><rect x="216" y="120" width="68" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="250" y="150.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">int</text><rect x="296" y="120" width="68" height="52" rx="6" fill="#f7f6f2"/><rect x="296" y="120" width="68" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="330" y="149.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="700" fill="#1d1d1a" text-anchor="middle">unsigned</text><rect x="376" y="120" width="68" height="52" rx="6" fill="#f7f6f2"/><rect x="376" y="120" width="68" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="410" y="150.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">long</text><rect x="456" y="120" width="68" height="52" rx="6" fill="#f7f6f2"/><rect x="456" y="120" width="68" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="490" y="149.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="11" font-weight="700" fill="#1d1d1a" text-anchor="middle">long long</text><rect x="536" y="120" width="68" height="52" rx="6" fill="#f7f6f2"/><rect x="536" y="120" width="68" height="52" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="570" y="150.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">float</text><rect x="616" y="120" width="68" height="52" rx="6" fill="#f7f6f2"/><rect x="616" y="120" width="68" height="52" rx="6" fill="#1d1d1a" stroke="#1d1d1a" stroke-width="1.5"/><text x="650" y="150.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#f7f6f2" text-anchor="middle">double</text><text x="32" y="216" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#1d1d1a">3 + 4.5  →  3이 double로 올라가 7.5 (double)</text><text x="32" y="244" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#1d1d1a">7 / 2    →  둘 다 int라 3 (소수점 버림)</text><text x="32" y="272" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="400" fill="#1d1d1a">7 / 2.0  →  7이 double로 올라가 3.5</text><rect x="32" y="300" width="300" height="96" rx="6" fill="#f7f6f2"/><rect x="32" y="300" width="300" height="96" rx="6" fill="#f3e3dc" stroke="#a8431f" stroke-width="1.5"/><rect x="40" y="306" width="108" height="16" rx="2" fill="#f0eee8" stroke="#b9b6ac"/><text x="94" y="318" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#a8431f" text-anchor="middle">축소 · narrowing</text><text x="182" y="348" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">double 3.14 → int</text><text x="182" y="368" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">3 (소수점 사라짐)</text><text x="182" y="384" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">컴파일러가 보통 경고하지 않음</text><rect x="388" y="300" width="300" height="96" rx="6" fill="#f7f6f2"/><rect x="388" y="300" width="300" height="96" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><rect x="396" y="306" width="84" height="16" rx="2" fill="#f0eee8" stroke="#b9b6ac"/><text x="438" y="318" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#65645e" text-anchor="middle">명시적 캐스트</text><text x="538" y="348" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="14" font-weight="700" fill="#1d1d1a" text-anchor="middle">(double)7 / 2</text><text x="538" y="368" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">= 3.5</text><text x="538" y="384" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">변환을 내가 정한다</text><path d="M332 348 L388 348" fill="none" stroke="#a8431f" stroke-width="1.6" marker-end="url(#cpp-02-conversion-ladder-a)"/>
