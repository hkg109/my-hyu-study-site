<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 792" role="img" aria-labelledby="adsp-l05c-multiple-imputation-title adsp-l05c-multiple-imputation-desc">
  <title id="adsp-l05c-multiple-imputation-title">다중 대치법: 대치, 분석, 결합</title>
  <desc id="adsp-l05c-multiple-imputation-desc">점수 12, NA, 15, NA, 9인 원자료의 결측 두 칸을 서로 다른 값으로 m번 채워 대치 데이터셋을 만들고, 각각 평균을 구하면 12.0, 12.4, 11.4가 나온다. 세 추정값을 결합해 약 11.9를 얻고, 대치 간 차이를 표준오차에 반영한다. 아래에는 평균 대치를 한 번만 하면 분산과 표준오차가 과소추정된다는 대조를 적었다.</desc>
  <defs><marker id="adsp-l05c-multiple-imputation-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l05c-multiple-imputation-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l05c-multiple-imputation-a)}.flow.both{marker-start:url(#adsp-l05c-multiple-imputation-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l05c-multiple-imputation-m)}.dash.both{marker-start:url(#adsp-l05c-multiple-imputation-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="792"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 1장 · 결측값</text><text class="title" x="24" y="74">다중 대치법: 대치 → 분석 → 결합</text><text class="subtitle" x="24" y="104">한 번 채우고 끝내지 않고, 여러 번 채운 결과의 흩어짐까지 반영한다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="node" x="130" y="156" width="300" height="92" rx="6"/><text class="lab" x="280" y="180" text-anchor="middle">결측이 있는 원자료 (점수 5개)</text><rect class="cell" x="170" y="194" width="44" height="38"/><text class="mono" x="192" y="218" text-anchor="middle">12</text><rect class="cellh" x="214" y="194" width="44" height="38"/><text class="mono" x="236" y="218" text-anchor="middle">NA</text><rect class="cell" x="258" y="194" width="44" height="38"/><text class="mono" x="280" y="218" text-anchor="middle">15</text><rect class="cellh" x="302" y="194" width="44" height="38"/><text class="mono" x="324" y="218" text-anchor="middle">NA</text><rect class="cell" x="346" y="194" width="44" height="38"/><text class="mono" x="368" y="218" text-anchor="middle">9</text><path class="flow" d="M280 248 V270 H104 V300"/><path class="flow" d="M280 248 V270 H280 V300"/><path class="flow" d="M280 248 V270 H456 V300"/><text class="small" x="114" y="290">① 대치 m번</text><rect class="node" x="24" y="300" width="160" height="84" rx="6"/><text class="lab" x="104" y="324" text-anchor="middle">대치 1</text><rect class="cell" x="29" y="338" width="30" height="32"/><text class="monos" x="44" y="359" text-anchor="middle">12</text><rect class="cellf" x="59" y="338" width="30" height="32"/><text class="monos inv" x="74" y="359" text-anchor="middle">11</text><rect class="cell" x="89" y="338" width="30" height="32"/><text class="monos" x="104" y="359" text-anchor="middle">15</text><rect class="cellf" x="119" y="338" width="30" height="32"/><text class="monos inv" x="134" y="359" text-anchor="middle">13</text><rect class="cell" x="149" y="338" width="30" height="32"/><text class="monos" x="164" y="359" text-anchor="middle">9</text><rect class="node" x="200" y="300" width="160" height="84" rx="6"/><text class="lab" x="280" y="324" text-anchor="middle">대치 2</text><rect class="cell" x="205" y="338" width="30" height="32"/><text class="monos" x="220" y="359" text-anchor="middle">12</text><rect class="cellf" x="235" y="338" width="30" height="32"/><text class="monos inv" x="250" y="359" text-anchor="middle">14</text><rect class="cell" x="265" y="338" width="30" height="32"/><text class="monos" x="280" y="359" text-anchor="middle">15</text><rect class="cellf" x="295" y="338" width="30" height="32"/><text class="monos inv" x="310" y="359" text-anchor="middle">12</text><rect class="cell" x="325" y="338" width="30" height="32"/><text class="monos" x="340" y="359" text-anchor="middle">9</text><rect class="node" x="376" y="300" width="160" height="84" rx="6"/><text class="lab" x="456" y="324" text-anchor="middle">대치 m</text><rect class="cell" x="381" y="338" width="30" height="32"/><text class="monos" x="396" y="359" text-anchor="middle">12</text><rect class="cellf" x="411" y="338" width="30" height="32"/><text class="monos inv" x="426" y="359" text-anchor="middle">10</text><rect class="cell" x="441" y="338" width="30" height="32"/><text class="monos" x="456" y="359" text-anchor="middle">15</text><rect class="cellf" x="471" y="338" width="30" height="32"/><text class="monos inv" x="486" y="359" text-anchor="middle">11</text><rect class="cell" x="501" y="338" width="30" height="32"/><text class="monos" x="516" y="359" text-anchor="middle">9</text><path class="flow" d="M104 384 L104 430"/><path class="flow" d="M280 384 L280 430"/><path class="flow" d="M456 384 L456 430"/><text class="small" x="114" y="412">② 각각 분석</text><rect class="node" x="24" y="430" width="160" height="54" rx="6"/><text class="small" x="104" y="452" text-anchor="middle">평균 추정</text><text class="name" x="104" y="474" text-anchor="middle">12.0</text><rect class="node" x="200" y="430" width="160" height="54" rx="6"/><text class="small" x="280" y="452" text-anchor="middle">평균 추정</text><text class="name" x="280" y="474" text-anchor="middle">12.4</text><rect class="node" x="376" y="430" width="160" height="54" rx="6"/><text class="small" x="456" y="452" text-anchor="middle">평균 추정</text><text class="name" x="456" y="474" text-anchor="middle">11.4</text><path class="flow plain" d="M104 484 V508 H280 V540"/><path class="flow" d="M280 484 V508 H280 V540"/><path class="flow plain" d="M456 484 V508 H280 V540"/><path class="flow" d="M280 508 V540"/><text class="small" x="114" y="530">③ 결합</text><rect class="focal" x="70" y="540" width="420" height="92" rx="6"/><text class="lab inv" x="280" y="568" text-anchor="middle">결합 추정값 = (12.0 + 12.4 + 11.4) / 3 ≈ 11.9</text><text class="task inv" x="280" y="594" text-anchor="middle">대치마다 달라진 정도(대치 간 분산)를</text><text class="task inv" x="280" y="616" text-anchor="middle">표준오차에 더해 불확실성을 반영</text><rect class="outside" x="24" y="658" width="512" height="72" rx="6"/><text class="task" x="40" y="686">비교 · 평균 대치(1번만): NA 두 칸을 모두 12.0으로 채움</text><text class="task" x="40" y="710">→ 값이 평균에 몰려 분산·표준오차를 과소추정</text><path class="flow" d="M24 762 H54"/><text class="small" x="62" y="767">처리 흐름</text><rect class="cellh" x="138.32" y="754" width="22" height="16" rx="3"/><text class="small" x="168.32" y="767">결측(NA) 칸</text><rect class="focal" x="264.08" y="754" width="22" height="16" rx="3"/><text class="small" x="294.08" y="767">대치로 채운 값·결합</text><rect class="outside" x="433.03999999999996" y="754" width="22" height="16" rx="3"/><text class="small" x="463.03999999999996" y="767">대조 사례</text>
</svg>
