<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 778" width="560" height="778" role="img" aria-labelledby="adsp-l01a-seci-title adsp-l01a-seci-desc">
  <title id="adsp-l01a-seci-title">SECI 지식 전환 네 단계</title>
  <desc id="adsp-l01a-seci-desc">가로는 결과가 암묵지인지 형식지인지, 세로는 출발이 암묵지인지 형식지인지로 나눈 2×2 격자. 왼쪽 위 공통화(암묵지에서 암묵지), 오른쪽 위 표출화(암묵지에서 형식지), 오른쪽 아래 연결화(형식지에서 형식지), 왼쪽 아래 내면화(형식지에서 암묵지)이며, 화살표가 문서로, 합쳐서, 익혀서, 다시 전수 순서로 시계 방향 순환을 이룬다. 가운데에 암기 코드 공표연내가 있다.</desc>
  <defs><marker id="adsp-l01a-seci-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l01a-seci-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l01a-seci-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l01a-seci-m)}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.mid{text-anchor:middle}.end{text-anchor:end}</style>
  <rect class="bg" width="560" height="778"/><text class="tag" x="24" y="40">ADsP · 1과목 1장</text><text class="title" x="24" y="74">SECI — 지식이 도는 네 단계</text><text class="subtitle" x="24" y="104">출발(행)과 결과(열)가 암묵지인지 형식지인지로 단계가 정해진다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><text class="lab" x="160" y="172" text-anchor="middle">결과: 암묵지</text><text class="lab" x="440" y="172" text-anchor="middle">결과: 형식지</text><text class="lab" x="36" y="285" text-anchor="middle" transform="rotate(-90 36 280.0)">출발: 암묵지</text><text class="lab" x="36" y="541" text-anchor="middle" transform="rotate(-90 36 536.0)">출발: 형식지</text><rect class="node" x="64" y="190" width="192" height="180" rx="6"/><text class="small" x="160" y="220" text-anchor="middle">① Socialization</text><text class="big" x="160" y="252" text-anchor="middle">공통화</text><text class="lab" x="160" y="282" text-anchor="middle">암묵지 → 암묵지</text><line class="thin" x1="84" y1="298" x2="236" y2="298"/><text class="body" x="160" y="324" text-anchor="middle">함께 일하며</text><text class="body" x="160" y="348" text-anchor="middle">손 감각을 전수</text><rect class="node" x="344" y="190" width="192" height="180" rx="6"/><text class="small" x="440" y="220" text-anchor="middle">② Externalization</text><text class="big" x="440" y="252" text-anchor="middle">표출화</text><text class="lab" x="440" y="282" text-anchor="middle">암묵지 → 형식지</text><line class="thin" x1="364" y1="298" x2="516" y2="298"/><text class="body" x="440" y="324" text-anchor="middle">노하우를</text><text class="body" x="440" y="348" text-anchor="middle">매뉴얼로 적음</text><rect class="node" x="344" y="446" width="192" height="180" rx="6"/><text class="small" x="440" y="476" text-anchor="middle">③ Combination</text><text class="big" x="440" y="508" text-anchor="middle">연결화</text><text class="lab" x="440" y="538" text-anchor="middle">형식지 → 형식지</text><line class="thin" x1="364" y1="554" x2="516" y2="554"/><text class="body" x="440" y="580" text-anchor="middle">매뉴얼끼리 합쳐</text><text class="body" x="440" y="604" text-anchor="middle">본사 교재로 체계화</text><rect class="node" x="64" y="446" width="192" height="180" rx="6"/><text class="small" x="160" y="476" text-anchor="middle">④ Internalization</text><text class="big" x="160" y="508" text-anchor="middle">내면화</text><text class="lab" x="160" y="538" text-anchor="middle">형식지 → 암묵지</text><line class="thin" x1="84" y1="554" x2="236" y2="554"/><text class="body" x="160" y="580" text-anchor="middle">교재로 연습해</text><text class="body" x="160" y="604" text-anchor="middle">몸에 익힘</text><path class="flow" d="M256 280.0 H344"/><rect class="mask" x="272.75" y="269" width="54.5" height="22" rx="4"/><text class="lab" x="300" y="285" text-anchor="middle">문서로</text><path class="flow" d="M440.0 370 V446"/><rect class="mask" x="412.75" y="397" width="54.5" height="22" rx="4"/><text class="lab" x="440" y="413" text-anchor="middle">합쳐서</text><path class="flow" d="M344 536.0 H256"/><rect class="mask" x="272.75" y="525" width="54.5" height="22" rx="4"/><text class="lab" x="300" y="541" text-anchor="middle">익혀서</text><path class="flow" d="M160.0 446 V370"/><rect class="mask" x="123.975" y="397" width="72.05" height="22" rx="4"/><text class="lab" x="160" y="413" text-anchor="middle">다시 전수</text><rect class="focal" x="254" y="386" width="92" height="44" rx="6"/><text class="lab inv" x="300" y="414" text-anchor="middle">공표연내</text><rect class="deep" x="24" y="652" width="512" height="74" rx="6"/><text class="lab" x="40" y="682">헷갈림 주의 · 연결화 = 형식지 + 형식지 (교재에 추가)</text><text class="lab" x="40" y="708">내면화 = 형식지 → 개인의 몸 (교재를 보고 체득)</text><path class="flow" d="M24 756 H54"/><text class="small" x="62" y="761">다음 단계로 순환</text><rect class="focal" x="186.6" y="748" width="22" height="16" rx="3"/><text class="small" x="216.6" y="761">암기 코드</text><rect class="deep" x="296.65" y="748" width="22" height="16" rx="3"/><text class="small" x="326.65" y="761">시험 함정</text>
</svg>
