<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 914" role="img" aria-labelledby="mis-gl-1d-ipo-feedback-title mis-gl-1d-ipo-feedback-desc">
  <title id="mis-gl-1d-ipo-feedback-title">입력 · 처리 · 출력과 피드백</title>
  <desc id="mis-gl-1d-ipo-feedback-desc">조직 밖 환경의 고객, 공급업체, 경쟁자, 주주, 규제기관에서 원시 데이터가 들어와 입력, 처리, 출력을 거쳐 사람의 의사결정과 행동이 되고, 출력에서 입력으로 되돌아가는 피드백 점선 화살표가 있는 그림</desc>
  <defs><marker id="mis-gl-1d-ipo-feedback-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-1d-ipo-feedback-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-1d-ipo-feedback-a)}.flow.both{marker-start:url(#mis-gl-1d-ipo-feedback-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-1d-ipo-feedback-m)}.dash.both{marker-start:url(#mis-gl-1d-ipo-feedback-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="914"/>
  <text class="tag" x="24" y="40">1장 · 1-3 정보시스템의 기본 단위 ②</text><text class="title" x="24" y="74">입력 · 처리 · 출력과 피드백</text><text class="subtitle" x="24" y="104">세 기본 활동이 정보를 만들고, 피드백은 출력을 돌려 입력·처리를 평가하고</text><text class="subtitle" x="24" y="124">고친다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="zone" x="16" y="308" width="395" height="392.5" rx="8"/><text class="small" x="28" y="328">정보시스템 (IS)</text><rect class="outside" x="24" y="198" width="379" height="86" rx="6"/><text class="small" x="213.5" y="224" text-anchor="middle">Environment · 조직 밖 환경</text><text class="name" x="213.5" y="245" text-anchor="middle">고객 · 공급업체 · 경쟁자 · 주주 ·</text><text class="name" x="213.5" y="268" text-anchor="middle">규제기관</text><rect class="node" x="24" y="342" width="379" height="89.5" rx="6"/><text class="small" x="213.5" y="368" text-anchor="middle">Input</text><text class="name" x="213.5" y="389" text-anchor="middle">입력</text><text class="body" x="213.5" y="416" text-anchor="middle">원시 데이터를 포착</text><rect class="node" x="24" y="471.5" width="379" height="89.5" rx="6"/><text class="small" x="213.5" y="497.5" text-anchor="middle">Processing</text><text class="name" x="213.5" y="518.5" text-anchor="middle">처리</text><text class="body" x="213.5" y="545.5" text-anchor="middle">분류·계산·요약</text><rect class="focal" x="24" y="601" width="379" height="89.5" rx="6"/><text class="small inv" x="213.5" y="627" text-anchor="middle">Output</text><text class="name inv" x="213.5" y="648" text-anchor="middle">출력</text><text class="body inv" x="213.5" y="675" text-anchor="middle">필요한 사람·활동에 전달</text><rect class="node" x="24" y="748.5" width="379" height="71.5" rx="6"/><text class="name" x="213.5" y="776.5" text-anchor="middle">의사결정 · 행동</text><text class="body" x="213.5" y="803.5" text-anchor="middle">발주·조정·통제 (사람이 수행)</text><path class="flow" d="M213.5 284 L213.5 342"/><rect class="mask" x="168.2" y="302" width="90.6" height="22" rx="4"/><text class="lab" x="213.5" y="318" text-anchor="middle">원시 데이터</text><path class="flow" d="M213.5 431.5 L213.5 471.5"/><path class="flow" d="M213.5 561 L213.5 601"/><path class="flow" d="M213.5 690.5 L213.5 748.5"/><rect class="mask" x="175.4" y="708.5" width="76.1" height="22" rx="4"/><text class="lab" x="213.5" y="724.5" text-anchor="middle">정보 제공</text><path class="dash" d="M403 645.75 L437 645.75 L437 386.75 L403 386.75"/><rect class="mask" x="408.3" y="505.25" width="57.3" height="22" rx="4"/><text class="lab" x="437" y="521.25" text-anchor="middle">피드백</text><path class="flow" d="M24 844 H54"/><text class="small" x="62" y="849">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 844 H221.94875000000002"/><text class="small" x="229.94875000000002" y="849">영향·제약</text><rect class="focal" x="312.22900000000004" y="836" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="849">중심 개념</text><rect class="outside" x="422.34250000000003" y="836" width="22" height="16" rx="3"/><text class="small" x="452.34250000000003" y="849">조직 밖 주체</text><rect class="zone" x="24" y="862" width="22" height="16" rx="3"/><text class="small" x="54" y="875">범위·묶음</text>
</svg>
