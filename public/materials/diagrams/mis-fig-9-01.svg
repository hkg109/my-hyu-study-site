<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="mis-fig-9-01-title mis-fig-9-01-desc">
  <title id="mis-fig-9-01-title">Figure 9.1 How Enterprise Systems Work</title>
  <desc id="mis-fig-9-01-desc">통합 소프트웨어 모듈과 하나의 중앙 데이터베이스 — 한 부서에서 입력한 정보가 곧바로 다른 모든 부서에서 쓰인다</desc>
