<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 524" role="img" aria-labelledby="mis-gl-2h-time-space-title mis-gl-2h-time-space-desc">
  <title id="mis-gl-2h-time-space-title">시간 · 공간 협업 매트릭스</title>
  <desc id="mis-gl-2h-time-space-desc">가로축은 같은 시간(동기)과 다른 시간(비동기), 세로축은 같은 장소와 다른 장소로 나눈 2×2 표. 같은 시간·같은 장소는 대면 상호작용, 다른 시간·같은 장소는 연속 작업, 같은 시간·다른 장소는 원격 상호작용, 다른 시간·다른 장소는 커뮤니케이션과 조정이다</desc>
  <defs><marker id="mis-gl-2h-time-space-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-2h-time-space-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-2h-time-space-a)}.flow.both{marker-start:url(#mis-gl-2h-time-space-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-2h-time-space-m)}.dash.both{marker-start:url(#mis-gl-2h-time-space-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="524"/>
  <text class="tag" x="24" y="40">2장 · 2-5 협업과 소셜 비즈니스 ②</text><text class="title" x="24" y="74">시간 · 공간 협업 매트릭스</text><text class="subtitle" x="24" y="104">Figure 2.8 · “같은 시간인가?”와 “같은 장소인가?” 두 질문으로 협업</text><text class="subtitle" x="24" y="124">도구의 칸이 정해진다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><text class="lab" x="224" y="190" text-anchor="middle">같은 시간 · 동기</text><text class="lab" x="434" y="190" text-anchor="middle">다른 시간 · 비동기</text><rect class="zone" x="24" y="206" width="92" height="132" rx="8"/><text class="lab" x="70" y="268" text-anchor="middle">같은</text><text class="lab" x="70" y="288" text-anchor="middle">장소</text><rect class="node" x="122" y="206" width="204" height="132" rx="6"/><text class="small" x="224" y="253.25" text-anchor="middle">Face-to-face</text><text class="name" x="224" y="274.25" text-anchor="middle">대면 상호작용</text><text class="body" x="224" y="301.25" text-anchor="middle">회의실·의사결정실</text><rect class="node" x="332" y="206" width="204" height="132" rx="6"/><text class="small" x="434" y="243" text-anchor="middle">Continuous task</text><text class="name" x="434" y="264" text-anchor="middle">연속 작업</text><text class="body" x="434" y="291" text-anchor="middle">교대 인수인계 노트</text><text class="body" x="434" y="311.5" text-anchor="middle">팀 공용 공간</text><rect class="zone" x="24" y="348" width="92" height="132" rx="8"/><text class="lab" x="70" y="410" text-anchor="middle">다른</text><text class="lab" x="70" y="430" text-anchor="middle">장소</text><rect class="node" x="122" y="348" width="204" height="132" rx="6"/><text class="small" x="224" y="395.25" text-anchor="middle">Remote interactions</text><text class="name" x="224" y="416.25" text-anchor="middle">원격 상호작용</text><text class="body" x="224" y="443.25" text-anchor="middle">화상회의·메신저</text><rect class="node" x="332" y="348" width="204" height="132" rx="6"/><text class="small" x="434" y="376" text-anchor="middle">Communication +</text><text class="small" x="434" y="394" text-anchor="middle">coordination</text><text class="name" x="434" y="415" text-anchor="middle">커뮤니케이션·조정</text><text class="body" x="434" y="442" text-anchor="middle">이메일·공유 캘린더</text><text class="body" x="434" y="462.5" text-anchor="middle">워크플로·버전 관리</text>
</svg>
