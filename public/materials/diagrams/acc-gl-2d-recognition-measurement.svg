<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1254" role="img" aria-labelledby="acc-gl-2d-recognition-measurement-title acc-gl-2d-recognition-measurement-desc">
  <title id="acc-gl-2d-recognition-measurement-title">인식과 측정 · 언제, 얼마로 기록하나</title>
  <desc id="acc-gl-2d-recognition-measurement-desc">거래나 사건이 생기면 먼저 인식, 즉 재무제표 요소를 식별해 명칭과 금액으로 기록할지 판단한다. 인식 기준은 요소의 정의 충족, 목적적합하고 충실한 표현인 정보, 효익이 원가를 정당화할 것의 세 가지다. 수익과 비용은 현금기준이 아니라 발생기준으로 거래가 발생한 기간에 인식하고, 수익을 인식하면 관련 비용도 대응시킨다. 이어서 측정은 화폐금액을 결정하는 과정으로, 역사적 원가(단순, 저비용, 검증가능)와 공정가치(현행가치, 시의성, 비교가능성)가 대표적인 측정기준이다.</desc>
  <defs><marker id="acc-gl-2d-recognition-measurement-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-2d-recognition-measurement-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-2d-recognition-measurement-a)}.flow.both{marker-start:url(#acc-gl-2d-recognition-measurement-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-2d-recognition-measurement-m)}.dash.both{marker-start:url(#acc-gl-2d-recognition-measurement-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#b9b6ac;stroke-width:1.2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="1254"/>
  <text class="tag" x="24" y="40">2장 · 2-5 재무제표 요소의 인식과 측정</text><text class="title" x="24" y="74">인식과 측정 · 언제, 얼마로 기록하나</text><text class="subtitle" x="24" y="104">인식은 ‘장부에 올릴지·언제 올릴지’, 측정은 ‘얼마로 올릴지’를 정한다.</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="outside" x="24" y="166" width="512" height="60" rx="6"/><text class="name" x="280.0" y="192" text-anchor="middle">거래 · 사건 발생</text><text class="small" x="280.0" y="214" text-anchor="middle">예: 커피 외상 판매, 급여 발생, 임차료 미지급</text><path class="flow" d="M280 226 L280 276"/><rect class="mask" x="259.4" y="240" width="41.2" height="22" rx="4"/><text class="lab" x="280" y="256" text-anchor="middle">식별</text><rect class="focal" x="24" y="276" width="512" height="80" rx="6"/><text class="small inv" x="280.0" y="300" text-anchor="middle">Recognition</text><text class="name inv" x="280.0" y="324" text-anchor="middle">인식</text><text class="body inv" x="280.0" y="346" text-anchor="middle">재무제표 요소를 식별해 명칭과 화폐금액으로 기록</text><path class="flow" d="M280 356 L280 404"/><rect class="mask" x="241.9" y="369" width="76.2" height="22" rx="4"/><text class="lab" x="280" y="385" text-anchor="middle">기준 확인</text><rect class="zone" x="16" y="404" width="528" height="186" rx="8"/><text class="small" x="28" y="426">인식 기준 · 세 가지 모두 충족해야 인식</text><rect class="node" x="24" y="438" width="512" height="40" rx="6"/><text class="body" x="38" y="464">① 요소(자산·부채·자본·수익·비용)의 정의 충족</text><rect class="node" x="24" y="486" width="512" height="40" rx="6"/><text class="body" x="38" y="512">② 목적적합하고 충실한 표현을 지닌 정보</text><rect class="node" x="24" y="534" width="512" height="40" rx="6"/><text class="body" x="38" y="560">③ 정보의 효익 ≥ 제공·사용하는 원가</text><path class="flow" d="M280 590 L280 638"/><rect class="mask" x="255.5" y="603" width="49.0" height="22" rx="4"/><text class="lab" x="280" y="619" text-anchor="middle">언제?</text><rect class="zone" x="16" y="638" width="528" height="252" rx="8"/><text class="small" x="28" y="660">인식 시점 · 손익은 발생기준</text><rect class="deep" x="24" y="672" width="250" height="132" rx="6"/><text class="small" x="38" y="696">Accrual basis · 원칙</text><text class="name" x="38" y="720">발생기준</text><text class="body" x="38" y="748">거래·사건이 발생한</text><text class="body" x="38" y="770">기간에 인식</text><text class="small" x="38" y="794">→ 포괄손익계산서</text><rect class="outside" x="286" y="672" width="250" height="132" rx="6"/><text class="small" x="300" y="696">Cash basis · 비교 대상</text><text class="name" x="300" y="720">현금기준</text><text class="body" x="300" y="748">현금이 들어오고</text><text class="body" x="300" y="770">나간 기간에 기록</text><text class="small" x="300" y="794">→ 현금흐름표</text><rect class="node" x="24" y="814" width="512" height="64" rx="6"/><text class="name" x="38" y="840">수익비용대응</text><text class="body" x="38" y="866">수익을 인식하면 그에 대응하는 관련 비용도 인식</text><path class="flow" d="M280 890 L280 938"/><rect class="mask" x="248.7" y="903" width="62.6" height="22" rx="4"/><text class="lab" x="280" y="919" text-anchor="middle">얼마로?</text><rect class="focal" x="24" y="938" width="512" height="76" rx="6"/><text class="small inv" x="280.0" y="962" text-anchor="middle">Measurement</text><text class="name inv" x="280.0" y="986" text-anchor="middle">측정</text><text class="body inv" x="280.0" y="1008" text-anchor="middle">재무제표 요소의 화폐금액을 결정 (측정기준 선택)</text><path class="flow" d="M149 1014 L149 1062"/><rect class="mask" x="107.0" y="1027" width="84.0" height="22" rx="4"/><text class="lab" x="149" y="1043" text-anchor="middle">측정기준 ①</text><path class="flow" d="M411 1014 L411 1062"/><rect class="mask" x="369.0" y="1027" width="84.0" height="22" rx="4"/><text class="lab" x="411" y="1043" text-anchor="middle">측정기준 ②</text><rect class="node" x="24" y="1062" width="250" height="136" rx="6"/><text class="name" x="38" y="1088">역사적 원가</text><text class="small" x="38" y="1108">취득원가</text><text class="body" x="38" y="1134">자산: 취득에 지급한 대가</text><text class="body" x="38" y="1156">부채: 부담하며 받은 대가</text><text class="lab" x="38" y="1184">단순 · 저비용 · 검증가능</text><rect class="node" x="286" y="1062" width="250" height="136" rx="6"/><text class="name" x="300" y="1088">공정가치</text><text class="small" x="300" y="1108">시장가격 · 감정가격</text><text class="body" x="300" y="1134">정상거래에서 자산 매도 시</text><text class="body" x="300" y="1156">받을 / 부채 이전 시 줄 가격</text><text class="lab" x="300" y="1184">현행가치 · 시의성 · 비교가능성</text><path class="flow" d="M24 1228 H54"/><text class="small" x="62" y="1233">판단 순서</text><rect class="focal" x="146.2" y="1220" width="22" height="16" rx="3"/><text class="small" x="176.2" y="1233">핵심 과정</text><rect class="deep" x="260.4" y="1220" width="22" height="16" rx="3"/><text class="small" x="290.4" y="1233">원칙</text><rect class="outside" x="339.59999999999997" y="1220" width="22" height="16" rx="3"/><text class="small" x="369.59999999999997" y="1233">비교·외부</text>
</svg>
