<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 872" width="560" height="872" role="img" aria-labelledby="lm2-l09a-package-layers-title lm2-l09a-package-layers-desc">
  <title id="lm2-l09a-package-layers-title">패키지 관리 도구의 두 층</title>
  <desc id="lm2-l09a-package-layers-desc">레드햇 계열과 데비안 계열을 두 기둥으로 비교한 그림. 맨 위 인터넷 저장소에서 고수준 도구 yum·dnf와 apt-get·apt가 의존 패키지까지 받아 오고, 이를 저수준 도구 rpm과 dpkg에 넘겨 설치하며, rpm과 dpkg는 패키지 DB인 /var/lib/rpm과 /var/lib/dpkg에 기록한다. 아래 상자는 rpm -qa와 dpkg -l, rpm -ql과 dpkg -L, rpm -qf와 dpkg -S의 대응을 정리했다.</desc>
  <defs><marker id="lm2-l09a-package-layers-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l09a-package-layers-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l09a-package-layers-a)}.flow.both{marker-start:url(#lm2-l09a-package-layers-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l09a-package-layers-m)}.dash.both{marker-start:url(#lm2-l09a-package-layers-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="872"/>
  <text class="tag" x="24" y="40">리눅스마스터 2급 · 2과목 5장</text><text class="title" x="24" y="74">패키지 도구의 두 층</text><text class="subtitle" x="24" y="104">고수준 도구만 저장소에서 의존 패키지까지 받아 온다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="outside" x="24" y="150" width="512" height="70" rx="6"/><text class="name" x="280" y="178" text-anchor="middle">인터넷 저장소 (repository)</text><text class="small" x="148" y="205" text-anchor="middle">/etc/yum.repos.d/*.repo</text><text class="small" x="412" y="205" text-anchor="middle">/etc/apt/sources.list</text><rect class="zone" x="16" y="270" width="256" height="416" rx="6"/><rect class="zone" x="288" y="270" width="256" height="416" rx="6"/><text class="small" x="28" y="292">레드햇 계열 (.rpm)</text><text class="small" x="300" y="292">데비안 계열 (.deb)</text><path class="flow" d="M200 220 V306"/><rect class="focal" x="32" y="306" width="224" height="90" rx="6"/><text class="small inv" x="144.0" y="325.0" text-anchor="middle">고수준</text><text class="name inv" x="144.0" y="347.0" text-anchor="middle">yum · dnf</text><text class="small inv" x="144.0" y="367.0" text-anchor="middle">의존성 자동 해결</text><text class="small inv" x="144.0" y="387.0" text-anchor="middle">RHEL 8부터 dnf 기본</text><path class="flow" d="M144 396 V456"/><rect class="mask" x="97.5" y="416" width="93.0" height="22" rx="4"/><text class="lab" x="144" y="432" text-anchor="middle">내려받아 넘김</text><rect class="deep" x="32" y="456" width="224" height="90" rx="6"/><text class="small" x="144.0" y="475.0" text-anchor="middle">저수준</text><text class="name" x="144.0" y="497.0" text-anchor="middle">rpm</text><text class="small" x="144.0" y="517.0" text-anchor="middle">입력: *.rpm 파일</text><text class="small" x="144.0" y="537.0" text-anchor="middle">의존성은 검사만</text><path class="flow" d="M144 546 V606"/><rect class="mask" x="97.5" y="560" width="93.0" height="22" rx="4"/><text class="lab" x="144" y="576" text-anchor="middle">설치 + 기록</text><rect class="node" x="32" y="606" width="224" height="64" rx="6"/><text class="lab" x="144.0" y="633.0" text-anchor="middle">패키지 DB</text><text class="small" x="144.0" y="653.0" text-anchor="middle">/var/lib/rpm</text><path class="flow" d="M472 220 V306"/><rect class="focal" x="304" y="306" width="224" height="90" rx="6"/><text class="small inv" x="416.0" y="325.0" text-anchor="middle">고수준</text><text class="name inv" x="416.0" y="347.0" text-anchor="middle">apt-get · apt</text><text class="small inv" x="416.0" y="367.0" text-anchor="middle">의존성 자동 해결</text><text class="small inv" x="416.0" y="387.0" text-anchor="middle">apt-cache는 조회 전용</text><path class="flow" d="M416 396 V456"/><rect class="mask" x="369.5" y="416" width="93.0" height="22" rx="4"/><text class="lab" x="416" y="432" text-anchor="middle">내려받아 넘김</text><rect class="deep" x="304" y="456" width="224" height="90" rx="6"/><text class="small" x="416.0" y="475.0" text-anchor="middle">저수준</text><text class="name" x="416.0" y="497.0" text-anchor="middle">dpkg</text><text class="small" x="416.0" y="517.0" text-anchor="middle">입력: *.deb 파일</text><text class="small" x="416.0" y="537.0" text-anchor="middle">의존성은 검사만</text><path class="flow" d="M416 546 V606"/><rect class="mask" x="369.5" y="560" width="93.0" height="22" rx="4"/><text class="lab" x="416" y="576" text-anchor="middle">설치 + 기록</text><rect class="node" x="304" y="606" width="224" height="64" rx="6"/><text class="lab" x="416.0" y="633.0" text-anchor="middle">패키지 DB</text><text class="small" x="416.0" y="653.0" text-anchor="middle">/var/lib/dpkg</text><rect class="mask" x="148.0" y="234" width="104.0" height="22" rx="4"/><text class="lab" x="200" y="250" text-anchor="middle">의존 패키지까지</text><rect class="mask" x="420.0" y="234" width="104.0" height="22" rx="4"/><text class="lab" x="472" y="250" text-anchor="middle">의존 패키지까지</text><rect class="deep" x="24" y="708" width="512" height="112" rx="6"/><text class="lab" x="40" y="734">질의 대응 (rpm ↔ dpkg)</text><text class="body" x="40" y="760">설치 목록</text><text class="body" x="200" y="760">rpm -qa</text><text class="body" x="300" y="760" text-anchor="middle">↔</text><text class="body" x="330" y="760">dpkg -l</text><text class="body" x="40" y="784">파일 목록</text><text class="body" x="200" y="784">rpm -ql</text><text class="body" x="300" y="784" text-anchor="middle">↔</text><text class="body" x="330" y="784">dpkg -L</text><text class="body" x="40" y="808">파일 → 패키지</text><text class="body" x="200" y="808">rpm -qf</text><text class="body" x="300" y="808" text-anchor="middle">↔</text><text class="body" x="330" y="808">dpkg -S</text><path class="flow" d="M24 848 H54"/><text class="small" x="62" y="853">흐름</text><rect class="focal" x="108" y="840" width="22" height="16" rx="3"/><text class="small" x="138" y="853">고수준 도구</text><rect class="deep" x="232" y="840" width="22" height="16" rx="3"/><text class="small" x="262" y="853">저수준 도구</text><rect class="outside" x="356" y="840" width="22" height="16" rx="3"/><text class="small" x="386" y="853">시스템 밖</text>
</svg>
