<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 718" role="img" aria-labelledby="mis-gl-1-overview-title mis-gl-1-overview-desc">
  <title id="mis-gl-1-overview-title">IT 투자가 비즈니스 가치가 되기까지</title>
  <desc id="mis-gl-1-overview-desc">1장의 여섯 개념 묶음을 디지털 기업과 변화, 여섯 투자 목표, 정보시스템의 기본 단위, 세 차원과 IT 인프라, 정보 가치사슬과 보완 자산, 세 가지 접근법 순서로 지그재그로 연결한 개요도</desc>
  <defs><marker id="mis-gl-1-overview-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-1-overview-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-1-overview-a)}.flow.both{marker-start:url(#mis-gl-1-overview-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-1-overview-m)}.dash.both{marker-start:url(#mis-gl-1-overview-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="718"/>
  <text class="tag" x="24" y="40">1장 개요 · 개념 묶음 6개</text><text class="title" x="24" y="74">IT 투자가 비즈니스 가치가 되기까지</text><text class="subtitle" x="24" y="104">핵심 질문: 같은 정보기술을 사고도 왜 어떤 기업은 성과를 내고 어떤 기업은</text><text class="subtitle" x="24" y="124">실패할까?</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="224" height="110" rx="6"/><text class="small" x="136" y="198" text-anchor="middle">1-1</text><text class="name" x="136" y="219" text-anchor="middle">디지털 기업과 변화</text><text class="body" x="136" y="246" text-anchor="middle">세계화·새 사업모형이 디지털</text><text class="body" x="136" y="266.5" text-anchor="middle">전환을 압박</text><rect class="node" x="312" y="172" width="224" height="110" rx="6"/><text class="small" x="424" y="208.25" text-anchor="middle">1-2</text><text class="name" x="424" y="229.25" text-anchor="middle">IS 투자의 여섯 목표</text><text class="body" x="424" y="256.25" text-anchor="middle">운영 우수성부터 생존까지</text><rect class="node" x="312" y="340" width="224" height="133" rx="6"/><text class="small" x="424" y="366" text-anchor="middle">1-3</text><text class="name" x="424" y="387" text-anchor="middle">정보시스템의 기본</text><text class="name" x="424" y="410" text-anchor="middle">단위</text><text class="body" x="424" y="437" text-anchor="middle">IT ⊂ IS, 데이터 → 정보,</text><text class="body" x="424" y="457.5" text-anchor="middle">입력·처리·출력·피드백</text><rect class="node" x="24" y="340" width="224" height="133" rx="6"/><text class="small" x="136" y="387.75" text-anchor="middle">1-4</text><text class="name" x="136" y="408.75" text-anchor="middle">세 차원과 IT 인프라</text><text class="body" x="136" y="435.75" text-anchor="middle">조직 · 경영 · 기술</text><rect class="focal" x="24" y="531" width="224" height="112.5" rx="6"/><text class="small inv" x="136" y="557" text-anchor="middle">1-5</text><text class="name inv" x="136" y="578" text-anchor="middle">IT 투자가 가치가 되는</text><text class="name inv" x="136" y="601" text-anchor="middle">길</text><text class="body inv" x="136" y="628" text-anchor="middle">정보 가치사슬 + 보완 자산</text><rect class="node" x="312" y="531" width="224" height="112.5" rx="6"/><text class="small" x="424" y="568.5" text-anchor="middle">1-6</text><text class="name" x="424" y="589.5" text-anchor="middle">IS를 보는 세 접근법</text><text class="body" x="424" y="616.5" text-anchor="middle">기술적 · 행동적 · 사회기술적</text><path class="flow" d="M248 227 L312 227"/><rect class="mask" x="258.6" y="216" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="232" text-anchor="middle">목적</text><path class="flow" d="M424 282 L424 340"/><rect class="mask" x="402.6" y="300" width="42.9" height="22" rx="4"/><text class="lab" x="424" y="316" text-anchor="middle">수단</text><path class="flow" d="M312 406.5 L248 406.5"/><rect class="mask" x="258.6" y="395.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="411.5" text-anchor="middle">구성</text><path class="flow" d="M136 473 L136 531"/><rect class="mask" x="114.6" y="491" width="42.9" height="22" rx="4"/><text class="lab" x="136" y="507" text-anchor="middle">조건</text><path class="flow" d="M248 587.25 L312 587.25"/><rect class="mask" x="258.6" y="576.25" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="592.25" text-anchor="middle">설명</text><path class="flow" d="M24 673.5 H54"/><text class="small" x="62" y="678.5">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="665.5" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="678.5">중심 개념</text>
</svg>
