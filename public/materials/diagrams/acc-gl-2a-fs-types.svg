<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 950" role="img" aria-labelledby="acc-gl-2a-fs-types-title acc-gl-2a-fs-types-desc">
  <title id="acc-gl-2a-fs-types-title">재무제표의 종류 · 시점과 기간</title>
  <desc id="acc-gl-2a-fs-types-desc">재무제표는 기업의 재무상태, 경영성과, 현금흐름의 변동, 자본의 변동을 제시하는 회계보고서다. 일정 시점(결산일)의 재무상태를 보여 주는 재무상태표와, 일정 기간(회계기간)의 변동을 보여 주는 포괄손익계산서, 현금흐름표, 자본변동표로 나뉘고, 주석은 이들 항목을 보충 설명하는 재무제표의 일부다. 위쪽 시간선은 20×1년 1월 1일부터 12월 31일까지의 회계기간과 그 끝의 결산일을 표시한다.</desc>
  <defs><marker id="acc-gl-2a-fs-types-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="acc-gl-2a-fs-types-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#acc-gl-2a-fs-types-a)}.flow.both{marker-start:url(#acc-gl-2a-fs-types-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#acc-gl-2a-fs-types-m)}.dash.both{marker-start:url(#acc-gl-2a-fs-types-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.thin{stroke:#b9b6ac;stroke-width:1.2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="950"/>
  <text class="tag" x="24" y="40">2장 · 2-1 재무제표와 결산일·회계기간</text><text class="title" x="24" y="74">재무제표의 종류 · 시점과 기간</text><text class="subtitle" x="24" y="104">재무상태표만 ‘하루(결산일)’의 잔액이고, 나머지 셋은 ‘한 기간’의 변동이다.</text><text class="subtitle" x="24" y="124">주석도 재무제표의 일부다.</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><path class="flow" d="M40 214 L520 214"/><line class="line" x1="110" y1="204" x2="110" y2="224"/><text class="body" x="110" y="198" text-anchor="middle">20×1. 1. 1.</text><line class="line" x1="450" y1="204" x2="450" y2="224"/><text class="body" x="450" y="198" text-anchor="middle">20×1. 12. 31.</text><path class="line" d="M110 236 V246 H450 V236"/><rect class="mask" x="154.4" y="235" width="251.2" height="22" rx="4"/><text class="lab" x="280" y="251" text-anchor="middle">회계기간 (재무제표 작성 대상 기간)</text><circle cx="450" cy="214" r="6" fill="#1d1d1a"/><text class="lab" x="536" y="280" text-anchor="end">결산일 = 재무상태표일 (일정 시점)</text><rect class="focal" x="24" y="300" width="512" height="84" rx="6"/><text class="small inv" x="280.0" y="324" text-anchor="middle">Financial statements</text><text class="name inv" x="280.0" y="348" text-anchor="middle">재무제표</text><text class="body inv" x="280.0" y="372" text-anchor="middle">재무상태 · 경영성과 · 현금흐름의 변동 · 자본의 변동 제시</text><rect class="zone" x="16" y="436" width="196" height="300" rx="8"/><rect class="zone" x="228" y="436" width="316" height="300" rx="8"/><text class="small" x="28" y="458">일정 시점의 잔액</text><text class="small" x="240" y="458">일정 기간의 변동</text><path class="flow" d="M114 384 L114 436"/><rect class="mask" x="93.4" y="399" width="41.2" height="22" rx="4"/><text class="lab" x="114" y="415" text-anchor="middle">시점</text><path class="flow" d="M386 384 L386 436"/><rect class="mask" x="365.4" y="399" width="41.2" height="22" rx="4"/><text class="lab" x="386" y="415" text-anchor="middle">기간</text><rect class="deep" x="24" y="470" width="180" height="254" rx="6"/><text class="name" x="114.0" y="504" text-anchor="middle">재무상태표</text><text class="small" x="114.0" y="528" text-anchor="middle">statement of</text><text class="small" x="114.0" y="548" text-anchor="middle">financial position</text><text class="body" x="114.0" y="590" text-anchor="middle">기업의</text><text class="body" x="114.0" y="612" text-anchor="middle">재무상태</text><text class="lab" x="114.0" y="654" text-anchor="middle">자산 = 부채 + 자본</text><text class="small" x="114.0" y="684" text-anchor="middle">결산일 현재</text><rect class="node" x="236" y="470" width="300" height="78" rx="6"/><text class="name" x="386.0" y="496" text-anchor="middle">포괄손익계산서</text><text class="small" x="386.0" y="517" text-anchor="middle">statement of comprehensive income</text><text class="body" x="386.0" y="538" text-anchor="middle">기업의 경영성과 (수익 − 비용)</text><rect class="node" x="236" y="556" width="300" height="78" rx="6"/><text class="name" x="386.0" y="582" text-anchor="middle">현금흐름표</text><text class="small" x="386.0" y="603" text-anchor="middle">statement of cash flows</text><text class="body" x="386.0" y="624" text-anchor="middle">현금흐름의 변동</text><rect class="node" x="236" y="642" width="300" height="78" rx="6"/><text class="name" x="386.0" y="668" text-anchor="middle">자본변동표</text><text class="small" x="386.0" y="689" text-anchor="middle">statement of changes in equity</text><text class="body" x="386.0" y="710" text-anchor="middle">자본의 변동</text><rect class="node" x="24" y="790" width="512" height="86" rx="6"/><text class="small" x="280.0" y="814" text-anchor="middle">Notes · 재무제표의 일부</text><text class="name" x="280.0" y="838" text-anchor="middle">주석</text><text class="body" x="280.0" y="862" text-anchor="middle">회계정책 · 항목의 보충정보 · 우발부채 · 비재무적 공시</text><path class="dash" d="M114 790 L114 736"/><rect class="mask" x="75.9" y="752" width="76.2" height="22" rx="4"/><text class="lab" x="114" y="768" text-anchor="middle">보충 설명</text><path class="dash" d="M386 790 L386 736"/><rect class="mask" x="347.9" y="752" width="76.2" height="22" rx="4"/><text class="lab" x="386" y="768" text-anchor="middle">보충 설명</text><path class="flow" d="M24 912 H54"/><text class="small" x="62" y="917">구성·흐름</text><path class="dash" d="M146.2 912 H176.2"/><text class="small" x="184.2" y="917">보충 설명</text><rect class="focal" x="268.4" y="904" width="22" height="16" rx="3"/><text class="small" x="298.4" y="917">중심 개념</text><rect class="zone" x="382.59999999999997" y="904" width="22" height="16" rx="3"/><text class="small" x="412.59999999999997" y="917">묶음</text>
</svg>
