<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 712" role="img" aria-labelledby="lm2-l03a-permissions-title lm2-l03a-permissions-desc">
  <title id="lm2-l03a-permissions-title">권한 비트를 8진수로 읽기</title>
  <desc id="lm2-l03a-permissions-desc">ls -l의 rwxr-x--x를 종류 한 글자와 소유자·그룹·기타 세 칸으로 나누고, 각 칸의 r=4, w=2, x=1을 더해 7, 5, 1이 되어 chmod 751이 되는 과정을 보여 준다. 아래에는 네 자리 모드의 맨 앞 숫자인 특수 권한 SetUID 4(소유자 x 자리 s, passwd), SetGID 2(그룹 x 자리 s, 공유 디렉터리), Sticky 1(기타 x 자리 t, /tmp 1777)과 대문자 S·T는 x가 없다는 뜻이라는 규칙을 정리했다.</desc>
  <defs><marker id="lm2-l03a-permissions-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="lm2-l03a-permissions-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#lm2-l03a-permissions-a)}.flow.both{marker-start:url(#lm2-l03a-permissions-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#lm2-l03a-permissions-m)}.dash.both{marker-start:url(#lm2-l03a-permissions-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="712"/>
  <text class="tag" x="24" y="40">리눅스마스터 2급 · 1과목 3장</text><text class="title" x="24" y="74">권한 비트를 숫자로 읽기</text><text class="subtitle" x="24" y="104">ls -l의 10글자 = 종류 1 + 소유자 3 + 그룹 3 + 기타 3</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="deep" x="40" y="160" width="44" height="44" rx="4"/><text class="big" x="62" y="189" text-anchor="middle">-</text><rect class="node" x="88" y="160" width="44" height="44" rx="4"/><text class="big" x="110" y="189" text-anchor="middle">r</text><rect class="node" x="136" y="160" width="44" height="44" rx="4"/><text class="big" x="158" y="189" text-anchor="middle">w</text><rect class="node" x="184" y="160" width="44" height="44" rx="4"/><text class="big" x="206" y="189" text-anchor="middle">x</text><rect class="node" x="232" y="160" width="44" height="44" rx="4"/><text class="big" x="254" y="189" text-anchor="middle">r</text><rect class="node" x="280" y="160" width="44" height="44" rx="4"/><text class="big" x="302" y="189" text-anchor="middle">-</text><rect class="node" x="328" y="160" width="44" height="44" rx="4"/><text class="big" x="350" y="189" text-anchor="middle">x</text><rect class="node" x="376" y="160" width="44" height="44" rx="4"/><text class="big" x="398" y="189" text-anchor="middle">-</text><rect class="node" x="424" y="160" width="44" height="44" rx="4"/><text class="big" x="446" y="189" text-anchor="middle">-</text><rect class="node" x="472" y="160" width="44" height="44" rx="4"/><text class="big" x="494" y="189" text-anchor="middle">x</text><path class="org" d="M42 212 V220 H82 V212"/><text class="lab" x="62" y="240" text-anchor="middle">종류</text><path class="org" d="M90 212 V220 H226 V212"/><text class="lab" x="158" y="240" text-anchor="middle">소유자 u</text><path class="org" d="M234 212 V220 H370 V212"/><text class="lab" x="302" y="240" text-anchor="middle">그룹 g</text><path class="org" d="M378 212 V220 H514 V212"/><text class="lab" x="446" y="240" text-anchor="middle">기타 o</text><text class="small" x="24" y="286">가중치</text><text class="name" x="110" y="286" text-anchor="middle">4</text><text class="name" x="158" y="286" text-anchor="middle">2</text><text class="name" x="206" y="286" text-anchor="middle">1</text><text class="name" x="254" y="286" text-anchor="middle">4</text><text class="name" x="302" y="286" text-anchor="middle">2</text><text class="name" x="350" y="286" text-anchor="middle">1</text><text class="name" x="398" y="286" text-anchor="middle">4</text><text class="name" x="446" y="286" text-anchor="middle">2</text><text class="name" x="494" y="286" text-anchor="middle">1</text><rect class="zone" x="88" y="304" width="140" height="36" rx="6"/><text class="lab" x="158" y="328" text-anchor="middle">4+2+1 = 7</text><path class="flow" d="M158 340 V368"/><rect class="zone" x="232" y="304" width="140" height="36" rx="6"/><text class="lab" x="302" y="328" text-anchor="middle">4+0+1 = 5</text><path class="flow" d="M302 340 V368"/><rect class="zone" x="376" y="304" width="140" height="36" rx="6"/><text class="lab" x="446" y="328" text-anchor="middle">0+0+1 = 1</text><path class="flow" d="M446 340 V368"/><rect class="focal" x="88" y="370" width="428" height="46" rx="6"/><text class="name inv" x="302" y="401" text-anchor="middle">chmod 751  =  rwxr-x--x</text><text class="lab" x="24" y="446">네 자리일 때 맨 앞 숫자 = 특수 권한 (x 자리에 겹쳐 표시)</text><rect class="node" x="24" y="460" width="164" height="112" rx="6"/><text class="name" x="106" y="486" text-anchor="middle">4 SetUID</text><text class="task" x="106" y="512" text-anchor="middle">u의 x 자리 → s</text><text class="task" x="106" y="536" text-anchor="middle">실행 중 소유자 권한</text><text class="small" x="106" y="560" text-anchor="middle">/usr/bin/passwd 4755</text><rect class="node" x="198" y="460" width="164" height="112" rx="6"/><text class="name" x="280" y="486" text-anchor="middle">2 SetGID</text><text class="task" x="280" y="512" text-anchor="middle">g의 x 자리 → s</text><text class="task" x="280" y="536" text-anchor="middle">그룹 권한·그룹 상속</text><text class="small" x="280" y="560" text-anchor="middle">공유 디렉터리 2775</text><rect class="deep" x="372" y="460" width="164" height="112" rx="6"/><text class="name" x="454" y="486" text-anchor="middle">1 Sticky</text><text class="task" x="454" y="512" text-anchor="middle">o의 x 자리 → t</text><text class="task" x="454" y="536" text-anchor="middle">자기 파일만 삭제</text><text class="small" x="454" y="560" text-anchor="middle">/tmp 1777</text><rect class="zone" x="24" y="592" width="512" height="64" rx="6"/><text class="lab" x="40" y="618">소문자 s · t = 특수 권한 + x 있음</text><text class="task" x="40" y="642">대문자 S · T = 특수 권한만, x 없음 (예: 4644 → rwSr--r--)</text><rect class="focal" x="24" y="676" width="22" height="16" rx="3"/><text class="small" x="54" y="689">최종 숫자 모드</text><rect class="zone" x="161.64" y="676" width="22" height="16" rx="3"/><text class="small" x="191.64" y="689">칸별 합계</text><rect class="deep" x="267.96" y="676" width="22" height="16" rx="3"/><text class="small" x="297.96" y="689">파일 종류 · Sticky</text>
</svg>
