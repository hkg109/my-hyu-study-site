<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="mis-00-collaboration-matrix-title mis-00-collaboration-matrix-desc">
  <title id="mis-00-collaboration-matrix-title">시간과 장소로 구분하는 협업 방식</title>
  <desc id="mis-00-collaboration-matrix-desc">같은 시간과 다른 시간, 같은 장소와 원격의 두 축으로 네 가지 협업 상황을 구분한 행렬</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1}.axis{stroke:#65645e;stroke-width:1.5}.cell{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.soft{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1}.focal{fill:#1d1d1a;stroke:#1d1d1a}.tag{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.inverse{fill:#f7f6f2}.axis-label{font:650 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}</style>
  <rect class="bg" width="1280" height="760"/><text class="tag" x="64" y="52">LECTURE 00 · COLLABORATION MATRIX</text><text class="title" x="64" y="92">협업은 시간과 장소라는 두 축으로 구분한다</text><text class="subtitle" x="64" y="122">도구 이름보다 참여자가 언제, 어디서 함께 일하는지를 먼저 판단한다</text><line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
  <text class="axis-label" x="516" y="204" text-anchor="middle">Co-located · 같은 장소</text><text class="axis-label" x="932" y="204" text-anchor="middle">Remote · 다른 장소</text><text class="axis-label" x="172" y="344" text-anchor="middle">Synchronous</text><text class="sub" x="172" y="368" text-anchor="middle">같은 시간</text><text class="axis-label" x="172" y="544" text-anchor="middle">Asynchronous</text><text class="sub" x="172" y="568" text-anchor="middle">서로 다른 시간</text>
  <g><rect class="cell" x="308" y="232" width="416" height="200"/><text class="name" x="340" y="280">같은 회의실에서 실시간 협업</text><text class="sub" x="340" y="316">대면 회의 · 공동 워크숍</text><text class="sub" x="340" y="344">빠른 피드백, 높은 동시성</text></g>
  <g><rect class="focal" x="724" y="232" width="416" height="200"/><text class="name inverse" x="756" y="280">원격 실시간 협업</text><text class="sub inverse" x="756" y="316">화상회의 · 실시간 채팅</text><text class="sub inverse" x="756" y="344">거리 제약 없이 같은 시간에 참여</text></g>
  <g><rect class="soft" x="308" y="432" width="416" height="200"/><text class="name" x="340" y="480">같은 장소의 비동기 협업</text><text class="sub" x="340" y="516">교대 근무 노트 · 공유 게시판</text><text class="sub" x="340" y="544">같은 공간을 다른 시간에 사용</text></g>
  <g><rect class="cell" x="724" y="432" width="416" height="200"/><text class="name" x="756" y="480">원격 비동기 협업</text><text class="sub" x="756" y="516">E-mail · 문서 댓글 · 프로젝트 보드</text><text class="sub" x="756" y="544">시간과 장소가 모두 달라도 참여</text></g>
  <line class="axis" x1="308" y1="664" x2="1140" y2="664"/><text class="sub" x="308" y="696">Intranet = 직원 내부</text><text class="sub" x="1140" y="696" text-anchor="end">Extranet = 허가된 외부 파트너까지 경계 확장</text>
</svg>
