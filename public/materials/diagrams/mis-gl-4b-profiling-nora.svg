<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 692" role="img" aria-labelledby="mis-gl-4b-profiling-nora-title mis-gl-4b-profiling-nora-desc">
  <title id="mis-gl-4b-profiling-nora-title">Profiling vs NORA</title>
  <desc id="mis-gl-4b-profiling-nora-desc">여러 데이터 출처가 결합되는 공통 단계 뒤에, 왼쪽 프로파일링은 한 개인의 상세 파일(dossier)을 만들어 광고·보험·신용 판단에 쓰고, 오른쪽 NORA는 이름 표준화·대조·병합으로 숨은 관계를 찾아 경고를 내는 비교 그림</desc>
  <defs><marker id="mis-gl-4b-profiling-nora-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-4b-profiling-nora-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-4b-profiling-nora-a)}.flow.both{marker-start:url(#mis-gl-4b-profiling-nora-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-4b-profiling-nora-m)}.dash.both{marker-start:url(#mis-gl-4b-profiling-nora-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="692"/>
  <text class="tag" x="24" y="40">4장 · 4-2 데이터 분석 기법과 감시</text><text class="title" x="24" y="74">Profiling vs NORA</text><text class="subtitle" x="24" y="104">둘 다 여러 출처를 결합한다. 프로파일링은 한 사람을 깊게, NORA는 사람들</text><text class="subtitle" x="24" y="124">사이의 숨은 관계를 본다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="node" x="24" y="172" width="512" height="71.5" rx="6"/><text class="name" x="280" y="200" text-anchor="middle">여러 출처의 데이터</text><text class="body" x="280" y="227" text-anchor="middle">구매·위치·온라인 행동·전화·인사·범죄 기록</text><rect class="node" x="24" y="301.5" width="249" height="89.5" rx="6"/><text class="small" x="148.5" y="327.5" text-anchor="middle">Profiling</text><text class="name" x="148.5" y="348.5" text-anchor="middle">한 사람을 깊게</text><text class="body" x="148.5" y="375.5" text-anchor="middle">상세 파일(dossier)</text><rect class="node" x="287" y="301.5" width="249" height="89.5" rx="6"/><text class="small" x="411.5" y="327.5" text-anchor="middle">NORA</text><text class="name" x="411.5" y="348.5" text-anchor="middle">관계를 넓게</text><text class="body" x="411.5" y="375.5" text-anchor="middle">표준화 → 대조 → 병합</text><rect class="node" x="24" y="449" width="249" height="71.5" rx="6"/><text class="name" x="148.5" y="477" text-anchor="middle">맞춤 광고·위험 평가</text><text class="body" x="148.5" y="504" text-anchor="middle">데이터 브로커가 판매</text><rect class="focal" x="287" y="449" width="249" height="71.5" rx="6"/><text class="name inv" x="411.5" y="477" text-anchor="middle">NORA 경고</text><text class="body inv" x="411.5" y="504" text-anchor="middle">카지노·항공 보안</text><rect class="node" x="24" y="578.5" width="512" height="45" rx="6"/><text class="name" x="280" y="606.5" text-anchor="middle">무고한 사람의 기록도 함께 분석된다</text><path class="flow" d="M148.5 243.5 L148.5 301.5"/><rect class="mask" x="127.1" y="261.5" width="42.9" height="22" rx="4"/><text class="lab" x="148.5" y="277.5" text-anchor="middle">결합</text><path class="flow" d="M411.5 243.5 L411.5 301.5"/><rect class="mask" x="390.1" y="261.5" width="42.9" height="22" rx="4"/><text class="lab" x="411.5" y="277.5" text-anchor="middle">결합</text><path class="flow" d="M148.5 391 L148.5 449"/><rect class="mask" x="127.1" y="409" width="42.9" height="22" rx="4"/><text class="lab" x="148.5" y="425" text-anchor="middle">사용</text><path class="flow" d="M411.5 391 L411.5 449"/><rect class="mask" x="390.1" y="409" width="42.9" height="22" rx="4"/><text class="lab" x="411.5" y="425" text-anchor="middle">사용</text><path class="dash" d="M280 520.5 L280 578.5"/><rect class="mask" x="220.3" y="538.5" width="119.4" height="22" rx="4"/><text class="lab" x="280" y="554.5" text-anchor="middle">프라이버시 쟁점</text><path class="flow" d="M24 647.5 H54"/><text class="small" x="62" y="652.5">흐름·데이터 제공</text><path class="dash" d="M191.94875000000002 647.5 H221.94875000000002"/><text class="small" x="229.94875000000002" y="652.5">영향·제약</text><rect class="focal" x="312.22900000000004" y="639.5" width="22" height="16" rx="3"/><text class="small" x="342.22900000000004" y="652.5">중심 개념</text>
</svg>
