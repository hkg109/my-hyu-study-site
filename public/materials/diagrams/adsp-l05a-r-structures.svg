<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1040" role="img" aria-labelledby="adsp-l05a-r-structures-title adsp-l05a-r-structures-desc">
  <title id="adsp-l05a-r-structures-title">R의 자료 구조 다섯 가지</title>
  <desc id="adsp-l05a-r-structures-desc">벡터는 1차원으로 한 가지 형만 담고 인덱스가 1부터 시작한다. 행렬은 2차원으로 matrix(1:6, nrow=2)가 열 방향으로 1 2 / 3 4 / 5 6을 채운다. 배열은 같은 크기 행렬을 층으로 겹친 3차원 이상 구조다. 리스트는 숫자, 문자 벡터, 데이터 프레임처럼 서로 다른 형과 구조를 원소로 담는다. 데이터 프레임은 2차원 표로 name은 문자형, score는 숫자형, pass는 논리형처럼 열마다 형이 다를 수 있다.</desc>
  <defs><marker id="adsp-l05a-r-structures-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l05a-r-structures-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l05a-r-structures-a)}.flow.both{marker-start:url(#adsp-l05a-r-structures-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l05a-r-structures-m)}.dash.both{marker-start:url(#adsp-l05a-r-structures-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="1040"/>
  <text class="tag" x="24" y="40">ADsP · 3과목 1장 · R 기초</text><text class="title" x="24" y="74">R의 자료 구조 다섯 가지</text><text class="subtitle" x="24" y="104">차원 수와 "한 구조 안에 다른 자료형이 섞일 수 있는가"로 구분한다</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="deep" x="24" y="150" width="150" height="124" rx="6"/><text class="name" x="38" y="178">벡터</text><text class="small" x="38" y="198">vector</text><text class="lab" x="38" y="222">1차원</text><text class="task" x="38" y="242">한 가지 형만</text><text class="monos" x="38" y="264">c()</text><text class="small" x="222" y="186" text-anchor="middle">[1]</text><rect class="cell" x="196" y="196" width="52" height="38"/><text class="mono" x="222" y="220" text-anchor="middle">10</text><text class="small" x="274" y="186" text-anchor="middle">[2]</text><rect class="cell" x="248" y="196" width="52" height="38"/><text class="mono" x="274" y="220" text-anchor="middle">20</text><text class="small" x="326" y="186" text-anchor="middle">[3]</text><rect class="cell" x="300" y="196" width="52" height="38"/><text class="mono" x="326" y="220" text-anchor="middle">30</text><text class="small" x="378" y="186" text-anchor="middle">[4]</text><rect class="cell" x="352" y="196" width="52" height="38"/><text class="mono" x="378" y="220" text-anchor="middle">40</text><text class="small" x="430" y="186" text-anchor="middle">[5]</text><rect class="cell" x="404" y="196" width="52" height="38"/><text class="mono" x="430" y="220" text-anchor="middle">50</text><text class="task" x="196" y="260">인덱스는 1부터 · x[-2]는 둘째를 제외</text><rect class="deep" x="24" y="290" width="150" height="172" rx="6"/><text class="name" x="38" y="318">행렬</text><text class="small" x="38" y="338">matrix</text><text class="lab" x="38" y="362">2차원</text><text class="task" x="38" y="382">한 가지 형만</text><text class="monos" x="38" y="404">matrix()</text><text class="monos" x="196" y="312">m &lt;- matrix(1:6, nrow=2)</text><text class="small" x="250" y="342" text-anchor="middle">[,1]</text><text class="small" x="302" y="342" text-anchor="middle">[,2]</text><text class="small" x="354" y="342" text-anchor="middle">[,3]</text><text class="small" x="204" y="374" text-anchor="middle">[1,]</text><text class="small" x="204" y="412" text-anchor="middle">[2,]</text><rect class="cellh" x="224" y="350" width="52" height="38"/><text class="mono" x="250" y="374" text-anchor="middle">1</text><rect class="cell" x="276" y="350" width="52" height="38"/><text class="mono" x="302" y="374" text-anchor="middle">3</text><rect class="cell" x="328" y="350" width="52" height="38"/><text class="mono" x="354" y="374" text-anchor="middle">5</text><rect class="cellh" x="224" y="388" width="52" height="38"/><text class="mono" x="250" y="412" text-anchor="middle">2</text><rect class="cell" x="276" y="388" width="52" height="38"/><text class="mono" x="302" y="412" text-anchor="middle">4</text><rect class="cell" x="328" y="388" width="52" height="38"/><text class="mono" x="354" y="412" text-anchor="middle">6</text><path class="dash" d="M402 356 L402 422"/><text class="lab" x="416" y="372">열 방향으로</text><text class="lab" x="416" y="392">먼저 채움</text><text class="small" x="416" y="414">byrow=TRUE면 행</text><text class="monos" x="196" y="448">as.vector(m) → 1 2 3 4 5 6</text><rect class="deep" x="24" y="478" width="150" height="130" rx="6"/><text class="name" x="38" y="506">배열</text><text class="small" x="38" y="526">array</text><text class="lab" x="38" y="550">3차원 이상</text><text class="task" x="38" y="570">한 가지 형만</text><text class="monos" x="38" y="592">array()</text><rect class="cellh" x="238" y="500" width="46" height="34"/><rect class="cellh" x="284" y="500" width="46" height="34"/><rect class="cellh" x="238" y="534" width="46" height="34"/><rect class="cellh" x="284" y="534" width="46" height="34"/><rect class="cell" x="216" y="522" width="46" height="34"/><rect class="cell" x="262" y="522" width="46" height="34"/><rect class="cell" x="216" y="556" width="46" height="34"/><rect class="cell" x="262" y="556" width="46" height="34"/><text class="mono" x="239" y="544" text-anchor="middle">1</text><text class="mono" x="285" y="544" text-anchor="middle">3</text><text class="mono" x="239" y="578" text-anchor="middle">2</text><text class="mono" x="285" y="578" text-anchor="middle">4</text><text class="lab" x="356" y="530">행 × 열 × 층</text><text class="task" x="356" y="552">같은 크기 행렬을 겹친 것</text><text class="monos" x="356" y="574">(, , 1) · (, , 2) …</text><rect class="deep" x="24" y="624" width="150" height="150" rx="6"/><text class="name" x="38" y="652">리스트</text><text class="small" x="38" y="672">list</text><text class="lab" x="38" y="696">1차원</text><text class="task" x="38" y="716">원소마다 다른 형</text><text class="monos" x="38" y="738">list()</text><rect class="zone" x="196" y="638" width="340" height="122" rx="6"/><text class="monos" x="208" y="669">[[1]]</text><rect class="cell" x="266" y="648" width="258" height="30" rx="4"/><text class="small" x="278" y="668">num</text><text class="monos" x="512" y="668" text-anchor="end">3.14</text><text class="monos" x="208" y="705">[[2]]</text><rect class="cell" x="266" y="684" width="258" height="30" rx="4"/><text class="small" x="278" y="704">chr</text><text class="monos" x="512" y="704" text-anchor="end">"a" "b"</text><text class="monos" x="208" y="741">[[3]]</text><rect class="cell" x="266" y="720" width="258" height="30" rx="4"/><text class="small" x="278" y="740">data.frame</text><text class="monos" x="512" y="740" text-anchor="end">df</text><rect class="deep" x="24" y="790" width="150" height="160" rx="6"/><text class="name" x="38" y="818">데이터 프레임</text><text class="small" x="38" y="838">data.frame</text><text class="lab" x="38" y="862">2차원</text><text class="task" x="38" y="882">열마다 다른 형</text><text class="monos" x="38" y="904">data.frame()</text><rect class="cellh" x="192" y="808" width="100" height="30"/><text class="lab" x="242" y="828" text-anchor="middle">name</text><rect class="cellh" x="292" y="808" width="90" height="30"/><text class="lab" x="337" y="828" text-anchor="middle">score</text><rect class="cellh" x="382" y="808" width="100" height="30"/><text class="lab" x="432" y="828" text-anchor="middle">pass</text><rect class="cell" x="192" y="838" width="100" height="30"/><text class="monos" x="242" y="858" text-anchor="middle">민수</text><rect class="cell" x="292" y="838" width="90" height="30"/><text class="monos" x="337" y="858" text-anchor="middle">80</text><rect class="cell" x="382" y="838" width="100" height="30"/><text class="monos" x="432" y="858" text-anchor="middle">TRUE</text><rect class="cell" x="192" y="868" width="100" height="30"/><text class="monos" x="242" y="888" text-anchor="middle">지아</text><rect class="cell" x="292" y="868" width="90" height="30"/><text class="monos" x="337" y="888" text-anchor="middle">55</text><rect class="cell" x="382" y="868" width="100" height="30"/><text class="monos" x="432" y="888" text-anchor="middle">FALSE</text><rect class="cell" x="192" y="898" width="100" height="30"/><text class="monos" x="242" y="918" text-anchor="middle">현우</text><rect class="cell" x="292" y="898" width="90" height="30"/><text class="monos" x="337" y="918" text-anchor="middle">72</text><rect class="cell" x="382" y="898" width="100" height="30"/><text class="monos" x="432" y="918" text-anchor="middle">TRUE</text><text class="small" x="242" y="946" text-anchor="middle">&lt;chr&gt;</text><text class="small" x="337" y="946" text-anchor="middle">&lt;num&gt;</text><text class="small" x="432" y="946" text-anchor="middle">&lt;logi&gt;</text><text class="task" x="490" y="848">열 안은</text><text class="task" x="490" y="868">같은 형</text><text class="small" x="24" y="980">벡터·행렬·배열에 형이 섞이면 문자 &gt; 숫자 &gt; 논리 순으로 통일된다.</text><rect class="deep" x="24" y="1002" width="22" height="16" rx="3"/><text class="small" x="54" y="1015">구조 이름·제약</text><path class="dash" d="M161.64 1010 H191.64"/><text class="small" x="199.64" y="1015">채우는 방향</text><rect class="zone" x="289.46" y="1002" width="22" height="16" rx="3"/><text class="small" x="319.46" y="1015">리스트 묶음</text>
</svg>
