<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 667" role="img" aria-labelledby="mis-gl-9a-supply-chain-information-title mis-gl-9a-supply-chain-information-desc">
  <title id="mis-gl-9a-supply-chain-information-title">정보의 질이 재고를 정한다</title>
  <desc id="mis-gl-9a-supply-chain-information-desc">공급망 정보의 질에 따라 세 가지 결과가 나온다. 완벽한 정보는 부품이 필요한 순간에 도착하는 JIT를, 불확실한 정보는 유연성 부족에 대비한 안전 재고를, 단계마다 왜곡되는 정보는 수요 변동이 상류로 갈수록 커지는 채찍 효과를 만든다. 세 경우 모두 공급망 구성원이 정확하고 최신인 정보를 공유하게 하는 SCM 시스템으로 개선되는 흐름 그림</desc>
  <defs><marker id="mis-gl-9a-supply-chain-information-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="mis-gl-9a-supply-chain-information-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-gl-9a-supply-chain-information-a)}.flow.both{marker-start:url(#mis-gl-9a-supply-chain-information-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#mis-gl-9a-supply-chain-information-m)}.dash.both{marker-start:url(#mis-gl-9a-supply-chain-information-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}</style>
  <rect class="bg" width="560" height="667"/>
  <text class="tag" x="24" y="40">9장 · 9-2 공급망과 SCM</text><text class="title" x="24" y="74">정보의 질이 재고를 정한다</text><text class="subtitle" x="24" y="104">완벽한 정보면 JIT, 불확실하면 안전 재고, 왜곡되면 채찍 효과 — 해결책은</text><text class="subtitle" x="24" y="124">정확하고 최신인 정보의 공유다</text><line class="rule" x1="24" y1="150" x2="536" y2="150"/><rect class="focal" x="24" y="172" width="512" height="89.5" rx="6"/><text class="small inv" x="280" y="198" text-anchor="middle">Supply chain information</text><text class="name inv" x="280" y="219" text-anchor="middle">공급망 정보의 질</text><text class="body inv" x="280" y="246" text-anchor="middle">비효율은 운영비의 최대 25%를 낭비</text><rect class="node" x="24" y="319.5" width="161" height="110" rx="6"/><text class="small" x="104.5" y="345.5" text-anchor="middle">완벽</text><text class="name" x="104.5" y="366.5" text-anchor="middle">JIT</text><text class="body" x="104.5" y="393.5" text-anchor="middle">필요한 순간 도착</text><text class="body" x="104.5" y="414" text-anchor="middle">재고 ↓</text><rect class="node" x="199" y="319.5" width="161" height="110" rx="6"/><text class="small" x="279.5" y="345.5" text-anchor="middle">불확실</text><text class="name" x="279.5" y="366.5" text-anchor="middle">안전 재고</text><text class="body" x="279.5" y="393.5" text-anchor="middle">여유분 보유</text><text class="body" x="279.5" y="414" text-anchor="middle">돈·공간 묶임</text><rect class="node" x="374" y="319.5" width="161" height="110" rx="6"/><text class="small" x="454.5" y="345.5" text-anchor="middle">왜곡</text><text class="name" x="454.5" y="366.5" text-anchor="middle">채찍 효과</text><text class="body" x="454.5" y="393.5" text-anchor="middle">상류로 갈수록</text><text class="body" x="454.5" y="414" text-anchor="middle">변동 증폭</text><rect class="node" x="24" y="509.5" width="512" height="89.5" rx="6"/><text class="small" x="280" y="535.5" text-anchor="middle">SCM systems</text><text class="name" x="280" y="556.5" text-anchor="middle">정확·최신 정보를 모두가 공유</text><text class="body" x="280" y="583.5" text-anchor="middle">계획 시스템 + 실행 시스템, 풀 기반·동시 공급망</text><path class="line" d="M280 261.5 V293.4"/><path class="line" d="M104.5 293.4 H454.5"/><path class="flow" d="M104.5 293.4 L104.5 319.5"/><path class="flow" d="M279.5 293.4 L279.5 319.5"/><path class="flow" d="M454.5 293.4 L454.5 319.5"/><rect class="mask" x="218.1" y="266.45" width="123.8" height="22" rx="4"/><text class="lab" x="280" y="282.45" text-anchor="middle">정보 상태에 따라</text><path class="line" d="M104.5 429.5 V457.5"/><path class="line" d="M279.5 429.5 V457.5"/><path class="line" d="M454.5 429.5 V457.5"/><path class="line" d="M104.5 457.5 H454.5"/><path class="flow" d="M280 457.5 L280 509.5"/><rect class="mask" x="258.6" y="446.5" width="42.9" height="22" rx="4"/><text class="lab" x="280" y="462.5" text-anchor="middle">해결</text><path class="flow" d="M24 623 H54"/><text class="small" x="62" y="628">흐름·데이터 제공</text><rect class="focal" x="191.94875000000002" y="615" width="22" height="16" rx="3"/><text class="small" x="221.94875000000002" y="628">중심 개념</text>
</svg>
