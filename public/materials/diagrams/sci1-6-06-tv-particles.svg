<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 576" width="560" height="576" role="img" aria-labelledby="sci1-6-06-tv-particles-title sci1-6-06-tv-particles-desc">
  <title id="sci1-6-06-tv-particles-title">압력이 일정할 때 온도와 부피</title>
  <desc id="sci1-6-06-tv-particles-desc">추 1개를 올린 피스톤 원통 세 개를 그렸다. 가운데가 처음 상태이고, 왼쪽은 온도를 낮춰 입자의 운동 화살표가 짧고 기체 부피가 줄었다. 오른쪽은 온도를 높여 화살표가 길고 피스톤이 위로 올라가 부피가 늘었다. 아래 표는 온도가 높아질수록 입자 운동 속도가 빨라지고 벽에 부딪히는 세기가 강해지며 입자 사이 거리가 멀어진다고 정리한다. 세 원통 모두 추는 1개, 입자는 7개로 같다.</desc>
