<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 532" width="560" height="532" role="img" aria-labelledby="sci1-6-11-change-table-title sci1-6-11-change-table-desc">
  <title id="sci1-6-11-change-table-title">변하는 것과 변하지 않는 것</title>
  <desc id="sci1-6-11-change-table-desc">표의 두 열은 온도가 일정할 때 압력을 높인 경우와 압력이 일정할 때 온도를 높인 경우이다. 입자의 수, 크기, 질량은 두 경우 모두 변하지 않으며 진한 칸으로 표시했다. 입자 운동 속도는 압력만 높일 때 변하지 않고 온도를 높이면 빨라진다. 입자 사이 거리는 압력을 높이면 가까워지고 온도를 높이면 멀어진다. 벽과의 충돌은 압력을 높이면 횟수가 증가하고 온도를 높이면 세기가 강해진다. 기체의 부피는 압력을 높이면 감소하고 온도를 높이면 증가한다.</desc>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.water{fill:#e9e6dc;stroke:#b9b6ac;stroke-width:1.2}.solid{fill:#e4e1d8;stroke:#1d1d1a;stroke-width:1.6}.line{stroke:#1d1d1a;stroke-width:1.5;fill:none}.thin{stroke:#b9b6ac;stroke-width:1;fill:none}.dashl{stroke:#65645e;stroke-width:1.5;fill:none;stroke-dasharray:6 4}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 21px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.inv{fill:#f7f6f2}.mut{fill:#65645e}.ptc{fill:#1d1d1a}.ptcl{fill:#65645e}</style>
  <rect class="bg" width="560" height="532"/><text class="tag" x="24.0" y="40.0">중1 과학 · VI. 기체의 성질</text><text class="title" x="24.0" y="74.0">변하는 것과 변하지 않는 것</text><text class="subtitle" x="24.0" y="104.0">입자 수·크기·질량은 언제나 그대로이다</text><line class="rule" x1="24.0" y1="130.0" x2="536.0" y2="130.0"/><rect class="focal" x="24.0" y="150.0" width="512.0" height="52.0" rx="4"/><text class="lab inv" x="36.0" y="181.0">비교 항목</text><text class="lab inv" x="257.0" y="172.0" text-anchor="middle">압력↑ (온도 일정)</text><text class="small inv" x="257.0" y="192.0" text-anchor="middle">주사기를 누를 때</text><text class="lab inv" x="443.0" y="172.0" text-anchor="middle">온도↑ (압력 일정)</text><text class="small inv" x="443.0" y="192.0" text-anchor="middle">기체를 데울 때</text><rect class="deep" x="24.0" y="206.0" width="512.0" height="36.0" rx="4"/><text class="lab" x="36.0" y="229.0">입자의 수</text><text class="small" x="257.0" y="229.0" text-anchor="middle">변하지 않음</text><text class="small" x="443.0" y="229.0" text-anchor="middle">변하지 않음</text><rect class="deep" x="24.0" y="246.0" width="512.0" height="36.0" rx="4"/><text class="lab" x="36.0" y="269.0">입자의 크기</text><text class="small" x="257.0" y="269.0" text-anchor="middle">변하지 않음</text><text class="small" x="443.0" y="269.0" text-anchor="middle">변하지 않음</text><rect class="deep" x="24.0" y="286.0" width="512.0" height="36.0" rx="4"/><text class="lab" x="36.0" y="309.0">입자의 질량</text><text class="small" x="257.0" y="309.0" text-anchor="middle">변하지 않음</text><text class="small" x="443.0" y="309.0" text-anchor="middle">변하지 않음</text><rect class="zone" x="24.0" y="326.0" width="512.0" height="36.0" rx="4"/><text class="lab" x="36.0" y="349.0">입자 운동 속도</text><text class="lab" x="257.0" y="349.0" text-anchor="middle">변하지 않음</text><text class="lab" x="443.0" y="349.0" text-anchor="middle">빨라짐</text><rect class="zone" x="24.0" y="366.0" width="512.0" height="36.0" rx="4"/><text class="lab" x="36.0" y="389.0">입자 사이 거리</text><text class="lab" x="257.0" y="389.0" text-anchor="middle">가까워짐</text><text class="lab" x="443.0" y="389.0" text-anchor="middle">멀어짐</text><rect class="zone" x="24.0" y="406.0" width="512.0" height="36.0" rx="4"/><text class="lab" x="36.0" y="429.0">벽과의 충돌</text><text class="lab" x="257.0" y="429.0" text-anchor="middle">횟수 증가</text><text class="lab" x="443.0" y="429.0" text-anchor="middle">세기 강해짐</text><rect class="node" x="24.0" y="446.0" width="512.0" height="36.0" rx="4"/><text class="lab" x="36.0" y="469.0">기체의 부피</text><text class="lab" x="257.0" y="469.0" text-anchor="middle">감소</text><text class="lab" x="443.0" y="469.0" text-anchor="middle">증가</text><line class="thin" x1="164.0" y1="206.0" x2="164.0" y2="482.0"/><line class="thin" x1="350.0" y1="206.0" x2="350.0" y2="482.0"/><rect class="deep" x="24.0" y="498.0" width="18.0" height="14.0" rx="2"/><text class="small" x="50.0" y="510.0">진한 칸 = 어떤 경우에도 변하지 않는 것 (시험 단골 함정)</text>
</svg>
