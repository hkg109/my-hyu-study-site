  <rect class="focal" x="616" y="260" width="100" height="54" rx="5"/>
  <text class="small inverse" x="666" y="292" text-anchor="middle">제공자</text>
  <text class="label" x="88" y="345">Runtime · Dev tools</text>
  <text class="sub" x="88" y="364">런타임·개발 도구</text>
  <rect class="zone" x="292" y="322" width="100" height="54" rx="5"/>
  <text class="small" x="342" y="354" text-anchor="middle">우리 회사</text>
  <rect class="zone" x="400" y="322" width="100" height="54" rx="5"/>
  <text class="small" x="450" y="354" text-anchor="middle">우리 회사</text>
