<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 910" role="img" aria-labelledby="mis-06-cloud-models-title mis-06-cloud-models-desc">
  <title id="mis-06-cloud-models-title">클라우드 서비스 모델과 배치 모델</title>
  <desc id="mis-06-cloud-models-desc">자체 보유, IaaS, PaaS, SaaS에서 제공자와 사용자 기업이 관리하는 범위, 퍼블릭·프라이빗·하이브리드 클라우드, 클라우드의 다섯 특징, 그리고 이를 떠받치는 가상화</desc>
  <defs><marker id="mis-06-cloud-models-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#mis-06-cloud-models-arrow)}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.tag{font:600 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.title{font:700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle,.sub{font:400 13px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.subtitle{font-size:14px}.name{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.label{font:500 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 12px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#65645e}.inverse{fill:#f7f6f2}</style>
  <rect class="bg" width="1280" height="910"/>
  <text class="tag" x="64" y="52">5장 · 개념도</text>
  <text class="title" x="64" y="92">클라우드: 무엇을 빌리고, 어디에 두나</text>
  <text class="subtitle" x="64" y="122">서비스 모델(IaaS·PaaS·SaaS)은 “관리 범위”, 배치 모델(퍼블릭·프라이빗·하이브리드)은 “소유와 위치”의 구분이다</text>
  <line class="rule" x1="64" y1="148" x2="1216" y2="148"/>
    <rect class="node" x="64" y="176" width="664" height="430" rx="10"/>
  <text class="small" x="88" y="204">SERVICE MODELS · 누가 어디까지 관리하나</text>
  <text class="name" x="342" y="230" text-anchor="middle">자체 보유</text>
  <text class="sub" x="342" y="246" text-anchor="middle">On-premises</text>
  <text class="name" x="450" y="230" text-anchor="middle">IaaS</text>
  <text class="sub" x="450" y="246" text-anchor="middle">인프라</text>
  <text class="name" x="558" y="230" text-anchor="middle">PaaS</text>
  <text class="sub" x="558" y="246" text-anchor="middle">플랫폼</text>
  <text class="name" x="666" y="230" text-anchor="middle">SaaS</text>
  <text class="sub" x="666" y="246" text-anchor="middle">소프트웨어</text>
  <text class="label" x="88" y="283">Applications</text>
  <text class="sub" x="88" y="302">애플리케이션·데이터</text>
  <rect class="zone" x="292" y="260" width="100" height="54" rx="5"/>
  <text class="small" x="342" y="292" text-anchor="middle">우리 회사</text>
