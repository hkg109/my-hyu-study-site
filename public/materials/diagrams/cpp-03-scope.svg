<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 492" width="720" height="492" role="img" aria-labelledby="cpp-03-scope-title cpp-03-scope-desc">
  <title id="cpp-03-scope-title">이름이 보이는 범위는 바깥에서 안으로 좁아진다</title>
  <desc id="cpp-03-scope-desc">전역 변수는 파일 끝까지, 지역 변수는 함수 끝까지, 블록 변수는 중괄호 블록 끝까지 보이며, static 지역 변수는 보이는 범위는 함수 안이지만 값은 프로그램이 끝날 때까지 남는다는 포함 관계 그림</desc>
  <defs>
    <marker id="cpp-03-scope-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker>
    <marker id="cpp-03-scope-k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker>
    <marker id="cpp-03-scope-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#a8431f"/></marker>
  </defs>
  <rect width="720" height="492" fill="#f7f6f2"/>
  <text x="32" y="40" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">03 · 스코프와 저장 클래스</text>
  <text x="32" y="72" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1d1d1a">이름이 보이는 범위는 바깥에서 안으로 좁아진다</text>
  <line x1="32" y1="92" x2="688" y2="92" stroke="#b9b6ac"/>
  <rect x="32" y="112" width="656" height="308" rx="8" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.2"/><text x="44" y="132" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">전역 스코프 · 파일 끝까지  —  int count = 0;</text><rect x="56" y="148" width="608" height="252" rx="8" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.2"/><text x="68" y="168" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">함수 스코프 · 함수 끝까지  —  int countcalls() { … }</text><rect x="80" y="184" width="300" height="196" rx="8" fill="#e4e1d8" stroke="#b9b6ac" stroke-width="1.2"/><text x="92" y="204" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#65645e">블록 스코프 · } 까지</text><rect x="104" y="220" width="252" height="64" rx="6" fill="#f7f6f2"/><rect x="104" y="220" width="252" height="64" rx="6" fill="#f7f6f2" stroke="#b9b6ac" stroke-width="1.5"/><text x="230" y="247.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">int k = j * 10;</text><text x="230" y="267.5" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">블록이 끝나면 사라짐</text><rect x="104" y="300" width="252" height="60" rx="6" fill="#f7f6f2"/><rect x="104" y="300" width="252" height="60" rx="6" fill="#f0eee8" stroke="#b9b6ac" stroke-width="1.5"/><text x="230" y="325.5" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="13" font-weight="700" fill="#1d1d1a" text-anchor="middle">{ int m = j + k; }</text><text x="230" y="345.5" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e" text-anchor="middle">더 안쪽 블록</text><rect x="404" y="220" width="236" height="140" rx="6" fill="#f7f6f2"/><rect x="404" y="220" width="236" height="140" rx="6" fill="#f3e3dc" stroke="#a8431f" stroke-width="1.5"/><rect x="412" y="226" width="52" height="16" rx="2" fill="#f0eee8" stroke="#b9b6ac"/><text x="438" y="238" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#a8431f" text-anchor="middle">static</text><text x="522" y="281" font-family="'Cascadia Mono','Consolas','D2Coding','Menlo',monospace" font-size="12" font-weight="700" fill="#1d1d1a" text-anchor="middle">static int count = 0;</text><text x="522" y="301" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">보이는 곳: 함수 안</text><text x="522" y="317" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">수명: 프로그램 끝까지</text><text x="522" y="333" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#a8431f" text-anchor="middle">→ 호출마다 1, 2, 3</text>
  <line x1="32" y1="444" x2="688" y2="444" stroke="#b9b6ac"/><rect x="36" y="458" width="20" height="16" rx="3" fill="#f0eee8" stroke="#b9b6ac"/><text x="68" y="471" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">스코프(보이는 범위)</text><rect x="214.24" y="458" width="20" height="16" rx="3" fill="#f3e3dc" stroke="#a8431f"/><text x="246.24" y="471" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#65645e">수명이 다른 변수</text>
</svg>
