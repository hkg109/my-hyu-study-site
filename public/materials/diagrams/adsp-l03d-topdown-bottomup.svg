<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1080" role="img" aria-labelledby="adsp-l03d-topdown-bottomup-title adsp-l03d-topdown-bottomup-desc">
  <title id="adsp-l03d-topdown-bottomup-title">하향식 · 상향식 접근과 디자인 씽킹</title>
  <desc id="adsp-l03d-topdown-bottomup-desc">왼쪽은 하향식 접근으로 Why 관점, 최적화와 솔루션 유형, 지도 학습이며 문제 탐색, 문제 정의, 해결방안 탐색, 타당성 검토 순으로 진행한다. 오른쪽은 상향식 접근으로 What 관점, 통찰과 발견 유형, 비지도 학습이며 프로세스 분류, 프로세스 흐름 분석, 분석 요건 식별, 분석 요건 정의 순서와 프로토타이핑 접근을 보여 준다. 아래에는 디자인 씽킹이 상향식 발산 뒤 하향식 수렴을 하는 모양과 공감, 문제 정의, 아이디어 도출, 프로토타입, 테스트 다섯 단계를 그렸다.</desc>
  <defs><marker id="adsp-l03d-topdown-bottomup-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1d1d1a"/></marker><marker id="adsp-l03d-topdown-bottomup-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#65645e"/></marker></defs>
  <style>.bg{fill:#f7f6f2}.rule{stroke:#b9b6ac;stroke-width:1;fill:none}.node{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1.5}.zone{fill:#f0eee8;stroke:#b9b6ac;stroke-width:1.5}.deep{fill:#e4e1d8;stroke:#b9b6ac;stroke-width:1.5}.focal{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.5}.outside{fill:#f7f6f2;stroke:#65645e;stroke-width:1.5;stroke-dasharray:6 4}.cell{fill:#f7f6f2;stroke:#65645e;stroke-width:1.2}.cellh{fill:#e4e1d8;stroke:#65645e;stroke-width:1.2}.cellf{fill:#1d1d1a;stroke:#1d1d1a;stroke-width:1.2}.flow{stroke:#1d1d1a;stroke-width:2;fill:none;marker-end:url(#adsp-l03d-topdown-bottomup-a)}.flow.both{marker-start:url(#adsp-l03d-topdown-bottomup-a)}.dash{stroke:#65645e;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#adsp-l03d-topdown-bottomup-m)}.dash.both{marker-start:url(#adsp-l03d-topdown-bottomup-m)}.plain{marker-end:none}.line{stroke:#1d1d1a;stroke-width:2;fill:none}.org{stroke:#65645e;stroke-width:1.5;fill:none}.mask{fill:#f7f6f2;stroke:#b9b6ac;stroke-width:1}.tag{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e;letter-spacing:.02em}.title{font:700 23px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.subtitle{font:400 14.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.name{font:700 17.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.big{font:700 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.body{font:400 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.task{font:400 14px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.small{font:600 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#65645e}.lab{font:700 13.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1d1d1a}.mono{font:500 14px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.monos{font:500 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,'D2Coding',monospace;fill:#1d1d1a}.inv{fill:#f7f6f2}.b{font-weight:700}</style>
  <rect class="bg" width="560" height="1080"/>
  <text class="tag" x="24" y="40">ADsP · 2과목 1장 · 분석 과제 발굴</text><text class="title" x="24" y="74">하향식 · 상향식 접근과 디자인 씽킹</text><text class="subtitle" x="24" y="104">문제가 주어지면 하향식, 데이터에서 문제를 찾으면 상향식</text><line class="rule" x1="24" y1="130" x2="536" y2="130"/><rect class="deep" x="24" y="152" width="248" height="104" rx="6"/><text class="small" x="148" y="174" text-anchor="middle">Top-down</text><text class="name" x="148" y="198" text-anchor="middle">하향식 접근</text><text class="task" x="148" y="222" text-anchor="middle">Why · 문제가 주어짐</text><text class="task" x="148" y="244" text-anchor="middle">최적화·솔루션 · 지도 학습</text><path class="flow" d="M148 256 L148 280"/><rect class="node" x="38" y="280" width="220" height="56" rx="6"/><text class="small" x="148" y="302" text-anchor="middle">Problem Discovery</text><text class="name" x="148" y="325" text-anchor="middle">문제 탐색</text><path class="flow" d="M148 336 L148 360"/><rect class="node" x="38" y="360" width="220" height="56" rx="6"/><text class="small" x="148" y="382" text-anchor="middle">Problem Definition</text><text class="name" x="148" y="405" text-anchor="middle">문제 정의</text><path class="flow" d="M148 416 L148 440"/><rect class="node" x="38" y="440" width="220" height="56" rx="6"/><text class="small" x="148" y="462" text-anchor="middle">Solution Search</text><text class="name" x="148" y="485" text-anchor="middle">해결방안 탐색</text><path class="flow" d="M148 496 L148 520"/><rect class="node" x="38" y="520" width="220" height="56" rx="6"/><text class="small" x="148" y="542" text-anchor="middle">Feasibility Study</text><text class="name" x="148" y="565" text-anchor="middle">타당성 검토</text><rect class="deep" x="288" y="152" width="248" height="104" rx="6"/><text class="small" x="412" y="174" text-anchor="middle">Bottom-up</text><text class="name" x="412" y="198" text-anchor="middle">상향식 접근</text><text class="task" x="412" y="222" text-anchor="middle">What · 데이터에서 출발</text><text class="task" x="412" y="244" text-anchor="middle">통찰·발견 · 비지도 학습</text><path class="flow" d="M412 256 L412 280"/><rect class="node" x="302" y="280" width="220" height="56" rx="6"/><text class="small" x="412" y="302" text-anchor="middle">절차 예 1</text><text class="name" x="412" y="325" text-anchor="middle">프로세스 분류</text><path class="flow" d="M412 336 L412 360"/><rect class="node" x="302" y="360" width="220" height="56" rx="6"/><text class="small" x="412" y="382" text-anchor="middle">절차 예 2</text><text class="name" x="412" y="405" text-anchor="middle">프로세스 흐름 분석</text><path class="flow" d="M412 416 L412 440"/><rect class="node" x="302" y="440" width="220" height="56" rx="6"/><text class="small" x="412" y="462" text-anchor="middle">절차 예 3</text><text class="name" x="412" y="485" text-anchor="middle">분석 요건 식별</text><path class="flow" d="M412 496 L412 520"/><rect class="node" x="302" y="520" width="220" height="56" rx="6"/><text class="small" x="412" y="542" text-anchor="middle">절차 예 4</text><text class="name" x="412" y="565" text-anchor="middle">분석 요건 정의</text><rect class="outside" x="288" y="592" width="248" height="70" rx="6"/><text class="lab" x="412" y="618" text-anchor="middle">프로토타이핑 접근</text><text class="task" x="412" y="642" text-anchor="middle">일단 분석 → 결과 확인 → 개선 반복</text><rect class="outside" x="24" y="592" width="248" height="70" rx="6"/><text class="lab" x="148" y="618" text-anchor="middle">문제 탐색에 쓰는 틀</text><text class="task" x="148" y="642" text-anchor="middle">캔버스 5영역 · STEEP 관점</text><line class="rule" x1="24" y1="696" x2="536" y2="696"/><text class="name" x="24" y="726">디자인 씽킹 — 두 접근을 섞는다</text><polygon class="zone" points="36,832 280,756 280,908"/><polygon class="deep" points="280,756 524,832 280,908"/><text class="lab" x="196" y="828" text-anchor="middle">발산 · 상향식</text><text class="task" x="196" y="850" text-anchor="middle">옵션을 넓게 도출</text><text class="lab" x="364" y="828" text-anchor="middle">수렴 · 하향식</text><text class="task" x="364" y="850" text-anchor="middle">검증해 좁힌다</text><rect class="node" x="24" y="934" width="86" height="56" rx="6"/><text class="lab" x="67" y="967" text-anchor="middle">공감</text><path class="flow" d="M110 962 L130.5 962"/><rect class="node" x="130.5" y="934" width="86" height="56" rx="6"/><text class="lab" x="173.5" y="958" text-anchor="middle">문제</text><text class="lab" x="173.5" y="977" text-anchor="middle">정의</text><path class="flow" d="M216.5 962 L237 962"/><rect class="node" x="237" y="934" width="86" height="56" rx="6"/><text class="lab" x="280" y="958" text-anchor="middle">아이디어</text><text class="lab" x="280" y="977" text-anchor="middle">도출</text><path class="flow" d="M323 962 L343.5 962"/><rect class="node" x="343.5" y="934" width="86" height="56" rx="6"/><text class="lab" x="386.5" y="958" text-anchor="middle">프로토</text><text class="lab" x="386.5" y="977" text-anchor="middle">타입</text><path class="flow" d="M429.5 962 L450 962"/><rect class="node" x="450" y="934" width="86" height="56" rx="6"/><text class="lab" x="493" y="967" text-anchor="middle">테스트</text><path class="flow" d="M24 1024 H54"/><text class="small" x="62" y="1029">절차 순서</text><rect class="zone" x="138.32" y="1016" width="22" height="16" rx="3"/><text class="small" x="168.32" y="1029">발산 (상향식)</text><rect class="deep" x="273.26" y="1016" width="22" height="16" rx="3"/><text class="small" x="303.26" y="1029">수렴 (하향식) · 접근 머리말</text><rect class="outside" x="24" y="1042" width="22" height="16" rx="3"/><text class="small" x="54" y="1055">보충 설명</text>
